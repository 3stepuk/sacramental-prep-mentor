<script>const GUIDES=[{"name": "Becoming Catholic (RCIA)", "url": "https://3stepuk.github.io/Becoming-A-Catholic-/", "desc": "For adults becoming Catholic — the RCIA catechumenate.", "html": "<p>For unbaptised adults preparing for Baptism, Confirmation and the Eucharist</p>\n<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>Use alongside Becoming Catholic RCIA A Catechumenate Companion. Its twenty-four conversations supply the teaching. This guide helps an inquirer, catechumen, sponsor or mentor explore that teaching through practical activity and honest conversation.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the person</li><li>Do something concrete</li><li>Open the Companion</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>ONE SACRAMENTAL INITIATION</h3>\n<p>An unbaptised adult ordinarily receives Baptism, Confirmation and the Eucharist together. Baptism forgives every previous sin; sacramental Confession begins after Baptism.</p>\n<h2>How to use this guide</h2>\n<h3>THE PRINCIPLE</h3>\n<p>RCIA is a gradual apprenticeship in Christian life, lived with the parish through faith, conversion, worship, charity and the Church’s rites. Finishing activities does not establish readiness.</p>\n<h3>For each conversation</h3>\n<ol><li>Begin with the opening question. Listen to the person’s actual experience and allow uncertainty to be expressed.</li><li>Try the short activity together. Speak, draw or write as helpful; no craft work or prepared talk is required.</li><li>Open the numbered conversation in the Catechumenate Companion. Read the indicated teaching slowly.</li><li>Talk together, then clarify the main points. The concise answers support understanding; they are not a script to be recited.</li><li>Pray the printed prayer and choose one realistic action. Return to it next time without making it an attendance test.</li><li>Adapt, repeat or divide conversations. Follow the person’s growth and the periods of RCIA rather than treating this as a twenty-four-week course.</li></ol>\n<h3>ESTABLISH THE CORRECT PATHWAY</h3>\n<p>Tell the priest about any possible previous Baptism and any marriage history early. A validly baptised adult requires a different pathway. Use Appendix A of the Companion for the first pastoral check.</p>\n<p>Private sins, family difficulties and canonical questions are not for group disclosure. Arrange a confidential pastoral conversation when needed.</p>\n<h2>A small activity kit</h2>\n<p>The Companion, this guide, paper and a pen are enough for most conversations. Cards can be handwritten during the meeting.</p>\n<h3>Ordinary objects</h3>\n<p>A crucifix and a cup of water help explain signs. No object is needed if it would distract from the conversation.</p>\n<h3>A church visit</h3>\n<p>When convenient, look at the font, ambo, altar, tabernacle and images of saints. Arrange access and leave liturgical vessels and holy oils to the priest.</p>\n<h3>Real situations</h3>\n<p>The guide supplies short cases about choices, faith, work, family and parish life. Use them without requiring personal disclosures.</p>\n<h3>Prayer texts</h3>\n<p>The Apostles’ Creed and basic prayers are printed at the end. The guide includes a short prayer for every conversation.</p>\n<h3>Sunday worship</h3>\n<p>Bring one question from Mass. Where catechumens are dismissed after the Liturgy of the Word, reflect on the readings with the parish’s arrangements.</p>\n<h3>PRACTISE WITH REVERENCE</h3>\n<p>Rehearse responses and movements, not sacramental actions. Do not simulate Baptism, absolution, anointing or consecration. Catechumens participate in Sunday worship without receiving Holy Communion.</p>\n<h2>The Desire for God</h2>\n<h3>AIM</h3>\n<p>Help the inquirer identify the real questions and desires drawing them towards God.</p>\n<h3>QUICK PREP</h3>\n<p>Paper and a pen, optional. No prior religious knowledge is assumed.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What has brought you here now? What do you hope faith might help you understand?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Questions worth staying with</strong></p>\n<ol><li>Write four headings: MEANING, TRUTH, GOODNESS, HOPE. Invite the person to choose the one that matters most today.</li><li>Ask for a question under that heading. It might concern purpose, suffering, conscience or death. Do not rush to solve it.</li><li>Name a good thing they have pursued. Ask why even good things may leave us wanting more.</li><li>Read the Companion’s account of God taking the initiative. Choose one question to carry into the next conversation.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 1, especially the relationship between human longing, reason and God’s grace.</p>\n<details class=\"conv\"><summary>Open Conversation 1 &mdash; The Desire for God</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God created you for truth, goodness, love and ultimately for himself. The restlessness of the human heart can become an invitation to seek the living God.</p>\n<p>Human beings ask questions no possession, success or distraction can finally answer: Why am I here? What is good? What is love? What happens when I die? Why do I long for a happiness that does not pass away? The Catholic faith begins not with the idea that human longing is foolish, but that God has already taken the initiative. Creation itself points beyond itself, conscience calls us towards the good, and grace can stir a person to seek God even before that person has words for what is happening. Faith does not mean switching off reason. The Church welcomes honest questions and believes truth cannot finally contradict truth. The first step is therefore not pretending certainty; it is becoming willing to seek God sincerely and to follow where truth leads.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What are the deepest questions or desires that have brought you to explore the Catholic faith now?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Did God create me? Yes. You are created by God, loved by him and called to communion with him.</li><li>Can human reason know anything about God? Yes. From creation and the human person, reason can know that God exists, though revelation brings us into a deeper knowledge of him.</li><li>Is faith opposed to reason? No. Faith and reason both come from God and rightly understood assist one another.</li><li>Why do human beings remain restless? Created goods are real gifts, but they cannot fully satisfy a heart made for God.</li><li>What should an inquirer do first? Seek honestly, pray simply, listen to the Gospel, attend Mass and ask real questions.</li></ol>\n<h4>PRAYER</h4>\n<p>God, if I do not yet know how to speak to you, receive my desire for truth. Lead me out of confusion and towards the light you want to give. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Begin a simple daily prayer: &quot;God, show me the truth and give me courage to follow it.&quot; Attend Sunday Mass and notice one thing that awakens a question or desire.</p></div></details>\n<h2>The Desire for God</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What would it mean to seek truth even if the answer changed your life?”</li><li>“Is there an experience that has made belief in God seem possible or difficult?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is faith opposed to reason? No. Both come from God and assist one another. Can created goods fully satisfy us? They are real gifts, but we are made for communion with God. What is a first step? Seek honestly, pray simply, hear the Gospel and meet the Church.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>God, receive my desire for truth. Lead me out of confusion and give me courage to follow the light you give. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray each day: “God, show me the truth and give me courage to follow it.”</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Allow an inquirer to begin with questions rather than a confident profession. Listen for sincere seeking. The aim is a real conversation about God, not an account polished to please the parish.</p>\n<h2>Jesus Christ and the Good News</h2>\n<h3>AIM</h3>\n<p>Place the person of Jesus and his saving work at the centre of enquiry.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix, optional; the Companion.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Who do you understand Jesus to be? What has formed that understanding?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What would change if this is true</strong></p>\n<ol><li>Write TEACHER, SON OF GOD, SAVIOUR, RISEN LORD. Ask which descriptions the person already accepts and which raise questions.</li><li>Use Conversation 2 to explain that the eternal Son truly became man and gave himself for our salvation.</li>\n<details class=\"conv\"><summary>Open Conversation 2 &mdash; Jesus Christ and the Good News</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Christianity begins with Jesus Christ: the eternal Son of God who became man, proclaimed the Kingdom, died for our sins, rose bodily from the dead and calls us to follow him.</p>\n<p>The Gospel is not first a moral system or a religious technique. It is good news about what God has done in Jesus Christ. God has entered human history, taken our nature, shared our suffering and opened the way from sin and death to eternal life. Jesus teaches with divine authority, forgives sins, heals, gathers disciples and reveals the Father. His Cross is not an accidental defeat: he freely gives himself for us. His Resurrection is not merely a symbol that his ideas lived on; the crucified Jesus is truly raised and becomes the source of new life. To become Christian is to become his disciple. That means trusting him, learning his teaching, receiving his grace and allowing every part of life to be brought under his lordship.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Who do you presently understand Jesus to be, and what would change if he truly is Lord and risen from the dead?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who is Jesus Christ? The eternal Son of God who became truly man without ceasing to be truly God.</li><li>Why did he become man? For our salvation: to reveal the Father, free us from sin and make us sharers in divine life.</li><li>What did the Cross accomplish? Christ freely offered himself for our sins and reconciled humanity to the Father.</li><li>Did Jesus truly rise? Yes. His Resurrection is a real event and the foundation of Christian faith and hope.</li><li>What does Jesus ask of us? Faith, conversion, love, obedience and lifelong discipleship.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus Christ, Son of the living God, reveal yourself to me. Give me faith to know you, love you and follow you wherever you lead. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read one Gospel chapter slowly each day this week, beginning with Mark 1. Ask: What does this show me about Jesus?</p></div></details><li>Ask what would change if the Resurrection were a real event rather than the survival of Jesus’ ideas.</li><li>Choose one consequence for life: trust, prayer, repentance, hope or obedience. Ask why it follows from who Jesus is.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 2. Keep Jesus’ identity, Cross, bodily Resurrection and invitation to discipleship together.</p>\n<h2>Jesus Christ and the Good News</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What makes the Gospel good news rather than only a demand?”</li><li>“What would trusting Jesus ask of you?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is Jesus? The eternal Son of God made man. Did he truly rise? Yes. His Resurrection is real and bodily. What does he ask? Faith, conversion, love and lifelong discipleship.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus Christ, Son of the living God, reveal yourself to me. Give me faith to know you, love you and follow you. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Reread Conversation 2 and bring one honest question about Jesus to your next meeting.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Keep Christ at the centre even when questions concern Church customs or difficult teachings. Do not treat Jesus as merely an admirable moral example. Invite trust while leaving room for genuine enquiry.</p>\n<h2>Faith Conversion and Discipleship</h2>\n<h3>AIM</h3>\n<p>Connect belief in Christ with a free response and a developing change of life.</p>\n<h3>QUICK PREP</h3>\n<p>Paper marked BELIEVE, TRUST, FOLLOW.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Can a person agree that something is true without living by it?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>From agreement to discipleship</strong></p>\n<ol><li>Use this case: someone believes honesty matters but continues a dishonest practice because it is profitable. What is still missing?</li><li>Under BELIEVE, name receiving what God reveals. Under TRUST, name entrusting oneself to him. Under FOLLOW, name a change of action.</li><li>Read how grace comes first and enables the response. Conversion is not self-improvement achieved without God.</li><li>Privately identify one possible next step. The person may share the step without sharing sensitive details.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 3, especially grace, freedom and the real beginnings of conversion.</p>\n<details class=\"conv\"><summary>Open Conversation 3 &mdash; Faith, Conversion and Discipleship</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Faith is a free response to God who reveals himself. Conversion turns the whole person towards God, and discipleship means learning to live with Jesus as Lord.</p>\n<p>Christian faith includes believing truths God has revealed, but it is more than agreeing with statements. It is personal trust in God and the decision to entrust oneself to him. Because God gives grace first, even our response is supported by his help. Conversion means turning away from sin and towards God. It is both a decisive beginning and a lifelong pattern. You do not need to be morally perfect before becoming a catechumen, but there should be a real desire to leave what is incompatible with following Christ. Discipleship becomes visible in prayer, worship, honesty, chastity, mercy, forgiveness, justice and love. The Church does not ask you to manufacture a polished testimony; she looks for a real beginning of faith and conversion that can grow.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Is there any area of life where following Christ already seems to be asking you to change direction?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is faith? A grace-enabled response by which we believe God and entrust ourselves to him.</li><li>What is conversion? Turning from sin and falsehood towards God in faith, repentance and a changed life.</li><li>Must faith be free? Yes. No one may be forced to embrace the Christian faith.</li><li>Does becoming Christian require perfection first? No. It requires a real beginning of faith, repentance and willingness to grow.</li><li>What is discipleship? Learning from Jesus and allowing his truth and grace to shape the whole of life.</li></ol>\n<h4>PRAYER</h4>\n<p>Father, give me the grace of sincere conversion. Show me what I must leave behind and what I must begin, and keep me close to your Son. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one concrete act of conversion: repair an injustice, end a dishonest practice, forgive, begin daily prayer, or seek help for a pattern that keeps you from living truthfully.</p></div></details>\n<h2>Faith Conversion and Discipleship</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is perfection not required before beginning the catechumenate?”</li><li>“What distinguishes a sincere beginning from merely saying the expected words?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is faith? A grace-enabled response of belief and trust in God. What is conversion? Turning from sin towards God in a changed life. Must faith be free? Yes. No one may be forced to embrace it.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, give me sincere conversion. Show me what I must leave behind and what I must begin, and keep me close to your Son. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one practical act of conversion and ask God’s help to carry it out.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Ask about willingness to grow without demanding a public account of private sins. Support concrete change. Refer complex moral, relational or pastoral matters to the priest in a confidential setting.</p>\n<h2>Why the Church Why Baptism</h2>\n<h3>AIM</h3>\n<p>Explain visible Church belonging, sacramental new birth and the meaning of Acceptance.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: ENQUIRY, ACCEPTANCE, BAPTISM.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Why might following Christ involve belonging to his Church rather than remaining on one’s own?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Belonging and beginning</strong></p>\n<ol><li>Place ENQUIRY first: questions, first faith, prayer and contact with the community.</li><li>Add ACCEPTANCE: the Church receives the intention to follow Christ and enrols the person among catechumens. This is not Baptism.</li><li>Add BAPTISM: new birth in Christ, forgiveness and incorporation into the Church. Read the Companion’s explanation.</li><li>Ask what support a person needs between Acceptance and Baptism. Include worship, teaching, conversion, charity and a sponsor.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 4 and Appendix B on Acceptance. The priest discerns when the first step is appropriate.</p>\n<details class=\"conv\"><summary>Open Conversation 4 &mdash; Why the Church? Why Baptism?</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Jesus does not call isolated believers only. He gathers a people, the Church, and commands his disciples to make disciples of all nations by Baptism and teaching.</p>\n<p>Christ founded the Church as a visible communion of faith, sacraments and apostolic ministry. The Church is not holy because every member behaves perfectly; she is holy because Christ is her head, the Holy Spirit dwells in her and she is entrusted with the means of grace. Baptism is not a membership ceremony added after faith. It is the sacrament of new birth by water and the Holy Spirit, the gateway to the other sacraments and incorporation into Christ and his Church. The Church has baptised from apostolic times in obedience to Christ. The Rite of Acceptance is not Baptism. It marks a public beginning: after a sufficient first evangelisation and initial conversion, the Church accepts an inquirer as a catechumen and undertakes to accompany that person more deeply towards initiation.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What attracts you to belonging to the Church, and what about belonging to a visible Church is difficult for you?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Did Jesus intend a Church? Yes. He gathered disciples, chose apostles and entrusted them with teaching, sanctifying and shepherding his people.</li><li>What is Baptism? The sacrament of new birth by water and the word, which frees from sin and incorporates us into Christ and the Church.</li><li>Can an unbaptised person receive the other sacraments first? No. Baptism is the gateway to sacramental life.</li><li>What is the Rite of Acceptance? The liturgical step by which an inquirer with the beginnings of faith and conversion is accepted into the Order of Catechumens.</li><li>Does Acceptance guarantee Baptism at the next Easter? No. The catechumenate continues as long as genuine growth and readiness require.</li></ol>\n<h4>PRAYER</h4>\n<p>Jesus, you gather your people into one flock. If you are calling me into your Church, give me humility, perseverance and joy as I take the next step. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Talk with the priest or mentor about whether you are ready for the Rite of Acceptance. Name one hope and one hesitation honestly.</p></div></details>\n<h2>Why the Church Why Baptism</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What attracts you to visible Church belonging, and what feels difficult?”</li><li>“What do you need to understand before asking for Acceptance?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Did Christ intend a Church? Yes. He entrusted his people to apostolic teaching and care. Is Acceptance Baptism? No. It begins the formal catechumenate. Does Acceptance fix the Baptism date? No. Growth and readiness determine progress.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, you gather your people into one flock. Give me humility, perseverance and joy as I discern the next step. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With the priest or mentor, name one hope and one hesitation about entering the catechumenate.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Check initial faith and conversion before arranging Acceptance. Never imply that joining the catechumenate automatically promises initiation at the next Easter Vigil. Recognise the real belonging of catechumens while explaining that Baptism is still to come.</p>\n<h2>Scripture Tradition and the Magisterium</h2>\n<h3>AIM</h3>\n<p>Show how the apostolic faith is received, handed on and faithfully interpreted.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: SCRIPTURE, TRADITION, MAGISTERIUM.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “When Christians disagree about a biblical passage, how might truth and unity be preserved?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Who receives and explains the message</strong></p>\n<ol><li>Use this case: two readers take the same passage to support opposite beliefs. Sincerity alone does not resolve the disagreement.</li><li>Place SCRIPTURE: the inspired written word of God. Add TRADITION: the living transmission of the apostolic faith.</li><li>Add MAGISTERIUM: the Pope and bishops in communion with him faithfully guard and interpret the deposit of faith.</li><li>Ask whether these are competing authorities. Read the Companion’s explanation that the teaching office serves God’s word.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 5. Distinguish Apostolic Tradition from ordinary customs and private opinions.</p>\n<details class=\"conv\"><summary>Open Conversation 5 &mdash; Scripture, Tradition and the Magisterium</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God&#x27;s one revelation is handed on in Sacred Scripture and Apostolic Tradition. The Magisterium serves that revelation by authentically interpreting the apostolic faith.</p>\n<p>The Bible is inspired by the Holy Spirit and truly teaches what God wills to reveal for our salvation. Catholics therefore read Scripture constantly in the liturgy, catechesis, prayer and theology. Apostolic Tradition is not a collection of later human customs placed above the Bible. It is the living transmission of the faith Christ entrusted to the apostles. Scripture itself was written, received and recognised within this apostolic life of the Church. The Pope and bishops in communion with him exercise the Church&#x27;s Magisterium. They do not invent a new revelation. Their task is to guard, explain and authentically interpret the deposit of faith so that the Church can remain one in the truth received from Christ.</p>\n<h4>TALK ABOUT IT</h4>\n<p>When sincere Christians interpret the same biblical text differently, what kind of authority would be needed to preserve unity in truth?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Is the Bible inspired? Yes. God is its principal author, working through human authors.</li><li>What is Apostolic Tradition? The living transmission of the apostolic faith in the Church.</li><li>Are Scripture and Tradition competing sources? No. They are inseparably related ways in which the one revelation is handed on.</li><li>What is the Magisterium? The teaching office of the Pope and bishops in communion with him.</li><li>Is the Magisterium above God&#x27;s Word? No. It serves the Word by faithfully guarding and interpreting it.</li></ol>\n<h4>PRAYER</h4>\n<p>Holy Spirit, who inspired the Scriptures and guides the Church, make me docile to your Word and protect me from pride, fear and confusion. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Acts 2:42, 2 Thessalonians 2:15 and 1 Timothy 3:15. Bring one question about Scripture, Tradition or authority to the next conversation.</p></div></details>\n<h2>Scripture Tradition and the Magisterium</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does a received faith need faithful interpretation?”</li><li>“What question about Catholic authority would you most like explained?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is Scripture inspired? Yes. God works through its human authors. What is Apostolic Tradition? The living transmission of the apostolic faith. Is the Magisterium above God’s word? No. It serves, guards and interprets it.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, make me attentive to God’s word. Give me humility to receive the faith and courage to ask honest questions. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Bring one actual question about Scripture, Tradition or Church authority to the next conversation.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not reduce Tradition to customs or suggest the Church invents new revelation. Explain the reasons for Catholic authority patiently. The Companion supplies the doctrinal answer; the activity simply makes the question concrete.</p>\n<h2>One God Father Son and Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Give a clear, orthodox understanding of the Trinity and Trinitarian prayer.</p>\n<h3>QUICK PREP</h3>\n<p>Three name cards: FATHER, SON, HOLY SPIRIT.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Make the Sign of the Cross. Ask: “What does this brief prayer profess about God?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One divine nature and three Persons</strong></p>\n<ol><li>Place the three cards beside one another. Ask whether each Person is truly God.</li><li>Write ONE GOD above them. Read that each Person wholly possesses the one divine nature.</li><li>Ask whether the Persons are simply three roles or names for one Person. Clarify that they are really distinct.</li><li>Pray the Glory Be slowly. Notice that Christian prayer leads to the Father through the Son in the Holy Spirit.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 6. Use its precise language rather than an analogy that changes the doctrine.</p>\n<details class=\"conv\"><summary>Open Conversation 6 &mdash; One God: Father, Son and Holy Spirit</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>There is one God in three divine Persons: Father, Son and Holy Spirit. The Trinity is not three gods but the one divine nature eternally possessed by three distinct Persons.</p>\n<p>God is not one being among many. He is the creator and source of all that exists, eternal, all-holy, all-knowing, just and merciful. Yet the deepest mystery of his life is revealed by Christ: the one God is Father, Son and Holy Spirit. The Father is God, the Son is God and the Holy Spirit is God; yet there are not three Gods. The Persons are really distinct by their relations to one another, while each is wholly the one divine God. Christian prayer is therefore Trinitarian. We are brought to the Father, through the Son, in the Holy Spirit. The Sign of the Cross is a compact profession of the faith into which you are preparing to be baptised.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What difference does it make to think of God not as lonely power but as eternal communion of Father, Son and Holy Spirit?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>How many gods are there? One God.</li><li>How many divine Persons are there? Three: Father, Son and Holy Spirit.</li><li>Is each Person fully God? Yes. Each Person is wholly and eternally the one God.</li><li>Are the Persons simply three names for one Person? No. The Father, Son and Holy Spirit are really distinct Persons.</li><li>Into whose name are Christians baptised? The one name of the Father, and of the Son, and of the Holy Spirit.</li></ol>\n<h4>PRAYER</h4>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now and ever shall be, world without end. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Make the Sign of the Cross slowly morning and evening. Learn the Apostles&#x27; Creed if you do not already know it.</p></div></details>\n<h2>One God Father Son and Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Which confusion is easier to fall into: three gods or one Person under three names?”</li><li>“How does the Sign of the Cross prepare you for the faith of Baptism?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How many Gods are there? One. How many divine Persons? Three: Father, Son and Holy Spirit. Is each Person fully God? Yes. Each is wholly and eternally God.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make the Sign of the Cross slowly each morning and evening.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>The cards identify the Persons; they do not model God’s being. Avoid illustrations implying three parts of God, three gods or successive disguises. Mystery calls for humility while allowing clear statements about what the Church believes.</p>\n<h2>Creation Human Dignity and the Fall</h2>\n<h3>AIM</h3>\n<p>Hold together the goodness of creation, human dignity and the need for redemption.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings on paper: GIFT, WOUND, HOPE.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Where do you see both human goodness and something deeply wrong in human life?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Goodness that needs healing</strong></p>\n<ol><li>Under GIFT, name reason, freedom, love and the dignity of every person made in God’s image.</li><li>Under WOUND, consider this case: someone knows an action is harmful but repeatedly chooses it. What does it reveal about fallen human life?</li><li>Read the distinction between original sin and personal sin. A newborn has not personally chosen an offence.</li><li>Under HOPE, name God’s promise of salvation fulfilled in Jesus, the new Adam. Ask why wounded nature is still worth respecting.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 7. Creation is good; human nature is wounded, not destroyed.</p>\n<details class=\"conv\"><summary>Open Conversation 7 &mdash; Creation, Human Dignity and the Fall</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God freely created all things good. Human beings are made in his image for communion with him, but the human family is wounded by original sin and needs redemption.</p>\n<p>Creation is not divine and God is not part of the universe. Everything that exists depends upon him. Human beings possess a unique dignity because they are made in the image of God, capable of reason, freedom, love and communion with him. Human freedom is a gift, but from the beginning humanity misused freedom. Original sin is not a personal act committed by each newborn child. It is the fallen condition into which humanity is born: deprived of original holiness and wounded in nature. The effects of the fall include suffering, death, disordered desires and a tendency towards sin, but human nature is not destroyed. God immediately begins the work of salvation, fulfilled in Christ, the new Adam.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Where do you see both the goodness of human nature and the reality that something in human life is deeply wounded?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who created the world? God freely created all things from nothing and sustains them in being.</li><li>What gives every human person dignity? Every person is made in the image and likeness of God.</li><li>What is original sin? The fallen condition inherited by humanity, involving loss of original holiness and a wounded human nature.</li><li>Is original sin a baby&#x27;s personal wrongdoing? No.</li><li>Did God abandon humanity after the fall? No. He promised salvation and prepared humanity for Christ.</li></ol>\n<h4>PRAYER</h4>\n<p>Creator and Father, teach me to receive creation with gratitude, to respect every human person and to recognise my need for the salvation you give in Christ. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Genesis 1:26-31 and Romans 5:12-21. Notice how Scripture holds together human dignity, sin and hope.</p></div></details>\n<h2>Creation Human Dignity and the Fall</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does dignity remain even when a person is weak, dependent or sinful?”</li><li>“Why do we need God’s salvation as well as human effort?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who created all things? God, freely and from nothing. Why has every person dignity? Every person is made in God’s image. Is original sin a baby’s personal act? No. It is an inherited fallen condition.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Creator and Father, teach me gratitude, respect for every person and honesty about my need for salvation in Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Show deliberate respect or practical kindness to someone who is easily overlooked.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Explain original sin without personal blame or the claim that human nature is wholly evil. Keep discussion of creation focused on the theological truths of dependence on God, goodness and dignity; take further scientific or philosophical questions seriously.</p>\n<h2>The Word Became Flesh</h2>\n<h3>AIM</h3>\n<p>Clarify the Incarnation and why Jesus is true God and true man.</p>\n<h3>QUICK PREP</h3>\n<p>Paper marked PERSON and NATURES.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would be missing if Jesus were only a wise teacher, or only appeared to be human?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Who Jesus is</strong></p>\n<ol><li>Write “One divine Person” under PERSON: the eternal Son.</li><li>Write “Divine and human” under NATURES. Jesus is fully God and fully human, with a real human body, mind and will.</li><li>Consider two mistaken statements: “Jesus is half God and half man”; “Jesus began as a man and later became God”. Use Conversation 8 to correct both.</li>\n<details class=\"conv\"><summary>Open Conversation 8 &mdash; The Word Became Flesh</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Jesus Christ is one divine Person, the eternal Son, with two complete natures, divine and human. He became truly man for our salvation without ceasing to be truly God.</p>\n<p>At the Annunciation the eternal Son took human nature from the Virgin Mary by the power of the Holy Spirit. This is the Incarnation. Jesus is not half God and half man, nor a human person later adopted by God. Because he is truly human, Jesus has a human body, mind, will and emotions; he can suffer and die. Because he is truly divine, the one who acts and suffers in his humanity is the eternal Son of God. This is why his saving work has unique and universal power. Mary is rightly called Mother of God because the child she bore is a divine Person. Catholic devotion to Mary protects the truth about Christ: everything the Church honours in her comes from God&#x27;s grace and leads back to her Son.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Why does Christian salvation require Jesus to be truly God and truly human, rather than only a great teacher or prophet?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who is Jesus Christ? The eternal Son of God made man.</li><li>How many Persons are in Christ? One divine Person, the Son.</li><li>How many natures does Christ have? Two: fully divine and fully human.</li><li>Did the Incarnation mean the Son stopped being God? No. He assumed human nature without ceasing to be divine.</li><li>Why is Mary called Mother of God? Because the one she conceived and bore according to his humanity is truly the eternal Son of God.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus Christ, true God and true man, draw me close to the mystery of your Incarnation and teach me to receive your Mother with the reverence your grace has given her. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Luke 1:26-38 and John 1:1-18. Write one sentence about what each passage teaches concerning Jesus.</p></div></details><li>Ask why Mary is called Mother of God. She bore the divine Son according to his humanity; she is not the source of his divinity.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 8. Connect precise teaching about Christ with his saving work.</p>\n<h2>The Word Became Flesh</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does salvation involve the Son truly sharing our humanity?”</li><li>“How does honouring Mary protect the truth about her Son?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How many Persons are in Christ? One divine Person, the Son. How many natures? Two, fully divine and fully human. Did the Son cease to be God? No. He truly assumed our humanity.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus Christ, true God and true man, draw me close to you. Help me receive the salvation you bring and honour your Mother. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Explain the Incarnation in one sentence, then reread Conversation 8 to check it.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Let theological terms clarify rather than dominate the conversation. The person should be able to say who Jesus is in ordinary words. Avoid explanations that divide him into two persons or deny his true humanity.</p>\n<h2>The Paschal Mystery</h2>\n<h3>AIM</h3>\n<p>Connect Christ’s Cross, bodily Resurrection and Ascension with Christian hope.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix, optional; three cards: CROSS, RESURRECTION, ASCENSION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which part of Jesus’ saving work is hardest for you to understand or receive?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One saving mystery</strong></p>\n<ol><li>Place CROSS first. Name his free self-offering for our sins, reconciling us to the Father.</li><li>Add RESURRECTION. Ask why hope would change if Jesus had remained dead. He truly rose in a glorified body.</li><li>Add ASCENSION. Explain that the risen Lord reigns, intercedes and sends the Holy Spirit; he has not abandoned us.</li><li>Ask how Baptism will join the person to Christ’s death and Resurrection. Let the Companion make the connection explicit.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 9 and the central teaching of Conversation 14 on dying and rising with Christ.</p>\n<details class=\"conv\"><summary>Open Conversation 9 &mdash; The Paschal Mystery</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>By his Passion, death, Resurrection and Ascension, Jesus Christ conquers sin and death, reconciles us to the Father and opens the way to eternal life.</p>\n<p>Sin creates a rupture humanity cannot heal by its own power. The Son freely offers himself in loving obedience to the Father and solidarity with sinners. His Cross is sacrifice, atonement, victory and the supreme revelation of divine love. Jesus truly died and was buried. On the third day he truly rose in his glorified body. The Resurrection vindicates his identity, confirms his teaching and is the beginning of the new creation. Christian hope is therefore more than surviving in memory: it is bodily resurrection and life with God. The Ascension does not mean Jesus abandons us. The risen Lord enters heavenly glory, intercedes for us, sends the Holy Spirit and remains present in his Church, especially in the sacraments.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which part of the Paschal Mystery - Cross, Resurrection or Ascension - is hardest for you to understand or receive, and why?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Why did Christ die? He freely offered himself for our sins, reconciling us to the Father and defeating the powers of sin and death.</li><li>Did Jesus really die? Yes.</li><li>Did he truly rise bodily? Yes. The same Jesus who was crucified rose in a glorified body.</li><li>What does the Resurrection give us? The foundation of faith, forgiveness, new life and hope of our own resurrection.</li><li>What is the Ascension? Christ&#x27;s entry in his humanity into heavenly glory, from where he reigns and intercedes for us.</li></ol>\n<h4>PRAYER</h4>\n<p>Jesus crucified and risen, have mercy on me. Unite my life to your Cross, raise me from sin and lead me towards the life that cannot die. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Pray before a crucifix this week. Read Romans 6:3-11 and notice how St Paul connects Baptism directly with Christ&#x27;s death and Resurrection.</p></div></details>\n<h2>The Paschal Mystery</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is the Cross more than an example of courage?”</li><li>“What kind of hope does bodily resurrection give?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why did Christ die? He freely offered himself for our sins. Did he rise bodily? Yes. The crucified Jesus truly rose. What is the Ascension? His entry in his humanity into heavenly glory.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus crucified and risen, have mercy on me. Unite my life to your Cross, free me from sin and lead me to eternal life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Spend a few quiet minutes before a crucifix and ask Jesus to deepen your hope.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not reduce salvation to admiration of Jesus’ example or the Resurrection to a metaphor. Allow grief and suffering to be named without requiring a personal testimony. Christian hope takes both death and Christ’s victory seriously.</p>\n<h2>The Holy Spirit Grace and Justification</h2>\n<h3>AIM</h3>\n<p>Explain grace as God’s free gift of forgiveness and genuine interior renewal.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: GIFT, RESPONSE, FRUIT.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “When you hear grace, do you imagine pardon only, or God also changing a person?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>God acts and we respond</strong></p>\n<ol><li>Place GIFT first. Explain that the Holy Spirit awakens faith and that initial grace cannot be earned.</li><li>Add RESPONSE. Use this case: a person receives help to end dishonesty and freely accepts it. The help enables rather than removes responsibility.</li><li>Add FRUIT: truthfulness, patience, charity and good works made possible by grace.</li><li>Read the Companion’s account of justification as forgiveness and interior renewal. Ask why this is neither self-salvation nor doing nothing.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 10. Distinguish sanctifying grace from the actual help God gives in particular moments.</p>\n<details class=\"conv\"><summary>Open Conversation 10 &mdash; The Holy Spirit, Grace and Justification</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Holy Spirit is the third divine Person. By grace God heals, sanctifies and adopts us, making us capable of faith, hope, charity and a life that truly pleases him.</p>\n<p>Grace is not simply God overlooking sin from a distance. Sanctifying grace is a real participation in divine life, freely given through Christ. God acts first, awakens faith and enables our free response. Justification includes forgiveness of sins and interior renewal. We cannot earn the initial gift of grace. Yet grace does not abolish freedom: God enables us to cooperate, grow in holiness and perform good works that are themselves fruits of his grace. The Holy Spirit dwells in the baptised, gives theological virtues and gifts, forms the fruits of holiness and equips Christians with charisms for service. Christian life is therefore neither self-salvation nor passivity, but grace-enabled communion and cooperation.</p>\n<h4>TALK ABOUT IT</h4>\n<p>When you hear the word &quot;grace&quot;, do you imagine only pardon, or also God actually changing and sharing his life with a person?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who is the Holy Spirit? The third Person of the Holy Trinity, true God with the Father and the Son.</li><li>What is sanctifying grace? A stable gift by which we share in God&#x27;s own life and are made holy and pleasing to him.</li><li>Can we earn the first grace of conversion? No. God&#x27;s grace precedes and enables our response.</li><li>Does justification only declare us forgiven? It includes forgiveness and real interior renewal by grace.</li><li>Do good works matter? Yes. Works done in grace are a genuine response of love and obedience, themselves made possible by God&#x27;s grace.</li></ol>\n<h4>PRAYER</h4>\n<p>Holy Spirit, Lord and giver of life, prepare my heart for Baptism. Create in me faith, hope and charity, and teach me to cooperate freely with your grace. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At the end of each day, thank God for one grace you noticed and ask for help in one area where you need to change.</p></div></details>\n<h2>The Holy Spirit Grace and Justification</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What does it mean to cooperate with a gift?”</li><li>“How could you recognise grace at work without pretending to measure holiness?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is the Holy Spirit? The third divine Person, true God. What is sanctifying grace? A stable participation in God’s life. Can we earn the first grace of conversion? No. God acts first and enables our response.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, Lord and giver of life, prepare my heart for Baptism. Give me faith, hope and charity and help me cooperate with your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each evening thank God for one help received and ask his grace for one next step.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Keep the order clear: God’s gift precedes the response. Good works are fruits of grace, not a price paid to purchase initial justification. Do not speak as though grace merely covers sin while leaving the person unchanged.</p>\n<h2>The Church Christ Founded</h2>\n<h3>AIM</h3>\n<p>Explore the Church’s spiritual and visible life, apostolic authority and holiness.</p>\n<h3>QUICK PREP</h3>\n<p>Four cards: ONE, HOLY, CATHOLIC, APOSTOLIC.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which is harder to understand: the Church as Christ’s Body or the Church’s visible authority?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The four marks in real life</strong></p>\n<ol><li>Read the four marks in Conversation 11. Give a brief meaning for each: unity, Christ’s holiness, universality and apostolic foundation.</li>\n<details class=\"conv\"><summary>Open Conversation 11 &mdash; The Church Christ Founded</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Church is the People of God, Body of Christ and Temple of the Holy Spirit. Christ founded one Church that is one, holy, catholic and apostolic and subsists in the Catholic Church.</p>\n<p>The Church is both spiritual and visible. She is not merely the invisible collection of sincere believers, nor merely an institution. Christ joins his people through the profession of faith, sacramental life and apostolic governance. The apostles received a real mission from Christ. The bishops succeed them in their pastoral office, and the Bishop of Rome, successor of St Peter, serves the unity of the whole Church. Papal authority is not a claim that every papal opinion is inspired; infallibility has precise conditions and serves the preservation of revealed truth. The Church is holy despite the sins of her members. Those sins are real and sometimes grave; they call for repentance, justice and reform. Yet Christ does not abandon his Bride or withdraw the gifts of truth and grace entrusted to her.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What is easier for you to believe about the Church - her spiritual mystery or her visible authority - and which is harder?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is the Church? The people gathered by the Father, united to Christ as his Body and made a temple of the Holy Spirit.</li><li>What are the four marks of the Church? One, holy, catholic and apostolic.</li><li>Who are bishops? Successors of the apostles who teach, sanctify and shepherd the Church in communion with one another and the Pope.</li><li>What is the role of the Pope? As Bishop of Rome and successor of St Peter, he has a unique ministry of unity and universal pastoral authority.</li><li>Does the sin of Catholics make the Church cease to be holy? No. Her holiness comes from Christ and his gifts, while her members always need conversion and reform.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus, you loved the Church and gave yourself for her. Heal what is sinful, strengthen what is weak, and teach me to love your Church in truth rather than illusion. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Learn the names of the Pope, your diocesan bishop and your parish priest. Pray for each of them once this week.</p></div></details><li>Use this case: a Catholic leader behaves badly. Ask whether acknowledging the sin means denying Christ’s gifts to the Church.</li><li>Name the roles of bishops as successors of the Apostles and the Pope as successor of Peter.</li><li>Ask how truth, repentance, justice and reform can belong together within love for the Church.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 11. The Church is spiritual and visible, and her members need continuing conversion.</p>\n<h2>The Church Christ Founded</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How can we avoid both excusing sin and forgetting Christ’s promises?”</li><li>“What question about papal or episcopal authority needs more explanation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What are the four marks? One, holy, catholic and apostolic. Who are bishops? Successors of the Apostles in communion with the Pope. Why is the Church holy? Because of Christ and his gifts, despite her members’ sins.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, heal what is sinful and strengthen what is weak in your Church. Teach me to love her truthfully and faithfully. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask for the names of the Pope, diocesan bishop and parish priest, and pray for them.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not minimise wrongdoing or suggest every papal opinion is infallible. If a person’s experience involves harm, listen carefully and follow the appropriate safeguarding process. Questions about authority deserve patient explanation.</p>\n<h2>Mary the Saints and the Last Things</h2>\n<h3>AIM</h3>\n<p>Clarify worship, intercession and Christian hope beyond death.</p>\n<h3>QUICK PREP</h3>\n<p>Paper for two headings: ADORATION, INTERCESSION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which teaching raises your strongest question: Mary, saints, purgatory, judgement or prayer for the dead?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Communion that death does not destroy</strong></p>\n<ol><li>Under ADORATION write “God alone”. Under INTERCESSION write “asking someone to pray”. Ask how this distinction helps explain Catholic devotion.</li><li>Read the Companion on Mary’s grace and her relationship to Christ. Honour given to her leads to her Son.</li><li>Consider asking a fellow Christian for prayer. The communion of saints includes those alive with Christ in heaven.</li><li>Read the definitions of heaven, hell and purgatory. Explain that purgatory purifies those already in God’s grace; it is not another chance to reject or accept God after death.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 12. If several questions arise, divide this into more than one meeting.</p>\n<details class=\"conv\"><summary>Open Conversation 12 &mdash; Mary, the Saints and the Last Things</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>All who belong to Christ form one communion. Catholics worship God alone, honour Mary and the saints as God&#x27;s friends, ask their intercession, pray for the dead and hope for resurrection and eternal life.</p>\n<p>Mary is honoured because of Christ. By a unique grace she was preserved from original sin from the first moment of her conception; she freely consented to become Mother of God, remained faithful to Christ and was assumed body and soul into heavenly glory. Asking a saint to pray for us does not replace Christ&#x27;s unique mediation. Christians on earth ask one another for prayer; death does not destroy the communion of those who are alive in Christ. Images and relics are honoured relatively, not adored as gods. At death each person comes before God. Heaven is perfect communion with the Trinity. Hell is the definitive self-exclusion from communion with God. Purgatory is the final purification of those who die in God&#x27;s grace but still need purification. Christians await the resurrection of the body and the final judgement.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which Catholic teaching here - Mary, saints, prayer for the dead, purgatory or the last judgement - raises the strongest question for you?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Do Catholics worship Mary or the saints? No. Adoration belongs to God alone.</li><li>Why ask saints to pray for us? Because all who live in Christ remain united in the communion of saints and can intercede for one another.</li><li>What is purgatory? The final purification of those who die in God&#x27;s grace and friendship but are not yet perfectly purified.</li><li>Why pray for the dead? Because the Church entrusts the dead to God&#x27;s mercy and prays for their purification and eternal rest.</li><li>What do Christians finally hope for? The resurrection of the body, the final judgement and eternal life with God.</li></ol>\n<h4>PRAYER</h4>\n<p>Mary, Mother of God, pray for me. Saints of God, pray that I may persevere in Christ. Lord, remember the faithful departed and bring them to the fullness of your light. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Visit the church outside Mass if possible. Identify an image or statue of Mary or a saint and ask what that person&#x27;s life teaches about following Christ.</p></div></details>\n<h2>Mary the Saints and the Last Things</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How does asking a saint for prayer differ from worshipping that saint?”</li><li>“What does hope in resurrection add to an idea of merely surviving in memory?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Do Catholics worship saints? No. Adoration belongs to God alone. What is purgatory? The final purification of those who die in God’s grace. What is our final hope? Resurrection of the body and eternal life with God.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, give eternal rest to the faithful departed. Mary, Mother of God, pray for us that we may persevere in Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray for a person who has died, entrusting them to God’s mercy.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Bereavement may make this conversation sensitive. Do not pronounce on the eternal fate of a particular person. Distinguish intercession from adoration and describe the Church’s hope without denying judgement or the need for conversion.</p>\n<h2>Liturgy and the Seven Sacraments</h2>\n<h3>AIM</h3>\n<p>Help the catechumen recognise Christ acting through sacramental signs.</p>\n<h3>QUICK PREP</h3>\n<p>Seven handwritten cards using the names in the steps.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What changes when worship is understood as Christ acting in his Church?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Sacraments for a whole life</strong></p>\n<ol><li>Write Baptism, Confirmation, Eucharist, Penance, Anointing of the Sick, Holy Orders and Matrimony on cards.</li><li>Sort them using Conversation 13: initiation; healing; service of communion.</li>\n<details class=\"conv\"><summary>Open Conversation 13 &mdash; Liturgy and the Seven Sacraments</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In the sacred liturgy Christ continues his saving work in the Church. The seven sacraments are effective signs of grace entrusted by Christ to the Church.</p>\n<p>Liturgy is the public worship of Christ and his Body, not a performance staged for an audience. Christ is the principal actor: he sanctifies his people and draws them into the worship he offers to the Father. A sacrament is an outward sign that truly gives the grace it signifies because Christ acts through it. The seven sacraments are Baptism, Confirmation, Eucharist, Penance, Anointing of the Sick, Holy Orders and Matrimony. The sacraments are grouped as initiation, healing and service of communion. Their fruit depends on God&#x27;s faithful action and on the recipient&#x27;s disposition. They do not work by magic, but neither are they only subjective reminders.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What changes when worship is understood as Christ acting in his Church rather than simply as people expressing their feelings about God?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is the liturgy? The public worship of Christ and his Church in which Christ sanctifies us and we worship the Father.</li><li>What is a sacrament? An effective sign of grace instituted by Christ and entrusted to the Church.</li><li>How many sacraments are there? Seven.</li><li>Which are the sacraments of initiation? Baptism, Confirmation and Eucharist.</li><li>Are sacraments only symbols? No. They signify and truly communicate the grace Christ promises.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus, teach me to recognise you acting in the liturgy. Prepare me to receive your sacraments with faith, reverence and a heart open to grace. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Sunday Mass, notice the movement from the Liturgy of the Word to the Liturgy of the Eucharist. Write down one sign, gesture or prayer you want explained.</p></div></details><li>Choose Baptism as an example. Distinguish the outward sign from the grace Christ truly gives through it.</li><li>Ask why sacraments are more than reminders but do not work as magic. They are Christ’s effective signs, received with the proper disposition.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 13. Do not try to teach every sacrament fully here; Conversations 14–17 deepen the teaching.</p>\n<h2>Liturgy and the Seven Sacraments</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What is different about receiving a sacrament and simply expressing a feeling?”</li><li>“What helps us participate in liturgy with faith and attention?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is a sacrament? An effective sign of grace instituted by Christ. How many are there? Seven. Which initiate Christian life? Baptism, Confirmation and Eucharist.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, teach me to recognise your action in the liturgy. Prepare me to receive your Sacraments with faith and reverence. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday worship, notice one gesture or prayer and ask what it means.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>The activity sorts the names, not people into predetermined life paths. Every sacrament serves Christ’s saving work. Keep catechumens’ participation in worship clear: they do not yet receive Holy Communion or other sacraments before Baptism.</p>\n<h2>Baptism Dying and Rising with Christ</h2>\n<h3>AIM</h3>\n<p>Explain the full gift of Baptism and the repentance that prepares an unbaptised adult.</p>\n<h3>QUICK PREP</h3>\n<p>A cup of water and paper, optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you expect God to do in Baptism, beyond recording your own decision?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>God’s saving gift</strong></p>\n<ol><li>Look at water and name its ordinary meanings: cleansing, life and refreshment. Do not pour it over anyone.</li><li>Read the effects of Baptism: forgiveness of all sin and its punishment, new birth in grace, adoption, union with Christ and incorporation into the Church.</li><li>Write “Permanent character”. Explain why a valid Baptism can never be repeated.</li><li>Ask what preparation means: faith, sorrow for sin, conversion and free intention. State explicitly that sacramental Confession does not precede Baptism.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 14. Baptism joins us to Christ’s death and Resurrection and truly gives new life.</p>\n<details class=\"conv\"><summary>Open Conversation 14 &mdash; Baptism: Dying and Rising with Christ</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Baptism by true water and the Trinitarian form frees from all sin, gives new birth in the Holy Spirit, incorporates us into Christ and the Church, and imprints an indelible sacramental character.</p>\n<p>In Baptism you will not merely announce that you have changed your mind. God will act sacramentally. All sin is forgiven: original sin and every personal sin committed before Baptism, together with all punishment due to those sins. Baptism gives sanctifying grace, the theological virtues and the indwelling of the Holy Spirit. You become an adopted child of God, a member of Christ and part of the Church. The baptismal character marks you permanently for Christian worship and mission. Because Baptism forgives every previous sin, an unbaptised catechumen does not make sacramental Confession before Baptism. Preparation instead includes repentance, examination of life and the sincere renunciation of sin.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What does it mean to you that Baptism is not mainly your promise to God, but first God&#x27;s saving action upon you?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is essential for Baptism? A washing with true water together with the Trinitarian form and the intention to baptise as the Church does.</li><li>What sins does Baptism forgive? All sins committed before Baptism, including original sin.</li><li>What positive gift does Baptism give? New birth in grace, the Holy Spirit, adoption as God&#x27;s child and incorporation into Christ and the Church.</li><li>Can Baptism be repeated? No. It gives an indelible sacramental character.</li><li>Should a catechumen go to sacramental Confession before Baptism? No. Baptism itself forgives all previous sin; the catechumen should nevertheless repent sincerely and prepare for a changed life.</li></ol>\n<h4>PRAYER</h4>\n<p>Father, prepare me to die and rise with Christ in Baptism. Give me true repentance, strong faith and joy in the new life you promise. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read John 3:1-8, Romans 6:3-11 and Titus 3:4-7. Write one sentence answering: What does God do in Baptism?</p></div></details>\n<h2>Baptism Dying and Rising with Christ</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Baptism more than a promise or membership ceremony?”</li><li>“What difference does the forgiveness of every previous sin make to your hope?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What sins does Baptism forgive? Original sin and every personal sin before Baptism. Can it be repeated? No. It gives a permanent sacramental character. Do catechumens confess sacramentally first? No. They repent and prepare for Baptism.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, prepare me to die and rise with Christ. Give me true repentance, strong faith and joy in the new life you promise. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Write or say one sentence about what God gives in Baptism, and pray for readiness to receive it.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Baptism forgives all previous sin; do not import the First Confession pathway for baptised children or candidates. Honest repentance and appropriate reparation still matter. Refer uncertainty about any prior Baptism to the priest.</p>\n<h2>Confirmation and the Gift of the Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Connect Confirmation with baptismal grace and the strength to witness to Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Paper listing the seven gifts printed in the steps; no oil is required.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Where would living faithfully as a Christian require courage from you?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Gifts for a real mission</strong></p>\n<ol><li>List wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. Read the central teaching of Conversation 15.</li>\n<details class=\"conv\"><summary>Open Conversation 15 &mdash; Confirmation and the Gift of the Holy Spirit</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Confirmation completes and strengthens baptismal grace, gives a special outpouring of the Holy Spirit, binds the baptised more firmly to the Church and strengthens them for witness and mission.</p>\n<p>Adult Christian initiation normally celebrates Baptism, Confirmation and Eucharist together. This shows clearly that initiation is one sacramental mystery: new birth, strengthening by the Spirit and Eucharistic communion belong together. In Confirmation the minister lays a hand upon you and anoints your forehead with sacred chrism using the Church&#x27;s sacramental form. The sacrament deepens grace, strengthens the gifts of the Holy Spirit and imprints an indelible character. Confirmation is not a graduation or a reward for having completed classes. Its grace is ordered to mature Christian witness: courage, fidelity, service, evangelisation and perseverance in the life begun at Baptism.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Where in your life do you most need the Holy Spirit&#x27;s strength in order to live openly and faithfully as a Christian?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>How does Confirmation relate to Baptism? It completes and strengthens baptismal grace; it does not make Baptism real for the first time.</li><li>What sign is used? The laying on of the hand and anointing with sacred chrism with the sacramental words.</li><li>What does Confirmation give? A special outpouring of the Holy Spirit, deeper grace, stronger ecclesial bond and strength for witness.</li><li>Can Confirmation be repeated? No. It imprints an indelible sacramental character.</li><li>When is an adult catechumen normally confirmed? Immediately after Baptism in the same celebration, unless a serious reason requires otherwise.</li></ol>\n<h4>PRAYER</h4>\n<p>Come, Holy Spirit. Give me wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. Make me a faithful witness to Christ. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Learn the seven gifts of the Holy Spirit. Ask which gift you most need now and pray for it each day.</p></div></details><li>Use this case: a colleague invites someone to join in dishonest or cruel behaviour. Ask which gifts could help them respond well.</li><li>Explain hands laid and anointing with sacred chrism. Confirmation gives a permanent seal and a special outpouring of the Holy Spirit.</li><li>Connect new birth, strengthening and Eucharistic communion: an adult is ordinarily confirmed immediately after Baptism in the same celebration.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 15. Confirmation strengthens Baptism; it does not make Baptism real for the first time.</p>\n<h2>Confirmation and the Gift of the Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is this sacrament more than a personal declaration of maturity?”</li><li>“What form of witness is being asked of you now?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What does Confirmation strengthen? Baptismal grace. What is given? A special outpouring of the Holy Spirit for witness. Can Confirmation be repeated? No. It gives a permanent character.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit. Give me wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. Make me faithful to Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one gift and ask the Holy Spirit for it in a particular situation.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not describe Confirmation as a reward for completed lessons or an optional later graduation. Explain its place in adult initiation. The priest directs the actual rite and any exceptional arrangement; do not rehearse anointing.</p>\n<h2>The Eucharist and the Holy Mass</h2>\n<h3>AIM</h3>\n<p>Hold together the Real Presence, Christ’s sacrifice and Eucharistic communion.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix and three headings: PRESENCE, SACRIFICE, COMMUNION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do Catholics believe is happening during the Eucharistic Prayer?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What Christ gives at Mass</strong></p>\n<ol><li>Under PRESENCE, read that bread and wine become Christ’s Body and Blood while their appearances remain: transubstantiation.</li><li>Under SACRIFICE, explain that Calvary’s one sacrifice is made sacramentally present; Christ does not suffer and die again.</li><li>Under COMMUNION, discuss union with Christ and his Church through receiving Jesus, Body, Blood, Soul and Divinity.</li><li>Ask why a catechumen participates in worship but waits until initiation before receiving Communion.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 16. Take more than one meeting if the Real Presence or sacrifice needs fuller explanation.</p>\n<details class=\"conv\"><summary>Open Conversation 16 &mdash; The Eucharist and the Holy Mass</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In the Eucharist Jesus Christ is truly, really and substantially present - Body, Blood, Soul and Divinity. The Mass sacramentally makes present his one sacrifice and Holy Communion unites us intimately with him and his Church.</p>\n<p>At the Last Supper Jesus took bread and wine and gave them as his Body and Blood. In the Eucharistic Prayer, by Christ&#x27;s words and the power of the Holy Spirit, the whole substance of bread and wine becomes the Body and Blood of Christ while the appearances remain. The Church calls this transubstantiation. The Mass does not make Christ die again. The one sacrifice of Calvary is made sacramentally present in an unbloody manner. The Church joins her thanksgiving, praise, intercession and self-offering to Christ&#x27;s perfect offering to the Father. Holy Communion is therefore not ordinary food or a merely symbolic act of fellowship. Because Communion expresses full ecclesial and sacramental unity, a catechumen waits until Baptism and Confirmation before receiving it.</p>\n<h4>TALK ABOUT IT</h4>\n<p>If the consecrated Host still looks like bread, what kind of faith is required to believe Christ&#x27;s words about what it truly is?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who is present in the Eucharist? Jesus Christ, truly, really and substantially, Body, Blood, Soul and Divinity.</li><li>What is transubstantiation? The change of the whole substance of bread and wine into Christ&#x27;s Body and Blood while the appearances remain.</li><li>Is the Mass another sacrifice in addition to Calvary? No. The one sacrifice of Christ is made sacramentally present.</li><li>Why is Sunday Mass central? The Eucharist is the source and summit of Christian life and Sunday is the Lord&#x27;s Day of resurrection and worship.</li><li>May an unbaptised catechumen receive Holy Communion? No. Eucharistic Communion follows Baptism and Confirmation in Christian initiation.</li></ol>\n<h4>PRAYER</h4>\n<p>Jesus, Bread of Life, increase my faith in your Eucharistic presence. Teach me to long for the day when I may receive you sacramentally in full communion with your Church. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Mass, remain prayerfully attentive during the Eucharistic Prayer. After Mass, spend a few minutes before the tabernacle and speak honestly to Jesus about your desire for Communion.</p></div></details>\n<h2>The Eucharist and the Holy Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do Catholics adore the Blessed Sacrament?”</li><li>“How can you offer yourself with Christ while preparing to receive him?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is truly present? Jesus Christ, Body, Blood, Soul and Divinity. Does he die again at Mass? No. His one sacrifice is made present. May an unbaptised person receive Communion? No. Baptism comes first.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, Bread of Life, increase my faith. Help me worship you now and prepare to receive you sacramentally in your Church. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>After Sunday worship, spend a few quiet minutes before the tabernacle and express your desire for Christ.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Listen for understanding beyond “special bread” or a symbolic meal. Avoid makeshift consecrations and misleading physical analogies. Where catechumens are dismissed for Scripture reflection, support that liturgical practice and explain its meaning.</p>\n<h2>The Sacraments of Healing and Vocation</h2>\n<h3>AIM</h3>\n<p>Explore sacramental forgiveness, care for the sick and vocations of service.</p>\n<h3>QUICK PREP</h3>\n<p>The Companion and the four cases below; no objects needed.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “How might Christ’s care shape the difficult and decisive moments of a Catholic life?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Which sacrament and why</strong></p>\n<ol><li>Consider a baptised Catholic repentant after serious sin: Penance gives sacramental forgiveness and reconciliation.</li><li>Consider someone seriously ill or weakened by old age: Anointing brings Christ’s strength and care; it is not reserved to the last moments of life.</li><li>Consider a man called to ordained ministry: Holy Orders includes bishops, priests and deacons.</li><li>Consider a man and woman entering a lifelong covenant open to children: Matrimony serves their good and family life, and is sacramental between the baptised.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 17. Baptism opens the door to this continuing sacramental life.</p>\n<details class=\"conv\"><summary>Open Conversation 17 &mdash; The Sacraments of Healing and Vocation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Christ continues to heal, forgive and call his people through Penance, Anointing of the Sick, Holy Orders and Matrimony. These sacraments belong to the lifelong Catholic life into which Baptism opens the door.</p>\n<p>After Baptism, serious sin is reconciled through the Sacrament of Penance. The penitent examines conscience, has contrition, confesses sins honestly, receives absolution from a priest and performs the assigned penance. Venial sins may also be confessed and regular Confession strengthens conversion. Anointing of the Sick is for Catholics who are seriously ill, weakened by old age or facing a significant deterioration in health; it is not only a last-minute ritual. It gives strength, peace, forgiveness when appropriate and union with Christ&#x27;s suffering. Holy Orders configures bishops, priests and deacons for ordained service. Matrimony establishes a covenant between one man and one woman ordered to their good and the procreation and education of children; between the baptised Christ raises it to a sacrament.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which of these sacraments most changes your picture of what lifelong Catholic life will actually look like after Baptism?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is Penance for? The forgiveness of sins committed after Baptism and the restoration or strengthening of communion with God and the Church.</li><li>Does a catechumen receive Penance before Baptism? No. Baptism forgives all previous sin.</li><li>Who should receive Anointing of the Sick? A baptised Catholic seriously ill, weakened by old age or whose condition has become more serious, according to the Church&#x27;s law and pastoral judgement.</li><li>What is Holy Orders? The sacrament by which bishops, priests and deacons are ordained for sacred ministry.</li><li>What is Matrimony? The lifelong covenant of one man and one woman, ordered to their good and to children; between baptised persons it is a sacrament.</li></ol>\n<h4>PRAYER</h4>\n<p>Christ our physician and shepherd, heal what is wounded in me and teach me to receive every vocation and sacrament as a gift ordered to holiness and service. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Ask the priest to explain how Confession works in your parish so that, after Baptism, you will not approach your first Confession with unnecessary anxiety.</p></div></details>\n<h2>The Sacraments of Healing and Vocation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Which of these Sacraments changes your picture of everyday Catholic life?”</li><li>“Why should marriage history be discussed with the priest early?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is Penance for? Sins committed after Baptism. Is Anointing only for the dying? No. It is for serious sickness or weakness through age. What is Matrimony? The lifelong covenant of one man and one woman, sacramental between the baptised.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Christ our physician and shepherd, heal what is wounded and guide my vocation. Teach me to receive your gifts in holiness and service. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask how to arrange Confession after Baptism and how to contact a priest for someone seriously ill.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Never direct a catechumen to sacramental Confession before Baptism. Discuss personal marriage circumstances confidentially with the priest; this activity cannot establish freedom to marry or resolve a prior bond. Keep the cases explanatory rather than diagnostic.</p>\n<h2>Freedom Conscience Virtue and Sin</h2>\n<h3>AIM</h3>\n<p>Form a truthful conscience and connect freedom with choosing the good.</p>\n<h3>QUICK PREP</h3>\n<p>Paper with three headings: TEMPTATION, CHOICE, HABIT.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Is being free simply doing whatever I feel like doing?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Learning to choose the good</strong></p>\n<ol><li>Use this case: someone is tempted to spread a harmful rumour but chooses to remain silent. Distinguish temptation from consent.</li><li>Change the case: the person knowingly invents a damaging lie. Ask what makes the choice morally different.</li><li>Read the three conditions for mortal sin: grave matter, full knowledge and deliberate consent, present together.</li><li>Under HABIT, name virtues that help stable good choices: prudence, justice, fortitude and temperance. Discuss conscience formed by truth rather than preference.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 18. Accidents, intrusive thoughts and insufficiently free acts must not be equated with deliberate sin.</p>\n<details class=\"conv\"><summary>Open Conversation 18 &mdash; Freedom, Conscience, Virtue and Sin</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Christian freedom is the power, healed by grace, to choose the good. Conscience must be formed in truth. Virtue makes good action stable, while sin is a free offence against God, reason, truth and rightly ordered love.</p>\n<p>The commandments and Beatitudes are not rival visions. The commandments identify fundamental goods and boundaries; the Beatitudes reveal the interior shape of life in Christ: poverty of spirit, mercy, purity of heart, hunger for righteousness and peacemaking. Conscience is not a private permission slip. It is the judgement of reason about the moral quality of an act and must be formed by Scripture, Church teaching, prayer, sound counsel and honest attention to reality. We must follow a certain conscience while also taking responsibility for forming it well. Mortal sin involves grave matter, full knowledge and deliberate consent; it destroys sanctifying grace in the baptised. Venial sin wounds charity without destroying it. Temptation, intrusive thoughts, accidents and acts without sufficient freedom are not the same as deliberate sin.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What is the difference between &quot;doing whatever I want&quot; and the Christi
