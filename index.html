t to the priest.</p>\n<h3>PRAY AND ACT</h3>\n<p>Use the prayer and THIS WEEK action in Conversation 1: pray for the child at Sunday Mass and make the Sign of the Cross over the child at home.</p>\n<h3>CONVERSATION 2</h3>\n<details class=\"conv\"><summary>Open Conversation 2 &mdash; The Rite: Water, Faith and the Signs</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>At the heart of Baptism, the child is washed with water in the name of the Father, and of the Son, and of the Holy Spirit. Parents and godparents renounce sin and profess the faith of the Church, and the signs of the rite show the new Christian life.</p>\n<p>The rite begins by welcoming the child by name and marking them with the Sign of the Cross. The Church listens to the Word of God, prays for the child and family, and asks Christ to free and strengthen the child. The Oil of Catechumens may be used according to the approved rite.</p>\n<p>Before the Baptism, parents and godparents renounce sin and profess the faith of the Church. These are not decorative words. You are saying that the child is being baptised into the faith and life of the Church and that you intend to help them grow within it.</p>\n<p>The central sacramental action is the washing with water together with the Trinitarian words of Baptism. Afterwards, sacred chrism signifies consecration and sharing in Christ’s mission; the white garment signifies the new creation and dignity of being clothed in Christ; and the candle lit from the Easter candle signifies the light of the risen Christ entrusted to the family to be kept burning in faith.</p>\n<h4>TALK ABOUT IT</h4>\n<p>When you answer “I do” to the faith of the Church, what will that “I do” need to look like after the Baptism? Parents: what will it change in family life? Godparents: how will you support the family and the child?</p>\n<h4>THE ESSENTIALS</h4>\n<p>Try each question in your own words first. Then read the short answer.</p>\n<ol><li>What is essential for a valid Baptism? A washing with true water together with the proper Trinitarian form, with the intention to baptise as the Church does.</li><li>Why do parents and godparents renounce sin and profess the faith? Because Baptism joins the child to Christ and to the faith and life of his Church.</li><li>What does sacred chrism signify? Consecration and the baptised person’s share in the life and mission of Christ, Priest, Prophet and King.</li><li>What does the white garment mean? The new dignity and life of a person clothed in Christ.</li><li>What does the baptismal candle mean? The light of Christ and the responsibility to help the child continue walking in faith.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus Christ, prepare us to make the baptismal promises sincerely. Help our lips and our daily life to say the same “I do” to your Gospel. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read the Apostles’ Creed together. Speak with the godparents about the promises and choose one practical way you will help one another live them.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 5</p></div></details>\n<p>Use with Conversation 2 of My Child&#x27;s Baptism</p>\n<h3>AIM</h3>\n<p>Help adults understand what will happen in church and, above all, what their spoken “I do” means.</p>\n<h3>ACTIVITY 1 - READ THE SIGNS</h3>\n<p>Place these four things in front of you if possible: water, a white cloth, a candle and a crucifix.</p>\n<ul><li>Water: ask first, “What might this sign be saying?” Then read the explanation in the book: new birth, cleansing, life - and the sacramental washing Christ uses in Baptism.</li><li>Chrism: ask first, “What might this sign be saying?” Then read the explanation in the book: consecration and sharing in Christ&#x27;s mission; explain rather than imitate the anointing.</li><li>White garment: ask first, “What might this sign be saying?” Then read the explanation in the book: new dignity and being clothed in Christ.</li><li>Candle: ask first, “What might this sign be saying?” Then read the explanation in the book: the light of the risen Christ entrusted to the family.</li></ul>\n<h3>DO NOT RUSH TO GIVE THE ANSWER</h3>\n<p>Let the parent or godparent notice the sign first. Then connect their answer with the Church&#x27;s meaning.</p>\n<h3>ACTIVITY 2 - WHAT DOES “I DO” COST?</h3>\n<p>Read the baptismal renunciations and profession of faith slowly, or use the Apostles&#x27; Creed.</p>\n<ul><li>After each section ask: “If I really mean this, what might it change in ordinary life?”</li><li>Do not debate every doctrine. The point is sincerity: the child is being baptised into the faith and life of the Church.</li></ul>\n<h3>CONVERSATION 2</h3>\n<p>Make the rite familiar without turning it into a performance</p>\n<h3>A SIMPLE WALK-THROUGH</h3>\n<h3>1 Reception</h3>\n<p>The child is welcomed by name; parents ask for Baptism and accept the responsibility of Christian upbringing.</p>\n<h3>2 Cross and Word</h3>\n<p>The child is marked with the Cross; Scripture is proclaimed and the Church prays.</p>\n<h3>3 Renunciation and faith</h3>\n<p>Parents and godparents reject sin and profess the Catholic faith.</p>\n<h3>4 Baptism with water</h3>\n<p>This is the central sacramental action. Explain it; do not imitate it.</p>\n<h3>5 Chrism, garment and candle</h3>\n<p>Receive the signs and connect each one with the Christian life that now begins.</p>\n<h3>6 Blessing and sending</h3>\n<p>The family leaves with a vocation, not simply with photographs.</p>\n<h3>REHEARSE, PRAY AND ACT</h3>\n<p>Practise the real responses - especially “I do” and “Amen” - but do not stage a pretend Baptism. Then use the prayer and THIS WEEK action in Conversation 2: read the Creed and agree one practical way parents and godparents will help one another live it.</p>\n<h3>CONVERSATION 3</h3>\n<details class=\"conv\"><summary>Open Conversation 3 &mdash; Living Baptism: Raising a Child in Faith</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Baptism is a beginning. Parents accept responsibility for the child’s Catholic upbringing, while godparents and the parish help them nourish the life of grace through prayer, Sunday Mass, the sacraments and Christian example.</p>\n<p>The home is normally the first school of faith. Long before a child understands a catechism lesson, they notice whether prayer is natural, whether Sunday Mass matters, whether forgiveness is practised and whether God is spoken about as someone real and loved.</p>\n<p>Parents are not expected to be perfect. What matters is a sincere intention to raise the child in the Catholic faith and to take real steps towards that life. If family practice has become irregular, Baptism preparation can be an honest opportunity to begin again rather than to pretend.</p>\n<p>Godparents support; they do not replace the parents. They pray for the child, give a credible Catholic example and encourage the child in the Church’s sacramental life. As the child grows, the family and parish will help them prepare for Confession, Holy Communion and Confirmation, and for the ordinary Christian life of prayer, charity, repentance and service.</p>\n<h4>TALK ABOUT IT</h4>\n<p>If this child learnt what Catholic life means only by watching the adults around them for the next five years, what would they learn?</p>\n<p>Choose one or two realistic habits that would make faith visible: Sunday Mass, a short daily prayer, blessing the child, forgiveness, Scripture, a crucifix in the home or regular contact with the parish.</p>\n<h4>THE ESSENTIALS</h4>\n<p>Try each question in your own words first. Then read the short answer.</p>\n<ol><li>What responsibility do parents accept in asking for Baptism? To raise the child in the Catholic faith and help the child live the life begun in Baptism.</li><li>How is baptismal grace ordinarily nourished? Through prayer, Sunday Mass, the sacraments, Christian charity, sound teaching and life within the Church.</li><li>What is the role of a godparent? To help the parents and child live a Christian life faithful to Baptism through prayer, example and support.</li><li>What if our family has been away from the Church? Begin honestly. Speak with the priest and take the next real step; preparation can be part of a genuine return to prayer and parish life.</li><li>Does preparation end on the day of Baptism? No. Baptism begins a lifelong life of grace, worship, conversion and discipleship.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus Christ, remain close to our family. Make our home a place of prayer, truth, forgiveness and love, and help us lead this child faithfully towards you. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose two habits to begin now: Sunday Mass, a brief bedtime prayer, blessing the child, a weekly Gospel story, grace before meals or a visible crucifix in the home.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 6</p>\n<h4>APPENDIX A</h4>\n<p>The Baptism Rite: step by step</p>\n<p>A practical guide for the family. The priest or deacon will guide you; the approved liturgical book governs the celebration.</p>\n<p>Part What it means</p>\n<p>The child is welcomed by name. The parents publicly</p>\n<ol><li>Reception ask the Church for Baptism and accept the responsibility of Christian upbringing.</li></ol>\n<p>The minister marks the child with the Cross; parents</p>\n<ol><li>Sign of the Cross and godparents are invited to do the same.</li></ol>\n<p>Sacred Scripture is proclaimed; the Church prays for</p>\n<ol><li>Word and Prayer the child, parents and godparents and invokes the saints.</li></ol>\n<p>The Church prays that the child be freed from the</p>\n<ol><li>Prayer for freedom from sin power of sin. The Oil of Catechumens may be used according to the rite.</li></ol>\n<p>The Church gives thanks for God’s saving work</p>\n<ol><li>Blessing of water through water and blesses the baptismal water as provided by the rite.</li></ol>\n<p>Parents and godparents renounce sin and profess the</p>\n<ol><li>Renunciation and profession faith of the Church, answering sincerely on behalf of the child.</li></ol>\n<p>Water is poured or the child is immersed while the</p>\n<ol><li>Baptism with water proper Trinitarian form is spoken. This is the central sacramental action.</li></ol>\n<p>The newly baptised child is anointed with sacred</p>\n<ol><li>Anointing with chrism chrism, signifying consecration and a share in Christ’s mission.</li></ol>\n<p>The white garment signifies the new creation and the</p>\n<ol><li>White garment dignity of being clothed in Christ.</li></ol>\n<p>The candle is lit from the Easter candle. The family is</p>\n<ol><li>Lighted candle entrusted with helping the child persevere in the light of Christ.</li></ol>\n<p>Further explanatory rites may follow according to the approved rite, and the celebration concludes with</p>\n<ol><li>Conclusion prayer and blessing. If Baptism is within Mass, the Eucharistic liturgy continues.</li></ol>\n<h4>KEY RESPONSES</h4>\n<p>The priest or deacon will guide you. The most important responses are the request for Baptism, the “I do” of renunciation and faith, and a prayerful “Amen”.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 7</p>\n<h4>APPENDIX B</h4>\n<p>Parents and godparents</p>\n<h4>PARENTS</h4>\n<p>By asking for Baptism, parents accept a real responsibility for the child’s Christian upbringing. The parish priest also confirms that the canonical conditions are met, including the necessary parental consent and a founded hope that the child will be brought up in the Catholic religion.</p>\n<p>Keep Sunday Mass at the centre of family life. Pray with and for the child from the beginning. Teach the Sign of the Cross, the Lord’s Prayer and the basic truths of faith as the child grows. Prepare the child in due course for First Confession, First Holy Communion and Confirmation. Give a recognisable Christian example of forgiveness, truthfulness, charity and repentance. Ask the parish for help early when faith, family circumstances or practical access become difficult.</p>\n<h4>GODPARENTS</h4>\n<p>A godparent is not an honorary title. The sponsor helps the baptised person live a Christian life faithful to the grace and obligations of Baptism, supporting the parents and remaining a recognisable Catholic witness as the child grows.</p>\n<p>Requirement What it means</p>\n<p>Chosen for the role Genuinely intends to carry out the responsibility.</p>\n<p>Catholic life A Catholic who is confirmed, has received the Eucharist and leads a life of faith in keeping with the role.</p>\n<p>Age Ordinarily at least sixteen, unless lawful provision or a just exception applies.</p>\n<p>Canonical freedom Not bound by a canonical penalty.</p>\n<p>Relationship Not the father or mother of the child.</p>\n<p>Number One Catholic sponsor is sufficient. If two are chosen, one is male and one female.</p>\n<p>Christian witness A baptised non-Catholic Christian may take part as a Christian witness together with a Catholic sponsor, according to Church law and parish guidance.</p>\n<h4>A GOOD CHOICE</h4>\n<p>Choose a godparent for the Christian life you hope the child will see, not simply for closeness, honour or family expectation.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 8</p>\n<h4>APPENDIX C</h4>\n<p>Twelve things to understand</p>\n<p>You do not need to memorise a theological script. Try to explain each point in ordinary words; use the concise answer when you need help.</p>\n<ol><li>What is Baptism? The sacrament of new birth by water and the word, and the gateway to Christian life.</li><li>Who instituted Baptism? Jesus Christ.</li><li>What does Baptism forgive? All sin; in an infant, original sin is remitted.</li><li>What grace is given? Sanctifying grace, by which we share in God’s life; the baptised becomes a temple of the Holy Spirit.</li><li>What new relationship does Baptism give? The baptised becomes an adopted child of God, is united with Christ and is incorporated into the Church.</li><li>Does Baptism leave a permanent mark? Yes. It gives an indelible sacramental character and cannot be repeated.</li><li>Why baptise infants? Because Baptism is God’s free gift of grace and the Church baptises infants in the faith of the Church, which is then nurtured as they grow.</li><li>What is essential in the rite? A washing with true water together with the proper Trinitarian form and the intention to baptise as the Church does.</li><li>Who ordinarily baptises? A bishop, priest or, in the Latin Church, a deacon.</li><li>What do parents accept? The responsibility to raise the child in the Catholic faith.</li><li>What does a godparent do? Helps the parents and child live a Christian life faithful to Baptism.</li><li>How does the life begun in Baptism grow? Through prayer, Sunday Mass, the sacraments, Christian teaching, charity, repentance and life in the Church.</li></ol>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 9</p>\n<h4>APPENDIX D</h4>\n<p>Before the Baptism: are we ready?</p>\n<p>Use this as an honest family review before your final parish conversation. It is not a pass/fail test.</p>\n<p>Tick only what is genuinely true. If something is not yet clear, bring it to the conversation rather than ticking it simply to finish the page.</p>\n<p>☐ We understand that Baptism truly gives new life in Christ and is not merely a family ceremony.</p>\n<p>☐ At least one parent or lawful guardian consents to the Baptism, and we sincerely ask the</p>\n<p>Church for it.</p>\n<p>☐ There is a real intention to raise the child in the Catholic faith, with concrete next steps such</p>\n<p>as Sunday Mass, prayer and sacramental life.</p>\n<p>☐ We understand that the renunciations and profession of faith are serious and are willing to</p>\n<p>make them sincerely.</p>\n<p>☐ A suitable Catholic godparent has been chosen where possible, and we understand the</p>\n<p>difference between a Catholic sponsor and a Christian witness.</p>\n<p>☐ We know the basic shape of the rite and the parish arrangements for the day.</p>\n<p>☐ We have spoken honestly about any distance from practice, family complexity, disability,</p>\n<p>language, transport or other needs that may affect the preparation or the day itself.</p>\n<p>☐ We know whom to ask if we have a question or need help after the Baptism.</p>\n<h4>YOU DO NOT NEED</h4>\n<p>Perfect theological vocabulary; an idealised family situation; a promise that family life will never be difficult; a polished testimony; or memorisation of the whole ceremony.</p>\n<p>IF THE HOPE OF CATHOLIC UPBRINGING IS UNCLEAR The response is a pastoral conversation, not pretending. The parish priest makes the pastoral and canonical judgement and follows the law of the Church and diocesan directions, explaining any difficulty and working with the family towards a genuine way forward.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 10</p>\n<h4>APPENDIX E</h4>\n<p>A simple family rule of life</p>\n<p>The aim is not a burdensome programme. Choose small practices that can become ordinary family life.</p>\n<p>Rhythm A simple practice</p>\n<p>Make the Sign of the Cross with the child; Daily bless them at bedtime; pray one short family prayer.</p>\n<p>At meals Say grace simply and naturally.</p>\n<p>Keep Sunday Mass at the centre of family life; Weekly afterwards mention one thing you heard, saw or prayed about.</p>\n<p>Keep a crucifix, Bible or holy image visible; use At home holy water if this is part of your family practice.</p>\n<p>Parents receive the sacraments faithfully, Regularly including Confession; let children see that adults also need mercy and grace.</p>\n<p>Teach basic prayers, tell Gospel stories, name As the child grows right and wrong calmly, practise forgiveness and prepare for the other sacraments.</p>\n<p>Pray for the child, mark baptismal With godparents anniversaries, encourage the sacraments and remain a recognisable Catholic support.</p>\n<p>Begin again. Return to prayer, Mass and When things go wrong Confession rather than allowing a difficult season to become permanent distance.</p>\n<h4>A PRAYER FOR YOUR CHILD</h4>\n<p>Lord Jesus, keep this child close to you. Help our home grow in faith, prayer, peace and love, and lead us together towards eternal life. Amen.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 11</p>\n<h4>APPENDIX F</h4>\n<p>The day of Baptism</p>\n<p>The priest or deacon will guide you. The aim is prayerful participation, not perfect performance.</p>\n<h4>BEFORE YOU LEAVE HOME</h4>\n<p>Pray briefly for the child and for the family. Bring the baptismal candle or white garment only if your parish has asked you to provide them. Make sure the godparents know where and when to arrive. Come in good time so the family can settle rather than begin the celebration in a rush.</p>\n<h4>DURING THE CELEBRATION</h4>\n<p>Listen to the Word of God and join the prayers. Answer the renunciations and profession of faith sincerely: “I do.” Watch and pray during the baptismal washing; this is the heart of the sacrament. Receive the signs of chrism, white garment and candle as reminders of the Christian life that now begins. If Baptism is celebrated within Mass, remain with the parish for the Eucharistic liturgy.</p>\n<p>DO NOT WORRY ABOUT REMEMBERING EVERY WORD The minister will lead the rite. What matters most is that you understand what you are asking for and make the profession of faith sincerely.</p>\n<h4>AFTERWARDS</h4>\n<p>Celebrate joyfully, then keep going. The lasting fruit of Baptism is not measured by the photographs or the reception afterwards, but by a child growing within the life of Christ and his Church through the ordinary faithfulness of family and parish life.</p>\n<h4>ON THE BAPTISMAL ANNIVERSARY</h4>\n<p>Light the baptismal candle if you still have it, pray for the child, make the Sign of the Cross with holy water and thank God for the grace of Baptism.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 12</p>\n<h4>APPENDIX G</h4>\n<p>If there is an emergency</p>\n<h4>DANGER OF DEATH</h4>\n<p>Contact a priest or deacon immediately if one is available. The Church does not delay Baptism when an unbaptised child is in danger of death.</p>\n<p>If no ordinary minister is available in an emergency, any person can baptise validly provided that person intends to do what the Church does and uses true water with the proper Trinitarian form.</p>\n<p>Use true water and say, while pouring the water on the person (or immersing): “N., I baptise you in the name of the Father, and of the Son, and of the Holy Spirit.”</p>\n<p>If an emergency Baptism takes place, tell the parish priest as soon as possible so that the Baptism can be recorded and the remaining rites supplied as appropriate. If there is doubt about what happened, do not attempt to repeat Baptism without speaking to the priest.</p>\n<h4>SOURCES AND DOCTRINAL REFERENCES</h4>\n<p>Sacred Scripture: Matthew 28:19–20; John 3:5; Romans 6:3–4; Titus 3:5; Galatians 3:27. Catechism of the Catholic Church: nos. 1213–1284, especially 1250–1255 on infant Baptism and 1262–1274 on the grace and effects of Baptism. Code of Canon Law: canons 849–878, especially 867–868 on infant Baptism and 872–874 on sponsors. Order of Baptism of Children: the approved liturgical book currently in force for the parish. Joseph Deharbe, S.J., A Full Catechism of the Catholic Religion, “On Baptism” Current diocesan policy and the directions of the parish priest govern local arrangements, records and particular pastoral cases.</p>\n<h4>A FINAL WORD</h4>\n<p>Baptism, Confirmation and the Eucharist form one Christian initiation. This booklet prepares parents and godparents for the beginning of that sacramental life; it does not replace Sunday Mass, family prayer, ongoing catechesis or the later sacraments.</p>\n<p>May God bless your child, your family and your godparents as you prepare for Baptism.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 13</p></div></details>\n<p>Use with Conversation 3 of My Child&#x27;s Baptism</p>\n<h3>AIM</h3>\n<p>Move from “the Baptism day” to the ordinary Catholic life in which baptismal grace is meant to grow.</p>\n<h3>ACTIVITY 1 - IF THE CHILD COPIED US</h3>\n<p>Ask the central question from the preparation book and give it time:</p>\n<h3>IMAGINE FIVE YEARS FROM NOW</h3>\n<p>If this child learnt what Catholic life means only by watching the adults around them, what would they have learnt?</p>\n<ul><li>What would they see on Sundays?</li><li>Would prayer feel normal or unusual?</li><li>Would they hear adults ask forgiveness and begin again?</li><li>Would Jesus and the Church be spoken about as real and loved?</li><li>Would the godparent still be recognisably present in the child&#x27;s Christian life?</li></ul>\n<h3>ACTIVITY 2 - PUT FAITH ON THE CALENDAR</h3>\n<p>Take an ordinary weekly calendar. Mark what is already there - work, school, shopping, clubs, family commitments. Then add just two realistic Catholic habits.</p>\n<ul><li>Sunday Mass - identify the Mass the family can ordinarily attend.</li><li>One small home habit - bedtime blessing, grace before meals, short Gospel story or family prayer.</li></ul>\n<h3>KEEP IT REALISTIC</h3>\n<p>Two habits that actually happen are better than ten intentions that disappear after the Baptism.</p>\n<h3>CONVERSATION 3</h3>\n<p>Who will help the child keep walking?</p>\n<h3>THE THREE CIRCLES</h3>\n<p>On a sheet of paper draw three overlapping circles labelled HOME, GODPARENTS and PARISH. In each circle write one or two concrete things that belong there.</p>\n<ul><li>HOME: Sunday Mass, prayer, Christian example, forgiveness, teaching the faith.</li><li>GODPARENTS: prayer, visible Catholic example, encouragement, remembering baptismal anniversaries, support through later sacraments.</li><li>PARISH: worship, sacraments, catechesis, friendship, pastoral help and belonging.</li></ul>\n<h3>THE POINT</h3>\n<p>No one circle replaces the others. Parents remain the first educators in faith; godparents support rather than replace them; the parish receives the family into a real worshipping community.</p>\n<h3>CONVERSATION PROMPTS</h3>\n<ul><li>Which part of Catholic family life already feels natural?</li><li>Which part will need to begin again?</li><li>What could make Sunday Mass difficult, and what practical solution might help?</li><li>What should the godparent still be doing in five years?</li><li>When would you want to ask the parish for help?</li></ul>\n<h3>PRAY AND ACT</h3>\n<p>Use the prayer and THIS WEEK action in Conversation 3. Choose two habits now; do not wait until after the Baptism. Use this shortly before the Baptism so the adults know what they are doing and can pray rather than worry about logistics.</p>\n<h3>1 Find your places</h3>\n<p>Know where parents, child and godparents will stand or sit. Ask about any local arrangements.</p>\n<h3>2 Say the request clearly</h3>\n<p>Be ready to ask the Church for Baptism and accept the responsibility of Christian upbringing.</p>\n<h3>3 Practise the profession of faith</h3>\n<p>Read the renunciations and profession slowly. Answer “I do” as a real act of faith, not as stage directions.</p>\n<h3>4 Know the signs</h3>\n<p>Be ready for the Cross, water, chrism, garment and candle. The priest or deacon will guide you.</p>\n<h3>5 Prepare practical items</h3>\n<p>Bring only what the parish has asked you to bring. Arrive in good time.</p>\n<h3>6 Plan one quiet moment afterwards</h3>\n<p>After the celebration, before the reception takes over, thank God for the grace given to the child.</p>\n<h3>ONE SENTENCE TO REMEMBER</h3>\n<p>The minister will lead the rite. What matters most is understanding what you are asking for and making the profession of faith sincerely. A godparent is not an honorary title. Use these prompts with the chosen sponsor before the Baptism.</p>\n<ul><li>Why have you agreed to be this child&#x27;s godparent?</li><li>What part of your own Catholic life would you most want this child to learn from you?</li><li>How will you pray for the child regularly?</li><li>How will you remain present when the child reaches First Confession, First Holy Communion and Confirmation?</li><li>If the family&#x27;s practice becomes difficult or irregular, how can you encourage without becoming intrusive?</li><li>What will you do on the child&#x27;s baptismal anniversary?</li></ul>\n<h3>A GOOD CHOICE</h3>\n<p>Choose a godparent for the Christian life you hope the child will see, not simply for closeness, honour or family expectation.</p>\n<h3>CHECK THE REQUIREMENTS</h3>\n<p>Use Appendix B of My Child&#x27;s Baptism for the canonical requirements and ask the priest about any uncertain situation. Use the preparation book&#x27;s family rule as a menu, not a burden. Circle or choose only what you can genuinely begin.</p>\n<h3>Daily</h3>\n<p>Sign of the Cross; bless the child; one short prayer.</p>\n<h3>Meals</h3>\n<p>Say grace naturally.</p>\n<h3>Weekly</h3>\n<p>Sunday Mass; mention one thing heard, seen or prayed about.</p>\n<h3>At home</h3>\n<p>Keep a crucifix, Bible or holy image visible.</p>\n<h3>Regularly</h3>\n<p>Parents receive the sacraments faithfully, including Confession.</p>\n<h3>As the child</h3>\n<p>Teach prayers, tell Gospel stories, practise forgiveness</p>\n<h3>grows</h3>\n<p>and prepare for later sacraments.</p>\n<h3>With</h3>\n<p>Pray for the child, mark the baptismal anniversary and</p>\n<h3>godparents</h3>\n<p>remain a recognisable Catholic support.</p>\n<h3>When things</h3>\n<p>Begin again. Return to prayer, Mass and Confession</p>\n<h3>go wrong</h3>\n<p>rather than allowing a difficult season to become permanent distance.</p>\n<h3>CHOOSE TWO NOW</h3>\n<p>Write them into the actual family calendar before the Baptism. Baptism begins a life; it is not the finish line. This is not a test. Use it to notice what is clear and what still needs an honest conversation.</p>\n<p>☐ We can explain in ordinary words what Baptism gives.</p>\n<p>☐ We understand that Baptism is more than a family ceremony or naming day.</p>\n<p>☐ We are willing to make the renunciations and profession of faith sincerely.</p>\n<p>☐ We have a real intention to raise the child in the Catholic faith.</p>\n<p>☐ We have chosen at least one concrete Sunday Mass / prayer habit to begin or continue.</p>\n<p>☐ We understand the role of the godparent and have checked any uncertainty about eligibility.</p>\n<p>☐ We know the basic shape of the rite and what the main signs mean.</p>\n<p>☐ We have raised any family, canonical, access, language or practical difficulty rather than hiding it.</p>\n<p>☐ We know whom to ask for help after the Baptism.</p>\n<h3>FINISH WITH ONE QUESTION</h3>\n<p>“What are you most grateful for as you prepare to ask the Church for this child&#x27;s Baptism?” Then pray for the child by name.</p>\n<h3>KEEP USING THE PREPARATION BOOK</h3>\n<p>The rite guide, parent and godparent requirements, twelve essentials, readiness review, family rule, day-of-Baptism page and emergency guidance remain in My Child&#x27;s Baptism. This companion is only the pedagogical aid.</p>"}, {"name": "Marriage", "url": "https://3stepuk.github.io/Preparing-for-Our-Marriage/", "desc": "For couples preparing for the sacrament of Marriage.", "html": "<p>For engaged couples and their mentors</p>\n<h3>USE BESIDE THE PREPARATION BOOK</h3>\n<p>Use with Preparing for Our Marriage A Catholic Preparation Book for Engaged Couples. The book supplies the Catholic teaching. This companion helps the two of you make it concrete, speak honestly and take practical steps towards a lifelong covenant.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the two of you</li><li>Do something concrete</li><li>Open the preparation book</li><li>Listen to each other</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>PREPARING FOR A WHOLE LIFE</h3>\n<p>The wedding celebrates the covenant you will live each day. Preparation helps you understand marriage, choose it freely and begin habits of faithfulness, prayer and generous love. The priest establishes freedom to marry and directs the Church’s formal preparation.</p>\n<h2>How to use this guide</h2>\n<h3>FOUR CONVERSATIONS</h3>\n<p>Follow the four conversations in the preparation book. Each has a two-page activity and conversation here. The later pages offer practical helps when needed; they are not extra lessons to complete.</p>\n<h3>For each conversation</h3>\n<ol><li>Begin with the Sign of the Cross and the opening prayer printed near the end, as each person is able to participate sincerely.</li><li>Ask the opening question. Let each person finish speaking before responding.</li><li>Try the activity. All cards can be written as you meet, or the headings can simply be spoken.</li><li>Open the matching conversation in the preparation book. Read REMEMBER and the teaching slowly, pausing for questions.</li><li>Talk honestly. Check the central truth and use THE ESSENTIALS in the book to clarify understanding.</li><li>Pray the printed prayer, choose one realistic action and return to it next time. Repeat or divide a conversation when needed.</li></ol>\n<h3>Simple materials</h3>\n<p>The preparation book, this guide, paper and a pen are enough. No prepared talk, craft kit or internet search is required. A mentor can guide the conversation, or the couple can work together and bring questions to the priest.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen without taking sides or requiring private details. Help the couple understand the teaching and name a useful next step. You do not establish freedom to marry, decide validity or replace specialist support.</p>\n<h2>An opening conversation</h2>\n<p>Begin with the couple’s hopes and actual circumstances. A booked wedding must not prevent an honest question or a necessary pause.</p>\n<h3>Let each person speak</h3>\n<ol><li>“What do you value most about the person you hope to marry?”</li><li>“What do you understand yourselves to be promising for life?”</li><li>“What place does faith have in your life now?”</li><li>“What question or concern should we address before the wedding?”</li></ol>\n<h3>ESTABLISH FREEDOM TO MARRY</h3>\n<p>Use Appendix B with the priest early. Tell him about every previous marriage, Baptism and religious background, possible impediments, proposed venue and any concern about freedom or intention. Do not assume divorce or a civil marriage resolves the Church’s enquiry.</p>\n<h3>Respect privacy and freedom</h3>\n<p>Agree how to meet and what support is needed for language, reading, disability, work or caring responsibilities. The couple need not give a mentor an account of their intimate life, finances or private sins. Necessary personal matters belong in an appropriate private conversation with the priest.</p>\n<h3>ONE NEXT STEP</h3>\n<p>Choose one useful beginning: arranging the priest’s meeting, gathering the requested information, renewing Sunday Mass or making time for an honest couple conversation.</p>\n<p>If either person is afraid to disagree or say no, offer a safe private opportunity to seek help. Threats, coercion and abuse must not be treated as ordinary differences to settle together.</p>\n<h2>God’s Plan for Marriage</h2>\n<h3>AIM</h3>\n<p>Connect the lifelong covenant with fidelity, the good of the spouses and openness to life.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: UNITY, PERMANENCE, FRUITFULNESS.</p>\n<h3>BEGIN WITH THE COUPLE</h3>\n<p>Ask each person: “When I promise you my whole life, what do I mean?” Listen without trying immediately to make the answers match.</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A promise for an ordinary day</strong></p>\n<ol><li>Write UNITY: one husband and one wife in exclusive fidelity. Each name one daily choice that protects faithfulness in body, heart and conduct.</li><li>Write PERMANENCE: a bond intended for life. Use this case: tiredness and disappointment make affection difficult. What does seeking the other’s good require then?</li><li>Write FRUITFULNESS: love open to children and their upbringing. Name how children would be welcomed and how service and hospitality express generous love. Infertility does not make marriage less real.</li><li>Return to the opening sentences. Ask how this gift of persons differs from an arrangement kept only while convenient. Name one point needing clarification.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1. Keep the good of the spouses, unity, indissolubility and openness to life together.</p>\n<details class=\"conv\"><summary>Open Conversation 1 &mdash; God&#x27;s Plan for Marriage</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Marriage is a covenant in which a man and a woman establish a partnership of the whole of life. It is ordered to the good of the spouses and to the generation and education of children. Between baptised persons, a valid marriage is a sacrament.</p>\n<p>God is the author of marriage. Scripture begins with man and woman created for communion, and Jesus points back to the beginning when he teaches that the two become one flesh and that what God has joined must not be separated. Christian marriage therefore is more than a private arrangement or a contract for as long as both people are satisfied. A covenant means a gift of persons. You do not merely exchange services, property or affection; you give and receive one another in a lifelong communion of life and love. Marriage has an objective shape: it is exclusive, faithful and enduring. It is also naturally open to the gift of children and to their education. For baptised spouses, Christ raises marriage to a sacrament. Married love becomes a sign of his faithful love for the Church. The vocation is not simply to stay together but to help one another become holy and, if children are given, to receive and form them in faith. Three words are useful to remember: unity - one husband and one wife in exclusive fidelity; permanence - a bond intended for life; fruitfulness - a love open to life and generous beyond itself. These belong with the good of the spouses: marriage is meant to be a true communion in which each seeks the other’s good.</p>\n<h4>TALK ABOUT IT</h4>\n<p>When you say that you want to marry for life, what do you believe you are actually promising the other person - especially on a day when love feels difficult?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is marriage? A covenant between a man and a woman establishing a partnership of the whole of life, ordered to their good and to the procreation and education of children.</li><li>When is marriage a sacrament? A valid marriage between two baptised persons is, by that fact, a sacrament.</li><li>What are the essential properties of marriage? Unity and indissolubility; married love is also naturally open to life.</li><li>Why is marriage a vocation? Because spouses are called to love faithfully, help one another towards holiness and build a Christian household.</li><li>Why is openness to children part of marriage? Because married love is naturally ordered to the gift of life and to the loving education of children, even though not every couple will be able to conceive.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus, teach us to love with truth, fidelity and generosity. Help us to understand the covenant we are preparing to make and to seek one another’s holiness as well as happiness. Amen.</p>\n<h4>TOGETHER THIS WEEK</h4>\n<p>Each of you write one sentence beginning: “When I promise you my whole life, I mean…” Read your sentences to each other and talk about any difference you notice.</p>\n<p>PREPARING FOR OUR MARRIAGE | 4</p></div></details>\n<h2>God’s Plan for Marriage</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How will we help one another towards holiness as well as happiness?”</li><li>“What does our covenant ask when affection or circumstances become difficult?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is marriage? A covenant of one man and one woman for the whole of life, ordered to their good and to children. What are its essential properties? Unity and indissolubility. When is a valid marriage sacramental? When both spouses are baptised.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Let each person explain the central truths in ordinary words before checking the book. Clarify rather than turn this into an examination.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, teach us to love with truth, fidelity and generosity. Help us understand the covenant we are preparing to make and seek one another’s holiness. Amen.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Each complete the sentence “When I promise you my whole life, I mean…” Read the sentences to each other and discuss one difference honestly.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Explain permanence without implying that a person must remain exposed to danger or abuse. Openness to life is not a demand to prove fertility. Do not settle doubts about intentions or a previous bond yourself; bring them privately to the priest.</p>\n<h2>Consent and the Sacrament</h2>\n<h3>AIM</h3>\n<p>Clarify free consent, freedom to marry, the Church’s form and the grace of Matrimony.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: FREE, TRULY MARITAL, LAWFULLY EXPRESSED.</p>\n<h3>BEGIN WITH THE COUPLE</h3>\n<p>Ask each person: “What would help you make this promise freely and truthfully?” Allow space for a real answer rather than reassurance alone.</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What makes a marriage</strong></p>\n<ol><li>Under FREE, write MY OWN CHOICE. Use an invented case: a person fears family humiliation if the wedding is postponed. Discuss why pressure cannot supply consent.</li><li>Under TRULY MARITAL, write FIDELITY, PERMANENCE and OPENNESS TO LIFE. These must be sincerely intended, not positively excluded behind spoken words.</li><li>Under LAWFULLY EXPRESSED, name the ordinary Catholic form: an authorised priest or deacon and two witnesses, unless a lawful dispensation applies. The priest checks what is required.</li><li>For two baptised spouses, explain that the spouses confer the sacrament on each other by consent in the Latin Church. Name the grace needed to forgive, persevere and grow in holiness.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 2 and Appendix B. Freedom to marry, permissions, dispensations and particular cases belong with the priest.</p>\n<details class=\"conv\"><summary>Open Conversation 2 &mdash; Consent and the Sacrament</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Consent makes marriage. Each person must be free to marry and must freely give and receive the other in an irrevocable covenant. Catholics ordinarily marry according to the Church’s canonical form unless a lawful dispensation applies.</p>\n<p>No priest can manufacture your marriage for you. The indispensable human act is your consent: each of you freely chooses the other and gives yourself in marriage. Consent cannot be supplied by parents, family expectations, a wedding booking, pregnancy, money, fear of embarrassment or pressure from the other person.</p>\n<p>Before a Catholic marriage, the Church establishes that both parties are free to marry and that no impediment or prior bond stands in the way. A Catholic is ordinarily bound to marry before an authorised priest or deacon and two witnesses unless the competent authority has lawfully dispensed from that form.</p>\n<p>The intention expressed in consent must be truly marital. A person cannot validly consent while positively excluding marriage itself or an essential element or property - for example, intending from the outset never to be faithful, never to accept the permanence of marriage, or absolutely excluding children from the marriage.</p>\n<p>When both spouses are baptised, a valid marriage is sacramental. In the Latin Church the baptised spouses confer the sacrament on each other through their consent; the priest or deacon receives that consent in the name of the Church and blesses the union. Christ gives spouses a special grace to perfect their love, strengthen their unity, forgive, persevere and help one another towards holiness.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Is there anything about fidelity, permanence, children, faith, or freedom to marry that either of you feels unable to promise, uncertain about, or pressured to agree to? If yes, speak honestly now and bring it to the priest.</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What makes the marriage? The free and lawful consent of the man and woman who mutually give and accept one another in marriage.</li><li>What does freedom mean? No coercion or grave fear, and no legal or canonical obstacle that makes a person unable to marry.</li><li>What form does a Catholic ordinarily observe? Marriage before an authorised priest or deacon and two witnesses, unless the Church lawfully dispenses from the form.</li><li>Who are the ministers of the sacrament in the Latin Church? When both spouses are baptised, the spouses themselves confer the sacrament on each other by their consent.</li><li>What grace does Matrimony give? Grace to perfect married love, strengthen unity and fidelity, forgive, carry burdens together, welcome family life and grow in holiness.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord, give us freedom of heart and honesty of speech. Remove fear, pretence and hidden reservations. May the consent we give be truthful, generous and faithful. Amen.</p>\n<h4>TOGETHER THIS WEEK</h4>\n<p>Tell each other, without interruption, what you understand by “faithful for life”. Then ask: “Is there anything you need to know from me before you can promise this freely?”</p>\n<p>PREPARING FOR OUR MARRIAGE | 5</p></div></details>\n<h2>Consent and the Sacrament</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Is there any part of fidelity, permanence or openness to life that we do not yet understand or sincerely intend?”</li><li>“What question needs a private conversation with the priest before we proceed?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What makes marriage? Free and lawful consent of persons able to marry. Can anyone supply another’s consent? No. Neither family nor the Church can replace it. What does Matrimony give the baptised spouses? Grace to perfect love, strengthen fidelity and grow together in holiness.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Let each person explain the central truths in ordinary words before checking the book. Clarify rather than turn this into an examination.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, give us freedom of heart and honesty of speech. Remove fear, pretence and hidden reservations. Help us prepare for consent that is truthful and faithful. Amen.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Talk without interruption about what “faithful for life” means. Bring any unresolved question of freedom, intention or a previous marriage privately to the priest.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Never use completion of an activity as evidence that consent is valid. Give each person a safe way to speak privately if needed. A positive exclusion of an essential element, coercion or a prior bond requires the priest’s attention before the wedding.</p>\n<h2>Living Catholic Marriage</h2>\n<h3>AIM</h3>\n<p>Choose concrete habits of worship, communication, fidelity, forgiveness and generous family life.</p>\n<h3>QUICK PREP</h3>\n<p>Four headings: PRAYER, DAILY LIFE, REPAIR, FAMILY.</p>\n<h3>BEGIN WITH THE COUPLE</h3>\n<p>Ask: “If someone watched an ordinary week of our life, what kind of marriage would they expect us to build?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The first month of married life</strong></p>\n<ol><li>Under PRAYER, choose a brief printed prayer and plan Sunday Mass for the Catholic spouse or spouses. Discuss honestly how differences of faith will be respected.</li><li>Under DAILY LIFE, name one expectation about money, phones, work or household duties. Let each person explain before agreeing what is fair and realistic.</li><li>Under REPAIR, use a minor invented disagreement. Practise listening, a truthful apology and one concrete repair. Serious intimidation or abuse needs safety and specialist help, not this exercise.</li><li>Under FAMILY, discuss openness to children and their Catholic upbringing. Read the book on marital intimacy and responsible parenthood; name any question for the priest. Choose two habits to begin.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 3 and use Appendices D and G as needed. Private couple discussions do not require disclosure of intimate details to a mentor.</p>\n<details class=\"conv\"><summary>Open Conversation 3 &mdash; Living Catholic Marriage</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The sacrament is lived after the wedding through prayer, worship, fidelity, forgiveness, honest communication, marital self-gift, openness to life, responsible parenthood and the ordinary holiness of family life.</p>\n<p>Marriage joins two real people, not ideal versions of them. You will bring different habits, families, expectations, wounds, strengths and ways of handling stress. The grace of Matrimony does not remove the need for communication, patience or repair; it gives you Christ’s help to practise them faithfully. A Catholic home needs a spiritual rhythm. Pray together, even briefly. Keep Sunday Mass at the centre of life. Catholic spouses should make regular use of Confession and approach Holy Communion worthily. When children come, they learn what faith means first by watching what their parents actually do. Forgiveness is not pretending harm did not happen. Healthy married communication tells the truth without humiliation, listens before defending, apologises without excuses, and seeks repair rather than victory. Serious problems should be brought for help early rather than hidden until resentment becomes normal. Marital intimacy is part of the total gift of husband and wife. The Church teaches that sexual union belongs within marriage and should express faithful, mutual self-giving while remaining open to life. Responsible parenthood may include periodic abstinence and fertility-awareness methods for just reasons. Deliberate contraception is not in accord with Catholic teaching because it separates the unitive and procreative meanings of the marital act. If this teaching is new or difficult, bring the question honestly to the priest rather than avoiding it. Children are gifts, not entitlements, and infertility does not make a marriage less real. Spouses who do not receive children are still called to a fruitful love expressed in hospitality, service, charity and shared holiness. When children are given, parents become their first educators in faith.</p>\n<h4>TALK ABOUT IT</h4>\n<p>If someone watched the way you pray, spend money, handle conflict, use your phones, speak about sex, treat family members and make decisions, what kind of marriage would they expect you to have in ten years?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is the domestic church? The Christian household: a community of grace and prayer where faith is first learned and lived.</li><li>What habits strengthen Catholic marriage? Prayer, Sunday Mass, the sacraments, honest communication, forgiveness, fidelity and service.</li><li>What does marital intimacy express? The faithful and total self-gift of husband and wife, with the unitive and procreative meanings of marriage held together.</li><li>What is responsible parenthood? Generous and prudent discernment about family life in accordance with God’s law, including moral fertility-awareness methods when there are just reasons to space births.</li><li>What should you do when a serious problem appears? Seek truth, safety, pastoral help and appropriate professional support early; do not hide serious problems simply to keep the wedding or marriage looking successful.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus, make our future home a place of prayer, truth, tenderness and mercy. Teach us to forgive, to be faithful in body and heart, and to welcome your will with generosity. Amen.</p>\n<h4>TOGETHER THIS WEEK</h4>\n<p>Choose two ordinary habits you want from the first month of marriage: for example Sunday Mass, a nightly prayer, one technology-free meal, a weekly money check-in, or a regular time to talk without phones.</p>\n<p>PREPARING FOR OUR MARRIAGE | 6</p></div></details>\n<h2>Living Catholic Marriage</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What will help our home become a place where faith is lived?”</li><li>“How will we speak about intimacy, fertility and difficulties without pressure or avoidance?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the domestic church? The Christian household where faith, grace and prayer are lived. What does marital intimacy express? Faithful, total self-gift with its unitive and procreative meanings together. What should we do about serious difficulties? Seek truth, safety, pastoral help and appropriate professional support early.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Let each person explain the central truths in ordinary words before checking the book. Clarify rather than turn this into an examination.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, make our future home a place of prayer, truth, tenderness and mercy. Teach us to forgive, remain faithful and welcome your will generously. Amen.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Begin two agreed habits: one for prayer or Sunday worship and one for ordinary life, such as a time to talk without phones or a regular money conversation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Use the book’s teaching on chastity, openness to life and responsible parenthood. Respect privacy; refer personal or medical questions to appropriate help. Forgiveness never excuses violence, forced sex or control.</p>\n<h2>The Wedding Rite and the Vows</h2>\n<h3>AIM</h3>\n<p>Connect the celebration’s central actions with the covenant lived after the wedding.</p>\n<h3>QUICK PREP</h3>\n<p>Four headings: INTENTIONS, CONSENT, RINGS, BLESSING. No rings are needed.</p>\n<h3>BEGIN WITH THE COUPLE</h3>\n<p>Ask each person: “Which part of a lifelong promise will ask most of you in twenty years?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The day and the daily promise</strong></p>\n<ol><li>Under INTENTIONS, name freedom, lifelong fidelity and openness to children and their upbringing. These express the marriage being undertaken, not merely a ceremonial introduction.</li><li>Under CONSENT, name the free gift and acceptance of one another in marriage. Explain that this is the heart of the celebration; use only the parish’s approved wording for actual rehearsal.</li><li>Under RINGS, name a sign of the covenant. Under BLESSING, name the Church’s prayer for grace to live married life faithfully. Neither replaces consent.</li><li>For each heading, name one daily consequence: honest choices, protected fidelity, generous family life or asking for God’s help. Bring practical ceremony questions to the parish.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 4 and Appendix A. The activity uses these printed meanings; the parish supplies the approved texts for the celebration.</p>\n<details class=\"conv\"><summary>Open Conversation 4 &mdash; The Wedding Rite and the Vows</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The wedding liturgy is not a performance added to your relationship. It is the public celebration in which the Church receives your consent, prays for you and sends you to live what you have promised.</p>\n<p>The celebration normally includes the Liturgy of the Word, questions before the consent, the exchange of consent, the reception of the consent by the Church’s minister, the blessing and giving of rings, intercessions and the nuptial blessing. When the marriage is celebrated within Mass, the Eucharistic liturgy follows. Before consent you are asked, in the approved form, about freedom, your intention to enter a lifelong marriage, and openness to children and their upbringing. These are not ceremonial warm- up questions. They express the kind of marriage you are about to undertake. The exchange of consent is the heart of the celebration. Do not worry about performing it perfectly. The priest or deacon will guide you. What matters is that the words truthfully express your free act of will. The approved liturgical book, not a wedding website or this booklet, governs the exact wording used on the day. The rings are signs of the covenant you have made; the nuptial blessing asks God to strengthen the marriage. If both of you are Catholic, celebration within Mass is ordinarily fitting. In mixed marriages or other circumstances, the priest will advise which approved form is pastorally appropriate.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Read the form of consent or vows the parish gives you. Which words feel easiest to say now, and which words do you think will demand the most of you twenty years from now?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is the heart of the wedding celebration? The exchange of matrimonial consent.</li><li>Why are there questions before consent? To make clear the freedom and intentions with which you enter marriage.</li><li>What do the rings mean? They are signs of the faithful covenant you have entered.</li><li>What is the nuptial blessing? The Church’s solemn prayer asking God to bless, strengthen and sanctify your married life.</li><li>Do you have to memorise the whole rite? No. The priest or deacon guides the celebration; you should understand what you are doing and know the essential responses and consent.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus, may the words we speak on our wedding day be true in our hearts and faithful in our life. Write our promises into our daily choices and keep us close to you all our days. Amen.</p>\n<h4>TOGETHER THIS WEEK</h4>\n<p>Read the parish’s approved form of consent aloud to each other slowly. Do not rehearse it as a performance; use it as a prayer and ask what each promise will require in ordinary life.</p>\n<p>PREPARING FOR OUR MARRIAGE | 7</p>\n<h4>APPENDIX A</h4>\n<p>The Wedding Rite - Step by Step</p>\n<p>This is a practical outline, not a script. The approved Order of Celebrating Matrimony and the priest or deacon govern the celebration.</p>\n<p>Part What it means</p>\n<p>1 Welcome / The couple and assembly are gathered for the Church’s Entrance liturgy. The exact entrance form depends on the approved rite and local planning.</p>\n<p>2 Liturgy of the Sacred Scripture is proclaimed and the homily opens the Word meaning of Christian marriage.</p>\n<p>3 Questions The couple publicly expresses freedom and the intentions before Consent required for marriage, including lifelong fidelity and openness to children according to the approved form.</p>\n<p>4 Consent The couple gives and receives one another in marriage. This is the indispensable element that makes the marriage.</p>\n<p>5 Reception of The priest or deacon receives the consent in the name of Consent the Church and the assembly gives thanks to God.</p>\n<p>6 Rings The rings are blessed and exchanged as signs of love and fidelity.</p>\n<p>7 Intercessions The Church prays for the couple, their families, the Church and the world.</p>\n<p>8 Nuptial The Church asks God’s blessing and grace upon the Blessing spouses and their married life.</p>\n<p>9 Eucharist, The newly married couple joins the Church at the altar; when Catholics who are properly disposed receive Holy celebrated Communion. within Mass</p>\n<p>10 Final The couple is blessed and sent to live the covenant in Blessing family, Church and society.</p>\n<h4>FOR THE DAY</h4>\n<p>The parish will give you the exact approved texts, readings and practical directions. Use those rather than copying wording from an internet source.</p>\n<p>PREPARING FOR OUR MARRIAGE | 8</p>\n<h4>APPENDIX B</h4>\n<p>Freedom to Marry and Practical Preparation</p>\n<p>Some matters cannot be self-certified. The priest must establish freedom to marry and complete the Church’s formal pre-marriage enquiry. Tell him the full truth early; most difficulties are easier to handle before dates, suppliers and invitations become fixed.</p>\n<p>TELL THE PRIEST AT THE FIRST MEETING IF ANY OF THESE APPLY Either of you has ever been married before - civilly, religiously or in another country. Do not assume a previous marriage “does not count”. Either of you is unsure whether or where you were baptised, or belongs to another Christian community or religion. One of you is unbaptised. You are related by blood or marriage, or there may be another canonical impediment. Either of you feels pressured, afraid to say no, or unable to consent freely. There is a known medical issue concerning the ability to consummate the marriage; infertility is a different question and should not be confused with this. You hope to marry outside a Catholic church or need a form of celebration involving another Christian minister. There is anything about permanence, fidelity or children that one of you intends to exclude.</p>\n<p>MIXED MARRIAGE AND DISPARITY OF CULT A marriage between a Catholic and a baptised non-Catholic ordinarily requires the appropriate permission. A marriage between a Catholic and an unbaptised person requires a dispensation from the impediment of disparity of cult for validity. The Catholic party makes the promises required by Church law concerning perseverance in the Catholic faith and doing all in their power for the baptism and Catholic upbringing of children; the other party is informed of those promises. If one spouse is unbaptised, the valid marriage is not sacramental unless and until both spouses are baptised.</p>\n<h4>DOCUMENTS AND CIVIL REQUIREMENTS</h4>\n<p>The parish will tell you what is currently required. This normally includes a recently issued baptism certificate for each Catholic party, evidence of Confirmation if available, information needed to establish freedom to marry, and whatever civil documentation is required at the time. Civil procedures can change, so follow the current instructions of the parish and registrar rather than an old checklist.</p>\n<h4>IMPORTANT</h4>\n<p>Do not book a wedding on the assumption that a previous bond, dispensation, permission or document will “probably be fine”. Establish freedom to marry with the priest first.</p>\n<p>PREPARING FOR OUR MARRIAGE | 9</p>\n<h4>APPENDIX C</h4>\n<p>The Essentials</p>\n<p>This is not a theological examination. You should, however, be able to understand and explain these truths in your own words.</p>\n<ol><li>What is marriage? A covenant between a man and a woman establishing a partnership of the whole of life, ordered to the good of the spouses and the procreation and education of children.</li><li>Who instituted marriage? God established marriage in creation; Christ restored its original dignity and raised marriage between the baptised to a sacrament.</li><li>When is marriage sacramental? When a valid marriage exists between two baptised persons.</li><li>What are the essential properties of marriage? Unity and indissolubility.</li><li>What does married love require? Exclusive fidelity, permanence, mutual self- gift, and openness to life.</li><li>What makes marriage? The free consent of the parties, lawfully manifested by persons who are free and capable of marrying.</li><li>Can another person supply consent? No. No human power can replace the consent of either spouse.</li><li>Who are the ministers in the Latin Church? When both spouses are baptised, the spouses confer the sacrament on each other through consent.</li><li>What does the priest or deacon do? He receives the consent in the name of the Church, witnesses the marriage according to Church law and gives the Church’s blessing.</li><li>What grace does Matrimony give? Grace to perfect love, strengthen unity and fidelity, forgive, persevere, welcome family life and grow together in holiness.</li><li>Why are children part of marriage? Marriage is naturally ordered to the generation and education of children, who are received as gifts rather than possessions.</li><li>Does infertility make marriage invalid? No. Sterility by itself neither prohibits nor invalidates marriage.</li><li>What is the domestic church? The Christian family as a community of grace, prayer, virtue and the first handing-on of faith.</li><li>What should sustain married life? Prayer, Sunday Mass, the sacraments, forgiveness, honest communication, fidelity, charity and service.</li><li>What should a Catholic do if serious difficulties arise? Seek truth, prayer, pastoral help and appropriate professional support early, while protecting the safety and dignity of everyone involved.</li></ol>\n<p>PREPARING FOR OUR MARRIAGE | 10</p>\n<h4>APPENDIX D</h4>\n<p>Conversations That Matter Before Marriage</p>\n<p>These are not trick questions and there is no “correct couple answer”. Each of you should answer honestly before trying to solve the difference. A serious disagreement discovered now is useful information, not a failure of preparation.</p>\n<p>Area Talk honestly about</p>\n<p>Faith and worship What place will Sunday Mass, prayer and the Catholic faith actually have in our week? If we differ in faith, how will we protect the Catholic party’s practice and speak about faith with children?</p>\n<p>Conflict and repair What do I do when angry - pursue, withdraw, shout, become sarcastic, go silent? What helps me return to a conversation safely and honestly?</p>\n<p>Money and work What do we believe about debt, saving, generosity, spending, careers and financial transparency? What financial information have we not yet shared?</p>\n<p>Children and Do we both intend a marriage open to children? How do we feel about fertility timing, fertility difficulties, adoption, family size and Catholic teaching on responsible parenthood?</p>\n<p>Sex and intimacy Can we speak respectfully and without pressure about expectations, boundaries, past experiences, pornography, fertility, affection and the Church’s teaching on marital sexuality?</p>\n<p>Family and How involved will parents, siblings and friends be? What happens at boundaries Christmas, with childcare, with difficult relatives, or when one family expects more than the other?</p>\n<p>Home and Who will do what in ordinary life - cooking, cleaning, childcare, responsibilities appointments, prayer, finances, care of relatives? Are our expectations realistic and mutually respectful?</p>\n<p>Health and habits Have we been honest about physical or mental health, medication, addiction, gambling, alcohol/drugs, significant debt, legal problems or other matters that could affect married life?</p>\n<p>Technology and What boundaries will we have around phones, social media, private privacy messaging, pornography, location sharing and time online?</p>\n<p>Safety and Can each of us disagree or say no without fear? Is there controlling freedom behaviour, threats, intimidation, isolation, forced sex, violence or financial control? If yes, this is not ordinary conflict: speak privately to the priest and seek appropriate help before proceeding.</p>\n<h4>DO NOT RUSH</h4>\n<p>If a conversation reveals something serious, stop trying to “finish the page”. Make a note and bring it to the priest. Preparation exists to protect freedom and truth, not to keep a wedding timetable moving.</p>\n<p>PREPARING FOR OUR MARRIAGE | 11</p>\n<h4>APPENDIX E</h4>\n<p>Before the Wedding: Are We Ready?</p>\n<p>This is a pastoral review, not a pass/fail test. The priest makes the final canonical and pastoral judgement about readiness and freedom to marry. [ ] Freedom: We are each choosing marriage freely, without coercion, grave fear or a hidden reservation. [ ] Freedom to marry: We have told the priest about every previous marriage and any fact that could affect our freedom to marry. [ ] Meaning of marriage: We understand marriage as a lifelong covenant of one man and one woman, ordered to the good of the spouses and open to life. [ ] Fidelity: We intend exclusive fidelity and are not entering marriage while intending another sexual or romantic relationship. [ ] Permanence: We intend marriage for life and are not treating divorce as a pre- planned exit if the relationship becomes difficult. [ ] Children: We do not positively exclude children from the marriage and have discussed Catholic teaching on their baptism and formation. [ ] Faith: The Catholic party intends to remain faithful to the Church; as a couple we have honestly discussed Mass, prayer and the religious life of the household. [ ] Sacramental life: Catholic parties understand the value of Confession before the wedding and of Sunday Mass and the Eucharist in married life. [ ] Practical honesty: We have discussed money, debt, work, health, family, sex, fertility, addictions, technology and expectations of home life. [ ] Safety: Neither of us is afraid of the other or being coerced. We know that threats, violence, forced sex, controlling behaviour and isolation require help, not simply better communication. [ ] Wedding rite: We know the basic shape of the celebration and will use the texts, music and readings approved for the parish. [ ] Questions: We have brought unresolved questions to the priest rather than hiding them.</p>\n<h4>A GOOD SIGN OF READINESS</h4>\n<p>Not that you agree about everything, but that you can tell the truth, listen, seek help, understand what marriage is and freely intend what the Church asks you to promise.</p>\n<p>PREPARING FOR OUR MARRIAGE | 12</p>\n<h4>APPENDIX F</h4>\n<p>Frequently Asked Questions</p>\n<p>Do we both have to be Catholic? No. A Catholic can marry a baptised non-Catholic with the required permission, and can marry an unbaptised person if the required dispensation is granted. The priest will guide you through what applies.</p>\n<p>If one of us is unbaptised, is the marriage a sacrament? A valid marriage between two baptised persons is sacramental. If one spouse is unbaptised, the valid marriage is not sacramental unless and until both spouses are baptised.</p>\n<p>We are already living together. Can we still marry in the Church? Yes. Be honest with the priest. Preparation is a chance to bring the relationship into full accord with the Gospel, including chastity before marriage and, for Catholics, a good Confession before the wedding when appropriate. What if one of us has been married before? Tell the priest immediately, even if the marriage was only civil, took place outside the Catholic Church or ended years ago. A new wedding cannot be arranged until freedom to marry has been established.</p>\n<p>Is an annulment Catholic divorce? No. A declaration of nullity is a judgement that, after investigation, a valid marriage bond was not brought into being at the time of consent. The tribunal, not the couple, makes that judgement. Can we marry somewhere other than a Catholic church? Sometimes, but permission or dispensation may be needed depending on the circumstances. Do not book another venue until the priest has confirmed what is possible. Do we have to marry during Mass? Not always. When both parties are Catholic, marriage within Mass is ordinarily fitting. In mixed marriages or other circumstances, the rite outside Mass may be pastorally more appropriate. The priest will advise.</p>\n<p>What about readings and music? The wedding is a liturgy of the Church. Readings are chosen from the approved biblical texts and music must be suitable for sacred worship. The parish will help you choose. Do we need Confession before the wedding? Catholic spouses are strongly encouraged to prepare spiritually, including the Sacrament of Penance, so that they approach marriage and Holy Communion in a state of grace. What if we are older or cannot have children? Infertility does not invalidate marriage. Openness to life means not excluding the procreative meaning of marriage; it does not mean that every couple must be biologically able to conceive.</p>\n<p>What is the difference between infertility and impotence? Church law distinguishes inability to conceive from antecedent and perpetual inability to consummate marriage. Sterility does not invalidate marriage; a known concern about consummation should be discussed privately with the priest. What if we disagree about contraception or Natural Family Planning? Do not hide the disagreement. Catholic teaching asks spouses to respect both the unitive and procreative meanings of marital intimacy. Ask the priest for clear teaching and, if helpful, support in learning fertility awareness/Natural Family Planning.</p>\n<p>What if one of us is not very religious? Say so honestly. In a mixed marriage the Church does not ask the non-Catholic spouse to pretend to be Catholic, but both should understand the nature of marriage and the Catholic party’s obligations concerning faith and the Catholic upbringing of children.</p>\n<p>What if we discover a serious problem during preparation? That is one reason preparation exists. Bring it to the priest. A difficult truth faced before the wedding is safer than a hidden truth carried into marriage.</p>\n<p>PREPARING FOR OUR MARRIAGE | 13</p>\n<h4>APPENDIX G</h4>\n<p>A Simple Rule of Married Life</p>\n<p>A strong marriage is usually built less by dramatic gestures than by ordinary habits repeated faithfully.</p>\n<p>Rhythm A simple practice</p>\n<p>Daily Pray together briefly; speak one word of gratitude; show ordinary affection; tell the truth kindly.</p>\n<p>At meals Say grace when you are together; let meals sometimes be free of phones and other screens.</p>\n<p>Weekly Keep Sunday Mass at the centre of the week; make time for an unhurried conversation about how each of you is doing.</p>\n<p>Money Look at finances together regularly. Keep no secret debt, account or spending pattern that affects the household.</p>\n<p>Conflict Do not use contempt, threats, intimidation or silence as punishment. Pause when needed, then return to the issue and seek repair.</p>\n<p>Sacraments Catholic spouses receive the Eucharist worthily and use Confession regularly; let mercy become normal rather than exceptional.</p>\n<p>Marriage and Protect fidelity in body, imagination, messages and online life. Speak honestly and intimacy respectfully about sexual intimacy and fertility.</p>\n<p>Children If children are given, pray with them, bring them to Sunday Mass, teach them the faith and let them see adults apologise and forgive.</p>\n<p>Family and friends Build healthy boundaries while honouring parents and keeping friendships that strengthen, rather than undermine, your marriage.</p>\n<p>When things go Begin again. Ask for help early from the priest and from appropriate professional support. wrong Serious danger or abuse requires safety and specialist help, not endurance in silence.</p>\n<p>Anniversary Thank God for the covenant, pray for each other and remember what you promised - not as nostalgia, but as a renewed choice.</p>\n<h4>A COUPLE’S PRAYER</h4>\n<h4>PRAYER</h4>\n<p>Lord Jesus, be at the centre of our marriage. Teach us to be faithful, truthful, tender and forgiving. Give us courage in difficulty, gratitude in joy, generosity in family life and perseverance in faith. Lead us together towards eternal life. Amen.</p>\n<h4>SOURCES AND DOCTRINAL REFERENCES</h4>\n<p>Sacred Scripture: Genesis 1-2; Matthew 19:3-6; John 2:1-11; 1 Corinthians 7 and 13; Ephesians 5:21-33; Colossians 3:12-17. Catechism of the Catholic Church: nos. 1601-1666 (Matrimony), with nos. 2331-2400 especially on chastity, conjugal love and responsible parenthood. Code of Canon Law: canons 1055-1165, especially consent, impediments, canonical form and mixed marriages. Order of Celebrating Matrimony: the approved liturgical book currently in force for the parish. Joseph Deharbe, S.J., A Full Catechism of the Catholic Religion. Current diocesan policy, civil law and the directions of the parish priest govern local documents, permissions, records and particular pastoral cases.</p>\n<h4>FINAL REMINDER</h4>\n<p>The aim of preparation is not to produce a perfect wedding or a perfect couple. It is to help two people enter marriage freely, truthfully, sacramentally when applicable, and with the habits and grace needed to live the covenant for life.</p>\n<p>PREPARING FOR OUR MARRIAGE | 14</p></div></details>\n<h2>The Wedding Rite and the Vows</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What makes the spoken consent a truthful act of will rather than a performance?”</li><li>“How will we remember the covenant through ordinary actions after the wedding?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the heart of the celebration? The exchange of matrimonial consent. What do the rings signify? The faithful covenant already entered. What is the nuptial blessing? The Church’s prayer for blessing, strength and holiness in married life.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Let each person explain the central truths in ordinary words before checking the book. Clarify rather than turn this into an examination.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, may the words of our wedding day be true in our hearts and faithful in our life. Write our promises into daily choices and keep us close to you. Amen.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Choose one practical act that will express the covenant. When the parish gives the approved form of consent, read it slowly and bring any question before the rehearsal.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Use the approved liturgical book and parish direction for actual words, readings, music and movements. A rite within or outside Mass is decided with the priest. Do not substitute invented vows or let concern about performance obscure sincerity and freedom.</p>\n<h2>Faith and the home we hope to build</h2>\n<p>Use with Conversation 3 and Appendix D. Let each person describe actual practice and hopes. Neither should pretend to have a faith they do not hold.</p>\n<h3>A simple activity</h3>\n<ol><li>Draw or say three headings: NOW, OUR FUTURE HOME and QUESTIONS. Under NOW, each describe prayer, Mass and the place of faith in present life.</li><li>Under OUR FUTURE HOME, plan how Catholic worship will be supported, what prayer can be shared sincerely and how children would be formed in faith.</li><li>Under QUESTIONS, name a difference or practical obstacle: Sunday work, caring duties, another religious background or uncertainty about belief.</li><li>Choose one next step: attend Sunday Mass, pray a printed prayer together if both can do so sincerely, or speak with the priest about a difference.</li></ol>\n<h3>Talk together</h3>\n<p>“How will we protect the Catholic spouse’s practice without pressure or mockery?” “What will a child learn about faith from watching us?” “What support do we need from the parish?”</p>\n<h3>WHEN FAITH DIFFERS</h3>\n<p>The non-Catholic spouse is not required to pretend to be Catholic. The priest explains the permission or dispensation and the Catholic party’s promises about perseverance in faith and doing all in their power for the baptism and Catholic upbringing of children.</p>\n<h3>ONE HABIT</h3>\n<p>Choose a regular moment for gratitude, a simple prayer where possible and a practical plan for Sunday worship. Begin with what can be kept faithfully.</p>\n<h2>Listening disagreement and repair</h2>\n<p>Use with Appendix D. Practise only an ordinary, safe disagreement. Each person should be able to speak and decline the exercise freely.</p>\n<h3>Try a small invented case</h3>\n<p>One spouse wants a quiet evening; the other has invited friends without discussing it. Neither is threatened or afraid.</p>\n<ol><li>One person says what happened, how it affected them and what they need, without insults or guessing motives.</li><li>The other repeats what they heard before explaining their own view. The first person confirms or corrects it.</li><li>Each identify a truthful responsibility: perhaps failing to consult, dismissing tiredness or speaking unkindly. Practise an apology without excuses.</li><li>Agree a repair and a future habit, such as consulting before invitations. If a pause is needed, agree when to return to the conversation.</li></ol>\n<h3>Talk together</h3>\n<p>“When I am upset, do I pursue, withdraw, shout or become sarcastic?” “What helps us return to an ordinary disagreement calmly?” “What does a sincere apology need to change?”</p>\n<h3>WHEN THIS EXERCISE IS NOT APPROPRIATE</h3>\n<p>Threats, intimidation, violence, forced sex, isolation or controlling behaviour are not ordinary conflict. Do not use a joint communication exercise to resolve abuse. Seek a safe private conversation and appropriate specialist help.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not press either person to describe frightening experiences in front of the other. Forgiveness does not mean accepting danger or abandoning necessary boundaries. Follow parish safeguarding arrangements when concerns arise.</p>\n<h2>Money work and shared responsibilities</h2>\n<p>Use with Appendix D. The couple discuss actual information privately. A mentor needs no account numbers, balances or list of personal debts.</p>\n<h3>What each person expects</h3>\n<ol><li>Each name expectations about earning, spending, saving, giving and debt. Listen before deciding whether they match.</li><li>List ordinary responsibilities: meals, cleaning, appointments, household finances, care of relatives and, if children come, childcare.</li><li>For each responsibility, ask who has time, ability and capacity. Discuss paid work, illness and caring duties as well as fairness.</li><li>Choose a regular money conversation and one
