esson 1 &mdash; God Calls Me</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God created me out of love and calls me to know, love and serve him in his Catholic Church.</p>\n<p>God made every person in his image. Our deepest happiness is to live in friendship with him and one day see him face to face in heaven.</p>\n<p>God calls us through his word, through people who love us and through the Church.</p>\n<p>Jesus welcomes children. He asks us to listen, trust him, turn away from sin and learn the life of a disciple.</p>\n<p>Talk About It: God already knows and loves you. What do you think it means when we say that he is calling you by name?</p>\n<p>(God’s call is personal. He invites the child freely into friendship with Christ and life in the Church; Baptism is a response to grace, not simply something adults arrange.)</p>\n<p>Learn these answers</p>\n<ol><li>Why did God make you?</li></ol>\n<p>God made me to know him, love him and serve him in this life, and to be happy with him for ever in heaven.</p>\n<ol><li>What is grace?</li></ol>\n<p>Grace is God’s free gift of his own life and help.</p>\n<ol><li>Why do you wish to become Catholic?</li></ol>\n<p>I wish to know and follow Jesus Christ and live in his Church.</p>\n<ol><li>Does God force anyone to believe?</li></ol>\n<p>No. God gives grace and calls us to answer freely.</p>\n<ol><li>Whom does Jesus welcome?</li></ol>\n<p>Jesus welcomes everyone who comes to him in faith.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, thank you for calling me by name. Help me to know you, love you and follow you faithfully. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Make the Sign of the Cross each morning and ask Jesus to guide you.</p>\n<p>4 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Help the child see becoming Catholic as a personal response to God, not simply something adults have arranged.</p>\n<h3>QUICK PREP</h3>\n<p>Nothing needed. Optional: write the child’s name on a card.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Who knows your name best? What is different about someone knowing your name and someone really knowing you?”</p>\n<h3>THE NAME CARD</h3>\n<ol><li>Write the child’s name in the centre of a card or sheet of paper.</li><li>Around it, ask the child to name four things God already knows about them: something they enjoy, someone they love, something they find difficult, and something they hope for.</li><li>Ask: “If God knows all this and still calls you, what might he be inviting you into?”</li><li>Finish by making the Sign of the Cross slowly.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 1, especially REMEMBER and the paragraph explaining that becoming Catholic is a free response to grace.</p>\n<h3>LESSON 1</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Talk about God calling through people, Scripture, the Church and the child’s own desire.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Why did God make you? To know, love and serve him, and to be happy with him for ever.</strong></p>\n<p><strong>Does God force faith? No. God gives grace and calls us to answer freely. Why are you asking for Baptism? The child should be able to give a simple personal answer in their own words.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus, thank you for calling me by name. Help me to know you, love you and follow you freely. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each morning say: “Jesus, guide me today.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not supply the child’s reason for becoming Catholic too quickly. Their own free desire matters. If they struggle, keep the question open over several meetings rather than forcing a polished answer.</p>\n<h3>LESSON 2</h3>\n<details class=\"conv\"><summary>Open Lesson 2 &mdash; The One God: Father, Son and Holy Spirit</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>There is one God in three divine Persons: the Father, the Son and the Holy Spirit.</p>\n<p>There is only one God. He is eternal, all-holy, all-knowing, almighty and perfectly good. God is our Creator and Lord.</p>\n<p>The one God is the Most Holy Trinity: Father, Son and Holy Spirit. The three Persons are not three gods. Each is truly God, equal in majesty, sharing the one divine nature.</p>\n<p>The Father sent the Son for our salvation. The Father and the Son give us the Holy Spirit, who sanctifies us and dwells in souls living in grace.</p>\n<p>Talk About It: When you make the Sign of the Cross, whose name do you say? What does this tell us about the one God?</p>\n<p>(We name the Father, the Son and the Holy Spirit: three divine Persons, yet one God. The Sign of the Cross is both a prayer and a short profession of Trinitarian faith.)</p>\n<p>Learn these answers</p>\n<ol><li>How many gods are there?</li></ol>\n<p>There is one God.</p>\n<ol><li>Who is the Most Holy Trinity?</li></ol>\n<p>The Father, the Son and the Holy Spirit: three divine Persons in one God.</p>\n<ol><li>Is each Person truly God?</li></ol>\n<p>Yes. The Father, Son and Holy Spirit are each truly and wholly God.</p>\n<ol><li>Are there three gods?</li></ol>\n<p>No. There is only one God and one divine nature.</p>\n<ol><li>How do we honour the Trinity?</li></ol>\n<p>We adore the one God and pray in the name of the Father, and of the Son, and of the Holy Spirit.</p>\n<h4>PRAYER</h4>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Make the Sign of the Cross slowly and say the name of each divine Person.</p>\n<p>5 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Give the child a simple, orthodox grasp of one God in three divine Persons.</p>\n<h3>QUICK PREP</h3>\n<p>Three sticky notes marked FATHER, SON, HOLY SPIRIT.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Make the Sign of the Cross together. Ask: “How many names did we say? How many Gods are there?”</p>\n<h3>ONE GOD - THREE PERSONS</h3>\n<ol><li>Place the three name cards side by side.</li><li>Ask the child what Christians believe about each: Is the Father God? Is the Son God? Is the Holy Spirit God?</li><li>Then ask the crucial question: “Does that mean three gods?” Let the child answer.</li><li>Bring the three cards together and say: three distinct Persons, one God - not three parts of God and not three gods.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 2. Use the catechism wording rather than trying to invent an analogy for the Trinity.</p>\n<h3>LESSON 2</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask why the Sign of the Cross is such an important prayer for someone preparing for Baptism.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>How many gods are there? One God. Who is the Holy Trinity? Father, Son and Holy Spirit: three divine Persons in one God.</strong></p>\n<p><strong>Is each Person truly God? Yes - each is wholly and eternally God.</strong></p>\n<h3>PRAY</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make the Sign of the Cross slowly once each day, naming each divine Person deliberately.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Avoid water/ice/steam, shamrock and similar analogies. They often teach something the Church does not mean. The catechism’s concise language is safer and clearer.</p>\n<h3>LESSON 3</h3>\n<details class=\"conv\"><summary>Open Lesson 3 &mdash; Creation, Sin and the Promise of Salvation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God made all things good, but sin entered the world through disobedience; God promised a Saviour.</p>\n<p>God created the visible and invisible world from nothing. Human beings were created in holiness and friendship with God.</p>\n<p>Our first parents disobeyed God. Original sin is the fallen condition inherited by every human person, except the Blessed Virgin Mary, who was preserved from it by Christ’s grace.</p>\n<p>Personal sin is a deliberate thought, word, deed or omission against God’s law. God did not abandon sinners: he promised salvation and prepared a people for the coming of Christ.</p>\n<p>Talk About It: Think of something beautiful and good in creation. What does it tell us about God? Why, then, do we still need a Saviour?</p>\n<p>(Creation reveals God’s goodness, wisdom and power. Sin wounded humanity and the world, so we need Christ to free us from sin and restore friendship with God.)</p>\n<p>Learn these answers</p>\n<ol><li>Who created the world?</li></ol>\n<p>God created the world from nothing and made it good.</p>\n<ol><li>What is original sin?</li></ol>\n<p>Original sin is the fallen condition in which we are born without original holiness and justice.</p>\n<ol><li>What is personal sin?</li></ol>\n<p>A deliberate thought, word, deed or omission against God’s law.</p>\n<ol><li>Did God abandon humanity after the fall?</li></ol>\n<p>No. God promised a Saviour.</p>\n<ol><li>Who was preserved from original sin?</li></ol>\n<p>The Blessed Virgin Mary was preserved from original sin by the grace of Christ.</p>\n<h4>PRAYER</h4>\n<p>Merciful Father, you made me for goodness. Save me from sin and teach me to choose what is true and right. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>With an adult, name one good choice and one wrong choice; explain what makes them different.</p>\n<p>6 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Connect the goodness of creation with the reality of sin and God’s promise to save.</p>\n<h3>QUICK PREP</h3>\n<p>Two cards: GOOD and BROKEN. Optional: a beautiful natural object or photograph.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask the child to name something in the world they think is genuinely good or beautiful. Then ask: “If God made the world good, why is everything not perfect?”</p>\n<h3>GOOD - BROKEN - PROMISED</h3>\n<ol><li>Put the GOOD card down. Name several good things God created.</li><li>Put down BROKEN. Ask for examples of things that go wrong because of human sin: lies, cruelty, selfishness, violence.</li><li>Clarify that creation is good, but humanity is fallen and needs salvation.</li><li>Add a third handwritten card: PROMISE. Ask: “Did God walk away from us?” Lead into the promise of a Saviour.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 3. Keep original sin and personal sin distinct.</p>\n<h3>LESSON 3</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Use one concrete example to distinguish an accident from a freely chosen wrong action.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Who created the world? God created it from nothing and made it good. What is original sin? The fallen condition in which we are born without original holiness and justice.</strong></p>\n<p><strong>Did God abandon humanity? No. He promised a Saviour.</strong></p>\n<h3>PRAY</h3>\n<p>Merciful Father, you made us for goodness. Save us from sin and teach us to choose what is right. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Notice one beautiful thing in creation and thank God for it; make one deliberate good choice.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the lesson hopeful. Sin explains why we need Christ; it is not the final word. The movement is always creation -&gt; fall -&gt; promise -&gt; salvation.</p>\n<h3>LESSON 4</h3>\n<details class=\"conv\"><summary>Open Lesson 4 &mdash; Jesus Christ Our Saviour</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Jesus Christ is true God and true man, sent to save us from sin and bring us to the Father.</p>\n<p>The eternal Son of God took a true human nature from the Virgin Mary. He is one divine Person with two natures, divine and human.</p>\n<p>Jesus taught the truth, healed the sick, forgave sins and announced the Kingdom of God. His miracles show his divine authority and compassion.</p>\n<p>Only Christ can reconcile fallen humanity to God. He is the Way, the Truth and the Life, and there is no other name by which we are saved.</p>\n<p>Talk About It: If someone asked you, “Who is Jesus?”, what would you say so that they knew he is more than a good teacher?</p>\n<p>(Jesus is the eternal Son of God made man, true God and true man. He teaches with divine authority and alone can save us from sin and bring us to the Father.)</p>\n<p>Learn these answers</p>\n<ol><li>Who is Jesus Christ?</li></ol>\n<p>Jesus Christ is the eternal Son of God made man.</p>\n<ol><li>Is Jesus true God?</li></ol>\n<p>Yes. Jesus is true God, equal to the Father.</p>\n<ol><li>Is Jesus truly human?</li></ol>\n<p>Yes. He has a true human body and soul.</p>\n<ol><li>Why did the Son of God become man?</li></ol>\n<p>To save us from sin and bring us into friendship with God.</p>\n<ol><li>Who is the mother of Jesus?</li></ol>\n<p>The Blessed Virgin Mary is the Mother of God because her Son is truly God.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus Christ, Son of the living God, have mercy on me and lead me to the Father. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read one Gospel story about Jesus and tell someone what it reveals about him.</p>\n<p>7 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Help the child answer “Who is Jesus?” with more than “a good man” or “a teacher.”</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix and a Bible.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Show the crucifix. Ask: “If a friend asked who this is, what would you say?” Do not correct the first answer immediately.</p>\n<h3>WHO IS JESUS?</h3>\n<ol><li>Write four headings: TEACHER, HEALER, SAVIOUR, SON OF GOD.</li><li>Ask the child for a Gospel story that fits any heading. Supply one if needed.</li><li>Open a Gospel and read a short passage where Jesus acts with authority or mercy.</li><li>Ask: “Which heading is the most important if we want to say who Jesus really is?” Bring the answer to true God and true man, our Saviour.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 4 and use its exact teaching on Jesus being one divine Person with a true divine and true human nature.</p>\n<h3>LESSON 4</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what difference it makes that Jesus is not merely a wise teacher but the Son of God made man.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Who is Jesus Christ? The eternal Son of God made man.</strong></p>\n<p><strong>Is Jesus truly God and truly human? Yes. Why did he become man? To save us from sin and bring us to the Father.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus Christ, Son of the living God, have mercy on me and lead me to the Father. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one Gospel story about Jesus and tell another person what it reveals about him.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Let the Gospel do some of the teaching. The aim is encounter as well as information: the child is preparing to belong to Christ.</p>\n<h3>LESSON 5</h3>\n<details class=\"conv\"><summary>Open Lesson 5 &mdash; The Paschal Mystery</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Jesus saved us by his suffering, death, Resurrection and Ascension.</p>\n<p>Jesus freely offered himself upon the Cross as the perfect sacrifice for our sins. He truly died and was buried.</p>\n<p>On the third day, Jesus rose bodily from the dead. The Resurrection is a real event and the victory of life over death, grace over sin and hope over despair.</p>\n<p>Jesus ascended into heaven and reigns in glory. He will come again to judge the living and the dead. Those who die in God’s friendship are called to everlasting life.</p>\n<p>Talk About It: Look at a crucifix and then remember the empty tomb. What do the Cross and Resurrection tell us together?</p>\n<p>(The Cross shows Christ’s loving sacrifice for sin; the empty tomb shows his real victory over death. Christianity holds both together: sacrifice and triumph, sorrow and hope.)</p>\n<p>Learn these answers</p>\n<ol><li>How did Jesus redeem us?</li></ol>\n<p>By his suffering, death and Resurrection.</p>\n<ol><li>What is the Cross?</li></ol>\n<p>The Cross is the altar upon which Jesus offered himself for our salvation.</p>\n<ol><li>Did Jesus truly rise?</li></ol>\n<p>Yes. Jesus rose bodily from the dead on the third day.</p>\n<ol><li>Where is Jesus now?</li></ol>\n<p>He is in heaven and is also present to his Church in the ways he promised.</p>\n<ol><li>Will Jesus come again?</li></ol>\n<p>Yes. He will come in glory to judge the living and the dead.</p>\n<h4>PRAYER</h4>\n<p>We adore you, O Christ, and we bless you, because by your holy Cross you have redeemed the world. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Place a crucifix where you pray and thank Jesus for his sacrifice.</p>\n<p>8 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Show that the Cross and Resurrection belong together: sacrifice and victory.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix. Two cards: CROSS and EMPTY TOMB.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If our story about Jesus ended on Good Friday, what would be missing?”</p>\n<h3>FROM CROSS TO GLORY</h3>\n<ol><li>Place CROSS on the left and EMPTY TOMB on the right.</li><li>Ask the child to tell the story from the Last Supper to Easter morning in a few steps.</li><li>For each step ask: “What does this show about Jesus?”</li><li>Finish by placing the crucifix between the cards and saying: the same Jesus who truly died truly rose.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 5. Emphasise that the Resurrection is a real event, not just a way of saying the disciples felt hopeful.</p>\n<h3>LESSON 5</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask why Christians can face suffering and death with hope.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>How did Jesus redeem us? By his suffering, death and Resurrection. Did Jesus truly rise? Yes, bodily, on the third day.</strong></p>\n<p><strong>Will Jesus come again? Yes, in glory to judge the living and the dead.</strong></p>\n<h3>PRAY</h3>\n<p>We adore you, O Christ, and we bless you, because by your holy Cross you have redeemed the world. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Keep a crucifix where you pray and thank Jesus for his sacrifice and Resurrection.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not rush past either side: children need the reality of the Cross and the joy of the Resurrection. Christian hope is not pretending suffering is unreal.</p>\n<h3>LESSON 6</h3>\n<details class=\"conv\"><summary>Open Lesson 6 &mdash; The Holy Spirit and the Catholic Church</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Holy Spirit gives life to the Church, which Christ founded to teach, sanctify and govern in his name.</p>\n<p>At Pentecost the Holy Spirit came upon the Apostles and strengthened them to preach Christ. The Spirit continues to guide and sanctify the Church.</p>\n<p>The Catholic Church is the one, holy, catholic and apostolic Church founded by Christ. The Pope, successor of Saint Peter, and the bishops, successors of the Apostles, serve her unity and truth.</p>\n<p>The Church is both visible and spiritual: the People of God, the Body of Christ and the Temple of the Holy Spirit. We enter her sacramentally through Baptism.</p>\n<p>Talk About It: A church is a building, but the Church is more than a building. Who makes up the Church, and who gives her life?</p>\n<p>(The Church is the People of God and Body of Christ, visibly united under the Pope and bishops. The Holy Spirit dwells in her, sanctifies her and preserves her in Christ’s truth.)</p>\n<p>Learn these answers</p>\n<ol><li>Who is the Holy Spirit?</li></ol>\n<p>The Holy Spirit is the third Person of the Most Holy Trinity.</p>\n<ol><li>Who founded the Catholic Church?</li></ol>\n<p>Jesus Christ founded the Catholic Church.</p>\n<ol><li>What are the four marks of the Church?</li></ol>\n<p>The Church is one, holy, catholic and apostolic.</p>\n<ol><li>Who is the Pope?</li></ol>\n<p>The Pope is the Bishop of Rome and successor of Saint Peter.</p>\n<ol><li>How do we become members of the Church?</li></ol>\n<p>We become members of Christ and his Church through Baptism.</p>\n<h4>PRAYER</h4>\n<p>Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Learn the names of the Pope, the Bishop of Nottingham and your parish priest.</p>\n<p>9 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Help the child see the Church as Christ’s living people, animated by the Holy Spirit, not merely a building.</p>\n<h3>QUICK PREP</h3>\n<p>A simple sketch of a church building and several blank stick-figure circles/cards.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If this church building disappeared tomorrow, would the Catholic Church disappear?”</p>\n<h3>BUILDING OR BODY?</h3>\n<ol><li>Place or draw the church building.</li><li>Add cards for Pope, bishop, priest, family, saints, parishioners and the child.</li><li>Ask which of these are part of the Church and what unites them.</li><li>Add a small flame or write HOLY SPIRIT in the centre: the Spirit gives life, sanctifies and unites the Church.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 6, especially the four marks of the Church and Baptism as sacramental entry into her life.</p>\n<h3>LESSON 6</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask how joining the Church through Baptism will change where the child belongs on Sundays and in ordinary life.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Who founded the Catholic Church? Jesus Christ.</strong></p>\n<p><strong>What are her four marks? One, holy, catholic and apostolic. How do we become members of Christ and his Church? Through Baptism.</strong></p>\n<h3>PRAY</h3>\n<p>Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn the names of the Pope, the Bishop of Nottingham and your parish priest.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Avoid reducing “Church” to clergy. The child should see a visible, sacramental people with real shepherds, but also a Body into which they themselves are being received.</p>\n<h3>LESSON 7</h3>\n<details class=\"conv\"><summary>Open Lesson 7 &mdash; Faith, the Creed and Sacred Tradition</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Catholic faith receives everything God has revealed in Scripture and Sacred Tradition and taught by the Church.</p>\n<p>Faith is God’s gift by which we believe him and freely entrust ourselves to him. Faith seeks understanding and must bear fruit in charity.</p>\n<p>God’s revelation comes to us through Sacred Scripture and Sacred Tradition. Together they form one sacred deposit of faith entrusted to the Church.</p>\n<p>The Apostles’ Creed gives a short summary of the chief truths Catholics believe. At Baptism, the child rejects sin and professes this faith.</p>\n<p>Talk About It: Why is Catholic faith more than choosing only the teachings we happen to like?</p>\n<p>(Faith receives God’s revelation rather than inventing it. Scripture and Sacred Tradition form one deposit entrusted to the Church, whose teaching office serves the truth Christ gave.)</p>\n<p>Learn these answers</p>\n<ol><li>What is faith?</li></ol>\n<p>Faith is the gift by which we believe God and all that he has revealed.</p>\n<ol><li>Where is God’s revelation handed on?</li></ol>\n<p>In Sacred Scripture and Sacred Tradition.</p>\n<ol><li>Who authentically interprets God’s word?</li></ol>\n<p>The teaching office of the Church: the Pope and the bishops in communion with him.</p>\n<ol><li>What is the Creed?</li></ol>\n<p>The Creed is a summary and profession of the Catholic faith.</p>\n<ol><li>Must faith affect our life?</li></ol>\n<p>Yes. Living faith works through charity and obedience to God.</p>\n<h4>PRAYER</h4>\n<p>Lord, I believe; help my unbelief. Keep me faithful to all that you have revealed through your Church. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Begin learning the Apostles’ Creed and ask about any words you do not understand.</p>\n<p>10 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Show that Catholic faith is received from God through Scripture and Tradition rather than invented individually.</p>\n<h3>QUICK PREP</h3>\n<p>Bible, Apostles’ Creed, two cards marked SCRIPTURE and TRADITION.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If everyone invented Christianity for themselves, how would we know what Jesus actually taught?”</p>\n<h3>RECEIVED, NOT INVENTED</h3>\n<ol><li>Place the Bible and the SCRIPTURE card on one side and TRADITION on the other.</li><li>Ask the child to name something Catholics know from Scripture and something Catholics do because the faith has been handed on in the Church.</li><li>Read a line of the Apostles’ Creed. Ask: “Did we invent this today?”</li><li>Explain that the Creed sums up the faith the Church has received and professes.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 7. Keep Scripture and Sacred Tradition together as one deposit of faith entrusted to the Church.</p>\n<h3>LESSON 7</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask whether faith means never asking questions. Draw out that faith seeks understanding.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is faith? The gift by which we believe God and all he has revealed.</strong></p>\n<p><strong>Where is revelation handed on? In Sacred Scripture and Sacred Tradition. What is the Creed? A summary and profession of Catholic faith.</strong></p>\n<h3>PRAY</h3>\n<p>Lord, I believe; help my unbelief. Keep me faithful to all that you have revealed through your Church. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn one new line of the Apostles’ Creed and ask about any word you do not understand.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Welcome genuine questions. “Received faith” does not mean switching off the mind; it means asking questions inside a relationship of trust with God and the Church.</p>\n<h3>LESSON 8</h3>\n<details class=\"conv\"><summary>Open Lesson 8 &mdash; Prayer and the Christian Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Prayer is raising the mind and heart to God; a Christian lives by worship, thanksgiving, repentance and petition.</p>\n<p>Jesus teaches us to pray to the Father with confidence. The Our Father is the perfect prayer because it comes from the Lord himself.</p>\n<p>We adore God, thank him, ask forgiveness and present our needs. We also honour Our Lady and the saints and ask them to pray with us and for us.</p>\n<p>A Catholic prays daily, attends Mass every Sunday and holy day of obligation, reads Scripture, practises charity and grows in virtue.</p>\n<p>Talk About It: If someone watched your family for a week, what signs might show that prayer and Sunday Mass really matter?</p>\n<p>(The child and adult might name daily prayer, grace before meals, a crucifix, Scripture, forgiveness, Sunday Mass, reverent speech and practical charity. Faith becomes visible through habits.)</p>\n<p>Learn these answers</p>\n<ol><li>What is prayer?</li></ol>\n<p>Prayer is raising the mind and heart to God.</p>\n<ol><li>What is the perfect prayer?</li></ol>\n<p>The Our Father is the perfect prayer taught by Jesus.</p>\n<ol><li>Do Catholics worship Mary and the saints?</li></ol>\n<p>No. We worship God alone; we honour the saints and ask their intercession.</p>\n<ol><li>Why do we attend Sunday Mass?</li></ol>\n<p>To worship God, hear his word, share Christ’s sacrifice and keep the Lord’s Day holy.</p>\n<ol><li>What is virtue?</li></ol>\n<p>A virtue is a firm habit of doing good.</p>\n<h4>PRAYER</h4>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Pray the Our Father each day and attend Sunday Mass with your family.</p>\n<p>11 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Make prayer practical and help the child see how Catholic life becomes visible through habits.</p>\n<h3>QUICK PREP</h3>\n<p>Five small cards: ADORE, THANK, SORRY, ASK, LISTEN.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If you could speak to God for one minute right now, what would you say?”</p>\n<h3>FIVE WAYS TO PRAY</h3>\n<ol><li>Lay out the five prayer cards.</li><li>Ask the child to give one example sentence for each kind of prayer.</li><li>Choose one and pray it aloud together.</li><li>Then make a tiny weekly plan: Sunday Mass plus one short daily prayer the child can realistically keep.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 8, including the distinction between worshipping God and honouring the saints.</p>\n<h3>LESSON 8</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what someone would notice in a home where Catholic faith really mattered.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is prayer? Raising the mind and heart to God.</strong></p>\n<p><strong>What is the perfect prayer? The Our Father taught by Jesus. Do Catholics worship the saints? No. We worship God alone and ask the saints to pray for us.</strong></p>\n<h3>PRAY</h3>\n<p>Our Father, who art in heaven... Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the Our Father daily and attend Sunday Mass with the family.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Choose habits that can survive a busy week. One faithful practice is better than an ambitious plan that disappears after three days.</p>\n<h3>LESSON 9</h3>\n<details class=\"conv\"><summary>Open Lesson 9 &mdash; The Commandments, Sin and Conversion</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God’s commandments show the way of love; conversion turns the heart away from sin and towards God.</p>\n<p>The Ten Commandments teach love of God and neighbour. Jesus brings them to fulfilment and gives the Beatitudes as the pattern of life in his Kingdom.</p>\n<p>Mortal sin is a grave offence committed with full knowledge and deliberate consent. Venial sin wounds friendship with God without destroying sanctifying grace.</p>\n<p>Before Baptism, the catechumen learns to examine conscience, be sorry, make amends and ask God’s mercy. Baptism will forgive every previous sin.</p>\n<p>Talk About It: Imagine three children: one breaks something accidentally, one is tempted but says no, and one deliberately breaks it in anger. Are these the same? Why not?</p>\n<p>(An accident is not a sin, temptation is not itself a sin, and a deliberate wrong choice involves knowledge and consent. This helps form conscience without encouraging fear or scrupulosity.)</p>\n<p>Learn these answers</p>\n<ol><li>What do the commandments teach?</li></ol>\n<p>They teach us how to love God and our neighbour.</p>\n<ol><li>What three things are required for mortal sin?</li></ol>\n<p>Grave matter, full knowledge and deliberate consent.</p>\n<ol><li>What does venial sin do?</li></ol>\n<p>It wounds our friendship with God and weakens charity.</p>\n<ol><li>What is conversion?</li></ol>\n<p>Turning away from sin and turning towards God in faith and obedience.</p>\n<ol><li>How are sins committed before Baptism forgiven?</li></ol>\n<p>Every sin committed before Baptism is forgiven in Baptism.</p>\n<h4>PRAYER</h4>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Use the short examination of conscience in Appendix D and make one act of repair.</p>\n<p>12 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Form conscience without confusing accident, temptation and deliberate sin, while preparing the child for repentance before Baptism.</p>\n<h3>QUICK PREP</h3>\n<p>A plastic cup or harmless object. Three cards: ACCIDENT, TEMPTATION, CHOICE.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Hold up the cup. Ask: “Are these three the same: I drop it by accident; I feel like throwing it but do not; I throw it on purpose because I am angry?”</p>\n<h3>ACCIDENT - TEMPTATION - CHOICE</h3>\n<ol><li>Place the three cards in front of the child.</li><li>Give several simple scenarios and ask where each belongs.</li><li>For deliberate wrong choices, ask: “What would conversion look like now?” - sorrow, apology, repair, asking God for mercy.</li><li>Remind the child: before Baptism, they bring sin to God in repentance; Baptism will wash all previous sin away.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 9 and the catechism’s necessary note that an unbaptised child does not receive sacramental Confession before Baptism.</p>\n<h3>LESSON 9</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask why God’s commandments are a way of love rather than a collection of traps.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What do the commandments teach? How to love God and neighbour. Is temptation itself a sin? No.</strong></p>\n<p><strong>How are sins committed before Baptism forgiven? Every previous sin is forgiven in Baptism.</strong></p>\n<h3>PRAY</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make one act of repair for a real wrong choice, if appropriate.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Never ask the child to disclose private sins to you. This is formation of conscience, not rehearsal of Confession. Safeguarding disclosures are handled through normal parish procedures.</p>\n<h3>LESSON 10</h3>\n<details class=\"conv\"><summary>Open Lesson 10 &mdash; The Journey of a Catechumen</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Church accompanies the child through welcome, catechumenate, purification, initiation and continuing formation.</p>\n<p>The journey begins with enquiry and welcome. In the Rite of Acceptance, the Church marks the child with the Cross and receives him or her among the catechumens.</p>\n<p>The catechumenate is a real apprenticeship in Christian life: learning the faith, praying, turning away from sin, joining Sunday worship and serving others.</p>\n<p>When the Church judges the child ready, the final preparation becomes more prayerful and immediate. After Baptism and First Communion comes mystagogy: learning to live from the mysteries received.</p>\n<p>Talk About It: finishing a course?</p>\n<p>(The catechumenate forms the whole person through doctrine, prayer, conversion, Sunday worship, service and parish belonging. Readiness is spiritual and personal, not merely the completion of pages.)</p>\n<p>Learn these answers</p>\n<ol><li>What is a catechumen?</li></ol>\n<p>An unbaptised person whom the Church has formally accepted for preparation for Baptism.</p>\n<ol><li>Is the catechumenate only a course?</li></ol>\n<p>No. It is an apprenticeship in the whole Christian life.</p>\n<ol><li>Who accompanies a child?</li></ol>\n<p>The family, godparent, catechists, parish community and priest accompany the child.</p>\n<ol><li>What determines readiness?</li></ol>\n<p>Sincere faith, conversion, sufficient understanding and a developing Christian life.</p>\n<ol><li>What is mystagogy?</li></ol>\n<p>The formation after initiation that helps the newly baptised live the sacramental mysteries.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, guide me on the road to Baptism. Let your Cross mark my mind, my words and my whole life. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Mass, pray especially for everyone preparing for Baptism.</p>\n<p>13 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Help the child understand that the journey has stages because the Church is accompanying a real conversion, not running a course.</p>\n<h3>QUICK PREP</h3>\n<p>Seven cards: ENQUIRY, ACCEPTANCE, CATECHUMENATE, DISCERNMENT, PURIFICATION, INITIATION, MYSTAGOGY.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Why do you think the Church does not simply baptise someone five minutes after they first ask?”</p>\n<h3>BUILD THE JOURNEY</h3>\n<ol><li>Mix the seven cards and ask the child to put them in a sensible order.</li><li>Use Appendix A of the catechism to correct and explain the order.</li><li>For each stage ask: “What is growing here - knowledge, prayer, conversion, belonging, readiness?”</li><li>Put a small marker on the stage the child is currently living.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 10 and Appendix A. Emphasise “apprenticeship in Christian life.”</p>\n<h3>LESSON 10</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what has already changed since the child began this journey and what still needs to grow.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is a catechumen? An unbaptised person formally accepted for preparation for Baptism.</strong></p>\n<p><strong>Is the catechumenate only a course? No. It is an apprenticeship in Christian life.</strong></p>\n<p><strong>What determines readiness? Faith, conversion, sufficient understanding and a developing Christian life.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus, guide me on the road to Baptism. Let your Cross mark my mind, my words and my whole life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, pray for everyone preparing for Baptism and notice one way the parish supports them.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not make the child anxious about “passing stages.” The stages exist to serve grace and readiness, not to create hurdles.</p>\n<h3>LESSON 11</h3>\n<details class=\"conv\"><summary>Open Lesson 11 &mdash; Holy Baptism</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Baptism gives new birth in water and the Holy Spirit, forgives every sin and makes us members of Christ and his Church.</p>\n<p>Jesus instituted Baptism and commanded his Apostles to make disciples of all nations, baptising them in the name of the Father and of the Son and of the Holy Spirit.</p>\n<p>The essential sign is washing with true water while the minister uses the Trinitarian words. Baptism works by Christ’s power: it is not merely a public symbol.</p>\n<p>Baptism forgives original sin and all personal sins, gives sanctifying grace, makes us adopted children of God and leaves an indelible sacramental character. It can never be repeated.</p>\n<p>Talk About It: After Baptism, a person may look exactly the same. What has God really changed and given?</p>\n<p>(Baptism is not merely outward. God forgives every sin, gives sanctifying grace, makes the person his adopted child, joins the person to Christ and the Church, and seals the soul permanently.)</p>\n<p>Learn these answers</p>\n<ol><li>What is Baptism?</li></ol>\n<p>The sacrament of rebirth by water and the Holy Spirit.</p>\n<ol><li>What is the matter of Baptism?</li></ol>\n<p>True natural water used by immersion or pouring.</p>\n<ol><li>What is the form of Baptism?</li></ol>\n<p>“I baptise you in the name of the Father, and of the Son, and of the Holy Spirit.”</p>\n<ol><li>What sins does Baptism forgive?</li></ol>\n<p>Baptism forgives original sin and every personal sin committed before it.</p>\n<ol><li>Can Baptism be repeated?</li></ol>\n<p>No. Baptism gives an indelible character and can be received only once.</p>\n<h4>PRAYER</h4>\n<p>Heavenly Father, prepare me for the saving waters of Baptism and make me a faithful child of your Church. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Visit the baptismal font and make the Sign of the Cross with holy water if directed.</p>\n<p>14 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Make clear what God truly gives in Baptism and distinguish sacramental reality from outward appearance.</p>\n<h3>QUICK PREP</h3>\n<p>Bowl or cup of clean water; white card marked BEFORE and blue card marked AFTER.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If someone looks exactly the same five minutes after Baptism, has anything really changed?”</p>\n<h3>VISIBLE WATER - INVISIBLE GRACE</h3>\n<ol><li>Place the water between BEFORE and AFTER.</li><li>Ask what water normally does: washes, refreshes, gives life.</li><li>Now ask what only God can do in Baptism: forgive sin, give sanctifying grace, make us adopted children, join us to Christ and the Church, give an indelible character.</li><li>Say clearly: the water is a real sacramental sign through which Christ acts; it is not magic and not merely a symbol.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 11. Do not rehearse Baptism by pouring water over the child while saying the sacramental formula.</p>\n<h3>LESSON 11</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask which effect of Baptism seems most important to the child and why.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is Baptism? The sacrament of rebirth by water and the Holy Spirit. What sins does it forgive? Original sin and every personal sin committed before it.</strong></p>\n<p><strong>Can Baptism be repeated? No. It gives an indelible character.</strong></p>\n<h3>PRAY</h3>\n<p>Heavenly Father, prepare me for the saving waters of Baptism and make me a faithful child of your Church. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Visit the baptismal font and thank God for the grace he will give there.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the activity sacramentally reverent. Ordinary water may illustrate the sign, but only the Church’s real celebration is Baptism.</p>\n<h3>LESSON 12</h3>\n<details class=\"conv\"><summary>Open Lesson 12 &mdash; The Signs and Celebration of Baptism</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Cross, water, anointing, white garment and light reveal the new life Christ gives in Baptism.</p>\n<p>The child renounces sin and professes the Catholic faith. The water is blessed, and the priest or deacon baptises in the name of the Most Holy Trinity.</p>\n<p>Anointing with sacred chrism signifies sharing in Christ’s priestly, prophetic and royal dignity. The white garment shows that the newly baptised has put on Christ.</p>\n<p>The lighted candle, kindled from the Paschal candle, shows that Christ has enlightened the newly baptised, who must keep the flame of faith alive.</p>\n<p>Talk About It: Which sign of Baptism helps you most to understand what God is giving: water, anointing, the white garment or the candle? Why?</p>\n<p>(Water signifies cleansing and new birth; anointing signifies consecration; the white garment signifies putting on Christ; and the candle signifies Christ’s light and living faith.)</p>\n<p>Learn these answers</p>\n<ol><li>What must the child reject before Baptism?</li></ol>\n<p>The child must reject sin, Satan and all that leads away from God.</p>\n<ol><li>What faith does the child profess?</li></ol>\n<p>The Catholic faith in the Father, the Son, the Holy Spirit and the holy Catholic Church.</p>\n<ol><li>What does the white garment mean?</li></ol>\n<p>It shows that the baptised person has put on Christ and received new dignity.</p>\n<ol><li>What does the candle mean?</li></ol>\n<p>It signifies the light of Christ and the duty to keep faith alive.</p>\n<ol><li>Who ordinarily baptises?</li></ol>\n<p>A bishop, priest or deacon ordinarily baptises; in necessity anyone may baptise with the right intention, water and form.</p>\n<h4>PRAYER</h4>\n<p>Jesus, Light of the world, keep the flame of faith alive in me and make my life shine with good works. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Practise answering the baptismal promises clearly and freely.</p>\n<p>15 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Help the child read the signs of the rite: Cross, water, anointing, white garment and light.</p>\n<h3>QUICK PREP</h3>\n<p>A cross, bowl of water, small amount of ordinary oil/cream, white cloth, candle or battery candle.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Place the objects on a table. Ask: “Without saying anything, what do you think each object is trying to tell us?”</p>\n<h3>READ THE SIGNS</h3>\n<ol><li>Let the child choose one object at a time and say what it might mean.</li><li>Use the catechism to refine the meanings: Cross - belonging to Christ; water - cleansing/new birth; anointing - consecration; white garment - putting on Christ; candle - Christ’s light and living faith.</li><li>Ask which sign speaks most strongly to the child.</li><li>Practise only the spoken responses and promises - never a simulated Baptism.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 12 and Appendix B. Note that the child personally rejects sin and professes the Catholic faith.</p>\n<h3>LESSON 12</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what “keeping the flame of faith alive” might look like six months after Baptism.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What must the child reject? Sin, Satan and all that leads away from God.</strong></p>\n<p><strong>What faith is professed? The Catholic faith in Father, Son, Holy Spirit and the Church. What does the candle mean? Christ’s light and the duty to keep faith alive.</strong></p>\n<h3>PRAY</h3>\n<p>Jesus, Light of the world, keep the flame of faith alive in me and make my life shine with good works. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read the baptismal promises and practise answering them freely and clearly.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The child should know what they are saying yes and no to. Avoid drilling responses without meaning.</p>\n<h3>LESSON 13</h3>\n<details class=\"conv\"><summary>Open Lesson 13 &mdash; The Holy Eucharist and the Real Presence</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In the Holy Eucharist, Jesus Christ is truly, really and substantially present: Body, Blood, Soul and Divinity.</p>\n<p>At the Last Supper Jesus took bread and wine and declared them to be his Body and Blood. He commanded the Apostles, “Do this in remembrance of me.”</p>\n<p>At the consecration, the whole substance of bread and wine becomes Christ’s Body and Blood while the appearances remain. This change is called transubstantiation.</p>\n<p>The Eucharist is not merely a symbol. The whole risen Christ is present under either species and remains present as long as the Eucharistic appearances remain.</p>\n<p>Talk About It: After the consecration, the Host still looks like bread. Why do Catholics believe that it truly is Jesus?</p>\n<p>(We believe because Christ, who is Truth, declared the bread to be his Body and gave the Eucharist to his Church. Faith receives what his word reveals beyond what the senses can discover.)</p>\n<p>Learn these answers</p>\n<ol><li>When did Jesus institute the Eucharist?</li></ol>\n<p>At the Last Supper, on the night before he died.</p>\n<ol><li>Who is present in the Eucharist?</li></ol>\n<p>Jesus Christ is truly, really and substantially present.</p>\n<ol><li>What of Christ is present?</li></ol>\n<p>His Body, Blood, Soul and Divinity: the whole Christ.</p>\n<ol><li>What is transubstantiation?</li></ol>\n<p>The change of the whole substance of bread and wine into Christ’s Body and Blood.</p>\n<ol><li>Is the Eucharist merely a symbol?</li></ol>\n<p>No. It is a sacramental sign in which Jesus himself is truly present.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, I believe that you are truly present in the Blessed Sacrament. Increase my faith and love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Make a reverent visit to the tabernacle and say, “My Lord and my God.”</p>\n<p>16 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Help the child distinguish what the senses perceive from what Christ gives in the Eucharist.</p>\n<h3>QUICK PREP</h3>\n<p>An ordinary cracker or piece of bread in its packet; a Bible. Do not place ordinary food where it could be mistaken for the Blessed Sacrament.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Can our eyes tell us everything that is true?” Let the child give examples where we rely on trustworthy testimony.</p>\n<h3>WHAT THE EYES SEE - WHAT CHRIST SAYS</h3>\n<ol><li>Look at ordinary bread and list what the senses can tell: shape, smell, taste, texture.</li><li>Put it away. Open the Bible or catechism to Jesus’ words at the Last Supper.</li><li>Ask: “After consecration the Host still looks like bread. Why do Catholics believe Jesus is truly present?”</li><li>Use the catechism language: the whole substance changes; the appearances remain; Jesus is truly, really and substantially present.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 13. Use the catechism rather than inventing analogies for transubstantiation.</p>\n<h3>LESSON 13</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what “Amen” to the Body of Christ will mean when the child receives First Holy Communion.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Who is present in the Eucharist? Jesus Christ, truly, really and substantially. What is transubstantiation? The change of the whole substance of bread and wine into Christ’s Body and Blood.</strong></p>\n<p><strong>Is the Eucharist merely a symbol? No.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus, I believe that you are truly present in the Blessed Sacrament. Increase my faith and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make a short visit to the tabernacle and say quietly, “My Lord and my God.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>This is one of the key readiness points. Do not settle for “special bread.” The child should distinguish the consecrated Eucharist from ordinary food according to their capacity.</p>\n<h3>LESSON 14</h3>\n<details class=\"conv\"><summary>Open Lesson 14 &mdash; The Holy Sacrifice of the Mass</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Mass makes present sacramentally the one Sacrifice of Christ on Calvary and gives us his Body and Blood.</p>\n<p>Jesus offered himself once for all upon the Cross. At Mass the same Christ offers himself through the ministry of the priest; his one sacrifice is made present in an unbloody manner.</p>\n<p>The Liturgy of the Word and Liturgy of the Eucharist form one act of worship. We hear God’s word, profess faith, join Christ’s offering and receive the Bread of Life.</p>\n<p>The Mass is offered for adoration, thanksgiving, reparation and petition. We participate by attentive prayer and by offering our whole life with Jesus.</p>\n<p>Talk About It: Jesus died once upon the Cross. Does he die again at Mass? What happens instead?</p>\n<p>(Christ does not die again. His one perfect Sacrifice of Calvary is made sacramentally present in an unbloody manner; the same Christ offers himself through the ministry of the priest.)</p>\n<p>Learn these answers</p>\n<ol><li>What is the Mass?</li></ol>\n<p>The sacrifice in which Christ makes present and offers sacramentally his one Sacrifice of the Cross.</p>\n<ol><li>Does Jesus die again at Mass?</li></ol>\n<p>No. His one perfect sacrifice is made present sacramentally.</p>\n<ol><li>What are the two principal parts?</li></ol>\n<p>The Liturgy of the Word and the Liturgy of the Eucharist.</p>\n<ol><li>Who can consecrate the Eucharist?</li></ol>\n<p>A validly ordained bishop or priest.</p>\n<ol><li>How should we take part?</li></ol>\n<p>With faith, attention, prayer, responses, silence and self-offering.</p>\n<h4>PRAYER</h4>\n<p>Eternal Father, I offer myself with Jesus in the Holy Sacrifice of the Mass. Accept my whole life through him. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Use Appendix C during Sunday Mass and notice each principal part.</p>\n<p>17 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Connect Calvary and the Mass without suggesting that Jesus dies again.</p>\n<h3>QUICK PREP</h3>\n<p>Crucifix; two cards: CALVARY and MASS.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Place the crucifix by CALVARY. Ask: “How many times did Jesus die?” Then place MASS beside it.</p>\n<h3>ONE SACRIFICE MADE PRESENT</h3>\n<ol><li>Ask the child to tell what happened on Calvary.</li><li>Ask what happens at Mass. Listen for “Jesus dies again” and gently correct if needed.</li><li>Place the crucifix between the two cards and say: one sacrifice, once for all; at Mass that one sacrifice is made sacramentally present.</li><li>Name the two principal parts of Mass and ask what the child does in each.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 14 and Appendix C.</p>\n<h3>LESSON 14</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what the child could spiritually offer with Jesus at the next Mass: a joy, worry, person, sacrifice or act of love.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is the Mass? Christ makes present and offers sacramentally his one Sacrifice of the Cross.</strong></p>\n<p><strong>Does Jesus die again? No. What are the two principal parts? Liturgy of the Word and Liturgy of the Eucharist.</strong></p>\n<h3>PRAY</h3>\n<p>Eternal Father, I offer myself with Jesus in the Holy Sacrifice of the Mass. Accept my whole life through him. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, notice one moment in the Liturgy of the Word and one in the Liturgy of the Eucharist.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the language simple but accurate: “made present” is better than saying the Mass merely “reminds us” of Calvary.</p>\n<h3>LESSON 15</h3>\n<details class=\"conv\"><summary>Open Lesson 15 &mdash; Receiving First Holy Communion</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>We receive Jesus worthily with faith, the state of grace, the Eucharistic fast and reverent thanksgiving.</p>\n<p>A newly baptised child comes from Baptism free from every sin. If First Holy Communion follows within the initiation celebration, no Confession precedes it.</p>\n<p>If there is a real interval after Baptism and the child commits a mortal sin, sacramental absolution is required before Communion. When uncertain, the child should speak privately with the priest.</p>\n<p>The communicant observes the one-hour fast, approaches reverently, answers “Amen”, receives according to approved practice, consumes the Sacred Host immediately and gives thanks.</p>\n<p>Talk About It: When the minister says “The Body of Christ” and you answer “Amen”, what are you saying yes to?</p>\n<p>(“Amen” means “I believe”. The child professes that the consecrated Host is truly Jesus Christ and promises to receive him with faith, reverence and love.)</p>\n<p>Learn these answers</p>\n<ol><li>Whom do you receive in Holy Communion?</li></ol>\n<p>I receive Jesus Christ, Body, Blood, Soul and Divinity.</p>\n<ol><li>Does an unbaptised child make Confession before Baptism?</li></ol>\n<p>No. Baptism itself forgives every previous sin.</p>\n<ol><li>What if mortal sin is committed after Baptism?</li></ol>\n<p>The person must receive sacramental absolution before Holy Communion.</p>\n<ol><li>What is the Eucharistic fast?</li></ol>\n<p>No food or drink for at least one hour before Communion, except water and medicine.</p>\n<ol><li>What do you answer to “The Body of Christ”?</li></ol>\n<p>I answer “Amen”.</p>\n<h4>PRAYER</h4>\n<p>Come, Lord Jesus. Make my heart ready to receive you with faith, reverence and love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Practise the Communion procession and approved manner of reception with your catechist.</p>\n<p>18 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4></div></details>\n<h3>AIM</h3>\n<p>Prepare the child practically and spiritually to receive, especially the meaning of “Amen.”</p>\n<h3>QUICK PREP</h3>\n<p>Two chairs for a simple procession; an unconsecrated practice host only if parish practice permits.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When the minister says ‘The Body of Christ’ and you say ‘Amen’, what are you saying yes to?”</p>\n<h3>PRACTISE THE MEANING, NOT JUST THE MOVEMENTS</h3>\n<ol><li>Walk through the Communion procession calmly.</li><li>Practise the exchange: “The Body of Christ.” - “Amen.” Ask the child to explain Amen in their own words.</li><li>Rehearse the approved manner of receiving and immediate consumption, according to parish practice.</li><li>Review the one-hour fast and what to do if unsure about receiving.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 15 and Appendix C. Note carefully: an unbaptised child does not make Confession before Baptism; Baptism forgives every previous sin.</p>\n<h3>LESSON 15</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask how the child can prepare their heart as well as their body for Communion.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Whom do you receive? Jesus Christ, Body, Blood, Soul and Divinity.</strong></p>\n<p><strong>Does an unbaptised child confess before Baptism? No. Baptism forgives every previous sin. What does “Amen” mean here? I believe.</strong></p>\n<h3>PRAY</h3>\n<p>Come, Lord Jesus. Make my heart ready to receive you with faith, reverence and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With an adult, work out the Eucharistic fast and practise a short thanksgiving prayer.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>If Baptism and First Communion are celebrated together, the child comes from Baptism free from every sin. Do not accidentally import the First Confession pathway into this one.</p>\n<h3>LESSON 16</h3>\n<details class=\"conv\"><summary>Open Lesson 16 &mdash; Living as a New Catholic</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The newly baptised perseveres in Sunday Mass, prayer, virtue, charity and the sacraments, and later prepares for Confirmation.</p>\n<p>Baptism begins a new life; it is not a graduation. The neophyte needs the support of family, godparent and parish to persevere in worship, doctrine and charity.</p>\n<p>After Baptism, ordinary sins are forgiven through sincere repentance; grave sins require sacramental Confession, and Catholics are encouraged to confess venial sins regularly.</p>\n<p>Baptism, Confirmation and Eucharist belong together as the sacraments of Christian initiation. Where Confirmation is celebrated later, the young Catholic continues towards it and should not regard initiation as complete.</p>\n<p>Talk About It: What could show, six months after Baptism and First Holy Communion, that these sacraments have become part of your life?</p>\n<p>(Look for Mass, prayer, Confession, parish belonging, learning and a desire for Confirmation.)</p>\n<p>Learn these answers</p>\n<ol><li>What duties follow Baptism?</li></ol>\n<p>To remain faithful to Christ, worship at Sunday Mass, pray, obey God and love our neighbour.</p>\n<ol><li>What sacrament forgives sins committed after Baptism?</li></ol>\n<p>The Sacrament of Penance forgives sins committed after Baptism.</p>\n<ol><li>Why receive Holy Communion often?</li></ol>\n<p>To be united more closely to Christ and strengthened in grace and charity.</p>\n<ol><li>Is Christian formation finished after First Communion?</li></ol>\n<p>No. Catholics continue learning and growing throughout life.</p>\n<ol><li>What sacrament will strengthen baptismal grace later?</li></ol>\n<p>Confirmation will strengthen and complete baptismal grace with the special outpouring of the Holy Spirit.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, remain with me by your grace. Keep me faithful to your Church and prepare me to receive Confirmation fruitfully. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose a simple Catholic rule of life: daily prayer, Sunday Mass, regular Confession and one act of charity each week.</p>\n<p>19 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>Appendix A</p>\n<p>The Journey Step by Step</p>\n<p>The journey is not a rigid school course. Its periods and rites serve conversion and are adapted to the child’s age, capacity, family circumstances and spiritual progress.</p>\n<p>Sta Name What it means ge</p>\n<p>The child and family ask questions, meet the 1 Enquiry parish and begin attending Sunday Mass.</p>\n<p>The Church welcomes the child among the 2 Acceptance catechumens and signs the senses with the Cross.</p>\n<p>Catechumen The child learns Catholic faith, practises prayer 3 ate and conversion, joins worship and serves others.</p>\n<p>The priest, family, godparent and catechists 4 Discernment consider readiness; the child freely expresses the desire for Baptism.</p>\n<p>Immediate preparation includes prayer, 5 Purification repentance, the Creed, the Our Father and the preparatory rites.</p>\n<p>Baptism and First Holy Communion are celebrated 6 Initiation according to the authorised parish arrangement.</p>\n<p>The newly baptised reflects upon the sacraments, 7 Mystagogy becomes rooted in parish life and continues towards later Confirmation.</p>\n<p>20 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>Appendix B</p>\n<p>The Rite of Baptism Step by Step</p>\n<p>The exact celebration follows the approved liturgical book and the directions of the celebrant. These signs help the child understand what the Church is doing.</p>\n<ol><li>Calling by name. The child is presented and freely asks for faith and Baptism.</li><li>Sign of the Cross. Christ claims the child; the Cross marks the beginning of discipleship.</li><li>Word of God. God calls, teaches and awakens faith through Scripture.</li><li>Litany and prayer. The Church asks the saints’ intercession and prays for deliverance from evil.</li><li>Blessing of water. God is praised for his saving work through water and the Holy Spirit.</li><li>Renunciation and faith. The child rejects sin and professes the faith of the Church.</li><li>Baptism. Water is poured or the child is immersed while the Trinitarian form is spoken.</li><li>Anointing. Sacred chrism signifies union with Christ and consecration to God.</li><li>White garment. The newly baptised has put on Christ and must preserve baptismal dignity.</li><li>Lighted candle. Christ gives light; faith must be kept burning.</li><li>Eucharist. The newly baptised joins the faithful at the altar and receives the Lord’s</li></ol>\n<p>Body and Blood.</p>\n<h4>LITURGICAL NOTE</h4>\n<p>Where Confirmation is lawfully deferred, the post-baptismal anointing with chrism is not the Sacrament of Confirmation. The later Confirmation catechism should make this distinction clear.</p>\n<p>21 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>Appendix C</p>\n<p>A Child’s Guide to Mass and Communion</p>\n<p>Part What I do and understand</p>\n<p>Introductory We gather, make the Sign of the Cross, ask mercy, Rites praise God and pray.</p>\n<p>Liturgy of the We listen to Scripture and the homily, profess faith Word and offer intercessions.</p>\n<p>Preparation of Bread and wine are brought; we offer ourselves with Gifts them.</p>\n<p>Eucharistic The Church gives thanks; by the Holy Spirit and Prayer Christ’s words, the gifts become his Body and Blood.</p>\n<p>Communion Rite We pray the Our Father, ask peace and prepare to receive the Lamb of God.</p>\n<p>Holy The minister says “The Body of Christ”; I answer Communion “Amen”, receive reverently and consume at once.</p>\n<p>Thanksgiving I adore Jesus, thank him, offer myself and pray for others.</p>\n<p>Dismissal Christ sends us to live the Gospel and serve our neighbour.</p>\n<h4>BEFORE COMMUNION</h4>\n<p>I am baptised, properly disposed and have fasted for one hour from food and drink, except water and medicine. I approach because I believe and desire to receive Jesus.</p>\n<p>22 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>Appendix D</p>\n<p>Prayers to Learn and Pray</p>\n<p>Sign of the Cross</p>\n<h4>PRAY</h4>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<p>Our Father</p>\n<h4>PRAY</h4>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<p>Hail Mary</p>\n<h4>PRAY</h4>\n<p>Hail Mary, full of grace, the Lord is with thee; blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.</p>\n<p>Glory Be</p>\n<h4>PRAY</h4>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<p>Act of Contrition</p>\n<h4>PRAY</h4>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<p>Before Communion</p>\n<h4>PRAY</h4>\n<p>Lord, I am not worthy that you should enter under my roof, but only say the word and my soul shall be healed.</p>\n<p>After Communion</p>\n<h4>PRAY</h4>\n<p>Lord Jesus, I adore you and thank you for giving yourself to me. Keep me close to you and make my life pleasing to you. Amen.</p>\n<p>23 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>A short examination of conscience</p>\n<p>Have I prayed and worshipped God faithfully? Have I used God’s name with reverence? Have I obeyed and respected my parents, carers and teachers? Have I been truthful, kind, fair and ready to forgive? Have I taken what was not mine or damaged another person’s property? Have I misused the internet, excluded someone or joined in cruelty? What good have I failed to do?</p>\n<h4>REMEMBER</h4>\n<p>Before Baptism, bring every sin to God in repentance; Baptism will wash every previous sin away. After Baptism, learn to use the Sacrament of Penance faithfully.</p>\n<p>24 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>Appendix E</p>\n<p>Summary Catechism</p>\n<ol><li>Why did God make you? God made me to know him, love him and serve him in this life, and to be happy with him for ever in heaven.</li><li>What is grace? Grace is God’s free gift of his own life and help.</li><li>How many gods are there? There is one God.</li><li>Who is the Most Holy Trinity? The Father, the Son and the Holy Spirit: three divine Persons in one God.</li><li>Who created the world? God created the world from nothing and made it good.</li><li>What is original sin? Original sin is the fallen condition in which we are born without original holiness and justice.</li><li>Who is Jesus Christ? Jesus Christ is the eternal Son of God made man.</li><li>Is Jesus true God? Yes. Jesus is true God, equal to the Father.</li><li>How did Jesus redeem us? By his suffering, death and Resurrection.</li><li>What is the Cross? The Cross is the altar upon which Jesus offered himself for our salvation.</li><li>Who is the Holy Spirit? The Holy Spirit is the third Person of the Most Holy Trinity.</li><li>Who founded the Catholic Church? Jesus Christ founded the Catholic Church.</li><li>What is faith? Faith is the gift by which we believe God and all that he has revealed.</li><li>Where is God’s revelation handed on? In Sacred Scripture and Sacred Tradition.</li><li>What is prayer? Prayer is raising the mind and heart to God.</li><li>What is the perfect prayer? The Our Father is the perfect prayer taught by Jesus.</li><li>What do the commandments teach? They teach us how to love God and our neighbour.</li><li>What three things are required for mortal sin? Grave matter, full knowledge and deliberate consent.</li><li>What is a catechumen? An unbaptised person whom the Church has formally accepted for preparation for Baptism.</li></ol>\n<p>25 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<ol><li>Is the catechumenate only a course? No. It is an apprenticeship in the whole Christian life.</li><li>What is Baptism? The sacrament of rebirth by water and the Holy Spirit.</li><li>What is the matter of Baptism? True natural water used by immersion or pouring.</li><li>What must the child reject before Baptism? The child must reject sin, Satan and all that leads away from God.</li><li>What faith does the child profess? The Catholic faith in the Father, the Son, the Holy Spirit and the holy Catholic Church.</li><li>When did Jesus institute the Eucharist? At the Last Supper, on the night before he died.</li><li>Who is present in the Eucharist? Jesus Christ is truly, really and substantially present.</li><li>What is the Mass? The sacrifice in which Christ makes present and offers sacramentally his one Sacrifice of the Cross.</li><li>Does Jesus die again at Mass? No. His one perfect sacrifice is made present sacramentally.</li><li>Whom do you receive in Holy Communion? I receive Jesus Christ, Body, Blood, Soul and Divinity.</li><li>Does an unbaptised child make Confession before Baptism? No. Baptism itself forgives every previous sin.</li><li>What duties follow Baptism? To remain faithful to Christ, worship at Sunday Mass, pray, obey God and love our neighbour.</li><li>What sacrament forgives sins committed after Baptism? The Sacrament of Penance forgives sins committed after Baptism.</li><li>What are the three sacraments of Christian initiation? Baptism, Confirmation and the Holy Eucharist.</li><li>What remains to be received later in this parish pathway? Confirmation remains to be received after its own preparation.</li><li>What is the effect of Baptism on earlier sins? Baptism forgives original sin and every personal sin committed before it.</li><li>Whom do we receive in Holy Communion? Jesus Christ, Body, Blood, Soul and Divinity.</li></ol>\n<p>26 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>Appendix F</p>\n<p>Readiness and Parish Guide</p>\n<p>Readiness is not perfect memory. The child should show a sincere desire for Baptism, sufficient understanding according to capacity, developing conversion, regular participation in Sunday worship and a real beginning of Christian life.</p>\n<p>Area What readiness looks like Ready</p>\n<p>The child personally asks for Baptism and can express Free desire why.</p>\n<p>Faith in The child knows the central Gospel: creation, sin, Christ’s Christ saving death and Resurrection, and the call to faith.</p>\n<p>The child accepts the Trinity, the Church, the Creed, prayer Catholic faith and the moral life according to capacity.</p>\n<p>The child can recognise wrongdoing, show sorrow, seek Conversion forgiveness and make amends.</p>\n<p>The child understands that Baptism truly forgives sin, gives Baptism grace and incorporates into Christ and the Church.</p>\n<p>The child distinguishes the Body of Christ from ordinary Eucharist food and believes the Real Presence.</p>\n<p>The child and family have begun a stable pattern of Sunday Sunday life Mass and parish belonging.</p>\n<p>Practical The child can participate in the baptismal promises and readiness receive Communion reverently with suitable adaptations.</p>\n<p>Continuing The family understands that mystagogy, Confession and formation later Confirmation remain part of the journey.</p>\n<p>27 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>Parish working checklist</p>\n<p>Confirm that no prior valid Baptism exists; obtain records or investigate doubt before any conditional Baptism. Record parental consent and the child’s free request; identify any questions of parental responsibility. Appoint a suitable godparent who meets canonical requirements. Celebrate the proper stages and rites; do not reduce the journey to classroom instruction. Agree reasonable adjustments and comply with diocesan safeguarding requirements. Confirm with the parish priest and, where needed, the Diocese of Nottingham, the lawful basis and rite for deferring Confirmation. Enter Baptism, First Holy Communion and later Confirmation accurately in the sacramental registers. Arrange mystagogy, future First Confession and continuing preparation for Confirmation.</p>\n<h4>SAFEGUARDING</h4>\n<p>Preparation must respect the child’s dignity, capacity, privacy and safety. No child should be shamed, frightened, publicly tested or pressured to receive a sacrament. Follow the current Diocese of Nottingham safeguarding policy and parish procedures.</p>\n<p>28 Page</p>\n<h4>MY CHRISTIAN INITIATION CATECHISM</h4>\n<p>Sources and doctrinal references</p>\n<p>Sacred Scripture. References and short phrases follow the English Standard Version - Catholic Edition.</p>\n<p>Catechism of the Catholic Church. Nos. 1-1065 on the profession of faith; 1210-1419 on Baptism, Confirmation and Eucharist; 1691-2557 on Christian life and prayer.</p>\n<p>Compendium of the Catechism of the Catholic Church. Especially questions 1-294 on revelation, the Creed and the sacraments of initiation.</p>\n<p>Code of Canon Law. Canons 206, 788, 852, 865-866, 872-874, 879-896 and 912-923.</p>\n<p>Rite of Christian Initiation of Adults. Part II, chapter 1: Christian initiation of children who have reached catechetical age; use the edition approved for England and Wales.</p>\n<p>Liturgy Office of England and Wales. Guidance on the sacraments of initiation at the Easter Vigil, recognising Baptism, Confirmation and Eucharist together as the norm for children of catechetical age.</p>\n<p>Diocese of Nottingham. Current safeguarding resources and the diocesan listing of Societas Doctrinae Christianae materials for RCIC.</p>\n<p>Joseph Deharbe, S.J.. A Full Catechism of the Catholic Religion, adapted rather than reproduced, with present terminology and discipline.</p>\n<p>Doctrinal and canonical standard</p>\n<p>Baptism, Confirmation and Eucharist form one sacramental initiation. Canon law ordinarily requires a person who has reached the use of reason and is baptised to be confirmed immediately afterwards and to receive the Eucharist, unless a grave reason prevents it. Therefore, any parish practice of later Confirmation must be applied only under competent ecclesiastical direction; this catechism does not itself supply that authorisation.</p>\n<p>Where terminology, dates or practical instructions change, the approved liturgical books, current Diocese of Nottingham policy and the directions of the parish priest govern.</p>\n<p>29 Page</p></div></details>\n<h3>AIM</h3>\n<p>Make clear that Baptism and First Communion begin a life of discipleship; they are not a graduation.</p>\n<h3>QUICK PREP</h3>\n<p>A weekly calendar or blank piece of paper. Four cards: MASS, PRAYER, MERCY, SERVICE.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Imagine it is six months after your Baptism. What would show that being Catholic has become part of your life?”</p>\n<h3>BUILD A SIMPLE RULE OF LIFE</h3>\n<ol><li>Put MASS, PRAYER, MERCY and SERVICE on the table.</li><li>For each, choose one realistic habit: Sunday Mass; short daily prayer; learning to use Confession after Baptism; one act of charity or parish service.</li><li>Write the habits onto a weekly or monthly calendar.</li><li>Add one future step: continuing formation and preparation for Confirmation according to the parish pathway.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 16 and the final readiness material.</p>\n<h3>LESSON 16</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask which habit will be easiest, which will be hardest, and who will help the child keep going.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What duties follow Baptism? Faithfulness to Christ, Sunday Mass, prayer, obedience to God and love of neighbour.</strong></p>\n<p><strong>What sacrament forgives serious sins after Baptism? Penance and Reconciliation.</strong></p>\n<p><strong>Is formation finished after First Holy Communion? No. Catholic growth continues throughout life.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus, remain with me by your grace. Keep me faithful to your Church and help me grow in holiness. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Begin the simple rule of life now rather than waiting until after Baptism.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The child needs a real community around them. A rule of life is only useful if family, godparent, mentor and parish help make it possible. Use this as a pastoral overview, not as a timetable.</p>\n<p><strong>Stage What is happening</strong></p>\n<p><strong>Enquiry Questions, welcome and Sunday Mass.</strong></p>\n<p><strong>Acceptance The Church welcomes the child among the catechumens.</strong></p>\n<p><strong>Catechumenate Faith, prayer, conversion, worship and belonging deepen.</strong></p>\n<p><strong>Discernment Child, family, mentor and priest consider readiness.</strong></p>\n<p><strong>Purification Prayer, repentance, Creed and Our Father.</strong></p>\n<p><strong>Initiation Baptism and First Holy Communion according to the authorised arrangement.</strong></p>\n<p><strong>Mystagogy Life from the sacraments; continuing formation towards Confirmation.</strong></p>\n<h3>IMPORTANT ABOUT CONFIRMATION</h3>\n<p>The source catechism notes that Baptism, Confirmation and Eucharist ordinarily belong together for an unbaptised child who has reached the age of reason, while this parish pathway prepares for Confirmation later. That arrangement must follow the directions of the parish priest and any competent diocesan permission or policy. Readiness is not perfect memory or finishing sixteen meetings. Look for a growing Christian life.</p>\n<h3>FREE DESIRE</h3>\n<p>The child personally wants Baptism and can say simply why.</p>\n<h3>FAITH IN CHRIST</h3>\n<p>The child knows the central Gospel and trusts Jesus as Saviour.</p>\n<h3>CATHOLIC FAITH</h3>\n<p>The child can receive the Trinity, Church, Creed, prayer and moral life according to capacity.</p>\n<h3>CONVERSION</h3>\n<p>The child can recognise deliberate wrongdoing, repent and make amends.</p>\n<h3>BAPTISM</h3>\n<p>The child knows Baptism truly forgives sin, gives grace and joins us to Christ and the Church.</p>\n<h3>EUCHARIST</h3>\n<p>The child distinguishes the Body of Christ from ordinary food and believes the Real Presence.</p>\n<h3>SUNDAY LIFE</h3>\n<p>The child and family are developing a stable pattern of Sunday Mass and parish belonging.</p>\n<h3>PRACTICAL READINESS</h3>\n<p>The child can participate in the promises and receive Communion reverently with needed adaptations.</p>\n<h3>CONTINUING FORMATION</h3>\n<p>The family understands that mystagogy, future Confession and continuing preparation remain part of the journey.</p>\n<h3>FOR THE PRIEST</h3>\n<p>Final sacramental and canonical discernment belongs to the priest, following the approved rites, current Church law and diocesan direction.</p>\n<h3>The best meetings will not all look the same.</h3>\n<p>Sometimes the child will want to talk. Sometimes the object or activity will unlock the teaching. Sometimes one sentence from the catechism will be enough. Sometimes a question will need to be carried to the next meeting.</p>\n<h3>KEEP THE ORDER SIMPLE</h3>\n<p>Person first. Activity second. Catechism for the teaching. Conversation. Prayer. One next step.</p>\n<h3>DO NOT RUSH</h3>\n<p>A child who has reached the age of reason is making a real catechumenal journey. Understanding, conversion, Sunday worship, desire and belonging matter more than completing pages quickly.</p>\n<h3>KEEP CHRIST AT THE CENTRE</h3>\n<p>The goal is not that the child can pass a Catholic quiz. The goal is that the child comes to know Jesus Christ, freely asks for Baptism, receives the sacraments with faith and begins to live as a Catholic disciple.</p>"}, {"name": "Baptised Children Coming into the Church", "url": "https://3stepuk.github.io/Coming-into-the-Catholic-Church-Child/", "desc
