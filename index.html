": "For baptised children entering full communion.", "html": "<p>For validly baptised children of catechetical age</p>\n<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>Use with Coming into the Catholic Church A Preparation Catechism for Baptised Children. The catechism gives the teaching; this guide helps a parent, mentor or priest make it personal and memorable.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the child</li><li>Do something concrete</li><li>Open the catechism</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>THE SACRAMENTAL PATHWAY</h3>\n<p>First Confession before Reception. Profession of Faith and Reception, then Confirmation and First Holy Communion ordinarily within the same Mass.</p>\n<h2>How to use this guide</h2>\n<h3>THE PRINCIPLE</h3>\n<p>The child is already Christian through Baptism. Honour what God has given and accompany a free, sincere desire for full Catholic communion.</p>\n<h3>For each lesson</h3>\n<ol><li>Make the Sign of the Cross and ask the opening question. Listen before explaining.</li><li>Try the activity. All cards can be handwritten; drawing and speaking are equally welcome.</li><li>Open the matching catechism lesson. Read the indicated teaching slowly and pause for questions.</li><li>Talk together. Use the short answers to clarify what needs to be understood.</li><li>Pray the printed prayer and choose one action for the week.</li><li>Repeat or adapt as needed. Sixteen lessons do not require sixteen meetings or a fixed timetable.</li></ol>\n<h3>BEFORE YOU BEGIN</h3>\n<p>The priest must establish valid Baptism and the correct pathway. A Catholic Baptism, doubtful Baptism, Eastern Christian background or previous Confirmation needs his particular guidance.</p>\n<h3>The adult alongside</h3>\n<p>You need no prepared talk. The activity opens the conversation; the catechism supplies the teaching. Take difficult questions to the priest. Adjust to the child’s age, language and capacity.</p>\n<h2>A small activity kit</h2>\n<p>Keep it simple. Use ordinary items already at home or in church. No craft kit or separate workbook is needed.</p>\n<h3>Paper and a pen</h3>\n<p>Names, cards, choices, gifts of the Holy Spirit and a simple calendar.</p>\n<h3>A crucifix or cross</h3>\n<p>Jesus our Saviour, the Cross and the Holy Sacrifice of the Mass.</p>\n<h3>The preparation catechism</h3>\n<p>All sixteen lessons, the Creed, prayers and the practical sacramental guides.</p>\n<h3>An optional Bible</h3>\n<p>A familiar Gospel story. The activities can use the catechism alone.</p>\n<h3>A cup of water</h3>\n<p>A visual reminder of Baptism already received. No water is poured over anyone.</p>\n<h3>A church visit</h3>\n<p>The font, altar, ambo, tabernacle and place of Confession, when access is arranged.</p>\n<h3>A chair or clear floor space</h3>\n<p>A calm walk through movements and spoken responses.</p>\n<h3>REHEARSE RESPONSES AND MOVEMENTS</h3>\n<p>Do not act out sacramental absolution, anoint with chrism or imitate a consecration. Any ordinary bread remains ordinary food. The real celebration uses the approved rite.</p>\n<h2>God Calls Me to Follow Jesus</h2>\n<h3>AIM</h3>\n<p>Help the child speak about becoming Catholic as their own response to Jesus.</p>\n<h3>QUICK PREP</h3>\n<p>Paper and a pen, or simply a conversation.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Who has helped you know Jesus? What makes you want to become Catholic?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>My name and my response</strong></p>\n<ol><li>Write the child’s name. Around it, add people who have helped them learn about God.</li><li>Ask the child to name something they already love about Jesus and something they want to understand.</li><li>Write “Jesus calls me” beneath the name. Ask: “How could you answer him at home, at school and in church?”</li><li>Finish with the child’s own question or hope. Leave room for an answer that is still growing.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 1, especially grace, discipleship and the freedom of the child’s response.</p>\n<details class=\"conv\"><summary>Open Lesson 1 &mdash; God Calls Me to Follow Jesus</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God created me out of love and calls me to know, love and follow Jesus Christ in his Church.</p>\n<p>God made every person in his image. He knows us, loves us and calls each of us by name. Our deepest happiness is friendship with God in this life and for ever in heaven.</p>\n<p>Jesus welcomes children and calls them to be his disciples. A disciple listens to Jesus, trusts him, turns away from sin and learns to live as he teaches.</p>\n<p>God does not force faith. His grace comes first and helps us answer freely. Coming into the Catholic Church must be a sincere response to Christ, not something done only because other people expect it.</p>\n<p>Talk About It: What do you think Jesus is inviting you to receive and to begin by coming into the Catholic Church?</p>\n<p>(Let the child speak freely. Help them name friendship with Jesus, truth, the Sacraments, prayer and belonging to his Church. Avoid supplying a rehearsed answer too quickly.)</p>\n<p>Learn these answers</p>\n<ol><li>Why did God make you?</li></ol>\n<p>God made me to know him, love him and serve him in this life, and to be happy with him for ever in heaven.</p>\n<ol><li>Who is a disciple?</li></ol>\n<p>A disciple is someone who believes in Jesus, learns from him and follows him.</p>\n<ol><li>What is grace?</li></ol>\n<p>Grace is God&#x27;s free gift of his own life and help.</p>\n<ol><li>Does God force anyone to believe?</li></ol>\n<p>No. God gives grace and invites us to answer freely.</p>\n<ol><li>Why do you wish to become Catholic?</li></ol>\n<p>I wish to follow Jesus Christ and live the whole Catholic faith in his Church.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, thank you for calling me by name. Help me to know you, love you and follow you freely and faithfully. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Make the Sign of the Cross each morning and ask Jesus to guide your choices.</p>\n<p>4 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>God Calls Me to Follow Jesus</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What is the difference between following Jesus and only knowing facts about him?”</li><li>“What would help you follow him more closely?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why did God make you? To know, love and serve him, and to be happy with him for ever. Does God force faith? No. His grace helps us answer freely. Why do you want to become Catholic? Let the child give a sincere answer in their own words.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, thank you for calling me by name. Help me know you, love you and follow you freely. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each morning say: “Jesus, guide me today.” Choose one action that answers this prayer.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Listen for personal desire rather than a rehearsed answer. Hesitation can be discussed gently; never pressure the child into saying what adults want.</p>\n<h2>The One God Father Son and Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Give a clear understanding of one God in three divine Persons.</p>\n<h3>QUICK PREP</h3>\n<p>Three handwritten cards: FATHER, SON, HOLY SPIRIT.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Make the Sign of the Cross. Ask: “Whom did we name? How many Gods are there?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One God and three Persons</strong></p>\n<ol><li>Lay out the three cards. Ask whether the Father, the Son and the Holy Spirit are each truly God.</li><li>Ask: “Does this mean three gods?” Read the catechism’s answer before going further.</li><li>Write ONE GOD above the cards. Explain: each Person is wholly God; the Persons are distinct, not three parts of God.</li><li>Ask how the Sign of the Cross recalls the child’s Baptism. Make it again slowly.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 2. Use its wording about the one divine nature and Baptism in the name of the Trinity.</p>\n<details class=\"conv\"><summary>Open Lesson 2 &mdash; The One God: Father, Son and Holy Spirit</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>There is one God in three divine Persons: the Father, the Son and the Holy Spirit.</p>\n<p>There is only one God. He is eternal, all-holy, all-knowing, almighty and perfectly good. He created all that exists and holds everything in being.</p>\n<p>The one God is the Most Holy Trinity: Father, Son and Holy Spirit. The three Persons are not three gods. Each Person is truly God, and all three share the one divine nature.</p>\n<p>At Baptism, water was used with the name of the Father, and of the Son, and of the Holy Spirit. The Sign of the Cross reminds us that we belong to the Trinity through Christ.</p>\n<p>Talk About It: What does the Sign of the Cross tell us about God and about your Baptism?</p>\n<p>(It professes one God in three Persons and recalls that the child was baptised into the Trinity and now belongs to Christ.)</p>\n<p>Learn these answers</p>\n<ol><li>How many gods are there?</li></ol>\n<p>There is one God.</p>\n<ol><li>Who is the Most Holy Trinity?</li></ol>\n<p>The Father, the Son and the Holy Spirit: three divine Persons in one God.</p>\n<ol><li>Is each Person truly God?</li></ol>\n<p>Yes. The Father, Son and Holy Spirit are each truly and wholly God.</p>\n<ol><li>Are there three gods?</li></ol>\n<p>No. There is only one God and one divine nature.</p>\n<ol><li>In whose name were you baptised?</li></ol>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit.</p>\n<h4>PRAYER</h4>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Make the Sign of the Cross slowly, naming each divine Person with attention.</p>\n<p>5 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>The One God Father Son and Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do we begin prayer in the name of the Father, Son and Holy Spirit?”</li><li>“What does it mean that you already belong to Christ through Baptism?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How many Gods are there? One God. Who is the Holy Trinity? Father, Son and Holy Spirit: three divine Persons in one God. Is each Person truly God? Yes. Each is truly and wholly God.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make the Sign of the Cross carefully each day, naming the three divine Persons.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The cards name the Persons; they do not explain God’s nature. Avoid analogies that suggest three gods, three parts or one Person wearing different disguises.</p>\n<h2>Creation Sin and the Promise of Salvation</h2>\n<h3>AIM</h3>\n<p>Connect God’s good creation, the reality of sin and his promise of a Saviour.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: GOOD, SIN, SAVIOUR.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What is something beautiful God made? Why do we also see things going wrong?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Goodness sin and mercy</strong></p>\n<ol><li>Under GOOD, name people and created things for which the child is grateful.</li><li>Under SIN, use invented examples of lying, cruelty and selfishness. Explain that human wrongdoing does not make God’s creation evil.</li><li>Place SAVIOUR beside them. Say: God did not abandon us; he promised and sent Jesus.</li><li>Ask: “If I have chosen something wrong, what does turning back to God look like?” Name sorrow, asking forgiveness and making amends.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 3. Distinguish original sin from a personal wrong choice. Baptism has already forgiven the child’s original sin.</p>\n<details class=\"conv\"><summary>Open Lesson 3 &mdash; Creation, Sin and the Promise of Salvation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God made all things good; sin wounded human life, but God promised a Saviour.</p>\n<p>God created the visible and invisible world from nothing. Human beings were made in his image, with intellect and free will, and were created for holiness and friendship with him.</p>\n<p>Our first parents disobeyed God. Original sin is the fallen condition inherited by the human family. Personal sin is a deliberate thought, word, deed or omission against God&#x27;s law.</p>\n<p>God did not abandon sinners. He promised salvation, formed the people of Israel and prepared the world for Jesus Christ. God&#x27;s mercy calls us to repentance, but it never makes sin unimportant.</p>\n<p>Talk About It: Why do we need both God&#x27;s truth about sin and God&#x27;s promise of mercy?</p>\n<p>(Truth helps us recognise what harms our friendship with God; mercy gives hope, forgiveness and grace to begin again. Neither should be separated from the other.)</p>\n<p>Learn these answers</p>\n<ol><li>Who created the world?</li></ol>\n<p>God created the world from nothing and made it good.</p>\n<ol><li>What is original sin?</li></ol>\n<p>Original sin is the fallen condition in which we are born without original holiness and justice.</p>\n<ol><li>What is personal sin?</li></ol>\n<p>Personal sin is a deliberate thought, word, deed or omission against God&#x27;s law.</p>\n<ol><li>Did God abandon us after sin entered the world?</li></ol>\n<p>No. God promised and sent a Saviour.</p>\n<ol><li>Who is our Saviour?</li></ol>\n<p>Jesus Christ is our Saviour.</p>\n<h4>PRAYER</h4>\n<p>Merciful Father, you made me for goodness. Save me from sin and teach me to choose what is true and right. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>With an adult, name one accident, one temptation and one deliberate wrong choice. Explain the difference.</p>\n<p>6 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>Creation Sin and the Promise of Salvation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does God tell us the truth about sin?”</li><li>“Why does his mercy give us hope to begin again?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who created the world? God created it from nothing and made it good. What is personal sin? A deliberate thought, word, deed or omission against God’s law. Did God abandon us? No. He sent Jesus Christ our Saviour.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Merciful Father, you made me for goodness. Save me from sin and help me choose what is true and right. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Thank God for one good thing each day and choose one act of kindness.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not present original sin as something the child personally chose. Baptism forgives original sin, while weakness and temptation remain. Keep truth and mercy together.</p>\n<h2>Jesus Christ Our Saviour</h2>\n<h3>AIM</h3>\n<p>Help the child know Jesus as the divine Son made man who saves us by his Cross and Resurrection.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix and two cards: CROSS, RESURRECTION.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Show the crucifix. Ask: “If someone asked who this is, what would you tell them?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Who Jesus is and what he gives</strong></p>\n<ol><li>Let the child name a story they know about Jesus. If needed, remind them that he taught, healed and forgave sins.</li><li>Read the opening of Lesson 4: the eternal Son took a true human nature from Mary. Jesus is true God and true man.</li>\n<details class=\"conv\"><summary>Open Lesson 4 &mdash; Jesus Christ Our Saviour</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Jesus Christ is true God and true man, who saved us by his Cross and Resurrection.</p>\n<p>The eternal Son of God took a true human nature from the Virgin Mary. Jesus is one divine Person with two natures, divine and human. Mary is rightly called the Mother of God because her Son is truly God.</p>\n<p>Jesus taught the truth, healed the sick, forgave sins and announced God&#x27;s Kingdom. He freely offered himself upon the Cross as the perfect sacrifice for our sins.</p>\n<p>On the third day Jesus rose bodily from the dead. He ascended into heaven and reigns in glory. He will come again to judge the living and the dead, and his Kingdom will have no end.</p>\n<p>Talk About It: Why must we say that Jesus is more than a good teacher or example?</p>\n<p>(Jesus is the divine Son made man. He does not merely show a better way; by his sacrificial death and bodily Resurrection he conquers sin and death and saves us.)</p>\n<p>Learn these answers</p>\n<ol><li>Who is Jesus Christ?</li></ol>\n<p>Jesus Christ is the eternal Son of God made man.</p>\n<ol><li>Is Jesus true God and true man?</li></ol>\n<p>Yes. Jesus is truly God and truly human.</p>\n<ol><li>Why did the Son of God become man?</li></ol>\n<p>To save us from sin and bring us into friendship with God.</p>\n<ol><li>How did Jesus redeem us?</li></ol>\n<p>By his suffering, death and Resurrection.</p>\n<ol><li>Did Jesus truly rise from the dead?</li></ol>\n<p>Yes. Jesus rose bodily from the dead on the third day.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus Christ, Son of the living God, have mercy on me and lead me to the Father. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read a Gospel account of the Cross or Resurrection and tell someone what it reveals about Jesus.</p>\n<p>7 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details><li>Place CROSS beside the crucifix. Ask why Jesus freely gave his life for us.</li><li>Add RESURRECTION. Ask what happened on the third day and why Christians have hope.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 4. Keep Jesus’ identity, his saving sacrifice and his real bodily Resurrection together.</p>\n<h2>Jesus Christ Our Saviour</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Jesus more than a good teacher?”</li><li>“What difference does his Resurrection make to how we face death?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is Jesus Christ? The eternal Son of God made man. Is Jesus truly God and truly human? Yes. How did he redeem us? By his suffering, death and Resurrection.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus Christ, Son of the living God, have mercy on me and lead me to the Father. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Thank Jesus before a crucifix and tell someone why Christians celebrate Easter.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Let the child speak simply, but keep the teaching precise: Jesus is one divine Person with divine and human natures. His Resurrection was real, not merely a feeling of hope.</p>\n<h2>My Christian Baptism</h2>\n<h3>AIM</h3>\n<p>Honour the Baptism already received and explain why it is never repeated.</p>\n<h3>QUICK PREP</h3>\n<p>A cup of water. Optional: a baptismal photograph or details already known.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What do you know about your Baptism? What did God give you then?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A gift already received</strong></p>\n<ol><li>Place the cup of water on the table. Ask what ordinary water does: cleans, refreshes and supports life.</li><li>Read the effects of Baptism in Lesson 5: forgiveness, new life, adoption as God’s child and union with Christ.</li>\n<details class=\"conv\"><summary>Open Lesson 5 &mdash; My Christian Baptism</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In valid Baptism, God freed me from sin, gave me new life and united me to Christ.</p>\n<p>Baptism is the gateway to Christian life. Through water and the word of Christ, God forgives original sin and every personal sin, gives sanctifying grace and makes the baptised person an adopted child of God.</p>\n<p>Baptism joins us to Christ and creates a real bond of unity among all the baptised. It also leaves an indelible spiritual character, a permanent sign that we belong to Christ. It can never be repeated.</p>\n<p>A Baptism celebrated outside the Catholic Church can be valid when true water, the Trinitarian words and the proper intention are present. The parish priest must examine the record and circumstances before arranging reception.</p>\n<p>Talk About It: If Baptism already made you a Christian, why is coming into full communion still important?</p>\n<p>(Baptism gives real Christian life and unity with Christ, but Christ also wills visible unity in the faith, Sacraments and pastoral communion of the Catholic Church.)</p>\n<p>Learn these answers</p>\n<ol><li>What does Baptism do?</li></ol>\n<p>Baptism forgives sin, gives new life in Christ and makes us children of God.</p>\n<ol><li>Does Baptism join us to Christ?</li></ol>\n<p>Yes. Baptism unites us to Christ and creates a real bond among Christians.</p>\n<ol><li>Can valid Baptism be repeated?</li></ol>\n<p>No. Baptism gives a permanent spiritual character and can never be repeated.</p>\n<ol><li>Are you baptised again when you become Catholic?</li></ol>\n<p>No. The Catholic Church receives a validly baptised Christian without another Baptism.</p>\n<ol><li>Who establishes whether a previous Baptism was valid?</li></ol>\n<p>The parish priest investigates it according to the teaching and law of the Church.</p>\n<h4>PRAYER</h4>\n<p>Father, thank you for the grace of my Baptism. Help me live as your child and remain faithful to Jesus Christ. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Ask an adult what is known about your Baptism: its date, place, minister and sponsors.</p>\n<p>8 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details><li>Write “Baptism already received” on a card. Add “Valid Baptism is never repeated”.</li><li>Beside it write “Full communion”. Ask what the child is now preparing to receive and profess in the Catholic Church.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 5 and the note in Appendix A distinguishing a baptised candidate from a catechumen.</p>\n<h2>My Christian Baptism</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do we thank God for your Baptism?”</li><li>“If you are already Christian, what does full Catholic communion add to your life?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What did Baptism give you? Forgiveness of sin and new life in Christ. Can valid Baptism be repeated? No. It gives a permanent spiritual character. Are you baptised again at Reception? No.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, thank you for the grace of my Baptism. Help me live as your child and remain faithful to Jesus Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With an adult, find out one detail of your Baptism and thank God for it.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The priest establishes validity; the child is not asked to judge it. Be respectful towards the family and Christian community through whom this gift was received. Do not simulate Baptism.</p>\n<h2>Sacred Scripture Tradition and the Creed</h2>\n<h3>AIM</h3>\n<p>Show that Catholic faith receives the revelation God entrusted to his Church.</p>\n<h3>QUICK PREP</h3>\n<p>The catechism and three cards: SCRIPTURE, TRADITION, CREED.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “How can we know what Jesus taught when we were not there to hear him?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Receiving the faith</strong></p>\n<ol><li>Lay out SCRIPTURE. Explain that the Bible is God’s written word, inspired by the Holy Spirit.</li><li>Lay out TRADITION. Explain that the Apostles’ teaching is handed on in the Church’s life and teaching, not just in writing.</li><li>Place CREED below both. Read its opening from Appendix F and ask whom it tells us to believe in.</li><li>Ask: “Who helps the Church faithfully explain this received faith?” Introduce the Pope and bishops’ teaching office.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 6. Scripture and Sacred Tradition belong together in one deposit of faith.</p>\n<details class=\"conv\"><summary>Open Lesson 6 &mdash; Sacred Scripture, Tradition and the Creed</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God&#x27;s revelation comes to us through Sacred Scripture and Sacred Tradition, faithfully taught by the Church.</p>\n<p>God reveals himself so that we may know and love him. Sacred Scripture is the written word of God, inspired by the Holy Spirit and entrusted to the Church.</p>\n<p>Sacred Tradition is the living transmission of the Gospel from the Apostles in the Church. Scripture and Tradition form one sacred deposit of faith, not two competing messages.</p>\n<p>The Pope and the bishops in communion with him exercise the Magisterium, the Church&#x27;s teaching office. The Creed gives a faithful summary of the central truths Christians believe.</p>\n<p>Talk About It: Why is Catholic faith more than choosing only the teachings we happen to like?</p>\n<p>(Faith receives the truth God reveals. The Church does not invent revelation; she guards, explains and hands on the apostolic faith.)</p>\n<p>Learn these answers</p>\n<ol><li>What is Sacred Scripture?</li></ol>\n<p>Sacred Scripture is the word of God written under the inspiration of the Holy Spirit.</p>\n<ol><li>What is Sacred Tradition?</li></ol>\n<p>Sacred Tradition is the living transmission of God&#x27;s word handed on from the Apostles.</p>\n<ol><li>Do Scripture and Tradition belong together?</li></ol>\n<p>Yes. Together they form the one sacred deposit of the word of God.</p>\n<ol><li>What is the Magisterium?</li></ol>\n<p>The Magisterium is the teaching office of the Pope and the bishops in communion with him.</p>\n<ol><li>What is a creed?</li></ol>\n<p>A creed is a summary and profession of the faith revealed by God.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, help me receive God&#x27;s word with faith and understand what the Church faithfully teaches. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read the Sunday Gospel before Mass and listen for it when it is proclaimed.</p>\n<p>9 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>Sacred Scripture Tradition and the Creed</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What is different about receiving God’s truth and inventing our own beliefs?”</li><li>“Which word in the Creed would you like explained?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is Sacred Scripture? God’s word written under the inspiration of the Holy Spirit. What is Sacred Tradition? The living transmission of God’s word from the Apostles. What is the Creed? A summary and profession of faith.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, help me receive God’s word with faith and understand what the Church teaches. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read one line of the Creed in Appendix F. Ask about any word you do not understand.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Welcome questions. Sacred Tradition is not simply every Catholic custom. The Magisterium serves God’s word; it does not invent a different revelation.</p>\n<h2>The Catholic Church and Full Communion</h2>\n<h3>AIM</h3>\n<p>Make full communion concrete while recognising the real Christian bond of Baptism.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: FAITH, SACRAMENTS, PASTORS.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Is the Church just this building? What brings Catholics together wherever they live?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Three bonds of communion</strong></p>\n<ol><li>Draw a church building, then add people: families, priests, bishops and the Pope. Explain that Jesus founded a living, visible Church.</li><li>Place FAITH beside it: we profess the Catholic faith together.</li><li>Add SACRAMENTS: we share the sacramental life Christ gives his Church. Add PASTORS: we live in communion with the Pope and bishops.</li><li>Ask where Baptism already belongs in this picture and what the child is seeking through Reception.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 7, especially the four marks of the Church and the three bonds of full communion.</p>\n<details class=\"conv\"><summary>Open Lesson 7 &mdash; The Catholic Church and Full Communion</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Jesus founded one Church and gave her the fullness of the means of salvation.</p>\n<p>Jesus founded his Church upon the Apostles and gave Saint Peter a special office of unity. The Pope, Bishop of Rome and successor of Peter, serves the unity of the universal Church. Bishops succeed the Apostles.</p>\n<p>The Church is one, holy, catholic and apostolic. The Church of Christ subsists in the Catholic Church, governed by the successor of Peter and the bishops in communion with him.</p>\n<p>Christians separated from full Catholic communion may possess many gifts of grace and truth, and Baptism creates a real bond among us. Full communion includes unity in Catholic faith, the Sacraments and communion with the Church&#x27;s pastors.</p>\n<p>Talk About It: What is the difference between saying that other Christians possess real gifts of grace and saying that all Christian communities are the same?</p>\n<p>(We gratefully recognise what is true and holy in other Christians, while also believing that Christ entrusted the fullness of revealed truth and sacramental life to the Catholic Church.)</p>\n<p>Learn these answers</p>\n<ol><li>Who founded the Catholic Church?</li></ol>\n<p>Jesus Christ founded the Catholic Church.</p>\n<ol><li>What are the four marks of the Church?</li></ol>\n<p>The Church is one, holy, catholic and apostolic.</p>\n<ol><li>Who is the Pope?</li></ol>\n<p>The Pope is the Bishop of Rome, successor of Saint Peter and visible source of unity for the Church.</p>\n<ol><li>What does full communion include?</li></ol>\n<p>Unity in Catholic faith, sacramental life and communion with the Pope and bishops.</p>\n<ol><li>Do we reject every grace received outside full Catholic communion?</li></ol>\n<p>No. We thank God for every true gift of faith and grace and bring it into Catholic fullness.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, you prayed that your disciples might be one. Lead all Christians into the unity of truth, charity and full communion. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Learn the names of the Pope, the Bishop of Nottingham and your parish priest, and pray for them.</p>\n<p>10 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>The Catholic Church and Full Communion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What gifts of Christian faith have you already received?”</li><li>“What will living in full communion mean for you?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who founded the Church? Jesus Christ. What are her four marks? One, holy, catholic and apostolic. What does full communion include? Catholic faith, sacramental life and communion with the Pope and bishops.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, you prayed that your disciples might be one. Lead us into unity in truth, charity and full communion. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask an adult for the names of the Pope and our bishop. Pray for them and your parish priest.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Speak clearly about Catholic fullness without insulting other Christians. Baptism already creates a real bond with Christ. Listen for the child’s understanding of faith, Sacraments and pastoral communion.</p>\n<h2>Prayer Sunday Mass and Christian Life</h2>\n<h3>AIM</h3>\n<p>Help the child build a practical pattern of prayer, Sunday worship and charity.</p>\n<h3>QUICK PREP</h3>\n<p>Paper divided into MORNING, SUNDAY, HOME AND SCHOOL.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If faith matters to someone, what might we notice in an ordinary week?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A week with God</strong></p>\n<ol><li>Under MORNING, choose a short daily prayer, beginning with the Sign of the Cross.</li><li>Under SUNDAY, write the family’s plan for Mass. Ask what helps the child listen and pray there.</li><li>Under HOME AND SCHOOL, name a real opportunity for honesty, forgiveness or service.</li><li>Read the Our Father in Appendix F slowly. Choose one phrase and ask what it means.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 8. Explain that Sunday celebrates the Resurrection and Mass is central to Catholic life.</p>\n<details class=\"conv\"><summary>Open Lesson 8 &mdash; Prayer, Sunday Mass and Christian Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>A Catholic lives in friendship with God through prayer, Sunday Mass, the Sacraments and charity.</p>\n<p>Prayer is lifting the mind and heart to God. We adore him, thank him, ask forgiveness and place our needs before him. Jesus teaches us to pray with confidence, especially in the Our Father.</p>\n<p>Sunday is the Lord&#x27;s Day, the weekly celebration of Christ&#x27;s Resurrection. Catholics participate in Mass on Sundays and holy days of obligation unless a serious reason excuses them.</p>\n<p>Faith must bear fruit in love. At home, school and parish, a disciple speaks truth, forgives, serves those in need, respects every person and tries to choose what pleases God.</p>\n<p>Talk About It: If someone watched your family for a week, what signs might show that Catholic faith and Sunday Mass really matter?</p>\n<p>(The child may name prayer, a crucifix, Scripture, Mass, reverent speech, forgiveness, care for others and the way family decisions are made.)</p>\n<p>Learn these answers</p>\n<ol><li>What is prayer?</li></ol>\n<p>Prayer is lifting our minds and hearts to God.</p>\n<ol><li>What is the perfect prayer?</li></ol>\n<p>The Our Father is the perfect prayer because Jesus taught it to us.</p>\n<ol><li>Why is Sunday holy?</li></ol>\n<p>Sunday is the Lord&#x27;s Day, when the Church celebrates the Resurrection of Jesus.</p>\n<ol><li>What is the centre of Sunday for Catholics?</li></ol>\n<p>Participation in the Holy Sacrifice of the Mass.</p>\n<ol><li>How does faith become visible?</li></ol>\n<p>Through worship, obedience, truth, forgiveness, charity and service.</p>\n<h4>PRAYER</h4>\n<p>Father, teach me to pray as your child. Make Sunday Mass the centre of my week and help my faith bear fruit in love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Pray the Our Father each day and attend Sunday Mass with attention.</p>\n<p>11 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>Prayer Sunday Mass and Christian Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What can you say to God when you feel grateful, worried or sorry?”</li><li>“Who can help you keep these habits?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is prayer? Lifting our minds and hearts to God. Why is Sunday holy? It is the Lord’s Day, celebrating Jesus’ Resurrection. How does faith become visible? Through worship and a life of love, truth and service.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, teach me to pray as your child. Help me love Sunday Mass and put my faith into practice. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use the prayer and Mass plan you made. Choose one act of kindness at home or school.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Support the family with a workable plan. Children depend on adults for transport and routines; do not blame a child for circumstances they cannot control. During preparation, attend Mass without receiving Communion until the priest directs otherwise.</p>\n<h2>The Commandments Sin and Conversion</h2>\n<h3>AIM</h3>\n<p>Form conscience by distinguishing accident, temptation and a freely chosen wrong.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: ACCIDENT, TEMPTATION, SIN.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Are dropping a cup by accident, wanting to throw it, and throwing it deliberately all the same?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What did the person choose</strong></p>\n<ol><li>Lay out the cards. Read three invented examples: a knocked-over cup; feeling like telling a lie but choosing truth; deliberately taking someone’s property.</li><li>Let the child place each example. Ask what the person knew and chose.</li><li>Read the three conditions for mortal sin in Lesson 9. All three must be present together.</li>\n<details class=\"conv\"><summary>Open Lesson 9 &mdash; The Commandments, Sin and Conversion</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God&#x27;s commandments teach love; when I sin, Christ calls me to repentance and conversion.</p>\n<p>The Ten Commandments teach us to love God and our neighbour. Jesus fulfils the Law and gives the Beatitudes as the pattern of life in his Kingdom.</p>\n<p>Temptation is an invitation to sin, but it is not itself a sin. An accident or mistake without free choice is not the same as sin. Personal sin requires some knowledge and consent.</p>\n<p>Mortal sin involves grave matter, full knowledge and deliberate consent. Venial sin wounds charity without destroying the life of grace. God calls every sinner to sorrow, confession, amendment and renewed friendship.</p>\n<p>Talk About It: Why is it important to know the difference between temptation, an accident and a deliberate sin?</p>\n<p>(It helps form a truthful conscience without fear or scrupulosity. We take responsibility for real choices while not blaming ourselves for what was not freely chosen.)</p>\n<p>Learn these answers</p>\n<ol><li>What do the Commandments teach?</li></ol>\n<p>They teach us to love God and our neighbour.</p>\n<ol><li>Is temptation itself a sin?</li></ol>\n<p>No. Temptation becomes sin when we freely consent to what is wrong.</p>\n<ol><li>Is an accident the same as a sin?</li></ol>\n<p>No. Sin involves a choice of something known to be wrong.</p>\n<ol><li>What three things are required for mortal sin?</li></ol>\n<p>Grave matter, full knowledge and deliberate consent.</p>\n<ol><li>What is conversion?</li></ol>\n<p>Conversion is turning away from sin and turning back to God.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, give me light to know what is right, courage to reject sin and trust in the mercy of Jesus. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At the end of each day, thank God, remember your choices, ask forgiveness and choose one way to do better.</p>\n<p>12 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details><li>Ask what conversion would mean after a wrong choice: sorrow, turning to God, making amends and learning to choose well.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 9. God’s commandments teach love; temptation is not itself sin.</p>\n<h2>The Commandments Sin and Conversion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do we need both an honest conscience and trust in God’s mercy?”</li><li>“How can a person repair harm without pretending the wrong never happened?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is temptation itself a sin? No. What is needed for mortal sin? Grave matter, full knowledge and deliberate consent. What is conversion? Turning away from sin and back to God.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, give me light to know what is right, courage to reject sin and trust in the mercy of Jesus. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each evening, thank God, think quietly about your choices, ask forgiveness and choose one way to do better.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Use invented examples, never a public account of the child’s sins. Something done to a child without their free choice is not their sin. Follow parish safeguarding procedures if a concern is disclosed.</p>\n<h2>Jesus Forgives Me in Confession</h2>\n<h3>AIM</h3>\n<p>Prepare calmly for a real, private First Confession before Reception.</p>\n<h3>QUICK PREP</h3>\n<p>Six cards: PREPARE, BEGIN, CONFESS, LISTEN, ABSOLUTION, THANKSGIVING.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When someone has done wrong, what helps them begin again?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Walk through the steps</strong></p>\n<ol><li>Use Appendix B to arrange the cards. Explain sorrow for sin and the intention to turn away from it.</li><li>Practise the opening: “Bless me, Father, for I have sinned. This is my first Confession.” Add that the child is preparing for Reception.</li><li>Use an invented example only, such as a fictional child deliberately lying. Practise speaking simply, listening and praying the Act of Contrition.</li><li>Explain absolution and penance without acting as the confessor. The real sacrament is celebrated privately with the priest.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 10 and Appendix B. Because the child is already baptised, First Confession comes before Reception.</p>\n<details class=\"conv\"><summary>Open Lesson 10 &mdash; Jesus Forgives Me in Confession</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In the Sacrament of Penance, Jesus forgives sins committed after Baptism and gives grace to begin again.</p>\n<p>After rising from the dead, Jesus gave his Apostles authority to forgive sins. Bishops and priests continue this ministry in the Sacrament of Penance and Reconciliation.</p>\n<p>A good Confession includes examining our conscience, having sorrow for sin, intending to turn away from sin, confessing honestly, receiving absolution and completing the penance.</p>\n<p>Because you are already baptised, you prepare for First Confession before Reception into Full Communion. Confession is private. Parents and catechists help you prepare but must never ask you to reveal your real sins.</p>\n<p>Talk About It: Why should Confession lead to trust rather than fear?</p>\n<p>(The sacrament is Christ&#x27;s merciful remedy. We approach honestly and reverently because Jesus knows our sins, loves us and desires to forgive and strengthen us.)</p>\n<p>Learn these answers</p>\n<ol><li>Who forgives sins in Confession?</li></ol>\n<p>Jesus Christ forgives sins through the ministry of the priest.</p>\n<ol><li>What is contrition?</li></ol>\n<p>Contrition is sorrow for sin with the intention to turn away from it.</p>\n<ol><li>What is an examination of conscience?</li></ol>\n<p>Prayerfully remembering our sins in the light of God&#x27;s commandments.</p>\n<ol><li>What must we confess?</li></ol>\n<p>We must confess all mortal sins remembered after a careful examination; venial sins may also be confessed.</p>\n<ol><li>What is absolution?</li></ol>\n<p>Absolution is the sacramental forgiveness Christ gives through the priest.</p>\n<h4>PRAYER</h4>\n<p>O my God, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Practise the steps of Confession with invented examples, never with real personal sins.</p>\n<p>13 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>Jesus Forgives Me in Confession</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Who forgives sins through the priest?”</li><li>“What could you do if you forget the words or feel nervous?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who forgives in Confession? Jesus Christ through the priest. What is contrition? Sorrow for sin with the intention to turn away from it. What is absolution? The sacramental forgiveness Christ gives through the priest.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Practise the opening and Act of Contrition. Examine your conscience privately using Appendix B.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Never ask for real sins during practice or afterwards. Explain that the priest will help. Make arrangements with him for First Confession before Reception; keep practical support separate from the child’s private confession.</p>\n<h2>The Holy Sacrifice of the Mass</h2>\n<h3>AIM</h3>\n<p>Connect the Mass with Christ’s one Sacrifice of Calvary.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix and cards: CALVARY, MASS, WORD, EUCHARIST.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “How many times did Jesus die? What does the Church celebrate at Mass?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One sacrifice made present</strong></p>\n<ol><li>Place CALVARY beside the crucifix. Explain that Jesus offered himself once for all.</li><li>Place MASS on the other side. Say: at Mass, that same sacrifice is made sacramentally present; Jesus does not suffer and die again.</li><li>Lay out WORD and EUCHARIST. Name what we hear and do in each principal part of Mass.</li><li>Ask the child to choose a person, a worry or an act of love to offer with Jesus at the next Mass.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 11 and Appendix E. Keep the sacrificial and Eucharistic meaning together.</p>\n<details class=\"conv\"><summary>Open Lesson 11 &mdash; The Holy Sacrifice of the Mass</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>At Mass, Christ&#x27;s one Sacrifice of Calvary is made sacramentally present.</p>\n<p>At the Last Supper, Jesus instituted the Eucharist and commanded the Apostles to continue it in his memory. He gave the Church a true sacrifice and sacred banquet.</p>\n<p>Jesus offered himself once for all upon the Cross. He does not suffer and die again at Mass. The same sacrifice is made sacramentally present in an unbloody manner, and Christ offers himself through the ministry of the priest.</p>\n<p>The Mass has two principal parts: the Liturgy of the Word and the Liturgy of the Eucharist. We listen to God, offer ourselves with Christ, adore him and are nourished by his Body and Blood.</p>\n<p>Talk About It: How can Mass make the Cross present if Jesus died only once?</p>\n<p>(The historical sacrifice is not repeated. By Christ&#x27;s power, his one eternal offering becomes sacramentally present so that the Church can unite herself to it.)</p>\n<p>Learn these answers</p>\n<ol><li>Who instituted the Holy Eucharist?</li></ol>\n<p>Jesus Christ instituted the Holy Eucharist at the Last Supper.</p>\n<ol><li>What is made present at Mass?</li></ol>\n<p>Christ&#x27;s one Sacrifice of Calvary is made sacramentally present.</p>\n<ol><li>Does Jesus die again at Mass?</li></ol>\n<p>No. His one perfect sacrifice is made present in an unbloody manner.</p>\n<ol><li>Who offers the Mass?</li></ol>\n<p>Christ is the principal priest and victim; the ordained priest acts in his person, and the Church joins the offering.</p>\n<ol><li>What are the two principal parts of Mass?</li></ol>\n<p>The Liturgy of the Word and the Liturgy of the Eucharist.</p>\n<h4>PRAYER</h4>\n<p>Eternal Father, I offer you my prayers, work, joys and sufferings in union with the Sacrifice of Jesus made present at Mass. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Mass, listen for the words “Pray, brothers and sisters, that my sacrifice and yours...” and offer yourself to God.</p>\n<p>14 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>The Holy Sacrifice of the Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Mass more than listening to a talk?”</li><li>“How can you join Jesus’ offering even before your First Holy Communion?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is made present at Mass? Christ’s one Sacrifice of Calvary. Does Jesus die again? No. What are the two principal parts? The Liturgy of the Word and the Liturgy of the Eucharist.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Eternal Father, I offer you my prayers, work, joys and sufferings in union with the Sacrifice of Jesus made present at Mass. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, listen to the Gospel and offer yourself with Jesus during the Eucharistic Prayer.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Use “made sacramentally present”. Do not describe Mass as merely remembering Calvary or as another death of Jesus. The child can participate through listening, prayer and offering before receiving Communion.</p>\n<h2>The Holy Eucharist and the Real Presence</h2>\n<h3>AIM</h3>\n<p>Help the child distinguish the Eucharist from ordinary food and believe Christ’s word.</p>\n<h3>QUICK PREP</h3>\n<p>An ordinary piece of bread in its packet, optional; the catechism.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Can our eyes tell us everything that is true? When do we trust someone’s word?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What we see and what Christ gives</strong></p>\n<ol><li>If using bread, name what the senses perceive: shape, colour, smell and taste. Keep it clearly ordinary food.</li><li>Put the bread away. Read Lesson 12 about Christ’s words at the Last Supper and the consecration.</li>\n<details class=\"conv\"><summary>Open Lesson 12 &mdash; The Holy Eucharist and the Real Presence</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In the Holy Eucharist, Jesus Christ is truly present: Body, Blood, Soul and Divinity.</p>\n<p>At the Last Supper Jesus took bread and declared it to be his Body; he took the chalice and declared it to be his Blood. He commanded his Apostles to do this in remembrance of him.</p>\n<p>At the consecration, the whole substance of bread becomes the Body of Christ and the whole substance of wine becomes his Blood. The Church calls this change transubstantiation.</p>\n<p>The appearances of bread and wine remain, but Jesus Christ is truly, really and substantially present. Therefore Catholics adore the Blessed Sacrament and receive Holy Communion with faith and reverence.</p>\n<p>Talk About It: Why do Catholics believe the Host is truly Jesus even though it still looks and tastes like bread?</p>\n<p>(We believe the word of Christ, who is Truth. The substance changes by his power, while the appearances remain available to the senses.)</p>\n<p>Learn these answers</p>\n<ol><li>Whom do we receive in Holy Communion?</li></ol>\n<p>Jesus Christ, Body, Blood, Soul and Divinity.</p>\n<ol><li>What is transubstantiation?</li></ol>\n<p>The change of the whole substance of bread and wine into the Body and Blood of Christ.</p>\n<ol><li>What remains after the consecration?</li></ol>\n<p>The appearances of bread and wine remain.</p>\n<ol><li>Is the Eucharist merely a symbol?</li></ol>\n<p>No. Jesus Christ is truly, really and substantially present.</p>\n<ol><li>Why do Catholics adore the Blessed Sacrament?</li></ol>\n<p>Because the Blessed Sacrament is Jesus Christ himself.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, I believe that you are truly present in the Holy Eucharist. Increase my faith, hope and love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Spend a few quiet minutes before the tabernacle and make an act of faith in the Real Presence.</p>\n<p>15 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details><li>Write “Appearances remain” and “Jesus truly present”. Explain that the whole substance changes into Christ’s Body and Blood.</li><li>Ask why Catholics adore the Blessed Sacrament and approach Communion reverently.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 12. Use its explanation of transubstantiation rather than inventing a comparison for the change.</p>\n<h2>The Holy Eucharist and the Real Presence</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is a consecrated Host different from ordinary bread?”</li><li>“What would show that we believe Jesus is present in the tabernacle?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is present in the Eucharist? Jesus Christ, Body, Blood, Soul and Divinity. What remains after consecration? The appearances of bread and wine. Is the Eucharist merely a symbol? No. Jesus is truly, really and substantially present.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, I believe that you are truly present in the Holy Eucharist. Increase my faith, hope and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make a short visit to the tabernacle with an adult and say: “My Lord and my God.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>This is a central readiness point. Listen for belief in Jesus’ real presence, beyond “special bread”. Ordinary food must never be presented as the Blessed Sacrament or used to imitate a consecration.</p>\n<h2>The Profession of Faith and Reception</h2>\n<h3>AIM</h3>\n<p>Help the child understand and freely make the Catholic Profession of Faith.</p>\n<h3>QUICK PREP</h3>\n<p>Appendix C and three cards: PROFESSION, RECEPTION, FULL COMMUNION.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What is the difference between reading words aloud and meaning what you say?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Words I can sincerely mean</strong></p>\n<ol><li>Read the Profession of Faith from Appendix C slowly. Ask which words need explaining.</li><li>Explain “believe and profess”: I accept this faith and say so openly. “Revealed by God” means the truth God has made known.</li><li>Place the cards in order. Explain that after the profession the priest receives the child into full communion. No Baptism is repeated.</li><li>Let the child explain the profession in their own words, then practise saying it calmly and freely.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 13 and Appendix C. The approved rite supplies the actual words and actions of the celebration.</p>\n<details class=\"conv\"><summary>Open Lesson 13 &mdash; The Profession of Faith and Reception</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>I am received into full communion by freely professing the Catholic faith and being received by the Church.</p>\n<p>Because your Baptism is valid, you are not baptised again. You prepare to make a Profession of Faith, declaring that you believe all that the holy Catholic Church believes, teaches and proclaims to be revealed by God.</p>\n<p>The profession is not a promise that you understand every mystery perfectly. It is a sincere act of faith: you trust God&#x27;s revelation and accept the Church&#x27;s authority to teach it faithfully.</p>\n<p>The priest then formally receives you into the full communion of the Catholic Church. You are now bound to the Church in her profession of faith, Sacraments and pastoral communion.</p>\n<p>Talk About It: What does it mean to make the Profession of Faith freely and sincerely?</p>\n<p>(The child is not merely repeating words. They personally intend to accept the Catholic faith and live within the communion of the Church.)</p>\n<p>Learn these answers</p>\n<ol><li>Are you baptised again at Reception?</li></ol>\n<p>No. Valid Christian Baptism is never repeated.</p>\n<ol><li>What do you profess?</li></ol>\n<p>I profess all that the holy Catholic Church believes, teaches and proclaims to be revealed by God.</p>\n<ol><li>Must you understand every mystery perfectly?</li></ol>\n<p>No. I must sincerely accept the Catholic faith and continue learning it.</p>\n<ol><li>Who receives you into full communion?</li></ol>\n<p>The priest receives me in the name of the Catholic Church.</p>\n<ol><li>What follows Reception in the ordinary celebration?</li></ol>\n<p>Confirmation and First Holy Communion follow according to the approved rite.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, keep me faithful to the truth you revealed. Unite me fully to your Church in faith, Sacraments and charity. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read the Profession of Faith slowly and ask about any word or teaching you do not understand.</p>\n<p>16 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>The Profession of Faith and Reception</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Can you accept the Catholic faith while still having questions?”</li><li>“What are you saying yes to when you make this profession?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Are you baptised again? No. What do you profess? All that the Catholic Church believes, teaches and proclaims to be revealed by God. Must you understand every mystery perfectly? No. You must sincerely accept the faith and keep learning.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, keep me faithful to the truth you revealed. Unite me fully to your Church in faith, Sacraments and charity. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read the profession with an adult and bring any remaining question to the priest.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Check meaning before memorisation. Do not turn the profession into a performance. If the child cannot freely and sincerely accept it, continue conversation and seek the priest’s guidance.</p>\n<h2>Confirmation and the Gift of the Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Connect Confirmation with baptismal grace, the Holy Spirit’s gifts and Christian witness.</p>\n<h3>QUICK PREP</h3>\n<p>Seven handwritten gift cards using the names below. No oil is needed.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When is it hard to do what is right? What help do we need from God?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Gifts for following Christ</strong></p>\n<ol><li>Read the gifts in Appendix D: wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</li><li>Choose two everyday situations: resisting unkindness and deciding whether to tell the truth. Ask which gifts could help.</li><li>Read how hands are laid and the forehead is anointed with sacred chrism. These signs belong to the real sacrament.</li><li>Practise “Amen” as a response to receiving the Gift of the Holy Spirit. Ask how the child can bear witness to Jesus.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 14 and Appendix D. Confirmation strengthens baptismal grace and gives a permanent seal.</p>\n<details class=\"conv\"><summary>Open Lesson 14 &mdash; Confirmation and the Gift of the Holy Spirit</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In Confirmation, the Holy Spirit strengthens baptismal grace and seals me for Christian witness.</p>\n<p>Jesus promised the Holy Spirit, and at Pentecost the Spirit came upon the Apostles with power. The same Holy Spirit strengthens the baptised in the Sacrament of Confirmation.</p>\n<p>The minister lays hands and anoints the forehead with sacred chrism, saying the sacramental words. Confirmation gives a permanent spiritual seal and is received only once.</p>\n<p>The seven traditional gifts of the Holy Spirit are wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. They dispose us to follow the Spirit faithfully and bear witness to Christ.</p>\n<p>Talk About It: How is Confirmation connected with your Baptism and with the mission Jesus gives you?</p>\n<p>(Baptism begins the life of grace; Confirmation strengthens and seals it, equipping the child to live and witness to Christ more firmly.)</p>\n<p>Learn these answers</p>\n<ol><li>What does Confirmation do?</li></ol>\n<p>Confirmation strengthens baptismal grace and gives a special outpouring of the Holy Spirit.</p>\n<ol><li>What are the essential signs of Confirmation?</li></ol>\n<p>The laying on of hands and anointing with sacred chrism using the sacramental words.</p>\n<ol><li>Can Confirmation be repeated?</li></ol>\n<p>No. Confirmation gives a permanent spiritual seal.</p>\n<ol><li>Name the seven gifts of the Holy Spirit.</li></ol>\n<p>Wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</p>\n<ol><li>Why does a priest ordinarily confirm someone he receives?</li></ol>\n<p>The Church gives him the faculty and duty to complete the person&#x27;s sacramental initiation.</p>\n<h4>PRAYER</h4>\n<p>Come, Holy Spirit, fill my heart with your grace. Strengthen me to know, love, defend and live the Catholic faith. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one gift of the Holy Spirit and ask for help to practise it in a real situation.</p>\n<p>17 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>Confirmation and the Gift of the Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Confirmation a gift for living faithfully, rather than a reward for finishing lessons?”</li><li>“Where could you ask for fortitude this week?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What does Confirmation do? Strengthens baptismal grace through a special outpouring of the Holy Spirit. Can it be repeated? No. It gives a permanent spiritual seal. Why are we strengthened? To live and bear witness to Christ.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit, fill my heart with your grace. Strengthen me to know, love, defend and live the Catholic faith. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one gift and ask the Holy Spirit to help you use it in a real situation.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Confirmation ordinarily follows Reception when not already validly received. Do not postpone it simply to follow an annual group timetable. The priest resolves previous Confirmation or Eastern chrismation and directs the correct celebration.</p>\n<h2>Receiving First Holy Communion</h2>\n<h3>AIM</h3>\n<p>Prepare both the child’s faith and the practical manner of receiving reverently.</p>\n<h3>QUICK PREP</h3>\n<p>Space for a short procession and Appendix E. No food or practice host is necessary.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When you hear ‘The Body of Christ’ and answer ‘Amen’, what do you believe?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Reverence and thanksgiving</strong></p>\n<ol><li>Practise walking calmly, approaching reverently and answering “Amen”. Follow the approved parish manner of receiving.</li><li>Explain that the Sacred Host is consumed immediately. Rehearse the movement without pretending ordinary food is the Eucharist.</li><li>Use a clock to work out one hour before the expected time of Communion, rather than before Mass begins. Water and medicine do not break the fast.</li><li>Practise returning quietly to pray: thank Jesus, offer yourself to him and pray for another person.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 15 and Appendix E. Review the state of grace, the fast, immediate consumption and thanksgiving.</p>\n<details class=\"conv\"><summary>Open Lesson 15 &mdash; Receiving First Holy Communion</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In Holy Communion, Jesus gives himself to me as the food of eternal life.</p>\n<p>After Reception and Confirmation, the newly received Catholic normally approaches the altar and receives the Holy Eucharist for the first time in full communion with the Church.</p>\n<p>We prepare by faith, prayer and reverent participation in Mass. We observe the one-hour Eucharistic fast from food and drink, except water and medicine. Anyone conscious of mortal sin must receive absolution before Communion.</p>\n<p>The minister says, “The Body of Christ.” We answer, “Amen,” meaning “I believe.” We receive reverently, consume the Sacred Host immediately and return to our place to adore and thank Jesus.</p>\n<p>Talk About It: When you answer “Amen” to “The Body of Christ”, what truths and promises are contained in that one word?</p>\n<p>(It professes the Real Presence, assents to Catholic faith and expresses the intention to receive Christ reverently and live in communion with his Church.)</p>\n<p>Learn these answers</p>\n<ol><li>What does your “Amen” mean?</li></ol>\n<p>It means: I believe that this is the Body of Christ.</p>\n<ol><li>How long is the Eucharistic fast?</li></ol>\n<p>One hour before Holy Communion, except for water and medicine.</p>\n<ol><li>May someone conscious of mortal sin receive Communion?</li></ol>\n<p>No. The person must first receive sacramental absolution.</p>\n<ol><li>How do you receive the Sacred Host?</li></ol>\n<p>I receive reverently and consume the Sacred Host immediately.</p>\n<ol><li>What should you do after Communion?</li></ol>\n<p>Adore Jesus, thank him, offer myself and pray for others.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, I am not worthy to receive you, but I trust your mercy. Prepare my heart and keep me close to you. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Practise the approved manner of receiving with the catechist, using an unconsecrated practice host.</p>\n<p>18 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4></div></details>\n<h2>Receiving First Holy Communion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How can you prepare your heart as well as your movements?”</li><li>“What should you do if you are unsure whether to receive?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Whom do you receive? Jesus Christ, Body, Blood, Soul and Divinity. What does Amen mean here? I believe that this is the Body of Christ. How long is the fast? One hour before Communion, except water and medicine.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Lord Jesus. Prepare my heart to receive you with faith, reverence and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With an adult, plan the fast and use this thanksgiving: “Thank you, Jesus. Help me love you and live faithfully.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Anyone conscious of mortal sin should seek sacramental absolution before Communion. Refer concerns about illness, swallowing, gluten or other adaptations to the priest. The ordinary celebration places Reception and Confirmation before Communion.</p>\n<h2>Living in Full Communion</h2>\n<h3>AIM</h3>\n<p>Make Reception the beginning of a continuing Catholic life.</p>\n<h3>QUICK PREP</h3>\n<p>A weekly calendar or paper and cards: MASS, PRAYER, CONFESSION, CHARITY, LEARNING.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Six months after Reception, what would show that being Catholic is part of your life?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A simple rule of life</strong></p>\n<ol><li>Lay out the five cards. Ask what each could mean in an ordinary week or month.</li><li>Choose manageable habits: Sunday Mass, daily prayer, regular Confession, one act of charity and continued learning.</li><li>Write who will help with each habit. Include the family, sponsor, mentor and parish where appropriate.</li><li>Arrange a later conversation about the sacraments received and the child’s questions. Explain that this continuing reflection is called mystagogy.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 16 and Appendix H. Formation and accompaniment continue after the celebration.</p>\n<details class=\"conv\"><summary>Open Lesson 16 &mdash; Living in Full Communion</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Reception is a beginning: Jesus calls me to persevere in the worship, faith and charity of his Church.</p>\n<p>After Reception, you are fully a member of the Catholic Church. Full communion is lived through fidelity to Catholic faith, participation in Sunday Mass, worthy Holy Communion, regular Confession, prayer and obedience to God.</p>\n<p>The grace of Confirmation is given for mission. At home, school and parish, you are called to practise virtue, defend the truth with charity, serve those in need and share the hope of Christ.</p>\n<p>Formation never ends. Continue reading Scripture, learning the Catechism, asking honest questions and taking part in parish life. When you fail, return to Christ through repentance and Confession.</p>\n<p>Talk About It: What might show six months after Reception that full communion has become a real way of life?</p>\n<p>(Look for Sunday Mass, prayer, Holy Communion, Confession, parish belonging, continued learning, growing virtue and charity towards others.)</p>\n<p>Learn these answers</p>\n<p>No. It is the beginning of living in full communion.</p>\n<ol><li>What should remain at the centre of Catholic life?</li></ol>\n<p>Sunday Mass and the worthy reception of the Holy Eucharist.</p>\n<ol><li>What sacrament forgives serious sins committed after Baptism?</li></ol>\n<p>The Sacrament of Penance and Reconciliation.</p>\n<ol><li>How do we bear witness to Christ?</li></ol>\n<p>By truth, holiness, charity, service and sharing the faith.</p>\n<ol><li>Does Catholic formation ever finish?</li></ol>\n<p>No. We continue learning, praying and growing throughout life.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, keep me faithful to your Catholic Church. Help me worship you, receive the Sacraments worthily and serve you throughout my life. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose a simple Catholic rule of life: daily prayer, Sunday Mass, regular Confession, continued learning and one act of charity each week.</p>\n<p>19 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Appendix A</p>\n<p>The Journey Step by Step</p>\n<p>This pathway is personal rather than calendar-led. A child is a baptised candidate, not a catechumen. The parish adapts the preparation to the child&#x27;s age, capacity, Christian formation, family circumstances and spiritual progress.</p>\n<p>Sta Name What it means ge</p>\n<p>The child and family meet the parish priest, ask questions 1 Enquiry and begin worshipping regularly with the parish.</p>\n<p>Baptism The parish obtains a certificate or other reliable evidence 2 established and establishes the validity of the previous Baptism.</p>\n<p>The child learns Catholic faith, develops prayer and 3 Formation Christian habits, and becomes at home at Sunday Mass.</p>\n<p>First Because the child is already baptised, the Sacrament of 4 Confession Penance is received before Reception.</p>\n<p>The priest, child, family, sponsor and catechist consider 5 Discernment faith, free desire, understanding, conversion and readiness.</p>\n<p>The child makes the Profession of Faith and is formally 6 Reception received into the full communion of the Catholic Church.</p>\n<p>The newly received child is ordinarily confirmed by the 7 Confirmation priest who receives them, using sacred chrism.</p>\n<p>First Holy The child receives Jesus Christ in the Holy Eucharist and 8 Communion enters fully into Catholic sacramental communion.</p>\n<p>The parish and family help the child deepen the 9 Mystagogy Sacraments received and persevere in Catholic life.</p>\n<h4>NOT A SECOND BAPTISM</h4>\n<p>The Rite of Acceptance into the Order of Catechumens belongs to the unbaptised. A validly baptised child is accompanied as a candidate for Reception into Full Communion and is never treated as though Baptism had not occurred.</p>\n<p>20 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Appendix B</p>\n<p>First Confession Step by Step</p>\n<p>The priest will guide the child. The child does not need to memorise every word perfectly. Confession is private, and preparation should be calm, honest and hopeful.</p>\n<ol><li>Prepare. Pray to the Holy Spirit, examine your conscience, be sorry and intend to turn away from</li></ol>\n<p>sin.</p>\n<ol><li>Begin. Make the Sign of the Cross and say, “Bless me, Father, for I have sinned. This is my first</li></ol>\n<p>Confession.”</p>\n<ol><li>Confess. Tell your sins simply and honestly, especially every remembered mortal sin.</li><li>Finish. You may say, “For these and all my sins, I am truly sorry.”</li><li>Listen. The priest may give advice and will assign a penance.</li><li>Contrition. Pray the Act of Contrition sincerely.</li><li>Absolution. Listen to the words by which Christ forgives your sins through the priest.</li><li>Thanksgiving. Complete your penance and thank Jesus for his mercy.</li></ol>\n<p>A child&#x27;s examination of conscience</p>\n<p>Ask the Holy Spirit for light. Be honest, not afraid. Think about sins you freely chose after your Baptism.</p>\n<p>Have I refused to pray, deliberately missed Sunday Mass without a serious reason, or treated holy things without reverence? Have I used God&#x27;s name carelessly or spoken disrespectfully about the faith? Have I disobeyed, lied to or deliberately hurt my parents, carers, teachers or others? Have I been cruel, spiteful, violent, unforgiving or pleased when someone was hurt? Have I cheated, stolen, damaged something deliberately or refused to put right harm I caused? Have I deliberately looked at, shared or said something impure or degrading? Have I been jealous, greedy, selfish or unwilling to share? Have I excluded, bullied or humiliated someone in person or online? What good could I have done but deliberately refused to do?</p>\n<h4>CHILD SAFETY</h4>\n<p>Something done to a child without the child&#x27;s free choice is not the child&#x27;s sin. If anyone has harmed, threatened, frightened or asked the child to keep an unsafe secret, the child should tell a trusted safe adult so that protection and help can be given.</p>\n<h4>PRIVACY</h4>\n<p>Parents and catechists must never ask a child to reveal real sins during practice or after Confession. Use invented examples. Personal sins belong in sacramental Confession with the priest.</p>\n<p>21 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Appendix C</p>\n<p>The Profession of Faith and Reception Step by Step</p>\n<p>The exact rite and wording come from the approved liturgical book. The celebrant will guide the child. These steps explain the meaning of the celebration.</p>\n<ol><li>Invitation. The priest invites the candidate to profess the Catholic faith</li></ol>\n<p>freely.</p>\n<ol><li>Profession of Faith. The child declares belief in all that the Catholic</li></ol>\n<p>Church believes, teaches and proclaims to be revealed by God.</p>\n<ol><li>Act of Reception. The priest receives the child into the full communion of the Catholic Church.</li><li>Welcome. The Church gives thanks for the child&#x27;s Baptism and welcomes the child into Catholic communion.</li><li>Confirmation. If the child has not already been validly confirmed,</li></ol>\n<p>Confirmation ordinarily follows Reception.</p>\n<ol><li>Holy Eucharist. During the same Mass, the newly received child</li></ol>\n<p>ordinarily receives First Holy Communion.</p>\n<h4>THE PROFESSION OF FAITH</h4>\n<p>“I believe and profess all that the holy Catholic Church believes, teaches, and proclaims to be revealed by God.”</p>\n<p>The child should understand the meaning before learning the words. The profession is made freely and sincerely; it is not a performance or an examination.</p>\n<h4>THE APPROVED RITE GOVERNS</h4>\n<p>This guide does not replace the liturgical book. The priest determines the appropriate Mass, readings, sponsor, parish participation and any adaptations permitted for children.</p>\n<p>22 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Appendix D</p>\n<p>Confirmation Step by Step</p>\n<ol><li>Renewal of faith. The candidate has professed the Catholic faith and is ready to be</li></ol>\n<p>strengthened in it.</p>\n<ol><li>Invitation to prayer. The priest invites everyone to pray for the gift of the Holy Spirit.</li><li>Laying on of hands. The minister extends his hands and asks the Father to send the Holy Spirit and his gifts.</li><li>Anointing with chrism. The child approaches with the sponsor and is anointed on the forehead with sacred chrism.</li><li>Sacramental words. The minister says, “N., be sealed with the Gift of the Holy Spirit.” The child answers, “Amen.”</li><li>Sign of peace. The minister gives the sign of peace, expressing communion in Christ and his Church.</li></ol>\n<p>The seven gifts of the Holy Spirit</p>\n<p>Wisdom helps us value God and the things of heaven above everything else.</p>\n<p>Understanding helps us grasp the truths of faith more deeply.</p>\n<p>Counsel helps us judge rightly what should be done.</p>\n<p>Fortitude gives courage and perseverance in difficulty.</p>\n<p>Knowledge helps us see created things in relation to God.</p>\n<p>Piety moves us to love and worship God as his children.</p>\n<p>Fear of the Lord fills us with reverence and dread of offending God.</p>\n<p>Eastern Christians. A child validly chrismated in an Eastern Church is not confirmed again. Refer the case to the parish priest so that the child&#x27;s Church sui iuris and correct canonical pathway can be established.</p>\n<p>Sponsor and saint. The sponsor is a practising Catholic who has received Confirmation and the Holy Eucharist, is ordinarily at least sixteen, and will pray for and support the child; a parent does not act as sponsor. Where a saint&#x27;s name is used, choose a saint to imitate and ask for intercession. Keeping the child&#x27;s baptismal name is also a good choice.</p>\n<p>23 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Appendix E</p>\n<p>A Child&#x27;s Guide to Mass and Holy Communion</p>\n<p>Part What I do and understand</p>\n<p>Introductory Rites We gather, make the Sign of the Cross, acknowledge our sins, praise God and pray.</p>\n<p>Liturgy of the Word We listen to Sacred Scripture and the homily, profess faith and offer intercessions.</p>\n<p>Preparation of the Bread and wine are brought to the altar; we offer ourselves with them. Gifts</p>\n<p>Eucharistic Prayer The Church gives thanks; by the Holy Spirit and Christ&#x27;s words, the gifts become his Body and Blood.</p>\n<p>Communion Rite We pray the Our Father, ask peace and prepare to receive the Lamb of God.</p>\n<p>Holy Communion The minister says, “The Body of Christ.” I answer “Amen”, receive reverently and consume at once.</p>\n<p>Thanksgiving I adore Jesus, thank him, offer myself and pray for others.</p>\n<p>Dismissal Christ sends us to live the Gospel and serve our neighbour.</p>\n<p>Receiving the Sacred Host</p>\n<p>Approach calmly with hands joined or prepared according to the approved manner of reception. When the minister says, “The Body of Christ,” answer clearly: “Amen.” Receive the Sacred Host reverently on the tongue or in the hand according to the approved practice and parish direction. You may stand or kneel. Consume the Sacred Host immediately in the presence of the minister. Return to your place and pray quietly in thanksgiving.</p>\n<h4>BEFORE COMMUNION</h4>\n<p>I am Catholic, properly disposed and have fasted for one hour from food and drink, except water and medicine. I approach because I believe that the Sacred Host is truly Jesus Christ and desire to receive him.</p>\n<p>24 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Appendix F</p>\n<p>Prayers to Learn and Pray</p>\n<p>Sign of the Cross</p>\n<h4>PRAY</h4>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<p>Our Father</p>\n<h4>PRAY</h4>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<p>Hail Mary</p>\n<h4>PRAY</h4>\n<p>Hail Mary, full of grace, the Lord is with thee; blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.</p>\n<p>Glory Be</p>\n<h4>PRAY</h4>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<p>Act of Contrition</p>\n<h4>PRAY</h4>\n<p>O my God, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<p>Come, Holy Spirit</p>\n<h4>PRAY</h4>\n<p>Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love. Amen.</p>\n<p>Before Communion</p>\n<h4>PRAY</h4>\n<p>Lord, I am not worthy that you should enter under my roof, but only say the word and my soul shall be healed.</p>\n<p>After Communion</p>\n<h4>PRAY</h4>\n<p>Lord Jesus, I adore you and thank you for giving yourself to me. Keep me close to you and make my life pleasing to you. Amen.</p>\n<p>25 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>The Apostles&#x27; Creed</p>\n<h4>I BELIEVE</h4>\n<p>I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead. I believe in the Holy Spirit, the holy catholic Church, the communion
