descended into hell” refers here to Christ’s descent to the realm of the dead. Bring an honest question to the mentor or priest.</p>\n<h2>Prayers for preparation and daily life</h2>\n<h3>The Sign of the Cross</h3>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<h3>Come Holy Spirit</h3>\n<p>Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love. Send forth your Spirit and they shall be created, and you shall renew the face of the earth. Amen.</p>\n<h3>The Our Father</h3>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<h3>The Glory Be</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>An Act of Contrition</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>A morning offering</h3>\n<p>Father, I offer you this day through Jesus Christ. Guide my words, work and choices. Help me love you and serve my neighbour. Amen.</p>\n<h3>An evening prayer</h3>\n<p>Father, thank you for your gifts today. Forgive my failures, show me how to begin again and keep me in your peace. Amen.</p>\n<h2>After Confirmation</h2>\n<p>Use Appendix H with the newly confirmed adult. Confirmation is a continuing source of strength. Do not judge its reality by the presence or absence of strong feelings.</p>\n<h3>Daily</h3>\n<p>Choose a morning offering or prayer to the Holy Spirit. Keep a small, faithful time for prayer. At night give thanks, examine conscience briefly and ask forgiveness.</p>\n<h3>Sunday and regularly</h3>\n<p>Keep Sunday Mass at the centre. Receive Confession regularly and when needed, continue Catholic study and make time for prayer before the Blessed Sacrament where possible.</p>\n<h3>In decisions and relationships</h3>\n<p>Seek what is true, good and loving. Practise honesty, chastity, justice, patience and forgiveness. Ask for counsel and avoid occasions of sin.</p>\n<h3>In parish life and mission</h3>\n<p>Keep parish friendships and choose a suitable way to serve. Be ready to explain faith simply and charitably. Ordinary duties and works of mercy are part of Christian witness.</p>\n<h3>When you fail</h3>\n<p>Repent and begin again. Return to Confession, prayer and your duties rather than drifting away. Confirmation is not repeated; its grace calls for renewed cooperation.</p>\n<h3>GIVE THANKS</h3>\n<p>Father, I thank you for the Gift of the Holy Spirit. Keep me united to Christ and his Church. Make my whole life a faithful witness in word, deed, prayer and service. Amen.</p>\n<h2>Final word for the mentor</h2>\n<p>Begin with a real person and a real question. Let the activity make one point concrete, then open the preparation book for the Catholic teaching. Listen for understanding that is growing into faith, worship and a changed life.</p>\n<h3>KEEP THE GIFT CENTRAL</h3>\n<p>Confirmation is God’s action, strengthening baptismal grace and binding the adult more perfectly to the Church. Help the candidate receive freely and respond faithfully. It is not a graduation or a reward for completing a programme.</p>\n<h3>KEEP THE NEXT STEP CONCRETE</h3>\n<p>End with one possible action: a prayer, Sunday Mass, a work of mercy, seeking a baptismal record or a private conversation with the priest. Begin the next meeting by asking how it went.</p>\n<h3>CONTINUE THE RELATIONSHIP</h3>\n<p>Agree a meeting after Confirmation. Ask about one grace, one question and one practical need. Help the person persevere through friendship, prayer and ordinary parish life.</p>\n<h3>When a question needs help</h3>\n<p>Use the preparation book to establish what the Church teaches. Refer unresolved doctrine, sacramental records, faculties and readiness to the priest. Personal marriage circumstances and sins belong with him in an appropriate private setting.</p>\n<h2>References for the priest and mentor</h2>\n<p>This guide follows the twelve conversations of Preparing for Adult Confirmation Catholic Preparation Companion. Use that book for the catechetical teaching and its appendices for particular questions.</p>\n<h3>Appendices A and I</h3>\n<p>Pathway, sacramental records, missing First Holy Communion, Eastern Catholic background and special pastoral situations.</p>\n<h3>Appendices B and D</h3>\n<p>The rite, suitable sponsor support and a saint’s name where customary.</p>\n<h3>Appendices C and F</h3>\n<p>Gifts and fruits, with concise answers to the central doctrinal questions.</p>\n<h3>Appendices E and G</h3>\n<p>Private preparation for Confession and the readiness conversation.</p>\n<h3>Appendix H</h3>\n<p>A simple rule of continuing Catholic life after Confirmation.</p>\n<h3>Primary Church sources</h3>\n<p>Sacred Scripture: Isaiah 11; Acts 1–2, 8:14–17 and 19:5–6; John 14–16; Romans 8; 1 Corinthians 12; Galatians 5.</p>\n<p>Catechism of the Catholic Church: 683–747 on the Holy Spirit; 1285–1321 on Confirmation; 1691–1698 on life in Christ; 1803–1845 on virtues, gifts and fruits; 1455– 1456 on confession of sins.</p>\n<p>Code of Canon Law: canons 879–896 on Confirmation and 872–874 on sponsors as referenced there; canon 988 on confession of sins. The approved Order of Confirmation for England and Wales and current diocesan direction govern the celebration and local arrangements.</p>\n<p>This companion supplies activities and accompaniment. The priest directs each person’s actual preparation and readiness under the Church’s teaching and discipline.</p>"}, {"name": "Returning to the Faith", "url": "https://3stepuk.github.io/Returning-to-the-Faith/", "desc": "For baptised Catholics coming home.", "html": "<p>For returning Catholics and their mentors</p>\n<h3>USE BESIDE THE PREPARATION BOOK</h3>\n<p>Use with Returning to the Faith A Catholic Companion for Coming Home. The book supplies the Catholic teaching. This guide helps a mentor or trusted parish companion listen, make the next step concrete and encourage a steady return to Catholic life.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the person</li><li>Do something concrete</li><li>Open the preparation book</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>A LIFE ALREADY BEGUN IN BAPTISM</h3>\n<p>A returning Catholic already belongs to Christ and his Church through Baptism. The next step is renewed worship, prayer, conversion and sacramental life. Begin now; there is no need to finish these conversations before coming to Mass or seeking Confession.</p>\n<h2>How to use this guide</h2>\n<h3>SIX CONVERSATIONS AT A SUITABLE PACE</h3>\n<p>Follow the six conversations in the preparation book. Each has a two-page activity and conversation here. Use them as needed; returning is not a course to pass or a programme to complete.</p>\n<h3>For each conversation</h3>\n<ol><li>Make the Sign of the Cross. Use the opening prayer printed near the end. Ask the opening question and listen.</li><li>Try the simple activity. Headings can be handwritten as you meet or spoken. Private reflections need not be shown to anyone.</li><li>Open the matching conversation in the preparation book. Read REMEMBER and the teaching slowly, pausing when something needs attention.</li><li>Talk honestly. Check the central truth and use THE ESSENTIALS in the book to clarify understanding in ordinary words.</li><li>Pray the printed prayer and choose one realistic next step. Return to it gently when you next meet.</li><li>Repeat, divide or combine conversations as helpful. Mass, prayer and access to the priest need not wait for the last page.</li></ol>\n<h3>Simple materials</h3>\n<p>The preparation book, this guide, paper and a pen are enough. No prepared talk, craft kit or internet search is required. A church visit is optional. The person may use the book alone and bring questions to the priest.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Welcome, listen, pray and offer practical support. You do not need a complete account of the years away. Private sins, marriage circumstances and sacramental questions belong with the priest.</p>\n<h2>An opening conversation</h2>\n<p>Begin with the person’s present hopes. Let them share as much of their story as they find helpful; returning is not an interrogation.</p>\n<h3>Listen without demanding an explanation</h3>\n<ol><li>“What has brought you towards the faith again?”</li><li>“What feels difficult or unfamiliar at present?”</li><li>“What would help you take the next step?”</li><li>“Is there a question you would prefer to discuss privately with the priest?”</li></ol>\n<h3>ESTABLISH THE CORRECT PATHWAY</h3>\n<p>This guide is for a baptised Catholic returning to practice. If Baptism, Catholic status, Confirmation or First Holy Communion is uncertain, ask the parish to check. An unbaptised adult needs the catechumenate; a baptised non-Catholic seeking to become Catholic needs Reception into Full Communion.</p>\n<h3>Make the first step possible</h3>\n<p>Ask about language, disability, illness, transport, work and caring responsibilities. Help the person find a suitable Sunday Mass and someone to approach with questions. If they have never been confirmed, the priest can arrange adult preparation alongside their return.</p>\n<h3>ONE NEXT STEP</h3>\n<p>Choose a real beginning: Sunday Mass, a quiet church visit as a first step, a printed prayer, an appointment for Confession or a conversation with the priest. Agree only the support the person wants.</p>\n<p>Do not assume a difficult marriage or family situation means the person should stay away from Mass. Bring questions about Communion privately to the priest.</p>\n<h2>You Are Welcome Back</h2>\n<h3>AIM</h3>\n<p>Connect permanent belonging through Baptism with one manageable step towards renewed Catholic life.</p>\n<h3>QUICK PREP</h3>\n<p>Two headings: WHAT REMAINS and MY NEXT STEP.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What makes returning feel difficult now, and what help would make a first step possible?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Belonging and beginning again</strong></p>\n<ol><li>Under WHAT REMAINS, write BAPTISM. Explain that its permanent character is not erased by years away. Valid Baptism is never repeated.</li><li>Add BELONGING TO CHRIST AND HIS CHURCH. Returning means responding to grace through worship, repentance, prayer and sacramental life.</li><li>Under MY NEXT STEP, name Sunday Mass, a simple prayer or speaking to the priest. If a quiet church visit is the first possible step, plan how it can lead towards Sunday worship.</li><li>Name one practical obstacle and one useful help: company at Mass, a parish contact, an accessible place or a private priest’s meeting. Choose one action without requiring the whole story.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1 and Appendix F if the person’s sacramental or family circumstances need clarification.</p>\n<h2>You Are Welcome Back</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What does knowing that Baptism remains change about your return?”</li><li>“What would help you begin without waiting until every question is settled?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Must a returning Catholic be baptised again? No. Valid Baptism is permanent and received only once. May you come to Mass before Confession? Yes. Receiving Communion requires proper disposition. Must you explain every year away? No. Share what is helpful; seek private pastoral help when needed.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose questions that clarify the person’s actual concerns. Listen for understanding in ordinary words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus Christ, give me courage to return to worship and confidence in your mercy. Help me take the next real step and renew the life begun in Baptism. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Come to Sunday Mass, or make a quiet visit as a first step towards returning. Each day pray: “Jesus, lead me home.” Ask for the practical help you need.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Offer welcome without a demand for a dramatic story. Baptism’s character remains, but grace calls for conversion and sacramental reconciliation when needed. Do not promise Communion without clarifying disposition or personal circumstances with the priest.</p>\n<h2>Looking Back with Truth and Mercy</h2>\n<h3>AIM</h3>\n<p>Help the person name an obstacle honestly and distinguish hurt, circumstances and personal responsibility.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: WHAT DREW ME AWAY, WHAT NEEDS HELP, WHAT I HOPE FOR.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Is there something from the past that still makes returning difficult? You may keep details private.”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One obstacle and the right help</strong></p>\n<ol><li>Write or say the three headings. Let the person reflect quietly; the sheet is theirs and need not be shown or handed in.</li><li>Use an invented case: a Catholic lost a routine during a difficult period and also carries a painful Church experience. These may need different kinds of help.</li><li>Distinguish unclear teaching, hurt needing safe support, practical barriers and freely chosen sin needing repentance. Do not assume every reason for distance is morally the same.</li><li>Ask the person to choose one next step without giving private details: a question to clarify, a habit to renew, a safe pastoral conversation or private preparation for Confession.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 2. Use Appendix F to identify the right help; Appendices A and B support private preparation for Confession.</p>\n<h2>Looking Back with Truth and Mercy</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What question or obstacle would you like help addressing now?”</li><li>“How can truth and mercy together help you move forward?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why look back? To understand what still affects faith and find the right help. Does honesty mean taking all blame? No. Hurt, circumstances and freely chosen sin are distinct. Can sins after Baptism be forgiven? Yes. Christ forgives through the Sacrament of Penance.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose questions that clarify the person’s actual concerns. Listen for understanding in ordinary words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, you know my whole story. Give me honesty without fear, healing without denial and repentance where I have sinned. Help me move forward in your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Reflect privately under the three headings. Choose one obstacle to address through teaching, practical support, a safe conversation or Confession.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not press for disclosure or interpret the person’s history for them. Something suffered without free choice is not their sin. Serious harm needs appropriate safeguarding or specialist support; forgiveness does not mean pretending harm was harmless.</p>\n<h2>Confession and Mercy</h2>\n<h3>AIM</h3>\n<p>Prepare calmly for Christ’s forgiveness through the priest, with sincere contrition and honest confession.</p>\n<h3>QUICK PREP</h3>\n<p>The Confession page here, Appendices A and B and the printed Act of Contrition.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What feels difficult about Confession, and what would help you approach it with trust?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A peaceful walk through Confession</strong></p>\n<ol><li>Read the simple order printed here: prepare, begin, confess, listen, pray, receive absolution and do the penance. Explain the priest will help.</li><li>Practise this opening only: “Father, it has been a long time since my last Confession, and I may need some help.”</li><li>Use an invented case, such as deliberately cheating someone. Discuss honest confession, sorrow, an intention to change and repairing harm; never use the person’s actual sins.</li><li>Read the Act of Contrition. Explain that a real purpose of amendment is an intention to turn from sin with grace, not a guarantee never to fail again. Arrange an opportunity with the priest.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 3 and Appendices A and B. The examination of conscience is private; the mentor does not review the person’s sins.</p>\n<h2>Confession and Mercy</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How is receiving mercy different from performing a perfect account?”</li><li>“What practical help would make an appointment for Confession possible?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who forgives in this sacrament? Christ, through the ministry of the priest. What is mortal sin? Grave matter with sufficient knowledge and deliberate consent. What if you are conscious of mortal sin? Receive sacramental absolution before Holy Communion.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose questions that clarify the person’s actual concerns. Listen for understanding in ordinary words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read Appendices A and B privately. Arrange Confession when ready; if you need help first, ask the priest for a short conversation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Never hear, record or assess actual sins. Explain the priest’s absolute seal and avoid demands for perfect recall. After a careful examination, honestly forgotten mortal sins should be mentioned if recalled later, not made a reason for repeated anxious examination.</p>\n<h2>Returning to Sunday Mass</h2>\n<h3>AIM</h3>\n<p>Help the person take part in worship and distinguish attendance from worthy reception of Communion.</p>\n<h3>QUICK PREP</h3>\n<p>Two headings: LITURGY OF THE WORD and LITURGY OF THE EUCHARIST.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What feels most unfamiliar about returning to Mass, and what would help?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Hear the Word and unite with Christ</strong></p>\n<ol><li>Under LITURGY OF THE WORD, name readings, Psalm, Gospel and homily. Explain that Christ gathers us to hear God’s Word and respond in faith.</li><li>Under LITURGY OF THE EUCHARIST, name Christ’s offering, the Eucharistic Prayer and Communion. His one sacrifice is made sacramentally present; he is not crucified again.</li><li>Practise the response “Amen” to “The Body of Christ”. Explain belief in the Real Presence and proper disposition; practice is not permission to receive before necessary preparation.</li><li>Plan the next Sunday Mass. Choose one thing to listen for in each principal part. If not receiving, remain prayerfully in place and use the spiritual Communion printed here.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 4 and Appendix C. Use the practical Mass and Communion pages here for questions and preparation.</p>\n<h2>Returning to Sunday Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why can you worship even while relearning responses?”</li><li>“How can you unite yourself with Christ when not yet receiving sacramental Communion?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the weekly centre? Sunday Mass. Who is present in the Eucharist? Jesus Christ, Body, Blood, Soul and Divinity. What if you are not ready for Communion? Remain prayerfully in place and prepare to receive worthily.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose questions that clarify the person’s actual concerns. Listen for understanding in ordinary words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, draw me into the worship of your Church. Help me hear your Word, unite my life to your one sacrifice and receive you worthily. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Come to Sunday Mass. Notice one moment in the Liturgy of the Word and one in the Liturgy of the Eucharist. Relearn patiently and bring one question.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Offer practical help without turning Mass into a memory test. Do not pressure anyone to receive Communion or ask publicly why they are not receiving. The priest addresses personal sacramental questions, illness and other barriers to worship.</p>\n<h2>Prayer and Ordinary Catholic Life</h2>\n<h3>AIM</h3>\n<p>Choose small, faithful habits rooted in Sunday worship, prayer, conversion and charity.</p>\n<h3>QUICK PREP</h3>\n<p>The prayers printed here; two headings: DAILY and WEEKLY.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What two habits could realistically help faith become part of your ordinary week?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A small rule that can be kept</strong></p>\n<ol><li>Under DAILY, choose the morning offering, Our Father or evening prayer printed here. Attach it to an existing moment, such as getting up or going to bed.</li><li>Under WEEKLY, plan Sunday Mass and one concrete act of charity in ordinary responsibilities: patient attention, helping a neighbour or making a truthful apology.</li><li>Read the book’s explanation of simple prayer. Dryness or distraction is not proof that God has stopped working; faithfulness matters more than intensity.</li><li>Use this case: a person misses the planned daily prayer and gives up everything. Choose a better response: begin again, keep Sunday worship central and seek grace rather than abandon the whole pattern.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 5 and Appendix E. Devotions support Catholic life; they do not replace Sunday Mass or necessary sacramental reconciliation.</p>\n<h2>Prayer and Ordinary Catholic Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What makes this small pattern possible in your real circumstances?”</li><li>“How will you begin again when a prayer habit is missed?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is prayer? Raising the mind and heart to God in a living relationship with him. Must prayer feel powerful? No. Simple, dry or distracted prayer can still be real. What is ordinary holiness? Faithful love in prayer, sacraments, duties, charity and repentance.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose questions that clarify the person’s actual concerns. Listen for understanding in ordinary words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, teach me to pray simply and faithfully. Root my life in Sunday Mass, the sacraments and charity. Help me begin again whenever I fail. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Practise the two habits chosen together. Keep them small enough to continue, and note what helped rather than trying to do everything at once.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not impose a favourite devotion or an exhausting list. Keep the Church’s actual obligations clear and distinguish a missed optional habit from serious neglect. Illness, caring duties and genuine barriers need pastoral help rather than shame.</p>\n<h2>Staying Close to Christ and His Church</h2>\n<h3>AIM</h3>\n<p>Turn a first return into persevering Catholic life, parish belonging and appropriate support.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: KEEP, ASK, BELONG; the simple rule of life printed here.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would help you remain close to Christ and his Church six months from now?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A plan for continuing Catholic life</strong></p>\n<ol><li>Under KEEP, name Sunday Mass, daily prayer, Confession, worthy Communion and one practical act of charity. Choose a sustainable beginning.</li><li>Under ASK, name a real question without private details. Sacramental records, marriage circumstances and serious matters of conscience belong with the priest.</li><li>Under BELONG, identify a parish contact and a suitable way to continue learning or serving. Begin with a real relationship, not a long list of commitments.</li><li>Choose a simple rule for the coming months and agree a further conversation if helpful. There is no graduation or final test; review whether the pattern supports love of God and neighbour.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 6 and Appendices E and F. Missing sacraments can be prepared for through the appropriate adult pathway.</p>\n<h2>Staying Close to Christ and His Church</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Who or what will support your faith when life becomes difficult?”</li><li>“What will you do if you drift or fall into sin again?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the goal? Persevering life in grace, worship, conversion, charity and the Church. Does finishing the pages complete the return? No. Catholic life continues. What if another sacrament is missing? Ask the parish to check and arrange the right preparation.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose questions that clarify the person’s actual concerns. Listen for understanding in ordinary words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus Christ, keep me close to you and your Church. Give me perseverance in worship, humility in repentance, generosity in charity and courage to ask for help. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use the printed rule of life to choose a rhythm for the next three months. Keep a parish contact and bring any unresolved personal question privately to the priest.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Continue encouragement without making the person dependent on meetings. Do not pronounce on marriage status or entitlement to Communion. Help them seek the priest’s guidance and remain welcome at worship. Review actual support and habits, not a dramatic success story.</p>\n<h2>A good Confession after time away</h2>\n<p>Use Appendix A. The priest will help you; no complicated script or perfect memory is needed. Prepare sincerely and speak honestly.</p>\n<h3>Prepare</h3>\n<p>Ask the Holy Spirit for light. Examine conscience privately, be sorry for sin and intend to turn from it with God’s help.</p>\n<h3>Begin</h3>\n<p>Make the Sign of the Cross. Say: “Father, it has been a long time since my last Confession, and I may need some help.”</p>\n<h3>Confess</h3>\n<p>Tell sins simply. Confess remembered mortal sins not yet confessed in kind and number as reasonably as you can after careful examination. Venial sins may also be confessed.</p>\n<h3>Listen</h3>\n<p>Receive the priest’s counsel, ask briefly if something is unclear and accept the penance.</p>\n<h3>Pray and receive absolution</h3>\n<p>Pray the Act of Contrition printed here when invited. Listen prayerfully to the priest’s absolution and answer Amen.</p>\n<h3>Complete the penance</h3>\n<p>Do the penance as soon as reasonably possible. Thank God, repair harm where possible and begin again in grace.</p>\n<h3>IF A SIN IS HONESTLY FORGOTTEN</h3>\n<p>After careful preparation, do not panic over imperfect memory. If a forgotten mortal sin is later recalled, mention it in the next Confession. Ask the priest if unsure rather than repeatedly examining yourself in anxiety.</p>\n<h2>A calm examination of conscience</h2>\n<p>Use Appendix B privately for the fuller examination. These prompts concern your own free choices; they are not a list of sins everyone has committed.</p>\n<h3>ASK FOR LIGHT</h3>\n<p>Come, Holy Spirit. Help me see the truth, trust God’s mercy, repent sincerely and make a good Confession. Amen.</p>\n<h3>God and worship</h3>\n<p>Have I deliberately neglected Sunday Mass or holy days without a serious reason? Have I neglected prayer, treated holy things with contempt or put something created in God’s place?</p>\n<h3>Relationships and duties</h3>\n<p>Have I acted with cruelty, nourished hatred, damaged someone’s reputation or neglected serious responsibilities? What apology or repair is needed?</p>\n<h3>Truth justice and possessions</h3>\n<p>Have I lied seriously, cheated, stolen, exploited another, betrayed confidence or kept what is not mine? Is restitution or an honest correction needed?</p>\n<h3>Chastity self-control and life</h3>\n<p>Have I been unfaithful, used pornography or sexuality contrary to chastity, deliberately harmed life, or allowed a habit to seriously damage duties and relationships?</p>\n<h3>Omissions and charity</h3>\n<p>What good have I knowingly failed to do when love, justice or my responsibilities required it? Have I ignored serious need I could reasonably help?</p>\n<h3>TRUTH WITHOUT ANXIOUS FAULT-FINDING</h3>\n<p>Mortal sin requires grave matter, sufficient knowledge and deliberate consent. Something done to you without free choice is not your sin. Abuse or danger requires safe help; Confession does not replace protection.</p>\n<h2>Taking part in Sunday Mass again</h2>\n<p>Use Conversation 4 and Appendix C. You can begin worshipping before every response feels familiar. Ask for practical support if needed.</p>\n<h3>Before Mass</h3>\n<p>Choose the Mass you will attend. Arrive in good time if possible, silence your phone and recollect yourself. Ask God to help you listen and pray.</p>\n<h3>The Liturgy of the Word</h3>\n<p>Listen to readings, Psalm, Gospel and homily. Join the Creed and prayers as you are able. Notice one truth to carry into the week.</p>\n<h3>The Liturgy of the Eucharist</h3>\n<p>Unite your work, joys and difficulties with Christ’s offering. Listen to the Eucharistic Prayer and adore him at the consecration.</p>\n<h3>At Communion</h3>\n<p>Receive if properly disposed. If not receiving, remain prayerfully in place and make a spiritual Communion. You still participate in the Church’s worship.</p>\n<h3>Thanksgiving and dismissal</h3>\n<p>Give thanks for what you have received or ask for grace to prepare. Receive the blessing and go out to live the Gospel through ordinary duties and charity.</p>\n<h3>A SIMPLE ACTIVITY</h3>\n<p>After Mass, name one moment from the Word and one from the Eucharistic liturgy. Ask about one thing you did not understand. A mentor can explain with the book or help bring the question to the priest.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Offer company, a parish contact or practical help where wanted. Let the person relearn without public correction or embarrassment. Never make receiving Communion a proof that the return is serious.</p>\n<h2>Preparing for Holy Communion</h2>\n<p>Use Appendix C and the priest’s guidance. Attendance at Mass is welcome while questions are being clarified; reception of Holy Communion requires proper disposition.</p>\n<h3>Faith in the Real Presence</h3>\n<p>The Eucharist is Jesus Christ, Body, Blood, Soul and Divinity, under the appearances of bread and wine. Receiving is an act of faith and communion with Christ and his Church.</p>\n<h3>The state of grace</h3>\n<p>If conscious of mortal sin, receive sacramental absolution before Holy Communion. If a marriage, relationship or other sacramental question leaves you unsure whether you may receive, ask the priest privately rather than guessing.</p>\n<h3>The Eucharistic fast</h3>\n<p>Ordinarily abstain from food and drink for at least one hour before receiving Communion. Water and medicine do not break the fast. Ask the priest about illness or any relevant exemption.</p>\n<h3>Receiving reverently</h3>\n<p>The minister says “The Body of Christ”; answer “Amen”. Follow the approved parish manner of receiving and consume the Sacred Host immediately. Ask early about swallowing, dietary or access needs.</p>\n<h3>WHEN NOT RECEIVING</h3>\n<p>Jesus, I believe you are present in the Holy Eucharist. I desire to be close to you. Draw me into your love, help me turn from sin and prepare me to receive you worthily. Amen.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Explain clearly and discreetly. Do not ask publicly why someone remains in place or decide a personal sacramental case yourself. Help arrange an appropriate conversation with the priest.</p>\n<h2>Prayers for beginning again</h2>\n<h3>The Sign of the Cross</h3>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<h3>An opening prayer</h3>\n<p>Lord Jesus, help me listen with trust, understand your teaching and take the next step in faith. Guide this conversation and renew your life in me. Amen.</p>\n<h3>The Our Father</h3>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<h3>The Glory Be</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>An Act of Contrition</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>A morning offering</h3>\n<p>Father, I offer you this day through Jesus Christ. Guide my words, work and choices. Help me love you and serve my neighbour. Amen.</p>\n<h3>An evening prayer</h3>\n<p>Father, thank you for your gifts today. Forgive my failures, show me how to begin again and keep me in your peace. Amen.</p>\n<h3>BEGIN SIMPLY</h3>\n<p>Choose one prayer and a regular moment for it. Slow, faithful prayer matters more than doing everything at once.</p>\n<h2>A simple rule of Catholic life</h2>\n<p>Use Appendix E. Choose a sustainable rhythm for the coming months, rooted in the Church’s worship and the duties of your actual life.</p>\n<h3>Daily</h3>\n<p>Make the Sign of the Cross and use a printed morning or evening prayer. Offer God your work, joys and difficulties.</p>\n<h3>Sunday</h3>\n<p>Keep Sunday Mass at the centre. Plan transport or other support where needed; ask the priest about genuine barriers.</p>\n<h3>Sacramental life</h3>\n<p>Receive Confession regularly and when serious sin makes reconciliation necessary. Prepare for worthy Communion and give thanks afterwards.</p>\n<h3>Charity and duties</h3>\n<p>Choose concrete patience, generosity, honesty, forgiveness and service at home, work or among neighbours.</p>\n<h3>Learning and belonging</h3>\n<p>Continue with the preparation book and bring questions. Keep a parish contact and a suitable opportunity to learn or serve.</p>\n<h3>When things go wrong</h3>\n<p>Begin again promptly. Return to prayer, worship and mercy rather than letting one failure become permanent distance.</p>\n<h3>A SIMPLE ACTIVITY</h3>\n<p>Name one daily prayer, your plan for Sunday Mass, one act of charity and one question to bring to the priest. Review after a while: is this helping you love God and neighbour more faithfully?</p>\n<h2>When to speak with the priest</h2>\n<p>Use Appendix F. You do not need a complicated situation to ask for a conversation. Personal guidance can prevent a long period of uncertainty.</p>\n<h3>Sacramental history</h3>\n<p>Ask if you are unsure about Baptism, Confirmation or First Holy Communion, or if a sacrament was never received. The parish checks records and arranges the appropriate preparation.</p>\n<h3>Marriage and relationships</h3>\n<p>Bring every relevant previous marriage and any uncertainty about a present marriage or relationship privately to the priest. Do not decide Church recognition or Communion eligibility yourself.</p>\n<h3>Conscience and Confession</h3>\n<p>Ask if a serious sin, long-standing habit or fear makes it difficult to begin. An initial conversation can help you prepare for sacramental Confession.</p>\n<h3>Hurt and safety</h3>\n<p>Serious mistreatment, abuse or coercion needs a safe setting and appropriate safeguarding processes. Pastoral help and specialist support may both be needed.</p>\n<h3>Practical barriers</h3>\n<p>Explain disability, illness, language, transport, work or caring needs that affect worship or access to the sacraments.</p>\n<h3>YOU CAN SAY</h3>\n<p>“Father, I am a Catholic returning after some time away. There are one or two things I am unsure about. Could we talk about the right way forward?”</p>\n<p>A difficult situation does not mean you must stay away from Mass or that nothing can be done. Come to worship and let the Church help clarify the next step.</p>\n<h2>Reviewing the next step together</h2>\n<p>Use this after the conversations, or whenever helpful. There is no graduation and no requirement to provide a polished account of progress. The aim is persevering Catholic life.</p>\n<h3>WORSHIP</h3>\n<p>What has helped you return to Sunday Mass? Is a practical barrier still making attendance difficult?</p>\n<h3>MERCY</h3>\n<p>Do you understand how to prepare for Confession and seek it when needed? No account of private sins or of what was confessed is required.</p>\n<h3>HOLY COMMUNION</h3>\n<p>Are questions about faith, proper disposition or personal circumstances clarified with the priest? Do you know how to pray while preparing to receive?</p>\n<h3>PRAYER AND CHARITY</h3>\n<p>Which small habit is helping? What act of faithful love belongs to your present responsibilities?</p>\n<h3>QUESTIONS AND BELONGING</h3>\n<p>What question still needs teaching or a private conversation? Who in the parish can offer continuing support?</p>\n<h3>ONE NEXT STEP</h3>\n<p>Agree one useful action and a further conversation if wanted. The person need not finish every page before coming to Mass, receiving appropriate pastoral help or arranging Confession.</p>\n<h3>For the mentor</h3>\n<p>Encourage what is real, explain what needs clarification and respect privacy. Help the person become settled in parish life without making meetings a condition of belonging. Refer personal sacramental decisions to the priest.</p>\n<h2>References for the priest and mentor</h2>\n<p>This guide follows the six conversations of Returning to the Faith A Catholic Companion for Coming Home. Use that book for the teaching and its appendices for fuller practical help.</p>\n<h3>Appendices A and B</h3>\n<p>A good Confession after time away and a private examination of conscience.</p>\n<h3>Appendices C and D</h3>\n<p>Returning to Mass, worthy Communion and concise answers to the central questions.</p>\n<h3>Appendices E and F</h3>\n<p>A simple rule of Catholic life and circumstances needing a conversation with the priest.</p>\n<h3>Appendix G</h3>\n<p>The book’s sources and its final encouragement to perseverance.</p>\n<h3>Primary Church sources</h3>\n<p>Sacred Scripture: Luke 15; John 20:19–23; Luke 24:13–35; John 6; 1 Corinthians 11:23–29.</p>\n<p>Catechism of the Catholic Church: 1213–1284 on Baptism; 1322–1419 on the Eucharist; 1422–1498 on Penance; 2041–2043 on the precepts of the Church; 2558–2865 on prayer.</p>\n<p>Code of Canon Law: canon 849 on Baptism; 912–919 on Holy Communion and the Eucharistic fast; 959–991 on Penance; 1246–1248 on Sunday and holy days.</p>\n<p>The Roman Missal, approved liturgical books, current diocesan policy and the priest’s direction govern local pastoral, sacramental and canonical matters. Use the appropriate safeguarding process for safeguarding concerns.</p>"}, {"name": "Christian Initiation — Children (7+)", "url": "https://3stepuk.github.io/Christian-Initiation-Children/", "desc": "For children aged 7+ entering the Church.", "html": "<p>For unbaptised children of catechetical age</p>\n<h3>USE BESIDE MY CHRISTIAN INITIATION CATECHISM</h3>\n<p>The catechism gives the teaching. This companion helps a parent, mentor or priest make that teaching personal, active and memorable.</p>\n<h3>Not another catechism</h3>\n<h2>Ask. Show. Do. Talk. Pray. Then stop.</h2>\n<h3>THE PRINCIPLE</h3>\n<p>The child is not being pushed through a course. The catechumenate is an apprenticeship in Christian life: faith, prayer, conversion, Sunday worship, parish belonging and readiness for the sacraments.</p>\n<h3>For each lesson</h3>\n<ol><li>Begin with a question, object, story or real-life situation.</li><li>Do the short activity together. Most need only ordinary household or church items.</li><li>Open the matching lesson in My Christian Initiation Catechism and read only what is useful for the conversation.</li><li>Ask the discussion questions and let the child answer before supplying language.</li><li>Check the central truths without turning the meeting into a test.</li><li>Pray briefly and choose one real action for the week.</li></ol>\n<h3>A VITAL SACRAMENTAL POINT</h3>\n<p>Before Baptism, the child learns repentance and examination of conscience but does not receive sacramental Confession. Baptism itself forgives original sin and every personal sin committed before Baptism. After Baptism, Penance becomes the ordinary sacrament of forgiveness for serious sins committed afterwards.</p>\n<h3>MENTOR, NOT LECTURER</h3>\n<p>You do not need to explain everything you know. Ask first. Listen. Use the catechism for the teaching. Explain what needs explaining. Leave difficult questions for the priest when appropriate. Keep this simple. You do not need a box of craft materials.</p>\n<p><strong>Simple item Useful for</strong></p>\n<p><strong>Crucifix or small Jesus, Paschal Mystery, discipleship cross</strong></p>\n<p><strong>Bible Gospel stories, Creed, Scripture and Tradition</strong></p>\n<p><strong>Cup or bowl of water Baptismal signs - never imitate the sacramental formula</strong></p>\n<p><strong>White cloth + candle Putting on Christ; Christ the Light</strong></p>\n<p><strong>Olive oil or hand A safe visual prompt for anointing - not blessed oil cream</strong></p>\n<p><strong>Bread or ordinary A comparison object only; never used as if it were cracker the Eucharist</strong></p>\n<p><strong>Cards / sticky notes Trinity, journey stages, Mass, choices and sorting</strong></p>\n<p><strong>Two chairs / phone Role-play, journey, rite rehearsal, light and torch conscience</strong></p>\n<h3>NEVER SIMULATE A SACRAMENT</h3>\n<p>You may use water, oil, a candle or a role-play to explain signs, but do not mimic a Baptism by pouring water while saying the sacramental words over a person. Practical rehearsal should make the real rite clearer, not imitate it.</p>\n<h3>LESSON 1</h3>\n<h3>AIM</h3>\n<p>Help the child see becoming Catholic as a personal response to God, not simply something adults have arranged.</p>\n<h3>QUICK PREP</h3>\n<p>Nothing needed. Optional: write the child’s name on a card.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Who knows your name best? What is different about someone knowing your name and someone really knowing you?”</p>\n<h3>THE NAME CARD</h3>\n<ol><li>Write the child’s name in the centre of a card or sheet of paper.</li><li>Around it, ask the child to name four things God already knows about them: something they enjoy, someone they love, something they find difficult, and something they hope for.</li><li>Ask: “If God knows all this and still calls you, what might he be inviting you into?”</li><li>Finish by making the Sign of the Cross slowly.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 1, especially REMEMBER and the paragraph explaining that becoming Catholic is a free response to grace.</p>\n<h3>LESSON 1</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Talk about God calling through people, Scripture, the Church and the child’s own desire.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Why did God make you? To know, love and serve him, and to be happy with him for ever.</strong></p>\n<p><strong>Does God force faith? No. God gives grace and calls us to answer freely. Why are you asking for Baptism? The child should be able to give a simple personal answer in their own words.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus, thank you for calling me by name. Help me to know you, love you and follow you freely. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each morning say: “Jesus, guide me today.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not supply the child’s reason for becoming Catholic too quickly. Their own free desire matters. If they struggle, keep the question open over several meetings rather than forcing a polished answer.</p>\n<h3>LESSON 2</h3>\n<h3>AIM</h3>\n<p>Give the child a simple, orthodox grasp of one God in three divine Persons.</p>\n<h3>QUICK PREP</h3>\n<p>Three sticky notes marked FATHER, SON, HOLY SPIRIT.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Make the Sign of the Cross together. Ask: “How many names did we say? How many Gods are there?”</p>\n<h3>ONE GOD - THREE PERSONS</h3>\n<ol><li>Place the three name cards side by side.</li><li>Ask the child what Christians believe about each: Is the Father God? Is the Son God? Is the Holy Spirit God?</li><li>Then ask the crucial question: “Does that mean three gods?” Let the child answer.</li><li>Bring the three cards together and say: three distinct Persons, one God - not three parts of God and not three gods.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 2. Use the catechism wording rather than trying to invent an analogy for the Trinity.</p>\n<h3>LESSON 2</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask why the Sign of the Cross is such an important prayer for someone preparing for Baptism.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>How many gods are there? One God. Who is the Holy Trinity? Father, Son and Holy Spirit: three divine Persons in one God.</strong></p>\n<p><strong>Is each Person truly God? Yes - each is wholly and eternally God.</strong></p>\n<h3>PRAY</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make the Sign of the Cross slowly once each day, naming each divine Person deliberately.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Avoid water/ice/steam, shamrock and similar analogies. They often teach something the Church does not mean. The catechism’s concise language is safer and clearer.</p>\n<h3>LESSON 3</h3>\n<h3>AIM</h3>\n<p>Connect the goodness of creation with the reality of sin and God’s promise to save.</p>\n<h3>QUICK PREP</h3>\n<p>Two cards: GOOD and BROKEN. Optional: a beautiful natural object or photograph.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask the child to name something in the world they think is genuinely good or beautiful. Then ask: “If God made the world good, why is everything not perfect?”</p>\n<h3>GOOD - BROKEN - PROMISED</h3>\n<ol><li>Put the GOOD card down. Name several good things God created.</li><li>Put down BROKEN. Ask for examples of things that go wrong because of human sin: lies, cruelty, selfishness, violence.</li><li>Clarify that creation is good, but humanity is fallen and needs salvation.</li><li>Add a third handwritten card: PROMISE. Ask: “Did God walk away from us?” Lead into the promise of a Saviour.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 3. Keep original sin and personal sin distinct.</p>\n<h3>LESSON 3</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Use one concrete example to distinguish an accident from a freely chosen wrong action.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Who created the world? God created it from nothing and made it good. What is original sin? The fallen condition in which we are born without original holiness and justice.</strong></p>\n<p><strong>Did God abandon humanity? No. He promised a Saviour.</strong></p>\n<h3>PRAY</h3>\n<p>Merciful Father, you made us for goodness. Save us from sin and teach us to choose what is right. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Notice one beautiful thing in creation and thank God for it; make one deliberate good choice.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the lesson hopeful. Sin explains why we need Christ; it is not the final word. The movement is always creation -&gt; fall -&gt; promise -&gt; salvation.</p>\n<h3>LESSON 4</h3>\n<h3>AIM</h3>\n<p>Help the child answer “Who is Jesus?” with more than “a good man” or “a teacher.”</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix and a Bible.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Show the crucifix. Ask: “If a friend asked who this is, what would you say?” Do not correct the first answer immediately.</p>\n<h3>WHO IS JESUS?</h3>\n<ol><li>Write four headings: TEACHER, HEALER, SAVIOUR, SON OF GOD.</li><li>Ask the child for a Gospel story that fits any heading. Supply one if needed.</li><li>Open a Gospel and read a short passage where Jesus acts with authority or mercy.</li><li>Ask: “Which heading is the most important if we want to say who Jesus really is?” Bring the answer to true God and true man, our Saviour.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 4 and use its exact teaching on Jesus being one divine Person with a true divine and true human nature.</p>\n<h3>LESSON 4</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what difference it makes that Jesus is not merely a wise teacher but the Son of God made man.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Who is Jesus Christ? The eternal Son of God made man.</strong></p>\n<p><strong>Is Jesus truly God and truly human? Yes. Why did he become man? To save us from sin and bring us to the Father.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus Christ, Son of the living God, have mercy on me and lead me to the Father. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one Gospel story about Jesus and tell another person what it reveals about him.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Let the Gospel do some of the teaching. The aim is encounter as well as information: the child is preparing to belong to Christ.</p>\n<h3>LESSON 5</h3>\n<h3>AIM</h3>\n<p>Show that the Cross and Resurrection belong together: sacrifice and victory.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix. Two cards: CROSS and EMPTY TOMB.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If our story about Jesus ended on Good Friday, what would be missing?”</p>\n<h3>FROM CROSS TO GLORY</h3>\n<ol><li>Place CROSS on the left and EMPTY TOMB on the right.</li><li>Ask the child to tell the story from the Last Supper to Easter morning in a few steps.</li><li>For each step ask: “What does this show about Jesus?”</li><li>Finish by placing the crucifix between the cards and saying: the same Jesus who truly died truly rose.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 5. Emphasise that the Resurrection is a real event, not just a way of saying the disciples felt hopeful.</p>\n<h3>LESSON 5</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask why Christians can face suffering and death with hope.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>How did Jesus redeem us? By his suffering, death and Resurrection. Did Jesus truly rise? Yes, bodily, on the third day.</strong></p>\n<p><strong>Will Jesus come again? Yes, in glory to judge the living and the dead.</strong></p>\n<h3>PRAY</h3>\n<p>We adore you, O Christ, and we bless you, because by your holy Cross you have redeemed the world. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Keep a crucifix where you pray and thank Jesus for his sacrifice and Resurrection.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not rush past either side: children need the reality of the Cross and the joy of the Resurrection. Christian hope is not pretending suffering is unreal.</p>\n<h3>LESSON 6</h3>\n<h3>AIM</h3>\n<p>Help the child see the Church as Christ’s living people, animated by the Holy Spirit, not merely a building.</p>\n<h3>QUICK PREP</h3>\n<p>A simple sketch of a church building and several blank stick-figure circles/cards.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If this church building disappeared tomorrow, would the Catholic Church disappear?”</p>\n<h3>BUILDING OR BODY?</h3>\n<ol><li>Place or draw the church building.</li><li>Add cards for Pope, bishop, priest, family, saints, parishioners and the child.</li><li>Ask which of these are part of the Church and what unites them.</li><li>Add a small flame or write HOLY SPIRIT in the centre: the Spirit gives life, sanctifies and unites the Church.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 6, especially the four marks of the Church and Baptism as sacramental entry into her life.</p>\n<h3>LESSON 6</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask how joining the Church through Baptism will change where the child belongs on Sundays and in ordinary life.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Who founded the Catholic Church? Jesus Christ.</strong></p>\n<p><strong>What are her four marks? One, holy, catholic and apostolic. How do we become members of Christ and his Church? Through Baptism.</strong></p>\n<h3>PRAY</h3>\n<p>Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn the names of the Pope, the Bishop of Nottingham and your parish priest.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Avoid reducing “Church” to clergy. The child should see a visible, sacramental people with real shepherds, but also a Body into which they themselves are being received.</p>\n<h3>LESSON 7</h3>\n<h3>AIM</h3>\n<p>Show that Catholic faith is received from God through Scripture and Tradition rather than invented individually.</p>\n<h3>QUICK PREP</h3>\n<p>Bible, Apostles’ Creed, two cards marked SCRIPTURE and TRADITION.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If everyone invented Christianity for themselves, how would we know what Jesus actually taught?”</p>\n<h3>RECEIVED, NOT INVENTED</h3>\n<ol><li>Place the Bible and the SCRIPTURE card on one side and TRADITION on the other.</li><li>Ask the child to name something Catholics know from Scripture and something Catholics do because the faith has been handed on in the Church.</li><li>Read a line of the Apostles’ Creed. Ask: “Did we invent this today?”</li><li>Explain that the Creed sums up the faith the Church has received and professes.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 7. Keep Scripture and Sacred Tradition together as one deposit of faith entrusted to the Church.</p>\n<h3>LESSON 7</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask whether faith means never asking questions. Draw out that faith seeks understanding.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is faith? The gift by which we believe God and all he has revealed.</strong></p>\n<p><strong>Where is revelation handed on? In Sacred Scripture and Sacred Tradition. What is the Creed? A summary and profession of Catholic faith.</strong></p>\n<h3>PRAY</h3>\n<p>Lord, I believe; help my unbelief. Keep me faithful to all that you have revealed through your Church. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn one new line of the Apostles’ Creed and ask about any word you do not understand.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Welcome genuine questions. “Received faith” does not mean switching off the mind; it means asking questions inside a relationship of trust with God and the Church.</p>\n<h3>LESSON 8</h3>\n<h3>AIM</h3>\n<p>Make prayer practical and help the child see how Catholic life becomes visible through habits.</p>\n<h3>QUICK PREP</h3>\n<p>Five small cards: ADORE, THANK, SORRY, ASK, LISTEN.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If you could speak to God for one minute right now, what would you say?”</p>\n<h3>FIVE WAYS TO PRAY</h3>\n<ol><li>Lay out the five prayer cards.</li><li>Ask the child to give one example sentence for each kind of prayer.</li><li>Choose one and pray it aloud together.</li><li>Then make a tiny weekly plan: Sunday Mass plus one short daily prayer the child can realistically keep.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 8, including the distinction between worshipping God and honouring the saints.</p>\n<h3>LESSON 8</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what someone would notice in a home where Catholic faith really mattered.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is prayer? Raising the mind and heart to God.</strong></p>\n<p><strong>What is the perfect prayer? The Our Father taught by Jesus. Do Catholics worship the saints? No. We worship God alone and ask the saints to pray for us.</strong></p>\n<h3>PRAY</h3>\n<p>Our Father, who art in heaven... Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the Our Father daily and attend Sunday Mass with the family.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Choose habits that can survive a busy week. One faithful practice is better than an ambitious plan that disappears after three days.</p>\n<h3>LESSON 9</h3>\n<h3>AIM</h3>\n<p>Form conscience without confusing accident, temptation and deliberate sin, while preparing the child for repentance before Baptism.</p>\n<h3>QUICK PREP</h3>\n<p>A plastic cup or harmless object. Three cards: ACCIDENT, TEMPTATION, CHOICE.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Hold up the cup. Ask: “Are these three the same: I drop it by accident; I feel like throwing it but do not; I throw it on purpose because I am angry?”</p>\n<h3>ACCIDENT - TEMPTATION - CHOICE</h3>\n<ol><li>Place the three cards in front of the child.</li><li>Give several simple scenarios and ask where each belongs.</li><li>For deliberate wrong choices, ask: “What would conversion look like now?” - sorrow, apology, repair, asking God for mercy.</li><li>Remind the child: before Baptism, they bring sin to God in repentance; Baptism will wash all previous sin away.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 9 and the catechism’s necessary note that an unbaptised child does not receive sacramental Confession before Baptism.</p>\n<h3>LESSON 9</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask why God’s commandments are a way of love rather than a collection of traps.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What do the commandments teach? How to love God and neighbour. Is temptation itself a sin? No.</strong></p>\n<p><strong>How are sins committed before Baptism forgiven? Every previous sin is forgiven in Baptism.</strong></p>\n<h3>PRAY</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make one act of repair for a real wrong choice, if appropriate.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Never ask the child to disclose private sins to you. This is formation of conscience, not rehearsal of Confession. Safeguarding disclosures are handled through normal parish procedures.</p>\n<h3>LESSON 10</h3>\n<h3>AIM</h3>\n<p>Help the child understand that the journey has stages because the Church is accompanying a real conversion, not running a course.</p>\n<h3>QUICK PREP</h3>\n<p>Seven cards: ENQUIRY, ACCEPTANCE, CATECHUMENATE, DISCERNMENT, PURIFICATION, INITIATION, MYSTAGOGY.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Why do you think the Church does not simply baptise someone five minutes after they first ask?”</p>\n<h3>BUILD THE JOURNEY</h3>\n<ol><li>Mix the seven cards and ask the child to put them in a sensible order.</li><li>Use Appendix A of the catechism to correct and explain the order.</li><li>For each stage ask: “What is growing here - knowledge, prayer, conversion, belonging, readiness?”</li><li>Put a small marker on the stage the child is currently living.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 10 and Appendix A. Emphasise “apprenticeship in Christian life.”</p>\n<h3>LESSON 10</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what has already changed since the child began this journey and what still needs to grow.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is a catechumen? An unbaptised person formally accepted for preparation for Baptism.</strong></p>\n<p><strong>Is the catechumenate only a course? No. It is an apprenticeship in Christian life.</strong></p>\n<p><strong>What determines readiness? Faith, conversion, sufficient understanding and a developing Christian life.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus, guide me on the road to Baptism. Let your Cross mark my mind, my words and my whole life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, pray for everyone preparing for Baptism and notice one way the parish supports them.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not make the child anxious about “passing stages.” The stages exist to serve grace and readiness, not to create hurdles.</p>\n<h3>LESSON 11</h3>\n<h3>AIM</h3>\n<p>Make clear what God truly gives in Baptism and distinguish sacramental reality from outward appearance.</p>\n<h3>QUICK PREP</h3>\n<p>Bowl or cup of clean water; white card marked BEFORE and blue card marked AFTER.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If someone looks exactly the same five minutes after Baptism, has anything really changed?”</p>\n<h3>VISIBLE WATER - INVISIBLE GRACE</h3>\n<ol><li>Place the water between BEFORE and AFTER.</li><li>Ask what water normally does: washes, refreshes, gives life.</li><li>Now ask what only God can do in Baptism: forgive sin, give sanctifying grace, make us adopted children, join us to Christ and the Church, give an indelible character.</li><li>Say clearly: the water is a real sacramental sign through which Christ acts; it is not magic and not merely a symbol.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 11. Do not rehearse Baptism by pouring water over the child while saying the sacramental formula.</p>\n<h3>LESSON 11</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask which effect of Baptism seems most important to the child and why.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is Baptism? The sacrament of rebirth by water and the Holy Spirit. What sins does it forgive? Original sin and every personal sin committed before it.</strong></p>\n<p><strong>Can Baptism be repeated? No. It gives an indelible character.</strong></p>\n<h3>PRAY</h3>\n<p>Heavenly Father, prepare me for the saving waters of Baptism and make me a faithful child of your Church. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Visit the baptismal font and thank God for the grace he will give there.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the activity sacramentally reverent. Ordinary water may illustrate the sign, but only the Church’s real celebration is Baptism.</p>\n<h3>LESSON 12</h3>\n<h3>AIM</h3>\n<p>Help the child read the signs of the rite: Cross, water, anointing, white garment and light.</p>\n<h3>QUICK PREP</h3>\n<p>A cross, bowl of water, small amount of ordinary oil/cream, white cloth, candle or battery candle.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Place the objects on a table. Ask: “Without saying anything, what do you think each object is trying to tell us?”</p>\n<h3>READ THE SIGNS</h3>\n<ol><li>Let the child choose one object at a time and say what it might mean.</li><li>Use the catechism to refine the meanings: Cross - belonging to Christ; water - cleansing/new birth; anointing - consecration; white garment - putting on Christ; candle - Christ’s light and living faith.</li><li>Ask which sign speaks most strongly to the child.</li><li>Practise only the spoken responses and promises - never a simulated Baptism.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 12 and Appendix B. Note that the child personally rejects sin and professes the Catholic faith.</p>\n<h3>LESSON 12</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what “keeping the flame of faith alive” might look like six months after Baptism.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What must the child reject? Sin, Satan and all that leads away from God.</strong></p>\n<p><strong>What faith is professed? The Catholic faith in Father, Son, Holy Spirit and the Church. What does the candle mean? Christ’s light and the duty to keep faith alive.</strong></p>\n<h3>PRAY</h3>\n<p>Jesus, Light of the world, keep the flame of faith alive in me and make my life shine with good works. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read the baptismal promises and practise answering them freely and clearly.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The child should know what they are saying yes and no to. Avoid drilling responses without meaning.</p>\n<h3>LESSON 13</h3>\n<h3>AIM</h3>\n<p>Help the child distinguish what the senses perceive from what Christ gives in the Eucharist.</p>\n<h3>QUICK PREP</h3>\n<p>An ordinary cracker or piece of bread in its packet; a Bible. Do not place ordinary food where it could be mistaken for the Blessed Sacrament.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Can our eyes tell us everything that is true?” Let the child give examples where we rely on trustworthy testimony.</p>\n<h3>WHAT THE EYES SEE - WHAT CHRIST SAYS</h3>\n<ol><li>Look at ordinary bread and list what the senses can tell: shape, smell, taste, texture.</li><li>Put it away. Open the Bible or catechism to Jesus’ words at the Last Supper.</li><li>Ask: “After consecration the Host still looks like bread. Why do Catholics believe Jesus is truly present?”</li><li>Use the catechism language: the whole substance changes; the appearances remain; Jesus is truly, really and substantially present.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 13. Use the catechism rather than inventing analogies for transubstantiation.</p>\n<h3>LESSON 13</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what “Amen” to the Body of Christ will mean when the child receives First Holy Communion.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Who is present in the Eucharist? Jesus Christ, truly, really and substantially. What is transubstantiation? The change of the whole substance of bread and wine into Christ’s Body and Blood.</strong></p>\n<p><strong>Is the Eucharist merely a symbol? No.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus, I believe that you are truly present in the Blessed Sacrament. Increase my faith and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make a short visit to the tabernacle and say quietly, “My Lord and my God.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>This is one of the key readiness points. Do not settle for “special bread.” The child should distinguish the consecrated Eucharist from ordinary food according to their capacity.</p>\n<h3>LESSON 14</h3>\n<h3>AIM</h3>\n<p>Connect Calvary and the Mass without suggesting that Jesus dies again.</p>\n<h3>QUICK PREP</h3>\n<p>Crucifix; two cards: CALVARY and MASS.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Place the crucifix by CALVARY. Ask: “How many times did Jesus die?” Then place MASS beside it.</p>\n<h3>ONE SACRIFICE MADE PRESENT</h3>\n<ol><li>Ask the child to tell what happened on Calvary.</li><li>Ask what happens at Mass. Listen for “Jesus dies again” and gently correct if needed.</li><li>Place the crucifix between the two cards and say: one sacrifice, once for all; at Mass that one sacrifice is made sacramentally present.</li><li>Name the two principal parts of Mass and ask what the child does in each.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 14 and Appendix C.</p>\n<h3>LESSON 14</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask what the child could spiritually offer with Jesus at the next Mass: a joy, worry, person, sacrifice or act of love.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What is the Mass? Christ makes present and offers sacramentally his one Sacrifice of the Cross.</strong></p>\n<p><strong>Does Jesus die again? No. What are the two principal parts? Liturgy of the Word and Liturgy of the Eucharist.</strong></p>\n<h3>PRAY</h3>\n<p>Eternal Father, I offer myself with Jesus in the Holy Sacrifice of the Mass. Accept my whole life through him. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, notice one moment in the Liturgy of the Word and one in the Liturgy of the Eucharist.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the language simple but accurate: “made present” is better than saying the Mass merely “reminds us” of Calvary.</p>\n<h3>LESSON 15</h3>\n<h3>AIM</h3>\n<p>Prepare the child practically and spiritually to receive, especially the meaning of “Amen.”</p>\n<h3>QUICK PREP</h3>\n<p>Two chairs for a simple procession; an unconsecrated practice host only if parish practice permits.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When the minister says ‘The Body of Christ’ and you say ‘Amen’, what are you saying yes to?”</p>\n<h3>PRACTISE THE MEANING, NOT JUST THE MOVEMENTS</h3>\n<ol><li>Walk through the Communion procession calmly.</li><li>Practise the exchange: “The Body of Christ.” - “Amen.” Ask the child to explain Amen in their own words.</li><li>Rehearse the approved manner of receiving and immediate consumption, according to parish practice.</li><li>Review the one-hour fast and what to do if unsure about receiving.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 15 and Appendix C. Note carefully: an unbaptised child does not make Confession before Baptism; Baptism forgives every previous sin.</p>\n<h3>LESSON 15</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask how the child can prepare their heart as well as their body for Communion.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>Whom do you receive? Jesus Christ, Body, Blood, Soul and Divinity.</strong></p>\n<p><strong>Does an unbaptised child confess before Baptism? No. Baptism forgives every previous sin. What does “Amen” mean here? I believe.</strong></p>\n<h3>PRAY</h3>\n<p>Come, Lord Jesus. Make my heart ready to receive you with faith, reverence and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With an adult, work out the Eucharistic fast and practise a short thanksgiving prayer.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>If Baptism and First Communion are celebrated together, the child comes from Baptism free from every sin. Do not accidentally import the First Confession pathway into this one.</p>\n<h3>LESSON 16</h3>\n<h3>AIM</h3>\n<p>Make clear that Baptism and First Communion begin a life of discipleship; they are not a graduation.</p>\n<h3>QUICK PREP</h3>\n<p>A weekly calendar or blank piece of paper. Four cards: MASS, PRAYER, MERCY, SERVICE.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Imagine it is six months after your Baptism. What would show that being Catholic has become part of your life?”</p>\n<h3>BUILD A SIMPLE RULE OF LIFE</h3>\n<ol><li>Put MASS, PRAYER, MERCY and SERVICE on the table.</li><li>For each, choose one realistic habit: Sunday Mass; short daily prayer; learning to use Confession after Baptism; one act of charity or parish service.</li><li>Write the habits onto a weekly or monthly calendar.</li><li>Add one future step: continuing formation and preparation for Confirmation according to the parish pathway.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 16 and the final readiness material.</p>\n<h3>LESSON 16</h3>\n<p>Conversation, prayer and a simple next step</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Ask which habit will be easiest, which will be hardest, and who will help the child keep going.</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p><strong>What duties follow Baptism? Faithfulness to Christ, Sunday Mass, prayer, obedience to God and love of neighbour.</strong></p>\n<p><strong>What sacrament forgives serious sins after Baptism? Penance and Reconciliation.</strong></p>\n<p><strong>Is formation finished after First Holy Communion? No. Catholic growth continues throughout life.</strong></p>\n<h3>PRAY</h3>\n<p>Lord Jesus, remain with me by your grace. Keep me faithful to your Church and help me grow in holiness. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Begin the simple rule of life now rather than waiting until after Baptism.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The child needs a real community around them. A rule of life is only useful if family, godparent, mentor and parish help make it possible. Use this as a pastoral overview, not as a timetable.</p>\n<p><strong>Stage What is happening</strong></p>\n<p><strong>Enquiry Questions, welcome and Sunday Mass.</strong></p>\n<p><strong>Acceptance The Church welcomes the child among the catechumens.</strong></p>\n<p><strong>Catechumenate Faith, prayer, conversion, worship and belonging deepen.</strong></p>\n<p><strong>Discernment Child, family, mentor and priest consider readiness.</strong></p>\n<p><strong>Purification Prayer, repentance, Creed and Our Father.</strong></p>\n<p><strong>Initiation Baptism and First Holy Communion according to the authorised arrangement.</strong></p>\n<p><strong>Mystagogy Life from the sacraments; continuing formation towards Confirmation.</strong></p>\n<h3>IMPORTANT ABOUT CONFIRMATION</h3>\n<p>The source catechism notes that Baptism, Confirmation and Eucharist ordinarily belong together for an unbaptised child who has reached the age of reason, while this parish pathway prepares for Confirmation later. That arrangement must follow the directions of the parish priest and any competent diocesan permission or policy. Readiness is not perfect memory or finishing sixteen meetings. Look for a growing Christian life.</p>\n<h3>FREE DESIRE</h3>\n<p>The child personally wants Baptism and can say simply why.</p>\n<h3>FAITH IN CHRIST</h3>\n<p>The child knows the central Gospel and trusts Jesus as Saviour.</p>\n<h3>CATHOLIC FAITH</h3>\n<p>The child can receive the Trinity, Church, Creed, prayer and moral life according to capacity.</p>\n<h3>CONVERSION</h3>\n<p>The child can recognise deliberate wrongdoing, repent and make amends.</p>\n<h3>BAPTISM</h3>\n<p>The child knows Baptism truly forgives sin, gives grace and joins us to Christ and the Church.</p>\n<h3>EUCHARIST</h3>\n<p>The child distinguishes the Body of Christ from ordinary food and believes the Real Presence.</p>\n<h3>SUNDAY LIFE</h3>\n<p>The child and family are developing a stable pattern of Sunday Mass and parish belonging.</p>\n<h3>PRACTICAL READINESS</h3>\n<p>The child can participate in the promises and receive Communion reverently with needed adaptations.</p>\n<h3>CONTINUING FORMATION</h3>\n<p>The family understands that mystagogy, future Confession and continuing preparation remain part of the journey.</p>\n<h3>FOR THE PRIEST</h3>\n<p>Final sacramental and canonical discernment belongs to the priest, following the approved rites, current Church law and diocesan direction.</p>\n<h3>The best meetings will not all look the same.</h3>\n<p>Sometimes the child will want to talk. Sometimes the object or activity will unlock the teaching. Sometimes one sentence from the catechism will be enough. Sometimes a question will need to be carried to the next meeting.</p>\n<h3>KEEP THE ORDER SIMPLE</h3>\n<p>Person first. Activity second. Catechism for the teaching. Conversation. Prayer. One next step.</p>\n<h3>DO NOT RUSH</h3>\n<p>A child who has reached the age of reason is making a real catechumenal journey. Understanding, conversion, Sunday worship, desire and belonging matter more than completing pages quickly.</p>\n<h3>KEEP CHRIST AT THE CENTRE</h3>\n<p>The goal is not that the child can pass a Catholic quiz. The goal is that the child comes to know Jesus Christ, freely asks for Baptism, receives the sacraments with faith and begins to live as a Catholic disciple.</p>"}, {"name": "Baptised Children Coming into the Church", "url": "https://3stepuk.github.io/Coming-into-the-Catholic-Church-Child/", "desc": "For baptised children entering full communion.", "html": "<p>For validly baptised children of catechetical age</p>\n<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>Use with Coming into the Catholic Church A Preparation Catechism for Baptised Children. The catechism gives the teaching; this guide helps a parent, mentor or priest make it personal and memorable.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the child</li><li>Do something concrete</li><li>Open the catechism</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>THE SACRAMENTAL PATHWAY</h3>\n<p>First Confession before Reception. Profession of Faith and Reception, then Confirmation and First Holy Communion ordinarily within the same Mass.</p>\n<h2>How to use this guide</h2>\n<h3>THE PRINCIPLE</h3>\n<p>The child is already Christian through Baptism. Honour what God has given and accompany a free, sincere desire for full Catholic communion.</p>\n<h3>For each lesson</h3>\n<ol><li>Make the Sign of the Cross and ask the opening question. Listen before explaining.</li><li>Try the activity. All cards can be handwritten; drawing and speaking are equally welcome.</li><li>Open the matching catechism lesson. Read the indicated teaching slowly and pause for questions.</li><li>Talk together. Use the short answers to clarify what needs to be understood.</li><li>Pray the printed prayer and choose one action for the week.</li><li>Repeat or adapt as needed. Sixteen lessons do not require sixteen meetings or a fixed timetable.</li></ol>\n<h3>BEFORE YOU BEGIN</h3>\n<p>The priest must establish valid Baptism and the correct pathway. A Catholic Baptism, doubtful Baptism, Eastern Christian background or previous Confirmation needs his particular guidance.</p>\n<h3>The adult alongside</h3>\n<p>You need no prepared talk. The activity opens the conversation; the catechism supplies the teaching. Take difficult questions to the priest. Adjust to the child’s age, language and capacity.</p>\n<h2>A small activity kit</h2>\n<p>Keep it simple. Use ordinary items already at home or in church. No craft kit or separate workbook is needed.</p>\n<h3>Paper and a pen</h3>\n<p>Names, cards, choices, gifts of the Holy Spirit and a simple calendar.</p>\n<h3>A crucifix or cross</h3>\n<p>Jesus our Saviour, the Cross and the Holy Sacrifice of the Mass.</p>\n<h3>The preparation catechism</h3>\n<p>All sixteen lessons, the Creed, prayers and the practical sacramental guides.</p>\n<h3>An optional Bible</h3>\n<p>A familiar Gospel story. The activities can use the catechism alone.</p>\n<h3>A cup of water</h3>\n<p>A visual reminder of Baptism already received. No water is poured over anyone.</p>\n<h3>A church visit</h3>\n<p>The font, altar, ambo, tabernacle and place of Confession, when access is arranged.</p>\n<h3>A chair or clear floor space</h3>\n<p>A calm walk through movements and spoken responses.</p>\n<h3>REHEARSE RESPONSES AND MOVEMENTS</h3>\n<p>Do not act out sacramental absolution, anoint with chrism or imitate a consecration. Any ordinary bread remains ordinary food. The real celebration uses the approved rite.</p>\n<h2>God Calls Me to Follow Jesus</h2>\n<h3>AIM</h3>\n<p>Help the child speak about becoming Catholic as their own response to Jesus.</p>\n<h3>QUICK PREP</h3>\n<p>Paper and a pen, or simply a conversation.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Who has helped you know Jesus? What makes you want to become Catholic?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>My name and my response</strong></p>\n<ol><li>Write the child’s name. Around it, add people who have helped them learn about God.</li><li>Ask t
