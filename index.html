an idea of freedom for the good?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is Christian freedom? The capacity to choose and live the true good, healed and strengthened by grace.</li><li>What is conscience? A judgement of practical reason by which a person recognises the moral quality of a concrete act.</li><li>How is conscience formed? By truth: Scripture, Church teaching, prayer, sound reason, virtue and honest counsel.</li><li>What makes a sin mortal? Grave matter, full knowledge and deliberate consent together.</li><li>Is temptation itself a sin? No. Sin requires a sufficiently free act of the will.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord, give me a truthful conscience, hatred of sin without fear or scrupulosity, and the virtues I need to love what is good steadily and freely. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Review the Ten Commandments and the Beatitudes. Choose one commandment and one Beatitude that speak most directly to your present life.</p></div></details>\n<h2>Freedom Conscience Virtue and Sin</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How can conscience be both personally binding and in need of formation?”</li><li>“Which good habit would make a right choice easier?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is conscience? Reason’s judgement about a concrete act’s moral quality. What makes sin mortal? Grave matter, full knowledge and deliberate consent together. Is temptation itself sin? No.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, give me a truthful conscience and steady love of the good. Free me from sin and help me grow in virtue. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one virtue and one small action through which to practise it.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Use fictional situations, without judging whether a particular person has committed mortal sin. Avoid both trivialising grave matter and causing scrupulosity. Private examination and sensitive questions can be taken to the priest without group disclosure.</p>\n<h2>Love in Concrete Life</h2>\n<h3>AIM</h3>\n<p>Connect the Church’s moral teaching with dignity, truth and costly love.</p>\n<h3>QUICK PREP</h3>\n<p>Paper listing LIFE, RELATIONSHIPS, WORK, SPEECH, POSSESSIONS.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which area of Catholic moral teaching most needs patient explanation for you?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What love requires</strong></p>\n<ol><li>Choose a case: an employer exploits a vulnerable worker; a family dismisses an elderly relative as a burden; a friend treats sexual intimacy as having no lasting obligations.</li><li>Ask what dignity or good is at stake and why love requires more than strong feelings.</li><li>Read all of Conversation 19, including life, chastity, marriage, truth, justice and the common good. Do not omit a difficult teaching.</li>\n<details class=\"conv\"><summary>Open Conversation 19 &mdash; Love in Concrete Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Catholic morality protects the dignity of the human person and orders every part of life towards love of God and neighbour: life, sexuality, family, truth, possessions, work, justice, mercy and the common good.</p>\n<p>Human life is sacred from conception until natural death. We therefore reject direct abortion, euthanasia, assisted suicide, deliberate destruction of human embryos and intentional killing of the innocent, while also insisting on care for mothers, children, the sick, disabled, poor, elderly, imprisoned and vulnerable. Human sexuality is a gift ordered to faithful married love and openness to life. Chastity integrates sexuality according to one&#x27;s state of life. Marriage is exclusive and lifelong; sexual intimacy belongs within marriage. Fornication, adultery, pornography, masturbation and contraceptive acts misuse sexuality by separating it from the faithful, total and life-giving meaning of marital love. Same-sex attraction is not itself a sin; every person has equal dignity and every Christian is called to chastity. Spouses may, for serious reasons, space births by morally licit natural methods while remaining open to life. Love also governs money, speech and society. Christians must reject theft, fraud, racism, exploitation, calumny, lying and indifference to injustice. The works of mercy, care for creation, solidarity with the poor and concern for the common good are not optional additions to faith.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which area of Catholic moral teaching most needs patient explanation for you rather than a quick rule?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Why does the Church defend human life? Because every human person bears God&#x27;s image and has an inviolable dignity that does not depend on ability, usefulness or stage of development.</li><li>What is chastity? The virtue that integrates sexuality within the person according to one&#x27;s state of life and God&#x27;s design.</li><li>What is marriage ordered towards? The good of husband and wife and the procreation and education of children; marital love remains open to life.</li><li>Does Christian morality concern social justice? Yes. Love of neighbour includes justice, solidarity, care for the poor and responsibility for the common good.</li><li>What should you do when a teaching is difficult? Seek understanding honestly, pray, ask questions and avoid pretending assent while also avoiding dismissing the Church before understanding her reasons.</li></ol>\n<h4>PRAYER</h4>\n<p>God of truth and mercy, order my desires, relationships, speech, possessions and choices towards genuine love. Give me courage where conversion is costly. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one work of mercy to practise this week. If there is a moral teaching you find especially difficult, write the actual question down and bring it to the priest or mentor.</p></div></details><li>Let the person identify one teaching needing further discussion and one possible work of mercy. Personal details may remain private.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 19. Divide the discussion across several meetings when needed, while preserving the whole teaching.</p>\n<h2>Love in Concrete Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What reasons does the Church give for this teaching?”</li><li>“How can clarity about right and wrong be joined to practical mercy?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why defend every human life? Every person bears God’s image and has inviolable dignity. What is chastity? The integration of sexuality according to one’s state of life and God’s design. Does morality include social justice? Yes. Love requires justice, mercy and concern for the common good.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>God of truth and mercy, order my desires, relationships, speech and possessions towards love. Give me courage where conversion is costly. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one work of mercy that responds to a real person’s need.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not substitute a vague discussion of kindness for the source’s moral teaching. Invite sincere questions about the reasons. Complex relationships or moral struggles need patient, confidential pastoral care; never force sensitive disclosure in a group.</p>\n<h2>Prayer and the Ordinary Catholic Life</h2>\n<h3>AIM</h3>\n<p>Build a realistic pattern of prayer, Sunday worship, charity and parish belonging.</p>\n<h3>QUICK PREP</h3>\n<p>A weekly calendar or blank paper.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What pattern of prayer and worship could last after your first enthusiasm fades?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A rule that can be lived</strong></p>\n<ol><li>Write DAILY, SUNDAY, WEEKLY and PARISH. Add one manageable practice under each.</li><li>For DAILY, choose prayer from the printed texts at the end. For SUNDAY, plan Mass and necessary transport or work arrangements.</li><li>For WEEKLY, choose a work of mercy. Under PARISH, name a person or setting that will help continued belonging.</li><li>Read Conversation 20 about the Church’s worship and discipline. Mark Confession and worthy sacramental Communion as practices beginning after Baptism.</li>\n<details class=\"conv\"><summary>Open Conversation 20 &mdash; Prayer and the Ordinary Catholic Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Catholic life is sustained by Sunday Mass, daily prayer, Scripture, the liturgical year, sacramental life, fasting, charity, devotion and participation in the mission of the Church.</p>\n<p>Prayer is relationship with God: blessing, adoration, petition, intercession, thanksgiving and praise. Catholics pray to the Father through Christ in the Holy Spirit, both liturgically and personally. The Lord&#x27;s Prayer is the pattern of Christian prayer. Sunday Mass and Holy Days of Obligation form the stable centre of Catholic worship. After initiation, the Church also asks a minimum sacramental and penitential discipline: receive the Eucharist at least during the Easter season, confess serious sins at least annually, observe prescribed days of fast and abstinence, and support the Church according to ability. Daily prayer need not be elaborate: morning offering, Scripture, the Our Father, examination of conscience, grace at meals, the Rosary or other devotions can form a realistic rule. Devotions serve the liturgy; they do not replace it. Catholic discipleship is also missionary and charitable. Every Christian receives gifts for service, belongs to a concrete parish and is sent to witness to Christ in family, work, friendship and public life. The Christian life is not private spirituality.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What simple rhythm of prayer and worship could realistically become normal in your life rather than an intense plan that lasts only two weeks?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is the centre of weekly Catholic worship? Sunday Mass.</li><li>What is the model of Christian prayer? The Lord&#x27;s Prayer taught by Jesus.</li><li>Should Catholics read Scripture personally? Yes. Scripture belongs at the heart of liturgy, prayer and catechesis.</li><li>What minimum disciplines belong to Catholic life? Sunday Mass and Holy Days, worthy reception of the Eucharist, Confession when needed, the Church&#x27;s fast and abstinence, and support of the Church according to ability.</li><li>Are lay Catholics called to mission? Yes. Every baptised person shares in the Church&#x27;s mission according to vocation and gifts.</li></ol>\n<h4>PRAYER</h4>\n<p>Father, teach me to pray. Make Sunday worship, Scripture, charity and service ordinary parts of my life, and give me perseverance when enthusiasm fades. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Write a simple rule for the next seven days: Sunday Mass, ten minutes of daily prayer, one Scripture reading and one act of charity. Keep it realistic.</p></div></details></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 20 and Appendix F. Devotions support the liturgy and do not replace Sunday Mass.</p>\n<h2>Prayer and the Ordinary Catholic Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What usually gets in the way of prayer, and what small change would help?”</li><li>“Who will help you remain part of parish life?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the weekly centre? Sunday Mass. What is the model of prayer? The Our Father taught by Jesus. Are lay Catholics called to mission? Yes, according to vocation and gifts.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, teach me to pray. Make worship, Scripture, charity and service ordinary parts of my life. Give me perseverance. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Keep the simple rule you have chosen for the next seven days.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Adapt to work, disability, caring duties and language needs. Teach the actual discipline rather than inventing personal burdens. Before Baptism the person attends worship without receiving Communion and learns repentance without sacramental Confession.</p>\n<h2>Election Scrutinies and the Battle for the Heart</h2>\n<h3>AIM</h3>\n<p>Explain Election and the Lenten rites as discernment, purification and healing.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: ELECTION, SCRUTINIES, INITIATION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you hope Christ will strengthen or heal as Baptism draws nearer?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What the Lenten rites are doing</strong></p>\n<ol><li>Place ELECTION first. Explain the Church’s call of catechumens ready for the final preparation, following testimony and discernment.</li><li>Add SCRUTINIES. Read that these are prayers of intercession and exorcism for the elect, not tests or public Confession.</li><li>Use a fictional concern such as fear of changing an unjust habit. Ask what healing and strengthening would mean. No personal sin need be named.</li><li>Add INITIATION. Plan prayer, appropriate fasting and charity with the parish, keeping Lent’s spiritual purpose central.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 21 and Appendix B. Confirm current diocesan arrangements with the priest.</p>\n<details class=\"conv\"><summary>Open Conversation 21 &mdash; Election, Scrutinies and the Battle for the Heart</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>After sufficient growth in faith, conversion and Christian life, the Church may call a catechumen to Election. The elect enter Lent as a period of deeper purification and enlightenment before the Easter sacraments.</p>\n<p>Election is not a prize for passing a test. The Church listens to the testimony of godparents and those who have accompanied you and discerns whether there is a real intention to receive the sacraments, sufficient knowledge of Christian teaching, a spirit of faith and charity, and growth in conversion. The Scrutinies are celebrated for the elect during Lent. They are not examinations and must never become public disclosure of private sins. They are prayers of exorcism and intercession asking Christ to uncover and heal what is weak, strengthen what is good and free the elect from the power of sin and the evil one. This period becomes more prayerful and interior. The focus shifts from accumulating information towards repentance, spiritual combat, desire for Christ, fasting, prayer and charity.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What do you most want Christ to heal, strengthen or set in order in you before Baptism - without feeling any need to disclose private sins publicly?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is Election? The Church&#x27;s liturgical discernment and choice of catechumens judged ready for the final preparation for initiation.</li><li>When is it normally celebrated? On the First Sunday of Lent, ordinarily with the diocesan bishop.</li><li>What are catechumens called after Election? The elect.</li><li>What are the Scrutinies? Lenten rites of prayer and exorcism for purification, healing and strengthening of the elect.</li><li>Are Scrutinies public Confession? No. No one should be required to disclose private sins in the rite or catechesis.</li></ol>\n<h4>PRAYER</h4>\n<p>Jesus, light of the world, search my heart with mercy. Free me from what enslaves, strengthen what is good and prepare me to renounce sin and belong wholly to you. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Take Lent seriously: choose one form of fasting, one additional prayer and one concrete work of charity. Keep it faithful rather than dramatic.</p></div></details>\n<h2>Election Scrutinies and the Battle for the Heart</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does readiness include Christian life as well as knowledge?”</li><li>“What is different about prayer for healing and public interrogation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is Election? The Church’s call to the final preparation for initiation. What are those called now named? The elect. Are Scrutinies public Confession? No. They are rites of purification and strengthening.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, light of the world, search my heart with mercy. Free me from what enslaves and strengthen what is good. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one faithful Lenten practice with your mentor and keep it quietly.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Use this conversation at the appropriate point in the journey, not merely after twenty meetings. The priest arranges the rites. Do not stage a mock Scrutiny or invite disclosure of private sins; sacramental Confession remains after Baptism.</p>\n<h2>Creed Lord’s Prayer and Final Preparation</h2>\n<h3>AIM</h3>\n<p>Help the elect profess the faith sincerely and receive the Church’s prayer.</p>\n<h3>QUICK PREP</h3>\n<p>The Apostles’ Creed and Our Father printed at the end of this guide.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “If asked why you want Baptism, what would you say in your own words?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Receiving faith and prayer</strong></p>\n<ol><li>Read the Creed slowly. Pause after the Father, the Son, the Holy Spirit and the Church. Ask the person to explain one truth from each part.</li><li>Read the Our Father. Choose one petition and discuss how it shapes a Christian life.</li><li>Practise making responses calmly while asking whether the words are sincerely meant. Questions can still be brought to the priest.</li><li>Explain that final repentance is a peaceful review before God, with appropriate reparation, not sacramental Confession before Baptism.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 22. The priest uses the approved rite for the actual presentations, baptismal profession and responses.</p>\n<details class=\"conv\"><summary>Open Conversation 22 &mdash; Creed, Lord&#x27;s Prayer and Final Preparation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The elect are entrusted with the Church&#x27;s faith and prayer as the final preparation deepens: the Creed gathers what the Church believes, and the Lord&#x27;s Prayer reveals the life of God&#x27;s adopted children.</p>\n<p>The presentations of the Creed and the Lord&#x27;s Prayer express something profound: the faith is received before it is personally professed, and Christian prayer is learned within the praying Church. At Baptism you will renounce sin and profess this faith for yourself. You should now be able to explain the core of the faith in ordinary words, but perfect memory is not the standard. More important are sincere faith in Christ, sufficient understanding, conversion of life, desire for the sacraments, prayer and willingness to live within the Church. Baptism will forgive every sin of your past. Do not attempt sacramental Confession beforehand. Instead make a peaceful review of your life before God, repent sincerely, forgive others, repair what reasonably can be repaired and ask for the grace to begin anew.</p>\n<h4>TALK ABOUT IT</h4>\n<p>If you were asked, &quot;Why do you want to be baptised now?&quot;, what would you say in your own words?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What does the Creed give us? A concise profession of the apostolic faith into which we are baptised.</li><li>Why is the Lord&#x27;s Prayer important? Jesus gave it as the pattern of Christian prayer and it expresses our life as children of the Father.</li><li>Must every answer be memorised perfectly before Baptism? No. Sufficient understanding, real faith, conversion and readiness matter more than polished language.</li><li>Should the elect make sacramental Confession before Baptism? No. Baptism forgives all prior sin.</li><li>What should be done about past wrongs? Repent sincerely and, where reasonably possible and safe, repair harm and seek reconciliation.</li></ol>\n<h4>PRAYER</h4>\n<p>Father, I believe; help my unbelief. Forgive, heal and prepare me. Teach me to say with truth the faith of your Church and the prayer your Son has given us. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Pray the Creed and the Lord&#x27;s Prayer slowly every day. Reconcile with someone if this can be done wisely and safely, or take one concrete step towards repairing past harm.</p></div></details>\n<h2>Creed Lord’s Prayer and Final Preparation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What does receiving the faith from the Church mean for you?”</li><li>“What still needs clarification before you profess that faith?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What does the Creed summarise? The apostolic faith into which we are baptised. Must every answer be perfectly memorised? No. Sincere faith and sufficient understanding matter. Do the elect confess sacramentally before Baptism? No. Baptism forgives all previous sin.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, increase my faith. Prepare me to profess your truth freely and pray as your child. Heal what needs healing and lead me into new life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the Creed and Our Father slowly each day, bringing any real difficulty to the priest.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>The printed Apostles’ Creed is for learning and prayer; the approved rite supplies the profession used at initiation. Avoid cramming or pressure. Any act of repair or reconciliation should be wise, safe and proportionate.</p>\n<h2>The Easter Vigil and the Sacraments of Initiation</h2>\n<h3>AIM</h3>\n<p>Prepare the elect to participate peacefully in Baptism, Confirmation and First Holy Communion.</p>\n<h3>QUICK PREP</h3>\n<p>Five cards: LIGHT, WORD, BAPTISM, CONFIRMATION, EUCHARIST.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which part of the Vigil are you most longing for, and which makes you nervous?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Walk through the celebration</strong></p>\n<ol><li>Arrange the cards using Conversation 23. Explain the movement through light and salvation history to sacramental initiation.</li>\n<details class=\"conv\"><summary>Open Conversation 23 &mdash; The Easter Vigil and the Sacraments of Initiation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>At the Easter Vigil the elect normally receive the three sacraments of Christian initiation together: Baptism, Confirmation and the Eucharist. You die and rise with Christ, are sealed with the Holy Spirit and are welcomed to the Lord&#x27;s table.</p>\n<p>The Vigil begins in darkness and moves through light and the proclamation of salvation history towards the baptismal liturgy. The saints are invoked, the water is blessed, you renounce sin, profess the faith and are baptised with water in the name of the Father, Son and Holy Spirit. You are then clothed in the white garment and entrusted with the light of Christ. Normally you are immediately confirmed with sacred chrism. The Mass continues and you receive Holy Communion for the first time. The sacraments are God&#x27;s action, not a performance you must execute perfectly. The ministers will guide you. Prepare through prayer, appropriate fasting, practical rehearsal and peaceful trust. The day is the beginning of Catholic life, not graduation from it.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which part of the Easter Vigil are you most longing for, and what part makes you most nervous?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What sacraments does an adult catechumen normally receive at initiation? Baptism, Confirmation and the Eucharist.</li><li>What is the essential action of Baptism? Washing with true water while the Trinitarian baptismal form is spoken.</li><li>What follows Baptism? The newly baptised is normally confirmed and then receives Holy Communion.</li><li>What is the white garment? A sign of the new dignity and life of one clothed in Christ.</li><li>What is the baptismal candle? A sign of the light of the risen Christ entrusted to the newly baptised.</li></ol>\n<h4>PRAYER</h4>\n<p>Risen Lord Jesus, bring to completion what you have begun in me. Through water and the Holy Spirit make me your own, feed me with your Body and Blood, and keep me faithful until death. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Confirm the practical arrangements with the parish. Pray rather than cram. If possible, spend quiet time before the Blessed Sacrament and ask the parish to pray for you by name.</p></div></details><li>Review the renunciation of sin and profession of faith. Rehearse only the spoken responses and practical movements directed by the priest.</li><li>Explain water, white garment, candle and sacred chrism. Baptism, Confirmation and Eucharist ordinarily belong in the same celebration.</li><li>Practise “Amen” before Communion and plan a short thanksgiving. Review the one-hour Eucharistic fast, except water and medicine, with the priest.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 23 and Appendix B. The approved rite and the priest’s directions govern every actual liturgical action.</p>\n<h2>The Easter Vigil and the Sacraments of Initiation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What gift does each sacrament bring?”</li><li>“What practical concern can we settle so you can pray with greater peace?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Which sacraments are received? Baptism, Confirmation and the Eucharist. What does the white garment signify? The new dignity of being clothed in Christ. What does Amen before Communion express? Faith that this is the Body of Christ.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Risen Lord Jesus, complete what you have begun in me. Make me your own, feed me with your Body and Blood and keep me faithful. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Confirm practical arrangements with the parish and spend time in quiet prayer.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Rehearse without pretending to administer sacraments. Resolve mobility, language, health or other practical needs beforehand. Do not require sacramental Confession before Baptism. Receive the newly baptised into parish life beyond the celebration.</p>\n<h2>Mystagogy Living as a Newly Baptised Catholic</h2>\n<h3>AIM</h3>\n<p>Deepen the experience of the sacraments through continuing Catholic life.</p>\n<h3>QUICK PREP</h3>\n<p>The person’s simple rule of life and a calendar.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What has receiving the sacraments begun to change in your prayer and everyday life?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Living from what you have received</strong></p>\n<ol><li>Recall Baptism, Confirmation and Holy Communion. Ask what each gift means now, allowing a quiet or ordinary experience rather than demanding strong feelings.</li><li>Review the rule of life: Sunday Mass, daily prayer, charity and parish belonging. Adjust what has proved unrealistic.</li><li>Discuss how to prepare for Confession after Baptism: examination, contrition, honest confession, absolution and penance. Arrange personal guidance if needed.</li><li>Name one relationship, one act of service and one continuing opportunity to learn. Put the next meeting in the diary.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 24 and Appendix F. Mystagogy is lived experience and reflection, especially in the Easter season and continuing afterwards.</p>\n<details class=\"conv\"><summary>Open Conversation 24 &mdash; Mystagogy: Living as a Newly Baptised Catholic</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Initiation is a beginning. Mystagogy helps the newly baptised understand the mysteries by living them: Sunday Eucharist, prayer, charity, Confession, parish communion and mission now become ordinary Catholic life.</p>\n<p>After Baptism you are not merely a person who has completed RCIA. You are a Catholic Christian with a new sacramental life, rights and responsibilities, a parish home and a vocation within the Body of Christ. The Easter season is a privileged time to reflect on what you have received. The Eucharist becomes the weekly centre. When you sin after Baptism, especially in grave matters, the Sacrament of Penance is now the ordinary sacramental path of reconciliation. Learn to use it peacefully and regularly. Mystagogy also asks: What gifts has God given you for others? Mature Catholic life includes service, friendship, works of mercy, learning, stewardship and evangelisation. The parish should continue to accompany you rather than disappearing after the Vigil.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Six months from now, what signs would show that Baptism has become a way of life rather than a beautiful memory?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is mystagogy? Postbaptismal catechesis that deepens the neophyte&#x27;s experience of the sacraments and life in the Church.</li><li>How long should Catholic formation continue? For life.</li><li>What is now the centre of weekly life? Sunday Mass and the Eucharist.</li><li>What sacrament restores communion after serious post-baptismal sin? The Sacrament of Penance.</li><li>What is a neophyte called to become? A mature disciple who worships, grows in holiness, serves, belongs and shares the Gospel.</li></ol>\n<h4>PRAYER</h4>\n<p>Father, thank you for making me your child in Christ. Keep me faithful to the grace of Baptism, nourished by the Eucharist, humble in repentance and generous in mission. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose your next three concrete steps after initiation: a regular Confession rhythm, one parish relationship or ministry, and one continuing way to learn the faith.</p>\n<h4>APPENDIX A</h4>\n<p>First Pastoral Check</p>\n<p>Do this early, before anyone begins planning an Easter date.</p>\n<h4>FIRST QUESTION</h4>\n<p>Have you ever been baptised with water in the name of the Father, and of the Son, and of the Holy Spirit?</p>\n<p>If the answer may be yes, the priest must investigate before treating you as unbaptised. A valid Baptism is never repeated. If you are already validly baptised, the correct route is Reception into Full Communion or another appropriate pathway.</p>\n<p>Area What to establish</p>\n<p>Never baptised / unsure / evidence of a Baptism status possible prior Baptism. Record places, dates, denomination and witnesses if known.</p>\n<p>If aged 14 or over, the parish follows diocesan Age arrangements concerning the bishop&#x27;s role in adult initiation.</p>\n<p>Current marriage, previous marriages, civil marriages or unions of either party must be Marriage history disclosed early. Do not assume Baptism automatically resolves a prior bond.</p>\n<p>What has the person already learned or Previous Christian formation practised? Do not teach as though every inquirer begins from the same place.</p>\n<p>Is the person freely seeking Christ, or mainly Freedom and motive responding to pressure from a spouse, family or wedding plan?</p>\n<p>Work, caring responsibilities, disability, Life situation language, literacy, neurodiversity, health and transport may require adaptation.</p>\n<p>Use appropriate parish safeguarding Safeguarding arrangements. Private spiritual matters are not for group disclosure.</p>\n<p>Identify a suitable person to accompany the Sponsor inquirer and later, if appropriate, serve as godparent.</p>\n<p>DO NOT SET A BAPTISM DATE TOO EARLY The catechumenate is readiness-based. The Easter Vigil is the normal time for initiation, but no one should be rushed to fit a calendar. The period of catechumenate can be extended when faith, conversion, canonical matters or pastoral circumstances require it.</p>\n<h4>APPENDIX B</h4>\n<p>The Major Rites</p>\n<p>The approved liturgical book controls the wording and celebration. This is only a map.</p>\n<ol><li>Rite of Acceptance into the Order of Catechumens After the beginnings of faith and conversion, the inquirers publicly express their intention to follow Christ. The Church accepts them, signs them with the Cross, welcomes them to hear the Word of God and enrols them among the catechumens. Their names are recorded as required.</li><li>Celebrations during the Catechumenate The rite provides celebrations of the Word, blessings, minor exorcisms and other rites. These are prayers of the Church, not theatrical extras. They help the catechumen grow in faith, freedom and conversion.</li><li>Rite of Election or Enrolment of Names Normally on the First Sunday of Lent, after testimony and discernment, the Church calls catechumens judged ready for the final preparation. In Nottingham this is celebrated diocesanly at the Cathedral. From this rite they are called the elect.</li><li>Scrutinies On the Third, Fourth and Fifth Sundays of Lent, the scrutinies ordinarily pray for the elect&#x27;s purification, deliverance from sin and strengthening in Christ. They are not public examinations and do not ask the elect to reveal private sins.</li><li>Presentations and Holy Saturday preparation The Creed and Lord&#x27;s Prayer are entrusted to the elect according to the rite. Other preparation rites may take place on Holy Saturday.</li><li>Sacraments of Initiation Normally at the Easter Vigil, the elect profess the faith, are baptised, then confirmed and receive the Eucharist. Christian initiation is one sacramental whole.</li><li>Mystagogy During the Easter season, the neophytes deepen their understanding through lived experience of the sacraments, Scripture, community, charity and mission.</li></ol>\n<h4>AT SUNDAY MASS</h4>\n<p>Catechumens participate in the Liturgy of the Word. Where the parish celebrates the dismissal provided by the rite, they are sent to continue reflecting on the Word with the Church&#x27;s prayer; they are not &quot;sent away&quot; because they are unwelcome.</p>\n<h4>APPENDIX C</h4>\n<p>Sponsor and Godparent</p>\n<p>A real Christian companion, not simply a ceremonial name. A sponsor accompanies the inquirer and catechumen, knows the person sufficiently to witness to growth in faith and intention, and helps them become part of Catholic life. The sponsor at Acceptance and the godparent at Election and initiation may be the same person, but the rite allows another suitable person to take the later role.</p>\n<p>What matters In practice</p>\n<p>Chosen and willing The person is genuinely chosen for the role and intends to fulfil it.</p>\n<p>Catholic life A Catholic who is confirmed, has received the Eucharist and lives a life of faith in keeping with the role.</p>\n<p>Age Ordinarily at least sixteen, unless lawful provision or a just exception applies.</p>\n<p>Canonical freedom Not bound by a canonical penalty legitimately imposed or declared.</p>\n<p>Relationship A godparent may not be the father or mother of the person being baptised. Other family relationships are handled according to the law, the rite and pastoral judgement.</p>\n<p>Practical accompaniment Prays, attends rites, introduces parish life, discusses the conversations, models Sunday worship and remains present after Baptism.</p>\n<h4>GOOD SPONSOR</h4>\n<p>Choose someone whose Catholic life you would be happy to imitate in ten years, not merely the person who would be most flattered to be asked.</p>\n<h4>APPENDIX D</h4>\n<p>Things to Know Clearly</p>\n<p>These are not an examination. A catechumen should increasingly understand these truths and be able to explain them in ordinary words.</p>\n<ol><li>Who is God? The one eternal Creator, infinitely perfect, who is Father, Son and Holy Spirit.</li><li>Who is Jesus Christ? The eternal Son of God made man, true God and true man.</li><li>Why did Christ become man? For our salvation: to reveal the Father, redeem us from sin and share divine life with us.</li><li>What is the Paschal Mystery? Christ&#x27;s Passion, death, Resurrection and Ascension by which he conquers sin and death.</li><li>Who is the Holy Spirit? The third Person of the Trinity, Lord and giver of life.</li><li>What is grace? God&#x27;s free gift of his life and help, healing and sanctifying us through Christ.</li><li>What is the Church? The people of God, Body of Christ and Temple of the Holy Spirit, visibly united in faith, sacraments and apostolic communion.</li><li>What are the four marks of the Church? One, holy, catholic and apostolic.</li><li>What is Sacred Scripture? The inspired written Word of God.</li><li>What is Apostolic Tradition? The living transmission of the apostolic faith in the Church.</li><li>What is the Magisterium? The Church&#x27;s teaching office exercised by the Pope and bishops in communion with him.</li><li>How many sacraments are there? Seven.</li><li>Which are the sacraments of initiation? Baptism, Confirmation and Eucharist.</li><li>What is Baptism? The sacrament of new birth by water and the word, freeing from sin and incorporating us into Christ and the Church.</li><li>What does Baptism forgive? All sin committed before Baptism and all punishment due to it.</li><li>Can Baptism be repeated? No. It gives an indelible sacramental character.</li><li>What is Confirmation? The sacrament that completes and strengthens baptismal grace with a special outpouring of the Holy Spirit.</li><li>Who is present in the Eucharist? Jesus Christ, truly, really and substantially, Body, Blood, Soul and Divinity.</li><li>What is transubstantiation? The change of the whole substance of bread and wine into Christ&#x27;s Body and Blood while the appearances remain.</li><li>What is the Mass? The sacramental making-present of Christ&#x27;s one sacrifice and the Church&#x27;s supreme act of Eucharistic worship.</li></ol>\n<h4>APPENDIX D - CONTINUED</h4>\n<p>Things to Know Clearly</p>\n<ol><li>Why do Catholics go to Confession? For sacramental forgiveness and reconciliation for sins committed after Baptism.</li><li>Does a catechumen confess sacramentally before Baptism? No. Baptism forgives all prior sin.</li><li>What is Anointing of the Sick? The sacrament by which Christ strengthens and heals the seriously ill and those weakened by age.</li><li>What is Holy Orders? The sacrament of ordained ministry in the three degrees of bishop, priest and deacon.</li><li>What is Matrimony? The lifelong covenant of one man and one woman ordered to their good and to children; between baptised persons it is a sacrament.</li><li>What is conscience? A judgement of reason about the moral quality of a concrete act, which must be formed in truth.</li><li>What is mortal sin? Grave sin committed with full knowledge and deliberate consent.</li><li>What is venial sin? Sin that wounds charity without destroying sanctifying grace.</li><li>Is temptation itself sin? No.</li><li>What are the two great commandments? Love God with your whole being and love your neighbour as yourself.</li><li>What is the Lord&#x27;s Prayer? The Our Father taught by Jesus, the model of Christian prayer.</li><li>Why is Sunday Mass essential? Sunday is the Lord&#x27;s Day and the Eucharist is the source and summit of Christian life.</li><li>Do Catholics worship Mary and the saints? No. Adoration belongs to God alone; saints are honoured and asked for intercession.</li><li>What is purgatory? The final purification of those who die in God&#x27;s grace but still need purification.</li><li>What is Christian hope? Hope in God&#x27;s promises, the resurrection of the body and eternal life.</li><li>What is the Rite of Acceptance? The first major liturgical step by which an inquirer becomes a catechumen.</li><li>What is Election? The Church&#x27;s call of catechumens judged ready for the final preparation for initiation.</li><li>What are the Scrutinies? Lenten rites of purification and strengthening for the elect.</li><li>What normally happens at the Easter Vigil? The elect receive Baptism, Confirmation and the Eucharist.</li><li>What is mystagogy? The postbaptismal deepening of sacramental life, faith, community and mission.</li></ol>\n<h4>APPENDIX E</h4>\n<p>Readiness Discernment</p>\n<p>Readiness is not perfect memory, social confidence or a fixed number of weeks.</p>\n<p>Before Acceptance into the Catechumenate Has heard the first proclamation of Jesus Christ and shows an initial faith or desire for faith. Freely intends to continue exploring the Christian life and shows the beginnings of conversion. Has some experience of prayer and contact with the Christian community. Understands that Acceptance begins a real catechumenal commitment but does not guarantee a fixed Baptism date.</p>\n<p>Before Election Has a developed intention to receive Baptism, Confirmation and the Eucharist. Has sufficient knowledge of Christian teaching according to capacity, not merely memorised vocabulary. Has grown in prayer, Sunday worship, charity and participation in parish life. Shows genuine conversion: a willingness to turn from grave sin and live according to the Gospel. Has resolved major canonical or pastoral questions sufficiently for initiation to proceed. Godparent, catechists and parish can give honest testimony to the person&#x27;s readiness. Before the Sacraments of Initiation Professes the Catholic faith sincerely and freely. Understands the sacramental meaning of Baptism, Confirmation and Eucharist. Has celebrated the Lenten rites and entered a serious period of prayer and conversion. Has a sincere sorrow for sin and intention to live a Christian life. Knows the practical shape of the Easter Vigil without being expected to memorise every response. Is not being rushed merely because Easter has arrived.</p>\n<h4>PASTORAL PRINCIPLE</h4>\n<p>Difficulty, disability, limited English, anxiety or a need for more time calls for adaptation, not humiliation. Readiness is judged according to the person&#x27;s capacity and genuine response to grace.</p>\n<h4>DO NOT</h4>\n<p>Do not demand disclosure of private sins to catechists or groups, use public interrogation, shame an inquirer for questions, or treat attendance sheets as proof of conversion.</p>\n<h4>APPENDIX F</h4>\n<p>A Simple Rule of Christian Life</p>\n<p>Start before Baptism. Continue after it. Keep the rule small enough to be faithful.</p>\n<p>Rhythm Simple practice</p>\n<p>Daily Make the Sign of the Cross; pray the Our Father; read a short passage of Scripture; ask for grace to live the Gospel.</p>\n<p>Morning and night Offer the day to God; at night give thanks, review the day peacefully and ask mercy for failures.</p>\n<p>Sunday Attend Mass faithfully. Before initiation, participate without receiving Communion; after initiation, receive worthily when properly disposed.</p>\n<p>Weekly Do one deliberate work of mercy or service; speak to another Catholic rather than trying to learn the faith entirely alone.</p>\n<p>Regularly after Baptism Receive the Sacrament of Penance; learn a realistic rhythm rather than waiting until fear or crisis.</p>\n<p>At home Keep a crucifix or holy image visible; learn the Creed; use the Bible; let faith become part of ordinary decisions and relationships.</p>\n<p>With the parish Build real relationships, join one suitable form of service or formation, and learn whom to ask when you need help.</p>\n<p>When things go wrong Begin again. Return to prayer, Mass and Confession rather than letting a difficult week become permanent distance.</p>\n<p>A GOOD RULE IS BORING ENOUGH TO LAST Ordinary faithfulness - Sunday Mass, short daily prayer, Scripture, charity, friendship and regular Confession after Baptism - forms a stronger disciple than occasional bursts of religious intensity.</p>\n<h4>APPENDIX G</h4>\n<p>Special Cases and Danger of Death</p>\n<p>Do not force every person through the same route.</p>\n<p>Already baptised Use Reception into Full Communion or another appropriate pathway. Do not treat a validly baptised Christian as a catechumen awaiting Baptism.</p>\n<p>Child of catechetical age The RCIA contains a distinct form adapted for children who have reached catechetical age. Do not simply hand an adult book to a child. Uncatechised baptised Catholic This is not the unbaptised catechumenate. Preparation for Confirmation and Eucharist is adapted to the person&#x27;s baptismal status.</p>\n<p>Marriage or prior bond Tell the priest early. Natural and sacramental marriage bonds require proper canonical discernment. Do not promise that Baptism by itself solves a marriage case.</p>\n<p>Disability or learning need Adapt pace, language, format and response expectations while preserving the substance of faith and sacramental readiness.</p>\n<p>Danger of death Contact a priest immediately. The Church provides an abbreviated initiation for a person in danger of death. Canon law allows adult Baptism in danger of death with a basic knowledge of principal truths, manifested intention to receive Baptism and a promise to observe the Christian religion. The priest determines what can be celebrated.</p>\n<p>Death of a catechumen If a catechumen dies before Baptism, contact the parish. The Church treats catechumens as Christian faithful for the purposes of ecclesiastical funerals and commends them confidently to God&#x27;s mercy. Uncertainty about prior Baptism Do not simply baptise again. The priest investigates the facts and, if necessary, follows the Church&#x27;s norms concerning doubtful Baptism.</p>\n<h4>EMERGENCY</h4>\n<p>If an unbaptised person is in immediate danger of death and no priest or deacon can be reached, any person can baptise validly with true water, the proper Trinitarian formula and the intention to do what the Church does. Contact the parish afterwards so the Baptism can be recorded and the remaining rites supplied as appropriate.</p>\n<h4>APPENDIX H</h4>\n<p>Sources and Parish Authority</p>\n<p>This booklet is a parish catechetical companion. It does not replace the approved liturgical books, diocesan directions, canon law, the Catechism of the Catholic Church or the pastoral judgement of the bishop and parish priest.</p>\n<p>Primary sources Sacred Scripture, with the Sunday Lectionary and the biblical texts indicated throughout this book. Catechism of the Catholic Church, especially 1-1065 (the profession of faith), 1066-1690 (liturgy and sacraments), 1691-2557 (life in Christ and prayer), and especially 1213-1284 on Baptism. Rite of Christian Initiation of Adults, approved for use in England and Wales, including its General Introduction and Introductory Material. Code of Canon Law, especially canons 206; 788-789; 849-878, particularly 851, 864-866 and 872-874; and the norms governing the other sacraments and marriage where applicable. Current directions of the Diocese of Nottingham, including the diocesan Rite of Election and arrangements made by the bishop for adult initiation. Parish safeguarding policy and current diocesan safeguarding requirements. Deharbe, A Full Catechism of the Catholic Religion, used only as a traditional catechetical reference for concise question-and-answer structure; current magisterial, liturgical and canonical sources govern doctrine and discipline. Authority order for practical use</p>\n<ol><li>The approved liturgical books and universal law of the Church.</li><li>Current diocesan norms and directions of the bishop.</li><li>The pastoral judgement of the parish priest.</li><li>This catechumenate companion as the ordinary parish teaching spine.</li></ol>\n<h4>FINAL PRINCIPLE</h4>\n<p>The goal is not to manufacture a person who can pass a Catholic quiz. The goal is a disciple who freely believes in Jesus Christ, turns from sin, desires Baptism, is sufficiently formed in the faith and Christian life, and is ready to enter the sacramental and missionary life of the Church.</p></div></details>\n<h2>Mystagogy Living as a Newly Baptised Catholic</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How is Communion becoming the centre of your week?”</li><li>“Where do you need help to persevere or begin again?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is mystagogy? Deepening sacramental life through experience and reflection after initiation. Does formation end? No. It continues throughout life. What forgives serious sin after Baptism? The Sacrament of Penance.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, thank you for the grace of Baptism. Nourish me in the Eucharist, keep me humble in repentance and make me generous in mission. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Keep your next meeting with the sponsor or mentor and choose one continuing parish commitment.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not disappear after the Vigil. Help the neophyte learn peaceful, regular Confession after Baptism and worthy Communion. Anyone conscious of mortal sin should receive sacramental absolution before Communion. Growth is sustained by real parish relationships.</p>\n<h2>The RCIA journey at a glance</h2>\n<p>The conversations serve these periods; the rites mark genuine growth. Use the Companion’s journey map and Appendix B with the priest.</p>\n<h3>Enquirer</h3>\n<p>Evangelisation and precatechumenate. Hear the Gospel, ask questions and begin faith, prayer and conversion. Conversations 1–4.</p>\n<h3>Acceptance into the Order of Catechumens</h3>\n<p>The first major step follows discernment of the beginnings of faith and an intention to follow Christ.</p>\n<h3>Catechumen</h3>\n<p>A substantial period of formation, worship, conversion, charity and community. Conversations 5–20. It may take as long as real growth requires.</p>\n<h3>Election and the elect</h3>\n<p>The second major step, normally at the beginning of Lent, leads into purification and enlightenment. Conversations 21–22 support the Lenten rites and final preparation.</p>\n<h3>Sacraments of initiation</h3>\n<p>The third major step is ordinarily at the Easter Vigil: Baptism, Confirmation and Eucharist together. Conversation 23.</p>\n<h3>Neophyte and mystagogy</h3>\n<p>Especially in the Easter season, deepen the gifts received through sacramental life, reflection, charity and mission. Conversation 24.</p>\n<h3>THE RITES ARE NOT A TIMETABLE</h3>\n<p>No promise of initiation follows from completing these pages. Confirm the current diocesan arrangements for Election and adult initiation through the parish priest.</p>\n<h2>Readiness for Acceptance</h2>\n<p>Use these prompts alongside Appendix E of the Companion. Discernment is personal and pastoral; it is not a public examination.</p>\n<h3>FIRST FAITH</h3>\n<p>The person has heard the Gospel of Jesus Christ and shows initial faith or a sincere desire for faith.</p>\n<h3>FREE INTENTION</h3>\n<p>The person freely wishes to follow Christ and continue preparation, without pressure from family or circumstances.</p>\n<h3>BEGINNING CONVERSION</h3>\n<p>There is willingness to turn towards God and begin changing life in response to him.</p>\n<h3>PRAYER AND COMMUNITY</h3>\n<p>The person has begun prayer and contact with the parish’s worship and people.</p>\n<h3>UNDERSTANDING THE STEP</h3>\n<p>Acceptance begins the formal catechumenate. It is not Baptism and does not guarantee a fixed date for initiation.</p>\n<h3>An early pastoral conversation</h3>\n<p>Before plans are fixed, clarify any possible prior Baptism, marriage history and needs affecting participation. Use Appendix A. The priest determines the correct route and arrangements.</p>\n<h2>Readiness for Election</h2>\n<p>The catechumen, godparent, mentor and priest consider the person’s developing Christian life. The bishop’s current directions and approved rite govern Election.</p>\n<h3>INTENTION</h3>\n<p>A developed desire to receive Baptism, Confirmation and the Eucharist.</p>\n<h3>UNDERSTANDING</h3>\n<p>Sufficient knowledge of Christian teaching according to capacity, with sincere acceptance rather than memorised phrases.</p>\n<h3>FAITH AND CHARITY</h3>\n<p>Growth in prayer, Sunday worship, service and parish belonging.</p>\n<h3>CONVERSION</h3>\n<p>A real willingness to turn from grave sin and live the Gospel, supported by concrete steps.</p>\n<h3>PASTORAL MATTERS</h3>\n<p>Major canonical and pastoral questions have been addressed sufficiently for initiation to proceed.</p>\n<h3>HONEST TESTIMONY</h3>\n<p>Those accompanying the person can speak truthfully of readiness and any remaining concerns.</p>\n<p>If more time is needed, continue accompaniment. Do not rush because Lent is approaching or turn uncertainty into humiliation.</p>\n<h2>Readiness for initiation</h2>\n<h3>SINCERE PROFESSION</h3>\n<p>The elect freely profess the Catholic faith and understand its central truths according to capacity.</p>\n<h3>SACRAMENTAL UNDERSTANDING</h3>\n<p>Baptism gives new birth and forgiveness; Confirmation strengthens and seals; Eucharist gives Christ himself.</p>\n<h3>LENTEN PREPARATION</h3>\n<p>The person has entered prayer, repentance and the rites of purification and enlightenment as arranged by the Church.</p>\n<h3>REPENTANCE</h3>\n<p>There is sorrow for sin and intention to live a Christian life. Sacramental Confession does not precede Baptism.</p>\n<h3>PRACTICAL PARTICIPATION</h3>\n<p>The person understands the Vigil’s outline, responses and movements, with any needed adaptations.</p>\n<h3>CONTINUING LIFE</h3>\n<p>A sponsor, mentor and parish relationships will support the neophyte afterwards.</p>\n<p>Perfect memory, confidence in public speaking and strong religious feelings are not the standards. The priest discerns readiness within the Church’s law, rites and diocesan direction.</p>\n<h2>The Apostles’ Creed</h2>\n<p>Use this Creed for learning and prayer. At initiation the celebrant uses the profession and responses prescribed in the approved rite. I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.</p>\n<p>I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.</p>\n<h3>Pray with understanding</h3>\n<p>Pause over a truth that needs attention. Ask what it tells you about God and the life into which you are preparing to be baptised. “He descended into hell” refers here to Christ’s descent to the realm of the dead.</p>\n<h2>Prayers for ordinary life</h2>\n<h3>The Sign of the Cross</h3>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<h3>The Our Father</h3>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<h3>The Glory Be</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>An Act of Contrition</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>A morning offering</h3>\n<p>Father, I offer you this day through Jesus Christ. Guide my work, words and choices; help me love you and serve my neighbour. Amen.</p>\n<h3>A simple evening prayer</h3>\n<p>Thank you, Father, for your gifts today. Forgive my failures, show me how to begin again and keep me in your peace. Amen. Before Baptism, pray with repentance and trust. The Act of Contrition is a prayer you can use; it does not imply sacramental Confession before Baptism.</p>\n<h2>Final word for the mentor and sponsor</h2>\n<p>Let the person bring a real question. Use the activity to make the teaching concrete, then let the Companion supply the Catholic answer. Give time for understanding to become faith, prayer and a changed life.</p>\n<h3>ACCOMPANY THE PERSON</h3>\n<p>A sponsor or mentor introduces parish life, prays, listens, encourages and gives honest testimony when needed. The relationship continues after initiation.</p>\n<h3>KEEP THE WHOLE JOURNEY</h3>\n<p>Teaching belongs with Sunday worship, the Church’s rites, conversion, charity and community. Twenty-four conversations are a guide to formation, not a replacement for the catechumenate.</p>\n<h3>LIVE FROM CHRIST’S GIFTS</h3>\n<p>The goal is a disciple who freely believes, turns from sin and lives through Baptism, Confirmation and the Eucharist. Arrange continuing support, learning and service.</p>\n<h3>When the conversation needs help</h3>\n<p>Questions about possible Baptism, marriage history, doctrinal difficulties, health, disability or safeguarding belong with the appropriate parish support and the priest. Respect privacy and follow current parish procedures.</p>\n<h2>References for the priest and mentor</h2>\n<p>This guide follows the twenty-four conversations of Becoming Catholic RCIA A Catechumenate Companion. Use that book for the full teaching and the following appendices.</p>\n<h3>Appendices A and G</h3>\n<p>Correct pathway, prior Baptism, marriage and particular circumstances.</p>\n<h3>Appendices B and C</h3>\n<p>The major rites and the roles of sponsor and godparent.</p>\n<h3>Appendices D and E</h3>\n<p>Concise doctrinal answers and readiness before Acceptance, Election and initiation.</p>\n<h3>Appendices F and H</h3>\n<p>Ordinary Christian life, sources and parish authority.</p>\n<h3>Primary Church sources</h3>\n<p>Rite of Christian Initiation of Adults approved for England and Wales, especially the introductory guidance on the periods, major steps, formation and mystagogy.</p>\n<p>Catechism of the Catholic Church, especially 1213–1284 on Baptism, 1285–1321 on Confirmation, 1322–1419 on the Eucharist and 1422–1498 on Penance.</p>\n<p>Code of Canon Law, especially canons 206, 788–789 and 849–878, including canon 866 on Baptism, Confirmation and Eucharist in adult initiation.</p>\n<p>Liturgy Office of England and Wales, RCIA An Overview: liturgyoffice.org.uk/Resources/RCIA/overview.pdf.</p>\n<p>The approved liturgical books, universal law, current diocesan direction and the parish priest’s pastoral judgement govern the actual celebration. This activity guide does not supply a substitute rite.</p>"}, {"name": "Reception into Full Communion", "url": "https://3stepuk.github.io/Coming-Into-Full-Communion/", "desc": "For baptised adults entering full communion.", "html": "<p>For baptised Christians preparing for Reception</p>\n<h3>USE BESIDE THE PREPARATION BOOK</h3>\n<p>Use with Coming into Full Communion A Catholic Preparation Book for Baptised Christians. The book supplies the Catholic teaching. This companion helps a mentor or sponsor begin with the person, make the teaching concrete and accompany a free, sincere response.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the person</li><li>Do something concrete</li><li>Open the preparation book</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>A BAPTISM ALREADY RECEIVED</h3>\n<p>A candidate for Reception is already baptised. Valid Baptism is never repeated. Confession normally precedes Reception; Confirmation, when needed, and Holy Communion ordinarily follow within the celebration. The priest establishes the correct pathway.</p>\n<h2>How to use this guide</h2>\n<h3>ACCOMPANY AN EXISTING CHRISTIAN LIFE</h3>\n<p>Begin with gratitude for the faith, prayer and Christian witness already received. Full communion brings a real acceptance of Catholic faith, sacramental life and communion with the Church’s pastors.</p>\n<h3>For each conversation</h3>\n<ol><li>Make the Sign of the Cross. Ask the opening question and listen before explaining.</li><li>Try the activity together. All cards can be handwritten as you meet; every activity can also be spoken.</li><li>Open the matching conversation in the preparation book. Read REMEMBER and the teaching slowly, pausing for the candidate’s questions.</li><li>Talk together. Check the central truth, then use THE ESSENTIALS in the book to clarify understanding. Ask for ordinary words rather than a recitation.</li><li>Pray the printed prayer and choose one realistic action. Return to it when you next meet.</li><li>Repeat, combine or divide conversations as needed. Twelve conversations are not twelve compulsory meetings; progress follows readiness.</li></ol>\n<h3>Simple materials</h3>\n<p>The preparation book, this guide, paper and a pen are enough. A crucifix or church visit may help, but is optional. No prepared talk, craft kit, separate workbook or internet search is required.</p>\n<h3>FOR THE MENTOR</h3>\n<p>You listen, pray, explain simply, introduce parish life and help the candidate bring questions to the priest. You do not decide canonical matters or certify readiness. Use the preparation book for the teaching; seek help when a question needs more than you can give.</p>\n<h2>An opening conversation</h2>\n<p>Use this before beginning the twelve conversations. Let the candidate speak about their own Christian life and their present hopes.</p>\n<h3>Listen to the person</h3>\n<ol><li>“What has helped you know and follow Jesus so far?”</li><li>“What draws you towards full communion with the Catholic Church?”</li><li>“What do you most want to understand, and what gives you concern?”</li><li>“Is this a decision you freely wish to explore?”</li></ol>\n<h3>ESTABLISH THE CORRECT PATHWAY</h3>\n<p>Use Appendix A with the priest early. Clarify evidence of Baptism, any previous Catholic status, Confirmation or chrismation, Eastern Christian background and all marriage history. The priest investigates uncertainty and directs the proper route. A mentor does not decide validity.</p>\n<h3>Make accompaniment possible</h3>\n<p>Agree how to meet and communicate. Ask about language, reading, disability, work and caring responsibilities. Introduce the candidate to parish people and help them attend Sunday Mass, taking part in prayer without normally receiving Communion before Reception.</p>\n<h3>BEGIN WITH ONE REAL QUESTION</h3>\n<p>Write or say the candidate’s main question and one next step. Allow the question to develop. Do not promise a Reception date because a set of pages can be completed.</p>\n<p>Sensitive family matters and personal sins belong in a confidential conversation with the priest, not in a group or mentor’s record. Establish suitable sponsor support with parish guidance.</p>\n<h2>The Call to Full Communion</h2>\n<h3>AIM</h3>\n<p>Connect gratitude for Baptism with a free desire for full Catholic communion.</p>\n<h3>QUICK PREP</h3>\n<p>Paper with two headings: GIFTS RECEIVED and FULL COMMUNION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What has God already given you in your Christian life, and what now draws you towards the Catholic Church?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Receiving a gift and taking a step</strong></p>\n<ol><li>Under GIFTS RECEIVED, name Baptism, faith in Jesus, Scripture, prayer or Christian witness. Give thanks without evaluating every earlier experience.</li><li>Under FULL COMMUNION, write FAITH, SACRAMENTS and PASTORS. Read how the book explains these three bonds.</li><li>Ask what becoming Catholic would change in belief, worship and parish belonging. Identify one genuine hope and one question.</li><li>Write “One Baptism”. Explain that Reception honours the Baptism already received; it is a new step into full communion, not another Baptism.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1. Use Appendix E if the candidate wonders whether Reception requires dismissing every grace received before.</p>\n<details class=\"conv\"><summary>Open Conversation 1 &mdash; The Call to Full Communion</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Your valid Baptism already joins you to Christ. Reception into full communion is not another Baptism; it brings an already baptised Christian into full visible communion with the Catholic Church in faith, sacramental life and ecclesial communion.</p>\n<p>By Baptism you have already been incorporated into Christ and share a real bond with all who are baptised in the name of the Father, Son and Holy Spirit. The Catholic Church therefore does not speak as though your Christian life begins from nothing on the day of reception. Full communion means more than joining an organisation. It means freely professing the Catholic faith, sharing the sacramental life of the Catholic Church, and accepting communion with the pastors Christ has given the Church. The Eucharist will become the visible centre of that communion. You need not despise the Christian community from which you come. Give thanks for whatever was true, holy and fruitful there. At the same time, reception asks for a real decision: you are not merely adding Catholic devotions to your existing identity; you are asking to live as a Catholic Christian.</p>\n<h4>TALK ABOUT IT</h4>\n<p>merely what are you leaving behind?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Am I being baptised again? No. A valid Christian Baptism is received only once.</li><li>What is reception into full communion? The Church receives an already baptised Christian into full visible communion in Catholic faith and sacramental life.</li><li>Does the Catholic Church recognise anything good in other Christian communities? Yes. Baptism creates a real Christian bond, and many elements of sanctification and truth are found beyond the Catholic Church’s visible boundaries.</li><li>Must the decision be free? Yes. No one should be pressured into a profession of Catholic faith.</li><li>What is the goal of preparation? Not simply information, but a free and informed Catholic profession of faith and a life of communion with Christ and his Church.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus Christ, thank you for every grace by which you have led me to this point. Purify my motives, deepen my faith and guide me into the unity you desire for your Church. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Write down three graces you have received in your Christian life so far and three reasons you now feel drawn towards full communion with the Catholic Church.</p>\n<p>4</p></div></details>\n<h2>The Call to Full Communion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What are you moving towards in becoming Catholic?”</li><li>“What would help you make this decision freely and sincerely?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Will valid Baptism be repeated? No. It is received only once. What is full communion? Visible unity in Catholic faith, sacramental life and communion with the Church’s pastors. Must the decision be free? Yes. No one should be pressured into a profession of faith.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, thank you for the grace of my Baptism and for everyone who helped me follow you. Deepen my faith and lead me freely into the unity you desire. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Name three graces already received and one reason you feel drawn towards full Catholic communion.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen for the person’s own desire. Gratitude for earlier Christian life and acceptance of the fullness of Catholic faith belong together. Do not ask the candidate to disparage family or former fellow Christians.</p>\n<h2>Scripture Tradition and the Magisterium</h2>\n<h3>AIM</h3>\n<p>Show how the one apostolic faith is handed on and faithfully interpreted.</p>\n<h3>QUICK PREP</h3>\n<p>Three handwritten cards: SCRIPTURE, TRADITION, MAGISTERIUM.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “If sincere Christians interpret the same biblical passage differently, how can the Church remain one in truth?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A message received and handed on</strong></p>\n<ol><li>Place SCRIPTURE: the inspired written Word of God. Ask what the candidate already values about the Bible.</li><li>Add TRADITION: the living transmission of the apostolic faith. Distinguish this from ordinary customs that may change.</li><li>Add MAGISTERIUM: the Pope and bishops in communion with him guard and interpret what was received. They serve God’s Word.</li><li>Use this case: two readers claim that one passage proves opposite teachings. Read the book’s explanation and ask why private certainty alone does not resolve the disagreement.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 2, especially the common source of Scripture and Tradition. Use Appendix E on “Bible alone” if helpful.</p>\n<details class=\"conv\"><summary>Open Conversation 2 &mdash; Scripture, Tradition and the Magisterium</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God’s one revelation is handed on in Sacred Scripture and Apostolic Tradition. The Church’s Magisterium - the Pope and the bishops in communion with him - serves the Word of God by authentically interpreting what has been handed down.</p>\n<p>Catholics do not place “human tradition” above the Bible. Sacred Scripture is inspired by God and is the written Word of God. Apostolic Tradition is the living transmission of what Christ entrusted to the apostles and what the Holy Spirit taught the apostolic Church. Scripture and Tradition come from the same divine source and belong together. The New Testament itself emerged within the apostolic Church, and the Church discerned the canon of Scripture within that living Tradition. The Magisterium is not a third source of revelation and is not above the Word of God. Its task is to guard, explain, and faithfully interpret the deposit of faith. This is why Catholic doctrine is more than the private conclusion of an individual Bible reader, however sincere.</p>\n<h4>TALK ABOUT IT</h4>\n<p>When faithful Christians read the same biblical text in different ways, how do you think Christ intended the Church to remain one in truth?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Is the Bible the Word of God? Yes. Sacred Scripture is inspired by the Holy Spirit and truly teaches what God wills for our salvation.</li><li>What is Apostolic Tradition? The living transmission in the Church of the faith entrusted by Christ and the Holy Spirit to the apostles.</li><li>Are Scripture and Tradition rivals? No. They are distinct but inseparably connected modes by which the one apostolic faith is handed on.</li><li>What is the Magisterium? The Church’s living teaching office, exercised by the Pope and bishops in communion with him.</li><li>Does the Magisterium invent new revelation? No. It serves, guards and authentically interprets the revelation already entrusted to the Church.</li></ol>\n<h4>PRAYER</h4>\n<p>Holy Spirit, who inspired the Scriptures and guides the Church, give me humility before your Word and wisdom to receive the apostolic faith faithfully. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Acts 2:42, 2 Thessalonians 2:15, 1 Timothy 3:15 and 2 Peter 1:20-21. Note one question these passages raise for you about authority and tradition.</p>\n<p>5</p></div></details>\n<h2>Scripture Tradition and the Magisterium</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What is the difference between Apostolic Tradition and a parish custom?”</li><li>“What real question about Catholic teaching authority needs further explanation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is Scripture inspired? Yes. It is God’s written Word. Are Scripture and Tradition rivals? No. They hand on the one apostolic faith together. Is the Magisterium above God’s Word? No. It serves, guards and authentically interprets it.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, give me love for Scripture and humility before God’s Word. Help me receive the apostolic faith faithfully and seek its meaning honestly. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Reread the REMEMBER paragraph in Conversation 2 and bring one actual question about Scripture, Tradition or authority.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not set Scripture against the Church or describe Tradition as permission to invent doctrine. Let the candidate name a difficulty precisely. Use the book’s explanation before introducing further material.</p>\n<h2>The Creed and the Mystery of Salvation</h2>\n<h3>AIM</h3>\n<p>Connect the Creed with the saving work of Father, Son and Holy Spirit.</p>\n<h3>QUICK PREP</h3>\n<p>The Apostles’ Creed printed at the end of this guide; a pen, optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which part of the Creed is familiar to you, and which would you like to understand more deeply?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The faith I can explain</strong></p>\n<ol><li>Read the printed Creed slowly. Pause at the Father, the Son and the Holy Spirit rather than treating it as a memory exercise.</li><li>Choose one familiar phrase and one difficult phrase. Let the candidate explain what each seems to mean before opening Conversation 3.</li>\n<details class=\"conv\"><summary>Open Conversation 3 &mdash; The Creed and the Mystery of Salvation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Catholic faith is the apostolic faith: one God in three divine Persons; creation by God; humanity wounded by sin; the Incarnation, death and Resurrection of Jesus Christ; the gift of the Holy Spirit; the resurrection of the dead and eternal life.</p>\n<p>Catholic faith begins with God, not with ourselves. The one God is Father, Son and Holy Spirit: three divine Persons, one divine nature. God freely creates everything that exists and creates the human person in his image, with reason, freedom and a calling to communion with him. Humanity is wounded by original sin and every person needs redemption. The eternal Son truly became man without ceasing to be God. Jesus Christ is one divine Person with a true human nature. By his Cross and Resurrection he conquers sin and death and reconciles us to the Father. The Holy Spirit gives life to the Church and sanctifies us. History is moving towards Christ’s return, the resurrection of the body, judgment and the fulfilment of God’s kingdom. Heaven is eternal communion with God; hell is definitive self-exclusion from that communion by dying unrepentant in grave sin.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which line of the Creed feels most familiar to you, and which one do you most want to understand more deeply?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>How many Gods do Christians believe in? One God in three divine Persons: Father, Son and Holy Spirit.</li><li>Who is Jesus Christ? The eternal Son of God made man, true God and true man, one divine Person.</li><li>Why do we need salvation? Because humanity is wounded by sin and cannot restore communion with God by its own power.</li><li>What saves us? The grace of God won for us by the death and Resurrection of Jesus Christ and received in faith.</li><li>What do Christians hope for? Christ’s return, the resurrection of the body, judgment and eternal life with God.</li></ol>\n<h4>PRAYER</h4>\n<p>Father, Son and Holy Spirit, deepen in me the faith I received at Baptism. Let the Creed become not only words I say but the truth by which I live. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Pray the Apostles’ Creed slowly on three days this week. Mark any phrase you could not yet explain in your own words and bring it to your next conversation.</p>\n<p>6</p></div></details><li>Follow the movement: creation, human sin, the Son’s Incarnation, Cross and Resurrection, the Spirit’s work and eternal life.</li><li>Ask what Christian hope would lose if the Resurrection meant only that Jesus’ ideas survived. Keep bodily Resurrection and our need for grace clear.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 3. Use the Creed here for learning and prayer; the approved rite supplies the actual profession used at Reception.</p>\n<h2>The Creed and the Mystery of Salvation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do we need salvation rather than only moral improvement?”</li><li>“How does belief in the Resurrection change the way we face death?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is God? One God in three divine Persons: Father, Son and Holy Spirit. Who is Jesus? The eternal Son made man, true God and true man. What do Christians hope for? Christ’s return, the resurrection of the body and eternal life with God.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, Son and Holy Spirit, deepen the faith I received at Baptism. Help me understand your saving work and live by the truth I profess. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the printed Creed slowly on three occasions. Bring one phrase you cannot yet explain to the next conversation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>A candidate may already know the Creed well. Explore understanding without starting from nothing. Keep one God and three Persons, Christ’s divinity and humanity, and real bodily Resurrection precise; avoid misleading analogies.</p>\n<h2>The Church Christ Founded</h2>\n<h3>AIM</h3>\n<p>Make the Church’s spiritual life, visible unity and apostolic authority concrete.</p>\n<h3>QUICK PREP</h3>\n<p>Four cards: ONE, HOLY, CATHOLIC, APOSTOLIC.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you think Christ intended his Church to be, and how would that be visible?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Four marks of one Church</strong></p>\n<ol><li>Arrange the cards. Use Conversation 4 to give a brief meaning for each: unity, Christ’s holiness, fullness and universal mission, apostolic faith and succession.</li>\n<details class=\"conv\"><summary>Open Conversation 4 &mdash; The Church Christ Founded</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Christ founded one Church and gave it an apostolic and visible structure. The Church is one, holy, catholic and apostolic, and is governed in communion by the successor of Peter and the bishops who succeed the apostles.</p>\n<p>The Church is not merely a voluntary association of people with similar beliefs. She is the People of God, the Body of Christ and the Temple of the Holy Spirit. Christ is her Head, and he continues his saving work through her preaching, sacraments, charity and mission. The Church is one because her source is the Trinity and her faith and sacramental life are one; holy because Christ sanctifies her even though her members are sinners; catholic because Christ is fully present in her and she is sent to all peoples; apostolic because she is founded on the apostles and continues in their teaching and succession. The Bishop of Rome, the Pope, succeeds St Peter in a unique ministry of unity. Bishops succeed the apostles and teach and govern their local Churches in communion with him. Papal infallibility does not mean that every papal opinion is infallible or that a Pope cannot sin; it is a specific gift protecting the Church from error when the conditions laid down by the Church are fulfilled.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Why might Christ’s Church need visible unity and a visible teaching office, rather than only a shared invisible faith?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What are the four marks of the Church? One, holy, catholic and apostolic.</li><li>Who is the Head of the Church? Jesus Christ.</li><li>What is the Pope’s role? As Bishop of Rome and successor of St Peter, he serves the unity and faith of the universal Church.</li><li>What is a bishop? A successor of the apostles who teaches, sanctifies and governs a local Church in communion with the Pope.</li><li>Does holiness mean every Cath
