corrects it.</li><li>Each identify a truthful responsibility: perhaps failing to consult, dismissing tiredness or speaking unkindly. Practise an apology without excuses.</li><li>Agree a repair and a future habit, such as consulting before invitations. If a pause is needed, agree when to return to the conversation.</li></ol>\n<h3>Talk together</h3>\n<p>“When I am upset, do I pursue, withdraw, shout or become sarcastic?” “What helps us return to an ordinary disagreement calmly?” “What does a sincere apology need to change?”</p>\n<h3>WHEN THIS EXERCISE IS NOT APPROPRIATE</h3>\n<p>Threats, intimidation, violence, forced sex, isolation or controlling behaviour are not ordinary conflict. Do not use a joint communication exercise to resolve abuse. Seek a safe private conversation and appropriate specialist help.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not press either person to describe frightening experiences in front of the other. Forgiveness does not mean accepting danger or abandoning necessary boundaries. Follow parish safeguarding arrangements when concerns arise.</p>\n<h2>Money work and shared responsibilities</h2>\n<p>Use with Appendix D. The couple discuss actual information privately. A mentor needs no account numbers, balances or list of personal debts.</p>\n<h3>What each person expects</h3>\n<ol><li>Each name expectations about earning, spending, saving, giving and debt. Listen before deciding whether they match.</li><li>List ordinary responsibilities: meals, cleaning, appointments, household finances, care of relatives and, if children come, childcare.</li><li>For each responsibility, ask who has time, ability and capacity. Discuss paid work, illness and caring duties as well as fairness.</li><li>Choose a regular money conversation and one way to review responsibilities as circumstances change. Name anything needing further help.</li></ol>\n<h3>Talk together</h3>\n<p>“What financial information affecting our life together still needs to be shared?” “How will major purchases and borrowing be discussed?” “What changes would we make if work or health altered?” “How will we remain generous to those in need?”</p>\n<h3>HONESTY AND MUTUAL RESPECT</h3>\n<p>Important debt, financial commitments and patterns affecting the household should not be hidden. Financial decisions should respect both persons’ dignity and freedom; control, intimidation or imposed deprivation are not ordinary budgeting differences.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Set aside an unhurried private conversation about finances and responsibilities. Choose one agreement to begin and one question to revisit. Seek appropriate advice for matters beyond your knowledge.</p>\n<h2>Children intimacy and responsible parenthood</h2>\n<p>Use Conversation 3 and Appendix D. This is a respectful couple conversation, not a request for intimate details to share with a mentor.</p>\n<h3>Understand before making assumptions</h3>\n<ol><li>Each explain what openness to children means. Discuss hopes about parenthood, care, work and the handing-on of Catholic faith.</li><li>Read the book’s teaching: marital union belongs within marriage and should express faithful self-gift, keeping the unitive and procreative meanings together.</li><li>Discuss responsible parenthood as generous, prudent discernment according to God’s law. For just reasons, periodic abstinence and moral fertility-awareness methods may be used; deliberate contraception is contrary to Catholic teaching.</li><li>Name a genuine question for the priest. If practical fertility-awareness instruction is needed, seek suitable trained support rather than guessing from this activity.</li></ol>\n<h3>Talk together</h3>\n<p>“Can we discuss affection, expectations and difficulties respectfully and without pressure?” “How would we support one another if children did not come?” “What needs clearer teaching or appropriate personal advice?”</p>\n<h3>CHILDREN ARE GIFTS</h3>\n<p>Infertility does not by itself prohibit or invalidate marriage. Openness to life is different from biological ability to conceive. Questions about the ability to consummate marriage are distinct and belong privately with the priest.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Give the Church’s teaching accurately and allow questions. Never demand intimate disclosures or offer medical advice. Forced sex or coercion requires safety and specialist help; it is not marital self-giving.</p>\n<h2>Family health and technology</h2>\n<p>Use Appendix D privately as needed. Choose one area at a time rather than trying to disclose every personal matter in a group.</p>\n<h3>Family and friendships</h3>\n<p>Each name an expectation about parents, relatives, holidays and friendships. Use this case: both families expect the couple for the same celebration. Discuss how to honour family while making a shared, fair decision.</p>\n<h3>Health and habits</h3>\n<p>Ask whether important matters affecting married life have been honestly discussed: health, addiction, gambling, alcohol or drugs, serious debt or legal difficulties. A mentor does not diagnose or require a written record. Seek pastoral and appropriate professional help early.</p>\n<h3>Technology and fidelity</h3>\n<p>Discuss phones at meals, private messages, social media, pornography and time online. Choose habits that protect fidelity and attention. Healthy boundaries should not become surveillance, isolation or control.</p>\n<h3>A practical activity</h3>\n<ol><li>Each complete: “One expectation I bring from my family is…” Listen for a difference without assuming one family is the standard.</li><li>Choose one habit about time, technology or family contact that will strengthen the marriage.</li><li>Name one unresolved question. Decide whether it needs further couple discussion, a private priest’s meeting or specialist help.</li></ol>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Try the chosen habit, such as a meal without phones or consulting each other before family commitments. Review whether it helped both people.</p>\n<h2>Freedom to marry and parish preparation</h2>\n<p>Use Appendix B and the priest’s current instructions. These matters are established through the Church’s enquiry, not by completing an activity sheet.</p>\n<h3>Previous marriages</h3>\n<p>Tell the priest about every previous marriage, including civil ceremonies and marriages in another country. Do not assume divorce, years apart or a non-Catholic ceremony means no bond exists.</p>\n<h3>Baptism and religious background</h3>\n<p>Explain where and whether each person was baptised and their present religious affiliation. The priest determines the permissions, dispensations and form that apply.</p>\n<h3>Freedom and intention</h3>\n<p>Bring concerns about pressure, grave fear, fidelity, permanence or excluding children to the priest. Each person needs a safe opportunity to speak privately.</p>\n<h3>Other particular circumstances</h3>\n<p>Mention possible impediments and questions about consummation privately. Infertility is a different matter; do not make your own canonical judgement.</p>\n<h3>Documents and civil requirements</h3>\n<p>Follow the parish’s current checklist. It normally includes a recently issued baptismal certificate for each Catholic party and information establishing freedom to marry. Follow current parish and registrar directions for civil documents.</p>\n<h3>Venue and celebration</h3>\n<p>Confirm what is possible before relying on another venue or involving another minister. The priest directs permissions, approved texts and the celebration within or outside Mass.</p>\n<h3>ONE PRACTICAL STEP</h3>\n<p>Make a list of questions and outstanding documents for the priest. Do not rely on a promise that a previous bond or permission will “probably be fine”.</p>\n<h2>Readiness in faith freedom and intention</h2>\n<p>Use Appendix E with the priest. This is a pastoral conversation, not a pass or fail examination. The couple need not agree about every preference, but must freely intend marriage.</p>\n<h3>FREE CHOICE</h3>\n<p>Each is choosing freely and can speak honestly without coercion, grave fear or pressure to preserve a booked wedding.</p>\n<h3>FREEDOM TO MARRY</h3>\n<p>Every previous marriage and fact affecting freedom has been disclosed to the priest and appropriately investigated.</p>\n<h3>THE COVENANT</h3>\n<p>Both understand marriage as a lifelong covenant of one man and one woman, for their good and naturally ordered to children and their upbringing.</p>\n<h3>FIDELITY AND PERMANENCE</h3>\n<p>Both intend exclusive fidelity and marriage for life. There is no hidden plan for another relationship or a pre-planned exit when life becomes difficult.</p>\n<h3>OPENNESS TO LIFE</h3>\n<p>Neither positively excludes children from the marriage. Hopes and questions about family life and Catholic upbringing have been discussed.</p>\n<h3>FAITH</h3>\n<p>The Catholic party intends fidelity to the Church. The couple understand the place of Catholic worship and the obligations applicable to their circumstances.</p>\n<p>A known reservation or serious uncertainty needs attention before the wedding. The priest establishes freedom and readiness under Church law and diocesan direction.</p>\n<h2>Readiness in ordinary life and support</h2>\n<p>Use Appendix E and the practical pages here. Readiness is not a claim to be a perfect couple. It includes honesty, willingness to seek help and a realistic beginning.</p>\n<h3>HONEST CONVERSATIONS</h3>\n<p>Money, work, health, family expectations, intimacy, fertility, habits and technology have been discussed truthfully and respectfully.</p>\n<h3>SAFETY AND DIGNITY</h3>\n<p>Neither is afraid of the other or being controlled or coerced. Serious danger is addressed through safety and appropriate specialist help, not a promise to try harder.</p>\n<h3>SACRAMENTAL LIFE</h3>\n<p>Catholic parties understand the value of Confession before the wedding, worthy Communion and Sunday Mass in married life.</p>\n<h3>PRAYER AND DAILY HABITS</h3>\n<p>The couple have chosen realistic habits of gratitude, attention, fair responsibilities, forgiveness and prayer as appropriate.</p>\n<h3>THE CELEBRATION</h3>\n<p>The couple understand the basic rite and will follow parish direction for approved consent, readings, music and practical arrangements.</p>\n<h3>CONTINUING SUPPORT</h3>\n<p>The couple know whom to approach when difficulties arise and have a practical plan for parish belonging and support after the wedding.</p>\n<h3>WHEN MORE TIME IS NEEDED</h3>\n<p>Name the actual difficulty and arrange the right help. Preparation serves truth and freedom; a wedding timetable must not hide an unresolved serious concern.</p>\n<h2>A calm walk through the wedding rite</h2>\n<p>Use Conversation 4 and Appendix A with the priest or deacon. This outline explains the main actions; it is not a script or a substitute for the approved rite.</p>\n<h3>Gathering and the Word of God</h3>\n<p>The couple and assembly gather for worship. Approved Scripture readings and the homily open the meaning of marriage.</p>\n<h3>Questions before consent</h3>\n<p>The couple express freedom and their intentions for marriage in the approved form. Understand the promises rather than merely rehearsing a response.</p>\n<h3>The exchange and reception of consent</h3>\n<p>Each gives and receives the other in marriage. The priest or deacon receives the consent in the name of the Church. This is the heart of the celebration.</p>\n<h3>Blessing and giving of rings</h3>\n<p>The rings signify the covenant and fidelity. Follow the approved words and the parish’s practical directions.</p>\n<h3>Prayer blessing and the Eucharist</h3>\n<p>Intercessions and the nuptial blessing ask God’s help. When celebrated within Mass, the Eucharistic liturgy is included; follow the approved rite’s sequence.</p>\n<h3>Sent to live the covenant</h3>\n<p>The final blessing sends the spouses into married life. Plan thanksgiving and ordinary faithfulness beyond the wedding day.</p>\n<h3>A USEFUL REHEARSAL</h3>\n<p>Practise approved spoken responses and movements with parish guidance. Ask about mobility, hearing, anxiety or other needs early. Attend to the meaning of consent as well as where to stand.</p>\n<h2>Preparing spiritually for the wedding</h2>\n<p>Use Appendix F and speak with the priest. Catholic spouses are strongly encouraged to prepare through prayer and Confession, approaching marriage and Holy Communion in the state of grace.</p>\n<h3>The mentor’s part</h3>\n<p>Help arrange an opportunity for Confession and explain its purpose. A preparation meeting is not Confession. Neither a mentor nor a fiancé or fiancée is entitled to an account of the other person’s private sins.</p>\n<h3>A peaceful preparation</h3>\n<ol><li>Ask God for light. Examine conscience privately, be sorry for sin and sincerely intend to turn from it with his help.</li><li>Begin Confession with the Sign of the Cross and say how long it has been. If many years have passed, say so; the priest will help.</li><li>Confess sins honestly and simply. Mortal sins not yet confessed should be told in kind and number as well as can be remembered. Ask for help if unsure.</li><li>Listen to counsel and the penance. Pray an Act of Contrition, printed here, and receive absolution.</li><li>Give thanks, carry out the penance and begin again. Repair harm where possible and seek help with persistent difficulties.</li></ol>\n<h3>Honesty and conversion</h3>\n<p>The book explains chastity before marriage, including for couples already living together. Bring questions honestly to the priest. Grace helps a real beginning; preparation must not become a pretence.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, prepare our hearts for a truthful covenant. Help us repent, receive your mercy and grow in faithful love. Amen.</p>\n<h2>Prayers for preparation and married life</h2>\n<h3>The Sign of the Cross</h3>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<h3>An opening prayer</h3>\n<p>Lord Jesus, help us listen with patience, speak truthfully and understand the marriage we are preparing to enter. Guide our choices and teach us to seek one another’s good. Amen.</p>\n<h3>The Our Father</h3>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<h3>An Act of Contrition</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>Grace before meals</h3>\n<p>Bless us, O Lord, and these thy gifts, which we are about to receive from thy bounty, through Christ our Lord. Amen.</p>\n<h3>A couple’s prayer</h3>\n<p>Lord Jesus, be at the centre of our marriage. Teach us to be faithful, truthful, tender and forgiving. Give us courage in difficulty, gratitude in joy, generosity in family life and perseverance in faith. Lead us together towards eternal life. Amen.</p>\n<h3>WHEN FAITH DIFFERS</h3>\n<p>Pray in a way each can join sincerely. Respect does not require the Catholic spouse to hide faith or the non-Catholic spouse to profess a belief they do not hold.</p>\n<h2>After the wedding</h2>\n<p>Use Appendix G. Choose a small rule of life that can be kept. The covenant is lived through repeated acts of fidelity, generosity, mercy and prayer.</p>\n<h3>Each day</h3>\n<p>Speak one word of gratitude, give attention and show ordinary affection. Pray together briefly where possible and tell the truth kindly.</p>\n<h3>Each week</h3>\n<p>Keep Sunday Mass central for the Catholic spouse or spouses. Make time to talk without phones about how each person is doing.</p>\n<h3>Regularly</h3>\n<p>Review finances and responsibilities together. Catholic spouses use Confession regularly and receive Communion worthily. Continue learning about the faith.</p>\n<h3>In family life</h3>\n<p>Protect fidelity and speak respectfully about intimacy and fertility. If children are given, pray with them, bring them to Mass and teach them the faith.</p>\n<h3>When difficulties arise</h3>\n<p>Seek help early. Ordinary conflict calls for truthful repair; danger or abuse requires safety and specialist support. Neither should endure serious harm in silence.</p>\n<h3>KEEP A SUPPORTING RELATIONSHIP</h3>\n<p>Agree a suitable conversation after the wedding with the mentor or priest. Review one good habit, one question and one practical need. Keep friendships and parish relationships that strengthen married life.</p>\n<h3>For the mentor</h3>\n<p>Offer steady encouragement without intruding. Continue to point towards Christ, faithful worship and the duties of married life. Refer serious difficulties to pastoral and appropriate professional support.</p>\n<h2>References for the priest and mentor</h2>\n<p>This guide follows the four conversations in Preparing for Our Marriage A Catholic Preparation Book for Engaged Couples. The book supplies the teaching; this companion supplies activities and practical accompaniment.</p>\n<h3>Appendices A and B</h3>\n<p>The wedding rite, freedom to marry, permissions, dispensations, documents and parish preparation.</p>\n<h3>Appendices C and D</h3>\n<p>Central truths and honest conversations about faith, communication, money, intimacy, family life, health, habits and safety.</p>\n<h3>Appendices E and F</h3>\n<p>Readiness and common pastoral or canonical questions.</p>\n<h3>Appendix G</h3>\n<p>A simple rule of continuing married life and the book’s doctrinal references.</p>\n<h3>Primary Church sources</h3>\n<p>Sacred Scripture: Genesis 1–2; Matthew 19:3–6; John 2:1–11; 1 Corinthians 7 and 13; Ephesians 5:21–33; Colossians 3:12–17.</p>\n<p>Catechism of the Catholic Church: 1601–1666 on Matrimony; 2331–2400 on chastity, conjugal love and responsible parenthood; 1455–1456 on confession of sins.</p>\n<p>Code of Canon Law: canons 1055–1165 on marriage, especially consent, impediments, canonical form and mixed marriages; canon 988 on confession of sins.</p>\n<p>The approved Order of Celebrating Matrimony, current diocesan policy and the priest’s direction govern particular cases and the celebration. Follow the parish and registrar’s current civil instructions.</p>"}];

document.getElementById('lead').innerHTML='<h2>'+g.name+'</h2><p>'+g.desc+'</p><a class="cta" href="'+g.url+'" target="_blank" rel="noopener">Open the '+g.name+' curriculum app &rarr;</a>';
document.getElementById('guide').innerHTML=g.html;

window.scrollTo(0,0);}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(+b.dataset.i));
show(0);</script>
