ady in God’s friendship, not a second chance after rejecting him. Pray briefly for someone who has died.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 5. Use Appendix E on Christ’s mediation, images and private revelation if those are the candidate’s actual questions.</p>\n<h2>Mary the Saints and the Communion of Saints</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How does honouring Mary point towards the truth about Jesus?”</li><li>“What is the difference between asking a saint’s prayer and adoring God?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Whom do Catholics adore? God alone. Why is Mary Mother of God? The Son she bore according to his humanity is truly God. What is purgatory? The final purification of those who die in God’s grace and friendship.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, unite us in your love with all who belong to you. Mary, Mother of God, and all the saints, pray that we may persevere in faith and reach eternal life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Reread one of Mary’s privileges in Conversation 5. Explain how it concerns Christ and his grace, then pray for someone who has died.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not insist on a favourite private devotion or dismiss a real concern as prejudice. Explain Catholic distinctions carefully. Never pronounce on the eternal state of a particular deceased person.</p>\n<h2>Grace and the Seven Sacraments</h2>\n<h3>AIM</h3>\n<p>Explain sacraments as Christ’s effective gifts and clarify the candidate’s sacramental history.</p>\n<h3>QUICK PREP</h3>\n<p>Seven handwritten cards using the sacrament names below.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What changes when a sacrament is understood as something Christ does, rather than only something we express?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Gifts for a whole Christian life</strong></p>\n<ol><li>Arrange the cards in three groups: INITIATION: Baptism, Confirmation, Eucharist; HEALING: Penance, Anointing of the Sick; SERVICE OF COMMUNION: Holy Orders, Matrimony.</li><li>Choose Baptism. Explain the visible sign, new birth, forgiveness and permanent character. Thank God for the candidate’s Baptism already received.</li><li>Choose Confirmation. Read how the Holy Spirit strengthens baptismal grace and leaves a permanent seal. Valid Confirmation or chrismation is not repeated.</li><li>Name what is known about earlier sacraments and what needs the priest’s investigation. The activity records questions; it does not establish validity.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 6 and Appendix A. The priest determines what Confirmation is required from the person’s actual sacramental history.</p>\n<h2>Grace and the Seven Sacraments</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why are sacraments more than reminders?”</li><li>“Which sacramental gift do you most want to understand or receive?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How many sacraments are there? Seven. What do they do? Signify and truly communicate Christ’s grace. Can valid Baptism or Confirmation be repeated? No. Each gives a permanent sacramental character.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, thank you for the sacramental life of your Church. Make me receptive to your grace and help me receive your gifts with faith and gratitude. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn the seven names and their three groups. Give the priest any missing information about Baptism, Confirmation or chrismation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Never assume that all earlier sacraments are invalid. Eastern Christians need particular attention to valid sacraments and their proper ecclesial heritage. Leave reception procedure, Church membership and faculties to the priest and competent guidance.</p>\n<h2>The Eucharist and the Holy Mass</h2>\n<h3>AIM</h3>\n<p>Connect the Real Presence, Christ’s one sacrifice and visible communion with the Church.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix, optional; three headings: PRESENCE, SACRIFICE, COMMUNION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you understand Catholics to believe happens at Mass?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What Christ gives at Mass</strong></p>\n<ol><li>Under PRESENCE, read how the whole substance of bread and wine becomes Christ’s Body and Blood while the appearances remain: transubstantiation.</li><li>Under SACRIFICE, place the crucifix if available. Explain that Christ’s one sacrifice is made sacramentally present; he is not crucified again.</li><li>Under COMMUNION, name union with Christ and visible unity in Catholic faith, sacramental life and pastors. Discuss why the candidate normally waits until Reception.</li><li>Name ways to take part now: hear the Word, pray, offer one’s life with Christ and give thanks. Choose one intention for the next Sunday Mass.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 7. Keep sacrifice, Real Presence and ecclesial communion together. Use Appendix E on the Mass and waiting for Communion.</p>\n<h2>The Eucharist and the Holy Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Communion more than a private expression of devotion?”</li><li>“How can you unite your life to Christ’s offering while preparing for Reception?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is present in the Eucharist? Jesus Christ, Body, Blood, Soul and Divinity. Does Christ die again at Mass? No. His one sacrifice is made sacramentally present. What does Holy Communion express? Union with Christ and visible communion with his Church.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, Bread of Life, increase my faith in your Real Presence. Prepare me to receive you worthily and to offer my life with your one perfect sacrifice. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, pay attention to the Eucharistic Prayer. Afterwards name one thing you understood about sacrifice, presence or communion.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen for belief beyond “special bread” or a merely symbolic meal. Use the book’s precise explanation; do not imitate consecration. Support prayerful participation while referring any exceptional sacramental question to the priest.</p>\n<h2>Conversion and the Sacrament of Penance</h2>\n<h3>AIM</h3>\n<p>Prepare the baptised candidate peacefully for Confession before Reception.</p>\n<h3>QUICK PREP</h3>\n<p>Appendix B; six headings: BEGIN, CONFESS, LISTEN, CONTRITION, ABSOLUTION, PENANCE.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you hope for, or worry about, when you think of meeting Christ in Confession?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A calm walk through Confession</strong></p>\n<ol><li>Put the headings in order using Appendix B. Explain examination of conscience, sorrow for sin and a genuine intention to change with God’s help.</li><li>Practise this opening: “I am preparing to be received into full communion, and this is my first Catholic Confession.” The priest will guide the person.</li><li>Use an invented example, such as a person deliberately cheating another. Discuss speaking simply and making restitution; never practise with the candidate’s actual sins.</li><li>Read the Act of Contrition printed here. Explain absolution and penance without acting as a confessor. Arrange private preparation and an appointment with the priest.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 8 and Appendix B. Because the candidate is baptised, Confession normally belongs before Reception.</p>\n<h2>Conversion and the Sacrament of Penance</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How is a genuine intention to change different from promising never to fail again?”</li><li>“What would help you approach the sacrament with trust?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is contrition? Sorrow for sin with a real intention to turn away from it. What does absolution do? Christ forgives through the priest and reconciles the penitent with the Church. Should Confession normally precede Reception? Yes. The priest prepares and arranges it.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Merciful Father, give me honest sorrow for sin and confidence in your mercy. Help me make a good Confession and begin again in your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use Appendix B privately for a peaceful examination of conscience. Arrange Confession with the priest rather than leaving it until the last moment.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not ask to hear, record or review the candidate’s sins. The priest alone receives sacramental Confession. Explain the absolute seal and avoid anxious demands for perfect recall. Personal or complex concerns should be taken privately to him.</p>\n<h2>The Moral Life Freedom Conscience and Virtue</h2>\n<h3>AIM</h3>\n<p>Connect God’s initiating grace with free cooperation, formed conscience and virtue.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: GIFT, RESPONSE, FRUIT.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What is the difference between following conscience and forming conscience?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Grace becoming a changed life</strong></p>\n<ol><li>Under GIFT, name God’s grace. Under RESPONSE, name free cooperation. Under FRUIT, name love, obedience and good works made possible by grace.</li><li>Use this case: a person says an unfair business practice is acceptable because they feel no guilt. Ask what truth must be considered beyond the feeling.</li><li>Read the book’s definition of conscience. Name ways to form it: Scripture, prayer, truth and the Church’s teaching.</li><li>Choose a virtue for the case: prudence, justice, fortitude or temperance. Discuss one habit that could help the person act rightly. Add faith, hope and charity as the theological virtues.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 9 and Appendix E on faith and works. Keep grace first and the real transformation of life clear.</p>\n<h2>The Moral Life Freedom Conscience and Virtue</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why are good works the fruit of grace rather than a purchase of God’s love?”</li><li>“What is one way you can form conscience more carefully?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Do we earn salvation independently of grace? No. Salvation is God’s gift; living faith bears fruit in love. What is conscience? A judgement of reason about the moral quality of a concrete act. Must conscience be formed? Yes. We must seek and receive the truth.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, form my conscience in truth. Heal my freedom by your grace and teach me a faith that becomes love, obedience and good works. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one ordinary decision. Ask which virtue named here could help you act rightly, then take one practical step with God’s help.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Respect the candidate’s freedom while explaining the duty to seek truth. Do not turn sincerity into permission to invent morality. When a complex personal case arises, help the person seek confidential pastoral guidance.</p>\n<h2>The Moral Life Love in Concrete Life</h2>\n<h3>AIM</h3>\n<p>Make the dignity of the person and the demands of Catholic moral teaching practical.</p>\n<h3>QUICK PREP</h3>\n<p>Paper with headings: LIFE, MARRIAGE, TRUTH, JUSTICE, CHARITY.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which Catholic moral teaching most needs explanation for you, and what good does the Church say it protects?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The good that love protects</strong></p>\n<ol><li>Use a case: a family treats a dependent elderly relative as a burden. Discuss dignity, care and why life must never be treated as disposable.</li><li>Use a case: an employer knowingly withholds a worker’s pay. Discuss justice and the concrete obligations of love.</li><li>Read the whole of Conversation 10, including chastity, marriage, care for life, truth, work and the common good. Do not omit a difficult area.</li><li>Under one heading, name a teaching that needs further discussion and one act of charity that can begin now. The candidate need not reveal private details.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 10. Bring marriage history or any personal situation affecting sacramental life to the priest early, using Appendix A.</p>\n<h2>The Moral Life Love in Concrete Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does love require more than strong feelings?”</li><li>“How can we explain a demanding teaching while showing charity towards every person?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why protect human life? Every person has God-given dignity, from conception to natural death. What is Christian marriage? A lifelong, exclusive covenant of a man and a woman, ordered to their good and the gift and education of children. What is the highest moral virtue? Charity: love of God and neighbour for God’s sake.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>God of truth and mercy, teach me to love what is good. Give me courage where conversion is demanding and generous charity towards every person. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Bring one genuine moral question to the mentor or priest and choose one concrete act of care or justice.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Let the candidate ask the real question. Explain reasons as well as duties. A mentor does not resolve a marriage bond or demand personal disclosure. Keep compassion, the fullness of Catholic teaching and appropriate pastoral referral together.</p>\n<h2>Prayer and the Ordinary Catholic Life</h2>\n<h3>AIM</h3>\n<p>Build a sustainable pattern of worship, prayer, parish belonging and charity.</p>\n<h3>QUICK PREP</h3>\n<p>A diary or paper; the basic prayers printed at the end of this guide.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What simple rhythm of prayer and Sunday worship could still be part of your life five years from now?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A rule that can be lived</strong></p>\n<ol><li>Write DAILY, SUNDAY, REGULARLY and PARISH. Under DAILY, choose one of the printed prayers and a short time for morning or evening prayer.</li><li>Under SUNDAY, plan Mass and any practical help needed. During preparation, participate prayerfully while normally waiting until Reception for Communion.</li><li>Under REGULARLY, plan continuing formation and Confession as arranged with the priest. Under PARISH, name a person to know and a way to serve.</li><li>Read the book on the liturgical year, sacramentals and devotions. Choose a helpful devotion without allowing it to replace Mass or become a burdensome private programme.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 11 and Appendix G. Catholic formation and conversion continue after Reception.</p>\n<h2>Prayer and the Ordinary Catholic Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What existing prayer habit can you carry into Catholic life?”</li><li>“What support would help this simple rule survive work, tiredness or family demands?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the weekly centre? Sunday Mass. Do devotions replace the liturgy or sacraments? No. They support Catholic life. Does formation finish at Reception? No. Learning, conversion and service continue.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, teach me to pray. Make Sunday worship the anchor of my life and help me remain faithful in ordinary work, relationships and service. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Begin the small rule you have chosen. Pray one printed prayer daily and keep your plan for Sunday Mass.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Adapt to capacity and circumstances without losing the substance of Catholic life. Teach the Church’s actual obligations; do not impose personal devotional tastes. Arrange parish relationships that extend beyond meetings with the priest.</p>\n<h2>Profession Reception Confirmation and Eucharist</h2>\n<h3>AIM</h3>\n<p>Prepare a sincere profession and calm participation in Reception and the sacraments.</p>\n<h3>QUICK PREP</h3>\n<p>Appendix C; four cards: PROFESSION, RECEPTION, CONFIRMATION IF NEEDED, EUCHARIST.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Can you freely and sincerely intend to believe and live as a Catholic Christian? What still needs attention?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Words I can mean and gifts I will receive</strong></p>\n<ol><li>Read the profession: “I believe and profess all that the holy Catholic Church believes, teaches, and proclaims to be revealed by God.” Ask what its words mean.</li><li>Arrange the cards using Appendix C. Explain Reception, Confirmation when needed and sharing the Eucharist in full communion. No valid Baptism is repeated.</li><li>Practise only the responses and movements directed by the priest. Rehearse “Amen” before Communion without using a practice host or imitating sacramental actions.</li><li>Name an unresolved question to bring to the priest, confirm practical arrangements and put a meeting after Reception in the diary. Preparation follows sincere readiness, not pressure to meet a date.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 12 and Appendices C and F. The approved rite and the priest govern the profession, actual celebration and readiness.</p>\n<h2>Profession Reception Confirmation and Eucharist</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How is a question seeking understanding different from a teaching you knowingly reject?”</li><li>“What will help you continue Catholic life after the celebration?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What faith do you profess? The Catholic faith as a whole, freely and sincerely. What normally follows? Reception, Confirmation if needed, and sharing fully in the Eucharist. Who judges readiness? The priest, following the Church’s rite, law and diocesan directions.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, give me faith to profess your truth freely, humility to keep learning and charity to live in full communion with your Church. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use Appendix F with the priest. Name any point you cannot yet profess sincerely and confirm how accompaniment will continue afterwards.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not rehearse past a difficulty the candidate cannot honestly resolve. Reception need not await a fixed annual course or treat the person as a catechumen. The priest establishes the appropriate rite and timing and clarifies previous Confirmation or Eastern chrismation.</p>\n<h2>The journey at a glance</h2>\n<p>Use this to explain the pathway, not to promise a timetable. The priest directs particular circumstances and the approved celebration.</p>\n<h3>Baptism and pastoral circumstances</h3>\n<p>Use Appendix A early. Establish Baptism, previous Catholic status, Confirmation or chrismation, Eastern Christian background, marriage history and participation needs.</p>\n<h3>Formation and belonging</h3>\n<p>Work through the conversations at the person’s pace. Join Sunday Mass, pray, ask honest questions and develop parish relationships.</p>\n<h3>Readiness and free profession</h3>\n<p>Use Appendix F with the priest. Seek sufficient understanding and sincere acceptance of Catholic faith, with a real intention to live it.</p>\n<h3>Sacrament of Penance</h3>\n<p>Prepare privately and normally celebrate Confession before Reception. Use Appendix B and the priest’s guidance.</p>\n<h3>Reception and sacramental communion</h3>\n<p>Make the approved profession. Reception is followed by Confirmation if needed and participation in the Eucharist.</p>\n<h3>Continuing Catholic life</h3>\n<p>Maintain Sunday Mass, prayer, Confession, charity, formation and parish belonging. Arrange accompaniment after Reception.</p>\n<h3>A DISTINCT PATHWAY</h3>\n<p>The already baptised candidate is not a catechumen. Do not repeat valid Baptism or add rites proper to the unbaptised. Reception may take place at Easter or another suitable time as the priest directs.</p>\n<h2>Readiness in faith and freedom</h2>\n<p>Use with Appendix F for a calm conversation. These prompts help the mentor accompany discernment; they do not certify readiness.</p>\n<h3>FREE INTENTION</h3>\n<p>The person freely seeks full communion and understands that this is a real commitment to Catholic faith and life.</p>\n<h3>CATHOLIC FAITH</h3>\n<p>The person understands the central truths according to capacity and background and can sincerely accept the Catholic faith as a whole.</p>\n<h3>AUTHORITY</h3>\n<p>Scripture, Apostolic Tradition and the Magisterium are understood sufficiently for a free acceptance of the Church’s teaching authority.</p>\n<h3>REAL QUESTIONS</h3>\n<p>Difficulties are named honestly. Questions seeking understanding are welcomed; known rejection of a doctrine to be professed needs attention before Reception.</p>\n<h3>CONVERSION</h3>\n<p>The person intends to live Catholic moral teaching, seeks grace and is honest about areas requiring conversion or pastoral help.</p>\n<h3>WHEN MORE TIME IS NEEDED</h3>\n<p>Name the teaching clearly, read what the Church actually means and continue accompaniment. Do not force a date or encourage a profession made with a reservation the person knows they cannot accept.</p>\n<h2>Readiness in sacramental life</h2>\n<h3>THE PATHWAY IS ESTABLISHED</h3>\n<p>The priest has clarified Baptism, previous Catholic status, Eastern Christian background and what Confirmation is required.</p>\n<h3>PASTORAL MATTERS</h3>\n<p>Marriage history and other canonical matters affecting sacramental life have been discussed with the priest and appropriately addressed.</p>\n<h3>SACRAMENTAL FAITH</h3>\n<p>The candidate understands Baptism, Confirmation, Penance, the Eucharist and the Mass in ordinary words according to capacity.</p>\n<h3>PENANCE</h3>\n<p>The person is prepared for Confession and normally celebrates it before Reception, with suitable private guidance.</p>\n<h3>PRACTICE AND SUPPORT</h3>\n<p>Sunday Mass, prayer and parish belonging are developing. Suitable sponsor or Catholic support and any practical adaptations are arranged.</p>\n<h3>CONTINUING LIFE</h3>\n<p>There is a realistic plan for Catholic life and accompaniment after Reception, including a further meeting.</p>\n<p>Readiness is not perfect memory, a polished testimony or a claim never to sin again. The priest makes the final pastoral judgement following the approved rite, Church law and diocesan direction.</p>\n<h2>Practical preparation with the mentor</h2>\n<h3>Confession</h3>\n<p>Read Appendix B privately. Practise the opening and the Act of Contrition, using only invented cases for discussion. The priest will help with the real confession. A mentor never asks for an account of what was confessed.</p>\n<h3>Profession and movements</h3>\n<p>Read Appendix C with the priest. Make sure the candidate understands the profession and knows where to stand with the sponsor. Practise the spoken responses and movements only; leave sacramental actions to the real celebration.</p>\n<h3>Receiving Holy Communion</h3>\n<p>Practise the response “Amen” and the approved parish manner of receiving. The Sacred Host is consumed immediately. The ordinary Eucharistic fast is one hour before receiving Communion, except water and medicine; ask the priest about illness or any relevant exemption.</p>\n<p>Prepare for worthy reception in a state of grace. Anyone conscious of mortal sin should normally receive sacramental absolution before Communion. Refer questions about swallowing, gluten, mobility or other adaptations to the priest early.</p>\n<h3>A PRAYER OF THANKSGIVING</h3>\n<p>Lord Jesus, thank you for giving yourself to me. Keep me close to you, strengthen me in charity and make my life a faithful offering to the Father. Amen.</p>\n<h3>CONFIRM THE NEXT MEETING</h3>\n<p>Before the celebration, agree when the mentor and newly received Catholic will meet again. Give continuing parish support a person, a place and a practical next step.</p>\n<h2>The Apostles’ Creed</h2>\n<p>Use for learning and prayer alongside Conversation 3. The approved rite supplies the profession and responses used at Reception. I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.</p>\n<p>I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.</p>\n<h3>Pray with understanding</h3>\n<p>Pause where a phrase needs attention. “He descended into hell” here refers to Christ’s descent to the realm of the dead. Bring a real question to the mentor or priest rather than hiding it.</p>\n<h2>Prayers for ordinary life</h2>\n<h3>The Sign of the Cross</h3>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<h3>The Our Father</h3>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<h3>The Glory Be</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>An Act of Contrition</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>A morning offering</h3>\n<p>Father, I offer you this day through Jesus Christ. Guide my words, work and choices. Help me love you and serve my neighbour. Amen.</p>\n<h3>An evening prayer</h3>\n<p>Father, thank you for your gifts today. Forgive my failures, show me how to begin again and keep me in your peace. Amen.</p>\n<h2>After Reception</h2>\n<p>Use Appendix G with the newly received Catholic. Ask how the sacraments and parish belonging are shaping ordinary life; do not require a dramatic emotional experience.</p>\n<h3>Sunday and daily prayer</h3>\n<p>Keep Sunday Mass at the centre. Continue a small, faithful pattern of prayer and Scripture, supported by the parish and the printed prayers here.</p>\n<h3>Mercy and conversion</h3>\n<p>Receive Confession regularly, repair harm where possible and begin again when needed. Seek guidance about worthy Communion rather than withdrawing into anxiety.</p>\n<h3>Belonging and service</h3>\n<p>Name parish people who can offer friendship and one realistic way to serve. Include family, work, money and care for the vulnerable in Christian charity.</p>\n<h3>Learning and Christian unity</h3>\n<p>Continue formation and bring new questions. Pray for other Christians and speak with gratitude and charity about earlier Christian life.</p>\n<h3>PRAY AFTER RECEPTION</h3>\n<p>Lord Jesus Christ, thank you for leading me into the full communion of your Church. Keep me faithful in the Eucharist, humble in Confession, attentive to your Word and generous in charity. Make my life a witness to your unity and holiness. Amen.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Keep the next meeting. Review one grace, one question and one practical need. Accompaniment continues through real relationships, prayer and ordinary Catholic life.</p>\n<h2>Final word for the mentor</h2>\n<p>Let the candidate bring a real question. Use the activity to make the teaching concrete, then open the preparation book for the Catholic answer. Listen for understanding that is becoming faith, prayer and a changed life.</p>\n<h3>KEEP THE PERSON IN VIEW</h3>\n<p>Welcome what is already known and lived. Explain what needs clarification, recognise sincere growth and give time for questions. Preparation should help the candidate make a profession that is freely and honestly meant.</p>\n<h3>KEEP THE NEXT STEP CONCRETE</h3>\n<p>End with one action the person can realistically take: a prayer, a conversation with the priest, Sunday Mass, a work of charity or a question to revisit. Begin the next meeting by asking how it went.</p>\n<h3>CONTINUE THE RELATIONSHIP</h3>\n<p>After Reception, help the new Catholic belong to the parish, grow in sacramental life and remain open to learning. Friendship, prayer and steady encouragement matter beyond the celebration.</p>\n<h3>When a question needs help</h3>\n<p>Use the preparation book to establish what the Church teaches. Bring an unresolved doctrinal difficulty to the priest. Canonical questions, personal marriage circumstances and private sins belong with him in an appropriate confidential setting.</p>\n<h2>References for the priest and mentor</h2>\n<p>This guide follows the twelve conversations of Coming into Full Communion A Catholic Preparation Book for Baptised Christians. Use that book for the full teaching and its appendices for particular questions.</p>\n<h3>Appendix A</h3>\n<p>Baptism, previous Catholic status, Confirmation or chrismation, Eastern Christian background, marriage history and participation needs.</p>\n<h3>Appendices B and C</h3>\n<p>Private preparation for Confession and the outline of Reception.</p>\n<h3>Appendices D and E</h3>\n<p>Central truths to understand and common questions from other Christian traditions.</p>\n<h3>Appendices F and G</h3>\n<p>Readiness and a simple rule of continuing Catholic life.</p>\n<h3>Appendix H</h3>\n<p>Primary sources, ecclesial authority and particular care for Eastern Christians.</p>\n<h3>Primary Church sources</h3>\n<p>Catechism of the Catholic Church, especially the sections on revelation, the Church, sacramental life, moral life and prayer.</p>\n<p>Code of Canon Law, especially canons 204–205, 842–845, 879–896, 916 and 919. The approved Rite of Reception, Order of Confirmation and Roman Missal govern the celebration in England and Wales.</p>\n<p>The preparation book’s Appendix H supplies fuller references. Current diocesan direction and the priest’s pastoral judgement govern each person’s actual pathway and readiness. This guide supplies activities and accompaniment, not a substitute liturgical rite.</p>"}, {"name": "Adult Confirmation", "url": "https://3stepuk.github.io/Adult-Confirmation/", "desc": "For baptised Catholics preparing for Confirmation as adults.", "html": "<p>For mentors accompanying baptised Catholic adults</p>\n<h3>USE BESIDE THE PREPARATION BOOK</h3>\n<p>Use with Preparing for Adult Confirmation Catholic Preparation Companion. The book supplies the Catholic teaching. This guide helps a mentor or sponsor make that teaching concrete, listen to the adult’s questions and encourage a faithful response.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the person</li><li>Do something concrete</li><li>Open the preparation book</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>ALREADY BAPTISED AND ALREADY CATHOLIC</h3>\n<p>This pathway is for a Catholic adult who has not yet been confirmed. Confirmation strengthens baptismal grace and Christian witness. The priest checks the sacramental record and arranges the celebration with the bishop or a priest who has the required faculty.</p>\n<h2>How to use this guide</h2>\n<h3>BEGIN WITH AN ADULT CHRISTIAN LIFE</h3>\n<p>The candidate already belongs to Christ through Baptism. Welcome the faith and experience already present. Help the person understand the gift of Confirmation and receive it freely, with a real intention to live as a Catholic disciple.</p>\n<h3>For each conversation</h3>\n<ol><li>Make the Sign of the Cross and pray Come Holy Spirit, printed near the end. Ask the opening question and listen.</li><li>Try the activity together. Cards can be handwritten as you meet; every activity can also be spoken.</li><li>Open the matching conversation in the preparation book. Read REMEMBER and the teaching slowly, pausing for questions.</li><li>Talk together. Check the central truth, then use THE ESSENTIALS in the book. Seek understanding in ordinary words.</li><li>Pray the printed prayer and choose one realistic action. Return to it at the next meeting.</li><li>Repeat, combine or divide conversations as needed. Twelve conversations are not twelve compulsory meetings. Readiness governs progress.</li></ol>\n<h3>Simple materials</h3>\n<p>The preparation book, this guide, paper and a pen are enough. Church visits and a crucifix are optional. No prepared talk, craft kit or internet search is needed. Activities are conversation helps, not tasks to hand in.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen, pray, explain simply and help the person belong in the parish. Use the preparation book for the teaching. Ask the priest about unresolved doctrine, sacramental records, personal circumstances and readiness.</p>\n<h2>An opening conversation</h2>\n<p>Begin here before working through the twelve conversations. A period away from practice calls for patient accompaniment and an honest next step.</p>\n<h3>Listen to the person</h3>\n<ol><li>“What has your Catholic faith meant in your life so far?”</li><li>“Why do you wish to receive Confirmation now?”</li><li>“What do you most want to understand, and what concerns you?”</li><li>“What would help you return to or deepen Mass and prayer?”</li></ol>\n<h3>ESTABLISH THE CORRECT PATHWAY</h3>\n<p>Use Appendices A and I with the priest early. Check Baptism, Catholic status and whether Confirmation or Eastern Catholic chrismation has already been received. Mention any missing First Holy Communion. An unbaptised adult needs the catechumenate; a non-Catholic Christian seeking to become Catholic needs Reception into Full Communion.</p>\n<h3>Arrange practical support</h3>\n<p>Agree how to meet. Ask about language, reading, disability, work and caring responsibilities. Arrange a suitable sponsor with parish guidance. Bring marriage or other sacramental questions privately to the priest before choosing a date.</p>\n<h3>ONE NEXT STEP</h3>\n<p>Choose something possible now: Sunday Mass, daily prayer, obtaining a baptismal certificate or speaking to the priest. Family expectations or wedding plans should not replace the candidate’s sincere intention.</p>\n<p>Never ask for an account of private sins. A mentor accompanies preparation; sacramental Confession belongs with the priest.</p>\n<h2>Baptism and Christian Initiation</h2>\n<h3>AIM</h3>\n<p>Place Confirmation within the new life already received in Baptism and nourished by the Eucharist.</p>\n<h3>QUICK PREP</h3>\n<p>Three handwritten cards: BAPTISM, CONFIRMATION, EUCHARIST.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you think Confirmation will give you that you have not yet received?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>New life strengthened and nourished</strong></p>\n<ol><li>Place the three cards together. Under Baptism write NEW LIFE; under Confirmation, STRENGTH; under Eucharist, NOURISHMENT. All belong to one Christian initiation.</li><li>Ask what Baptism has already given. Supply what is needed: forgiveness, new life as God’s child, membership in Christ and his Church, a permanent mark.</li><li>Use this claim: “Confirmation finally makes my Baptism count.” Ask the candidate to correct it: Baptism is already valid; Confirmation completes and strengthens its grace.</li><li>Name one way this new life is already being lived and one way it needs strengthening. Give thanks for Baptism before discussing the date of Confirmation.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1. Use Appendix A if Baptism, earlier Confirmation or First Holy Communion needs clarification.</p>\n<h2>Baptism and Christian Initiation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Confirmation first a gift of God rather than something we achieve?”</li><li>“How do Baptism, Confirmation and Eucharist belong together?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Which are the initiation sacraments? Baptism, Confirmation and the Holy Eucharist. Does Confirmation make Baptism valid? No. Baptism is already valid. What happens to baptismal grace? Confirmation completes and strengthens it.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, thank you for making me your child in Baptism. Strengthen the life you have given me and prepare me to receive the Holy Spirit more fruitfully. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Find your baptismal date and parish, asking for the record if needed. Thank God for one grace you have received through Baptism.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen for graduation, maturity or social expectations as the whole explanation. Honour the adult’s freedom while keeping God’s sacramental action central. Refer uncertain records and missing First Holy Communion to the priest.</p>\n<h2>The Holy Spirit Lord and Giver of Life</h2>\n<h3>AIM</h3>\n<p>Help the adult know the Holy Spirit as a divine Person and pray for his sanctifying help.</p>\n<h3>QUICK PREP</h3>\n<p>Two headings: WHO HE IS and WHAT HE DOES.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “When you hear ‘Holy Spirit’, do you think first of a Person, a feeling or a power?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A Person we can know and love</strong></p>\n<ol><li>Under WHO HE IS, write TRUE GOD and THIRD PERSON OF THE TRINITY. There is one God in three divine Persons, Father, Son and Holy Spirit.</li><li>Under WHAT HE DOES, write GIVES LIFE, SANCTIFIES, GUIDES and HELPS US PRAY. Ask which help seems most needed now.</li><li>Use this case: an adult says, “I feel no religious excitement, so the Holy Spirit cannot be helping me.” Ask why his action is not measured by a passing emotion.</li><li>Pray directly: “Holy Spirit, help me know and love God.” Name one daily choice where grace is needed alongside honest thought and effort.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 2. Keep the Spirit’s divinity, personal action and presence in the life of grace clear.</p>\n<h2>The Holy Spirit Lord and Giver of Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How does knowing the Holy Spirit as a Person change prayer?”</li><li>“Where do you rely on willpower without asking for grace?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is the Holy Spirit? The third Person of the Blessed Trinity, true God. Are there three gods? No. There is one God in three divine Persons. Is the Spirit just an emotion? No. He is a divine Person who gives life and sanctifies.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit. Help me know you as Lord and Giver of Life. Teach me to pray, repent and follow your grace in the ordinary choices of this day. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each morning pray: “Holy Spirit, guide my mind, words and choices today.” At night thank him for one opportunity to do good.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Avoid analogies that divide God into parts or make the three Persons merely different appearances. Lack of strong feeling is not evidence that grace is absent. Encourage simple, faithful prayer and cooperation with the Spirit.</p>\n<h2>The Promise and Pentecost</h2>\n<h3>AIM</h3>\n<p>Connect Pentecost with the strength for mission given in Confirmation.</p>\n<h3>QUICK PREP</h3>\n<p>Two headings: BEFORE PENTECOST and SENT AS WITNESSES.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Where in family, work or friendships do you need courage to live your faith openly?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>From fear to faithful witness</strong></p>\n<ol><li>Retell the book’s account: the risen Jesus promised the Holy Spirit; at Pentecost the Spirit descended upon the Apostles, who proclaimed Christ boldly.</li><li>Under BEFORE PENTECOST, name fear and waiting. Under SENT AS WITNESSES, name courage, proclamation of Christ and the gathering of believers into the Church.</li><li>Use this case: a colleague asks why a Catholic goes to Mass. Think of one honest, courteous answer rather than hiding faith or starting an argument.</li><li>Explain that Confirmation gives a special outpouring of the Spirit for witness. Choose one ordinary situation where the candidate can ask for this courage.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 3. Its account supplies the activity; a separate Bible reading is optional, not needed for the meeting.</p>\n<h2>The Promise and Pentecost</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why was Pentecost more than a private spiritual experience?”</li><li>“How can courage and charity belong together in a real conversation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who promised the Spirit? Jesus Christ. What did the Apostles do at Pentecost? They proclaimed Christ boldly in the strength of the Spirit. What does Confirmation share in? The grace of Pentecost for witness and mission.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, as you strengthened the Apostles, strengthen me to confess Christ. Give me truthful words, patient charity and courage in the places where I live and work. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one ordinary opportunity to acknowledge your faith truthfully and kindly. Pray for the courage of Pentecost before it arises.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Keep mission connected with Christ and the Church. Do not require an emotional testimony or a public performance. A brief honest answer, faithful Sunday worship or a quiet act of mercy may be a real beginning.</p>\n<h2>Confirmation in Scripture and Tradition</h2>\n<h3>AIM</h3>\n<p>Explain Confirmation’s apostolic roots through prayer, hands and the gift of the Spirit.</p>\n<h3>QUICK PREP</h3>\n<p>Four cards: BAPTISED, APOSTLES, PRAYER, LAYING ON OF HANDS.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “If someone said Confirmation was invented for teenagers, how would you begin to answer?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>An apostolic gift handed on</strong></p>\n<ol><li>Read the book’s account of Samaria: the people were baptised; Peter and John came, prayed and laid hands upon them; they received the Holy Spirit.</li><li>Arrange the four cards in that order. Explain that this shows a gift of the Spirit to people already baptised, not a second Baptism.</li><li>Read the book’s reference to Paul at Ephesus. Name the same pattern and connect it with the Church’s living sacramental Tradition.</li><li>Say the answer together in ordinary words: Confirmation comes from Christ and belongs to the apostolic life of the Church. It strengthens baptismal grace.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 4. The relevant passages are Acts 8:14–17 and Acts 19:5–6; the book gives the needed account.</p>\n<h2>Confirmation in Scripture and Tradition</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What does the apostolic pattern tell us about the relation to Baptism?”</li><li>“Why does the Church receive and hand on the sacraments rather than invent them?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who instituted Confirmation? Jesus Christ. How did the Apostles impart the Spirit? By prayer and the laying on of hands. Why the name Confirmation? It signifies the strengthening of baptismal grace.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, keep me in the faith of the Apostles. Help me receive what your Church hands on and become faithful to the mission you entrust to her. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Retell the Samaria account in your own words, using the four headings. Bring one question about Scripture or Tradition to the next meeting.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Use the scriptural pattern without claiming it supplies every later ceremonial detail. Do not turn the activity into a simulated sacrament. The book explains how Scripture and living Tradition witness to the Church’s sacramental life.</p>\n<h2>The Minister Chrism and Sacramental Words</h2>\n<h3>AIM</h3>\n<p>Identify the minister, sacred chrism, essential sacramental action and candidate’s response.</p>\n<h3>QUICK PREP</h3>\n<p>Four headings: MINISTER, CHRISM, WORDS, RESPONSE. No oil is needed.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you already know about what will happen when you are confirmed?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Who acts and what is said</strong></p>\n<ol><li>Under MINISTER, write BISHOP. Explain that he is a successor of the Apostles. A priest may confirm when he has the required faculty.</li><li>Under CHRISM, write PERFUMED OIL CONSECRATED BY A BISHOP. The minister anoints the forehead by the laying on of his hand.</li><li>Under WORDS, read: “N., be sealed with the Gift of the Holy Spirit.” Explain that N. stands for the candidate’s name. Under RESPONSE, write AMEN.</li><li>Practise saying “Amen” clearly as an expression of faith. Ask the parish who will confirm and what local arrangements the candidate should follow.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 5 and Appendix B. The approved rite and confirming minister govern the actual celebration.</p>\n<h2>The Minister Chrism and Sacramental Words</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does the connection with the bishop matter?”</li><li>“What does your ‘Amen’ say about receiving the gift?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is the ordinary minister? The bishop. May a priest confirm? Yes, when the law or competent authority gives him the faculty. What does the candidate answer? Amen.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>God of the Apostles, bless our bishop and priests. Prepare me to receive the sacrament with faith and to answer Amen with a willing and grateful heart. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask the parish who will administer Confirmation and pray for that minister. Learn the sacramental words and your response.</p>\n<h3>FOR THE MENTOR</h3>\n<p>An already-Catholic adult’s Confirmation requires the bishop or a priest with the appropriate faculty. Reception of a non-Catholic Christian has a different legal basis. Leave faculties to the priest; practise responses without oil, touching or imitation of the sacramental act.</p>\n<h2>Anointing Seal and Belonging to Christ</h2>\n<h3>AIM</h3>\n<p>Connect anointing and the permanent sacramental character with a life belonging to Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: STRENGTH, CONSECRATION, PERMANENT SEAL.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would it mean for your hidden choices as well as your public life to belong to Christ?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The sign and the gift</strong></p>\n<ol><li>Under STRENGTH, name the courage needed for Christian life. Chrism’s oil signifies strengthening; the sacrament truly gives grace.</li><li>Under CONSECRATION, name belonging to Christ, the Anointed One. Its fragrance points towards the witness of a holy life.</li><li>Under PERMANENT SEAL, write CHARACTER. This is an indelible spiritual mark; it is not a visible mark on the body or a passing feeling.</li><li>Use this case: someone confirmed years ago has drifted from practice. Explain that the answer is repentance and renewed cooperation with grace, not repeating Confirmation.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 6. If the person is unsure whether they have been confirmed, use Appendix I with the priest.</p>\n<h2>Anointing Seal and Belonging to Christ</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How might your conduct carry the ‘fragrance’ of Christ’s charity?”</li><li>“Why does a permanent character call for continuing conversion?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What does anointing signify? Strength, consecration and sharing in Christ’s mission. What is the sacramental character? The permanent spiritual seal given in Confirmation. Can Confirmation be repeated? No. It is received only once.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, prepare me to belong to Christ more faithfully. Let my words, work, relationships and hidden decisions bear witness to his truth and charity. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make the Sign of the Cross slowly each day. Choose one ordinary duty to carry out more faithfully as someone who belongs to Christ.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Keep the permanent character distinct from the grace that can be neglected or lost through sin. Never decide doubtful sacramental history yourself. The parish checks records and the priest handles genuine uncertainty according to Church law.</p>\n<h2>The Effects of Confirmation</h2>\n<h3>AIM</h3>\n<p>Make the sacrament’s deepening of baptismal grace and strength for witness concrete.</p>\n<h3>QUICK PREP</h3>\n<p>Five headings: FATHER, CHRIST, GIFTS, CHURCH, WITNESS.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What sort of strength would help you be a more faithful Catholic in an ordinary week?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Grace for relationships and mission</strong></p>\n<ol><li>Write the headings. Under FATHER, place DEEPER SONSHIP; under CHRIST, CLOSER UNION; under GIFTS, INCREASED GIFTS OF THE SPIRIT.</li><li>Under CHURCH, place A MORE PERFECT BOND; under WITNESS, STRENGTH TO SPREAD AND DEFEND THE FAITH. Read the matching explanation in the book.</li><li>Choose a situation: keeping a difficult promise, refusing dishonesty or explaining Catholic faith courteously. Ask which effects of Confirmation help here.</li><li>Name one area where the candidate tends to hide faith. Choose a truthful, charitable action that asks for grace and respects the person being addressed.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 7. Keep God’s gift, communion with the Church and ordinary Christian witness together.</p>\n<h2>The Effects of Confirmation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Christian courage different from aggression?”</li><li>“How can greater union with Christ become visible in ordinary duties?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the chief effect? A special outpouring of the Holy Spirit, as at Pentecost. What happens to baptismal grace? It is deepened and strengthened. What special strength is given? Strength to spread and defend the faith by word and deed.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, deepen the grace of my Baptism. Unite me more firmly to Christ and his Church and make me a courageous, charitable witness in ordinary life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one of the five headings. Ask for that grace each morning and practise one concrete act of faithful witness.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Ask for real examples, not impressive claims. Confirmation is more than a motivation exercise, but grace calls for cooperation. Encourage courage governed by charity; do not praise harshness, contempt or the desire to win arguments.</p>\n<h2>The Seven Gifts of the Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Use the seven gifts to bring a real adult decision before God.</p>\n<h3>QUICK PREP</h3>\n<p>The gifts page at the end of this guide; paper and a pen, optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What decision or responsibility most needs the Holy Spirit’s help at present?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A decision in the light of the gifts</strong></p>\n<ol><li>Read the seven names and brief meanings on the gifts page: wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</li><li>Choose an ordinary case: pressure to approve a dishonest claim at work. Ask what is true and right, which counsel to seek and what courage is needed.</li><li>Choose one real responsibility without disclosing private sins. Select a gift particularly needed and explain how it could help the person respond to God.</li><li>Pray for that gift. Name one next step involving thought, sound advice and faithful action; the gifts do not replace competence or effort.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 8 and Appendix C. Use the short meanings here to begin; the book supplies the fuller teaching.</p>\n<h2>The Seven Gifts of the Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is fear of the Lord a loving reverence rather than terror?”</li><li>“How can a gift of the Spirit perfect an adult’s practical judgement?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What do the gifts make us ready for? Following the promptings of the Holy Spirit. Which gift gives steadfast courage? Fortitude. What is fear of the Lord? Reverent awe and a loving desire not to offend God.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Spirit of wisdom and understanding, counsel and fortitude, knowledge, piety and holy fear, make me attentive to your grace and ready to do what is right. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one gift you particularly need. Ask for it each morning and take the practical step agreed in the conversation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Allow the candidate to think aloud. Do not treat every strong impulse as divine guidance. A proposed inspiration must be consistent with faith and moral truth. Refer serious moral or vocational discernment to the priest or suitable guidance.</p>\n<h2>Virtues Fruits and Charisms</h2>\n<h3>AIM</h3>\n<p>Distinguish growth in holy character from gifts given for service.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: VIRTUES, FRUITS, CHARISMS; the summary page here.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would someone close to you notice if you were cooperating more faithfully with the Holy Spirit?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Holiness that becomes visible</strong></p>\n<ol><li>Read the summary page. Under VIRTUES, name faith, hope and charity, and prudence, justice, fortitude and temperance: stable habits of good action.</li><li>Under FRUITS, read the twelve names. Choose patience, faithfulness or self-control and name conduct that would make it visible at home or work.</li><li>Under CHARISMS, write GIFTS FOR SERVICE. Discuss teaching, practical help or encouragement as possible ways to build up the Church, under her discernment.</li><li>Use this case: someone speaks impressively about spiritual experiences but treats others unkindly. Ask why experiences or striking gifts do not prove holiness.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 9 and Appendix C. Keep virtue, the Spirit’s fruits and gifts for service distinct but connected.</p>\n<h2>Virtues Fruits and Charisms</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Which fruit of the Spirit needs to grow in your relationships?”</li><li>“How could an ability be used humbly for the good of others?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What are the theological virtues? Faith, hope and charity. What are the cardinal virtues? Prudence, justice, fortitude and temperance. What are charisms for? Service and the building up of the Church in charity.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, increase faith, hope and charity in me. Form your fruits in my conduct and help me use every gift humbly for the good of others. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one fruit from the printed list. Practise one specific act that expresses it and thank God for the opportunity to serve.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not promise a particular charism or require speaking in tongues or another striking experience. Ordinary fidelity and charity matter. Encourage service within the Church’s discernment rather than declaring someone’s special spiritual status.</p>\n<h2>Renewing the Promises of Baptism</h2>\n<h3>AIM</h3>\n<p>Connect a sincere profession of Catholic faith with repentance and adult discipleship.</p>\n<h3>QUICK PREP</h3>\n<p>The Apostles’ Creed printed here; two headings: RENOUNCE and BELIEVE.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What will you mean when you personally answer ‘I do’ at the renewal of baptismal promises?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A profession that shapes life</strong></p>\n<ol><li>Under RENOUNCE, name Satan and sin. Explain that rejecting evil involves a genuine intention to turn away from it with God’s help.</li><li>Under BELIEVE, read the printed Creed slowly. Choose one familiar article and one that needs explanation, then open the preparation book.</li><li>Connect belief with life: God’s fatherhood with prayer, Christ’s saving work with repentance, the Church with worship and belonging, eternal life with hope.</li><li>Name one area of adult life that should become more consistent with faith: truthfulness, relationships, chastity, work, money, justice or forgiveness.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 10. The Creed here is for learning and prayer; the approved rite supplies the actual baptismal questions.</p>\n<h2>Renewing the Promises of Baptism</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does renewing the promises follow from Baptism already received?”</li><li>“What should you do when a Catholic teaching is difficult to understand?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is renounced? Satan, sin and everything opposed to God. What faith is professed? The apostolic faith of the Catholic Church. How should faith shape life? Through worship, repentance, obedience, prayer and charity.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>O God, strengthen the faith you gave me in Baptism. Help me reject sin, profess the Church’s faith sincerely and live as your faithful child. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the printed Creed slowly. Bring one article or moral teaching you need help understanding, and practise one action consistent with your profession.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Welcome a question seeking understanding and address a known difficulty honestly. Do not encourage an insincere answer or a private rewriting of the faith. Personal circumstances and serious unresolved concerns should be discussed with the priest.</p>\n<h2>Witness Vocation and Spiritual Combat</h2>\n<h3>AIM</h3>\n<p>Place Christian mission and resistance to sin within the adult’s present vocation.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: MY DUTIES, TEMPTATIONS, HELPS. A crucifix is optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Where has God already placed you to be a witness, and what duty there needs greater fidelity?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A vocation lived faithfully</strong></p>\n<ol><li>Under MY DUTIES, name responsibilities in family, work, parish, citizenship or care. Choose one where fidelity itself bears witness to Christ.</li><li>Under TEMPTATIONS, use an invented example: gossip, dishonest advantage or resentment. The struggle is against sin and the devil’s temptations; other people are not enemies to hate.</li><li>Under HELPS, write prayer, Scripture, sacraments, truth, virtue, penance and works of mercy. Choose a help that addresses the example.</li><li>Plan one quiet work of mercy: help someone in need, visit someone lonely, forgive a wrong or pray for someone. Keep existing duties and charity together.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 11. Mission begins in faithful discipleship and shares in the Church’s apostolate.</p>\n<h2>Witness Vocation and Spiritual Combat</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How can you defend the faith without contempt for someone who disagrees?”</li><li>“What ordinary duty is part of your present mission?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why speak of spiritual combat? We must resist sin and temptation and remain steadfast in Christ. Who is not the enemy? Other people are never enemies to be hated. What is the apostolate? Sharing in the Church’s mission.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, make me steadfast against sin, humble in truth and generous in service. Help me fulfil my vocation and love the people you have entrusted to me. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Perform one work of mercy quietly. Ask where your present vocation calls for greater fidelity and take one practical step.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Keep spiritual combat sober and centred on Christ. Do not encourage suspicion about particular people or sensational explanations of ordinary difficulties. Discuss temptations through invented cases; private sins belong in Confession, not the mentor meeting.</p>\n<h2>Preparing Receiving and Persevering</h2>\n<h3>AIM</h3>\n<p>Bring instruction, sincere intention, proper disposition and practical arrangements together.</p>\n<h3>QUICK PREP</h3>\n<p>Appendices B, E, G and H; a diary or paper, optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would help you receive Confirmation peacefully and live its grace six months afterwards?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Before the day and after the day</strong></p>\n<ol><li>Under BEFORE, check preparation, free intention, Sunday Mass, prayer, sponsor support and an opportunity for Confession. Private sins are not discussed here.</li><li>Use Appendix B to walk through the rite in words. Practise responses and movements only, following parish direction; do not imitate sacramental actions.</li><li>Under AFTER, plan Sunday Mass, daily prayer, regular Confession and one suitable form of service. Choose a small pattern that can be kept.</li><li>Agree a further meeting after Confirmation. Name one remaining question for the priest and confirm the practical arrangements with the parish.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 12 and Appendices B, E, G and H. Readiness is discerned with the priest, not certified by completing these pages.</p>\n<h2>Preparing Receiving and Persevering</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why should Confirmation be received in the state of grace?”</li><li>“What will help you persevere when enthusiasm or strong feelings fade?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How should an adult prepare? By instruction, sincere intention, prayer and proper disposition. In what state should it be received? The state of grace. Does formation end here? No. Catholic discipleship continues throughout life.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, complete the good work you have begun in me. Prepare me to receive the Gift of the Holy Spirit and keep me faithful in prayer, sacramental life and service. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Arrange Confession, confirm details with the parish and begin the simple rule of life chosen together. Agree the first meeting after Confirmation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Questions, disability, anxiety or years away from practice need discreet pastoral care. A date or wedding deadline must not replace readiness. The priest arranges the appropriate minister and faculties and judges readiness under Church and diocesan direction.</p>\n<h2>The journey at a glance</h2>\n<p>Use this to explain the pathway. The preparation book and the priest guide each adult’s actual circumstances; this is not a fixed timetable.</p>\n<h3>Check the pathway</h3>\n<p>Use Appendices A and I. Establish Baptism, Catholic status, previous Confirmation or chrismation and whether First Holy Communion has been received.</p>\n<h3>Listen and begin</h3>\n<p>Hear why the person wishes to receive Confirmation. Make Sunday Mass, daily prayer and parish belonging central from the start.</p>\n<h3>Learn and live</h3>\n<p>Use the twelve conversations at a suitable pace. Welcome questions, explain the central truths and choose a practical response each time.</p>\n<h3>Discern readiness</h3>\n<p>Use Appendix G with the priest. Look for sufficient understanding, sincere intention and proper disposition, with a real willingness to live Catholic faith.</p>\n<h3>Prepare and receive</h3>\n<p>Arrange private Confession, sponsor support and practical preparation. The bishop or a priest with the required faculty confirms using the approved rite.</p>\n<h3>Persevere in grace</h3>\n<p>Continue Mass, prayer, Confession, virtue, formation and service. Keep a further mentor meeting and a realistic rule of life.</p>\n<h3>A GIFT FOR THE WHOLE OF LIFE</h3>\n<p>Confirmation strengthens baptismal grace and gives a permanent sacramental character. It calls for continuing cooperation with the Holy Spirit in the Church’s life and mission.</p>\n<h2>The seven gifts for daily decisions</h2>\n<p>Use with Conversation 8 and Appendix C. The gifts make us ready to follow the Holy Spirit and perfect the virtues. They do not replace thought, study or sound advice.</p>\n<h3>Wisdom</h3>\n<p>Judges life in the light of God. Ask: “What choice leads me closer to God?”</p>\n<h3>Understanding</h3>\n<p>Penetrates the truths of faith more deeply. Ask: “What truth of faith should I understand better?”</p>\n<h3>Counsel</h3>\n<p>Helps practical judgement under the Spirit’s guidance. Ask: “What is right here, and whom should I ask?”</p>\n<h3>Fortitude</h3>\n<p>Gives steadfast courage to do and endure what is right. Ask: “What good am I avoiding because it is difficult?”</p>\n<h3>Knowledge</h3>\n<p>Sees created things truthfully and orders them to God. Ask: “Am I using people and things according to God’s purpose?”</p>\n<h3>Piety</h3>\n<p>Forms filial love for God and reverence for his family. Ask: “How can I pray and serve with a childlike heart?”</p>\n<h3>Fear of the Lord</h3>\n<p>Forms reverent awe and a loving desire not to offend God. Ask: “Do I honour God above approval, comfort or success?”</p>\n<h3>PRAY AND ACT</h3>\n<p>Come, Holy Spirit. Help me see what is true and good, seek wise counsel and carry out the right action with love. Amen.</p>\n<h2>Virtues fruits and gifts for service</h2>\n<p>Use with Conversation 9 and Appendix C. These are related ways of describing a life responding to grace; they are not competing badges of achievement.</p>\n<h3>The theological and cardinal virtues</h3>\n<p>Faith, hope and charity unite us to God. Prudence, justice, fortitude and temperance guide good judgement, right treatment of others, courage and self-mastery. Virtues are stable dispositions to do good.</p>\n<h3>The twelve traditional fruits</h3>\n<p>Charity and joy: Love of God and neighbour; spiritual gladness in God’s goodness.</p>\n<p>Peace and patience: Rightly ordered love; enduring difficulty without abandoning charity.</p>\n<p>Kindness and goodness: Readiness to do good; upright conduct expressed in action.</p>\n<p>Generosity and gentleness: Readiness to give and serve; strength governed by humility and charity.</p>\n<p>Faithfulness and modesty: Constancy towards God and others; dignified restraint in conduct.</p>\n<p>Self-control and chastity: Government of desires by reason and grace; sexuality integrated within one’s vocation and state of life.</p>\n<h3>Charisms</h3>\n<p>These are gifts of grace for service and the building up of the Church. They may be striking or ordinary. They are discerned within the Church and used humbly in charity.</p>\n<h3>A CONCRETE QUESTION</h3>\n<p>Which fruit could someone at home or work recognise more clearly in me this week? Choose one act that will express it.</p>\n<h2>A sponsor and a saint</h2>\n<p>Use Appendix D with the parish. As far as possible, a sponsor presents the candidate and helps the confirmed person live as a true witness of Christ afterwards.</p>\n<h3>Choose for Christian witness</h3>\n<p>A sponsor should be a confirmed Catholic who has received the Holy Eucharist and lives in harmony with the faith and this responsibility. Ordinarily the sponsor is at least sixteen, is not bound by a canonical penalty and is not the candidate’s father or mother. The parish checks suitability and any lawful exception.</p>\n<p>A suitable baptismal godparent is a desirable choice, but is not required. Social importance or family expectation should not be the deciding reason.</p>\n<h3>Ask three practical questions</h3>\n<ol><li>“Can we pray together and speak honestly about Catholic life?”</li><li>“Can you encourage me in Mass, Confession and faithful conduct?”</li><li>“How will we remain in touch after Confirmation?”</li></ol>\n<h3>A saint or baptismal patron</h3>\n<p>A new name is not required by the sacrament. Where local custom provides for a saint’s name, follow parish direction. Choose a saint for imitation and intercession, keeping baptismal identity in view.</p>\n<h3>A SIMPLE ACTIVITY</h3>\n<p>Ask the candidate to name one virtue to grow in. If a patron is already known, discuss that virtue in the saint’s life. If not, ask the priest for help choosing; no saint biography is needed for this meeting.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, give me faithful companions. Through the prayers and example of your saints, help me grow in holiness and persevere in your Church. Amen.</p>\n<h2>Peaceful preparation for Confession</h2>\n<p>Use Appendix E privately. Confirmation should be received in the state of grace. If conscious of grave sin, receive sacramental Confession beforehand; Confession is also an excellent preparation when there is no grave sin.</p>\n<h3>The mentor’s part</h3>\n<p>Explain the purpose and the simple order of Confession. Arrange an opportunity with the priest. Use only invented examples when practising; never ask the candidate to disclose sins or report what was confessed.</p>\n<h3>A calm walk through the sacrament</h3>\n<ol><li>Prepare privately: ask for light, examine conscience, be sorry for sin and intend to change with God’s help.</li><li>Begin with the Sign of the Cross. Say how long it has been since your last Confession, even if it has been many years.</li><li>Confess sins honestly and simply. Mortal sins should be confessed in kind and number as well as can be remembered. Ask the priest for help if unsure.</li><li>Listen to the priest’s counsel and penance. Pray an Act of Contrition, printed in this guide, and receive absolution.</li><li>Give thanks, carry out the penance and make a practical beginning in repairing harm and avoiding sin.</li></ol>\n<h3>If the adult is anxious</h3>\n<p>Mortal sin requires grave matter, sufficient knowledge and deliberate consent. Do not hunt for imaginary sins. A sincere purpose of amendment means intending to turn from sin; it is not a guarantee never to fail again.</p>\n<h3>KEEP PRIVATE MATTERS PRIVATE</h3>\n<p>The priest alone receives sacramental Confession and is bound by its absolute seal. A mentor does not assess the contents of a confession. Take personal difficulties privately to the priest.</p>\n<h2>A calm walk through the rite</h2>\n<p>Use Appendix B with parish direction. This outline helps participation; the approved Order of Confirmation governs the actual celebration.</p>\n<h3>Presentation and homily</h3>\n<p>Candidates are presented to the minister. Listen for Baptism, the Holy Spirit and the duties of Christian witness.</p>\n<h3>Renewal of baptismal promises</h3>\n<p>Renounce Satan and profess the Catholic faith. Answer sincerely and clearly, following the questions of the approved rite.</p>\n<h3>Prayer and laying on of hands</h3>\n<p>Pray inwardly as the minister invokes the Holy Spirit and his sevenfold gift upon the candidates.</p>\n<h3>Anointing and sacramental words</h3>\n<p>The minister anoints the forehead with sacred chrism by the laying on of his hand: “N., be sealed with the Gift of the Holy Spirit.” Answer: “Amen.”</p>\n<h3>The sign of peace</h3>\n<p>Respond as directed by the rite. Follow local guidance about approaching, standing and your sponsor’s place.</p>\n<h3>The Eucharist and thanksgiving</h3>\n<p>Mass continues. Receive Holy Communion if properly disposed and give thanks for the Gift of the Holy Spirit.</p>\n<h3>REHEARSE ONLY WHAT HELPS</h3>\n<p>Practise responses and movements without oil or imitation of sacramental actions. Ask early about mobility, hearing, anxiety or other support needs. The parish and confirming minister guide adaptations.</p>\n<h2>Readiness in faith and intention</h2>\n<p>Use Appendix G with the priest. These prompts guide a conversation rather than a pass or fail test. Finishing pages does not by itself establish readiness.</p>\n<h3>CATHOLIC FAITH</h3>\n<p>Can the adult profess the Creed sincerely and explain simply who the Holy Spirit is? Welcome questions and use the book to clarify difficult teaching.</p>\n<h3>SACRAMENTAL UNDERSTANDING</h3>\n<p>Can the person explain the relation of Baptism, Confirmation and Eucharist, and what Confirmation gives? Listen for grace, character and strength for witness.</p>\n<h3>THE RITE</h3>\n<p>Does the person understand the minister, chrism, sacramental words and Amen? Perfect memorisation of every ceremonial detail is unnecessary.</p>\n<h3>SINCERE INTENTION</h3>\n<p>Does the adult freely wish to receive Confirmation and renew baptismal promises? Family pressure, convenience or wedding plans cannot substitute for this.</p>\n<h3>LIVING FAITH</h3>\n<p>Is there a real willingness to live Catholic worship, moral teaching, prayer and charity, seeking grace and help where conversion is needed?</p>\n<h3>WHEN MORE HELP IS NEEDED</h3>\n<p>Name one point needing explanation or pastoral attention and agree the next step. Do not shame the person or rush a known difficulty to meet a proposed date.</p>\n<h2>Readiness in sacramental life</h2>\n<h3>RECORDS AND PATHWAY</h3>\n<p>The priest has checked Baptism, Catholic status, previous Confirmation or chrismation and any missing First Holy Communion.</p>\n<h3>PROPER DISPOSITION</h3>\n<p>The candidate understands the state of grace and has an opportunity for private Confession. A mentor does not ask what was confessed.</p>\n<h3>PASTORAL QUESTIONS</h3>\n<p>Marriage or other sacramental circumstances have been brought privately to the priest early and appropriately addressed.</p>\n<h3>MASS AND PRAYER</h3>\n<p>Sunday Mass and sustainable daily prayer are becoming part of life. A dramatic spiritual story is not required.</p>\n<h3>SPONSOR AND PRACTICAL SUPPORT</h3>\n<p>Suitable sponsor support is arranged where possible, with parish guidance. Access, language, disability and anxiety needs are considered.</p>\n<h3>CONTINUING DISCIPLESHIP</h3>\n<p>There is a realistic plan for Mass, prayer, Confession, learning and service after Confirmation, with a further mentor or sponsor meeting.</p>\n<p>The priest judges readiness following Church law, the approved rite and diocesan direction. The parish arranges the bishop or a priest with the required faculty. Disability or learning difference does not by itself prevent reception.</p>\n<h2>The Apostles’ Creed</h2>\n<p>Use for learning and prayer alongside Conversation 10. The approved rite supplies the actual questions and responses at the renewal of baptismal promises. I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.</p>\n<p>I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.</p>\n<h3>Pray with understanding</h3>\n<p>Pause where a phrase needs explanation. “He
