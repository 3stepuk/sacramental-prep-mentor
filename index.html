he child to name something they already love about Jesus and something they want to understand.</li><li>Write “Jesus calls me” beneath the name. Ask: “How could you answer him at home, at school and in church?”</li><li>Finish with the child’s own question or hope. Leave room for an answer that is still growing.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 1, especially grace, discipleship and the freedom of the child’s response.</p>\n<h2>God Calls Me to Follow Jesus</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What is the difference between following Jesus and only knowing facts about him?”</li><li>“What would help you follow him more closely?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why did God make you? To know, love and serve him, and to be happy with him for ever. Does God force faith? No. His grace helps us answer freely. Why do you want to become Catholic? Let the child give a sincere answer in their own words.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, thank you for calling me by name. Help me know you, love you and follow you freely. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each morning say: “Jesus, guide me today.” Choose one action that answers this prayer.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Listen for personal desire rather than a rehearsed answer. Hesitation can be discussed gently; never pressure the child into saying what adults want.</p>\n<h2>The One God Father Son and Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Give a clear understanding of one God in three divine Persons.</p>\n<h3>QUICK PREP</h3>\n<p>Three handwritten cards: FATHER, SON, HOLY SPIRIT.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Make the Sign of the Cross. Ask: “Whom did we name? How many Gods are there?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One God and three Persons</strong></p>\n<ol><li>Lay out the three cards. Ask whether the Father, the Son and the Holy Spirit are each truly God.</li><li>Ask: “Does this mean three gods?” Read the catechism’s answer before going further.</li><li>Write ONE GOD above the cards. Explain: each Person is wholly God; the Persons are distinct, not three parts of God.</li><li>Ask how the Sign of the Cross recalls the child’s Baptism. Make it again slowly.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 2. Use its wording about the one divine nature and Baptism in the name of the Trinity.</p>\n<h2>The One God Father Son and Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do we begin prayer in the name of the Father, Son and Holy Spirit?”</li><li>“What does it mean that you already belong to Christ through Baptism?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How many Gods are there? One God. Who is the Holy Trinity? Father, Son and Holy Spirit: three divine Persons in one God. Is each Person truly God? Yes. Each is truly and wholly God.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make the Sign of the Cross carefully each day, naming the three divine Persons.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The cards name the Persons; they do not explain God’s nature. Avoid analogies that suggest three gods, three parts or one Person wearing different disguises.</p>\n<h2>Creation Sin and the Promise of Salvation</h2>\n<h3>AIM</h3>\n<p>Connect God’s good creation, the reality of sin and his promise of a Saviour.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: GOOD, SIN, SAVIOUR.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What is something beautiful God made? Why do we also see things going wrong?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Goodness sin and mercy</strong></p>\n<ol><li>Under GOOD, name people and created things for which the child is grateful.</li><li>Under SIN, use invented examples of lying, cruelty and selfishness. Explain that human wrongdoing does not make God’s creation evil.</li><li>Place SAVIOUR beside them. Say: God did not abandon us; he promised and sent Jesus.</li><li>Ask: “If I have chosen something wrong, what does turning back to God look like?” Name sorrow, asking forgiveness and making amends.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 3. Distinguish original sin from a personal wrong choice. Baptism has already forgiven the child’s original sin.</p>\n<h2>Creation Sin and the Promise of Salvation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does God tell us the truth about sin?”</li><li>“Why does his mercy give us hope to begin again?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who created the world? God created it from nothing and made it good. What is personal sin? A deliberate thought, word, deed or omission against God’s law. Did God abandon us? No. He sent Jesus Christ our Saviour.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Merciful Father, you made me for goodness. Save me from sin and help me choose what is true and right. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Thank God for one good thing each day and choose one act of kindness.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not present original sin as something the child personally chose. Baptism forgives original sin, while weakness and temptation remain. Keep truth and mercy together.</p>\n<h2>Jesus Christ Our Saviour</h2>\n<h3>AIM</h3>\n<p>Help the child know Jesus as the divine Son made man who saves us by his Cross and Resurrection.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix and two cards: CROSS, RESURRECTION.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Show the crucifix. Ask: “If someone asked who this is, what would you tell them?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Who Jesus is and what he gives</strong></p>\n<ol><li>Let the child name a story they know about Jesus. If needed, remind them that he taught, healed and forgave sins.</li><li>Read the opening of Lesson 4: the eternal Son took a true human nature from Mary. Jesus is true God and true man.</li><li>Place CROSS beside the crucifix. Ask why Jesus freely gave his life for us.</li><li>Add RESURRECTION. Ask what happened on the third day and why Christians have hope.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 4. Keep Jesus’ identity, his saving sacrifice and his real bodily Resurrection together.</p>\n<h2>Jesus Christ Our Saviour</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Jesus more than a good teacher?”</li><li>“What difference does his Resurrection make to how we face death?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is Jesus Christ? The eternal Son of God made man. Is Jesus truly God and truly human? Yes. How did he redeem us? By his suffering, death and Resurrection.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus Christ, Son of the living God, have mercy on me and lead me to the Father. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Thank Jesus before a crucifix and tell someone why Christians celebrate Easter.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Let the child speak simply, but keep the teaching precise: Jesus is one divine Person with divine and human natures. His Resurrection was real, not merely a feeling of hope.</p>\n<h2>My Christian Baptism</h2>\n<h3>AIM</h3>\n<p>Honour the Baptism already received and explain why it is never repeated.</p>\n<h3>QUICK PREP</h3>\n<p>A cup of water. Optional: a baptismal photograph or details already known.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What do you know about your Baptism? What did God give you then?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A gift already received</strong></p>\n<ol><li>Place the cup of water on the table. Ask what ordinary water does: cleans, refreshes and supports life.</li><li>Read the effects of Baptism in Lesson 5: forgiveness, new life, adoption as God’s child and union with Christ.</li><li>Write “Baptism already received” on a card. Add “Valid Baptism is never repeated”.</li><li>Beside it write “Full communion”. Ask what the child is now preparing to receive and profess in the Catholic Church.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 5 and the note in Appendix A distinguishing a baptised candidate from a catechumen.</p>\n<h2>My Christian Baptism</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do we thank God for your Baptism?”</li><li>“If you are already Christian, what does full Catholic communion add to your life?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What did Baptism give you? Forgiveness of sin and new life in Christ. Can valid Baptism be repeated? No. It gives a permanent spiritual character. Are you baptised again at Reception? No.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, thank you for the grace of my Baptism. Help me live as your child and remain faithful to Jesus Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With an adult, find out one detail of your Baptism and thank God for it.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The priest establishes validity; the child is not asked to judge it. Be respectful towards the family and Christian community through whom this gift was received. Do not simulate Baptism.</p>\n<h2>Sacred Scripture Tradition and the Creed</h2>\n<h3>AIM</h3>\n<p>Show that Catholic faith receives the revelation God entrusted to his Church.</p>\n<h3>QUICK PREP</h3>\n<p>The catechism and three cards: SCRIPTURE, TRADITION, CREED.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “How can we know what Jesus taught when we were not there to hear him?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Receiving the faith</strong></p>\n<ol><li>Lay out SCRIPTURE. Explain that the Bible is God’s written word, inspired by the Holy Spirit.</li><li>Lay out TRADITION. Explain that the Apostles’ teaching is handed on in the Church’s life and teaching, not just in writing.</li><li>Place CREED below both. Read its opening from Appendix F and ask whom it tells us to believe in.</li><li>Ask: “Who helps the Church faithfully explain this received faith?” Introduce the Pope and bishops’ teaching office.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 6. Scripture and Sacred Tradition belong together in one deposit of faith.</p>\n<h2>Sacred Scripture Tradition and the Creed</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What is different about receiving God’s truth and inventing our own beliefs?”</li><li>“Which word in the Creed would you like explained?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is Sacred Scripture? God’s word written under the inspiration of the Holy Spirit. What is Sacred Tradition? The living transmission of God’s word from the Apostles. What is the Creed? A summary and profession of faith.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, help me receive God’s word with faith and understand what the Church teaches. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read one line of the Creed in Appendix F. Ask about any word you do not understand.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Welcome questions. Sacred Tradition is not simply every Catholic custom. The Magisterium serves God’s word; it does not invent a different revelation.</p>\n<h2>The Catholic Church and Full Communion</h2>\n<h3>AIM</h3>\n<p>Make full communion concrete while recognising the real Christian bond of Baptism.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: FAITH, SACRAMENTS, PASTORS.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Is the Church just this building? What brings Catholics together wherever they live?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Three bonds of communion</strong></p>\n<ol><li>Draw a church building, then add people: families, priests, bishops and the Pope. Explain that Jesus founded a living, visible Church.</li><li>Place FAITH beside it: we profess the Catholic faith together.</li><li>Add SACRAMENTS: we share the sacramental life Christ gives his Church. Add PASTORS: we live in communion with the Pope and bishops.</li><li>Ask where Baptism already belongs in this picture and what the child is seeking through Reception.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 7, especially the four marks of the Church and the three bonds of full communion.</p>\n<h2>The Catholic Church and Full Communion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What gifts of Christian faith have you already received?”</li><li>“What will living in full communion mean for you?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who founded the Church? Jesus Christ. What are her four marks? One, holy, catholic and apostolic. What does full communion include? Catholic faith, sacramental life and communion with the Pope and bishops.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, you prayed that your disciples might be one. Lead us into unity in truth, charity and full communion. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask an adult for the names of the Pope and our bishop. Pray for them and your parish priest.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Speak clearly about Catholic fullness without insulting other Christians. Baptism already creates a real bond with Christ. Listen for the child’s understanding of faith, Sacraments and pastoral communion.</p>\n<h2>Prayer Sunday Mass and Christian Life</h2>\n<h3>AIM</h3>\n<p>Help the child build a practical pattern of prayer, Sunday worship and charity.</p>\n<h3>QUICK PREP</h3>\n<p>Paper divided into MORNING, SUNDAY, HOME AND SCHOOL.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If faith matters to someone, what might we notice in an ordinary week?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A week with God</strong></p>\n<ol><li>Under MORNING, choose a short daily prayer, beginning with the Sign of the Cross.</li><li>Under SUNDAY, write the family’s plan for Mass. Ask what helps the child listen and pray there.</li><li>Under HOME AND SCHOOL, name a real opportunity for honesty, forgiveness or service.</li><li>Read the Our Father in Appendix F slowly. Choose one phrase and ask what it means.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 8. Explain that Sunday celebrates the Resurrection and Mass is central to Catholic life.</p>\n<h2>Prayer Sunday Mass and Christian Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What can you say to God when you feel grateful, worried or sorry?”</li><li>“Who can help you keep these habits?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is prayer? Lifting our minds and hearts to God. Why is Sunday holy? It is the Lord’s Day, celebrating Jesus’ Resurrection. How does faith become visible? Through worship and a life of love, truth and service.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, teach me to pray as your child. Help me love Sunday Mass and put my faith into practice. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use the prayer and Mass plan you made. Choose one act of kindness at home or school.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Support the family with a workable plan. Children depend on adults for transport and routines; do not blame a child for circumstances they cannot control. During preparation, attend Mass without receiving Communion until the priest directs otherwise.</p>\n<h2>The Commandments Sin and Conversion</h2>\n<h3>AIM</h3>\n<p>Form conscience by distinguishing accident, temptation and a freely chosen wrong.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: ACCIDENT, TEMPTATION, SIN.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Are dropping a cup by accident, wanting to throw it, and throwing it deliberately all the same?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What did the person choose</strong></p>\n<ol><li>Lay out the cards. Read three invented examples: a knocked-over cup; feeling like telling a lie but choosing truth; deliberately taking someone’s property.</li><li>Let the child place each example. Ask what the person knew and chose.</li><li>Read the three conditions for mortal sin in Lesson 9. All three must be present together.</li><li>Ask what conversion would mean after a wrong choice: sorrow, turning to God, making amends and learning to choose well.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 9. God’s commandments teach love; temptation is not itself sin.</p>\n<h2>The Commandments Sin and Conversion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do we need both an honest conscience and trust in God’s mercy?”</li><li>“How can a person repair harm without pretending the wrong never happened?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is temptation itself a sin? No. What is needed for mortal sin? Grave matter, full knowledge and deliberate consent. What is conversion? Turning away from sin and back to God.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, give me light to know what is right, courage to reject sin and trust in the mercy of Jesus. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each evening, thank God, think quietly about your choices, ask forgiveness and choose one way to do better.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Use invented examples, never a public account of the child’s sins. Something done to a child without their free choice is not their sin. Follow parish safeguarding procedures if a concern is disclosed.</p>\n<h2>Jesus Forgives Me in Confession</h2>\n<h3>AIM</h3>\n<p>Prepare calmly for a real, private First Confession before Reception.</p>\n<h3>QUICK PREP</h3>\n<p>Six cards: PREPARE, BEGIN, CONFESS, LISTEN, ABSOLUTION, THANKSGIVING.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When someone has done wrong, what helps them begin again?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Walk through the steps</strong></p>\n<ol><li>Use Appendix B to arrange the cards. Explain sorrow for sin and the intention to turn away from it.</li><li>Practise the opening: “Bless me, Father, for I have sinned. This is my first Confession.” Add that the child is preparing for Reception.</li><li>Use an invented example only, such as a fictional child deliberately lying. Practise speaking simply, listening and praying the Act of Contrition.</li><li>Explain absolution and penance without acting as the confessor. The real sacrament is celebrated privately with the priest.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 10 and Appendix B. Because the child is already baptised, First Confession comes before Reception.</p>\n<h2>Jesus Forgives Me in Confession</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Who forgives sins through the priest?”</li><li>“What could you do if you forget the words or feel nervous?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who forgives in Confession? Jesus Christ through the priest. What is contrition? Sorrow for sin with the intention to turn away from it. What is absolution? The sacramental forgiveness Christ gives through the priest.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Practise the opening and Act of Contrition. Examine your conscience privately using Appendix B.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Never ask for real sins during practice or afterwards. Explain that the priest will help. Make arrangements with him for First Confession before Reception; keep practical support separate from the child’s private confession.</p>\n<h2>The Holy Sacrifice of the Mass</h2>\n<h3>AIM</h3>\n<p>Connect the Mass with Christ’s one Sacrifice of Calvary.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix and cards: CALVARY, MASS, WORD, EUCHARIST.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “How many times did Jesus die? What does the Church celebrate at Mass?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One sacrifice made present</strong></p>\n<ol><li>Place CALVARY beside the crucifix. Explain that Jesus offered himself once for all.</li><li>Place MASS on the other side. Say: at Mass, that same sacrifice is made sacramentally present; Jesus does not suffer and die again.</li><li>Lay out WORD and EUCHARIST. Name what we hear and do in each principal part of Mass.</li><li>Ask the child to choose a person, a worry or an act of love to offer with Jesus at the next Mass.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 11 and Appendix E. Keep the sacrificial and Eucharistic meaning together.</p>\n<h2>The Holy Sacrifice of the Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Mass more than listening to a talk?”</li><li>“How can you join Jesus’ offering even before your First Holy Communion?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is made present at Mass? Christ’s one Sacrifice of Calvary. Does Jesus die again? No. What are the two principal parts? The Liturgy of the Word and the Liturgy of the Eucharist.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Eternal Father, I offer you my prayers, work, joys and sufferings in union with the Sacrifice of Jesus made present at Mass. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, listen to the Gospel and offer yourself with Jesus during the Eucharistic Prayer.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Use “made sacramentally present”. Do not describe Mass as merely remembering Calvary or as another death of Jesus. The child can participate through listening, prayer and offering before receiving Communion.</p>\n<h2>The Holy Eucharist and the Real Presence</h2>\n<h3>AIM</h3>\n<p>Help the child distinguish the Eucharist from ordinary food and believe Christ’s word.</p>\n<h3>QUICK PREP</h3>\n<p>An ordinary piece of bread in its packet, optional; the catechism.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Can our eyes tell us everything that is true? When do we trust someone’s word?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What we see and what Christ gives</strong></p>\n<ol><li>If using bread, name what the senses perceive: shape, colour, smell and taste. Keep it clearly ordinary food.</li><li>Put the bread away. Read Lesson 12 about Christ’s words at the Last Supper and the consecration.</li><li>Write “Appearances remain” and “Jesus truly present”. Explain that the whole substance changes into Christ’s Body and Blood.</li><li>Ask why Catholics adore the Blessed Sacrament and approach Communion reverently.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 12. Use its explanation of transubstantiation rather than inventing a comparison for the change.</p>\n<h2>The Holy Eucharist and the Real Presence</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is a consecrated Host different from ordinary bread?”</li><li>“What would show that we believe Jesus is present in the tabernacle?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is present in the Eucharist? Jesus Christ, Body, Blood, Soul and Divinity. What remains after consecration? The appearances of bread and wine. Is the Eucharist merely a symbol? No. Jesus is truly, really and substantially present.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, I believe that you are truly present in the Holy Eucharist. Increase my faith, hope and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make a short visit to the tabernacle with an adult and say: “My Lord and my God.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>This is a central readiness point. Listen for belief in Jesus’ real presence, beyond “special bread”. Ordinary food must never be presented as the Blessed Sacrament or used to imitate a consecration.</p>\n<h2>The Profession of Faith and Reception</h2>\n<h3>AIM</h3>\n<p>Help the child understand and freely make the Catholic Profession of Faith.</p>\n<h3>QUICK PREP</h3>\n<p>Appendix C and three cards: PROFESSION, RECEPTION, FULL COMMUNION.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What is the difference between reading words aloud and meaning what you say?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Words I can sincerely mean</strong></p>\n<ol><li>Read the Profession of Faith from Appendix C slowly. Ask which words need explaining.</li><li>Explain “believe and profess”: I accept this faith and say so openly. “Revealed by God” means the truth God has made known.</li><li>Place the cards in order. Explain that after the profession the priest receives the child into full communion. No Baptism is repeated.</li><li>Let the child explain the profession in their own words, then practise saying it calmly and freely.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 13 and Appendix C. The approved rite supplies the actual words and actions of the celebration.</p>\n<h2>The Profession of Faith and Reception</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Can you accept the Catholic faith while still having questions?”</li><li>“What are you saying yes to when you make this profession?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Are you baptised again? No. What do you profess? All that the Catholic Church believes, teaches and proclaims to be revealed by God. Must you understand every mystery perfectly? No. You must sincerely accept the faith and keep learning.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, keep me faithful to the truth you revealed. Unite me fully to your Church in faith, Sacraments and charity. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read the profession with an adult and bring any remaining question to the priest.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Check meaning before memorisation. Do not turn the profession into a performance. If the child cannot freely and sincerely accept it, continue conversation and seek the priest’s guidance.</p>\n<h2>Confirmation and the Gift of the Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Connect Confirmation with baptismal grace, the Holy Spirit’s gifts and Christian witness.</p>\n<h3>QUICK PREP</h3>\n<p>Seven handwritten gift cards using the names below. No oil is needed.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When is it hard to do what is right? What help do we need from God?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Gifts for following Christ</strong></p>\n<ol><li>Read the gifts in Appendix D: wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</li><li>Choose two everyday situations: resisting unkindness and deciding whether to tell the truth. Ask which gifts could help.</li><li>Read how hands are laid and the forehead is anointed with sacred chrism. These signs belong to the real sacrament.</li><li>Practise “Amen” as a response to receiving the Gift of the Holy Spirit. Ask how the child can bear witness to Jesus.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 14 and Appendix D. Confirmation strengthens baptismal grace and gives a permanent seal.</p>\n<h2>Confirmation and the Gift of the Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Confirmation a gift for living faithfully, rather than a reward for finishing lessons?”</li><li>“Where could you ask for fortitude this week?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What does Confirmation do? Strengthens baptismal grace through a special outpouring of the Holy Spirit. Can it be repeated? No. It gives a permanent spiritual seal. Why are we strengthened? To live and bear witness to Christ.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit, fill my heart with your grace. Strengthen me to know, love, defend and live the Catholic faith. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one gift and ask the Holy Spirit to help you use it in a real situation.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Confirmation ordinarily follows Reception when not already validly received. Do not postpone it simply to follow an annual group timetable. The priest resolves previous Confirmation or Eastern chrismation and directs the correct celebration.</p>\n<h2>Receiving First Holy Communion</h2>\n<h3>AIM</h3>\n<p>Prepare both the child’s faith and the practical manner of receiving reverently.</p>\n<h3>QUICK PREP</h3>\n<p>Space for a short procession and Appendix E. No food or practice host is necessary.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When you hear ‘The Body of Christ’ and answer ‘Amen’, what do you believe?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Reverence and thanksgiving</strong></p>\n<ol><li>Practise walking calmly, approaching reverently and answering “Amen”. Follow the approved parish manner of receiving.</li><li>Explain that the Sacred Host is consumed immediately. Rehearse the movement without pretending ordinary food is the Eucharist.</li><li>Use a clock to work out one hour before the expected time of Communion, rather than before Mass begins. Water and medicine do not break the fast.</li><li>Practise returning quietly to pray: thank Jesus, offer yourself to him and pray for another person.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 15 and Appendix E. Review the state of grace, the fast, immediate consumption and thanksgiving.</p>\n<h2>Receiving First Holy Communion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How can you prepare your heart as well as your movements?”</li><li>“What should you do if you are unsure whether to receive?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Whom do you receive? Jesus Christ, Body, Blood, Soul and Divinity. What does Amen mean here? I believe that this is the Body of Christ. How long is the fast? One hour before Communion, except water and medicine.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Lord Jesus. Prepare my heart to receive you with faith, reverence and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With an adult, plan the fast and use this thanksgiving: “Thank you, Jesus. Help me love you and live faithfully.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Anyone conscious of mortal sin should seek sacramental absolution before Communion. Refer concerns about illness, swallowing, gluten or other adaptations to the priest. The ordinary celebration places Reception and Confirmation before Communion.</p>\n<h2>Living in Full Communion</h2>\n<h3>AIM</h3>\n<p>Make Reception the beginning of a continuing Catholic life.</p>\n<h3>QUICK PREP</h3>\n<p>A weekly calendar or paper and cards: MASS, PRAYER, CONFESSION, CHARITY, LEARNING.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Six months after Reception, what would show that being Catholic is part of your life?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A simple rule of life</strong></p>\n<ol><li>Lay out the five cards. Ask what each could mean in an ordinary week or month.</li><li>Choose manageable habits: Sunday Mass, daily prayer, regular Confession, one act of charity and continued learning.</li><li>Write who will help with each habit. Include the family, sponsor, mentor and parish where appropriate.</li><li>Arrange a later conversation about the sacraments received and the child’s questions. Explain that this continuing reflection is called mystagogy.</li></ol>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 16 and Appendix H. Formation and accompaniment continue after the celebration.</p>\n<h2>Living in Full Communion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Which habit will be easiest? Which will need help?”</li><li>“How could you share your faith kindly at home or school?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is Reception the end of formation? No. Catholic life and learning continue. What stays at the centre? Sunday Mass and worthy Holy Communion. How do we bear witness? By truth, holiness, charity, service and sharing the faith.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, keep me faithful to your Catholic Church. Help me worship you, receive the Sacraments worthily and serve you throughout my life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Begin the simple rule of life now. Ask an adult to help you keep it after Reception.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Make continuing support concrete. Confirmation has strengthened the child for mission; it is not a future course to be added to this ordinary pathway. Keep space for questions, repentance and fresh beginnings.</p>\n<h2>The journey at a glance</h2>\n<p>Use this as an overview, not a timetable. Preparation recognises Christian life already begun in Baptism.</p>\n<h3>Enquiry and Baptism established</h3>\n<p>Meet the priest. Confirm valid Baptism, sacramental history and the correct pathway.</p>\n<h3>Formation and parish belonging</h3>\n<p>Grow in Catholic faith, prayer, conversion and participation at Sunday Mass.</p>\n<h3>Discernment of readiness</h3>\n<p>Child, family, sponsor, mentor and priest consider free desire and understanding according to capacity.</p>\n<h3>First Confession</h3>\n<p>The already baptised child receives the Sacrament of Penance before Reception, as arranged with the priest.</p>\n<h3>Profession of Faith and Reception</h3>\n<p>The child freely professes the Catholic faith and is received into full communion.</p>\n<h3>Confirmation and Holy Communion</h3>\n<p>Confirmation, if not already validly received, and First Holy Communion ordinarily follow within the same Mass.</p>\n<h3>Mystagogy and continuing life</h3>\n<p>Reflect on the sacraments received and continue Mass, prayer, Confession, charity and formation.</p>\n<h3>A BAPTISED CANDIDATE</h3>\n<p>This child is not a catechumen. Do not add the rites proper to the unbaptised or repeat valid Baptism. The priest directs any particular circumstances.</p>\n<h2>Readiness in faith and freedom</h2>\n<p>Readiness is more than finishing pages. Use these prompts for a calm conversation, with understanding adapted to the child’s capacity.</p>\n<h3>FREE DESIRE</h3>\n<p>The child personally wishes to become Catholic and can speak simply about why, without pressure.</p>\n<h3>FAITH IN CHRIST</h3>\n<p>The child knows Jesus as true God, true man and Saviour, who died and rose again.</p>\n<h3>CATHOLIC FAITH</h3>\n<p>The child accepts the Trinity, Scripture and Tradition, the Creed, the Church and the moral life according to capacity.</p>\n<h3>BAPTISM AND FULL COMMUNION</h3>\n<p>The child knows Baptism is already received and understands that Reception brings full communion in Catholic faith, Sacraments and pastoral life.</p>\n<h3>PROFESSION OF FAITH</h3>\n<p>The child understands what is being professed and can make the profession freely and sincerely.</p>\n<h3>If something needs more time</h3>\n<p>Return to the relevant lesson, welcome the child’s question and discuss it with the priest. Do not turn these points into marks, a public test or a demand for perfect memory.</p>\n<h2>Readiness in sacramental life</h2>\n<h3>CONFESSION</h3>\n<p>The child understands sin, contrition, private confession and absolution, and can approach the priest with suitable support.</p>\n<h3>CONFIRMATION</h3>\n<p>The child understands that the Holy Spirit strengthens baptismal grace for Christian witness and knows the meaning of chrism and the seal.</p>\n<h3>THE EUCHARIST</h3>\n<p>The child distinguishes the Body of Christ from ordinary food and believes Jesus is truly present.</p>\n<h3>SUNDAY LIFE</h3>\n<p>The child and family are developing regular Sunday Mass, prayer and parish belonging.</p>\n<h3>PRACTICAL PARTICIPATION</h3>\n<p>The child can profess faith and receive reverently, with any necessary language, medical or accessibility adaptations.</p>\n<h3>CONTINUING SUPPORT</h3>\n<p>The family and sponsor will help with Mass, prayer, Confession, charity and learning after Reception.</p>\n<p>Final sacramental and canonical discernment belongs to the priest. Use Appendix H of the catechism for the parish working checklist.</p>\n<h2>Final word for the adult alongside</h2>\n<p>The best conversations will not all look the same. Sometimes an activity will help; sometimes one clear sentence and an honest question will be enough. Give the child time to speak and time to grow.</p>\n<h3>KEEP THE ORDER SIMPLE</h3>\n<p>Begin with the person. Use the activity to open the conversation. Read the catechism for the teaching. Talk, pray and choose one next step.</p>\n<h3>DO NOT RUSH</h3>\n<p>Free desire, faith, understanding, conversion, Sunday worship and belonging matter more than reaching a date. Preparation can be repeated or adapted.</p>\n<h3>KEEP CHRIST AT THE CENTRE</h3>\n<p>Help the child grow in friendship with Jesus, receive the Catholic faith freely and live from his Sacraments. Family, sponsor, mentor and parish continue to accompany them.</p>\n<h3>Keep the two pathways clear</h3>\n<p>An unbaptised child prepares for Baptism. This child has already received valid Baptism and prepares for First Confession, Reception, Confirmation and Holy Communion. Honour the grace already given.</p>\n<h2>References for the priest and mentor</h2>\n<p>The lesson order and doctrinal teaching follow Coming into the Catholic Church A Preparation Catechism for Baptised Children. Use its appendices alongside the activities.</p>\n<h3>Appendix A</h3>\n<p>The journey and the distinction between candidates and catechumens.</p>\n<h3>Appendix B</h3>\n<p>First Confession, examination of conscience and privacy.</p>\n<h3>Appendices C and D</h3>\n<p>Profession of Faith, Reception and Confirmation.</p>\n<h3>Appendices E and F</h3>\n<p>Mass, Holy Communion, the Creed and prayers.</p>\n<h3>Appendices G and H</h3>\n<p>Summary catechism, readiness and parish arrangements.</p>\n<h3>Church sources</h3>\n<p>Catechism of the Catholic Church, especially 811–870, 1213–1284, 1285–1321, 1322–1419 and 1422–1498.</p>\n<p>Code of Canon Law, canons 883–885 on Confirmation; 916 and 919 on preparation for Holy Communion.</p>\n<p>Rite of Christian Initiation of Adults, Reception of Baptised Christians into the Full Communion of the Catholic Church, especially introductory paragraphs 391, 394 and 395 in the England and Wales edition.</p>\n<p>The approved liturgical books, current diocesan direction and the parish priest govern the actual celebration. This activity guide supplies conversation and practical preparation; it does not supply a substitute rite.</p>\n<p>Primary texts: vatican.va and liturgyoffice.org.uk/Resources/Rites/RCIA.pdf</p>"}, {"name": "First Confession", "url": "https://3stepuk.github.io/My-First-Confession/", "desc": "For children preparing for their first Confession.", "html": "<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>The existing catechism contains the teaching. This companion gives you simple activities, demonstrations, role-play, questions and prayer so the teaching feels personal and memorable.</p>\n<h2>The basic rhythm</h2>\n<ul><li>Begin with the child, not the page.</li><li>Do one simple activity.</li><li>Open the catechism and read only what helps.</li><li>Talk. Let the child answer before you explain.</li><li>Check that the essential Catholic truth has landed.</li><li>Pray and stop.</li></ul>\n<h3>USE ONE ACTIVITY, NOT EVERYTHING</h3>\n<p>If the child is engaged and the main point is understood, stop. A good ten or fifteen minutes is better than a long formal lesson.</p>\n<p>Keep the catechism open beside this companion. The catechism remains the doctrinal foundation; this book simply gives you ways to enter the teaching through ordinary life.</p>\n<h3>A SIMPLE SIX-STEP RHYTHM</h3>\n<p>1 Welcome - begin with something real. 2 Activity - use an object, movement or imagined situation. 3 Catechism - read the relevant teaching. 4 Conversation - ask and wait. 5 Check - make sure the main truth is understood. 6 Prayer - end simply and positively.</p>\n<h3>A few boundaries</h3>\n<ul><li>Use invented examples when talking about sin. Never ask the child to disclose personal sins.</li><li>Do not turn the catechism answers into an oral examination.</li><li>Do not compare children or push the pace because someone else is further ahead.</li><li>If a safeguarding disclosure is made outside Confession, follow diocesan safeguarding procedure.</li></ul>\n<h3>LESSON 1</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Begin from belonging: God made me, knows me and calls me to live with him.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Tell me one thing you enjoy, one person you love and one thing you are good at.” Then ask: “Do you think God already knows all of that?”</p>\n<h3>DO SOMETHING</h3>\n<p>Look at your hands together. Notice that no two people are exactly the same. Say: “God did not make a copy. He made you.” Then ask what it would mean if God stopped loving us every time we did something wrong.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 1, especially the REMEMBER line and the paragraph about God knowing us completely yet calling us back when we do wrong.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>If God already knows everything, why can we be honest with him?</li><li>What is the difference between feeling bad and knowing a choice was wrong?</li><li>How do we learn what is good?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Who made you?</li><li>Why did God make you?</li><li>What is conscience?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Ask the child to “teach back” the lesson in one sentence: “God made me, loves me and calls me back when I do wrong.”</p>\n<h3>PRAY</h3>\n<p>Father in heaven, thank you for making me and loving me. Help me to know what is good and choose it freely. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this lesson warm. Confession starts from the truth that the child belongs to God and is loved. Do not make wrongdoing the first thing the child associates with the sacrament.</p>\n<h3>LESSON 2</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Place Confession inside the larger story of Jesus saving us through his Cross and Resurrection.</p>\n<h3>QUICK PREP:</h3>\n<p>A crucifix, if one is nearby.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Point to the crucifix and ask: “What do you notice first? What does the Cross tell us about how much Jesus wants us close to God?”</p>\n<h3>DO SOMETHING</h3>\n<p>Stand a few steps away from the crucifix. Turn away and say: “Sin turns us away from God.” Then turn back and walk towards it: “Jesus opens the way home.” Let the child do the movement and explain it back to you.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 2. Pause at the sentences about Jesus conquering sin and death and about coming to the Saviour who already knows us.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why did Jesus die for us?</li><li>What does the Resurrection tell us about sin and death?</li><li>Who are we meeting in Confession: a stranger, or the Saviour who gave himself for us?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Who is Jesus Christ?</li><li>Why did Jesus die on the Cross?</li><li>Why can we hope for forgiveness?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Look at a crucifix in silence for twenty seconds. Ask the child to choose one word that describes Jesus’ love.</p>\n<h3>PRAY</h3>\n<p>Jesus, my Saviour, you loved me and gave yourself for me. Help me to trust your mercy and turn away from sin. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not make Confession sound like a system for dealing with bad behaviour. The centre is Christ: Cross, Resurrection, mercy and return.</p>\n<h3>LESSON 3</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Show that Baptism truly gives new life and that Confession restores and strengthens the life of grace.</p>\n<h3>QUICK PREP:</h3>\n<p>A little water in a glass or bowl.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Do you know where you were baptised? Have you seen a photo or heard the story?”</p>\n<h3>DO SOMETHING</h3>\n<p>Show the water. Ask: “Can ordinary water make someone God’s child by itself?” Explain that Christ uses water and the words of Baptism as a sacramental sign through which he really gives new life and grace.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 3, especially the sections on Baptism, sanctifying grace and the way Penance restores grace when it has been lost.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>What changed at Baptism even though the baby looked the same afterwards?</li><li>What is a gift you did not earn? How is grace a gift?</li><li>Why might a baptised person still need Confession?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is Baptism?</li><li>What is grace?</li><li>What does Penance restore when grave sin has destroyed charity?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Find the child’s Baptism date or church and make a plan to thank God for Baptism on that anniversary.</p>\n<h3>PRAY</h3>\n<p>Holy Spirit, live in me and help me remember that I belong to Christ. Strengthen me to choose what is good. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep “grace” simple and Catholic: God’s free gift of his life and help. The point is not to explain every theological distinction at once.</p>\n<h3>LESSON 4</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child see God’s commandments as a way of protecting love, truth, worship, family and human dignity.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What rules keep people safe?” Think of roads, school, sport or home. Ask what would happen if everyone ignored them.</p>\n<h3>DO SOMETHING</h3>\n<p>Play “help or harm”. Say an invented choice and let the child show thumbs-up if it protects love or a flat hand if it harms: telling the truth, joining in teasing, helping at home, cheating, forgiving, stealing, praying. Always ask “Why?”</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 4 and the two great commandments. Let the child find the line that says love is more than a feeling.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why are God’s commandments not traps?</li><li>Can loving someone sometimes mean saying “no”?</li><li>What is the difference between being nice and choosing what is truly good?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Why did God give the commandments?</li><li>What are the two great commandments?</li><li>Is love only a feeling?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Ask the child to invent one “help or harm” example for you to answer.</p>\n<h3>PRAY</h3>\n<p>Lord Jesus, teach me to love as you love. Help me to obey God, speak the truth, forgive and choose what is good. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Praise the reasoning, not only the right answer. The goal is a conscience shaped by truth and love, not a child who merely guesses what the adult wants.</p>\n<h3>LESSON 5</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child distinguish accident, temptation, mistake and freely chosen sin, then introduce mortal and venial sin clearly.</p>\n<h3>QUICK PREP:</h3>\n<p>A plastic cup or another harmless object.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Put the cup nearby. Say: “Three children are near this cup. One knocks it over by accident. One wants to smash it but chooses not to. One deliberately throws it down in anger. Are those the same?”</p>\n<h3>DO SOMETHING</h3>\n<p>Act out the three situations very simply. After each ask: “Was there a free choice? Did the person know what they were doing?” Then invite the child to invent another harmless example.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Now read Lesson 5. The activity gives the child a picture for the formal definitions. Read the three conditions for mortal sin slowly and plainly.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Is temptation already a sin?</li><li>Why does freedom matter?</li><li>Why are accident and deliberate choice different?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is sin?</li><li>Is temptation itself a sin?</li><li>What three things must all be present for mortal sin?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Give four quick examples and let the child label them: accident, temptation, mistake or deliberate choice.</p>\n<h3>PRAY</h3>\n<p>Jesus, give me light to know what is wrong, courage to refuse temptation and trust in you when I have sinned. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Use invented examples only. Do not ask for the child’s real sins. Keep the distinction peaceful and precise: God sees the truth of the heart, including knowledge and freedom.</p>\n<h3>LESSON 6</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Make conversion visible as turning away from sin and returning to the Father with hope.</p>\n<h3>QUICK PREP:</h3>\n<p>Two chairs, if convenient.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Have you ever taken a wrong turning and had to turn around?” Let the child tell a simple story.</p>\n<h3>DO SOMETHING</h3>\n<p>Put two chairs a few steps apart. Call one “away” and one “home”. Retell the lost son briefly while moving from one to the other: he recognised the truth, turned, returned, and the father came to meet him. Let the child repeat the movement in their own words.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 6 and the “Talk About It” question about the father running to meet the son.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why did the father run to meet his son?</li><li>Does mercy mean the wrong thing did not matter?</li><li>What does conversion actually mean?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is conversion?</li><li>Who gives us grace to repent?</li><li>Should shame make us hide from God?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Read or listen to Luke 15:11-32 and ask the child which moment in the story they remember most.</p>\n<h3>PRAY</h3>\n<p>Father of mercy, when I have wandered from you, help me to return quickly. Give me a humble and trusting heart. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the story about real conversion as well as welcome. Mercy does not call evil good; mercy heals and restores the sinner who returns.</p>\n<h3>LESSON 7</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child understand that Christ forgives through the ministry he entrusted to bishops and priests.</p>\n<h3>QUICK PREP</h3>\n<p>Four scraps of paper are helpful but not necessary.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “In Confession you can see and hear the priest. So who is really forgiving you?” Listen first.</p>\n<h3>DO SOMETHING</h3>\n<p>Make a simple chain: JESUS -&gt; APOSTLES -&gt; BISHOPS &amp; PRIESTS -&gt; CHURCH TODAY. Let the child arrange the words or repeat the four steps using fingers. Explain that Christ remains the one who forgives.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 7, especially John 20:19-23 and the sentence “Christ himself acts through the priest.”</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why can a priest forgive sins if only God forgives?</li><li>What authority did Jesus give the Apostles?</li><li>Why is the seal of Confession important?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Who instituted Penance?</li><li>To whom did Jesus first give authority to forgive sins?</li><li>Who forgives in the sacrament?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Ask the child to draw four arrows: Jesus -&gt; Apostles -&gt; bishops/priests -&gt; us today.</p>\n<h3>PRAY</h3>\n<p>Risen Lord Jesus, thank you for giving your Church the ministry of forgiveness. Help me to receive this sacrament with faith and honesty. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not role-play sacramental absolution as a game. Explain the authority Christ gave, but keep the sacramental formula itself reverent and for the actual celebration.</p>\n<h3>LESSON 8</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child recognise real sorrow for sin and a sincere intention to change with God’s grace.</p>\n<h3>QUICK PREP</h3>\n<p>Nothing needed.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Say: “I’m sorry I did it” and then “I’m sorry I got caught.” Ask: “Are those the same kind of sorry?”</p>\n<h3>DO SOMETHING</h3>\n<p>Use an invented situation: someone lies about homework. Build a three-step change plan together: admit the wrong; ask forgiveness; choose one practical way to avoid repeating it.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 8. Let the child explain the difference between contrition and embarrassment about consequences.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Can someone be sorry only because they are embarrassed?</li><li>Does a firm purpose mean promising never to fail again?</li><li>How can a practical change make a good intention stronger?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is contrition?</li><li>What is a firm purpose of amendment?</li><li>Must we be certain we will never sin again?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Ask the child to invent a harmless situation and create a three-step change plan for it.</p>\n<h3>PRAY</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Aim for sincerity, not impossible promises. “I truly intend to change with God’s grace” is the point.</p>\n<h3>LESSON 9</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Teach examination of conscience as a short prayerful search for truth with the Holy Spirit.</p>\n<h3>QUICK PREP:</h3>\n<p>A phone torch or lamp, if available.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Shine the torch on a dark corner or under a table. Ask: “What does light help us do?” Then say: “We ask the Holy Spirit for light so we can see our choices truthfully.”</p>\n<h3>DO SOMETHING</h3>\n<p>Have sixty seconds of quiet. Name only broad areas: God; home; duties; kindness; truth; self-control. Do not ask what sins the child remembers. Afterwards ask: “Did the headings make it easier to think?”</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 9 and then look at Appendix A. Explain that the questions are helps, not a list of things every child has done.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why do we pray before examining our conscience?</li><li>Do we need a perfect memory?</li><li>What should we do if we honestly forget a sin?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is an examination of conscience?</li><li>What guides our examination?</li><li>What if a sin is honestly forgotten?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Let the child choose five headings for a very simple examination of conscience and remember them on five fingers.</p>\n<h3>PRAY</h3>\n<p>Come, Holy Spirit. Give me light to know my sins, sorrow to repent, honesty to confess and strength to amend my life. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The adult must not turn the examination into an interview. Do not ask, “Which of these have you done?” Actual sins belong in sacramental Confession.</p>\n<h3>LESSON 10</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Give practical familiarity with the shape of Confession without rehearsing real sins.</p>\n<h3>QUICK PREP:</h3>\n<p>Two chairs. Use invented examples only.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If you forgot every word when you sat down with the priest, what could you say?” Aim for: “Father, this is my first Confession and I need some help.”</p>\n<h3>DO SOMETHING</h3>\n<p>Practise the sequence with invented sins: Sign of the Cross -&gt; “This is my first Confession” -&gt; invented sins -&gt; listen -&gt; penance -&gt; Act of Contrition -&gt; receive absolution in the real sacrament -&gt; “Amen”. The adult should not imitate the words of sacramental absolution.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 10 and Appendix B. Let the child point to the steps instead of trying to memorise everything.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>What can you do if you forget what comes next?</li><li>Why should we confess simply rather than tell long stories?</li><li>What do we answer after absolution?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>How should we confess?</li><li>What do we do after telling our sins?</li><li>What is absolution?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Swap roles and let the child be the “guide” who tells you the next step, without pretending to absolve.</p>\n<h3>PRAY</h3>\n<p>Jesus, give me courage to speak the truth and humility to receive your forgiveness with gratitude. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Practise procedure, never content. The goal is calm familiarity. The priest will guide the child.</p>\n<h3>LESSON 11</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Show that forgiveness is real and that penance and reasonable repair belong to our response to mercy.</p>\n<h3>QUICK PREP:</h3>\n<p>Nothing needed. Optional: a book or toy for the example.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If I spill a drink over your book and say sorry, is there anything else I should do?” Let the child suggest cleaning, drying or repairing it.</p>\n<h3>DO SOMETHING</h3>\n<p>Use the broken-toy example from the catechism. Say three words and let the child explain them: FORGIVEN - PENANCE - REPAIR. Try two invented situations: taking something; telling a lie. Ask what reasonable repair might look like.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 11. Emphasise that penance and satisfaction do not buy forgiveness; they are part of responding to mercy.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Does repairing harm mean God has not really forgiven us?</li><li>Why does the priest give a penance?</li><li>When should we do our penance?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What happens in absolution?</li><li>What is satisfaction?</li><li>What if we have harmed another person?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Give one invented situation and ask for three responses: ask forgiveness, do penance, repair what can reasonably be repaired.</p>\n<h3>PRAY</h3>\n<p>Merciful Father, thank you for forgiving me. Help me to do my penance, repair the harm I have caused and walk in newness of life. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Not every harm can or should be repaired directly. Keep the catechism’s phrase “as far as reasonably possible”; the priest can advise in difficult cases.</p>\n<h3>LESSON 12</h3>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child see First Confession as the beginning of a lifelong Catholic habit, not a graduation.</p>\n<h3>QUICK PREP</h3>\n<p>Use your hand - no materials needed.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “After First Confession, is Confession finished forever?” Then ask why Catholics return to the sacrament.</p>\n<h3>DO SOMETHING</h3>\n<p>Use five fingers to make a simple Catholic rhythm: Sunday Mass; daily prayer; Scripture; charity; turning back to God. Add Confession as Christ’s sacrament of forgiveness and strengthening. Let the child choose one realistic habit for this week.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 12. Connect Confession with ordinary Catholic life and with preparation for First Holy Communion.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why do Catholics go to Confession again?</li><li>What can we do when temptation begins?</li><li>How does being forgiven help us forgive others?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Why receive Penance regularly?</li><li>What ordinary practices help us grow?</li><li>What should we do when temptation begins?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Let the child make a simple five-finger rule of life and choose one finger to practise especially this week.</p>\n<h3>PRAY</h3>\n<p>Lord Jesus, keep me close to you. Help me to love what is good, return quickly when I fall and forgive others as you forgive me. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Finish with hope. The destination is not “I completed the course” but “I know how to return to Christ throughout my life.” You do not need crafts, worksheets or a cupboard of resources. These few ordinary items can make almost every lesson more concrete:</p>\n<h3>ITEM USE</h3>\n<p><strong>Crucifix Cross, salvation, conversion</strong></p>\n<p><strong>Plastic cup Accident, temptation and deliberate choice</strong></p>\n<p><strong>Small bowl or glass of water Baptism and grace</strong></p>\n<p><strong>Phone torch Examination of conscience</strong></p>\n<p><strong>Two chairs Conversion and Confession rehearsal</strong></p>\n<p><strong>Paper and pencil Authority chain, change plans, repair</strong></p>\n<p><strong>Bible / catechism Scripture and the doctrinal foundation</strong></p>\n<h3>Three activities you can reuse anywhere</h3>\n<ul><li>CHOICE STORY - Give an invented situation and ask what happened, whether it was free, and what love requires now.</li><li>SHOW ME - Let the child point, move, arrange, choose or explain rather than only listen.</li><li>TEACH IT BACK - Say: “Explain that to me as if I had never heard it before.”</li></ul>\n<h3>KEEP IT SIMPLE</h3>\n<p>One good activity is enough. If the child is talking, thinking and understanding, stop there. You are not looking for perfect wording. Across the preparation, look for growing signs that the child understands and can participate according to their capacity.</p>\n<h3>GOD AND MERCY</h3>\n<p>The child knows God loves us, sin is real and Jesus offers forgiveness.</p>\n<h3>MORAL UNDERSTANDING</h3>\n<p>The child can usually distinguish deliberate wrong from accident, temptation and lack of freedom.</p>\n<h3>SACRAMENTAL UNDERSTANDING</h3>\n<p>The child knows sins are confessed to a priest and Christ forgives through sacramental absolution.</p>\n<h3>PRACTICAL CONFIDENCE</h3>\n<p>The child can follow the simple shape of Confession and ask for help if needed.</p>\n<h3>CATHOLIC LIFE</h3>\n<p>The child sees Sunday Mass, prayer, charity and the sacraments as belonging together.</p>\n<h3>Non-negotiable boundaries</h3>\n<ul><li>Never ask the child to disclose personal sins to a parent, mentor or group.</li><li>Use invented examples for rehearsal and activities.</li><li>Do not compare children or turn readiness into a public test.</li><li>If a child discloses harm outside Confession, follow diocesan safeguarding procedures.</li><li>Final pastoral judgement about readiness belongs to the parish priest.</li></ul>\n<h3>THE GOAL</h3>\n<p>A child who can say, in simple words: “I know God loves me. I know what sin is. I know Jesus forgives me in Confession. I know what to do, and I want to receive his mercy.”</p>\n<p>Use alongside My First Confession Catechism and the parish resources at</p>"}, {"name": "First Holy Communion", "url": "https://3stepuk.github.io/First-Holy-Communion/", "desc": "For children preparing to receive the Eucharist.", "html": "<p>For children preparing to receive Jesus in the Holy Eucharist</p>\n<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>Use My First Holy Communion Catechism for the Catholic teaching. Use this companion to make the teaching personal, active and memorable.</p>\n<p>It is written for parents, parish mentors and priests working alongside children of roughly seven to nine years of age.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the child</li><li>Do something concrete</li><li>Open the catechism</li><li>Talk together</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<p>The catechism gives the doctrinal spine. This companion helps the teaching become personal, active and memorable.</p>\n<h3>FIRST HOLY COMMUNION · GUIDE</h3>\n<h2>How to use this companion</h2>\n<p>A simple method for parents, mentors and priests</p>\n<h3>MENTOR, NOT LECTURER</h3>\n<p>The child should speak before you explain. Ask what they think, listen carefully, then use the catechism to clarify and deepen. You do not need to fill every silence.</p>\n<h3>A NORMAL MEETING</h3>\n<ul><li>1. Begin naturally: “What did you notice at Mass?” “What do you already think this means?”</li><li>2. Use the opening activity or object prompt from this companion.</li><li>3. Open the matching lesson in My First Holy Communion Catechism and read only as much as is useful.</li><li>4. Ask the child to explain the central truth back in their own words.</li><li>5. Use one optional activity or practice step if it helps; skip it if the conversation is already good.</li><li>6. Finish with the prayer and one simple action for the week.</li></ul>\n<h3>KEEP IT SIMPLE AND REVERENT</h3>\n<p>Do not insist on completing every activity. Do not turn the catechism answers into a public test. Do not use consecrated hosts or imitate the words of consecration in play. If a genuine question opens up, follow it and return to the lesson afterwards.</p>\n<p>Most activities need only the catechism, a Bible, a pen and paper, or ordinary objects already nearby. Nothing needs elaborate preparation.</p>\n<h3>FIRST HOLY COMMUNION · GUIDE</h3>\n<h2>Quick activity toolkit</h2>\n<p>Use these anywhere in the twelve lessons</p>\n<h3>OBJECT PROMPT</h3>\n<p>Use one ordinary object - food, a candle, a Bible, a gift bag, a clock - to open a question before reading the catechism.</p>\n<h3>SORT IT</h3>\n<p>Write words or situations on scraps of paper and sort them into two or three groups. Ask the child to explain each choice.</p>\n<h3>MASS MAP</h3>\n<p>Use the actual church or a simple sketch to find the altar, ambo, tabernacle, sanctuary lamp and the main parts of the Mass.</p>\n<h3>SCRIPTURE SPOTLIGHT</h3>\n<p>Read only the verses needed. Ask: What happened? What did Jesus say? What does this show us about the Eucharist?</p>\n<h3>PRACTISE IT</h3>\n<p>Rehearse a real Catholic action: genuflecting, answering “Amen”, following the Communion procession or praying thanksgiving.</p>\n<h3>ONE REAL NEXT STEP</h3>\n<p>End by choosing one small action for Sunday Mass or family prayer that the child can actually do this week.</p>\n<h2>God Feeds His Children</h2>\n<h3>AIM</h3>\n<p>God gives natural food for the body and, in the Holy Eucharist, Jesus himself nourishes the supernatural life of grace.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What did you eat today? What would happen if your body never received food?” Then ask: “Can ordinary food make us holy or give the soul God’s life?” Let the child answer before explaining.</p>\n<h3>DO SOMETHING</h3>\n<p>Body and soul. Draw two columns: BODY and SOUL. Under BODY write food, water, sleep and exercise. Under SOUL write grace, prayer, Scripture and sacraments. Circle EUCHARIST and ask why this gift is greater than ordinary food.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 1. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>God Feeds His Children</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What does ordinary food do for the body?</li><li>What does grace do in us?</li><li>Why do we prepare carefully if Holy Communion is Jesus himself?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to say, in one sentence, why Catholics call the Eucharist food for the soul without pretending that the soul eats in the same way as the body.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father in heaven, thank you for giving me life and calling me to your table. Prepare my heart to receive your Son with faith and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, notice the altar, ambo and tabernacle. Ask what each one is for.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the body/soul comparison simple. The point is not that the body is unimportant, but that a human person needs both natural life and the supernatural life of grace.</p>\n<h2>The Passover, the Manna and the Bread of Life</h2>\n<h3>AIM</h3>\n<p>God prepared his people for the Eucharist through the Passover, the manna and Jesus’ promise of the Bread of Life.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Imagine your family had to make a long journey with no shops on the way. What food would you need? Then ask: “What did God do when Israel was travelling through the desert?”</p>\n<h3>DO SOMETHING</h3>\n<p>Three signposts. Make three cards: PASSOVER LAMB, MANNA, JESUS - BREAD OF LIFE. Put them in order. Read one short verse for each and draw an arrow towards Jesus. Ask: “How did the earlier gifts prepare people for something greater?”</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 2. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Passover, the Manna and the Bread of Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What did the Passover mean for Israel?</li><li>Why was manna a gift for a journey?</li><li>Why is Jesus more than another kind of manna?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to explain how the Passover lamb and manna point forward to Jesus without saying that the Eucharist is only a symbol.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, Bread of Life and Lamb of God, lead me out of sin and nourish me on the journey to heaven. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read or listen to Exodus 12:1-14, Exodus 16:4-15 or John 6:32-40.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the movement towards fulfilment clear: the Old Testament signs really mattered, but Jesus is the greater reality to which they point.</p>\n<h2>Jesus Institutes the Holy Eucharist</h2>\n<h3>AIM</h3>\n<p>At the Last Supper Jesus gave his Body and Blood and commanded the Apostles to continue celebrating the Eucharist.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If someone says, ‘Remember me,’ does that always mean only thinking about them?” Then open a Bible at one account of the Last Supper.</p>\n<h3>DO SOMETHING</h3>\n<p>Words that matter. On three cards write: THIS IS MY BODY / THIS IS MY BLOOD / DO THIS IN MEMORY OF ME. Read the Gospel account and place the cards down as the words appear. Ask why each sentence matters.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 3. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>Jesus Institutes the Holy Eucharist</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What did Jesus actually say about the bread and the chalice?</li><li>Who was told to “do this”?</li><li>How are the Last Supper, the Cross and the Mass connected?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to say what Jesus instituted at the Last Supper and why the Church still celebrates it.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, thank you for loving us to the end and giving the Church the Holy Eucharist. Help me to treasure your gift. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Find the Last Supper in Matthew 26:26-29, Mark 14:22-25, Luke 22:14-20 or 1 Corinthians 11:23-26.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not role-play the consecration or have a child pretend to be the priest. Let Scripture carry the scene. The activity is about listening to Christ’s words, not imitating the sacred rite.</p>\n<h2>Jesus Is Truly Present</h2>\n<h3>AIM</h3>\n<p>In the Blessed Sacrament Jesus Christ is truly, really and substantially present: Body, Blood, Soul and Divinity.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Place an ordinary object inside a closed bag or box. Ask: “Can your eyes tell you everything that is true?” Reveal the object, then explain that the Eucharist is not a guessing trick: we believe because Jesus, who cannot deceive us, has spoken.</p>\n<h3>DO SOMETHING</h3>\n<p>Senses and faith. Draw two columns: WHAT MY SENSES NOTICE / WHAT JESUS TEACHES. Under the first write the appearances of bread and wine. Under the second write JESUS CHRIST - BODY, BLOOD, SOUL AND DIVINITY. Read the catechism before discussing.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 4. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>Jesus Is Truly Present</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why can’t our eyes alone discover the Real Presence?</li><li>Is the Eucharist merely a reminder or symbol of Jesus?</li><li>Whose word gives us certainty?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask: “After the consecration, who is present?” The answer should be Jesus Christ himself, whole and entire - not bread with Jesus somehow added inside it.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, I believe that you are truly present in the Blessed Sacrament. Strengthen my faith and teach me to adore you. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>When you pass before the tabernacle, make a careful genuflection if you are able and say quietly, “My Lord and my God.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Avoid saying “Jesus is inside the bread”. The catechism is stronger and clearer: after the consecration Jesus himself is truly present under the appearances of bread and wine.</p>\n<h2>Transubstantiation</h2>\n<h3>AIM</h3>\n<p>At the consecration the whole substance of bread and wine becomes the Body and Blood of Christ while the appearances remain.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Can something look different while still being the same thing?” Cut or peel an apple if convenient: its appearance changes but it is still an apple. Then say: “The Eucharist is a unique mystery in which the outward appearances remain while what it is changes.”</p>\n<h3>DO SOMETHING</h3>\n<p>What changes? What remains? Draw two boxes. In one write SUBSTANCE - WHAT IT IS. In the other write APPEARANCES - WHAT OUR SENSES NOTICE. Before consecration write “bread/wine”. After consecration write “Body/Blood of Christ” under substance, while the appearances remain.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 5. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>Transubstantiation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What changes at the consecration?</li><li>What stays the same to our senses?</li><li>Why is changing a label not the same as transubstantiation?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to explain transubstantiation in their own words using both ideas: the whole substance changes; the appearances remain.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, eternal Truth, I believe what you have revealed. Help me to trust your word when my senses cannot see the mystery. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn the word transubstantiation slowly and explain it to someone at home in your own words.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>No ordinary example is an exact analogy for transubstantiation. Use examples only to distinguish “what something is” from “what the senses notice”, then return to the Church’s precise words.</p>\n<h2>Adoring Jesus in the Blessed Sacrament</h2>\n<h3>AIM</h3>\n<p>Because Jesus is truly present, Catholics adore him in the Blessed Sacrament during Mass and outside Mass.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>If you are in church, ask the child to look around silently and answer: “What tells us that Catholics believe someone holy is really present here?” If elsewhere, picture the church together.</p>\n<h3>DO SOMETHING</h3>\n<p>Church detective. Find the tabernacle and sanctuary lamp. Practise a calm genuflection if the child is able. Then spend sixty quiet seconds facing the tabernacle. Afterwards ask what each sign or gesture means.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 6. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>Adoring Jesus in the Blessed Sacrament</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why do we genuflect towards the tabernacle?</li><li>What does the sanctuary lamp tell us?</li><li>Why can Catholics adore the Blessed Sacrament outside Mass?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to finish: “We adore the Blessed Sacrament because...” Listen for: Jesus Christ is truly present.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>O Sacrament most holy, O Sacrament divine, all praise and all thanksgiving be every moment thine. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make a short visit to the Blessed Sacrament with your family and spend one quiet minute with Jesus.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Teach reverence as the outward expression of faith, not as a performance. Adapt posture naturally for disability or mobility needs.</p>\n<h2>The Holy Sacrifice of the Mass</h2>\n<h3>AIM</h3>\n<p>The Mass does not repeat Calvary; Christ’s one Sacrifice of the Cross is made sacramentally present.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “How many times did Jesus die on the Cross?” When the child answers “once”, add: “So why can Catholics call every Mass a sacrifice?”</p>\n<h3>DO SOMETHING</h3>\n<p>One sacrifice, made present. Put three cards in a line: LAST SUPPER / CALVARY / MASS. Circle CALVARY and write ON
