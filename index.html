to Confession again?</li><li>What can we do when temptation begins?</li><li>How does being forgiven help us forgive others?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Why receive Penance regularly?</li><li>What ordinary practices help us grow?</li><li>What should we do when temptation begins?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Let the child make a simple five-finger rule of life and choose one finger to practise especially this week.</p>\n<h3>PRAY</h3>\n<p>Lord Jesus, keep me close to you. Help me to love what is good, return quickly when I fall and forgive others as you forgive me. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Finish with hope. The destination is not “I completed the course” but “I know how to return to Christ throughout my life.” You do not need crafts, worksheets or a cupboard of resources. These few ordinary items can make almost every lesson more concrete:</p>\n<h3>ITEM USE</h3>\n<p><strong>Crucifix Cross, salvation, conversion</strong></p>\n<p><strong>Plastic cup Accident, temptation and deliberate choice</strong></p>\n<p><strong>Small bowl or glass of water Baptism and grace</strong></p>\n<p><strong>Phone torch Examination of conscience</strong></p>\n<p><strong>Two chairs Conversion and Confession rehearsal</strong></p>\n<p><strong>Paper and pencil Authority chain, change plans, repair</strong></p>\n<p><strong>Bible / catechism Scripture and the doctrinal foundation</strong></p>\n<h3>Three activities you can reuse anywhere</h3>\n<ul><li>CHOICE STORY - Give an invented situation and ask what happened, whether it was free, and what love requires now.</li><li>SHOW ME - Let the child point, move, arrange, choose or explain rather than only listen.</li><li>TEACH IT BACK - Say: “Explain that to me as if I had never heard it before.”</li></ul>\n<h3>KEEP IT SIMPLE</h3>\n<p>One good activity is enough. If the child is talking, thinking and understanding, stop there. You are not looking for perfect wording. Across the preparation, look for growing signs that the child understands and can participate according to their capacity.</p>\n<h3>GOD AND MERCY</h3>\n<p>The child knows God loves us, sin is real and Jesus offers forgiveness.</p>\n<h3>MORAL UNDERSTANDING</h3>\n<p>The child can usually distinguish deliberate wrong from accident, temptation and lack of freedom.</p>\n<h3>SACRAMENTAL UNDERSTANDING</h3>\n<p>The child knows sins are confessed to a priest and Christ forgives through sacramental absolution.</p>\n<h3>PRACTICAL CONFIDENCE</h3>\n<p>The child can follow the simple shape of Confession and ask for help if needed.</p>\n<h3>CATHOLIC LIFE</h3>\n<p>The child sees Sunday Mass, prayer, charity and the sacraments as belonging together.</p>\n<h3>Non-negotiable boundaries</h3>\n<ul><li>Never ask the child to disclose personal sins to a parent, mentor or group.</li><li>Use invented examples for rehearsal and activities.</li><li>Do not compare children or turn readiness into a public test.</li><li>If a child discloses harm outside Confession, follow diocesan safeguarding procedures.</li><li>Final pastoral judgement about readiness belongs to the parish priest.</li></ul>\n<h3>THE GOAL</h3>\n<p>A child who can say, in simple words: “I know God loves me. I know what sin is. I know Jesus forgives me in Confession. I know what to do, and I want to receive his mercy.”</p>\n<p>Use alongside My First Confession Catechism and the parish resources at</p>"}, {"name": "First Holy Communion", "url": "https://3stepuk.github.io/First-Holy-Communion/", "desc": "For children preparing to receive the Eucharist.", "html": "<p>For children preparing to receive Jesus in the Holy Eucharist</p>\n<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>Use My First Holy Communion Catechism for the Catholic teaching. Use this companion to make the teaching personal, active and memorable.</p>\n<p>It is written for parents, parish mentors and priests working alongside children of roughly seven to nine years of age.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the child</li><li>Do something concrete</li><li>Open the catechism</li><li>Talk together</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<p>The catechism gives the doctrinal spine. This companion helps the teaching become personal, active and memorable.</p>\n<h3>FIRST HOLY COMMUNION · GUIDE</h3>\n<h2>How to use this companion</h2>\n<p>A simple method for parents, mentors and priests</p>\n<h3>MENTOR, NOT LECTURER</h3>\n<p>The child should speak before you explain. Ask what they think, listen carefully, then use the catechism to clarify and deepen. You do not need to fill every silence.</p>\n<h3>A NORMAL MEETING</h3>\n<ul><li>1. Begin naturally: “What did you notice at Mass?” “What do you already think this means?”</li><li>2. Use the opening activity or object prompt from this companion.</li><li>3. Open the matching lesson in My First Holy Communion Catechism and read only as much as is useful.</li><li>4. Ask the child to explain the central truth back in their own words.</li><li>5. Use one optional activity or practice step if it helps; skip it if the conversation is already good.</li><li>6. Finish with the prayer and one simple action for the week.</li></ul>\n<h3>KEEP IT SIMPLE AND REVERENT</h3>\n<p>Do not insist on completing every activity. Do not turn the catechism answers into a public test. Do not use consecrated hosts or imitate the words of consecration in play. If a genuine question opens up, follow it and return to the lesson afterwards.</p>\n<p>Most activities need only the catechism, a Bible, a pen and paper, or ordinary objects already nearby. Nothing needs elaborate preparation.</p>\n<h3>FIRST HOLY COMMUNION · GUIDE</h3>\n<h2>Quick activity toolkit</h2>\n<p>Use these anywhere in the twelve lessons</p>\n<h3>OBJECT PROMPT</h3>\n<p>Use one ordinary object - food, a candle, a Bible, a gift bag, a clock - to open a question before reading the catechism.</p>\n<h3>SORT IT</h3>\n<p>Write words or situations on scraps of paper and sort them into two or three groups. Ask the child to explain each choice.</p>\n<h3>MASS MAP</h3>\n<p>Use the actual church or a simple sketch to find the altar, ambo, tabernacle, sanctuary lamp and the main parts of the Mass.</p>\n<h3>SCRIPTURE SPOTLIGHT</h3>\n<p>Read only the verses needed. Ask: What happened? What did Jesus say? What does this show us about the Eucharist?</p>\n<h3>PRACTISE IT</h3>\n<p>Rehearse a real Catholic action: genuflecting, answering “Amen”, following the Communion procession or praying thanksgiving.</p>\n<h3>ONE REAL NEXT STEP</h3>\n<p>End by choosing one small action for Sunday Mass or family prayer that the child can actually do this week.</p>\n<h2>God Feeds His Children</h2>\n<h3>AIM</h3>\n<p>God gives natural food for the body and, in the Holy Eucharist, Jesus himself nourishes the supernatural life of grace.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What did you eat today? What would happen if your body never received food?” Then ask: “Can ordinary food make us holy or give the soul God’s life?” Let the child answer before explaining.</p>\n<h3>DO SOMETHING</h3>\n<p>Body and soul. Draw two columns: BODY and SOUL. Under BODY write food, water, sleep and exercise. Under SOUL write grace, prayer, Scripture and sacraments. Circle EUCHARIST and ask why this gift is greater than ordinary food.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 1. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 1 &mdash; God Feeds His Children</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God gives us natural food for the body and the Holy Eucharist as supernatural food for the soul.</p>\n<p>God created us with a body and a soul. Food keeps the body alive, while grace gives the soul a share in God&#x27;s own life. Because he loves us, God provides for both.</p>\n<p>Baptism gives us new life in Christ, Confirmation strengthens that life, and the Holy Eucharist nourishes it. The Eucharist completes Christian initiation and is the source and summit of Christian life.</p>\n<p>At Mass, Jesus gathers his Church, teaches us through his word, offers his one sacrifice to the Father and feeds us with himself. We prepare because this gift is holy beyond measure.</p>\n<p>Talk About It: We need food to keep our bodies alive. What do you think our souls need in order to</p>\n<p>grow in friendship with God?</p>\n<p>(God gives natural food for bodily life and grace for supernatural life; in the Eucharist Christ himself nourishes the life begun in Baptism.)</p>\n<p>Learn these answers</p>\n<ol><li>Why did God make us?</li></ol>\n<p>God made us to know him, love him and serve him in this life, and to be happy with him for ever in heaven.</p>\n<ol><li>What gives supernatural life to the soul?</li></ol>\n<p>Sanctifying grace gives the soul a share in God&#x27;s own life.</p>\n<ol><li>Which sacrament nourishes the life of grace?</li></ol>\n<p>The Holy Eucharist nourishes the life of grace.</p>\n<ol><li>Why is the Eucharist the source and summit of Christian life?</li></ol>\n<p>Because Christ himself is present, offered and received in it, and every grace leads us to union with him.</p>\n<ol><li>Why do we prepare carefully for First Holy Communion?</li></ol>\n<p>Because we are preparing to receive Jesus Christ himself with faith, love and reverence.</p>\n<h4>PRAYER</h4>\n<p>Father in heaven, thank you for giving me life and calling me to your table. Prepare my heart to receive your Son with faith and love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Sunday Mass, notice the altar, the ambo and the tabernacle. Ask what each one is for.</p>\n<p>4 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>God Feeds His Children</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What does ordinary food do for the body?</li><li>What does grace do in us?</li><li>Why do we prepare carefully if Holy Communion is Jesus himself?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to say, in one sentence, why Catholics call the Eucharist food for the soul without pretending that the soul eats in the same way as the body.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father in heaven, thank you for giving me life and calling me to your table. Prepare my heart to receive your Son with faith and love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, notice the altar, ambo and tabernacle. Ask what each one is for.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the body/soul comparison simple. The point is not that the body is unimportant, but that a human person needs both natural life and the supernatural life of grace.</p>\n<h2>The Passover, the Manna and the Bread of Life</h2>\n<h3>AIM</h3>\n<p>God prepared his people for the Eucharist through the Passover, the manna and Jesus’ promise of the Bread of Life.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Imagine your family had to make a long journey with no shops on the way. What food would you need? Then ask: “What did God do when Israel was travelling through the desert?”</p>\n<h3>DO SOMETHING</h3>\n<p>Three signposts. Make three cards: PASSOVER LAMB, MANNA, JESUS - BREAD OF LIFE. Put them in order. Read one short verse for each and draw an arrow towards Jesus. Ask: “How did the earlier gifts prepare people for something greater?”</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 2. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 2 &mdash; The Passover, the Manna and the Bread of Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God prepared his people for the Eucharist through the Passover, the manna and the promises of Jesus.</p>\n<p>At the first Passover, God delivered Israel from slavery. A lamb was sacrificed, and the people ate the Passover meal before beginning their journey to freedom.</p>\n<p>In the desert, God fed his people with manna from heaven. These gifts pointed forward to Jesus, the true Paschal Lamb and the true Bread from heaven.</p>\n<p>Jesus said, &quot;I am the bread of life&quot; (John 6:35). He promised to give himself for the life of the world. At the Last Supper and on the Cross, he fulfilled what the earlier signs had foretold.</p>\n<p>Talk About It: God fed his people with manna while they travelled through the desert. How is our life</p>\n<p>like a journey, and what food does Jesus give us for it?</p>\n<p>(God&#x27;s earlier gifts prepared his people for something greater. Jesus is the true Bread from heaven and accompanies us on our journey towards heaven.)</p>\n<p>Learn these answers</p>\n<ol><li>What did God do at the Passover?</li></ol>\n<p>God delivered his people from slavery and led them towards freedom.</p>\n<ol><li>What was the manna?</li></ol>\n<p>Manna was the food God gave Israel in the desert.</p>\n<ol><li>What did the Passover lamb point towards?</li></ol>\n<p>It pointed towards Jesus, the Lamb of God who saves us by his sacrifice.</p>\n<ol><li>Who is the true Bread from heaven?</li></ol>\n<p>Jesus Christ is the true Bread from heaven.</p>\n<ol><li>Where does Jesus teach about the Bread of Life?</li></ol>\n<p>Jesus teaches about the Bread of Life in the sixth chapter of Saint John&#x27;s Gospel.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, Bread of Life and Lamb of God, lead me out of sin and nourish me on the journey to heaven. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read or listen to Exodus 12:1-14, Exodus 16:4-15 or John 6:32-40.</p>\n<p>5 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>The Passover, the Manna and the Bread of Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What did the Passover mean for Israel?</li><li>Why was manna a gift for a journey?</li><li>Why is Jesus more than another kind of manna?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to explain how the Passover lamb and manna point forward to Jesus without saying that the Eucharist is only a symbol.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, Bread of Life and Lamb of God, lead me out of sin and nourish me on the journey to heaven. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read or listen to Exodus 12:1-14, Exodus 16:4-15 or John 6:32-40.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the movement towards fulfilment clear: the Old Testament signs really mattered, but Jesus is the greater reality to which they point.</p>\n<h2>Jesus Institutes the Holy Eucharist</h2>\n<h3>AIM</h3>\n<p>At the Last Supper Jesus gave his Body and Blood and commanded the Apostles to continue celebrating the Eucharist.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If someone says, ‘Remember me,’ does that always mean only thinking about them?” Then open a Bible at one account of the Last Supper.</p>\n<h3>DO SOMETHING</h3>\n<p>Words that matter. On three cards write: THIS IS MY BODY / THIS IS MY BLOOD / DO THIS IN MEMORY OF ME. Read the Gospel account and place the cards down as the words appear. Ask why each sentence matters.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 3. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 3 &mdash; Jesus Institutes the Holy Eucharist</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>At the Last Supper, Jesus instituted the Eucharist and commanded the Apostles to celebrate it in his memory.</p>\n<p>On the night before he died, Jesus celebrated the Passover with his Apostles. He took bread, gave thanks, broke it and gave it to them, saying, &quot;This is my body.&quot; He took the chalice and declared it to be his Blood of the new covenant.</p>\n<p>Jesus then commanded, &quot;Do this in remembrance of me.&quot; He gave the Apostles and their successors the sacred ministry of celebrating the Eucharist.</p>\n<p>The Last Supper, the Sacrifice of the Cross and every Mass belong to one mystery of Christ&#x27;s saving love. The Eucharist is both the memorial of his sacrifice and the sacred banquet in which he gives himself to us.</p>\n<p>Talk About It: At the Last Supper, Jesus didn&#x27;t say, “This is a picture of my body.” What did he say,</p>\n<p>and why does that matter?</p>\n<p>(Jesus declared the bread to be his Body and the wine his Blood, and commanded the Apostles to continue celebrating the Eucharist.)</p>\n<p>Learn these answers</p>\n<ol><li>When did Jesus institute the Holy Eucharist?</li></ol>\n<p>Jesus instituted the Holy Eucharist at the Last Supper, on the night before he died.</p>\n<ol><li>What did Jesus take at the Last Supper?</li></ol>\n<p>Jesus took bread and a chalice of wine.</p>\n<ol><li>What did Jesus declare about the bread and wine?</li></ol>\n<p>He declared the bread to be his Body and the wine to be his Blood.</p>\n<ol><li>What command did Jesus give the Apostles?</li></ol>\n<p>Jesus commanded them to celebrate the Eucharist in remembrance of him.</p>\n<ol><li>Who can consecrate the Eucharist?</li></ol>\n<p>A validly ordained bishop or priest can consecrate the Eucharist.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, thank you for loving us to the end and giving the Church the Holy Eucharist. Help me to treasure your gift. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Find the account of the Last Supper in Matthew 26:26-29, Mark 14:22-25, Luke 22:14-20 or 1 Corinthians 11:23-26.</p>\n<p>6 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>Jesus Institutes the Holy Eucharist</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What did Jesus actually say about the bread and the chalice?</li><li>Who was told to “do this”?</li><li>How are the Last Supper, the Cross and the Mass connected?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to say what Jesus instituted at the Last Supper and why the Church still celebrates it.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, thank you for loving us to the end and giving the Church the Holy Eucharist. Help me to treasure your gift. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Find the Last Supper in Matthew 26:26-29, Mark 14:22-25, Luke 22:14-20 or 1 Corinthians 11:23-26.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not role-play the consecration or have a child pretend to be the priest. Let Scripture carry the scene. The activity is about listening to Christ’s words, not imitating the sacred rite.</p>\n<h2>Jesus Is Truly Present</h2>\n<h3>AIM</h3>\n<p>In the Blessed Sacrament Jesus Christ is truly, really and substantially present: Body, Blood, Soul and Divinity.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Place an ordinary object inside a closed bag or box. Ask: “Can your eyes tell you everything that is true?” Reveal the object, then explain that the Eucharist is not a guessing trick: we believe because Jesus, who cannot deceive us, has spoken.</p>\n<h3>DO SOMETHING</h3>\n<p>Senses and faith. Draw two columns: WHAT MY SENSES NOTICE / WHAT JESUS TEACHES. Under the first write the appearances of bread and wine. Under the second write JESUS CHRIST - BODY, BLOOD, SOUL AND DIVINITY. Read the catechism before discussing.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 4. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 4 &mdash; Jesus Is Truly Present</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In the Blessed Sacrament, Jesus Christ is truly, really and substantially present: Body, Blood, Soul and Divinity.</p>\n<p>After the consecration, what appears to be bread and wine is no longer ordinary bread and wine. The living and glorious Jesus is present whole and entire.</p>\n<p>We do not believe this because our eyes can see the change. We believe because Jesus, who is Truth itself, has spoken, and because his Church has faithfully handed on his teaching from the Apostles.</p>\n<p>The Eucharist is a sacred sign, but it is not merely a symbol. It contains the reality it signifies: Jesus Christ himself, who gives his Body and Blood for our salvation.</p>\n<p>Talk About It: After the consecration, the Host still looks and tastes as it did before. So why do we</p>\n<p>believe it really is Jesus?</p>\n<p>(Christian faith is not restricted to what our senses can discover. We believe the Real Presence because Christ, who is Truth, has spoken and the Church faithfully hands on his teaching.)</p>\n<p>Learn these answers</p>\n<ol><li>Who is present in the Holy Eucharist?</li></ol>\n<p>Jesus Christ is present in the Holy Eucharist.</p>\n<ol><li>How is Jesus present?</li></ol>\n<p>Jesus is truly, really and substantially present.</p>\n<ol><li>What is present in the Blessed Sacrament?</li></ol>\n<p>The Body, Blood, Soul and Divinity of Jesus Christ are present.</p>\n<ol><li>Is the Eucharist merely a symbol of Jesus?</li></ol>\n<p>No. The Eucharist is a sacramental sign in which Jesus himself is truly present.</p>\n<ol><li>Why do we believe in the Real Presence?</li></ol>\n<p>We believe because Jesus has spoken and the Church faithfully teaches his words.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, I believe that you are truly present in the Blessed Sacrament. Strengthen my faith and teach me to adore you. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>When you pass before the tabernacle, make a careful genuflection if you are able and say quietly, &quot;My Lord and my God.&quot;</p>\n<p>7 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>Jesus Is Truly Present</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why can’t our eyes alone discover the Real Presence?</li><li>Is the Eucharist merely a reminder or symbol of Jesus?</li><li>Whose word gives us certainty?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask: “After the consecration, who is present?” The answer should be Jesus Christ himself, whole and entire - not bread with Jesus somehow added inside it.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, I believe that you are truly present in the Blessed Sacrament. Strengthen my faith and teach me to adore you. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>When you pass before the tabernacle, make a careful genuflection if you are able and say quietly, “My Lord and my God.”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Avoid saying “Jesus is inside the bread”. The catechism is stronger and clearer: after the consecration Jesus himself is truly present under the appearances of bread and wine.</p>\n<h2>Transubstantiation</h2>\n<h3>AIM</h3>\n<p>At the consecration the whole substance of bread and wine becomes the Body and Blood of Christ while the appearances remain.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Can something look different while still being the same thing?” Cut or peel an apple if convenient: its appearance changes but it is still an apple. Then say: “The Eucharist is a unique mystery in which the outward appearances remain while what it is changes.”</p>\n<h3>DO SOMETHING</h3>\n<p>What changes? What remains? Draw two boxes. In one write SUBSTANCE - WHAT IT IS. In the other write APPEARANCES - WHAT OUR SENSES NOTICE. Before consecration write “bread/wine”. After consecration write “Body/Blood of Christ” under substance, while the appearances remain.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 5. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 5 &mdash; Transubstantiation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>At the consecration, the whole substance of bread and wine becomes the Body and Blood of Christ, while the appearances remain.</p>\n<p>Things have an underlying reality, what they are, and qualities our senses notice, such as colour, taste, weight and shape. The Church calls these outward qualities the appearances or species.</p>\n<p>By the power of the Holy Spirit and the words of Christ spoken by the priest, the whole substance of bread is changed into Christ&#x27;s Body and the whole substance of wine into his Blood. This change is called transubstantiation.</p>\n<p>The appearances of bread and wine remain. Christ remains present as long as those appearances remain. He is whole and entire under either species and in every part after the host is broken.</p>\n<p>Talk About It: What changes at the consecration, and what stays the same?</p>\n<p>(Let the children wrestle with this one. Draw out the distinction carefully: what the bread and wine are changes; what our senses perceive remains. That change of the whole substance is what the Church calls transubstantiation.)</p>\n<p>Learn these answers</p>\n<ol><li>What is transubstantiation?</li></ol>\n<p>It is the change of the whole substance of bread and wine into the Body and Blood of Christ.</p>\n<ol><li>What remains after the consecration?</li></ol>\n<p>The appearances of bread and wine remain.</p>\n<ol><li>When does the change take place?</li></ol>\n<p>It takes place at the consecration by the power of the Holy Spirit and the words of Christ spoken by the priest.</p>\n<ol><li>How long does Christ remain present?</li></ol>\n<p>Christ remains present as long as the Eucharistic appearances remain.</p>\n<ol><li>Do we receive the whole Christ under the host alone?</li></ol>\n<p>Yes. Jesus is present whole and entire under either Eucharistic species.</p>\n<h4>PRAYER</h4>\n<p>Jesus, eternal Truth, I believe what you have revealed. Help me to trust your word when my senses cannot see the mystery. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Learn the word transubstantiation slowly: trans-sub-stan-ti-a-tion. Explain it in your own words.</p>\n<p>8 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>Transubstantiation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What changes at the consecration?</li><li>What stays the same to our senses?</li><li>Why is changing a label not the same as transubstantiation?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to explain transubstantiation in their own words using both ideas: the whole substance changes; the appearances remain.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, eternal Truth, I believe what you have revealed. Help me to trust your word when my senses cannot see the mystery. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn the word transubstantiation slowly and explain it to someone at home in your own words.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>No ordinary example is an exact analogy for transubstantiation. Use examples only to distinguish “what something is” from “what the senses notice”, then return to the Church’s precise words.</p>\n<h2>Adoring Jesus in the Blessed Sacrament</h2>\n<h3>AIM</h3>\n<p>Because Jesus is truly present, Catholics adore him in the Blessed Sacrament during Mass and outside Mass.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>If you are in church, ask the child to look around silently and answer: “What tells us that Catholics believe someone holy is really present here?” If elsewhere, picture the church together.</p>\n<h3>DO SOMETHING</h3>\n<p>Church detective. Find the tabernacle and sanctuary lamp. Practise a calm genuflection if the child is able. Then spend sixty quiet seconds facing the tabernacle. Afterwards ask what each sign or gesture means.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 6. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 6 &mdash; Adoring Jesus in the Blessed Sacrament</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Because Jesus is truly present, we worship and adore the Blessed Sacrament during Mass and outside Mass.</p>\n<p>Consecrated hosts are reserved in the tabernacle so that Holy Communion can be taken to the sick and so that the faithful may pray before the Lord. The sanctuary lamp indicates and honours his presence.</p>\n<p>A genuflection is an act of adoration made by bending the right knee to the ground. Those who cannot genuflect may make another reverent gesture. Our silence, posture and attention should express faith.</p>\n<p>We may visit Jesus in the tabernacle, adore him when the Blessed Sacrament is exposed, receive Benediction and join Eucharistic processions. Adoration always leads us back to the Sacrifice of the Mass and to loving service.</p>\n<p>Talk About It: Why do we genuflect towards the tabernacle rather than towards an ordinary chair,</p>\n<p>statue or table in the church?</p>\n<p>(Our bodily action expresses what we believe. We adore Christ in the Blessed Sacrament because Jesus himself is truly present there.)</p>\n<p>Learn these answers</p>\n<ol><li>Where is the Blessed Sacrament reserved?</li></ol>\n<p>The Blessed Sacrament is reserved in the tabernacle.</p>\n<ol><li>What does the sanctuary lamp tell us?</li></ol>\n<p>It indicates and honours the presence of Christ in the tabernacle.</p>\n<ol><li>Why do Catholics genuflect before the Blessed Sacrament?</li></ol>\n<p>They genuflect to adore Jesus Christ, who is truly present.</p>\n<ol><li>May we worship the Eucharist outside Mass?</li></ol>\n<p>Yes. The Church worships Christ in the Eucharist during Mass and outside Mass.</p>\n<ol><li>What is Benediction?</li></ol>\n<p>Benediction is a service of adoration in which a priest or deacon blesses the people with the Blessed Sacrament.</p>\n<h4>PRAYER</h4>\n<p>O Sacrament most holy, O Sacrament divine, all praise and all thanksgiving be every moment thine. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Make a short visit to the Blessed Sacrament with your family and spend one quiet minute with Jesus.</p>\n<p>9 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>Adoring Jesus in the Blessed Sacrament</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why do we genuflect towards the tabernacle?</li><li>What does the sanctuary lamp tell us?</li><li>Why can Catholics adore the Blessed Sacrament outside Mass?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to finish: “We adore the Blessed Sacrament because...” Listen for: Jesus Christ is truly present.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>O Sacrament most holy, O Sacrament divine, all praise and all thanksgiving be every moment thine. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make a short visit to the Blessed Sacrament with your family and spend one quiet minute with Jesus.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Teach reverence as the outward expression of faith, not as a performance. Adapt posture naturally for disability or mobility needs.</p>\n<h2>The Holy Sacrifice of the Mass</h2>\n<h3>AIM</h3>\n<p>The Mass does not repeat Calvary; Christ’s one Sacrifice of the Cross is made sacramentally present.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “How many times did Jesus die on the Cross?” When the child answers “once”, add: “So why can Catholics call every Mass a sacrifice?”</p>\n<h3>DO SOMETHING</h3>\n<p>One sacrifice, made present. Put three cards in a line: LAST SUPPER / CALVARY / MASS. Circle CALVARY and write ONCE FOR ALL. Draw a line connecting the Mass to Christ’s one sacrifice. Say clearly: Jesus does not die again; the one sacrifice is made sacramentally present.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 7. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 7 &mdash; The Holy Sacrifice of the Mass</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Mass makes present sacramentally the one Sacrifice of Christ on the Cross; it is the same sacrifice offered in an unbloody manner.</p>\n<p>On Calvary, Jesus offered himself once for all to the Father for our salvation. He rose from the dead and dies no more. His sacrifice is perfect and can never be repeated.</p>\n<p>At Mass, the same Christ offers himself through the ministry of the priest. The Sacrifice of the Cross is made present sacramentally and its fruits are applied to the Church. Christ is not crucified again.</p>\n<p>The Mass is offered to God alone for adoration and praise, thanksgiving, reparation for sin and petition for every need. The living and the faithful departed are remembered in Christ&#x27;s one offering.</p>\n<p>Talk About It: Jesus died on the Cross once. So when we say that the Mass is a sacrifice, does Jesus</p>\n<p>die again? What is happening instead?</p>\n<p>(Draw out the distinction especially carefully: Calvary is not repeated. Christ&#x27;s one perfect sacrifice is made sacramentally present at Mass; the victim and principal priest are the same, although the manner of offering differs.)</p>\n<p>Learn these answers</p>\n<ol><li>What is the Holy Sacrifice of the Mass?</li></ol>\n<p>The Mass is the sacrifice in which Christ makes present and offers sacramentally his one Sacrifice of the Cross.</p>\n<ol><li>Are the Mass and Calvary two different sacrifices?</li></ol>\n<p>No. They are one single sacrifice, differing in the manner of offering.</p>\n<ol><li>Does Jesus suffer and die again at Mass?</li></ol>\n<p>No. The risen Christ does not die again; his one sacrifice is made present in an unbloody manner.</p>\n<ol><li>Who is the principal priest and victim of the Mass?</li></ol>\n<p>Jesus Christ is both the principal priest who offers and the victim who is offered.</p>\n<ol><li>For what purposes is Mass offered?</li></ol>\n<p>Mass is offered for adoration, thanksgiving, reparation and petition.</p>\n<h4>PRAYER</h4>\n<p>Eternal Father, I offer myself with Jesus in the Holy Sacrifice of the Mass. Receive my prayer, work, joys and sufferings through him. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At the elevation, look towards the Sacred Host and the chalice and adore Jesus in silence.</p>\n<p>10 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>The Holy Sacrifice of the Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Does Jesus suffer and die again at Mass?</li><li>Who is the priest and victim of the Mass?</li><li>Why is the Mass more than simply remembering Calvary?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to correct this sentence: “At every Mass Jesus is crucified again.” They should be able to say that his one sacrifice is made present in an unbloody manner.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Eternal Father, I offer myself with Jesus in the Holy Sacrifice of the Mass. Receive my prayer, work, joys and sufferings through him. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At the elevation, look towards the Sacred Host and the chalice and adore Jesus in silence.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Avoid both errors: the Mass is not a new sacrifice added to Calvary, and it is not merely a mental memory. Use the catechism’s language: one sacrifice, sacramentally made present.</p>\n<h2>The Parts of the Mass</h2>\n<h3>AIM</h3>\n<p>The Liturgy of the Word and Liturgy of the Eucharist form one act of worship, opened and concluded by the Church’s rites.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If you had to draw a map of Sunday Mass for someone who had never been, what would happen first, middle and last?”</p>\n<h3>DO SOMETHING</h3>\n<p>Mass map. Make six cards: GATHER / LISTEN TO GOD / OFFER GIFTS / EUCHARISTIC PRAYER / RECEIVE / SENT OUT. Put them in order. Then place the catechism’s names beside them: Introductory Rites, Liturgy of the Word, Liturgy of the Eucharist, Communion Rite, Concluding Rites.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 8. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 8 &mdash; The Parts of the Mass</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Liturgy of the Word and the Liturgy of the Eucharist form one act of worship, with rites that open and conclude the celebration.</p>\n<p>The Introductory Rites gather us and prepare us. We make the Sign of the Cross, acknowledge our sins, praise God and pray together.</p>\n<p>In the Liturgy of the Word, God speaks through Sacred Scripture. We listen to the readings and homily, profess the Creed on Sundays and solemnities, and pray for the Church and the world.</p>\n<p>In the Liturgy of the Eucharist, the gifts are prepared and the Eucharistic Prayer is offered. The Communion Rite prepares us to receive Christ. The Concluding Rites bless and send us to live the Gospel.</p>\n<p>Talk About It: Think about the Mass we have just celebrated. Can you remember one moment when</p>\n<p>God was speaking to us, and one moment when the Church was offering worship to God?</p>\n<p>(Scripture and the homily in the Liturgy of the Word, and the Church&#x27;s thanksgiving and offering in the Liturgy of the Eucharist.)</p>\n<p>Learn these answers</p>\n<ol><li>What are the two principal parts of the Mass?</li></ol>\n<p>They are the Liturgy of the Word and the Liturgy of the Eucharist.</p>\n<ol><li>What happens in the Liturgy of the Word?</li></ol>\n<p>God speaks to us in Scripture, and the Church responds in faith and prayer.</p>\n<ol><li>What happens in the Liturgy of the Eucharist?</li></ol>\n<p>The gifts are prepared, the Eucharistic Prayer is offered and Christ becomes present in the consecrated species.</p>\n<ol><li>What is the high point of the Eucharistic Prayer?</li></ol>\n<p>The consecration is the high point, within the whole prayer of thanksgiving and offering.</p>\n<ol><li>What do the Concluding Rites do?</li></ol>\n<p>They bless and send us to love God and serve our neighbour.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, help me to listen to God&#x27;s word, unite myself to Christ&#x27;s offering and take part in Mass with faith. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Use Appendix A at Sunday Mass and mark each part as it happens.</p>\n<p>11 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>The Parts of the Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What are the two principal parts of Mass?</li><li>When is God speaking to us?</li><li>What does the dismissal send us to do?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to walk through the Mass in order without needing every small detail. The aim is to know where they are and what the Church is doing.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, help me to listen to God’s word, unite myself to Christ’s offering and take part in Mass with faith. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use Appendix A at Sunday Mass and follow each main part as it happens.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not turn this into liturgical trivia. Keep asking what each part is for: gathering, hearing God, offering, receiving and being sent.</p>\n<h2>Offering Ourselves with Jesus</h2>\n<h3>AIM</h3>\n<p>At Mass the baptised unite their prayers, work, joys and sufferings with the perfect offering of Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When the bread and wine are carried to the altar, what could you give God that cannot be carried in your hands?”</p>\n<h3>DO SOMETHING</h3>\n<p>My hidden offering. On a small piece of paper the child writes or draws one person, joy, worry, duty or sacrifice to offer at the next Mass. Keep it in a pocket or prayer book; do not place it physically on the altar. At the preparation of the gifts, remember it silently.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 9. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 9 &mdash; Offering Ourselves with Jesus</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>At Mass, the baptised unite their lives, prayers, work, joys and sufferings with the perfect offering of Christ.</p>\n<p>The priest acts in the person of Christ the Head, but the whole Church participates in the Mass. Each person takes part according to his or her place and calling.</p>\n<p>We participate inwardly by faith, attention, prayer and self-offering, and outwardly by listening, answering, singing, keeping silence and using the Church&#x27;s gestures. Active participation begins in the heart.</p>\n<p>At the preparation of the gifts, we may place our whole life spiritually on the altar. United with Jesus, even small duties, sacrifices and acts of love can be offered to the Father.</p>\n<p>Talk About It: When the bread and wine are carried to the altar, what could you silently place there</p>\n<p>with them from your own life?</p>\n<p>(Children might suggest schoolwork, someone they love, something difficult, a worry, an act of kindness, their family, etc. Draw out that participation at Mass is interior as well as exterior: we unite our lives with Christ&#x27;s perfect offering.)</p>\n<p>Learn these answers</p>\n<ol><li>Who celebrates the Eucharistic liturgy?</li></ol>\n<p>Christ and his Church celebrate the Eucharistic liturgy.</p>\n<ol><li>How does the priest act at Mass?</li></ol>\n<p>The priest acts sacramentally in the person of Christ the Head.</p>\n<ol><li>How do the faithful participate inwardly?</li></ol>\n<p>They participate through faith, attention, prayer and self-offering.</p>\n<ol><li>How do the faithful participate outwardly?</li></ol>\n<p>They listen, answer, sing, keep silence and use the Church&#x27;s gestures reverently.</p>\n<ol><li>What may we offer with Jesus?</li></ol>\n<p>We may offer our prayers, work, joys, sufferings and our whole lives.</p>\n<h4>PRAYER</h4>\n<p>Father, through Jesus your Son, receive all that I am and all that I do. May my life become an offering of love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Before Mass, choose one joy, difficulty or person to place spiritually on the altar with the gifts.</p>\n<p>12 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>Offering Ourselves with Jesus</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What can you offer God from your ordinary week?</li><li>How can silence and attention be real participation?</li><li>Why do we join our offering to Jesus rather than offering alone?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to name one inward and one outward way of taking part in Mass.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, through Jesus your Son, receive all that I am and all that I do. May my life become an offering of love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Before Mass, choose one joy, difficulty or person to place spiritually on the altar with the gifts.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Active participation is not constant activity. Help the child discover attention, prayer, silence and self-offering as real participation alongside the spoken responses and gestures.</p>\n<h2>Preparing to Receive Worthily</h2>\n<h3>AIM</h3>\n<p>We prepare for Holy Communion with Catholic faith, the state of grace, the Eucharistic fast and reverent attention.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “How would you prepare if someone very important was coming to your home?” List a few sensible preparations, then ask what preparation shows that Holy Communion really is Jesus.</p>\n<h3>DO SOMETHING</h3>\n<p>Ready / not the point. Sort these cards: state of grace; Confession if needed; one-hour fast; prayer; forgiving others; arriving in good time; expensive clothes; copying everyone else; having a perfect mood. Discuss why each belongs where it does.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 10. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 10 &mdash; Preparing to Receive Worthily</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>We prepare for Holy Communion with Catholic faith, a soul in the state of grace, the Eucharistic fast and reverent attention.</p>\n<p>A child preparing for First Holy Communion must have sufficient knowledge, understand the mystery of Christ according to his or her capacity and be able to receive the Body of Christ with faith and devotion. Anyone conscious of mortal sin must receive sacramental absolution before Holy Communion. First sacramental Confession must precede First Holy Communion. If a child is unsure, the child may ask a parent, catechist or priest without fear.</p>\n<p>The Eucharistic fast means taking no food or drink for at least one hour before receiving Holy Communion; water and medicine do not break the fast. We also prepare by prayer, suitable dress, forgiveness and arriving in good time.</p>\n<p>Talk About It: If Holy Communion really is Jesus, what are some ways our preparation should show</p>\n<p>that we know whom we are going to receive?</p>\n<p>(State of grace, Confession when necessary, the Eucharistic fast, prayer, forgiveness, arriving in good time and attentive participation. These aren&#x27;t arbitrary rules; they express faith in the holiness of the One we receive.)</p>\n<p>Learn these answers</p>\n<ol><li>What must a child understand before First Holy Communion?</li></ol>\n<p>The child must distinguish the Body of Christ from ordinary food and receive with faith and devotion.</p>\n<ol><li>What is the state of grace?</li></ol>\n<p>It is friendship with God and the possession of sanctifying grace.</p>\n<ol><li>What must someone conscious of mortal sin do before Communion?</li></ol>\n<p>The person must receive sacramental absolution before receiving Holy Communion.</p>\n<ol><li>What is the Eucharistic fast?</li></ol>\n<p>It is abstaining from food and drink for at least one hour before Communion, except for water and medicine.</p>\n<ol><li>How else should we prepare?</li></ol>\n<p>We should pray, forgive others, dress suitably, arrive in good time and take part attentively in Mass.</p>\n<h4>PRAYER</h4>\n<p>Come, Holy Spirit. Give me faith, a clean heart, loving desire and reverence as I prepare to receive Jesus. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>With an adult, work out when the one-hour fast begins for the usual time of Communion in your parish.</p>\n<p>13 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>Preparing to Receive Worthily</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why is the state of grace important?</li><li>What does the one-hour fast help us remember?</li><li>What should a child do if unsure about receiving?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to give four ways Catholics prepare worthily: faith, state of grace, fast and reverent prayer/attention.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit. Give me faith, a clean heart, loving desire and reverence as I prepare to receive Jesus. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With an adult, work out when the one-hour fast begins for the usual time of Communion in your parish.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Teach these practices positively as signs of faith in the holiness of the Eucharist. Questions about sin or readiness should lead to calm help from a parent, mentor or priest, not anxious self-testing.</p>\n<h2>Receiving Holy Communion Reverently</h2>\n<h3>AIM</h3>\n<p>The child approaches in faith, answers “Amen”, receives according to the Church’s approved practice and consumes the Sacred Host immediately.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When the minister says ‘The Body of Christ’ and you answer ‘Amen’, what are you saying yes to?” Let the child answer before rehearsing anything.</p>\n<h3>DO SOMETHING</h3>\n<p>Walk it through. Practise the Communion procession, the approved sign of reverence, the words “The Body of Christ” / “Amen”, receiving on the tongue or in the hand according to parish practice, returning and praying. Use only an unconsecrated practice host supplied for rehearsal if the parish normally uses one; otherwise practise without an object.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 11. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 11 &mdash; Receiving Holy Communion Reverently</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>We approach in faith, receive according to the Church&#x27;s approved practice, answer &quot;Amen&quot; and consume the Sacred Host immediately.</p>\n<p>Follow the Communion procession calmly and prayerfully. In England and Wales, Holy Communion is normally received standing, though an individual may kneel. When receiving standing, make a reverent bow before the Sacrament. The minister shows the host and says, &quot;The Body of Christ.&quot; Look towards the Sacred Host and answer clearly, &quot;Amen,&quot; expressing your faith. Receive either on the tongue or, where permitted, in the hand, according to your choice and the approved practice.</p>\n<p>Consume the whole Sacred Host immediately and reverently. Never carry it away or pass it to another person. If there is any difficulty, remain calm and follow the minister&#x27;s help. Return to your place and pray in thanksgiving.</p>\n<p>Talk About It: When the minister says “The Body of Christ” and you answer “Amen”, what are you</p>\n<p>actually saying yes to?</p>\n<p>(“I believe.” The child&#x27;s Amen is a profession of faith that the One being received is truly Christ. Then connect that belief with reverent approach, reception, immediate consumption of the Host and thanksgiving.)</p>\n<p>Learn these answers</p>\n<ol><li>How should we approach Holy Communion?</li></ol>\n<p>We should approach calmly, prayerfully and reverently.</p>\n<ol><li>What does the minister say?</li></ol>\n<p>The minister says, &quot;The Body of Christ.&quot;</p>\n<ol><li>What do we answer?</li></ol>\n<p>We answer, &quot;Amen,&quot; expressing our faith in Christ&#x27;s Real Presence.</p>\n<ol><li>How may the Sacred Host be received?</li></ol>\n<p>It may be received on the tongue or, where permitted, in the hand.</p>\n<ol><li>What must we do after receiving the Sacred Host?</li></ol>\n<p>We must consume it immediately and return to our place for thanksgiving.</p>\n<h4>PRAYER</h4>\n<p>Lord, I am not worthy that you should enter under my roof, but only say the word and my soul shall be healed.</p>\n<h4>THIS WEEK</h4>\n<p>Practise the Communion procession and the approved manner of reception with your catechist or parent, using an unconsecrated practice host.</p>\n<p>14 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4></div></details>\n<h2>Receiving Holy Communion Reverently</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What does “Amen” mean here?</li><li>Why do we receive and consume the Sacred Host immediately?</li><li>What should you do if you become unsure or need help?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to demonstrate the parish’s approved manner calmly and explain that “Amen” is a profession of faith in the Real Presence.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, I am not worthy that you should enter under my roof, but only say the word and my soul shall be healed.</p>\n<h3>THIS WEEK</h3>\n<p>Practise the Communion procession and the approved manner of reception once more with a parent or mentor.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Never rehearse with a consecrated Host. Adapt calmly for coeliac disease, swallowing difficulty, disability or another medical need in consultation with the priest; do not improvise Eucharistic matter or reception.</p>\n<h2>Thanksgiving and a Eucharistic Life</h2>\n<h3>AIM</h3>\n<p>Holy Communion unites us more closely to Christ and should bear fruit in thanksgiving, charity and a lifelong Eucharistic life.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If Jesus has just given himself to you in Holy Communion, what are four things you might want to say to him before thinking about anything else?”</p>\n<h3>DO SOMETHING</h3>\n<p>Four-part thanksgiving. Use four fingers or four cards: ADORE / THANK / OFFER / ASK. The child says one simple sentence for each. Then choose one act of love or service that can show after Mass that Communion is shaping ordinary life.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 12. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 12 &mdash; Thanksgiving and a Eucharistic Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Holy Communion unites us more closely to Christ, strengthens charity, cleanses venial sins and gives a pledge of heaven.</p>\n<p>After receiving Holy Communion, Jesus is sacramentally present within us while the Eucharistic species remain. This is a precious time for silent adoration, thanksgiving, self-offering and petition.</p>\n<p>Holy Communion increases our union with Christ, strengthens sanctifying grace and charity, forgives venial sins, helps preserve us from grave sin and deepens the unity of the Church. It is food for our journey and a pledge of eternal life.</p>\n<p>A Eucharistic life continues after Mass. We keep Sunday holy, receive Communion frequently when properly disposed, return regularly to Confession, adore Jesus in the Blessed Sacrament and recognise him in people who need our love.</p>\n<p>Talk About It: If receiving Jesus in Holy Communion brings us closer to him, what difference should</p>\n<p>that make to the way we treat people after we leave church?</p>\n<p>(Communion isn&#x27;t finished when Mass ends. Union with Christ should bear fruit in worship, charity, forgiveness, service and love of neighbour.)</p>\n<p>Learn these answers</p>\n<ol><li>What should we do after receiving Holy Communion?</li></ol>\n<p>We should adore Jesus, thank him, offer ourselves and ask for the graces we need.</p>\n<ol><li>What is the chief fruit of Holy Communion?</li></ol>\n<p>The chief fruit is a closer union with Jesus Christ.</p>\n<ol><li>Does Holy Communion forgive mortal sin?</li></ol>\n<p>No. Holy Communion presupposes the state of grace; mortal sin is forgiven through sacramental Confession.</p>\n<ol><li>What sins does Holy Communion cleanse?</li></ol>\n<p>Holy Communion cleanses venial sins and helps preserve us from grave sin.</p>\n<ol><li>How do we live a Eucharistic life?</li></ol>\n<p>We worship faithfully, remain close to the sacraments and give ourselves in love to God and neighbour.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, remain with me by your grace. Make my heart like yours and teach me to become a gift of love for others. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one regular practice: thanksgiving after Communion, a weekly visit to the tabernacle or a monthly Confession.</p>\n<p>15 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4>\n<p>Appendix A - A Child&#x27;s Guide to the Mass</p>\n<p>The Mass has two principal parts - the Liturgy of the Word and the Liturgy of the Eucharist - joined so closely that they form one act of worship. Introductory and Concluding Rites open and close the celebration.</p>\n<p>Part What happens How I take part</p>\n<p>Stand and join the procession hymn. Make the Introductory Entrance, Sign of the Sign of the Cross carefully and answer the Rites Cross and greeting greeting.</p>\n<p>Introductory Penitential Act, Kyrie, Acknowledge your sins, ask mercy, praise God Rites Gloria and Collect and unite your prayer to the Collect.</p>\n<p>Liturgy of the Readings, psalm and Listen for what God is saying. Join the psalm Word Gospel and Gospel acclamations.</p>\n<p>Liturgy of the Homily, Creed and Listen, profess the Catholic faith and pray for Word Universal Prayer the Church and the world.</p>\n<p>Liturgy of the Offer yourself and your whole life with the Preparation of the gifts Eucharist bread and wine placed on the altar.</p>\n<p>Liturgy of the Listen in reverent silence and unite yourself to Eucharistic Prayer Eucharist the Church&#x27;s thanksgiving and offering.</p>\n<p>Liturgy of the Epiclesis and Kneel according to local practice. Adore Christ Eucharist consecration as the host and chalice are shown.</p>\n<p>Liturgy of the Memorial, intercessions Remember Christ&#x27;s saving work, pray with the Eucharist and doxology Church and answer the Great Amen.</p>\n<p>Pray for daily bread and forgiveness, offer Communion Our Father, Sign of peace soberly and ask the Lamb of God for Rite Peace and Lamb of God mercy.</p>\n<p>Communion Invitation and Holy Pray the act of humility, process reverently, Rite Communion receive if properly disposed and give thanks.</p>\n<p>Concluding Receive the blessing and accept the mission to Blessing and dismissal Rites glorify God by your life.</p>\n<p>16 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4>\n<p>Appendix B</p>\n<p>My First Holy Communion Step by Step</p>\n<p>Step What happens What I do</p>\n<p>Make a good Confession beforehand. Keep the Eucharistic fast. Pray 1 Prepare and arrive in good time.</p>\n<p>Join the whole Mass with attention, responses, singing, silence and 2 Take part reverent posture.</p>\n<p>At the consecration and elevation, adore Jesus truly present in the 3 Adore Sacred Host and Precious Blood.</p>\n<p>Join the Communion procession calmly. Make the approved sign of 4 Approach reverence.</p>\n<p>When the minister says, &quot;The Body of Christ,&quot; answer clearly, 5 Profess faith &quot;Amen.&quot;</p>\n<p>Receive on the tongue or, where permitted, in the hand. Consume 6 Receive the Sacred Host immediately.</p>\n<p>Return quietly to your place. Adore, thank, offer and ask. Join the 7 Give thanks Prayer after Communion.</p>\n<p>Let friendship with Jesus shape your prayer, choices, service and 8 Live the gift love of neighbour.</p>\n<h4>IF I AM UNSURE</h4>\n<p>I may remain in my place or approach with my arms crossed for a blessing if that is the parish practice. I should never receive merely because other people are receiving.</p>\n<p>A simple practice dialogue</p>\n<p>Minister: The Body of Christ.</p>\n<p>Child: Amen.</p>\n<p>Child: Receives and consumes the Sacred Host immediately, then returns reverently to pray.</p>\n<p>17 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4>\n<p>Appendix C</p>\n<p>Prayers Before and After Holy Communion</p>\n<p>Before Mass</p>\n<h4>PRAY</h4>\n<p>Come, Holy Spirit. Open my mind to God&#x27;s word, unite my heart to the offering of Jesus and prepare me to receive him with faith. Amen.</p>\n<p>Act of Faith</p>\n<h4>PRAY</h4>\n<p>Lord Jesus Christ, I believe that you are truly, really and substantially present in the Blessed Sacrament: Body, Blood, Soul and Divinity.</p>\n<p>Act of Adoration</p>\n<h4>PRAY</h4>\n<p>My Lord and my God, I adore you with the angels and saints. You are my Creator, my Saviour and my King.</p>\n<p>Act of Contrition</p>\n<h4>PRAY</h4>\n<p>O my God, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<p>Act of Humility</p>\n<h4>PRAY</h4>\n<p>Lord, I am not worthy that you should enter under my roof, but only say the word and my soul shall be healed.</p>\n<p>Act of Desire</p>\n<h4>PRAY</h4>\n<p>Come, Lord Jesus. I long to receive you with faith and love. Take possession of my heart and make it entirely yours.</p>\n<p>18 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4>\n<p>Thanksgiving</p>\n<h4>PRAY</h4>\n<p>Lord Jesus, I adore you and thank you for giving yourself to me. Keep me close to you and never let me be separated from you. Amen.</p>\n<p>Offering after Communion</p>\n<h4>PRAY</h4>\n<p>Jesus, I offer you my body and soul, my thoughts and words, my work and play, my joys and sufferings. Use them for your glory.</p>\n<p>Petition after Communion</p>\n<h4>PRAY</h4>\n<p>Merciful Jesus, bless my family, my parish, those who suffer and those who have asked for my prayers. Give us the grace to love you faithfully.</p>\n<p>Anima Christi</p>\n<h4>PRAY</h4>\n<p>Soul of Christ, sanctify me. Body of Christ, save me. Blood of Christ, inebriate me. Water from the side of Christ, wash me. Passion of Christ, strengthen me. O good Jesus, hear me. Within your wounds hide me. Permit me not to be separated from you. From the wicked enemy defend me. At the hour of my death call me, and bid me come to you, that with your saints I may praise you for ever and ever. Amen.</p>\n<p>Spiritual Communion</p>\n<h4>PRAY</h4>\n<p>Lord Jesus, I believe that you are present in the Blessed Sacrament. Since I cannot receive you sacramentally now, come spiritually into my heart. Unite me to yourself and keep me faithful. Amen.</p>\n<h4>NOTE</h4>\n<p>Spiritual Communion is a prayer of desire. It does not replace sacramental Communion or the Sunday obligation when a person is able to attend Mass.</p>\n<p>19 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4>\n<p>Appendix D</p>\n<p>Summary Catechism</p>\n<p>These questions gather the essential answers from the lessons. Children should understand the meaning before being asked to remember the wording.</p>\n<ol><li>Why did God make us? God made us to know him, love him and serve him in this life, and to be happy with him for ever in heaven.</li><li>What is sanctifying grace? Sanctifying grace is the gift that gives us a share in God&#x27;s life and makes us his children.</li><li>What is the Holy Eucharist? The sacrament in which Jesus Christ is truly present, offered and received under the appearances of bread and wine.</li><li>When did Jesus institute the Eucharist? At the Last Supper, on the night before he died.</li><li>What did Jesus declare about the bread and wine? He declared the bread to be his Body and the wine to be his Blood.</li><li>Who can consecrate the Eucharist? A validly ordained bishop or priest.</li><li>Who is present in the Blessed Sacrament? Jesus Christ is truly, really and substantially present.</li><li>What of Christ is present? His Body, Blood, Soul and Divinity: the whole Christ.</li><li>Is the Eucharist merely a symbol? No. It is a sacramental sign in which Jesus himself is truly present.</li><li>What is transubstantiation? The change of the whole substance of bread and wine into the Body and Blood of Christ.</li><li>What remains after the consecration? The appearances of bread and wine remain.</li><li>How long does Christ remain present? As long as the Eucharistic appearances remain.</li><li>Is the whole Christ present under either species? Yes. The whole Christ is present under either species and in every part.</li><li>Why do we adore the Blessed Sacrament? Because Jesus Christ, true God and true man, is present.</li><li>Where is the Blessed Sacrament reserved? In the tabernacle.</li><li>What is the Mass? The sacrifice in which Christ makes present and offers sacramentally his one Sacrifice of the Cross.</li><li>Are Mass and Calvary one sacrifice? Yes. The victim and principal priest are the same; only the manner of offering differs.</li><li>Does Jesus die again at Mass? No. His one sacrifice is made present in an unbloody manner.</li></ol>\n<p>20 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4>\n<ol><li>For what purposes is Mass offered? For adoration, thanksgiving, reparation and petition.</li><li>What are the two principal parts of Mass? The Liturgy of the Word and the Liturgy of the Eucharist.</li><li>How do the faithful participate? By faith, attention, prayer, responses, silence and offering themselves with Christ.</li><li>What must a child understand before First Communion? The child must distinguish the Body of Christ from ordinary food and receive with faith and devotion.</li><li>What must precede First Holy Communion? Proper preparation and sacramental Confession must precede it.</li><li>Who may receive Holy Communion worthily? A Catholic who is properly disposed and in the state of grace.</li><li>What must someone conscious of mortal sin do? Receive sacramental absolution before Holy Communion.</li><li>What is the Eucharistic fast? No food or drink for at least one hour before Communion, except water and medicine.</li><li>What does the minister say? The minister says, &quot;The Body of Christ.&quot;</li><li>What does the communicant answer? The communicant answers, &quot;Amen.&quot;</li><li>What is the chief fruit of Holy Communion? A closer union with Jesus Christ.</li><li>How should we live after Communion? In faithful worship, charity, frequent Confession, adoration and love of neighbour.</li></ol>\n<p>21 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4>\n<p>Appendix E</p>\n<p>Readiness Guide for Parents and Catechists</p>\n<p>Readiness is not perfect memory or mature theological language. A child should show sufficient understanding according to his or her capacity, distinguish the Body of Christ from ordinary food, desire to receive Jesus and be able to participate with faith and devotion.</p>\n<p>Area What readiness looks like Ready</p>\n<p>The child knows that Jesus is the eternal Son of God made man, Jesus Christ who died and rose for us.</p>\n<p>The child believes that the consecrated Eucharist is truly Jesus Real Presence Christ, not ordinary bread or merely a symbol.</p>\n<p>Mass as The child understands simply that Mass makes present Christ&#x27;s sacrifice one Sacrifice of the Cross.</p>\n<p>Sacramental The child has made First Confession, understands the state of disposition grace and knows to seek help when unsure.</p>\n<p>The child can observe the one-hour fast with appropriate adult Eucharistic fast support.</p>\n<p>The child can join the procession, make the approved sign of Practical reverence, answer &quot;Amen,&quot; receive and consume the host reception reverently.</p>\n<p>Prayer and The child can take part in Mass and pray simply before and after thanksgiving Communion.</p>\n<p>Pastoral Parents, catechists and the parish priest have had a reasonable judgement opportunity to support the child and make needed adaptations.</p>\n<p>Pastoral and safeguarding note</p>\n<p>Preparation must respect each child&#x27;s dignity and capacity. A disability, learning difference or medical need does not by itself prevent reception. Reasonable adaptations should be arranged with the family and parish priest. Children should never be shamed, frightened, publicly tested or pressured to receive.</p>\n<h4>CANONICAL NOTE</h4>\n<p>Children who have reached the use of reason are to receive proper preparation and sacramental Confession before First Holy Communion.</p>\n<p>22 Page</p>\n<h4>MY FIRST HOLY COMMUNION CATECHISM</h4>\n<p>Sources and doctrinal references</p>\n<p>Sacred Scripture. References are given throughout. Short quotations follow the English Standard Version - Catholic Edition.</p>\n<p>Catechism of the Catholic Church. Nos. 1322-1419 on the Sacrament of the Eucharist, especially 1362- 1381 on sacrifice and Real Presence and 1382-1405 on Communion and its fruits.</p>\n<p>Compendium of the Catechism of the Catholic Church. Questions 271-294 on the Eucharist.</p>\n<p>Code of Canon Law. Canons 897-923, especially 913-919 on children, disposition, Confession and the Eucharistic fast; canon 827 on catechetical publications.</p>\n<p>General Instruction of the Roman Missal. Current edition for England and Wales, especially nos. 28, 160- 161 and 274.</p>\n<p>Joseph Deharbe, S.J.. A Full Catechism of the Catholic Religion, English translation by John Fander (London, 1863), especially pp. 259-277.</p>\n<p>Doctrinal standard</p>\n<p>Where local practice or terminology differs, the approved liturgical books, diocesan policy and the directions of the parish priest govern practical preparation. No text in this draft should be interpreted contrary to the Catechism of the Catholic Church or the competent ecclesiastical authority.</p>\n<p>23 Page</p></div></details>\n<h2>Thanksgiving and a Eucharistic Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why is the time after Communion precious?</li><li>What is the chief fruit of Holy Communion?</li><li>How should receiving Jesus change the way we treat people afterwards?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to name the four thanksgiving actions and one habit that helps them live a Eucharistic life after First Communion.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, remain with me by your grace. Make my heart like yours and teach me to become a gift of love for others. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one regular practice: thanksgiving after Communion, a weekly visit to the tabernacle or regular Confession with family guidance.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>First Holy Communion is the beginning, not the finish. Keep drawing the child back to Sunday Mass, thanksgiving, Confession, adoration and practical charity.</p>\n<h3>FIRST HOLY COMMUNION · READINESS</h3>\n<h2>Connecting the activities to readiness</h2>\n<p>Use this quietly; it is not a score sheet for the child</p>\n<h3>JESUS CHRIST</h3>\n<p>Does the child know that Jesus is the eternal Son of God made man, who died and rose for us?</p>\n<h3>REAL PRESENCE</h3>\n<p>Does the child believe that the consecrated Eucharist is truly Jesus Christ, not ordinary bread or merely a symbol?</p>\n<h3>MASS AS SACRIFICE</h3>\n<p>Can the child explain simply that Mass makes present Christ’s one Sacrifice of the Cross and does not crucify him again?</p>\n<h3>SACRAMENTAL DISPOSITION</h3>\n<p>Has First Confession taken place, and does the child understand simply the state of grace and when to ask for help?</p>\n<h3>EUCHARISTIC FAST</h3>\n<p>Can the child observe the one-hour fast with appropriate adult support and explain why it matters?</p>\n<h3>PRACTICAL RECEPTION</h3>\n<p>Can the child join the procession, make the approved sign of reverence, answer “Amen”, receive and consume reverently?</p>\n<h3>PRAYER &amp; THANKSGIVING</h3>\n<p>Can the child take part in Mass and pray simply before and after Holy Communion?</p>\n<p><strong>Final readiness remains a pastoral judgement, not a points total.</strong></p>\n<h3>FIRST HOLY COMMUNION · GUIDE</h3>\n<h2>A final word to parents, mentors and priests</h2>\n<p>Keep the child in front of you more important than the programme</p>\n<h3>THE CATECHISM TEACHES. YOU ACCOMPANY.</h3>\n<p>The activity is successful when it helps the child see, ask, understand, pray or act. It is not successful merely because every box was completed.</p>\n<ul><li>Start with what the child actually notices, asks or understands.</li><li>Use the catechism for exact Catholic teaching and the activity only to make that teaching graspable.</li><li>Keep the tone reverent but warm; First Holy Communion is about receiving Jesus, not passing a test.</li><li>Practise real actions calmly: Mass responses, genuflection, the procession, “Amen” and thanksgiving.</li><li>If the child already understands a point, move on. If something is unclear, stay with it.</li><li>Bring medical, access, sacramental or pastoral questions to the priest early.</li><li>End each meeting with prayer and one small action connected to Sunday Mass.</li></ul>\n<h3>THE GOAL</h3>\n<p>A child who knows whom they are receiving, believes in the Real Presence according to capacity, is at home at Sunday Mass, and can receive Jesus with faith, reverence and thanksgiving.</p>"}, {"name": "Confirmation — Young People", "url": "https://3stepuk.github.io/Confirmation-For-Young-People/", "desc": "For young people preparing for Confirmation.", "html": "<p>For young people preparing for Confirmation</p>\n<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>Use My Confirmation Catechism for the Catholic teaching. Use this companion to make the teaching personal, active and memorable. It is written for parents, parish mentors and priests working alongside young people aged roughly 11-16.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the young person</li><li>Do something concrete</li><li>Open the catechism</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<p>The catechism gives the doctrinal spine. This companion helps the conversation breathe.</p>\n<h3>CONFIRMATION · LESSON</h3>\n<h2>How to use this companion</h2>\n<p>A simple method for parents, mentors and priests</p>\n<h3>MENTOR, NOT LECTURER</h3>\n<p>The young person should speak before you explain. Ask what they think, listen carefully, then use the catechism to clarify and deepen. You do not need to fill every silence.</p>\n<h3>A NORMAL MEETING</h3>\n<ul><li></li></ul>\n<ol><li>Begin naturally: “How has the week been?” “Anything at Mass or in the faith you wondered about?”</li><li></li><li>Use the opening activity or scenario from this companion.</li><li></li><li>Open the matching lesson in My Confirmation Catechism and read only as much as is useful.</li><li></li><li>Ask the young person to explain the central truth back in their own words.</li><li></li><li>Use one optional challenge if it helps; skip it if the conversation is already good.</li><li></li><li>Finish with the prayer and one practical action.</li></ol>\n<h3>DO NOT TURN IT INTO SCHOOL</h3>\n<p>Do not insist on completing every activity. Do not turn the formal catechism answers into a public test. Do not be afraid to follow a genuine question for a while. If you do not know an answer, say so and bring it to the priest.</p>\n<p>Most activities need nothing more than the catechism, a Bible, a pen and paper, or ordinary objects already nearby.</p>\n<h3>CONFIRMATION · LESSON</h3>\n<h2>Quick activity toolkit</h2>\n<p>Use these anywhere in the twelve lessons</p>\n<h3>THREE CORNERS</h3>\n<p>Give three possible answers or responses. The candidate chooses one, moves or points to it, and explains why.</p>\n<h3>CASE STUDY</h3>\n<p>Describe a realistic situation at school, home, online or among friends. Ask: What would a Catholic response look like?</p>\n<h3>ONE-MINUTE EXPLAIN</h3>\n<p>Give the candidate sixty seconds to explain the teaching as if speaking to a friend who knows nothing about it.</p>\n<h3>SCRIPTURE SPOTLIGHT</h3>\n<p>Read only the few verses needed. Ask: What happens? What changes? What does this show about Christ or the Holy Spirit?</p>\n<h3>SORT IT</h3>\n<p>Write words on scraps of paper and group them: gift/fruit/virtue, Baptism/Confirmation/Eucharist, fear/courage/witness, etc.</p>\n<h3>REAL-LIFE NEXT STEP</h3>\n<p>End by naming one concrete action for the coming week - something small enough actually to do.</p>\n<h2>The Holy Spirit, Lord and Giver of Life</h2>\n<h3>AIM</h3>\n<p>The Holy Spirit is a divine Person, true God with the Father and the Son - not merely a feeling, force or symbol.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Write or say three things people might mean when they say “spirit”: mood, energy, ghost, personality, God. Ask: which of these fits the Holy Spirit - and which definitely does not?</p>\n<h3>DO SOMETHING</h3>\n<p>Person or power? Give six statements such as “can love”, “can guide”, “is a feeling”, “sanctifies”, “comes and
