olic is holy? No. The Church is holy because Christ is holy and gives her holy doctrine, sacraments and grace, while her members still need conversion.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus, you prayed that your disciples might be one. Give me love for your whole Church, fidelity to the apostolic faith and humility towards those you have appointed to shepherd your people. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Sunday Mass, notice the references to the Pope, the diocesan bishop and the universal Church. Ask yourself how the local parish is joined to a Church larger than itself.</p>\n<p>7</p></div></details><li>Add PARISH, BISHOP and POPE below them. Trace how a local parish belongs to the wider Church in communion.</li><li>Use this case: a Catholic leader behaves badly. Ask why wrongdoing must be confronted without concluding that Christ’s gifts have disappeared.</li><li>Read the paragraph about the Pope. Distinguish the ministry of unity and defined conditions of infallibility from personal opinions or freedom from sin.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 4 and, where useful, Appendix E on the Pope and legitimate differences of opinion.</p>\n<h2>The Church Christ Founded</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does visible unity matter alongside personal faith?”</li><li>“What concern about the Church’s authority or history needs an honest conversation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What are the four marks? One, holy, catholic and apostolic. Who is the Church’s Head? Jesus Christ. Is every papal statement infallible? No. Infallibility has defined conditions.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, give me love for your Church, fidelity to the apostolic faith and humility towards those entrusted with her care. Help us become holy in your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, listen for prayer for the Pope and diocesan bishop. Ask how the parish shares in the wider Church.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Never excuse wrongdoing or imply that every opinion of a Church leader is doctrine. Help the candidate understand the Church’s actual claim. Listen seriously to painful experiences and involve appropriate parish support when needed.</p>\n<h2>Mary the Saints and the Communion of Saints</h2>\n<h3>AIM</h3>\n<p>Distinguish adoration from veneration and explain intercession and prayer for the dead.</p>\n<h3>QUICK PREP</h3>\n<p>Two headings: GOD ALONE and PRAY FOR US. No image is required.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which Catholic belief about Mary, saints or prayer for the dead has been hardest for you, and why?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One communion in Christ</strong></p>\n<ol><li>Under GOD ALONE, write ADORATION. Under PRAY FOR US, name asking another Christian to pray. Explain that every intercession depends on Christ.</li><li>Read Conversation 5 on asking saints in heaven to intercede. Ask how their being alive in Christ matters.</li>\n<details class=\"conv\"><summary>Open Conversation 5 &mdash; Mary, the Saints and the Communion of Saints</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Catholics adore God alone. We honour the saints because Christ has made them holy, ask their prayers because the Church is one in Christ, and honour Mary uniquely because she is the Mother of God and the foremost disciple of her Son.</p>\n<p>Catholic devotion never places Mary or the saints alongside God as rival powers. Adoration belongs to God alone. Asking a saint to pray for us is an extension of the same communion in Christ by which Christians on earth pray for one another. Mary’s privileges are about Christ and grace: she is truly Mother of God because the one she bore is the divine Son; she was preserved from original sin by Christ’s grace, remained ever Virgin, and at the end of her earthly life was assumed body and soul into heavenly glory. She remains a creature entirely dependent on God. The communion of saints includes the faithful on earth, those being purified after death, and the saints in heaven. Purgatory is not a second chance after rejecting God; it is the final purification of those who die in God’s friendship but still need purification. For this reason Catholics pray for the dead.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which Catholic belief or practice concerning Mary, the saints or prayer for the dead has been hardest for you, and what exactly is the difficulty?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Do Catholics worship Mary or the saints? No. Adoration is given to God alone; saints are honoured as members of Christ and asked to intercede.</li><li>Why call Mary Mother of God? Because Jesus Christ, whom she bore according to his human nature, is one divine Person who is truly God.</li><li>Why ask saints to pray for us? Because all who live in Christ belong to one communion, and the saints in heaven remain alive in him.</li><li>What is purgatory? The final purification of those who die in God’s grace and friendship but are not yet perfectly purified.</li><li>Why pray for the dead? Because the Church’s communion in Christ includes those who have died, and our prayers can assist those undergoing purification.</li></ol>\n<h4>PRAYER</h4>\n<p>Mary, Mother of the Church, and all you saints of God, pray that I may belong wholly to Jesus Christ, love his Church faithfully and persevere to eternal life. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one saint whose life interests you and read a short reliable account of that person. Ask what their life reveals about following Christ rather than merely collecting facts about them.</p>\n<p>8</p></div></details><li>Read Mary’s privileges in the book: Mother of God, Immaculate Conception, ever Virgin and Assumption. Connect each with Christ and grace; Mary remains a creature.</li><li>Use this distinction: purgatory is purification of someone already in God’s friendship, not a second chance after rejecting him. Pray briefly for someone who has died.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 5. Use Appendix E on Christ’s mediation, images and private revelation if those are the candidate’s actual questions.</p>\n<h2>Mary the Saints and the Communion of Saints</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How does honouring Mary point towards the truth about Jesus?”</li><li>“What is the difference between asking a saint’s prayer and adoring God?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Whom do Catholics adore? God alone. Why is Mary Mother of God? The Son she bore according to his humanity is truly God. What is purgatory? The final purification of those who die in God’s grace and friendship.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, unite us in your love with all who belong to you. Mary, Mother of God, and all the saints, pray that we may persevere in faith and reach eternal life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Reread one of Mary’s privileges in Conversation 5. Explain how it concerns Christ and his grace, then pray for someone who has died.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not insist on a favourite private devotion or dismiss a real concern as prejudice. Explain Catholic distinctions carefully. Never pronounce on the eternal state of a particular deceased person.</p>\n<h2>Grace and the Seven Sacraments</h2>\n<h3>AIM</h3>\n<p>Explain sacraments as Christ’s effective gifts and clarify the candidate’s sacramental history.</p>\n<h3>QUICK PREP</h3>\n<p>Seven handwritten cards using the sacrament names below.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What changes when a sacrament is understood as something Christ does, rather than only something we express?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Gifts for a whole Christian life</strong></p>\n<ol><li>Arrange the cards in three groups: INITIATION: Baptism, Confirmation, Eucharist; HEALING: Penance, Anointing of the Sick; SERVICE OF COMMUNION: Holy Orders, Matrimony.</li><li>Choose Baptism. Explain the visible sign, new birth, forgiveness and permanent character. Thank God for the candidate’s Baptism already received.</li><li>Choose Confirmation. Read how the Holy Spirit strengthens baptismal grace and leaves a permanent seal. Valid Confirmation or chrismation is not repeated.</li><li>Name what is known about earlier sacraments and what needs the priest’s investigation. The activity records questions; it does not establish validity.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 6 and Appendix A. The priest determines what Confirmation is required from the person’s actual sacramental history.</p>\n<details class=\"conv\"><summary>Open Conversation 6 &mdash; Grace and the Seven Sacraments</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Christ gives grace through seven sacraments entrusted to the Church: Baptism, Confirmation, Eucharist, Penance, Anointing of the Sick, Holy Orders and Matrimony. Baptism, Confirmation and Eucharist form one Christian initiation.</p>\n<p>A sacrament is more than a religious symbol expressing what we already feel. It is an effective sign of grace instituted by Christ and entrusted to the Church. God acts through the sacramental sign, while fruitful reception calls for faith and proper disposition. Baptism gives new birth in Christ, forgives sin and leaves a permanent sacramental character. Therefore a valid Baptism is never repeated. The parish will verify your Baptism before reception. Confirmation strengthens baptismal grace by the gift of the Holy Spirit and also leaves an indelible character. In the Latin Church, a priest who receives a baptised Christian into full communion has by law the faculty to confirm that person when Confirmation is needed. If you were chrismated in an Eastern Church whose sacraments the Catholic Church recognises, you are not confirmed again; tell the priest at the outset.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What changes when you say a sacrament is something God does, rather than only something the worshipper does?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>How many sacraments are there? Seven: Baptism, Confirmation, Eucharist, Penance, Anointing of the Sick, Holy Orders and Matrimony.</li><li>What do sacraments do? They signify and truly communicate the grace Christ gives through his Church.</li><li>Can Baptism be repeated? No. A valid Baptism leaves an indelible spiritual character.</li><li>Which sacraments complete Christian initiation? Baptism, Confirmation and the Eucharist.</li><li>Will every candidate be confirmed at reception? A candidate who has not already received valid Confirmation normally receives it; the priest determines this from the person’s sacramental history.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus, thank you for the sacramental life of your Church. Make me receptive to your grace and teach me to receive your gifts with faith, reverence and gratitude. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Learn the names of the seven sacraments and group them as initiation, healing, and service of communion/mission. Note which ones you have already validly received.</p>\n<p>9</p></div></details>\n<h2>Grace and the Seven Sacraments</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why are sacraments more than reminders?”</li><li>“Which sacramental gift do you most want to understand or receive?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How many sacraments are there? Seven. What do they do? Signify and truly communicate Christ’s grace. Can valid Baptism or Confirmation be repeated? No. Each gives a permanent sacramental character.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, thank you for the sacramental life of your Church. Make me receptive to your grace and help me receive your gifts with faith and gratitude. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn the seven names and their three groups. Give the priest any missing information about Baptism, Confirmation or chrismation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Never assume that all earlier sacraments are invalid. Eastern Christians need particular attention to valid sacraments and their proper ecclesial heritage. Leave reception procedure, Church membership and faculties to the priest and competent guidance.</p>\n<h2>The Eucharist and the Holy Mass</h2>\n<h3>AIM</h3>\n<p>Connect the Real Presence, Christ’s one sacrifice and visible communion with the Church.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix, optional; three headings: PRESENCE, SACRIFICE, COMMUNION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you understand Catholics to believe happens at Mass?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What Christ gives at Mass</strong></p>\n<ol><li>Under PRESENCE, read how the whole substance of bread and wine becomes Christ’s Body and Blood while the appearances remain: transubstantiation.</li><li>Under SACRIFICE, place the crucifix if available. Explain that Christ’s one sacrifice is made sacramentally present; he is not crucified again.</li><li>Under COMMUNION, name union with Christ and visible unity in Catholic faith, sacramental life and pastors. Discuss why the candidate normally waits until Reception.</li><li>Name ways to take part now: hear the Word, pray, offer one’s life with Christ and give thanks. Choose one intention for the next Sunday Mass.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 7. Keep sacrifice, Real Presence and ecclesial communion together. Use Appendix E on the Mass and waiting for Communion.</p>\n<details class=\"conv\"><summary>Open Conversation 7 &mdash; The Eucharist and the Holy Mass</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In the Eucharist Jesus Christ is truly, really and substantially present - Body, Blood, Soul and Divinity. The Mass sacramentally makes present his one sacrifice of Calvary, and Holy Communion is both union with Christ and a visible sign of full communion with his Church.</p>\n<p>At the consecration the whole substance of bread and wine becomes the Body and Blood of Christ, while the appearances remain. The Church calls this change transubstantiation. Christ is wholly present under either species and remains present as long as the Eucharistic species remain. The Mass is not a new crucifixion and Christ does not die again. His one sacrifice, offered once on Calvary, is made sacramentally present so that the Church can unite her worship and self- offering to his perfect sacrifice. The Eucharist is therefore sacrifice, memorial, presence and sacred banquet. Holy Communion does not express only a private relationship with Jesus. It also manifests communion with the Church’s faith, sacraments and pastors. This is why a candidate normally waits until reception into full communion before receiving the Eucharist. At reception, sharing the Eucharist with the Catholic community is the high point of the rite.</p>\n<h4>TALK ABOUT IT</h4>\n<p>If Holy Communion expresses both union with Christ and union with his Church, how does that change the way you understand waiting to receive?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Is the Eucharist merely a symbol of Jesus? No. Jesus Christ is truly, really and substantially present.</li><li>What is transubstantiation? The whole substance of bread and wine is changed into Christ’s Body and Blood while the appearances of bread and wine remain.</li><li>Does Christ die again at every Mass? No. His one sacrifice is made sacramentally present; it is not repeated.</li><li>Why is Sunday Mass central to Catholic life? Because the Eucharist is the source and summit of the Church’s life and Sunday is the Lord’s Day.</li><li>Why is Communion linked with full communion in the Church? Because receiving the one Body of Christ also expresses visible unity in Catholic faith and ecclesial communion.</li></ol>\n<h4>PRAYER</h4>\n<p>Jesus, Bread of Life, deepen my faith in your Real Presence. Prepare me to receive you worthily and to offer my whole life with your one perfect sacrifice. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Mass this Sunday, pay particular attention to the Liturgy of the Eucharist. Afterwards write one sentence each about sacrifice, presence, Communion, and thanksgiving.</p>\n<p>10</p></div></details>\n<h2>The Eucharist and the Holy Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Communion more than a private expression of devotion?”</li><li>“How can you unite your life to Christ’s offering while preparing for Reception?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is present in the Eucharist? Jesus Christ, Body, Blood, Soul and Divinity. Does Christ die again at Mass? No. His one sacrifice is made sacramentally present. What does Holy Communion express? Union with Christ and visible communion with his Church.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, Bread of Life, increase my faith in your Real Presence. Prepare me to receive you worthily and to offer my life with your one perfect sacrifice. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, pay attention to the Eucharistic Prayer. Afterwards name one thing you understood about sacrifice, presence or communion.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen for belief beyond “special bread” or a merely symbolic meal. Use the book’s precise explanation; do not imitate consecration. Support prayerful participation while referring any exceptional sacramental question to the priest.</p>\n<h2>Conversion and the Sacrament of Penance</h2>\n<h3>AIM</h3>\n<p>Prepare the baptised candidate peacefully for Confession before Reception.</p>\n<h3>QUICK PREP</h3>\n<p>Appendix B; six headings: BEGIN, CONFESS, LISTEN, CONTRITION, ABSOLUTION, PENANCE.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you hope for, or worry about, when you think of meeting Christ in Confession?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A calm walk through Confession</strong></p>\n<ol><li>Put the headings in order using Appendix B. Explain examination of conscience, sorrow for sin and a genuine intention to change with God’s help.</li><li>Practise this opening: “I am preparing to be received into full communion, and this is my first Catholic Confession.” The priest will guide the person.</li><li>Use an invented example, such as a person deliberately cheating another. Discuss speaking simply and making restitution; never practise with the candidate’s actual sins.</li><li>Read the Act of Contrition printed here. Explain absolution and penance without acting as a confessor. Arrange private preparation and an appointment with the priest.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 8 and Appendix B. Because the candidate is baptised, Confession normally belongs before Reception.</p>\n<details class=\"conv\"><summary>Open Conversation 8 &mdash; Conversion and the Sacrament of Penance</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Christ continues his work of forgiveness after Baptism through the Sacrament of Penance. Candidates for full communion are normally prepared to celebrate Confession before reception so that they approach Confirmation and the Eucharist in a state of grace.</p>\n<p>Baptism forgives all sin committed before Baptism. After Baptism, Christians still struggle with sin and need continuing conversion. Mortal sin involves grave matter, sufficient knowledge and deliberate consent; venial sin wounds charity without destroying the life of grace. In Confession we approach Christ through the ministry he entrusted to the Church. The penitent examines conscience, is contrite, confesses sins honestly, intends to turn from sin, receives absolution and performs the penance given. The priest is bound by the sacramental seal. First Confession need not be frightening or perfect. You should prepare honestly, especially for serious sins committed after Baptism, and tell the priest that this is your first Catholic Confession. He will guide you. Do not turn an examination of conscience into anxious hunting for faults you cannot remember.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What might be spiritually different between privately telling God you are sorry and also bringing your sins sacramentally to Christ through the priest?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Why do Catholics confess to a priest? Because Christ entrusted to his Church a sacramental ministry of reconciliation and forgiveness.</li><li>What is mortal sin? A grave sin committed with sufficient knowledge and deliberate consent.</li><li>What is contrition? Sorrow for sin together with a real intention to turn away from it.</li><li>What does absolution do? Christ forgives sins through the ministry of the priest and reconciles the penitent with the Church.</li><li>Should a candidate go to Confession before reception? Normally yes; the priest will prepare and arrange the sacrament as part of immediate preparation.</li></ol>\n<h4>PRAYER</h4>\n<p>Merciful Father, give me honest sorrow for sin, confidence in your mercy and courage to make a good Confession. Create in me a clean heart and renew a right spirit within me. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Appendix B and begin a peaceful examination of conscience. Arrange the time for Confession with the priest rather than leaving it until the last moment.</p>\n<p>11</p></div></details>\n<h2>Conversion and the Sacrament of Penance</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How is a genuine intention to change different from promising never to fail again?”</li><li>“What would help you approach the sacrament with trust?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is contrition? Sorrow for sin with a real intention to turn away from it. What does absolution do? Christ forgives through the priest and reconciles the penitent with the Church. Should Confession normally precede Reception? Yes. The priest prepares and arranges it.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Merciful Father, give me honest sorrow for sin and confidence in your mercy. Help me make a good Confession and begin again in your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use Appendix B privately for a peaceful examination of conscience. Arrange Confession with the priest rather than leaving it until the last moment.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not ask to hear, record or review the candidate’s sins. The priest alone receives sacramental Confession. Explain the absolute seal and avoid anxious demands for perfect recall. Personal or complex concerns should be taken privately to him.</p>\n<h2>The Moral Life Freedom Conscience and Virtue</h2>\n<h3>AIM</h3>\n<p>Connect God’s initiating grace with free cooperation, formed conscience and virtue.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: GIFT, RESPONSE, FRUIT.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What is the difference between following conscience and forming conscience?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Grace becoming a changed life</strong></p>\n<ol><li>Under GIFT, name God’s grace. Under RESPONSE, name free cooperation. Under FRUIT, name love, obedience and good works made possible by grace.</li><li>Use this case: a person says an unfair business practice is acceptable because they feel no guilt. Ask what truth must be considered beyond the feeling.</li><li>Read the book’s definition of conscience. Name ways to form it: Scripture, prayer, truth and the Church’s teaching.</li><li>Choose a virtue for the case: prudence, justice, fortitude or temperance. Discuss one habit that could help the person act rightly. Add faith, hope and charity as the theological virtues.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 9 and Appendix E on faith and works. Keep grace first and the real transformation of life clear.</p>\n<details class=\"conv\"><summary>Open Conversation 9 &mdash; The Moral Life: Freedom, Conscience and Virtue</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Christian moral life is our response to God’s grace. We are saved by grace, not by earning God’s love; the grace that justifies us also transforms us so that faith becomes active in love, obedience and good works.</p>\n<p>Catholic morality is not a way of purchasing salvation. God acts first. Even our good response is sustained by grace. Yet grace does not destroy freedom: it heals and elevates it, calling us to cooperate with God and become holy. The Beatitudes reveal the character of life in Christ, and the Ten Commandments give enduring moral shape to love of God and neighbour. Virtues form stable habits of choosing the good. The theological virtues are faith, hope and charity; the cardinal virtues are prudence, justice, fortitude and temperance. Conscience is not simply a private feeling that makes right and wrong true for me. It is the judgement of reason about a concrete act and must be formed by truth, Scripture, prayer and the teaching of the Church. A sincere conscience deserves respect, but sincerity alone does not make an objectively wrong action right.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What is the difference between “following my conscience” and “forming my conscience”?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Are Catholics saved by good works instead of grace? No. Salvation is God’s grace; good works are the fruit of grace and living faith, not an independent way of earning salvation.</li><li>Why do the commandments still matter? They express the moral law and teach concrete love of God and neighbour.</li><li>What are the theological virtues? Faith, hope and charity.</li><li>What is conscience? A judgement of reason by which we recognise the moral quality of a concrete act.</li><li>Must conscience be formed? Yes. Christians have a duty to seek truth and form conscience by God’s Word and the Church’s moral teaching.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus, form my conscience in truth. Free me from both self-righteousness and moral confusion, and teach me the obedience of faith that bears fruit in love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one Beatitude and one Commandment. Ask how each would concretely change one ordinary decision in your life this week.</p>\n<p>12</p></div></details>\n<h2>The Moral Life Freedom Conscience and Virtue</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why are good works the fruit of grace rather than a purchase of God’s love?”</li><li>“What is one way you can form conscience more carefully?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Do we earn salvation independently of grace? No. Salvation is God’s gift; living faith bears fruit in love. What is conscience? A judgement of reason about the moral quality of a concrete act. Must conscience be formed? Yes. We must seek and receive the truth.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, form my conscience in truth. Heal my freedom by your grace and teach me a faith that becomes love, obedience and good works. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one ordinary decision. Ask which virtue named here could help you act rightly, then take one practical step with God’s help.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Respect the candidate’s freedom while explaining the duty to seek truth. Do not turn sincerity into permission to invent morality. When a complex personal case arises, help the person seek confidential pastoral guidance.</p>\n<h2>The Moral Life Love in Concrete Life</h2>\n<h3>AIM</h3>\n<p>Make the dignity of the person and the demands of Catholic moral teaching practical.</p>\n<h3>QUICK PREP</h3>\n<p>Paper with headings: LIFE, MARRIAGE, TRUTH, JUSTICE, CHARITY.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which Catholic moral teaching most needs explanation for you, and what good does the Church say it protects?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The good that love protects</strong></p>\n<ol><li>Use a case: a family treats a dependent elderly relative as a burden. Discuss dignity, care and why life must never be treated as disposable.</li><li>Use a case: an employer knowingly withholds a worker’s pay. Discuss justice and the concrete obligations of love.</li><li>Read the whole of Conversation 10, including chastity, marriage, care for life, truth, work and the common good. Do not omit a difficult area.</li>\n<details class=\"conv\"><summary>Open Conversation 10 &mdash; The Moral Life: Love in Concrete Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Catholic moral teaching protects the dignity of the human person and the truth of love. Christian discipleship includes reverence for human life, chastity and the dignity of marriage, honesty, justice, care for the poor, forgiveness and responsibility for the common good.</p>\n<p>Every human person is made in God’s image and must never be reduced to an object or a problem. Human life is sacred and deserves protection from conception until natural death. Care for the sick, disabled, poor, unborn, elderly, stranger and vulnerable belongs to Christian love. Chastity integrates sexuality within the dignity of the person. Sexual union belongs within the covenant of marriage between a man and a woman and is ordered both to the good of the spouses and to openness to life. Catholic morality calls every person, married or unmarried, to self-mastery, fidelity and purity of heart. The moral life also includes work, money, truth, reputation, property, social justice and the use of power. Christians must reject lying, exploitation, racism, revenge and indifference to suffering. Charity goes beyond bare justice: it seeks the true good of neighbour, including enemies.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which Catholic moral teaching do you find most challenging to understand or live, and can you name the underlying good the Church believes it is protecting?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Why does the Church defend human life so strongly? Because every human person has God-given dignity and may never be treated as disposable.</li><li>What is chastity? The virtue that integrates sexuality within the person and directs it according to one’s state of life.</li><li>What is Christian marriage? A lifelong and exclusive covenant between a man and a woman, ordered to their good and to the gift and education of children.</li><li>Does Catholic morality concern only sexual questions? No. It also governs truth, money, work, justice, violence, care for the poor, social responsibility and every area of human action.</li><li>What is the highest moral virtue? Charity: the supernatural love of God above all things and of neighbour for God’s sake.</li></ol>\n<h4>PRAYER</h4>\n<p>God of truth and mercy, teach me to love what is truly good. Give me courage where your teaching is demanding and charity towards every person, especially those who are vulnerable or difficult to love. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Bring one genuine moral question to the priest or mentor. Do not choose a question merely to “complete the exercise”; choose the one that actually matters for your life.</p>\n<p>13</p></div></details><li>Under one heading, name a teaching that needs further discussion and one act of charity that can begin now. The candidate need not reveal private details.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 10. Bring marriage history or any personal situation affecting sacramental life to the priest early, using Appendix A.</p>\n<h2>The Moral Life Love in Concrete Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does love require more than strong feelings?”</li><li>“How can we explain a demanding teaching while showing charity towards every person?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why protect human life? Every person has God-given dignity, from conception to natural death. What is Christian marriage? A lifelong, exclusive covenant of a man and a woman, ordered to their good and the gift and education of children. What is the highest moral virtue? Charity: love of God and neighbour for God’s sake.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>God of truth and mercy, teach me to love what is good. Give me courage where conversion is demanding and generous charity towards every person. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Bring one genuine moral question to the mentor or priest and choose one concrete act of care or justice.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Let the candidate ask the real question. Explain reasons as well as duties. A mentor does not resolve a marriage bond or demand personal disclosure. Keep compassion, the fullness of Catholic teaching and appropriate pastoral referral together.</p>\n<h2>Prayer and the Ordinary Catholic Life</h2>\n<h3>AIM</h3>\n<p>Build a sustainable pattern of worship, prayer, parish belonging and charity.</p>\n<h3>QUICK PREP</h3>\n<p>A diary or paper; the basic prayers printed at the end of this guide.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What simple rhythm of prayer and Sunday worship could still be part of your life five years from now?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A rule that can be lived</strong></p>\n<ol><li>Write DAILY, SUNDAY, REGULARLY and PARISH. Under DAILY, choose one of the printed prayers and a short time for morning or evening prayer.</li><li>Under SUNDAY, plan Mass and any practical help needed. During preparation, participate prayerfully while normally waiting until Reception for Communion.</li><li>Under REGULARLY, plan continuing formation and Confession as arranged with the priest. Under PARISH, name a person to know and a way to serve.</li><li>Read the book on the liturgical year, sacramentals and devotions. Choose a helpful devotion without allowing it to replace Mass or become a burdensome private programme.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 11 and Appendix G. Catholic formation and conversion continue after Reception.</p>\n<details class=\"conv\"><summary>Open Conversation 11 &mdash; Prayer and the Ordinary Catholic Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Catholic life is sustained by Sunday Eucharist, daily prayer, Scripture, the sacraments, the liturgical year, works of charity and ongoing conversion. Devotions and sacramentals support this life but never replace the liturgy or the sacraments.</p>\n<p>Prayer is a living relationship with the Father, through the Son, in the Holy Spirit. Catholics pray with Scripture, the Psalms, the Lord’s Prayer, silent meditation, intercession, thanksgiving and the prayer of the Church. The goal is not to multiply techniques but to remain with God faithfully. The Church’s liturgical year forms us through Advent, Christmas, Lent, Easter and Ordinary Time, with Sundays and feasts drawing us repeatedly into the mysteries of Christ. Catholics keep Sunday and holy days of obligation by participating in Mass unless excused by a serious reason. Sacramentals and devotions - holy water, blessings, the Rosary, Stations of the Cross, Eucharistic adoration, novenas and other approved practices - dispose us to grace and extend the Church’s prayer into daily life. They are optional in varying degrees and should lead us to Christ, not become superstition.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What simple rhythm of prayer and Sunday worship is realistic enough that you could still be living it five years from now?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is the centre of weekly Catholic life? Sunday Mass.</li><li>How should Catholics pray? Faithfully and in many forms: liturgical prayer, Scripture, vocal prayer, meditation, intercession, thanksgiving and silent prayer.</li><li>What are sacramentals? Sacred signs instituted by the Church that prepare us to receive grace and sanctify ordinary circumstances of life.</li><li>Must every Catholic practise every devotion? No. Approved devotions are helps to holiness; the sacramental and liturgical life of the Church remains primary. No. Every Catholic remains a disciple who must continue learning, praying, converting and serving.</li></ol>\n<h4>PRAYER</h4>\n<p>Father, teach me to pray. Make Sunday worship the anchor of my life, your Word my daily light, and the ordinary habits of Catholic life a path of steady holiness. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose a simple daily rule now: a morning offering or brief prayer, one Scripture reading, evening thanksgiving, and Sunday Mass. Keep it deliberately small enough to become permanent.</p>\n<p>14</p></div></details>\n<h2>Prayer and the Ordinary Catholic Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What existing prayer habit can you carry into Catholic life?”</li><li>“What support would help this simple rule survive work, tiredness or family demands?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the weekly centre? Sunday Mass. Do devotions replace the liturgy or sacraments? No. They support Catholic life. Does formation finish at Reception? No. Learning, conversion and service continue.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, teach me to pray. Make Sunday worship the anchor of my life and help me remain faithful in ordinary work, relationships and service. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Begin the small rule you have chosen. Pray one printed prayer daily and keep your plan for Sunday Mass.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Adapt to capacity and circumstances without losing the substance of Catholic life. Teach the Church’s actual obligations; do not impose personal devotional tastes. Arrange parish relationships that extend beyond meetings with the priest.</p>\n<h2>Profession Reception Confirmation and Eucharist</h2>\n<h3>AIM</h3>\n<p>Prepare a sincere profession and calm participation in Reception and the sacraments.</p>\n<h3>QUICK PREP</h3>\n<p>Appendix C; four cards: PROFESSION, RECEPTION, CONFIRMATION IF NEEDED, EUCHARIST.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Can you freely and sincerely intend to believe and live as a Catholic Christian? What still needs attention?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Words I can mean and gifts I will receive</strong></p>\n<ol><li>Read the profession: “I believe and profess all that the holy Catholic Church believes, teaches, and proclaims to be revealed by God.” Ask what its words mean.</li><li>Arrange the cards using Appendix C. Explain Reception, Confirmation when needed and sharing the Eucharist in full communion. No valid Baptism is repeated.</li><li>Practise only the responses and movements directed by the priest. Rehearse “Amen” before Communion without using a practice host or imitating sacramental actions.</li><li>Name an unresolved question to bring to the priest, confirm practical arrangements and put a meeting after Reception in the diary. Preparation follows sincere readiness, not pressure to meet a date.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 12 and Appendices C and F. The approved rite and the priest govern the profession, actual celebration and readiness.</p>\n<details class=\"conv\"><summary>Open Conversation 12 &mdash; Profession, Reception, Confirmation and Eucharist</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Reception into full communion is a free profession of the Catholic faith by an already baptised Christian. The candidate is received into the Church, ordinarily receives Confirmation if not already validly confirmed, and shares fully in the Eucharist.</p>\n<p>The profession made at reception is short because you have already made the Christian profession of faith in Baptism. You now profess that you believe and accept the Catholic faith as the Church teaches it. The rite deliberately respects your baptismal identity rather than treating you as unbaptised. If Confirmation is needed, the priest who receives you into full communion is normally able to confirm you in the same celebration. The Eucharist is the high point: for the first time you share sacramental Communion as one visibly united with the Catholic Church. Reception is a beginning, not a graduation. You will still have questions, need Confession, need Sunday Mass and need the friendship of other Catholics. Full communion also calls for genuine</p>\n<p>unity of all Christ’s disciples, not produce contempt.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Can you sincerely say, without pretending or mentally adding exceptions, that you intend to live and believe as a Catholic Christian?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What does the candidate profess? The Catholic faith in its fullness, not merely a selection of teachings the candidate already prefers.</li><li>What if I still have questions? Questions are normal. What matters is honest willingness to receive the Church’s faith; deliberate rejection of a doctrine to be professed should be resolved before reception.</li><li>What normally follows the profession of faith? The act of reception, Confirmation if needed, and full participation in the Eucharist.</li><li>Who decides whether I am ready? The parish priest makes the pastoral judgement, following the approved rite, canon law and diocesan directions.</li><li>What happens after reception? Ordinary Catholic life begins: Sunday Mass, prayer, Confession, continued formation, parish belonging, charity and mission.</li></ol>\n<h4>PRAYER</h4>\n<p>Lord Jesus Christ, you have led me by paths I did not always foresee. If this is your call, give me the faith to profess it without fear, the humility to keep learning and the charity to live in full communion with your Church. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read the readiness conversation in Appendix F. Write down any sentence you cannot yet say sincerely. Bring that point openly to the priest before setting or finalising a reception date.</p>\n<p>15</p>\n<h4>APPENDIX A</h4>\n<p>Before You Begin: Baptism and Pastoral Check</p>\n<p>Do this early. It prevents pastoral or canonical questions appearing only days before reception.</p>\n<h4>NOT A TEST</h4>\n<p>These questions are not designed to catch you out. They help the priest identify the correct route and protect the sacraments from avoidable confusion.</p>\n<p>Check What to establish</p>\n<p>Where and when were you baptised? In which Church or ecclesial Baptism community? Do you have a certificate or other reliable record?</p>\n<p>Were you ever baptised or received as a Catholic, even as a baby? Previous Catholic If yes, you are not a candidate for reception; a different pathway status applies.</p>\n<p>Confirmation / Have you ever been confirmed or chrismated? Give the Chrismation denomination, place and approximate date.</p>\n<p>Were you baptised or chrismated in an Orthodox, Oriental Orthodox Eastern Christian or other Eastern Church? Tell the priest before arranging the rite; background your sacramental and canonical status may differ from that of a Western Protestant candidate.</p>\n<p>Have you ever been married, civilly or religiously? Has your present Marriage history spouse ever been married? Tell the priest about every prior bond, even if a divorce has occurred.</p>\n<p>Is there anything in your present marital or family situation that you Current family think may need pastoral or canonical attention? Ask early rather situation than assuming.</p>\n<p>Choose, with parish guidance, a practising Catholic who can Sponsor accompany you. If you are to be confirmed, the sponsor should meet the Church’s requirements for a Confirmation sponsor.</p>\n<p>Tell the parish about disability, literacy, language, neurodiversity, Accessibility and shift work, caring responsibilities or other needs so that preparation learning needs can be adapted without lowering the substance of faith.</p>\n<h4>VALID BAPTISM</h4>\n<p>If Baptism is clearly valid, it must not be repeated. If there is a genuine doubt, the priest investigates it according to the Church’s law and liturgical books; the candidate should not try to solve the question alone.</p>\n<p>16</p>\n<h4>APPENDIX B</h4>\n<p>Preparing for Your First Confession as a Catholic Candidate</p>\n<p>Candidates for reception are normally prepared for the Sacrament of Penance before reception. This is possible precisely because you are already baptised. The aim is not to make you anxious about the past but to meet Christ’s mercy sacramentally and approach Confirmation and the Eucharist in a state of grace.</p>\n<p>A peaceful preparation Ask the Holy Spirit for honesty, light and trust in God’s mercy. Consider your life since Baptism. Pay particular attention to serious sins you freely chose with sufficient knowledge. Do not invent certainty where memory is unclear. Confess what you honestly remember. For mortal sins, confess their kind and approximate number as far as reasonably possible. Venial sins may and should also be confessed. Tell the priest at the beginning: “I am preparing to be received into full communion, and this is my first Catholic Confession.” He will guide you. Make a sincere act of contrition and a real purpose of amendment. A purpose of amendment is a genuine intention to change with God’s help, not a prediction that you will never fail again.</p>\n<h4>BE AT PEACE</h4>\n<p>The sacrament is a meeting with the mercy of Christ, not an oral examination. The priest may ask a brief question to understand what you mean, but Confession is not counselling and you do not need to tell unnecessary details.</p>\n<p>A simple examination of conscience God: Have I knowingly rejected God, neglected prayer, treated holy things contemptuously, or placed superstition, occult practices, money, status or pleasure in God’s place? Worship: Have I deliberately neglected the worship I knew I owed God, or treated Sunday as though God had no claim on my life? Family and authority: Have I failed gravely in duties towards parents, spouse, children, dependants, employers, employees or legitimate authority? Life and charity: Have I seriously harmed another person, nourished hatred, refused reasonable forgiveness, abused alcohol or drugs, or endangered myself or others? Chastity: Have I deliberately used another person sexually, been unfaithful, used pornography, or chosen sexual acts contrary to chastity? Justice: Have I stolen, cheated, exploited, withheld what was due, damaged property, or refused restitution where I could make it? Truth: Have I lied seriously, damaged another’s reputation, betrayed confidences, or manipulated truth for selfish advantage? Desire: Have envy, greed, resentment or disordered desire become patterns that I knowingly feed rather than resist?</p>\n<p>17</p>\n<h4>APPENDIX B - CONTINUED</h4>\n<p>What happens in Confession</p>\n<ol><li>Begin: Make the Sign of the Cross and tell the priest that you are a candidate for reception and this is your first Catholic Confession.</li><li>Confess: State your sins honestly and simply. Ask if you are unsure whether something needs explaining.</li><li>Listen: The priest may offer brief counsel and will give a penance.</li><li>Contrition: Express sorrow for sin in an Act of Contrition or in your own suitable words.</li><li>Absolution: The priest gives sacramental absolution. Listen and receive Christ’s forgiveness with faith.</li><li>Penance: Complete the penance as soon as reasonably possible and make restitution where justice requires it.</li></ol>\n<h4>THE SEAL</h4>\n<p>The sacramental seal is absolute. A priest may never disclose what you confess in the sacrament.</p>\n<h4>AFTER CONFESSION</h4>\n<p>Do not keep reopening sins that were honestly confessed and absolved because you later remember an insignificant detail. If you later remember a mortal sin that you genuinely forgot, mention it at your next Confession without panic.</p>\n<p>18</p>\n<h4>APPENDIX C</h4>\n<p>The Rite of Reception: Step by Step</p>\n<p>This is a guide, not a script. The approved liturgical book and the priest govern the actual celebration.</p>\n<p>Part What it means</p>\n<p>The parish has established valid Baptism, freedom and Before the readiness; Confession has normally been celebrated; celebration Confirmation status has been clarified; the candidate and sponsor know where to stand.</p>\n<p>Depending on the celebration, the candidate may join the Renewal of community in renewing baptismal promises, recalling the baptismal faith Baptism already received.</p>\n<p>The candidate freely makes the profession required by Profession of the rite: “I believe and profess all that the holy Catholic Catholic faith Church believes, teaches, and proclaims to be revealed by God.”</p>\n<p>Act of reception The priest formally receives the candidate into the full communion of the Catholic Church.</p>\n<p>If the candidate has not already received valid Confirmation, if Confirmation, Confirmation normally follows. The priest needed who receives the candidate has the faculty in law to confirm the person he receives.</p>\n<p>The celebration continues to the Eucharist. Sharing Holy Holy Eucharist Communion with the Catholic community is the sacramental high point of reception into full communion.</p>\n<p>The newly received Catholic continues in Sunday Mass, prayer, Confession, formation, parish life and mission. Afterwards Reception is the start of ordinary Catholic discipleship, not its completion.</p>\n<h4>EASTER OR ANOTHER SUITABLE TIME</h4>\n<p>Reception may be celebrated at the Easter Vigil when pastorally appropriate, but already baptised candidates are not to be treated as though they were catechumens. The form and timing should respect the person’s previous Christian life, readiness, family circumstances and local diocesan practice.</p>\n<p>19</p>\n<h4>APPENDIX D</h4>\n<p>Things to Know Clearly</p>\n<p>You do not need a theological examination. You should, however, be able to explain these truths honestly in ordinary words.</p>\n<ol><li>What is full communion? Visible communion in the Catholic faith, sacramental life and ecclesiastical governance.</li><li>Is my valid Baptism repeated? No. There is one Baptism, and its sacramental character is permanent.</li><li>What are Scripture and Tradition? Two inseparably connected modes by which the one apostolic faith is handed on.</li><li>What is the Magisterium? The living teaching office of the Pope and bishops in communion with him.</li><li>Who is God? The one God: Father, Son and Holy Spirit.</li><li>Who is Jesus Christ? The eternal Son made man, true God and true man, who died and rose for our salvation.</li><li>What are the four marks of the Church? One, holy, catholic and apostolic.</li><li>What is the Pope’s role? He is Bishop of Rome and successor of St Peter, serving the unity and faith of the universal Church.</li><li>How many sacraments are there? Seven.</li><li>Which sacraments form Christian initiation? Baptism, Confirmation and the Eucharist.</li><li>What is the Eucharist? The sacrament in which Christ is truly present and gives us his Body and Blood.</li><li>What is transubstantiation? The change of the whole substance of bread and wine into Christ’s Body and Blood while the appearances remain.</li><li>What is the Mass? The sacramental making-present of Christ’s one sacrifice, the Church’s supreme act of worship and the Eucharistic banquet.</li><li>What is Confession? The sacrament in which Christ forgives post-baptismal sins through the ministry of the priest.</li><li>What is mortal sin? Grave sin committed with sufficient knowledge and deliberate consent.</li><li>Do Catholics worship Mary and the saints? No. God alone is adored; saints are honoured and asked to pray for us.</li><li>What is purgatory? The final purification of those who die in God’s grace but are not yet perfectly purified.</li><li>Are we saved by our own works? No. Salvation is grace; living faith cooperates with grace and bears fruit in love and good works.</li><li>What is conscience? The judgement of reason about the moral quality of a concrete act; it must be formed in truth.</li><li>What is the centre of ordinary weekly Catholic life? Sunday Mass.</li><li>What does reception require of belief? A sincere profession of the Catholic faith as a whole, not a private selection of preferred doctrines.</li><li>What if I have a question after reception? Keep learning. Catholic faith seeks understanding throughout life.</li><li>What is the Christian mission? To worship God, become holy, love neighbour and bear witness to Christ in the Church and the world.</li><li>What is the goal of Christian life? Union with the Triune God in holiness and eternal life.</li></ol>\n<p>20</p>\n<h4>APPENDIX E</h4>\n<p>Common Questions from Other Christian Traditions</p>\n<p>Do Catholics believe non-Catholic Christians are not Christians? No. Those validly baptised and believing in Christ are truly joined to him and share a real, though imperfect, communion with the Catholic Church.</p>\n<p>Am I expected to say that everything in my former church was wrong? No. Give thanks for what was true and holy. Reception means accepting the fullness of Catholic faith, not denying every grace received before.</p>\n<p>Why not “Bible alone”? Because the apostolic faith was transmitted both in inspired Scripture and in the living apostolic Tradition, and the Church preceded and discerned the New Testament canon.</p>\n<p>Why do Catholics need a Pope? Catholics believe Christ gave Peter a distinctive pastoral role and that the Petrine ministry continues in the Bishop of Rome as a visible service of unity and faith.</p>\n<p>Is every papal statement infallible? No. Infallibility has defined conditions. The Pope can make prudential judgements, personal remarks or disciplinary decisions that are not infallible definitions.</p>\n<p>Why confess sins to a priest? Because Christ gave the apostles and their successors a real ministry of reconciliation. The priest is the sacramental minister; God is the source of forgiveness.</p>\n<p>Why pray to Mary and saints if Jesus is the one mediator? All Christian prayer and intercession depends entirely on Christ’s unique mediation. Asking another member of Christ’s Body to pray for us does not create a rival mediator.</p>\n<p>Why use statues, icons and relics? Catholics do not believe wood, plaster or relics are gods. Sacred images direct the mind to Christ and his saints; honour shown to an image is not adoration of the material object.</p>\n<p>Why call the Mass a sacrifice if Jesus died once? Because the one sacrifice of Calvary is made sacramentally present; Christ is not crucified again.</p>\n<p>What about “faith alone” and works? Catholics affirm that justification is entirely by God’s grace. The faith that receives grace is called to become living faith expressed in love, obedience and works made possible by grace.</p>\n<p>Is purgatory a second chance to be saved? No. It is purification for those who die already in God’s grace and assured of salvation.</p>\n<p>Why can I not normally receive Communion before reception? Because Eucharistic Communion expresses full visible communion in the Church’s faith, sacraments and pastoral governance as well as personal faith in Christ.</p>\n<p>Must I believe every apparition or private revelation? No. Private revelations do not belong to the deposit of faith. Even approved ones are not placed on the same level as Scripture and apostolic Tradition.</p>\n<p>Can Catholics have legitimate differences of opinion? Yes, on many prudential, political, theological and devotional questions. Full communion does not require identical tastes; it does require faithful acceptance of what the Church definitively teaches in faith and morals.</p>\n<p>21</p>\n<h4>APPENDIX F</h4>\n<p>Readiness Conversation</p>\n<p>This is not a pass/fail examination. It is a pastoral conversation about whether you can make the profession of faith freely, honestly and fruitfully.</p>\n<p>Area Readiness looks like Do not require</p>\n<p>A valid Christian Baptism has been established, or A second Baptism “just to Baptism any genuine doubt has been resolved according to be safe”. Church law.</p>\n<p>You freely ask for full communion and understand that Pressure from family, Free intention</p>\n<p>You understand the main shape of Catholic faith and Perfect theological are prepared sincerely to profess what the Catholic Catholic faith vocabulary or the absence Church believes, teaches and proclaims as revealed of every question. by God.</p>\n<p>You understand Scripture, Tradition and the Knowing every canonical Authority Magisterium and accept the Church’s teaching distinction. authority.</p>\n<p>You understand Baptism, Confirmation, Penance, the Academic sacramental Sacramental faith Eucharist and the Mass at a level proportionate to theology. your capacity and background.</p>\n<p>You intend to live according to Catholic moral A claim that you will never Moral life teaching and are honest about areas requiring sin again. conversion or pastoral help.</p>\n<p>Marriage history and any other canonical situation An idealised personal State of life affecting sacramental life have been honestly history. discussed and appropriately resolved.</p>\n<p>You have been prepared for Confession and normally Scrupulous recall of every Penance celebrate it before reception. venial fault.</p>\n<p>The parish has established whether valid Confirmation Confirmation/Chrismation has already been received Automatic re-Confirmation. and what is required at reception.</p>\n<p>A polished public Catholic practice Sunday Mass, prayer and parish belonging are becoming ordinary parts of your life. testimony.</p>\n<p>Sponsor and A suitable sponsor or other Catholic support is in A sponsor chosen only for support place as appropriate. social reasons.</p>\n<p>Self-certification by Questions have been brought honestly to the priest, Pastoral completing pages or who makes the final judgement of readiness judgement attending a fixed number according to Church law and diocesan practice. of meetings.</p>\n<p>IF YOU CANNOT YET PROFESS SOMETHING Do not conceal the difficulty and do not force a deadline. Name the teaching clearly, ask what the Church actually means, and continue the conversation. Honest delay is better than a profession made with a private reservation you know you cannot accept.</p>\n<p>22</p>\n<h4>APPENDIX G</h4>\n<p>A Simple Rule of Catholic Life</p>\n<p>Begin small. The purpose is steady discipleship, not a burdensome private programme.</p>\n<p>Rhythm A simple practice</p>\n<p>Participate at Mass unless excused for a serious reason; prepare for Every Sunday Communion and make thanksgiving afterwards.</p>\n<p>Make the Sign of the Cross; offer the day to God; read a short Daily passage of Scripture; pray briefly morning and evening.</p>\n<p>Receive the Sacrament of Penance; do not wait for a crisis before Regularly returning to mercy.</p>\n<p>Live Advent, Christmas, Lent and Easter with the Church; observe During the year days of fasting and abstinence according to Church law.</p>\n<p>Keep a Catechism or reliable Catholic source available. When a Learn question arises, look for the Church’s actual teaching before arguing with a caricature.</p>\n<p>Know people in the parish. Do not make Catholic life only a private Belong relationship with the priest.</p>\n<p>Practise concrete charity in family, parish and community. Ask Serve where your gifts can serve others.</p>\n<p>With money and Give responsibly, live justly, avoid greed and remember the poor. possessions</p>\n<p>Repent, go to Confession when needed, repair harm where possible When you fail and begin again.</p>\n<p>For Christian unity Pray for other Christians, speak about them with charity and bear witness to Catholic faith without contempt or triumphalism.</p>\n<h4>A PRAYER AFTER RECEPTION</h4>\n<p>Lord Jesus Christ, thank you for leading me into the full communion of your Church. Keep me faithful in the Eucharist, humble in Confession, attentive to your Word, obedient in faith and generous in charity. Make my life a witness to the unity and holiness you desire for all your people. Amen.</p>\n<p>23</p>\n<h4>APPENDIX H</h4>\n<p>Sources and Parish Authority</p>\n<p>This parish booklet is a concise doctrinal and pastoral guide. It does not replace the approved liturgical books, canon law, diocesan norms or the pastoral judgement of the priest.</p>\n<p>Primary sources Sacred Scripture, especially Matthew 16:13-20; Matthew 28:18-20; John 6; John 17; John 20:19-23; Acts 2:42; Romans 6; 1 Corinthians 10-11; Ephesians 4; 2 Thessalonians 2:15; 1 Timothy 3:15. Catechism of the Catholic Church: especially nos. 74-141 (Revelation, Scripture and Tradition); 422-682 (Christ); 683-1065 (Holy Spirit, Church, Mary and last things); 1076-1690 (sacramental life); 1691-2557 (moral life and prayer). Code of Canon Law: especially canons 204-205 (full communion); 842-845 (sacraments and Baptism); 879-896 (Confirmation); and other canons applicable to the individual candidate’s circumstances. Rite of Christian Initiation of Adults / Rite of Reception into the Full Communion of the Catholic Church, including the provisions for already baptised candidates and the approved texts in force in England and Wales. Order of Confirmation and the Roman Missal as currently approved for use in England and Wales. Second Vatican Council: Lumen gentium, Unitatis redintegratio, Dei Verbum and Orientalium Ecclesiarum. Current diocesan policy and the directions of the parish priest govern local arrangements, records, timing, sponsors and individual pastoral cases. Rev. Joseph Deharbe, S.J., Full Catechism of the Catholic Religion (historical catechetical reference only). Current doctrine is read in continuity with the Church’s living Magisterium; current law and liturgical discipline are taken from the present approved sources.</p>\n<p>SPECIAL NOTE FOR EASTERN CHRISTIANS A baptised Christian from an Eastern Church must not simply be treated as a Western Protestant candidate. The Catholic Church respects valid Eastern sacraments and the person’s proper Eastern ecclesial heritage. The priest should establish the correct Church sui iuris and reception procedure with diocesan or competent Eastern Catholic guidance before the rite is arranged.</p>\n<h4>PASTORAL STANDARD</h4>\n<p>The candidate should be able to make the Catholic profession of faith freely and sincerely, approach the sacraments with proper disposition, and begin ordinary Catholic life. Readiness is not perfect memory, a polished testimony or the elimination of every future question.</p>\n<p>24</p></div></details>\n<h2>Profession Reception Confirmation and Eucharist</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How is a question seeking understanding different from a teaching you knowingly reject?”</li><li>“What will help you continue Catholic life after the celebration?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What faith do you profess? The Catholic faith as a whole, freely and sincerely. What normally follows? Reception, Confirmation if needed, and sharing fully in the Eucharist. Who judges readiness? The priest, following the Church’s rite, law and diocesan directions.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, give me faith to profess your truth freely, humility to keep learning and charity to live in full communion with your Church. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use Appendix F with the priest. Name any point you cannot yet profess sincerely and confirm how accompaniment will continue afterwards.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not rehearse past a difficulty the candidate cannot honestly resolve. Reception need not await a fixed annual course or treat the person as a catechumen. The priest establishes the appropriate rite and timing and clarifies previous Confirmation or Eastern chrismation.</p>\n<h2>The journey at a glance</h2>\n<p>Use this to explain the pathway, not to promise a timetable. The priest directs particular circumstances and the approved celebration.</p>\n<h3>Baptism and pastoral circumstances</h3>\n<p>Use Appendix A early. Establish Baptism, previous Catholic status, Confirmation or chrismation, Eastern Christian background, marriage history and participation needs.</p>\n<h3>Formation and belonging</h3>\n<p>Work through the conversations at the person’s pace. Join Sunday Mass, pray, ask honest questions and develop parish relationships.</p>\n<h3>Readiness and free profession</h3>\n<p>Use Appendix F with the priest. Seek sufficient understanding and sincere acceptance of Catholic faith, with a real intention to live it.</p>\n<h3>Sacrament of Penance</h3>\n<p>Prepare privately and normally celebrate Confession before Reception. Use Appendix B and the priest’s guidance.</p>\n<h3>Reception and sacramental communion</h3>\n<p>Make the approved profession. Reception is followed by Confirmation if needed and participation in the Eucharist.</p>\n<h3>Continuing Catholic life</h3>\n<p>Maintain Sunday Mass, prayer, Confession, charity, formation and parish belonging. Arrange accompaniment after Reception.</p>\n<h3>A DISTINCT PATHWAY</h3>\n<p>The already baptised candidate is not a catechumen. Do not repeat valid Baptism or add rites proper to the unbaptised. Reception may take place at Easter or another suitable time as the priest directs.</p>\n<h2>Readiness in faith and freedom</h2>\n<p>Use with Appendix F for a calm conversation. These prompts help the mentor accompany discernment; they do not certify readiness.</p>\n<h3>FREE INTENTION</h3>\n<p>The person freely seeks full communion and understands that this is a real commitment to Catholic faith and life.</p>\n<h3>CATHOLIC FAITH</h3>\n<p>The person understands the central truths according to capacity and background and can sincerely accept the Catholic faith as a whole.</p>\n<h3>AUTHORITY</h3>\n<p>Scripture, Apostolic Tradition and the Magisterium are understood sufficiently for a free acceptance of the Church’s teaching authority.</p>\n<h3>REAL QUESTIONS</h3>\n<p>Difficulties are named honestly. Questions seeking understanding are welcomed; known rejection of a doctrine to be professed needs attention before Reception.</p>\n<h3>CONVERSION</h3>\n<p>The person intends to live Catholic moral teaching, seeks grace and is honest about areas requiring conversion or pastoral help.</p>\n<h3>WHEN MORE TIME IS NEEDED</h3>\n<p>Name the teaching clearly, read what the Church actually means and continue accompaniment. Do not force a date or encourage a profession made with a reservation the person knows they cannot accept.</p>\n<h2>Readiness in sacramental life</h2>\n<h3>THE PATHWAY IS ESTABLISHED</h3>\n<p>The priest has clarified Baptism, previous Catholic status, Eastern Christian background and what Confirmation is required.</p>\n<h3>PASTORAL MATTERS</h3>\n<p>Marriage history and other canonical matters affecting sacramental life have been discussed with the priest and appropriately addressed.</p>\n<h3>SACRAMENTAL FAITH</h3>\n<p>The candidate understands Baptism, Confirmation, Penance, the Eucharist and the Mass in ordinary words according to capacity.</p>\n<h3>PENANCE</h3>\n<p>The person is prepared for Confession and normally celebrates it before Reception, with suitable private guidance.</p>\n<h3>PRACTICE AND SUPPORT</h3>\n<p>Sunday Mass, prayer and parish belonging are developing. Suitable sponsor or Catholic support and any practical adaptations are arranged.</p>\n<h3>CONTINUING LIFE</h3>\n<p>There is a realistic plan for Catholic life and accompaniment after Reception, including a further meeting.</p>\n<p>Readiness is not perfect memory, a polished testimony or a claim never to sin again. The priest makes the final pastoral judgement following the approved rite, Church law and diocesan direction.</p>\n<h2>Practical preparation with the mentor</h2>\n<h3>Confession</h3>\n<p>Read Appendix B privately. Practise the opening and the Act of Contrition, using only invented cases for discussion. The priest will help with the real confession. A mentor never asks for an account of what was confessed.</p>\n<h3>Profession and movements</h3>\n<p>Read Appendix C with the priest. Make sure the candidate understands the profession and knows where to stand with the sponsor. Practise the spoken responses and movements only; leave sacramental actions to the real celebration.</p>\n<h3>Receiving Holy Communion</h3>\n<p>Practise the response “Amen” and the approved parish manner of receiving. The Sacred Host is consumed immediately. The ordinary Eucharistic fast is one hour before receiving Communion, except water and medicine; ask the priest about illness or any relevant exemption.</p>\n<p>Prepare for worthy reception in a state of grace. Anyone conscious of mortal sin should normally receive sacramental absolution before Communion. Refer questions about swallowing, gluten, mobility or other adaptations to the priest early.</p>\n<h3>A PRAYER OF THANKSGIVING</h3>\n<p>Lord Jesus, thank you for giving yourself to me. Keep me close to you, strengthen me in charity and make my life a faithful offering to the Father. Amen.</p>\n<h3>CONFIRM THE NEXT MEETING</h3>\n<p>Before the celebration, agree when the mentor and newly received Catholic will meet again. Give continuing parish support a person, a place and a practical next step.</p>\n<h2>The Apostles’ Creed</h2>\n<p>Use for learning and prayer alongside Conversation 3. The approved rite supplies the profession and responses used at Reception. I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.</p>\n<p>I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.</p>\n<h3>Pray with understanding</h3>\n<p>Pause where a phrase needs attention. “He descended into hell” here refers to Christ’s descent to the realm of the dead. Bring a real question to the mentor or priest rather than hiding it.</p>\n<h2>Prayers for ordinary life</h2>\n<h3>The Sign of the Cross</h3>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<h3>The Our Father</h3>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<h3>The Glory Be</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>An Act of Contrition</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>A morning offering</h3>\n<p>Father, I offer you this day through Jesus Christ. Guide my words, work and choices. Help me love you and serve my neighbour. Amen.</p>\n<h3>An evening prayer</h3>\n<p>Father, thank you for your gifts today. Forgive my failures, show me how to begin again and keep me in your peace. Amen.</p>\n<h2>After Reception</h2>\n<p>Use Appendix G with the newly received Catholic. Ask how the sacraments and parish belonging are shaping ordinary life; do not require a dramatic emotional experience.</p>\n<h3>Sunday and daily prayer</h3>\n<p>Keep Sunday Mass at the centre. Continue a small, faithful pattern of prayer and Scripture, supported by the parish and the printed prayers here.</p>\n<h3>Mercy and conversion</h3>\n<p>Receive Confession regularly, repair harm where possible and begin again when needed. Seek guidance about worthy Communion rather than withdrawing into anxiety.</p>\n<h3>Belonging and service</h3>\n<p>Name parish people who can offer friendship and one realistic way to serve. Include family, work, money and care for the vulnerable in Christian charity.</p>\n<h3>Learning and Christian unity</h3>\n<p>Continue formation and bring new questions. Pray for other Christians and speak with gratitude and charity about earlier Christian life.</p>\n<h3>PRAY AFTER RECEPTION</h3>\n<p>Lord Jesus Christ, thank you for leading me into the full communion of your Church. Keep me faithful in the Eucharist, humble in Confession, attentive to your Word and generous in charity. Make my life a witness to your unity and holiness. Amen.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Keep the next meeting. Review one grace, one question and one practical need. Accompaniment continues through real relationships, prayer and ordinary Catholic life.</p>\n<h2>Final word for the mentor</h2>\n<p>Let the candidate bring a real question. Use the activity to make the teaching concrete, then open the preparation book for the Catholic answer. Listen for understanding that is becoming faith, prayer and a changed life.</p>\n<h3>KEEP THE PERSON IN VIEW</h3>\n<p>Welcome what is already known and lived. Explain what needs clarification, recognise sincere growth and give time for questions. Preparation should help the candidate make a profession that is freely and honestly meant.</p>\n<h3>KEEP THE NEXT STEP CONCRETE</h3>\n<p>End with one action the person can realistically take: a prayer, a conversation with the priest, Sunday Mass, a work of charity or a question to revisit. Begin the next meeting by asking how it went.</p>\n<h3>CONTINUE THE RELATIONSHIP</h3>\n<p>After Reception, help the new Catholic belong to the parish, grow in sacramental life and remain open to learning. Friendship, prayer and steady encouragement matter beyond the celebration.</p>\n<h3>When a question needs help</h3>\n<p>Use the preparation book to establish what the Church teaches. Bring an unresolved doctrinal difficulty to the priest. Canonical questions, personal marriage circumstances and private sins belong with him in an appropriate confidential setting.</p>\n<h2>References for the priest and mentor</h2>\n<p>This guide follows the twelve conversations of Coming into Full Communion A Catholic Preparation Book for Baptised Christians. Use that book for the full teaching and its appendices for particular questions.</p>\n<h3>Appendix A</h3>\n<p>Baptism, previous Catholic status, Confirmation or chrismation, Eastern Christian background, marriage history and participation needs.</p>\n<h3>Appendices B and C</h3>\n<p>Private preparation for Confession and the outline of Reception.</p>\n<h3>Appendices D and E</h3>\n<p>Central truths to understand and common questions from other Christian traditions.</p>\n<h3>Appendices F and G</h3>\n<p>Readiness and a simple rule of continuing Catholic life.</p>\n<h3>Appendix H</h3>\n<p>Primary sources, ecclesial authority and particular care for Eastern Christians.</p>\n<h3>Primary Church sources</h3>\n<p>Catechism of the Catholic Church, especially the sections on revelation, the Church, sacramental life, moral life and prayer.</p>\n<p>Code of Canon Law, especially canons 204–205, 842–845, 879–896, 916 and 919. The approved Rite of Reception, Order of Confirmation and Roman Missal govern the celebration in England and Wales.</p>\n<p>The preparation book’s Appendix H supplies fuller references. Current diocesan direction and the priest’s pastoral judgement govern each person’s actual pathway and readiness. This guide supplies activities and accompaniment, not a substitute liturgical rite.</p>"}, {"name": "Adult Confirmation", "url": "https://3stepuk.github.io/Adult-Confirmation/", "desc": "For baptised Catholics preparing for Confirmation as adults.", "html": "<p>For mentors accompanying baptised Catholic adults</p>\n<h3>USE BESIDE THE PREPARATION BOOK</h3>\n<p>Use with Preparing for Adult Confirmation Catholic Preparation Companion. The book supplies the Catholic teaching. This guide helps a mentor or sponsor make that teaching concrete, listen to the adult’s questions and encourage a faithful response.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the person</li><li>Do something concrete</li><li>Open the preparation book</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>ALREADY BAPTISED AND ALREADY CATHOLIC</h3>\n<p>This pathway is for a Catholic adult who has not yet been confirmed. Confirmation strengthens baptismal grace and Christian witness. The priest checks the sacramental record and arranges the celebration with the bishop or a priest who has the required faculty.</p>\n<h2>How to use this guide</h2>\n<h3>BEGIN WITH AN ADULT CHRISTIAN LIFE</h3>\n<p>The candidate already belongs to Christ through Baptism. Welcome the faith and experience already present. Help the person understand the gift of Confirmation and receive it freely, with a real intention to live as a Catholic disciple.</p>\n<h3>For each conversation</h3>\n<ol><li>Make the Sign of the Cross and pray Come Holy Spirit, printed near the end. Ask the opening question and listen.</li><li>Try the activity together. Cards can be handwritten as you meet; every activity can also be spoken.</li><li>Open the matching conversation in the preparation book. Read REMEMBER and the teaching slowly, pausing for questions.</li><li>Talk together. Check the central truth, then use THE ESSENTIALS in the book. Seek understanding in ordinary words.</li><li>Pray the printed prayer and choose one realistic action. Return to it at the next meeting.</li><li>Repeat, combine or divide conversations as needed. Twelve conversations are not twelve compulsory meetings. Readiness governs progress.</li></ol>\n<h3>Simple materials</h3>\n<p>The preparation book, this guide, paper and a pen are enough. Church visits and a crucifix are optional. No prepared talk, craft kit or internet search is needed. Activities are conversation helps, not tasks to hand in.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen, pray, explain simply and help the person belong in the parish. Use the preparation book for the teaching. Ask the priest about unresolved doctrine, sacramental record
