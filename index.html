of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.</p>\n<p>The Ten Commandments</p>\n<ol><li>I am the Lord your God: you shall not have strange gods before me.</li><li>You shall not take the name of the Lord your God in vain.</li><li>Remember to keep holy the Lord&#x27;s Day.</li><li>Honour your father and your mother.</li><li>You shall not kill.</li><li>You shall not commit adultery.</li><li>You shall not steal.</li><li>You shall not bear false witness against your neighbour.</li><li>You shall not covet your neighbour&#x27;s wife.</li><li>You shall not covet your neighbour&#x27;s goods.</li></ol>\n<p>The Beatitudes</p>\n<p>Jesus teaches:</p>\n<p>The poor in spirit receive the kingdom of heaven. Those who mourn will be comforted. The meek will inherit the earth. Those who hunger and thirst for righteousness will be satisfied. The merciful will receive mercy. The pure in heart will see God. The peacemakers will be called children of God. Those persecuted for righteousness possess the kingdom of heaven.</p>\n<p>The Precepts of the Church</p>\n<p>The precepts name the minimum pattern of Catholic sacramental life. Catholics are to:</p>\n<p>participate in Mass on Sundays and holy days of obligation and rest from unnecessary servile work; confess serious sins at least once a year; receive Holy Communion at least during the Easter season; observe the days of fasting and abstinence established by the Church; and help provide for the needs of the Church according to their ability.</p>\n<p>26 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Appendix G</p>\n<p>Summary Catechism</p>\n<ol><li>Why did God make you? God made me to know him, love him and serve him in this life, and to be happy with him for ever in heaven.</li><li>Who is the Most Holy Trinity? The Father, the Son and the Holy Spirit: three divine Persons in one God.</li><li>Who is Jesus Christ? Jesus Christ is the eternal Son of God made man.</li><li>How did Jesus redeem us? By his suffering, death and Resurrection.</li><li>What did valid Baptism give you? It forgave sin, gave sanctifying grace, united me to Christ and made me a child of God.</li><li>Can Baptism be repeated? No. Valid Baptism can never be repeated.</li><li>What are Scripture and Tradition? The one word of God handed on in written and living form.</li><li>What are the four marks of the Church? One, holy, catholic and apostolic.</li><li>What does full communion include? Catholic faith, the Sacraments and communion with the Pope and bishops.</li><li>What is prayer? Lifting our minds and hearts to God.</li><li>What do the Commandments teach? They teach us to love God and our neighbour.</li><li>What is mortal sin? A grave offence committed with full knowledge and deliberate consent.</li></ol>\n<p>27 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Summary Catechism - continued</p>\n<ol><li>What is Confession? The Sacrament in which Christ forgives sins through the ministry of the priest.</li><li>What must we confess? All remembered mortal sins after a careful examination; venial sins may also be confessed.</li><li>What is the Mass? The sacramental making-present of Christ&#x27;s one Sacrifice of Calvary and the sacred Eucharistic banquet.</li><li>Whom do we receive in Holy Communion? Jesus Christ, Body, Blood, Soul and Divinity.</li><li>What is transubstantiation? The change of the whole substance of bread and wine into the Body and Blood of Christ.</li><li>What do you profess at Reception? All that the holy Catholic Church believes, teaches and proclaims to be revealed by God.</li><li>What does Confirmation give? A special outpouring of the Holy Spirit that strengthens and seals baptismal grace.</li><li>Name the seven gifts of the Holy Spirit. Wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</li><li>What does “Amen” before Communion mean? I believe that this is the Body of Christ.</li><li>How long is the Eucharistic fast? One hour before Holy Communion, except for water and medicine.</li><li>What remains after Reception? A lifelong Catholic life of Mass, Sacraments, prayer, faith, charity and mission.</li></ol>\n<p>28 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Appendix H</p>\n<p>Readiness and Parish Guide</p>\n<p>Readiness does not mean perfect memory or mature theological language. It means a sincere personal desire, sufficient understanding according to capacity, developing conversion, Sunday worship and a real beginning of Catholic life.</p>\n<p>Area What readiness looks like Ready</p>\n<p>Reliable evidence establishes a valid Christian Baptism; Baptism any doubt or Eastern affiliation has been resolved by the priest.</p>\n<p>The child personally wishes to become Catholic and is not Free desire being forced or pressured.</p>\n<p>Faith in The child knows the central Gospel and believes in Jesus Christ Christ as true God, true man and Saviour.</p>\n<p>According to capacity, the child accepts the Trinity, Catholic faith Scripture and Tradition, the Creed, the Church and the moral life.</p>\n<p>Full The child understands the Profession of Faith and wishes communion to enter communion with the Catholic Church.</p>\n<p>The child understands sin, contrition, confession and Confession absolution and can make a simple, private Confession.</p>\n<p>The child understands the Holy Spirit, sacred chrism, the Confirmation sacramental seal and Christian witness.</p>\n<p>The child distinguishes the Body of Christ from ordinary Eucharist food and believes the Real Presence.</p>\n<p>The child and family have begun a stable pattern of Sunday Sunday life Mass and parish belonging.</p>\n<p>Practical The child can make the Profession of Faith and receive the readiness Sacraments reverently with suitable adaptations.</p>\n<p>The family understands that formation, Mass, Confession, Perseverance Communion, prayer and parish life continue afterwards.</p>\n<p>29 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Parish working checklist</p>\n<p>Obtain the baptismal certificate or reliable evidence; investigate matter, form and intention if validity is uncertain. Confirm the child&#x27;s canonical status. A child baptised Catholic is not received into full communion, and an Eastern Christian may belong to a Catholic Church sui iuris upon reception. Confirm parental consent, the child&#x27;s free desire and any relevant questions of parental responsibility. Record the child&#x27;s full sacramental history, including any previous Confirmation or chrismation. Appoint a suitable sponsor and verify that the person fulfils the Church&#x27;s requirements. Arrange First Confession before Reception, preserving the child&#x27;s privacy and freedom. Discern readiness personally; do not make completion of pages or a fixed date the sole criterion. Use the approved rite for Reception into Full Communion; do not improvise liturgical wording or actions. Confirm the priest&#x27;s faculty and obligation to administer Confirmation when he receives the child, unless competent authority directs otherwise. Prepare the child for worthy First Holy Communion and any necessary medical or accessibility arrangements. Enter Reception, Confirmation and First Holy Communion correctly in parish records and notify the place of Baptism as required. Arrange Mystagogy and continuing family and parish accompaniment after the celebration.</p>\n<h4>SAFEGUARDING</h4>\n<p>Preparation must respect the child&#x27;s dignity, capacity, privacy and safety. No child should be shamed, frightened, publicly tested or pressured to receive a Sacrament. Follow current Diocese of Nottingham safeguarding policy and parish procedures.</p>\n<p>30 Page</p>\n<h4>COMING INTO THE CATHOLIC CHURCH</h4>\n<p>Sources and doctrinal references</p>\n<p>Sacred Scripture. Short quotations and references follow the English Standard Version - Catholic Edition.</p>\n<p>Catechism of the Catholic Church. Especially nos. 74-100, 811-870, 1210-1419, 1420-1498 and 1691-2557.</p>\n<p>Compendium of the Catechism of the Catholic Church. The profession of faith, the Sacraments, Christian morality and prayer.</p>\n<p>Second Vatican Council. Lumen gentium and Unitatis redintegratio on the Church, Christian unity and the real bonds created by Baptism.</p>\n<p>Code of Canon Law. Especially canons 11, 96, 205, 840-845, 883-885, 889-891, 912-919 and 987-991.</p>\n<p>Rite of Christian Initiation of Adults. The approved rite for Reception of Baptised Christians into the Full Communion of the Catholic Church.</p>\n<p>Liturgy Office of England and Wales. Guidance concerning Reception, Confirmation and Eucharist in the celebration of Christian initiation.</p>\n<p>Diocese of Nottingham. Current sacramental, liturgical and safeguarding direction.</p>\n<p>Traditional catechetical sources. Definitions informed by the Roman Catechism, the Baltimore tradition and Joseph Deharbe, adapted to current terminology and discipline.</p>\n<p>Doctrinal and canonical standard</p>\n<p>Valid Baptism is never repeated. A baptised Christian received into full communion makes the Catholic Profession of Faith. A priest who, by virtue of office or diocesan mandate, admits a baptised person into full communion possesses the faculty to confirm that person and is to use it for the person&#x27;s sake.</p>\n<p>A baptised candidate should be prepared for sacramental Confession before Reception. Reception, Confirmation and First Holy Communion are ordinarily celebrated together according to the approved rite. Particular cases, especially Eastern Christians, doubtful Baptisms, previous Confirmation or complex family circumstances, must be referred to competent authority.</p>\n<p>Where terminology, liturgical books or practical instructions change, the current approved rites, the law of the Church, Diocese of Nottingham policy and the directions of the parish priest govern.</p>\n<p>31 Page</p></div></details>\n<h2>Living in Full Communion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Which habit will be easiest? Which will need help?”</li><li>“How could you share your faith kindly at home or school?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is Reception the end of formation? No. Catholic life and learning continue. What stays at the centre? Sunday Mass and worthy Holy Communion. How do we bear witness? By truth, holiness, charity, service and sharing the faith.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, keep me faithful to your Catholic Church. Help me worship you, receive the Sacraments worthily and serve you throughout my life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Begin the simple rule of life now. Ask an adult to help you keep it after Reception.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Make continuing support concrete. Confirmation has strengthened the child for mission; it is not a future course to be added to this ordinary pathway. Keep space for questions, repentance and fresh beginnings.</p>\n<h2>The journey at a glance</h2>\n<p>Use this as an overview, not a timetable. Preparation recognises Christian life already begun in Baptism.</p>\n<h3>Enquiry and Baptism established</h3>\n<p>Meet the priest. Confirm valid Baptism, sacramental history and the correct pathway.</p>\n<h3>Formation and parish belonging</h3>\n<p>Grow in Catholic faith, prayer, conversion and participation at Sunday Mass.</p>\n<h3>Discernment of readiness</h3>\n<p>Child, family, sponsor, mentor and priest consider free desire and understanding according to capacity.</p>\n<h3>First Confession</h3>\n<p>The already baptised child receives the Sacrament of Penance before Reception, as arranged with the priest.</p>\n<h3>Profession of Faith and Reception</h3>\n<p>The child freely professes the Catholic faith and is received into full communion.</p>\n<h3>Confirmation and Holy Communion</h3>\n<p>Confirmation, if not already validly received, and First Holy Communion ordinarily follow within the same Mass.</p>\n<h3>Mystagogy and continuing life</h3>\n<p>Reflect on the sacraments received and continue Mass, prayer, Confession, charity and formation.</p>\n<h3>A BAPTISED CANDIDATE</h3>\n<p>This child is not a catechumen. Do not add the rites proper to the unbaptised or repeat valid Baptism. The priest directs any particular circumstances.</p>\n<h2>Readiness in faith and freedom</h2>\n<p>Readiness is more than finishing pages. Use these prompts for a calm conversation, with understanding adapted to the child’s capacity.</p>\n<h3>FREE DESIRE</h3>\n<p>The child personally wishes to become Catholic and can speak simply about why, without pressure.</p>\n<h3>FAITH IN CHRIST</h3>\n<p>The child knows Jesus as true God, true man and Saviour, who died and rose again.</p>\n<h3>CATHOLIC FAITH</h3>\n<p>The child accepts the Trinity, Scripture and Tradition, the Creed, the Church and the moral life according to capacity.</p>\n<h3>BAPTISM AND FULL COMMUNION</h3>\n<p>The child knows Baptism is already received and understands that Reception brings full communion in Catholic faith, Sacraments and pastoral life.</p>\n<h3>PROFESSION OF FAITH</h3>\n<p>The child understands what is being professed and can make the profession freely and sincerely.</p>\n<h3>If something needs more time</h3>\n<p>Return to the relevant lesson, welcome the child’s question and discuss it with the priest. Do not turn these points into marks, a public test or a demand for perfect memory.</p>\n<h2>Readiness in sacramental life</h2>\n<h3>CONFESSION</h3>\n<p>The child understands sin, contrition, private confession and absolution, and can approach the priest with suitable support.</p>\n<h3>CONFIRMATION</h3>\n<p>The child understands that the Holy Spirit strengthens baptismal grace for Christian witness and knows the meaning of chrism and the seal.</p>\n<h3>THE EUCHARIST</h3>\n<p>The child distinguishes the Body of Christ from ordinary food and believes Jesus is truly present.</p>\n<h3>SUNDAY LIFE</h3>\n<p>The child and family are developing regular Sunday Mass, prayer and parish belonging.</p>\n<h3>PRACTICAL PARTICIPATION</h3>\n<p>The child can profess faith and receive reverently, with any necessary language, medical or accessibility adaptations.</p>\n<h3>CONTINUING SUPPORT</h3>\n<p>The family and sponsor will help with Mass, prayer, Confession, charity and learning after Reception.</p>\n<p>Final sacramental and canonical discernment belongs to the priest. Use Appendix H of the catechism for the parish working checklist.</p>\n<h2>Final word for the adult alongside</h2>\n<p>The best conversations will not all look the same. Sometimes an activity will help; sometimes one clear sentence and an honest question will be enough. Give the child time to speak and time to grow.</p>\n<h3>KEEP THE ORDER SIMPLE</h3>\n<p>Begin with the person. Use the activity to open the conversation. Read the catechism for the teaching. Talk, pray and choose one next step.</p>\n<h3>DO NOT RUSH</h3>\n<p>Free desire, faith, understanding, conversion, Sunday worship and belonging matter more than reaching a date. Preparation can be repeated or adapted.</p>\n<h3>KEEP CHRIST AT THE CENTRE</h3>\n<p>Help the child grow in friendship with Jesus, receive the Catholic faith freely and live from his Sacraments. Family, sponsor, mentor and parish continue to accompany them.</p>\n<h3>Keep the two pathways clear</h3>\n<p>An unbaptised child prepares for Baptism. This child has already received valid Baptism and prepares for First Confession, Reception, Confirmation and Holy Communion. Honour the grace already given.</p>\n<h2>References for the priest and mentor</h2>\n<p>The lesson order and doctrinal teaching follow Coming into the Catholic Church A Preparation Catechism for Baptised Children. Use its appendices alongside the activities.</p>\n<h3>Appendix A</h3>\n<p>The journey and the distinction between candidates and catechumens.</p>\n<h3>Appendix B</h3>\n<p>First Confession, examination of conscience and privacy.</p>\n<h3>Appendices C and D</h3>\n<p>Profession of Faith, Reception and Confirmation.</p>\n<h3>Appendices E and F</h3>\n<p>Mass, Holy Communion, the Creed and prayers.</p>\n<h3>Appendices G and H</h3>\n<p>Summary catechism, readiness and parish arrangements.</p>\n<h3>Church sources</h3>\n<p>Catechism of the Catholic Church, especially 811–870, 1213–1284, 1285–1321, 1322–1419 and 1422–1498.</p>\n<p>Code of Canon Law, canons 883–885 on Confirmation; 916 and 919 on preparation for Holy Communion.</p>\n<p>Rite of Christian Initiation of Adults, Reception of Baptised Christians into the Full Communion of the Catholic Church, especially introductory paragraphs 391, 394 and 395 in the England and Wales edition.</p>\n<p>The approved liturgical books, current diocesan direction and the parish priest govern the actual celebration. This activity guide supplies conversation and practical preparation; it does not supply a substitute rite.</p>\n<p>Primary texts: vatican.va and liturgyoffice.org.uk/Resources/Rites/RCIA.pdf</p>"}, {"name": "First Confession", "url": "https://3stepuk.github.io/My-First-Confession/", "desc": "For children preparing for their first Confession.", "html": "<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>The existing catechism contains the teaching. This companion gives you simple activities, demonstrations, role-play, questions and prayer so the teaching feels personal and memorable.</p>\n<h2>The basic rhythm</h2>\n<ul><li>Begin with the child, not the page.</li><li>Do one simple activity.</li><li>Open the catechism and read only what helps.</li><li>Talk. Let the child answer before you explain.</li><li>Check that the essential Catholic truth has landed.</li><li>Pray and stop.</li></ul>\n<h3>USE ONE ACTIVITY, NOT EVERYTHING</h3>\n<p>If the child is engaged and the main point is understood, stop. A good ten or fifteen minutes is better than a long formal lesson.</p>\n<p>Keep the catechism open beside this companion. The catechism remains the doctrinal foundation; this book simply gives you ways to enter the teaching through ordinary life.</p>\n<h3>A SIMPLE SIX-STEP RHYTHM</h3>\n<p>1 Welcome - begin with something real. 2 Activity - use an object, movement or imagined situation. 3 Catechism - read the relevant teaching. 4 Conversation - ask and wait. 5 Check - make sure the main truth is understood. 6 Prayer - end simply and positively.</p>\n<h3>A few boundaries</h3>\n<ul><li>Use invented examples when talking about sin. Never ask the child to disclose personal sins.</li><li>Do not turn the catechism answers into an oral examination.</li><li>Do not compare children or push the pace because someone else is further ahead.</li><li>If a safeguarding disclosure is made outside Confession, follow diocesan safeguarding procedure.</li></ul>\n<h3>LESSON 1</h3>\n<details class=\"conv\"><summary>Open Lesson 1 &mdash; God Made Me and Loves Me</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>I am made by God, loved by God and called to live with him for ever.</p>\n<p>God made the whole world out of love. He made every human person in his image and likeness. This means that we can know what is true, choose what is good, love God and one another, and receive his friendship.</p>\n<p>God knows us completely. Nothing is hidden from him, yet he does not stop loving us when we have done wrong. He calls us to return to him and gives us the grace to begin again.</p>\n<p>Our conscience is a judgement of reason by which we recognise whether something we are about to do, or have already done, is good or wrong. We must form our conscience by listening to God&#x27;s word and the teaching of the Church.</p>\n<p>Talk About It: If God already knows everything about you — even the things you do wrong — why</p>\n<p>don&#x27;t you need to hide from him?</p>\n<p>(God knows us completely and still loves us; when we do wrong, he calls us back rather than abandoning us.)</p>\n<p>Learn these answers</p>\n<ol><li>Who made you?</li></ol>\n<p>God made me.</p>\n<ol><li>Why did God make you?</li></ol>\n<p>God made me to know him, love him and serve him in this life, and to be happy with him for ever in heaven.</p>\n<ol><li>In whose image are human beings made?</li></ol>\n<p>Human beings are made in the image and likeness of God.</p>\n<ol><li>Does God know and love you?</li></ol>\n<p>Yes. God knows me completely and loves me with a faithful love.</p>\n<ol><li>What is conscience?</li></ol>\n<p>Conscience is the judgement by which I recognise whether a choice is good or wrong.</p>\n<h4>PRAYER</h4>\n<p>Father in heaven, thank you for making me and loving me. Help me to know what is good and to choose it freely. Amen.</p>\n<h4>TO BEGIN</h4>\n<p>Make the Sign of the Cross slowly each morning and thank God for one person or gift in your life.</p>\n<p>4 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Begin from belonging: God made me, knows me and calls me to live with him.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Tell me one thing you enjoy, one person you love and one thing you are good at.” Then ask: “Do you think God already knows all of that?”</p>\n<h3>DO SOMETHING</h3>\n<p>Look at your hands together. Notice that no two people are exactly the same. Say: “God did not make a copy. He made you.” Then ask what it would mean if God stopped loving us every time we did something wrong.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 1, especially the REMEMBER line and the paragraph about God knowing us completely yet calling us back when we do wrong.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>If God already knows everything, why can we be honest with him?</li><li>What is the difference between feeling bad and knowing a choice was wrong?</li><li>How do we learn what is good?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Who made you?</li><li>Why did God make you?</li><li>What is conscience?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Ask the child to “teach back” the lesson in one sentence: “God made me, loves me and calls me back when I do wrong.”</p>\n<h3>PRAY</h3>\n<p>Father in heaven, thank you for making me and loving me. Help me to know what is good and choose it freely. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this lesson warm. Confession starts from the truth that the child belongs to God and is loved. Do not make wrongdoing the first thing the child associates with the sacrament.</p>\n<h3>LESSON 2</h3>\n<details class=\"conv\"><summary>Open Lesson 2 &mdash; Jesus Saves Me from Sin</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Jesus died and rose again to save us from sin and bring us home to the Father.</p>\n<p>God created our first parents in holiness and friendship with him. They freely disobeyed God. Through this first sin, human nature was wounded and every person, except the Blessed Virgin Mary by a special grace, is conceived without the original holiness God intended.</p>\n<p>The Father did not abandon us. He sent his eternal Son. Jesus Christ is true God and true man. By his obedient life, his Death on the Cross and his Resurrection, Jesus conquered sin and death and opened the way to eternal life.</p>\n<p>Every time we repent, we are responding to the grace won for us by Christ. In Confession we do not hide from Jesus. We come to the Saviour who already knows us and gave his life for us.</p>\n<p>Talk About It: Look at a crucifix. What does the Cross tell us about how much Jesus wants sinners to</p>\n<p>come back to God?</p>\n<p>(Jesus did not merely tell us that God forgives; he gave himself for us, died and rose, conquered sin and opened the way back to the Father.)</p>\n<p>Learn these answers</p>\n<ol><li>What is original sin?</li></ol>\n<p>Original sin is the state in which we are born without the original holiness lost by our first parents.</p>\n<ol><li>Who is Jesus Christ?</li></ol>\n<p>Jesus Christ is the eternal Son of God made man, true God and true man.</p>\n<ol><li>Why did Jesus die on the Cross?</li></ol>\n<p>Jesus died for our sins and offered himself to the Father for our salvation.</p>\n<ol><li>What happened on the third day?</li></ol>\n<p>Jesus rose from the dead in glory.</p>\n<ol><li>Why can we hope for forgiveness?</li></ol>\n<p>We can hope because Jesus has conquered sin and offers us his mercy.</p>\n<h4>PRAYER</h4>\n<p>Jesus, my Saviour, you loved me and gave yourself for me. Help me to trust your mercy and turn away from sin. Amen.</p>\n<h4>AS OFTEN AS YOU CAN</h4>\n<p>Look at a crucifix and say: &quot;Jesus, thank you for loving me.&quot;</p>\n<p>5 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Place Confession inside the larger story of Jesus saving us through his Cross and Resurrection.</p>\n<h3>QUICK PREP:</h3>\n<p>A crucifix, if one is nearby.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Point to the crucifix and ask: “What do you notice first? What does the Cross tell us about how much Jesus wants us close to God?”</p>\n<h3>DO SOMETHING</h3>\n<p>Stand a few steps away from the crucifix. Turn away and say: “Sin turns us away from God.” Then turn back and walk towards it: “Jesus opens the way home.” Let the child do the movement and explain it back to you.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 2. Pause at the sentences about Jesus conquering sin and death and about coming to the Saviour who already knows us.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why did Jesus die for us?</li><li>What does the Resurrection tell us about sin and death?</li><li>Who are we meeting in Confession: a stranger, or the Saviour who gave himself for us?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Who is Jesus Christ?</li><li>Why did Jesus die on the Cross?</li><li>Why can we hope for forgiveness?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Look at a crucifix in silence for twenty seconds. Ask the child to choose one word that describes Jesus’ love.</p>\n<h3>PRAY</h3>\n<p>Jesus, my Saviour, you loved me and gave yourself for me. Help me to trust your mercy and turn away from sin. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not make Confession sound like a system for dealing with bad behaviour. The centre is Christ: Cross, Resurrection, mercy and return.</p>\n<h3>LESSON 3</h3>\n<details class=\"conv\"><summary>Open Lesson 3 &mdash; Baptism and the Life of Grace</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In Baptism God made me his child and gave me the new life of grace.</p>\n<p>Baptism is the first sacrament. It frees us from original sin and from every personal sin committed before Baptism. It gives sanctifying grace, makes us adopted children of the Father, joins us to Christ and makes us members of his Church.</p>\n<p>Grace is God&#x27;s free gift of his own life and help. Sanctifying grace is the stable gift that makes the soul holy and pleasing to God. Actual grace is God&#x27;s help to know and do what is good.</p>\n<p>After Baptism we remain free and can still sin. Venial sin wounds our friendship with God. Mortal sin destroys charity in the heart and causes the loss of sanctifying grace. The Sacrament of Penance restores sanctifying grace when it has been lost and strengthens us to resist sin.</p>\n<p>Talk About It: What changed when you were baptised, even though you probably looked exactly the</p>\n<p>same afterwards?</p>\n<p>(Baptism is not merely an outward ceremony. God gave us new life, sanctifying grace, made us his adopted children and joined us to Christ and his Church.)</p>\n<p>Learn these answers</p>\n<ol><li>What is Baptism?</li></ol>\n<p>Baptism is the sacrament that frees us from sin, gives us new life in Christ and makes us members of the Church.</p>\n<ol><li>What is grace?</li></ol>\n<p>Grace is God&#x27;s free gift of his life and his help.</p>\n<ol><li>What is sanctifying grace?</li></ol>\n<p>Sanctifying grace is the gift that makes us holy and enables us to share in God&#x27;s life.</p>\n<ol><li>Can a baptised person still sin?</li></ol>\n<p>Yes. After Baptism we must continue to choose good and resist temptation.</p>\n<ol><li>What restores sanctifying grace after mortal sin?</li></ol>\n<p>The Sacrament of Penance restores sanctifying grace when it is received with the right dispositions.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, live in me and help me to remember that I belong to Christ. Strengthen me to choose what is good. Amen.</p>\n<h4>TODAY</h4>\n<p>Ask when and where you were baptised. Thank God for your Baptism and pray for your godparents.</p>\n<p>6 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Show that Baptism truly gives new life and that Confession restores and strengthens the life of grace.</p>\n<h3>QUICK PREP:</h3>\n<p>A little water in a glass or bowl.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Do you know where you were baptised? Have you seen a photo or heard the story?”</p>\n<h3>DO SOMETHING</h3>\n<p>Show the water. Ask: “Can ordinary water make someone God’s child by itself?” Explain that Christ uses water and the words of Baptism as a sacramental sign through which he really gives new life and grace.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 3, especially the sections on Baptism, sanctifying grace and the way Penance restores grace when it has been lost.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>What changed at Baptism even though the baby looked the same afterwards?</li><li>What is a gift you did not earn? How is grace a gift?</li><li>Why might a baptised person still need Confession?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is Baptism?</li><li>What is grace?</li><li>What does Penance restore when grave sin has destroyed charity?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Find the child’s Baptism date or church and make a plan to thank God for Baptism on that anniversary.</p>\n<h3>PRAY</h3>\n<p>Holy Spirit, live in me and help me remember that I belong to Christ. Strengthen me to choose what is good. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep “grace” simple and Catholic: God’s free gift of his life and help. The point is not to explain every theological distinction at once.</p>\n<h3>LESSON 4</h3>\n<details class=\"conv\"><summary>Open Lesson 4 &mdash; God&#x27;s Commandments Teach Me to Love</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>God&#x27;s law shows me how to love God and my neighbour.</p>\n<p>God gave the Ten Commandments because he loves us and wants us to be free for what is good. They are not a collection of traps. They protect our friendship with God, the dignity of every person, family life, truth, purity, justice and peace.</p>\n<p>Jesus brought the commandments to fulfilment. He taught that the greatest commandments are to love God with all our heart and to love our neighbour as ourselves. He also gave us the new commandment: to love one another as he has loved us.</p>\n<p>Love is more than a feeling. Christian love chooses the true good of another person. Sometimes love means helping, forgiving, telling the truth, obeying a rightful instruction or courageously refusing what is wrong.</p>\n<p>Talk About It: Suppose your friend wants to do something you know is wrong. Would loving your</p>\n<p>friend mean going along with it? Why or why not?</p>\n<p>(Love is not simply being agreeable or having nice feelings. Sometimes genuine love means saying no, telling the truth or doing something difficult because we want what is truly good for another person.)</p>\n<p>Learn these answers</p>\n<ol><li>Why did God give the commandments?</li></ol>\n<p>God gave the commandments to teach us the way of love and lead us to true freedom and happiness.</p>\n<ol><li>What is the greatest commandment?</li></ol>\n<p>We must love the Lord our God with all our heart, soul and mind.</p>\n<ol><li>What is the second great commandment?</li></ol>\n<p>We must love our neighbour as ourselves.</p>\n<ol><li>What new commandment did Jesus give?</li></ol>\n<p>Jesus commanded us to love one another as he has loved us.</p>\n<ol><li>Is love only a feeling?</li></ol>\n<p>No. Love chooses and does what is truly good.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, teach me to love as you love. Help me to obey God, speak the truth, forgive others and choose what is good. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one hidden act of kindness and do it without asking for praise.</p>\n<p>7 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child see God’s commandments as a way of protecting love, truth, worship, family and human dignity.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “What rules keep people safe?” Think of roads, school, sport or home. Ask what would happen if everyone ignored them.</p>\n<h3>DO SOMETHING</h3>\n<p>Play “help or harm”. Say an invented choice and let the child show thumbs-up if it protects love or a flat hand if it harms: telling the truth, joining in teasing, helping at home, cheating, forgiving, stealing, praying. Always ask “Why?”</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 4 and the two great commandments. Let the child find the line that says love is more than a feeling.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why are God’s commandments not traps?</li><li>Can loving someone sometimes mean saying “no”?</li><li>What is the difference between being nice and choosing what is truly good?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Why did God give the commandments?</li><li>What are the two great commandments?</li><li>Is love only a feeling?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Ask the child to invent one “help or harm” example for you to answer.</p>\n<h3>PRAY</h3>\n<p>Lord Jesus, teach me to love as you love. Help me to obey God, speak the truth, forgive and choose what is good. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Praise the reasoning, not only the right answer. The goal is a conscience shaped by truth and love, not a child who merely guesses what the adult wants.</p>\n<h3>LESSON 5</h3>\n<details class=\"conv\"><summary>Open Lesson 5 &mdash; What Is Sin?</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Sin is a freely chosen offence against God and a wound to ourselves, our neighbour and the Church.</p>\n<p>A sin is a thought, word, action or omission freely chosen against God&#x27;s law. We can sin by doing what is wrong or by refusing to do a good thing that we truly ought to do. A temptation is not itself a sin. An unwanted thought or feeling is not a sin unless we freely welcome or choose it. An accident, a simple mistake or something done without freedom is not the same as a deliberate sin.</p>\n<p>For a sin to be mortal, three things must be present together: the matter is serious (breaking one of the 10 commandments, for example), the person knows that it is seriously wrong, and the person freely chooses it. Venial sin concerns less serious matter, or is committed without full knowledge or complete consent. We should avoid every sin, but we should not become frightened or scrupulous. God sees the truth of the heart.</p>\n<p>Talk About It: Imagine three children: one breaks a cup by accident; one feels tempted to break it but</p>\n<p>doesn&#x27;t; one deliberately throws it on the floor because they are angry. Are those three things the same? Why not?</p>\n<p>(An accident is not a deliberate sin; temptation is not itself sin; sin involves freely choosing what we know to be wrong.) This is probably the most important discussion in the Confession course.</p>\n<p>Learn these answers</p>\n<ol><li>What is sin?</li></ol>\n<p>Sin is a thought, word, action or omission freely chosen against God&#x27;s law.</p>\n<ol><li>Is temptation itself a sin?</li></ol>\n<p>No. Temptation becomes sin only when we freely consent to what is wrong.</p>\n<ol><li>What three things are required for mortal sin?</li></ol>\n<p>There must be serious matter, full knowledge and deliberate consent.</p>\n<ol><li>What is venial sin?</li></ol>\n<p>Venial sin is a less serious sin, or a sin committed without full knowledge or complete consent.</p>\n<ol><li>Why should we avoid venial sin?</li></ol>\n<p>Venial sin wounds charity, weakens us and can lead us towards more serious sin.</p>\n<h4>BE AT PEACE</h4>\n<p>You are not guilty of another person&#x27;s sin against you. If someone has hurt, frightened or harmed you, tell a trusted safe adult outside Confession. It is not your fault.</p>\n<h4>PRAYER</h4>\n<p>Jesus, give me light to know what is wrong, courage to refuse temptation and trust in you when I have sinned. Amen.</p>\n<p>8 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child distinguish accident, temptation, mistake and freely chosen sin, then introduce mortal and venial sin clearly.</p>\n<h3>QUICK PREP:</h3>\n<p>A plastic cup or another harmless object.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Put the cup nearby. Say: “Three children are near this cup. One knocks it over by accident. One wants to smash it but chooses not to. One deliberately throws it down in anger. Are those the same?”</p>\n<h3>DO SOMETHING</h3>\n<p>Act out the three situations very simply. After each ask: “Was there a free choice? Did the person know what they were doing?” Then invite the child to invent another harmless example.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Now read Lesson 5. The activity gives the child a picture for the formal definitions. Read the three conditions for mortal sin slowly and plainly.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Is temptation already a sin?</li><li>Why does freedom matter?</li><li>Why are accident and deliberate choice different?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is sin?</li><li>Is temptation itself a sin?</li><li>What three things must all be present for mortal sin?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Give four quick examples and let the child label them: accident, temptation, mistake or deliberate choice.</p>\n<h3>PRAY</h3>\n<p>Jesus, give me light to know what is wrong, courage to refuse temptation and trust in you when I have sinned. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Use invented examples only. Do not ask for the child’s real sins. Keep the distinction peaceful and precise: God sees the truth of the heart, including knowledge and freedom.</p>\n<h3>LESSON 6</h3>\n<details class=\"conv\"><summary>Open Lesson 6 &mdash; God Calls Me to Conversion</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Conversion means turning away from sin and returning to God with hope in his mercy.</p>\n<p>Jesus began his preaching with the call: &quot;Repent and believe in the gospel&quot; (Mark 1:15). Repentance is not merely feeling bad. It is a change of heart, made possible by grace, in which we turn away from sin and turn towards God.</p>\n<p>Jesus showed the Father&#x27;s mercy in the parable of the lost son. The son recognised his sin and returned home. His father saw him, ran to meet him and welcomed him. God&#x27;s mercy does not say that sin is unimportant. Mercy heals us because sin is real and because God&#x27;s love is greater.</p>\n<p>We should never despair. Shame may tell us to hide, but grace tells us to return. A good Confession begins with trust: God already knows the truth, wants our salvation and gives us the courage to speak honestly.</p>\n<p>Talk About It: When the lost son came home, why do you think his father ran to meet him instead of</p>\n<p>making him stand outside?</p>\n<p>(Conversion means genuinely turning away from sin, but we return with hope rather than despair because God desires to forgive and heal us.)</p>\n<p>Learn these answers</p>\n<ol><li>What is conversion?</li></ol>\n<p>Conversion is turning away from sin and returning to God.</p>\n<ol><li>Who gives us the grace to repent?</li></ol>\n<p>The Holy Spirit moves our hearts and gives us the grace to repent.</p>\n<ol><li>Should shame make us hide from God?</li></ol>\n<p>No. We should trust God&#x27;s mercy and return to him honestly.</p>\n<ol><li>Does mercy pretend that sin does not matter?</li></ol>\n<p>No. Mercy forgives and heals the sinner who turns back to God.</p>\n<ol><li>What short prayer can a sinner make?</li></ol>\n<p>&quot;God, be merciful to me, a sinner!&quot; (Luke 18:13).</p>\n<h4>PRAYER</h4>\n<p>Father of mercy, when I have wandered from you, help me to return quickly. Give me a humble and trusting heart. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read or listen to the parable of the lost son in Luke 15:11-32.</p>\n<p>9 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Make conversion visible as turning away from sin and returning to the Father with hope.</p>\n<h3>QUICK PREP:</h3>\n<p>Two chairs, if convenient.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “Have you ever taken a wrong turning and had to turn around?” Let the child tell a simple story.</p>\n<h3>DO SOMETHING</h3>\n<p>Put two chairs a few steps apart. Call one “away” and one “home”. Retell the lost son briefly while moving from one to the other: he recognised the truth, turned, returned, and the father came to meet him. Let the child repeat the movement in their own words.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 6 and the “Talk About It” question about the father running to meet the son.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why did the father run to meet his son?</li><li>Does mercy mean the wrong thing did not matter?</li><li>What does conversion actually mean?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is conversion?</li><li>Who gives us grace to repent?</li><li>Should shame make us hide from God?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Read or listen to Luke 15:11-32 and ask the child which moment in the story they remember most.</p>\n<h3>PRAY</h3>\n<p>Father of mercy, when I have wandered from you, help me to return quickly. Give me a humble and trusting heart. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep the story about real conversion as well as welcome. Mercy does not call evil good; mercy heals and restores the sinner who returns.</p>\n<h3>LESSON 7</h3>\n<details class=\"conv\"><summary>Open Lesson 7 &mdash; Jesus Gave Us the Sacrament of Penance</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In this sacrament the risen Jesus forgives sins through the ministry of a priest and reconciles us with the Church.</p>\n<p>On Easter Day the risen Jesus breathed the Holy Spirit upon the apostles and gave them authority to forgive sins (John 20:19-23). This ministry continues in the bishops and priests of the Church.</p>\n<p>Only God can forgive sins. In the sacrament, Christ himself acts through the priest. The priest listens, gives counsel, proposes a penance and gives absolution. Through absolution God forgives the sins confessed with true repentance and reconciles the penitent with the Church.</p>\n<p>This sacrament has several names. It is called Penance because it calls us to conversion and reparation; Confession because we confess our sins; Forgiveness because God pardons us; and Reconciliation because friendship with God and communion with the Church are restored.</p>\n<p>Talk About It: In Confession you can see and hear the priest. So how can we say that it is Jesus who</p>\n<p>forgives you?</p>\n<p>(Christ entrusted his ministry of forgiveness to the Apostles; that ministry continues through bishops and priests, and Christ acts through the priest in the sacrament.)</p>\n<p>Learn these answers</p>\n<ol><li>Who instituted the Sacrament of Penance?</li></ol>\n<p>Jesus Christ instituted the Sacrament of Penance.</p>\n<ol><li>To whom did Jesus first give authority to forgive sins?</li></ol>\n<p>Jesus gave this authority to his apostles.</p>\n<ol><li>Who exercises this ministry in the Church?</li></ol>\n<p>Bishops and priests exercise the ministry of sacramental forgiveness.</p>\n<ol><li>Who forgives sins in the sacrament?</li></ol>\n<p>God forgives sins through the absolution given by the priest in the name of Christ and the Church.</p>\n<ol><li>What does this sacrament restore?</li></ol>\n<p>It restores friendship with God, reconciles us with the Church and gives peace of conscience and spiritual strength.</p>\n<h4>THE SEAL OF CONFESSION</h4>\n<p>The priest may never reveal what he learns in Confession. The sacramental seal is absolute.</p>\n<h4>PRAYER</h4>\n<p>Risen Lord Jesus, thank you for giving your Church the ministry of forgiveness. Help me to receive this sacrament with faith and honesty. Amen.</p>\n<p>10 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child understand that Christ forgives through the ministry he entrusted to bishops and priests.</p>\n<h3>QUICK PREP</h3>\n<p>Four scraps of paper are helpful but not necessary.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “In Confession you can see and hear the priest. So who is really forgiving you?” Listen first.</p>\n<h3>DO SOMETHING</h3>\n<p>Make a simple chain: JESUS -&gt; APOSTLES -&gt; BISHOPS &amp; PRIESTS -&gt; CHURCH TODAY. Let the child arrange the words or repeat the four steps using fingers. Explain that Christ remains the one who forgives.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 7, especially John 20:19-23 and the sentence “Christ himself acts through the priest.”</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why can a priest forgive sins if only God forgives?</li><li>What authority did Jesus give the Apostles?</li><li>Why is the seal of Confession important?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>Who instituted Penance?</li><li>To whom did Jesus first give authority to forgive sins?</li><li>Who forgives in the sacrament?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Ask the child to draw four arrows: Jesus -&gt; Apostles -&gt; bishops/priests -&gt; us today.</p>\n<h3>PRAY</h3>\n<p>Risen Lord Jesus, thank you for giving your Church the ministry of forgiveness. Help me to receive this sacrament with faith and honesty. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not role-play sacramental absolution as a game. Explain the authority Christ gave, but keep the sacramental formula itself reverent and for the actual celebration.</p>\n<h3>LESSON 8</h3>\n<details class=\"conv\"><summary>Open Lesson 8 &mdash; Contrition and a Firm Purpose</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>I must be truly sorry for sin and sincerely intend, with God&#x27;s help, to avoid it.</p>\n<p>Contrition is sorrow for sin together with hatred of the sin committed and a resolution not to sin again. Contrition must come from faith and grace. It is more than embarrassment about being caught or fear of another person&#x27;s anger. Perfect contrition arises from love of God above all things. Imperfect contrition arises from other true and supernatural motives, such as recognising the ugliness of sin or fearing its just consequences. Imperfect contrition is also a gift of God and disposes us to receive forgiveness in the sacrament.</p>\n<p>A firm purpose of amendment means that we sincerely intend to avoid sin and the near occasions that lead us into it. It does not mean that we can guarantee we will never fail again. We promise to try with God&#x27;s grace and to use practical means to change.</p>\n<p>Talk About It: What&#x27;s the difference between saying “I&#x27;m sorry I did it” and saying “I&#x27;m sorry I got</p>\n<p>caught”?</p>\n<p>(Real contrition concerns the wrong we have done before God, not merely embarrassment or fear of punishment. A genuine purpose of amendment means sincerely wanting to change with God&#x27;s help, not promising that we will never make another mistake.)</p>\n<p>Learn these answers</p>\n<ol><li>What is contrition?</li></ol>\n<p>Contrition is sorrow for sin, hatred of the sin committed and a resolution not to sin again.</p>\n<ol><li>What is perfect contrition?</li></ol>\n<p>Perfect contrition is sorrow for sin because we love God above all things and are sorry to have offended him.</p>\n<ol><li>What is imperfect contrition?</li></ol>\n<p>Imperfect contrition is sorrow arising from another true supernatural motive, such as the ugliness of sin or fear of its consequences.</p>\n<ol><li>What is a firm purpose of amendment?</li></ol>\n<p>It is a sincere intention, with God&#x27;s help, to avoid sin and the occasions that lead to it.</p>\n<ol><li>Must we be certain that we will never sin again?</li></ol>\n<p>No. We must sincerely intend to change and rely upon God&#x27;s grace.</p>\n<h4>PRAYER</h4>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one practical change that will help you avoid a repeated fault.</p>\n<p>11 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child recognise real sorrow for sin and a sincere intention to change with God’s grace.</p>\n<h3>QUICK PREP</h3>\n<p>Nothing needed.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Say: “I’m sorry I did it” and then “I’m sorry I got caught.” Ask: “Are those the same kind of sorry?”</p>\n<h3>DO SOMETHING</h3>\n<p>Use an invented situation: someone lies about homework. Build a three-step change plan together: admit the wrong; ask forgiveness; choose one practical way to avoid repeating it.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 8. Let the child explain the difference between contrition and embarrassment about consequences.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Can someone be sorry only because they are embarrassed?</li><li>Does a firm purpose mean promising never to fail again?</li><li>How can a practical change make a good intention stronger?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is contrition?</li><li>What is a firm purpose of amendment?</li><li>Must we be certain we will never sin again?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Ask the child to invent a harmless situation and create a three-step change plan for it.</p>\n<h3>PRAY</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Aim for sincerity, not impossible promises. “I truly intend to change with God’s grace” is the point.</p>\n<h3>LESSON 9</h3>\n<details class=\"conv\"><summary>Open Lesson 9 &mdash; Examining My Conscience</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Before Confession I ask the Holy Spirit to help me remember my sins honestly and peacefully.</p>\n<p>An examination of conscience is a prayerful review of our choices since our last good Confession. Before a first Confession, we think about the sins we remember from the time we became able to understand and choose right and wrong.</p>\n<p>We examine ourselves in the light of God&#x27;s commandments, the teaching of Jesus and the duties of our age and state of life. We ask what we have done and what good we have deliberately failed to do.</p>\n<p>We should be honest but not anxious. We are not required to remember the impossible. Mortal sins must be confessed in kind and number (what kind of sin and how many times it has been committed) as far as we can remember after a careful examination. Venial sins may be confessed and doing so is very helpful, but we need not produce a long list of tiny faults.</p>\n<p>Talk About It: Why do you think we ask the Holy Spirit to help us before we try to remember our sins?</p>\n<p>(An examination of conscience is prayer, not anxious fault-finding. We ask God for light so that we can see ourselves truthfully and peacefully. We need honesty, not a perfect memory.)</p>\n<p>Learn these answers</p>\n<ol><li>What is an examination of conscience?</li></ol>\n<p>It is a prayerful review of our thoughts, words, actions and omissions in order to recognise our sins.</p>\n<ol><li>What light guides our examination?</li></ol>\n<p>God&#x27;s commandments, the teaching of Jesus and the duties of our life guide us.</p>\n<ol><li>Must mortal sins be confessed?</li></ol>\n<p>Yes. Every remembered mortal sin must be confessed in kind and number as far as possible.</p>\n<ol><li>Must venial sins be confessed?</li></ol>\n<p>No, but the Church strongly recommends the regular confession of venial sins.</p>\n<ol><li>What if we honestly forget a sin?</li></ol>\n<p>A sin honestly forgotten is forgiven with the other sins; if it was mortal and is later remembered, it should be mentioned in the next Confession.</p>\n<h4>PRAYER</h4>\n<p>Come, Holy Spirit. Give me light to know my sins, sorrow to repent of them, honesty to confess them and strength to amend my life. Amen.</p>\n<h4>BE HONEST, NOT AFRAID</h4>\n<p>God asks for a sincere examination, not a perfect memory. Do not keep repeating an examination once it has been made carefully.</p>\n<p>12 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Teach examination of conscience as a short prayerful search for truth with the Holy Spirit.</p>\n<h3>QUICK PREP:</h3>\n<p>A phone torch or lamp, if available.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Shine the torch on a dark corner or under a table. Ask: “What does light help us do?” Then say: “We ask the Holy Spirit for light so we can see our choices truthfully.”</p>\n<h3>DO SOMETHING</h3>\n<p>Have sixty seconds of quiet. Name only broad areas: God; home; duties; kindness; truth; self-control. Do not ask what sins the child remembers. Afterwards ask: “Did the headings make it easier to think?”</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 9 and then look at Appendix A. Explain that the questions are helps, not a list of things every child has done.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why do we pray before examining our conscience?</li><li>Do we need a perfect memory?</li><li>What should we do if we honestly forget a sin?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What is an examination of conscience?</li><li>What guides our examination?</li><li>What if a sin is honestly forgotten?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Let the child choose five headings for a very simple examination of conscience and remember them on five fingers.</p>\n<h3>PRAY</h3>\n<p>Come, Holy Spirit. Give me light to know my sins, sorrow to repent, honesty to confess and strength to amend my life. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>The adult must not turn the examination into an interview. Do not ask, “Which of these have you done?” Actual sins belong in sacramental Confession.</p>\n<h3>LESSON 10</h3>\n<details class=\"conv\"><summary>Open Lesson 10 &mdash; Making a Good Confession</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>I confess my sins simply, honestly and clearly, trusting in Jesus.</p>\n<p>The priest will welcome you and help you. Begin with the Sign of the Cross. You may say: &quot;Bless me, Father, for I have sinned. This is my first Confession.&quot; Then confess your sins without hiding them, blaming others or adding unnecessary stories.</p>\n<p>The priest may ask a gentle question or give advice. He will give you a penance. Listen carefully and ask politely if you do not understand. Then make your Act of Contrition when he invites you.</p>\n<p>The priest extends his hand and gives absolution. Listen and make the Sign of the Cross as he says the essential words: &quot;I absolve you from your sins, in the name of the Father, and of the Son, and of the Holy Spirit.&quot; Answer, &quot;Amen.&quot; The priest then dismisses you in peace.</p>\n<p>Talk About It: If you forgot the words, became nervous or didn&#x27;t know what to do in your First</p>\n<p>Confession, what could you do?</p>\n<p>(Simply tell the priest. He will help. A good Confession does not depend upon performing everything perfectly; the child needs to be sincere and honest.)</p>\n<p>Learn these answers</p>\n<ol><li>How should we confess our sins?</li></ol>\n<p>We should confess our sins simply, honestly, clearly and without blaming other people.</p>\n<ol><li>What must never be deliberately concealed?</li></ol>\n<p>We must never deliberately conceal a mortal sin.</p>\n<ol><li>What should we do after confessing our sins?</li></ol>\n<p>We listen to the priest&#x27;s advice, accept a penance and make an Act of Contrition.</p>\n<ol><li>What is absolution?</li></ol>\n<p>Absolution is the sacramental act by which Christ, through the priest, forgives our sins.</p>\n<ol><li>What do we answer after absolution?</li></ol>\n<p>We answer, &quot;Amen.&quot;</p>\n<h4>DO NOT WORRY</h4>\n<p>The priest will guide you if you forget what to say. A first Confession does not have to sound perfect; it must be sincere.</p>\n<h4>PRAYER</h4>\n<p>Jesus, give me courage to speak the truth and humility to receive your forgiveness with gratitude. Amen.</p>\n<p>13 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Give practical familiarity with the shape of Confession without rehearsing real sins.</p>\n<h3>QUICK PREP:</h3>\n<p>Two chairs. Use invented examples only.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If you forgot every word when you sat down with the priest, what could you say?” Aim for: “Father, this is my first Confession and I need some help.”</p>\n<h3>DO SOMETHING</h3>\n<p>Practise the sequence with invented sins: Sign of the Cross -&gt; “This is my first Confession” -&gt; invented sins -&gt; listen -&gt; penance -&gt; Act of Contrition -&gt; receive absolution in the real sacrament -&gt; “Amen”. The adult should not imitate the words of sacramental absolution.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 10 and Appendix B. Let the child point to the steps instead of trying to memorise everything.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>What can you do if you forget what comes next?</li><li>Why should we confess simply rather than tell long stories?</li><li>What do we answer after absolution?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>How should we confess?</li><li>What do we do after telling our sins?</li><li>What is absolution?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Swap roles and let the child be the “guide” who tells you the next step, without pretending to absolve.</p>\n<h3>PRAY</h3>\n<p>Jesus, give me courage to speak the truth and humility to receive your forgiveness with gratitude. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Practise procedure, never content. The goal is calm familiarity. The priest will guide the child.</p>\n<h3>LESSON 11</h3>\n<details class=\"conv\"><summary>Open Lesson 11 &mdash; Absolution, Penance and a New Beginning</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Christ forgives me in absolution, and I respond by doing my penance and repairing harm.</p>\n<p>Absolution is the heart of the sacramental action. Through the words and ministry of the priest, the merciful Father forgives us because of the Death and Resurrection of his Son and the gift of the Holy Spirit. The penance given by the priest may be a prayer, a work of mercy, an act of self-denial or another good action. It helps repair the harm caused by sin and trains us in the way of holiness. We should do it carefully and as soon as reasonably possible.</p>\n<p>If our sin has harmed another person, true repentance includes a willingness to repair the harm when possible. Stolen property should be returned; lies should be corrected when prudent; and an apology or act of kindness may be needed. The priest can advise us.</p>\n<p>Talk About It: If you deliberately broke somebody&#x27;s toy, would saying sorry to God mean that you no</p>\n<p>longer needed to put things right with the person?</p>\n<p>(God&#x27;s forgiveness is real, but genuine repentance also makes us willing to repair harm where reasonably possible. Penance and satisfaction belong to our response to God&#x27;s mercy.)</p>\n<p>Learn these answers</p>\n<ol><li>What happens in absolution?</li></ol>\n<p>God forgives our sins and reconciles us with the Church through the ministry of the priest.</p>\n<ol><li>What is satisfaction?</li></ol>\n<p>Satisfaction is repairing, as far as possible, the harm caused by sin and doing the penance given by the priest.</p>\n<ol><li>When should we do our penance?</li></ol>\n<p>We should do our penance carefully and as soon as reasonably possible.</p>\n<ol><li>What if we have harmed another person?</li></ol>\n<p>We should be willing to repair the harm as far as we reasonably can.</p>\n<ol><li>What words of Jesus may we remember after forgiveness?</li></ol>\n<p>Jesus said, &quot;Your sins are forgiven&quot; (Luke 7:48).</p>\n<h4>PRAYER</h4>\n<p>Merciful Father, thank you for forgiving me. Help me to do my penance, repair the harm I have caused and walk in newness of life. Amen.</p>\n<h4>AFTER CONFESSION</h4>\n<p>Do your penance, thank God quietly and leave the church with peaceful confidence in his mercy.</p>\n<p>14 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Show that forgiveness is real and that penance and reasonable repair belong to our response to mercy.</p>\n<h3>QUICK PREP:</h3>\n<p>Nothing needed. Optional: a book or toy for the example.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If I spill a drink over your book and say sorry, is there anything else I should do?” Let the child suggest cleaning, drying or repairing it.</p>\n<h3>DO SOMETHING</h3>\n<p>Use the broken-toy example from the catechism. Say three words and let the child explain them: FORGIVEN - PENANCE - REPAIR. Try two invented situations: taking something; telling a lie. Ask what reasonable repair might look like.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 11. Emphasise that penance and satisfaction do not buy forgiveness; they are part of responding to mercy.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Does repairing harm mean God has not really forgiven us?</li><li>Why does the priest give a penance?</li><li>When should we do our penance?</li></ul>\n<h3>CHECK THE MAIN POINT</h3>\n<p>Ask naturally. The child can answer in their own words:</p>\n<ul><li>What happens in absolution?</li><li>What is satisfaction?</li><li>What if we have harmed another person?</li></ul>\n<h3>OPTIONAL EXTRA</h3>\n<p>Give one invented situation and ask for three responses: ask forgiveness, do penance, repair what can reasonably be repaired.</p>\n<h3>PRAY</h3>\n<p>Merciful Father, thank you for forgiving me. Help me to do my penance, repair the harm I have caused and walk in newness of life. Amen.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Not every harm can or should be repaired directly. Keep the catechism’s phrase “as far as reasonably possible”; the priest can advise in difficult cases.</p>\n<h3>LESSON 12</h3>\n<details class=\"conv\"><summary>Open Lesson 12 &mdash; Living as a Forgiven Child of God</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Confession gives me grace to begin again and to grow in holiness.</p>\n<p>The Sacrament of Penance is not only for a first celebration. Christ gives it to the Church as a continuing medicine for the soul. Frequent Confession helps us form our conscience, resist temptation, grow in virtue and receive spiritual guidance.</p>\n<p>After Confession we should continue the ordinary means of Christian life: Sunday Mass, prayer each morning and evening, reading or listening to Scripture, acts of charity, obedience to our duties and asking help quickly when we are tempted.</p>\n<p>Those who have been forgiven must also learn to forgive. We may still need wise boundaries and adult help when another person has harmed us. Forgiveness does not mean pretending that harm was acceptable. It means refusing hatred and entrusting justice and healing to God.</p>\n<p>Talk About It: Why do you think Catholics go to Confession again after their First Confession?</p>\n<p>(Confession is not a ceremony we graduate from. Christ gives us the sacrament throughout life to forgive, strengthen, form our conscience and help us grow in holiness.)</p>\n<p>Learn these answers</p>\n<ol><li>Why should Catholics receive this sacrament regularly?</li></ol>\n<p>Regular Confession helps us grow in grace, form our conscience, resist sin and deepen our friendship with Christ.</p>\n<ol><li>What ordinary practices help us grow in holiness?</li></ol>\n<p>Sunday Mass, daily prayer, Scripture, works of charity, obedience to duty and the sacraments help us grow.</p>\n<ol><li>What should we do when temptation begins?</li></ol>\n<p>We should pray, turn away from the occasion and seek help from God and trusted people.</p>\n<ol><li>Must Christians forgive?</li></ol>\n<p>Yes. Because Christ forgives us, we must ask for the grace to forgive others.</p>\n<ol><li>What does Jesus tell the forgiven sinner?</li></ol>\n<p>Jesus calls the sinner to a new life: &quot;From now on sin no more&quot; (John 8:11).</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, keep me close to you. Help me to love what is good, return quickly when I fall and forgive others as you forgive me. Amen.</p>\n<h4>MY NEXT STEP</h4>\n<p>Ask your parent or catechist how often the parish offers Confession and choose a simple plan for receiving the sacrament regularly.</p>\n<p>15 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4>\n<p>Appendix A</p>\n<p>A Child&#x27;s Examination of Conscience</p>\n<p>Begin quietly. Make the Sign of the Cross and ask the Holy Spirit for light. Think about your choices without making excuses and without becoming afraid. The questions below are helps; they are not a list of sins that every child has committed.</p>\n<h4>PRAYER</h4>\n<p>Come, Holy Spirit. Help me to see the truth, trust God&#x27;s mercy and make a good Confession. Amen.</p>\n<p>Loving God</p>\n<p>Have I remembered God in prayer, or deliberately refused to pray?</p>\n<p>Have I missed Sunday Mass through my own fault?</p>\n<p>Have I used God&#x27;s holy name carelessly or disrespectfully?</p>\n<p>Have I treated holy things, the church or the sacraments without reverence?</p>\n<p>Have I been ashamed of my Catholic faith or joined in mocking it?</p>\n<p>At home and in my duties</p>\n<p>Have I deliberately disobeyed my parents or those rightly responsible for me?</p>\n<p>Have I spoken rudely, shouted or refused reasonable help?</p>\n<p>Have I neglected schoolwork or another duty through laziness?</p>\n<p>Have I been ungrateful for the care and gifts I receive?</p>\n<p>Have I tried to make peace after an argument?</p>\n<p>Kindness and respect</p>\n<p>Have I hit, bullied, threatened or deliberately frightened someone?</p>\n<p>Have I encouraged others to exclude or humiliate someone?</p>\n<p>Have I held on to anger or refused to forgive?</p>\n<p>Have I been cruel to a person, an animal or someone weaker than me?</p>\n<p>Have I failed to help when I reasonably could?</p>\n<p>16 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4>\n<p>Truth and justice</p>\n<p>Have I told a lie, blamed someone falsely or cheated?</p>\n<p>Have I gossiped, shared a secret or damaged someone&#x27;s good name?</p>\n<p>Have I taken or damaged something that was not mine?</p>\n<p>Have I returned borrowed things and tried to repair damage?</p>\n<p>Have I been unfair in games, schoolwork or online activity?</p>\n<p>Purity, gratitude and self-control</p>\n<p>Have I treated my own body and other people&#x27;s bodies with respect?</p>\n<p>Have I deliberately looked at or shared something I knew was indecent?</p>\n<p>Have I respected the privacy and personal boundaries of others?</p>\n<p>Have I been jealous of another person&#x27;s gifts, friends or possessions?</p>\n<p>Have I been greedy, wasteful or unwilling to share?</p>\n<p>Have I lost self-control with food, games, screens or entertainment?</p>\n<h4>REMEMBER</h4>\n<p>Something done to you without your free choice is not your sin. If anyone has harmed, threatened or frightened you, tell a trusted safe adult outside Confession so that you can be protected and helped.</p>\n<p>17 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4>\n<p>Appendix B</p>\n<p>My First Confession Step by Step</p>\n<p>Ste What happens What I do p</p>\n<p>Examine your conscience, ask for true sorrow and choose to speak 1 Prepare honestly.</p>\n<p>The priest welcomes you. Make the Sign of the Cross. You may say, 2 Enter and begin &quot;Bless me, Father, for I have sinned. This is my first Confession.&quot;</p>\n<p>Confess your Tell your sins simply and clearly. You may finish: &quot;For these and all 3 sins my sins, I am truly sorry.&quot;</p>\n<p>Listen to the priest&#x27;s advice. Accept the penance he gives you. Ask if 4 Listen you do not understand.</p>\n<p>5 Pray Make your Act of Contrition when the priest invites you.</p>\n<p>Receive Listen prayerfully. Make the Sign of the Cross as the priest absolves 6 absolution you. Answer, &quot;Amen.&quot;</p>\n<p>The priest dismisses you in peace. Do your penance as soon as 7 Give thanks possible and thank God for his mercy.</p>\n<h4>IF I FORGET</h4>\n<p>I can simply say, &quot;Father, this is my first Confession and I need some help.&quot; The priest will guide me.</p>\n<p>A simple practice dialogue</p>\n<p>Child: Bless me, Father, for I have sinned. This is my first Confession.</p>\n<p>Child: These are my sins:...</p>\n<p>Child: For these and all my sins, I am truly sorry.</p>\n<p>Priest: The priest gives advice and a penance.</p>\n<p>Child: The child makes an Act of Contrition.</p>\n<p>Priest: The priest gives absolution.</p>\n<p>Child: Amen.</p>\n<p>18 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4>\n<p>Appendix C</p>\n<p>Prayers to Know</p>\n<p>The Sign of the Cross</p>\n<h4>PRAY</h4>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<p>The Lord&#x27;s Prayer</p>\n<h4>PRAY</h4>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<p>The Hail Mary</p>\n<h4>PRAY</h4>\n<p>Hail Mary, full of grace, the Lord is with thee; blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.</p>\n<p>The Glory Be</p>\n<h4>PRAY</h4>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<p>Act of Contrition</p>\n<h4>PRAY</h4>\n<p>O my God, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<p>Before examining my conscience</p>\n<h4>PRAY</h4>\n<p>Come, Holy Spirit. Give me light to know my sins, sorrow to repent of them, honesty to confess them and strength to amend my life. Amen.</p>\n<p>After Confession</p>\n<h4>PRAY</h4>\n<p>Merciful Father, thank you for forgiving me through your Son. Help me to do my penance, repair any harm and remain close to you. Through Christ our Lord. Amen.</p>\n<p>Prayer to my guardian angel</p>\n<h4>PRAY</h4>\n<p>Angel of God, my guardian dear, to whom God&#x27;s love commits me here, ever this day be at my side, to light and guard, to rule and guide. Amen.</p>\n<p>19 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4>\n<p>Appendix D</p>\n<p>Summary Catechism</p>\n<p>These questions gather the essential answers from the lessons. Children should understand the meaning before being asked to remember the wording.</p>\n<ol><li>Who made you? God made me.</li><li>Why did God make you? To know him, love him and serve him in this life, and to be happy with him for ever in heaven.</li><li>Who is Jesus Christ? The eternal Son of God made man, true God and true man.</li><li>Why did Jesus die and rise? To save us from sin and death and open the way to eternal life.</li><li>What is Baptism? The sacrament that frees us from sin, gives us new life in Christ and makes us members of the Church.</li><li>What is grace? God&#x27;s free gift of his life and his help.</li><li>What is sanctifying grace? The gift that makes us holy and enables us to share in God&#x27;s life.</li><li>Why did God give the commandments? To teach us the way of love and lead us to true freedom and happiness.</li><li>What is sin? A thought, word, action or omission freely chosen against God&#x27;s law.</li><li>Is temptation itself a sin? No. Temptation becomes sin only when we freely consent to what is wrong.</li><li>What is mortal sin? A grave sin committed with full knowledge and deliberate consent.</li><li>What is venial sin? A less serious sin, or a sin committed without full knowledge or complete consent.</li><li>What is conversion? Turning away from sin and returning to God.</li><li>Who gives us the grace to repent? The Holy Spirit.</li><li>Who instituted the Sacrament of Penance? Jesus Christ.</li><li>Who forgives sins in this sacrament? God forgives through the absolution given by the priest in the name of Christ and the Church.</li><li>What are the acts of the penitent? Contrition, confession and satisfaction, together with the intention to amend one&#x27;s life.</li><li>What is contrition? Sorrow for sin, hatred of the sin committed and a resolution not to sin again.</li></ol>\n<p>20 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4>\n<ol><li>What is perfect contrition? Sorrow for sin arising from love of God above all things.</li><li>What is a firm purpose of amendment? A sincere intention, with God&#x27;s help, to avoid sin and its near occasions.</li><li>What is an examination of conscience? A prayerful review of our choices in order to recognise our sins.</li><li>Which sins must be confessed? Every remembered mortal sin must be confessed in kind and number as far as possible.</li><li>Should venial sins be confessed? Their confession is not required, but the Church strongly recommends it.</li><li>How should we confess? Simply, honestly, clearly and without blaming others.</li><li>What is absolution? The sacramental act by which Christ, through the priest, forgives our sins.</li><li>What is satisfaction? Repairing, as far as possible, the harm caused by sin and doing the penance given by the priest.</li><li>What is the seal of Confession? The absolute duty of the priest never to reveal what he learns in Confession.</li><li>Why receive the sacrament regularly? To grow in grace, form our conscience, resist sin and deepen our friendship with Christ.</li></ol>\n<p>21 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4>\n<p>Appendix E</p>\n<p>Readiness Guide for Parents and Catechists</p>\n<p>Readiness is not perfect memory or mature theological language. A child should show sufficient understanding according to his or her capacity, a genuine desire for God&#x27;s forgiveness and a practical ability to participate without undue fear.</p>\n<p>Area What readiness looks like Ready</p>\n<p>The child knows that God loves us, that sin is real and that Jesus God and mercy offers forgiveness.</p>\n<p>Moral The child can usually distinguish a deliberate wrong choice from understanding an accident, mistake, temptation or action without freedom.</p>\n<p>Sacramental The child knows that sins are confessed to a priest and that God understanding forgives through sacramental absolution.</p>\n<p>Acts of the The child understands examination, contrition, honest confession, penitent amendment and penance at an age-appropriate level.</p>\n<p>Practical The child can make the Sign of the Cross, name remembered sins confidence simply, pray an Act of Contrition and follow gentle prompts.</p>\n<p>The child is not being pressured to invent sins or disclose them Freedom and publicly and knows how to seek help from a safe adult outside safety Confession.</p>\n<p>Pastoral Parents, catechists and the parish priest have had a reasonable judgement opportunity to support the child and address evident difficulties.</p>\n<p>Safeguarding note</p>\n<p>Catechists must follow diocesan safeguarding policy. A child should never be asked to disclose personal sins in a group, rehearsal or assessment. If a child discloses harm outside sacramental Confession, the adult must respond according to safeguarding procedures. If a priest becomes aware of danger only within sacramental Confession, he remains bound by the seal and may encourage the child to seek help or repeat the information outside the sacrament.</p>\n<h4>CANONICAL NOTE</h4>\n<p>First sacramental Confession is to precede First Holy Communion.</p>\n<p>22 Page</p>\n<h4>MY FIRST CONFESSION CATECHISM</h4>\n<p>Sources and doctrinal references</p>\n<p>Sacred Scripture. References are given throughout. Short quotations follow the English Standard Version - Catholic Edition.</p>\n<p>Catechism of the Catholic Church. Nos. 1420-1498 on Penance and Reconciliation; 1730-1748 on freedom; 1776-1802 on conscience; 1846-1876 on sin; 1987-2029 on grace and justification.</p>\n<p>Compendium of the Catechism of the Catholic Church. Questions 291-312 on the sacraments of healing.</p>\n<p>Code of Canon Law. Canons 914, 959-997, especially 959, 987-989 and 983-984; canon 827 on catechetical publications.</p>\n<p>Rite of Penance. Introduction and Rite for Reconciliation of Individual Penitents.</p>\n<p>Joseph Deharbe, S.J.. A Full Catechism of the Catholic Religion, English translation by John Fander (London, 1863), especially pp. 277-293.</p>\n<p>Doctrinal standard</p>\n<p>Where local practice or terminology differs, the approved liturgical books, diocesan policy and the directions of the parish priest govern practical preparation. No text in this draft should be interpreted contrary to the Catechism of the Catholic Church or the competent ecclesiastical authority.</p>\n<p>23 Page</p></div></details>\n<p>Activity page - use beside My First Confession Catechism</p>\n<h3>AIM</h3>\n<p>Help the child see First Confession as the beginning of a lifelong Catholic habit, not a graduation.</p>\n<h3>QUICK PREP</h3>\n<p>Use your hand - no materials needed.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “After First Confession, is Confession finished forever?” Then ask why Catholics return to the sacrament.</p>\n<h3>DO SOMETHING</h3>\n<p>Use five fingers to make a simple Catholic rhythm: Sunday Mass; daily prayer; Scripture; charity; turning back to God. Add Confession as Christ’s sacrament of forgiveness and strengthening. Let the child choose one realistic habit for this week.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read Lesson 12. Connect Confession with ordinary Catholic life and with preparation for First Holy Communion.</p>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why do Catholics go
