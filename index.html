goes with my mood”, “is worshipped with the Father and Son”. Sort them into TRUE / FALSE.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 1. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 1 &mdash; The Holy Spirit, Lord and Giver of Life</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Holy Spirit is the third Person of the Blessed Trinity: true God, one in being with the Father and the Son.</p>\n<p>There is one God in three divine Persons: the Father, the Son and the Holy Spirit. The Persons are distinct, yet each is wholly and eternally God. We worship the Holy Spirit together with the Father and the Son.</p>\n<p>The Holy Spirit is not merely a force, feeling or symbol. He is a divine Person who knows, loves, speaks, guides and sanctifies. He dwells in the soul that is in the state of grace and makes the Church a living temple.</p>\n<p>Everything in the Christian life depends upon grace. The Holy Spirit draws us to faith, gives divine life in Baptism, strengthens us in Confirmation, unites us to Christ in the Eucharist and helps us grow in holiness.</p>\n<p>Talk About It: Why is it important to know that the Holy Spirit is a Person, not just a feeling or a kind of</p>\n<p>spiritual energy?</p>\n<p>(The Holy Spirit is truly God, knows and loves us, acts personally, sanctifies us and can be known, loved and obeyed.)</p>\n<p>Learn these answers</p>\n<ol><li>Who is the Holy Spirit?</li></ol>\n<p>The Holy Spirit is the third Person of the Blessed Trinity, true God with the Father and the Son.</p>\n<ol><li>Are there three gods?</li></ol>\n<p>No. There is one God in three divine Persons.</p>\n<ol><li>Is the Holy Spirit only a power or feeling?</li></ol>\n<p>No. The Holy Spirit is a divine Person who acts with knowledge and love.</p>\n<ol><li>What does the Holy Spirit do in the Church?</li></ol>\n<p>He gives life, sanctifies, guides and preserves the Church in the truth.</p>\n<ol><li>What does the Holy Spirit do in a soul in grace?</li></ol>\n<p>He dwells within that soul and helps it know, love and serve God.</p>\n<h4>PRAYER</h4>\n<p>Come, Holy Spirit, teach me to know you, love you and follow your inspirations with a willing heart. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Pray the Glory be slowly, giving equal adoration to the Father, the Son and the Holy Spirit.</p>\n<p>4 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>The Holy Spirit, Lord and Giver of Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why does it matter that the Holy Spirit knows and loves, rather than being an impersonal force?</li><li>What difference would it make to prayer if the Holy Spirit is a Person?</li><li>Where does the catechism say the Spirit is active in Christian life?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the candidate to explain the Trinity without saying “three gods”. Do not demand a perfect analogy; simply check that they can say one God in three divine Persons.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit, teach me to know you, love you and follow your inspirations with a willing heart. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the Glory Be slowly once each day, consciously addressing Father, Son and Holy Spirit.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Promise and Pentecost</h2>\n<h3>AIM</h3>\n<p>At Pentecost the Holy Spirit strengthened fearful disciples to become courageous witnesses.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Before opening the catechism, ask: “What makes someone stay silent even when they know something is true?” Write down a few reasons: fear, embarrassment, wanting approval, uncertainty.</p>\n<h3>DO SOMETHING</h3>\n<p>Read Acts 2:1-11 aloud with different people reading narrator / crowd / Peter if desired. Circle or name every sign of movement: wind, fire, speech, proclamation, gathering.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 2. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 2 &mdash; The Promise and Pentecost</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>At Pentecost the risen Christ poured out the Holy Spirit upon the Apostles and sent them to bear witness.</p>\n<p>The prophets promised that God would pour out his Spirit. Jesus, conceived by the Holy Spirit and anointed for his mission, promised the Advocate who would teach, strengthen and guide his disciples.</p>\n<p>After the Resurrection, Jesus told the Apostles that they would receive power when the Holy Spirit came upon them and would be his witnesses. At Pentecost, the Spirit descended, and the fearful Apostles proclaimed Christ boldly.</p>\n<p>Pentecost was not a private spiritual experience. The Holy Spirit formed the Apostles into missionary witnesses and manifested the Church to the world. Confirmation perpetuates the grace of Pentecost in the Church.</p>\n<p>Talk About It: What changed in the Apostles after Pentecost, and what does that tell us about what</p>\n<p>the Holy Spirit does?</p>\n<p>(Frightened disciples became courageous witnesses; the Spirit strengthens people for mission, not merely for a private religious experience.)</p>\n<p>Learn these answers</p>\n<ol><li>Who promised to send the Holy Spirit?</li></ol>\n<p>Jesus Christ promised to send the Holy Spirit from the Father.</p>\n<ol><li>What happened at Pentecost?</li></ol>\n<p>The Holy Spirit descended upon the Apostles and strengthened them to proclaim Christ.</p>\n<ol><li>What signs accompanied Pentecost?</li></ol>\n<p>A sound like a mighty wind and tongues as of fire accompanied Pentecost.</p>\n<ol><li>What did the Apostles do after receiving the Spirit?</li></ol>\n<p>They preached the Gospel boldly and gathered believers into the Church.</p>\n<ol><li>How is Confirmation related to Pentecost?</li></ol>\n<p>Confirmation perpetuates in the Church the grace of Pentecost.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, as you strengthened the Apostles, give me courage to confess Christ and charity to serve those he loves. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Acts 1:6-9 and Acts 2:1-11. Notice how the Holy Spirit turns fear into witness.</p>\n<p>5 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>The Promise and Pentecost</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What actually changed in the Apostles after Pentecost?</li><li>Was Pentecost mainly a private spiritual feeling, or did it send them outward?</li><li>Where might a Catholic teenager need courage to be known as Catholic?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Give a scenario: friends mock someone for going to Mass. Ask for three possible responses - aggressive, silent, truthful-and-charitable. Which best shows Christian courage?</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, as you strengthened the Apostles, give me courage to confess Christ and charity to serve those he loves. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Do one small act of visible Christian courage this week: make the Sign of the Cross before a meal, answer a question honestly, or defend someone being mocked.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Sacraments of Christian Initiation</h2>\n<h3>AIM</h3>\n<p>Baptism, Confirmation and Eucharist belong together: new life, strengthening and nourishment in Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Draw three large circles labelled BAPTISM, CONFIRMATION, EUCHARIST. Ask the candidate to place the words “new life”, “strengthening”, “food”, “membership”, “mission”, “Communion” where they belong.</p>\n<h3>DO SOMETHING</h3>\n<p>Use the image of a living plant: being planted, strengthened to grow, continually fed. Ask where the analogy helps and where it breaks down.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 3. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 3 &mdash; The Sacraments of Christian Initiation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Baptism, Confirmation and the Eucharist form one Christian initiation: new life, strengthening and nourishment in Christ.</p>\n<p>In Baptism we are freed from sin, born again as children of God and made members of Christ and his Church. Confirmation does not replace or ratify Baptism; it completes baptismal grace and strengthens the baptized for witness.</p>\n<p>The Eucharist completes Christian initiation by nourishing us with Christ himself. The three sacraments belong together even when, for pastoral reasons in the Latin Church, they are celebrated at different ages.</p>\n<p>Confirmation is sometimes called a sacrament of Christian maturity. This means maturity in grace, not simply reaching a particular birthday. God gives the sacrament freely, while the candidate is prepared to receive and live its grace responsibly.</p>\n<p>Talk About It: Why would it be wrong to think of Confirmation as “graduating” from being Catholic?</p>\n<p>(Baptism begins new life, Confirmation strengthens and completes baptismal grace, and the Eucharist nourishes that life. Confirmation deepens Christian life rather than ending formation.)</p>\n<p>Learn these answers</p>\n<ol><li>Which are the sacraments of Christian initiation?</li></ol>\n<p>Baptism, Confirmation and the Holy Eucharist are the sacraments of Christian initiation.</p>\n<ol><li>What does Baptism begin?</li></ol>\n<p>Baptism begins the new life of grace in Christ.</p>\n<ol><li>What does Confirmation do to baptismal grace?</li></ol>\n<p>Confirmation completes and strengthens baptismal grace.</p>\n<ol><li>Which sacrament completes Christian initiation?</li></ol>\n<p>The Holy Eucharist completes Christian initiation.</p>\n<ol><li>Does Confirmation make Baptism valid?</li></ol>\n<p>No. Baptism is already valid and fruitful; Confirmation brings its grace to completion.</p>\n<h4>PRAYER</h4>\n<p>Father, thank you for making me your child in Baptism. Complete your work in me and keep me faithful at the table of your Son. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Find your baptismal date and church. Thank God for your baptismal godparents and pray for them.</p>\n<p>6 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>The Sacraments of Christian Initiation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why is Confirmation not “graduation from Church”?</li><li>What did Baptism already give?</li><li>What does the Eucharist continue to do after Confirmation?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask: “What would six months after Confirmation look like if someone had treated it as graduation?” Then ask what the opposite would look like.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, thank you for making me your child in Baptism. Complete your work in me and keep me faithful at the table of your Son. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Find your baptismal date and church. If possible, ask a parent or godparent what they remember about the day.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Confirmation in Scripture and Tradition</h2>\n<h3>AIM</h3>\n<p>The Apostles prayed and laid hands on the baptised so that they would receive the Holy Spirit; the Church preserves this apostolic pattern.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Put a Bible in the middle. Ask: “If someone says Confirmation was invented centuries later, where would you begin looking?” Then open Acts 8:14-17 together.</p>\n<h3>DO SOMETHING</h3>\n<p>Scripture detective: read Acts 8:14-17 and Acts 19:5-6. On paper make four headings: Baptised / Apostles or Paul / Prayer / Laying on of hands. Fill in what you find.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 4. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 4 &mdash; Confirmation in Scripture and Tradition</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Christ instituted Confirmation, and the Apostles imparted the Holy Spirit to the baptized by prayer and the laying on of hands.</p>\n<p>In Samaria, people had received Baptism. Peter and John came, prayed for them and laid hands upon them, and they received the Holy Spirit. Saint Paul did likewise for baptized disciples at Ephesus.</p>\n<p>Sacred Scripture shows the apostolic pattern; Sacred Tradition recognises in it the origin of Confirmation. From the earliest centuries the Church has used the laying on of hands and anointing with consecrated chrism.</p>\n<p>The sacrament has several traditional names: Confirmation, because it strengthens baptismal grace; Chrismation, because of the sacred anointing; and sealing, because it imprints the indelible mark of the Holy Spirit.</p>\n<p>Talk About It: If someone asked, “Where did Confirmation come from?”, what would you point to in</p>\n<p>the life of the Apostles?</p>\n<p>(Prayer, laying on of hands and the giving of the Holy Spirit in Acts; the Church recognises this apostolic pattern and preserves it sacramentally.)</p>\n<p>Learn these answers</p>\n<ol><li>Who instituted Confirmation?</li></ol>\n<p>Jesus Christ instituted Confirmation.</p>\n<ol><li>How did the Apostles impart the Holy Spirit to the baptized?</li></ol>\n<p>They prayed and laid their hands upon them.</p>\n<ol><li>Where is this apostolic practice described?</li></ol>\n<p>It is described especially in Acts 8:14-17 and Acts 19:5-6.</p>\n<ol><li>What does the name Confirmation mean?</li></ol>\n<p>It means strengthening, because the sacrament strengthens baptismal grace.</p>\n<ol><li>Why is Confirmation also called Chrismation?</li></ol>\n<p>Because the baptized are anointed with sacred chrism.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, you gave the Holy Spirit to your Church. Keep me in the faith of the Apostles and make me faithful to their mission. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Acts 8:14-17. Identify the baptized people, the Apostles, the prayer, the laying on of hands and the gift.</p>\n<p>7 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>Confirmation in Scripture and Tradition</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What happens before the laying on of hands?</li><li>Who comes to the baptised people?</li><li>What does the Church preserve from the apostolic pattern?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>One-minute explain: “Where does Confirmation come from?” Candidate answers as if speaking to a sceptical friend.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, you gave the Holy Spirit to your Church. Keep me in the faith of the Apostles and make me faithful to their mission. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read Acts 8:14-17 once more during the week and underline one phrase you want to remember.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Minister, Matter and Form</h2>\n<h3>AIM</h3>\n<p>The Church does not invent sacraments as she goes: Confirmation has a minister, sacred chrism and sacramental words.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Place three headings on paper: WHO? WHAT? WORDS? Ask the candidate to guess what belongs under each before opening the catechism.</p>\n<h3>DO SOMETHING</h3>\n<p>Rehearsal without pretending to confer the sacrament: candidate stands, sponsor position is described, mentor says “The bishop anoints the forehead with chrism and says the sacramental words”; candidate practises answering “Amen”. Do not mimic anointing with oil.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 5. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 5 &mdash; The Minister, Matter and Form</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>In the Latin Church the ordinary minister is the bishop; Confirmation is conferred by anointing with chrism, the laying on of the hand and the sacramental words.</p>\n<p>The bishop is the ordinary minister because he is a successor of the Apostles and possesses the fullness of Holy Orders. His ministry shows that Confirmation joins us more closely to the apostolic Church and her mission.</p>\n<p>A priest can validly confirm when the law itself or the competent authority grants him the faculty. This happens, for example, in adult initiation and reception into full communion; in danger of death any priest should confirm an unconfirmed Catholic.</p>\n<p>The essential rite in the Latin Church is the anointing of the forehead with sacred chrism, done by the laying on of the minister&#x27;s hand, with the words: “N., be sealed with the Gift of the Holy Spirit.”</p>\n<p>Talk About It: Why do you think it matters that the bishop normally confirms, rather than just any</p>\n<p>Catholic doing it?</p>\n<p>(The bishop is successor of the Apostles and his ministry shows Confirmation&#x27;s connection with the apostolic Church; the sacrament also has definite matter, form and minister rather than being something we invent ourselves.)</p>\n<p>Learn these answers</p>\n<ol><li>Who is the ordinary minister of Confirmation?</li></ol>\n<p>The bishop is the ordinary minister of Confirmation.</p>\n<ol><li>May a priest confirm?</li></ol>\n<p>Yes. A priest may confirm when he has the faculty from the law or competent authority.</p>\n<ol><li>What is the sacred matter used in Confirmation?</li></ol>\n<p>Sacred chrism consecrated by a bishop is used in Confirmation.</p>\n<ol><li>Where is the candidate anointed?</li></ol>\n<p>The candidate is anointed on the forehead.</p>\n<ol><li>What words confer Confirmation in the Roman Rite?</li></ol>\n<p>“N., be sealed with the Gift of the Holy Spirit.”</p>\n<h4>PRAYER</h4>\n<p>God of the Apostles, keep our bishop and priests faithful. Through their ministry, strengthen your people in holiness and truth. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Learn the name of your diocesan bishop and pray for him by name.</p>\n<p>8 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>The Minister, Matter and Form</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why is the bishop normally the minister?</li><li>Why does the Church use definite words and signs?</li><li>What does the candidate answer after the sacramental words?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the candidate to explain the link between the bishop and the Apostles in one sentence.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>God of the Apostles, keep our bishop and priests faithful. Through their ministry, strengthen your people in holiness and truth. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn the name of the diocesan bishop and pray for him by name.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Anointing, Chrism and the Spiritual Seal</h2>\n<h3>AIM</h3>\n<p>Oil, fragrance, anointing and seal make visible the invisible grace of consecration, strength and permanent belonging to Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Bring a small bottle of ordinary scented oil or hand cream if available. Let the candidate smell it. Ask: “Why might the Church use something that can be felt and smelled?” Make clear this is not sacred chrism.</p>\n<h3>DO SOMETHING</h3>\n<p>Symbol match: OIL =? FRAGRANCE =? SEAL =? CROSS =? Have the candidate match to strength/consecration, holy witness, permanent belonging, Christ.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 6. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 6 &mdash; Anointing, Chrism and the Spiritual Seal</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The visible signs of Confirmation reveal the invisible gift: the Holy Spirit consecrates, strengthens and seals us for Christ.</p>\n<p>Sacred chrism is perfumed oil consecrated by the bishop. Oil signifies strengthening and healing; fragrance signifies the pleasing witness of a holy life; anointing signifies consecration to Christ, the Anointed One.</p>\n<p>The minister extends hands over the candidates and invokes the sevenfold gift of the Holy Spirit. He then lays his hand upon each candidate through the act of anointing and marks the forehead with the Sign of the Cross.</p>\n<p>The seal is an indelible spiritual character. It marks us as belonging to Christ, consecrates us for worship and mission, and cannot be erased. The sign of peace after the anointing expresses communion with the bishop and the Church.</p>\n<p>Talk About It: What do you think the signs of oil, fragrance and a seal each tell us about the invisible</p>\n<p>grace God is giving?</p>\n<p>(Oil suggests strengthening and consecration, fragrance suggests the witness of a holy life, and the seal means permanent belonging to Christ and mission in his service.)</p>\n<p>Learn these answers</p>\n<ol><li>What is sacred chrism?</li></ol>\n<p>Sacred chrism is perfumed oil consecrated by a bishop.</p>\n<ol><li>What does the oil signify?</li></ol>\n<p>It signifies strength, healing and consecration by the Holy Spirit.</p>\n<ol><li>What does the fragrance signify?</li></ol>\n<p>It signifies the pleasing witness of a holy Christian life.</p>\n<ol><li>What does the spiritual seal mean?</li></ol>\n<p>It means that Christ marks us permanently with the character of his Spirit.</p>\n<ol><li>What follows the anointing in the present Roman Rite?</li></ol>\n<p>The minister gives the sign of peace, showing communion with the Church.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, seal me for Christ. Let my thoughts, words and actions carry the fragrance of his truth and charity. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Mass, notice the holy oils if your church displays them. Ask when the chrism is consecrated.</p>\n<p>9 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>Anointing, Chrism and the Spiritual Seal</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What can oil communicate without words?</li><li>Why does fragrance make a good image for Christian witness?</li><li>What does a permanent seal say about belonging?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask for one example of a life that has a “good fragrance” - a way holiness becomes noticeable without showing off.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, seal me for Christ. Let my thoughts, words and actions carry the fragrance of his truth and charity. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At church, notice whether the holy oils are displayed. If you see them, identify which vessel is chrism if labelled.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Effects and Character of Confirmation</h2>\n<h3>AIM</h3>\n<p>Confirmation deepens baptismal grace, strengthens the bond with Christ and the Church, and gives special strength for witness.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Ask: “If Confirmation really changes something, what should it strengthen?” Let the candidate suggest answers before reading the catechism.</p>\n<h3>DO SOMETHING</h3>\n<p>Everyday witness cards: give scenarios - correcting a lie, refusing gossip, explaining why you go to Mass, choosing honesty in schoolwork, defending someone excluded. Ask what truthful and charitable witness looks like.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 7. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 7 &mdash; The Effects and Character of Confirmation</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Confirmation pours out the Holy Spirit, deepens baptismal grace and gives special strength to witness to Christ.</p>\n<p>Confirmation roots us more deeply as children of the Father, unites us more firmly to Christ, increases the gifts of the Holy Spirit and makes our bond with the Church more perfect.</p>\n<p>It gives special strength to spread and defend the faith by word and action, confess the name of Christ boldly and never be ashamed of the Cross. Strength is ordered by charity: Christian witness must be truthful, patient and loving.</p>\n<p>Like Baptism and Holy Orders, Confirmation imprints an indelible character and is received only once. Its grace can be neglected, but the character remains; through repentance and prayer its fruits can grow anew.</p>\n<p>Talk About It: If Confirmation gives strength to witness to Christ, what might that look like in ordinary</p>\n<p>life rather than in a dramatic situation?</p>\n<p>(Speaking truthfully, living the faith openly, refusing shame about the Cross, defending the faith with charity, and persevering in ordinary duties.)</p>\n<p>Learn these answers</p>\n<ol><li>What is the chief effect of Confirmation?</li></ol>\n<p>It is a special outpouring of the Holy Spirit, as at Pentecost.</p>\n<ol><li>How does Confirmation deepen our relation to God?</li></ol>\n<p>It roots us more deeply as children of the Father and unites us more firmly to Christ.</p>\n<ol><li>How does Confirmation unite us to the Church?</li></ol>\n<p>It makes our bond with the Church more perfect and joins us more closely to her mission.</p>\n<ol><li>What strength does Confirmation give?</li></ol>\n<p>It gives strength to spread and defend the faith by word and deed.</p>\n<ol><li>Can Confirmation be repeated?</li></ol>\n<p>No. Confirmation is received only once because it imprints an indelible character.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, deepen every grace of my Baptism. Make me a courageous, gentle and faithful witness of Jesus Christ. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Write one sentence explaining the Catholic faith kindly to someone who asks what you believe.</p>\n<p>10 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>The Effects and Character of Confirmation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What does Confirmation deepen?</li><li>What kind of strength does it give?</li><li>Why is Christian witness not the same as being argumentative?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Have the candidate complete the sentence: “Confirmation is not about making me louder; it is about making me more…”</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, deepen every grace of my Baptism. Make me a courageous, gentle and faithful witness of Jesus Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Write one sentence you could say kindly if someone asked, “Why are you Catholic?”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Seven Gifts of the Holy Spirit</h2>\n<h3>AIM</h3>\n<p>The seven gifts make us ready to follow the promptings of the Holy Spirit in real choices.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Write the seven gifts on separate scraps of paper. Put them face down. Pick one at random and ask: “Where might someone our age need this?”</p>\n<h3>DO SOMETHING</h3>\n<p>Scenario match: choosing friends wisely; revising a difficult belief; refusing peer pressure; praying with reverence; asking advice before a decision; seeing possessions in the light of God; choosing what leads closer to God. Match each to a gift.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 8. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 8 &mdash; The Seven Gifts of the Holy Spirit</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The seven gifts are lasting dispositions that make us docile and ready to follow the promptings of the Holy Spirit.</p>\n<p>The seven gifts are wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. They were foretold by Isaiah and are found in their fullness in Jesus Christ.</p>\n<p>The gifts do not replace study, prudence or effort. They perfect the theological and moral virtues so that we can respond readily when the Holy Spirit moves us. They grow in a life of grace, prayer and obedience.</p>\n<p>Fear of the Lord is not servile terror. It is reverent awe and loving sorrow at the thought of offending God. Fortitude is not aggression; it is steadfast courage to do what is right despite difficulty.</p>\n<p>Talk About It: Which gift of the Holy Spirit do you think you need most at the moment, and in what</p>\n<p>kind of situation would you need it?</p>\n<p>(The gifts make us submit to the Spirit in real choices.)</p>\n<p>Learn these answers</p>\n<ol><li>What are the seven gifts of the Holy Spirit?</li></ol>\n<p>Wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</p>\n<ol><li>What do the gifts make us ready to do?</li></ol>\n<p>They make us ready to follow the promptings of the Holy Spirit.</p>\n<ol><li>Which gift helps us judge all things in the light of God?</li></ol>\n<p>Wisdom helps us judge all things in the light of God.</p>\n<ol><li>Which gift gives courage in difficulty?</li></ol>\n<p>Fortitude gives courage to do and endure what is right.</p>\n<ol><li>What is fear of the Lord?</li></ol>\n<p>It is reverent awe of God and a loving desire not to offend him.</p>\n<h4>PRAYER</h4>\n<p>Spirit of wisdom and understanding, counsel and fortitude, knowledge, piety and holy fear, make me docile to your grace. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one gift you especially need this week. Ask for it each morning and act upon it.</p>\n<p>11 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>The Seven Gifts of the Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Which gift is easiest to understand?</li><li>Which is most often misunderstood?</li><li>Which gift do you most need now, and why?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Make a “gift for this week” card: name one gift, one situation and one concrete action.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Spirit of wisdom and understanding, counsel and fortitude, knowledge, piety and holy fear, make me docile to your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask especially for one gift each morning and notice one moment when you needed it.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Virtues, Fruits and Charisms</h2>\n<h3>AIM</h3>\n<p>Virtues shape who we become; fruits show grace ripening in a life; charisms are gifts for serving the Church.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Put three headings down: WHO I AM BECOMING / WHAT OTHERS BEGIN TO SEE / WHAT I CAN USE TO SERVE. Ask the candidate where virtues, fruits and charisms belong.</p>\n<h3>DO SOMETHING</h3>\n<p>Fruit audit: choose three fruits from Galatians 5 and rate 1-5 how visible each has been in your week. No sharing of anything too private is required; the aim is honest reflection.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 9. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 9 &mdash; Virtues, Fruits and Charisms</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The Spirit perfects the virtues, forms holy fruits in us and gives charisms for the service of the Church.</p>\n<p>The theological virtues are faith, hope and charity. The cardinal virtues are prudence, justice, fortitude and temperance. The gifts of the Holy Spirit make us more responsive to grace and perfect the virtues.</p>\n<p>The fruits of the Spirit are signs of a life being transformed: charity, joy, peace, patience, kindness, goodness, generosity, gentleness, faithfulness, modesty, self-control and chastity. Fruit grows through grace and faithful cooperation, not instant emotion.</p>\n<p>Charisms are particular gifts for building up the Church and serving others. They may be striking or ordinary, but all must be discerned, used humbly and submitted to the judgement of the Church. Holiness and charity are more important than display.</p>\n<p>Talk About It: What&#x27;s the difference between having a gift that impresses people and becoming a holy</p>\n<p>person? Which matters more?</p>\n<p>(Charisms are for service, whereas holiness is shaped by grace, virtue and charity; gifts are not for display, and holiness is more important than being striking or impressive.)</p>\n<p>Learn these answers</p>\n<ol><li>What are the theological virtues?</li></ol>\n<p>The theological virtues are faith, hope and charity.</p>\n<ol><li>What are the cardinal virtues?</li></ol>\n<p>The cardinal virtues are prudence, justice, fortitude and temperance.</p>\n<ol><li>What are the fruits of the Holy Spirit?</li></ol>\n<p>They are perfections formed in us by the Spirit as we cooperate with grace.</p>\n<ol><li>What are charisms?</li></ol>\n<p>Charisms are gifts of grace given for the service and building up of the Church.</p>\n<ol><li>How should charisms be used?</li></ol>\n<p>They should be used humbly, in charity and under the discernment of the Church.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, increase faith, hope and charity in me. Let your fruits be seen in my conduct and use every gift for the good of others. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one fruit of the Spirit and practise a concrete act that expresses it at home, school or work.</p>\n<p>12 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>Virtues, Fruits and Charisms</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why can someone have an impressive ability without being holy?</li><li>Which fruit of the Spirit would make the biggest difference in your home or friendship group?</li><li>Why are charisms for service rather than attention?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Name one ordinary skill or interest - sport, music, organising, listening, technology, patience with children - and ask how it could serve others rather than self-promotion.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, increase faith, hope and charity in me. Let your fruits be seen in my conduct and use every gift for the good of others. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one fruit and practise one concrete action that expresses it this week.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Renewing the Promises of Baptism</h2>\n<h3>AIM</h3>\n<p>At Confirmation the candidate personally professes the Catholic faith already received in Baptism and rejects sin and Satan.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Ask: “What is the difference between inheriting something and personally choosing to live by it?” Use examples such as a family name, club, tradition or responsibility.</p>\n<h3>DO SOMETHING</h3>\n<p>Creed map: take the Apostles’ Creed and mark FATHER / SON / HOLY SPIRIT / CHURCH. Ask the candidate to choose one line they understand well and one they want explained more.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 10. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 10 &mdash; Renewing the Promises of Baptism</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Before Confirmation, candidates renounce Satan and profess the faith of the Church into which they were baptized.</p>\n<p>The renewal of baptismal promises shows that Confirmation follows Baptism. The candidate rejects sin and Satan, then professes faith in the Father, the Son, the Holy Spirit and the holy Catholic Church.</p>\n<p>This is not inventing a private faith or deciding whether Baptism was real. It is personally professing the apostolic faith received from the Church and accepting anew the duties that flow from Baptism.</p>\n<p>To profess the Creed truthfully is to shape life by it. Faith leads us to worship God, keep his commandments, form conscience by Church teaching, repent when we sin and love our neighbour in practical ways.</p>\n<p>Talk About It: When you renew your baptismal promises, are you inventing your own version of the</p>\n<p>faith, or saying yes to something you have already received?</p>\n<p>(The candidate personally professes the apostolic faith received from the Church and accepts anew the duties flowing from Baptism.)</p>\n<p>Learn these answers</p>\n<ol><li>Why are baptismal promises renewed before Confirmation?</li></ol>\n<p>To show that Confirmation follows Baptism and strengthens its grace.</p>\n<ol><li>What does the candidate renounce?</li></ol>\n<p>The candidate renounces Satan, sin and everything opposed to God.</p>\n<ol><li>What faith does the candidate profess?</li></ol>\n<p>The one apostolic faith of the Catholic Church.</p>\n<ol><li>Is faith only a set of words?</li></ol>\n<p>No. Faith is God&#x27;s gift by which we believe his truth and entrust ourselves to him.</p>\n<ol><li>How do we live our baptismal promises?</li></ol>\n<p>By worship, obedience, repentance, prayer and charity.</p>\n<h4>PRAYER</h4>\n<p>O God, strengthen the faith given to me in Baptism. Help me reject sin, profess the Creed sincerely and live as your faithful child. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read the Apostles’ Creed and identify what it teaches about the Father, the Son, the Holy Spirit and the Church.</p>\n<p>13 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>Renewing the Promises of Baptism</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Are you inventing your own faith at Confirmation?</li><li>What are you saying no to?</li><li>What are you saying yes to?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Practice the logic, not a performance: mentor says “Do you reject sin?” Candidate answers in ordinary language what that means before looking at the liturgical wording.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>O God, strengthen the faith given to me in Baptism. Help me reject sin, profess the Creed sincerely and live as your faithful child. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read the Creed once slowly this week and choose one line to pray rather than merely recite.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Witness, Spiritual Combat and Mission</h2>\n<h3>AIM</h3>\n<p>The enemy is sin and evil, not other people; the confirmed fight spiritually with truth, grace, prayer, sacraments and charity.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Draw two columns: PEOPLE / REAL ENEMIES. Put “annoying classmate”, “temptation”, “person who disagrees”, “sin”, “the devil”, “someone who mocks faith”, “fear”, “pride”. Sort carefully.</p>\n<h3>DO SOMETHING</h3>\n<p>Choose-your-response: someone posts something hostile about Catholic belief. Compare four responses: insult back; hide faith; answer calmly with truth; pray and say nothing because engagement would only inflame. Discuss prudence and charity.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 11. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 11 &mdash; Witness, Spiritual Combat and Mission</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>The confirmed are strengthened as witnesses and soldiers of Christ, fighting sin with truth, grace and charity.</p>\n<p>Traditional catechisms call the confirmed Christian a soldier of Christ. The enemies are not other people but the world insofar as it rejects God, the flesh wounded by disordered desire, and the devil who tempts and accuses.</p>\n<p>Our weapons are spiritual: faith, prayer, Scripture, the sacraments, truth, virtue, penance and works of mercy. We defend the faith without cruelty or pride, respecting every person while refusing what is false or sinful.</p>\n<p>Every confirmed person shares in the Church&#x27;s apostolate. Some serve in family life, education, public life, skilled work or care of the poor; some are called to priesthood or consecrated life. Mission begins with fidelity in ordinary duties.</p>\n<p>Talk About It: When the Church speaks about spiritual combat, who is the enemy — and who is not</p>\n<p>the enemy?</p>\n<p>(Other people are never the enemy to be hated. The struggle is against sin, temptation, the fallen world and the devil; Christians fight with truth, grace, prayer, sacraments and charity.)</p>\n<p>Learn these answers</p>\n<ol><li>Why is the confirmed Christian called a soldier of Christ?</li></ol>\n<p>Because Confirmation strengthens us for spiritual combat and steadfast witness.</p>\n<ol><li>Who are the enemies in spiritual combat?</li></ol>\n<p>Sin, temptation, the fallen world and the devil—not the people we are commanded to love.</p>\n<ol><li>How do Christians defend the faith?</li></ol>\n<p>By truthful words, holy conduct, patient reason and charity.</p>\n<ol><li>What is the apostolate?</li></ol>\n<p>The apostolate is the work by which Christians share in the Church&#x27;s mission.</p>\n<ol><li>Where does mission usually begin?</li></ol>\n<p>It begins in prayer, ordinary duties, family, parish, study, work and service.</p>\n<h4>PRAYER</h4>\n<p>Saint Michael the Archangel, defend us in battle. Holy Spirit, make me steadfast against sin and generous in the service of souls. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Perform one work of mercy quietly and without seeking praise.</p>\n<p>14 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4></div></details>\n<h2>Witness, Spiritual Combat and Mission</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why must another person never become the enemy we hate?</li><li>What are Christian “weapons”?</li><li>Where does mission usually begin?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Mission map: family / school-college / parish / online / friends / poor and vulnerable. Candidate names one realistic form of witness or service in two areas.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Saint Michael the Archangel, defend us in battle. Holy Spirit, make me steadfast against sin and generous in the service of souls. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Do one quiet work of mercy or service without announcing it.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Preparing, Receiving and Persevering</h2>\n<h3>AIM</h3>\n<p>Preparation leads to a sacrament to be lived: prayer, Confession, state of grace, sincere intention and perseverance afterwards.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Ask: “Imagine it is six months after Confirmation. What would show that the day changed more than your photo album?” Let the candidate make the list first.</p>\n<h3>DO SOMETHING</h3>\n<p>Make a realistic four-part rule: SUNDAY / DAILY / REGULARLY / SERVICE. Candidate chooses one sustainable practice under each, using Appendix D as a guide.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 12. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<details class=\"conv\"><summary>Open Lesson 12 &mdash; Preparing, Receiving and Persevering</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>A candidate prepares by instruction, prayer, intention and the state of grace, then lives the sacrament through persevering discipleship.</p>\n<p>A baptised person who has not yet been confirmed can receive Confirmation. A candidate with the use of reason should be suitably instructed, properly disposed, able to renew baptismal promises and sincerely intend to receive the sacrament.</p>\n<p>Confirmation should be received in the state of grace. Candidates should examine their conscience and receive sacramental Confession beforehand. More intense prayer, Sunday Mass, worthy Communion, charity and attention at rehearsals help dispose the soul.</p>\n<p>After Confirmation, give thanks and persevere. Remain faithful to Sunday Mass, frequent Confession, daily prayer, Scripture, parish life and service. The sacrament is not the end of formation but a permanent source of strength for Christian life.</p>\n<p>Talk About It: What would make it clear, six months after Confirmation, that the sacrament had not</p>\n<p>become just a one-day ceremony for you?</p>\n<p>(Sunday Mass, Confession, prayer, Scripture, service, parish belonging, moral seriousness and continued discipleship. Confirmation is a permanent source of strength, not a finishing line.)</p>\n<p>Learn these answers</p>\n<ol><li>Who can receive Confirmation?</li></ol>\n<p>Every baptized person who has not already been confirmed can receive it.</p>\n<ol><li>How should a candidate prepare?</li></ol>\n<p>By suitable instruction, a sincere intention, prayer, good works and proper disposition.</p>\n<ol><li>In what state should Confirmation be received?</li></ol>\n<p>Confirmation should be received in the state of grace.</p>\n<ol><li>What sacrament should be received beforehand if needed?</li></ol>\n<p>The Sacrament of Penance should be received beforehand.</p>\n<ol><li>How do we persevere after Confirmation?</li></ol>\n<p>By Mass, Confession, prayer, Scripture, virtue, parish communion and service.</p>\n<h4>PRAYER</h4>\n<p>Lord, complete the good work you have begun in me. Make me ready to receive your Spirit and faithful in every duty that follows. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Make a practical plan for Confession, daily prayer, Sunday Mass and one regular form of service.</p>\n<p>15 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4>\n<p>Appendix A</p>\n<p>The Rite of Confirmation Step by Step</p>\n<p>Confirmation is normally celebrated within Mass. The exact arrangements are governed by the approved liturgical book and the directions of the bishop, parish priest and ministers. This guide explains the principal moments without replacing a parish rehearsal.</p>\n<p>Moment What happens How I take part</p>\n<p>The candidates are presented to the Stand attentively and answer if the local rite Presentation bishop or other minister. asks you to do so.</p>\n<p>The minister explains the mystery Listen for how the Holy Spirit strengthens Homily and duties of Confirmation. Baptism and sends the Church.</p>\n<p>Baptismal Candidates renounce Satan and Answer sincerely and clearly with the whole promises profess the Catholic faith. group.</p>\n<p>The minister invites everyone to pray Ask inwardly for the Holy Spirit and the Silent prayer for the candidates. seven gifts.</p>\n<p>Laying on of The minister extends hands and Stand in reverent prayer and receive the hands invokes the sevenfold Spirit. Church&#x27;s intercession.</p>\n<p>Each candidate is anointed on the Approach calmly; your sponsor places a Anointing forehead with sacred chrism. hand on your shoulder if directed.</p>\n<p>Sacramental The minister says, “N., be sealed Answer, “Amen.” words with the Gift of the Holy Spirit.”</p>\n<p>The minister says, “Peace be with Sign of peace Answer, “And with your spirit.” you.”</p>\n<p>Universal The Church prays for the newly Join the petitions and pray for the mission Prayer confirmed and for the world. now entrusted to you.</p>\n<p>Mass continues, usually with a Eucharist and Participate fully, receive Communion if commemoration of the newly blessing properly disposed and give thanks. confirmed.</p>\n<h4>UPDATED PRACTICE</h4>\n<p>Older catechisms may describe a light blow on the cheek. The present Roman Rite instead gives the sign of peace after the anointing.</p>\n<p>16 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4>\n<p>Appendix B</p>\n<p>The Gifts and Fruits at a Glance</p>\n<p>The gifts make us docile to the Holy Spirit; the fruits are the qualities his grace forms in a life of faithful cooperation. The descriptions below are aids to understanding, not replacements for the Church&#x27;s definitions.</p>\n<p>Gift What it perfects in us A question for discernment</p>\n<p>Tastes divine things and judges life in the light What choice leads me closer to Wisdom of God. God?</p>\n<p>Understandin What mystery of faith should I Penetrates more deeply into the truths of faith. g study more carefully?</p>\n<p>Helps practical judgement under the Spirit&#x27;s What is the right action here and Counsel guidance. whom should I ask?</p>\n<p>Gives steadfast courage to do and endure what What good am I avoiding Fortitude is right. because it is difficult?</p>\n<p>Sees created things truthfully and orders them Am I using this gift or possession Knowledge to God. according to God&#x27;s purpose?</p>\n<p>Forms filial love for God and reverence for his How can I pray and serve with a Piety family. childlike heart?</p>\n<p>Fear of the Fills us with awe and loving sorrow at offending Do I honour God more than Lord God. approval, comfort or success?</p>\n<p>The twelve traditional fruits</p>\n<p>Charity Loving God above all and our neighbour for God&#x27;s sake. Joy Spiritual gladness in God and his goodness. Peace The tranquillity of rightly ordered love.</p>\n<p>Patience Enduring delay, suffering or provocation without abandoning charity. Kindness A ready and considerate desire to do good. Goodness Moral uprightness expressed in generous action. Generosity A large-hearted readiness to give and serve. Gentleness Strength governed by humility and charity.</p>\n<p>Faithfulness Reliability and constancy towards God and others. Modesty Dignified restraint in appearance, speech and conduct. Self-control Government of desires according to reason and grace. Chastity Integration of sexuality within one&#x27;s state of life and vocation.</p>\n<p>17 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4>\n<p>Appendix C</p>\n<p>Choosing a Sponsor and, Where Customary, a Saint</p>\n<p>The sponsor</p>\n<p>As far as possible, a candidate has one sponsor. The sponsor presents the candidate and afterwards helps the newly confirmed live as a true witness of Christ. It is desirable, though not required, to choose one of the baptismal godparents, showing the unity of Baptism and Confirmation.</p>\n<p>Requirement What it means</p>\n<p>Chosen suitably The person is designated by the candidate, parents or pastor and genuinely intends to fulfil the role.</p>\n<p>Catholic initiation The sponsor is a Catholic who has been confirmed and has received the Holy Eucharist.</p>\n<p>Mature enough Ordinarily the sponsor has completed the sixteenth year, unless lawful local provision or a just exception applies.</p>\n<p>Life of faith The sponsor leads a life in harmony with the Catholic faith and the responsibility undertaken.</p>\n<p>Canonically free The sponsor is not bound by a canonical penalty and is not the candidate&#x27;s father or mother.</p>\n<p>A Confirmation name</p>\n<p>The sacrament does not require a new name. Where local custom permits or encourages one, choosing the name of a canonised or beatified saint can express a desire for heavenly friendship and imitation. It must never distract from the candidate&#x27;s baptismal identity or become merely decorative.</p>\n<h4>GOOD DISCERNMENT</h4>\n<p>Choose a saint because his or her life leads you towards Christ. Read a reliable life, learn the saint&#x27;s feast day and virtues, and ask for intercession. Follow parish instructions about whether to use your baptismal name or an additional saint&#x27;s name.</p>\n<p>My sponsor and why I chose this person: ______________________________________________________</p>\n<p>My saint or baptismal patron: ______________________________________________________</p>\n<p>The virtue I hope to imitate: ______________________________________________________</p>\n<p>18 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4>\n<p>Appendix D</p>\n<p>Prayers and a Rule of Life</p>\n<p>Come, Holy Spirit</p>\n<h4>PRAY</h4>\n<p>Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love. Send forth your Spirit and they shall be created, and you shall renew the face of the earth. Amen.</p>\n<p>Prayer for the seven gifts</p>\n<h4>PRAY</h4>\n<p>Holy Spirit, give me wisdom to seek God, understanding to know the faith, counsel to choose rightly, fortitude to persevere, knowledge to order created things well, piety to love the Father and fear of the Lord to worship him in awe. Amen.</p>\n<p>Before Confirmation</p>\n<h4>PRAY</h4>\n<p>Lord Jesus Christ, I belong to you through Baptism. Cleanse me from sin, increase my faith and prepare me to receive the seal of your Spirit with humility, courage and joy. Amen.</p>\n<p>After Confirmation</p>\n<h4>PRAY</h4>\n<p>Father, I thank you for the Gift of the Holy Spirit. Keep me united to Christ and his Church. Make my whole life a faithful witness in word, deed, prayer and service. Amen.</p>\n<p>For my sponsor and patron saint</p>\n<h4>PRAY</h4>\n<p>God of grace, bless my sponsor and reward every good example. Saint N., faithful friend of Christ, pray that I may imitate your virtue, resist sin and fulfil the vocation God gives me. Amen.</p>\n<p>A simple rule of life after Confirmation</p>\n<p>Rhythm Practice</p>\n<p>Daily Morning offering; a passage of Scripture; examination of conscience; prayer to the Holy Spirit.</p>\n<p>Weekly Sunday Mass; a deliberate work of charity; time free from unnecessary digital noise.</p>\n<p>Regularly Sacramental Confession; Eucharistic adoration or a visit to the Blessed Sacrament; sound Catholic study.</p>\n<p>In decisions Ask what is true, good and loving; seek counsel; reject occasions of sin; choose the duties of your vocation.</p>\n<p>In the parish Take part faithfully and find a concrete form of service suited to your gifts, age and safeguarding arrangements.</p>\n<p>19 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4>\n<p>Appendix E</p>\n<p>Summary Catechism</p>\n<p>These answers gather the doctrinal core of the lessons. Understand each answer, explain it in your own words and then learn its concise form.</p>\n<ol><li>Who is the Holy Spirit? The third Person of the Blessed Trinity, true God with the Father and the Son.</li><li>How many gods are there? There is one God in three divine Persons.</li><li>Is the Holy Spirit merely a force? No. He is a divine Person who knows, loves, guides and sanctifies.</li><li>What happened at Pentecost? The Holy Spirit descended upon the Apostles and strengthened them to proclaim Christ.</li><li>Which are the sacraments of Christian initiation? Baptism, Confirmation and the Holy Eucharist.</li><li>What does Confirmation do to baptismal grace? It completes and strengthens baptismal grace.</li><li>Who instituted Confirmation? Jesus Christ instituted Confirmation.</li><li>How did the Apostles impart the Spirit to the baptized? By prayer and the laying on of hands.</li><li>Where is this shown in Scripture? Especially in Acts 8:14-17 and Acts 19:5-6.</li><li>What does Confirmation mean? Strengthening.</li><li>Why is the sacrament called Chrismation? Because the baptized are anointed with sacred chrism.</li><li>Who is the ordinary minister? The bishop is the ordinary minister of Confirmation.</li><li>May a priest confirm? Yes, when the law or competent authority grants the faculty.</li><li>What is sacred chrism? Perfumed oil consecrated by a bishop.</li><li>What is the essential rite in the Latin Church? Anointing the forehead with chrism by the laying on of the hand and the sacramental words.</li><li>What words confer Confirmation? “N., be sealed with the Gift of the Holy Spirit.”</li><li>What does the candidate answer? The candidate answers, “Amen.”</li><li>What does the spiritual seal mean? Christ marks us permanently with the indelible character of his Spirit.</li><li>Can Confirmation be repeated? No. It is received only once.</li><li>What is the chief effect of Confirmation? A special outpouring of the Holy Spirit, as at Pentecost.</li><li>How does it unite us to Christ and the Church? It unites us more firmly to Christ and binds us more perfectly to the Church.</li><li>What special strength does it give? Strength to spread and defend the faith by word and deed.</li></ol>\n<p>20 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4>\n<ol><li>What are the seven gifts? Wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</li><li>What do the gifts make us ready to do? They make us ready to follow the promptings of the Holy Spirit.</li><li>What are the theological virtues? Faith, hope and charity.</li><li>What are the cardinal virtues? Prudence, justice, fortitude and temperance.</li><li>What are the fruits of the Spirit? Perfections formed in us by the Spirit as we cooperate with grace.</li><li>What are charisms? Gifts of grace for the service and building up of the Church.</li><li>Why are baptismal promises renewed? To show that Confirmation follows Baptism and strengthens its grace.</li><li>What does the candidate renounce? Satan, sin and everything opposed to God.</li><li>What faith does the candidate profess? The one apostolic faith of the Catholic Church.</li><li>Why is the confirmed called a soldier of Christ? Because Confirmation strengthens us for spiritual combat and witness.</li><li>Who can receive Confirmation? Every baptized person who has not already been confirmed.</li><li>How should a candidate prepare? By instruction, intention, prayer, good works and proper disposition.</li><li>In what state should Confirmation be received? In the state of grace.</li><li>What sacrament should be received beforehand? The Sacrament of Penance should be received beforehand.</li><li>What is the sponsor&#x27;s duty? To help the confirmed person live as a true witness and fulfil the sacrament&#x27;s obligations.</li><li>How should the newly confirmed persevere? By Mass, Confession, prayer, Scripture, virtue, parish communion and service.</li></ol>\n<p>21 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4>\n<p>Appendix F</p>\n<p>Readiness and Review Guide</p>\n<p>Readiness is not perfect memory, social confidence or a polished testimony. A candidate should have sufficient understanding according to capacity, a sincere intention, proper disposition and a growing willingness to live as a disciple and witness.</p>\n<p>Area What readiness looks like Revie w</p>\n<p>Can profess the Creed and explain simply who the Holy Spirit is and Catholic faith what Confirmation gives.</p>\n<p>Sacramental Knows the relation of Baptism, Confirmation and Eucharist; knows understanding the minister, chrism, sacramental words, effects and character.</p>\n<p>Freely intends to receive Confirmation and is able to renew Intention baptismal promises sincerely.</p>\n<p>Understands mortal and venial sin, has examined conscience and State of grace has a practical opportunity for Confession.</p>\n<p>Participates at Sunday Mass and is developing a sustainable habit Prayer of personal prayer.</p>\n<p>Witness and Understands that faith must be lived in truth, chastity, justice, mercy conduct and service.</p>\n<p>Has a canonically suitable sponsor, or the parish has considered Sponsor what is possible.</p>\n<p>Practical Knows the rite, responses, rehearsal arrangements, dress preparation expectations and safeguarding procedures.</p>\n<p>Any disability, learning difference, anxiety, family difficulty or access Pastoral support need has been met with reasonable and dignified adaptation.</p>\n<p>Pastoral and safeguarding note</p>\n<p>Preparation must respect each candidate&#x27;s dignity, freedom and capacity. Disability, learning difference, illness or social anxiety does not by itself prevent reception. No candidate should be shamed, manipulated, publicly interrogated or required to disclose private sins outside Confession. Concerns should be handled discreetly by the parish priest and those properly responsible.</p>\n<h4>CANONICAL NOTE</h4>\n<p>The universal law uses the age of discretion as a reference while permitting another age to be determined by competent authority. Follow the policy of the diocese; danger of death and other grave causes are treated specially by the Church&#x27;s law.</p>\n<p>22 Page</p>\n<h4>MY CONFIRMATION CATECHISM</h4>\n<p>Sources and doctrinal references</p>\n<p>Sacred Scripture. Acts 1-2, Acts 8:14-17, Acts 19:5-6, Isaiah 11:1-3, John 14-16, Romans 8, 1 Corinthians 12 and Galatians 5. Short quotations follow the English Standard Version - Catholic Edition.</p>\n<p>Catechism of the Catholic Church. Nos. 683-747 on the Holy Spirit; 1285-1321 on Confirmation; 1691-1698 on life in Christ; 1803-1845 on virtues, gifts and fruits.</p>\n<p>Compendium of the Catechism of the Catholic Church. Questions 265-270 on Confirmation and 136-146 on the Holy Spirit and the Church.</p>\n<p>Code of Canon Law. Canons 842, 879-896 and 872-874, especially the minister, candidate, age, sponsor, preparation and registration.</p>\n<p>Order of Confirmation. Current Roman Rite for England and Wales, especially the renewal of baptismal promises, laying on of hands, anointing with chrism and sign of peace.</p>\n<p>Joseph Deharbe, S.J.. A Full Catechism of the Catholic Religion, English translation by John Fander (London, 1863), especially pp. 255-259.</p>\n<p>Doctrinal standard</p>\n<p>Where local practice or terminology differs, the approved liturgical books, diocesan policy and the directions of the parish priest govern practical preparation. No text in this draft should be interpreted contrary to the Catechism of the Catholic Church or the competent ecclesiastical authority.</p>\n<p>23 Page</p></div></details>\n<h2>Preparing, Receiving and Persevering</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why receive Confession beforehand?</li><li>What does a sincere intention look like?</li><li>What habits make Confirmation a beginning rather than an ending?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Rite walk-through: use Appendix A and ask the candidate to explain what happens next at each stage. Correct gently rather than testing.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, complete the good work you have begun in me. Make me ready to receive your Spirit and faithful in every duty that follows. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Fix the practical plan for Confession, daily prayer, Sunday Mass and one regular form of service.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h3>CONFIRMATION · LESSON</h3>\n<h2>Connecting the activities to readiness</h2>\n<p>Use this quietly; it is not a score sheet for the candidate</p>\n<h3>CATHOLIC FAITH</h3>\n<p>Can the candidate explain simply who the Holy Spirit is and what Confirmation gives?</p>\n<h3>SACRAMENTAL UNDERSTANDING</h3>\n<p>Can the candidate connect Baptism, Confirmation and Eucharist, and recognise the bishop, chrism, sacramental words and spiritual seal?</p>\n<h3>FREEDOM &amp; INTENTION</h3>\n<p>Do they genuinely want to receive the sacrament and renew baptismal promises sincerely?</p>\n<h3>STATE OF GRACE</h3>\n<p>Do they understand the need for repentance and have a practical opportunity for Confession?</p>\n<h3>PRAYER &amp; MASS</h3>\n<p>Are Sunday Mass and personal prayer becoming real habits rather than preparation-only requirements?</p>\n<h3>WITNESS &amp; CONDUCT</h3>\n<p>Can they see that Catholic faith shapes truthfulness, chastity, justice, mercy, service and ordinary decisions?</p>\n<h3>SPONSOR &amp; RITE</h3>\n<p>Is there a suitable sponsor, and does the candidate know the basic shape and responses of the rite?</p>\n<p><strong>Final readiness remains a pastoral judgement, not a points total.</strong></p>\n<h3>CONFIRMATION · LESSON</h3>\n<h2>A final word to parents, mentors and priests</h2>\n<p>Keep the person in front of you more important than the programme</p>\n<h3>THE CATECHISM TEACHES. YOU ACCOMPANY.</h3>\n<p>The activity is successful when it helps the young person see, ask, understand, pray or act. It is not successful merely because every box was completed.</p>\n<ul><li>Start with what the candidate actually thinks or asks.</li><li>Do not embarrass someone who is quiet or unsure.</li><li>Use examples from ordinary teenage life without becoming gimmicky.</li><li>Keep doctrine exact, but explain only what is needed at that moment.</li><li>Allow challenge: young people can handle serious Catholic teaching when it is connected to real life.</li><li>Bring unresolved doctrinal, pastoral or safeguarding questions to the priest.</li><li>End with prayer and a concrete next step rather than a lecture summary.</li></ul>\n<h3>THE GOAL</h3>\n<p>A young Catholic who understands what they are asking for, freely desires the grace of Confirmation, is rooted in Sunday Mass and prayer, and is ready to live as a witness of Christ through the Holy Spirit.</p>"}, {"name": "Infant Baptism", "url": "https://3stepuk.github.io/Baptism-Preparation/", "desc": "For parents and godparents preparing an infant's baptism.", "html": "<p>For parents, godparents, mentors and priests</p>\n<h3>THIS IS NOT ANOTHER PREPARATION BOOK</h3>\n<p>Use this beside My Child&#x27;s Baptism. The preparation book supplies the Catholic teaching. This companion helps you bring it to life through simple activities, objects, discussion and prayer.</p>\n<h3>Three conversations. No lesson planning. No classroom atmosphere.</h3>\n<h3>CONVERSATION FIRST · SUNDAY MASS · TEACHING · PRAYER</h3>\n<h3>FAMILY LIFE</h3>\n<p>Most activities use things already at home or in church: a bowl of water, a candle, a white cloth, a Bible, a crucifix, the family calendar and the baptismal promises.</p>\n<h3>THE BASIC RULE</h3>\n<p>Do the activity, let people speak, open the preparation book for the teaching, then return to real family life. The activity serves the sacrament; it never replaces the teaching.</p>\n<h3>New life in Christ begins here</h3>\n<p>This is designed for an ordinary parish conversation at home, after Mass, or with a mentor. You do not need to perform every activity. Choose what helps the people in front of you.</p>\n<h3>1 Begin with them</h3>\n<p>Ask what they already think Baptism is, what brought them to ask for it, and what questions they have. Listen before teaching.</p>\n<h3>2 Do one simple activity</h3>\n<p>Use the activity to make one truth visible or concrete. Keep it brief. Avoid turning the conversation into a game for its own sake.</p>\n<h3>3 Open My Child&#x27;s Baptism</h3>\n<p>Read the relevant conversation together. Pause where something needs explaining. The preparation book remains the doctrinal foundation.</p>\n<h3>4 Talk honestly</h3>\n<p>Use the prompts in this companion. Parents and godparents do not need polished answers. Real questions are better than rehearsed ones.</p>\n<h3>5 Pray and choose one next step</h3>\n<p>End with the prayer from the preparation book and one practical action. Small faithful habits matter more than finishing quickly.</p>\n<h3>MENTOR, NOT LECTURER</h3>\n<p>A mentor walks alongside: listens, asks, clarifies, prays and knows when to say, “That is a good question - let us ask Father.” You will not need a bag of resources. These ordinary items cover almost everything in the three conversations.</p>\n<h3>1 A bowl or jug of clean water</h3>\n<p>For talking about washing, new birth and the visible sign of Baptism. Do not imitate the sacramental washing.</p>\n<h3>2 A white cloth or garment</h3>\n<p>For the new dignity of being clothed in Christ.</p>\n<h3>3 A candle</h3>\n<p>For Christ the Light and the responsibility to keep the flame of faith alive. Keep it unlit unless safe and appropriate.</p>\n<h3>4 A crucifix and Bible</h3>\n<p>For connecting Baptism with Christ, the Gospel and the life of the Church.</p>\n<h3>5 A weekly calendar</h3>\n<p>For making Sunday Mass and family prayer concrete rather than vague.</p>\n<h3>6 The Apostles&#x27; Creed / baptismal promises</h3>\n<p>For an honest conversation about what “I do” means.</p>\n<h3>AVOID PRETEND SACRAMENTS</h3>\n<p>Do not “practise” Baptism by pouring water over a person or inventing sacramental words. Rehearse responses and movements; explain the signs; leave the sacramental action to the actual rite.</p>\n<h3>CONVERSATION 1</h3>\n<details class=\"conv\"><summary>Open Conversation 1 &mdash; Baptism: New Life in Christ</summary><div class=\"conv-body\"><h4>REMEMBER</h4>\n<p>Baptism is the gateway to Christian life. God frees the baptised from sin, gives new life in Christ, makes them an adopted child of God and a member of the Church, and marks them permanently as belonging to Christ.</p>\n<p>Baptism is a sacrament: a visible action through which Christ truly gives the grace he promises. The outward washing with water is not merely a symbol of something we hope might happen. God acts through the sacrament, giving rebirth by water and the Holy Spirit.</p>\n<p>A baby has committed no personal sin. Original sin means that every human being is born into a fallen human condition and needs the salvation Christ gives. In Baptism original sin is remitted, sanctifying grace is given, the Holy Spirit dwells in the baptised, and the person is united with Christ and incorporated into his Church.</p>\n<p>The Church baptises infants because grace is a gift. A child receives life, love, language and care before being able to choose them. In the same way, parents ask the Church to give the child the gift of new life in Christ, while parents, godparents and the Church undertake to nurture that faith as the child grows.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What are you asking God to give this child in Baptism that you cannot give by yourselves?</p>\n<p>Think about: new life in Christ, freedom from sin, sanctifying grace, adoption as a child of God, belonging to the Church and the hope of eternal life.</p>\n<h4>THE ESSENTIALS</h4>\n<p>Try each question in your own words first. Then read the short answer.</p>\n<ol><li>What is Baptism? The sacrament of new birth by water and the word, and the gateway to Christian life.</li><li>What does Baptism do? It remits sin, gives sanctifying grace and the Holy Spirit, unites us with Christ and his Church, and gives an indelible spiritual character.</li><li>Has a baby committed personal sin? No. Original sin is the fallen condition inherited by humanity, not a personal wrong committed by the baby.</li><li>Why does the Church baptise infants? Because Baptism is God’s free gift of grace, received in the faith of the Church and nurtured as the child grows.</li><li>Can Baptism be repeated? No. Baptism marks the person permanently and is received only once.</li></ol>\n<h4>PRAYER</h4>\n<p>Heavenly Father, thank you for the gift of this child. As we prepare for Baptism, deepen our faith and help us receive with gratitude the new life you give in Christ. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>At Sunday Mass, pray especially for the child who will be baptised. At home, make the Sign of the Cross over them each evening and thank God for the gift of their life.</p>\n<p>St Mary&#x27;s | St John Bosco | St Edward&#x27;s Parish 4</p></div></details>\n<p>Use with Conversation 1 of My Child&#x27;s Baptism</p>\n<h3>AIM</h3>\n<p>Help parents and godparents see Baptism as something Christ truly does, not simply a naming ceremony, family tradition or welcome party.</p>\n<h3>ACTIVITY 1 - A GIFT BEFORE CHOICE</h3>\n<p>Place a small wrapped gift, baby blanket or another obvious gift on the table.</p>\n<ul><li>Ask: “Did this child have to understand this gift before receiving it?”</li><li>Ask: “What important things has this child already received without first choosing them - life, family, language, care, love?”</li><li>Then ask: “Could God also give grace before a child is old enough to explain it?”</li></ul>\n<h3>DRAW OUT</h3>\n<p>Grace is gift. Infant Baptism is not pretending that the child has adult understanding. The Church asks God to give the child a real gift of new life, while adults undertake to nurture what has been given.</p>\n<h3>ACTIVITY 2 - WATER: WHAT CAN IT SHOW?</h3>\n<p>Place a bowl of clean water where everyone can see it. Do not perform a mock Baptism.</p>\n<ul><li>What can water do in ordinary life? Clean, refresh, give life, rescue from thirst.</li><li>Now open the preparation book and read the teaching on rebirth by water and the Holy Spirit.</li><li>Ask: “Which parts are visible in Baptism, and which gifts can only God give?”</li></ul>\n<h3>CONVERSATION 1</h3>\n<p>From symbol to sacramental reality</p>\n<h3>CONVERSATION PROMPTS</h3>\n<ul><li>What are you asking God to give this child that you cannot give by yourselves?</li><li>What is the difference between saying “Baptism shows that we love this child” and saying “Christ gives this child new life”?</li><li>Why might the Church baptise an infant rather than wait until the child can make every decision personally?</li><li>If Baptism really incorporates the child into the Church, what will belonging to the Church need to look like afterwards?</li></ul>\n<h3>OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1, especially the REMEMBER paragraph and THE ESSENTIALS. Let the parents or godparents explain the meaning back in ordinary words before reading the concise answers.</p>\n<h3>OPTIONAL 2-MINUTE CHECK</h3>\n<p>Finish each sentence aloud:</p>\n<ul><li>“Baptism is more than a family ceremony because...”</li><li>“In Baptism God gives...”</li><li>“We baptise infants because grace is...”</li></ul>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not make original sin the whole lesson. The centre is Christ giving new life, grace, adoption, the Holy Spirit and membership in his Church. If a difficult question arises, note it and bring i
