CE FOR ALL. Draw a line connecting the Mass to Christ’s one sacrifice. Say clearly: Jesus does not die again; the one sacrifice is made sacramentally present.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 7. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Holy Sacrifice of the Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Does Jesus suffer and die again at Mass?</li><li>Who is the priest and victim of the Mass?</li><li>Why is the Mass more than simply remembering Calvary?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to correct this sentence: “At every Mass Jesus is crucified again.” They should be able to say that his one sacrifice is made present in an unbloody manner.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Eternal Father, I offer myself with Jesus in the Holy Sacrifice of the Mass. Receive my prayer, work, joys and sufferings through him. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At the elevation, look towards the Sacred Host and the chalice and adore Jesus in silence.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Avoid both errors: the Mass is not a new sacrifice added to Calvary, and it is not merely a mental memory. Use the catechism’s language: one sacrifice, sacramentally made present.</p>\n<h2>The Parts of the Mass</h2>\n<h3>AIM</h3>\n<p>The Liturgy of the Word and Liturgy of the Eucharist form one act of worship, opened and concluded by the Church’s rites.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If you had to draw a map of Sunday Mass for someone who had never been, what would happen first, middle and last?”</p>\n<h3>DO SOMETHING</h3>\n<p>Mass map. Make six cards: GATHER / LISTEN TO GOD / OFFER GIFTS / EUCHARISTIC PRAYER / RECEIVE / SENT OUT. Put them in order. Then place the catechism’s names beside them: Introductory Rites, Liturgy of the Word, Liturgy of the Eucharist, Communion Rite, Concluding Rites.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 8. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Parts of the Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What are the two principal parts of Mass?</li><li>When is God speaking to us?</li><li>What does the dismissal send us to do?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to walk through the Mass in order without needing every small detail. The aim is to know where they are and what the Church is doing.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, help me to listen to God’s word, unite myself to Christ’s offering and take part in Mass with faith. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Use Appendix A at Sunday Mass and follow each main part as it happens.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not turn this into liturgical trivia. Keep asking what each part is for: gathering, hearing God, offering, receiving and being sent.</p>\n<h2>Offering Ourselves with Jesus</h2>\n<h3>AIM</h3>\n<p>At Mass the baptised unite their prayers, work, joys and sufferings with the perfect offering of Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When the bread and wine are carried to the altar, what could you give God that cannot be carried in your hands?”</p>\n<h3>DO SOMETHING</h3>\n<p>My hidden offering. On a small piece of paper the child writes or draws one person, joy, worry, duty or sacrifice to offer at the next Mass. Keep it in a pocket or prayer book; do not place it physically on the altar. At the preparation of the gifts, remember it silently.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 9. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>Offering Ourselves with Jesus</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What can you offer God from your ordinary week?</li><li>How can silence and attention be real participation?</li><li>Why do we join our offering to Jesus rather than offering alone?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to name one inward and one outward way of taking part in Mass.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, through Jesus your Son, receive all that I am and all that I do. May my life become an offering of love. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Before Mass, choose one joy, difficulty or person to place spiritually on the altar with the gifts.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Active participation is not constant activity. Help the child discover attention, prayer, silence and self-offering as real participation alongside the spoken responses and gestures.</p>\n<h2>Preparing to Receive Worthily</h2>\n<h3>AIM</h3>\n<p>We prepare for Holy Communion with Catholic faith, the state of grace, the Eucharistic fast and reverent attention.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “How would you prepare if someone very important was coming to your home?” List a few sensible preparations, then ask what preparation shows that Holy Communion really is Jesus.</p>\n<h3>DO SOMETHING</h3>\n<p>Ready / not the point. Sort these cards: state of grace; Confession if needed; one-hour fast; prayer; forgiving others; arriving in good time; expensive clothes; copying everyone else; having a perfect mood. Discuss why each belongs where it does.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 10. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>Preparing to Receive Worthily</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why is the state of grace important?</li><li>What does the one-hour fast help us remember?</li><li>What should a child do if unsure about receiving?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to give four ways Catholics prepare worthily: faith, state of grace, fast and reverent prayer/attention.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit. Give me faith, a clean heart, loving desire and reverence as I prepare to receive Jesus. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With an adult, work out when the one-hour fast begins for the usual time of Communion in your parish.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Teach these practices positively as signs of faith in the holiness of the Eucharist. Questions about sin or readiness should lead to calm help from a parent, mentor or priest, not anxious self-testing.</p>\n<h2>Receiving Holy Communion Reverently</h2>\n<h3>AIM</h3>\n<p>The child approaches in faith, answers “Amen”, receives according to the Church’s approved practice and consumes the Sacred Host immediately.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “When the minister says ‘The Body of Christ’ and you answer ‘Amen’, what are you saying yes to?” Let the child answer before rehearsing anything.</p>\n<h3>DO SOMETHING</h3>\n<p>Walk it through. Practise the Communion procession, the approved sign of reverence, the words “The Body of Christ” / “Amen”, receiving on the tongue or in the hand according to parish practice, returning and praying. Use only an unconsecrated practice host supplied for rehearsal if the parish normally uses one; otherwise practise without an object.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 11. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>Receiving Holy Communion Reverently</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What does “Amen” mean here?</li><li>Why do we receive and consume the Sacred Host immediately?</li><li>What should you do if you become unsure or need help?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to demonstrate the parish’s approved manner calmly and explain that “Amen” is a profession of faith in the Real Presence.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, I am not worthy that you should enter under my roof, but only say the word and my soul shall be healed.</p>\n<h3>THIS WEEK</h3>\n<p>Practise the Communion procession and the approved manner of reception once more with a parent or mentor.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Never rehearse with a consecrated Host. Adapt calmly for coeliac disease, swallowing difficulty, disability or another medical need in consultation with the priest; do not improvise Eucharistic matter or reception.</p>\n<h2>Thanksgiving and a Eucharistic Life</h2>\n<h3>AIM</h3>\n<p>Holy Communion unites us more closely to Christ and should bear fruit in thanksgiving, charity and a lifelong Eucharistic life.</p>\n<h3>QUICK PREP</h3>\n<p>Have My First Holy Communion Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE CHILD</h3>\n<p>Ask: “If Jesus has just given himself to you in Holy Communion, what are four things you might want to say to him before thinking about anything else?”</p>\n<h3>DO SOMETHING</h3>\n<p>Four-part thanksgiving. Use four fingers or four cards: ADORE / THANK / OFFER / ASK. The child says one simple sentence for each. Then choose one act of love or service that can show after Mass that Communion is shaping ordinary life.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 12. Pause wherever the child has a real question. Do not rush to the formal answers yet.</p>\n<h2>Thanksgiving and a Eucharistic Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why is the time after Communion precious?</li><li>What is the chief fruit of Holy Communion?</li><li>How should receiving Jesus change the way we treat people afterwards?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the child to name the four thanksgiving actions and one habit that helps them live a Eucharistic life after First Communion.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the child answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, remain with me by your grace. Make my heart like yours and teach me to become a gift of love for others. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one regular practice: thanksgiving after Communion, a weekly visit to the tabernacle or regular Confession with family guidance.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>First Holy Communion is the beginning, not the finish. Keep drawing the child back to Sunday Mass, thanksgiving, Confession, adoration and practical charity.</p>\n<h3>FIRST HOLY COMMUNION · READINESS</h3>\n<h2>Connecting the activities to readiness</h2>\n<p>Use this quietly; it is not a score sheet for the child</p>\n<h3>JESUS CHRIST</h3>\n<p>Does the child know that Jesus is the eternal Son of God made man, who died and rose for us?</p>\n<h3>REAL PRESENCE</h3>\n<p>Does the child believe that the consecrated Eucharist is truly Jesus Christ, not ordinary bread or merely a symbol?</p>\n<h3>MASS AS SACRIFICE</h3>\n<p>Can the child explain simply that Mass makes present Christ’s one Sacrifice of the Cross and does not crucify him again?</p>\n<h3>SACRAMENTAL DISPOSITION</h3>\n<p>Has First Confession taken place, and does the child understand simply the state of grace and when to ask for help?</p>\n<h3>EUCHARISTIC FAST</h3>\n<p>Can the child observe the one-hour fast with appropriate adult support and explain why it matters?</p>\n<h3>PRACTICAL RECEPTION</h3>\n<p>Can the child join the procession, make the approved sign of reverence, answer “Amen”, receive and consume reverently?</p>\n<h3>PRAYER &amp; THANKSGIVING</h3>\n<p>Can the child take part in Mass and pray simply before and after Holy Communion?</p>\n<p><strong>Final readiness remains a pastoral judgement, not a points total.</strong></p>\n<h3>FIRST HOLY COMMUNION · GUIDE</h3>\n<h2>A final word to parents, mentors and priests</h2>\n<p>Keep the child in front of you more important than the programme</p>\n<h3>THE CATECHISM TEACHES. YOU ACCOMPANY.</h3>\n<p>The activity is successful when it helps the child see, ask, understand, pray or act. It is not successful merely because every box was completed.</p>\n<ul><li>Start with what the child actually notices, asks or understands.</li><li>Use the catechism for exact Catholic teaching and the activity only to make that teaching graspable.</li><li>Keep the tone reverent but warm; First Holy Communion is about receiving Jesus, not passing a test.</li><li>Practise real actions calmly: Mass responses, genuflection, the procession, “Amen” and thanksgiving.</li><li>If the child already understands a point, move on. If something is unclear, stay with it.</li><li>Bring medical, access, sacramental or pastoral questions to the priest early.</li><li>End each meeting with prayer and one small action connected to Sunday Mass.</li></ul>\n<h3>THE GOAL</h3>\n<p>A child who knows whom they are receiving, believes in the Real Presence according to capacity, is at home at Sunday Mass, and can receive Jesus with faith, reverence and thanksgiving.</p>"}, {"name": "Confirmation — Young People", "url": "https://3stepuk.github.io/Confirmation-For-Young-People/", "desc": "For young people preparing for Confirmation.", "html": "<p>For young people preparing for Confirmation</p>\n<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>Use My Confirmation Catechism for the Catholic teaching. Use this companion to make the teaching personal, active and memorable. It is written for parents, parish mentors and priests working alongside young people aged roughly 11-16.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the young person</li><li>Do something concrete</li><li>Open the catechism</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<p>The catechism gives the doctrinal spine. This companion helps the conversation breathe.</p>\n<h3>CONFIRMATION · LESSON</h3>\n<h2>How to use this companion</h2>\n<p>A simple method for parents, mentors and priests</p>\n<h3>MENTOR, NOT LECTURER</h3>\n<p>The young person should speak before you explain. Ask what they think, listen carefully, then use the catechism to clarify and deepen. You do not need to fill every silence.</p>\n<h3>A NORMAL MEETING</h3>\n<ul><li></li></ul>\n<ol><li>Begin naturally: “How has the week been?” “Anything at Mass or in the faith you wondered about?”</li><li></li><li>Use the opening activity or scenario from this companion.</li><li></li><li>Open the matching lesson in My Confirmation Catechism and read only as much as is useful.</li><li></li><li>Ask the young person to explain the central truth back in their own words.</li><li></li><li>Use one optional challenge if it helps; skip it if the conversation is already good.</li><li></li><li>Finish with the prayer and one practical action.</li></ol>\n<h3>DO NOT TURN IT INTO SCHOOL</h3>\n<p>Do not insist on completing every activity. Do not turn the formal catechism answers into a public test. Do not be afraid to follow a genuine question for a while. If you do not know an answer, say so and bring it to the priest.</p>\n<p>Most activities need nothing more than the catechism, a Bible, a pen and paper, or ordinary objects already nearby.</p>\n<h3>CONFIRMATION · LESSON</h3>\n<h2>Quick activity toolkit</h2>\n<p>Use these anywhere in the twelve lessons</p>\n<h3>THREE CORNERS</h3>\n<p>Give three possible answers or responses. The candidate chooses one, moves or points to it, and explains why.</p>\n<h3>CASE STUDY</h3>\n<p>Describe a realistic situation at school, home, online or among friends. Ask: What would a Catholic response look like?</p>\n<h3>ONE-MINUTE EXPLAIN</h3>\n<p>Give the candidate sixty seconds to explain the teaching as if speaking to a friend who knows nothing about it.</p>\n<h3>SCRIPTURE SPOTLIGHT</h3>\n<p>Read only the few verses needed. Ask: What happens? What changes? What does this show about Christ or the Holy Spirit?</p>\n<h3>SORT IT</h3>\n<p>Write words on scraps of paper and group them: gift/fruit/virtue, Baptism/Confirmation/Eucharist, fear/courage/witness, etc.</p>\n<h3>REAL-LIFE NEXT STEP</h3>\n<p>End by naming one concrete action for the coming week - something small enough actually to do.</p>\n<h2>The Holy Spirit, Lord and Giver of Life</h2>\n<h3>AIM</h3>\n<p>The Holy Spirit is a divine Person, true God with the Father and the Son - not merely a feeling, force or symbol.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Write or say three things people might mean when they say “spirit”: mood, energy, ghost, personality, God. Ask: which of these fits the Holy Spirit - and which definitely does not?</p>\n<h3>DO SOMETHING</h3>\n<p>Person or power? Give six statements such as “can love”, “can guide”, “is a feeling”, “sanctifies”, “comes and goes with my mood”, “is worshipped with the Father and Son”. Sort them into TRUE / FALSE.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 1. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Holy Spirit, Lord and Giver of Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why does it matter that the Holy Spirit knows and loves, rather than being an impersonal force?</li><li>What difference would it make to prayer if the Holy Spirit is a Person?</li><li>Where does the catechism say the Spirit is active in Christian life?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the candidate to explain the Trinity without saying “three gods”. Do not demand a perfect analogy; simply check that they can say one God in three divine Persons.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit, teach me to know you, love you and follow your inspirations with a willing heart. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the Glory Be slowly once each day, consciously addressing Father, Son and Holy Spirit.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Promise and Pentecost</h2>\n<h3>AIM</h3>\n<p>At Pentecost the Holy Spirit strengthened fearful disciples to become courageous witnesses.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Before opening the catechism, ask: “What makes someone stay silent even when they know something is true?” Write down a few reasons: fear, embarrassment, wanting approval, uncertainty.</p>\n<h3>DO SOMETHING</h3>\n<p>Read Acts 2:1-11 aloud with different people reading narrator / crowd / Peter if desired. Circle or name every sign of movement: wind, fire, speech, proclamation, gathering.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 2. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Promise and Pentecost</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What actually changed in the Apostles after Pentecost?</li><li>Was Pentecost mainly a private spiritual feeling, or did it send them outward?</li><li>Where might a Catholic teenager need courage to be known as Catholic?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Give a scenario: friends mock someone for going to Mass. Ask for three possible responses - aggressive, silent, truthful-and-charitable. Which best shows Christian courage?</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, as you strengthened the Apostles, give me courage to confess Christ and charity to serve those he loves. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Do one small act of visible Christian courage this week: make the Sign of the Cross before a meal, answer a question honestly, or defend someone being mocked.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Sacraments of Christian Initiation</h2>\n<h3>AIM</h3>\n<p>Baptism, Confirmation and Eucharist belong together: new life, strengthening and nourishment in Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Draw three large circles labelled BAPTISM, CONFIRMATION, EUCHARIST. Ask the candidate to place the words “new life”, “strengthening”, “food”, “membership”, “mission”, “Communion” where they belong.</p>\n<h3>DO SOMETHING</h3>\n<p>Use the image of a living plant: being planted, strengthened to grow, continually fed. Ask where the analogy helps and where it breaks down.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 3. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Sacraments of Christian Initiation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why is Confirmation not “graduation from Church”?</li><li>What did Baptism already give?</li><li>What does the Eucharist continue to do after Confirmation?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask: “What would six months after Confirmation look like if someone had treated it as graduation?” Then ask what the opposite would look like.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, thank you for making me your child in Baptism. Complete your work in me and keep me faithful at the table of your Son. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Find your baptismal date and church. If possible, ask a parent or godparent what they remember about the day.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Confirmation in Scripture and Tradition</h2>\n<h3>AIM</h3>\n<p>The Apostles prayed and laid hands on the baptised so that they would receive the Holy Spirit; the Church preserves this apostolic pattern.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Put a Bible in the middle. Ask: “If someone says Confirmation was invented centuries later, where would you begin looking?” Then open Acts 8:14-17 together.</p>\n<h3>DO SOMETHING</h3>\n<p>Scripture detective: read Acts 8:14-17 and Acts 19:5-6. On paper make four headings: Baptised / Apostles or Paul / Prayer / Laying on of hands. Fill in what you find.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 4. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>Confirmation in Scripture and Tradition</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What happens before the laying on of hands?</li><li>Who comes to the baptised people?</li><li>What does the Church preserve from the apostolic pattern?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>One-minute explain: “Where does Confirmation come from?” Candidate answers as if speaking to a sceptical friend.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, you gave the Holy Spirit to your Church. Keep me in the faith of the Apostles and make me faithful to their mission. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read Acts 8:14-17 once more during the week and underline one phrase you want to remember.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Minister, Matter and Form</h2>\n<h3>AIM</h3>\n<p>The Church does not invent sacraments as she goes: Confirmation has a minister, sacred chrism and sacramental words.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Place three headings on paper: WHO? WHAT? WORDS? Ask the candidate to guess what belongs under each before opening the catechism.</p>\n<h3>DO SOMETHING</h3>\n<p>Rehearsal without pretending to confer the sacrament: candidate stands, sponsor position is described, mentor says “The bishop anoints the forehead with chrism and says the sacramental words”; candidate practises answering “Amen”. Do not mimic anointing with oil.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 5. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Minister, Matter and Form</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why is the bishop normally the minister?</li><li>Why does the Church use definite words and signs?</li><li>What does the candidate answer after the sacramental words?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask the candidate to explain the link between the bishop and the Apostles in one sentence.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>God of the Apostles, keep our bishop and priests faithful. Through their ministry, strengthen your people in holiness and truth. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Learn the name of the diocesan bishop and pray for him by name.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Anointing, Chrism and the Spiritual Seal</h2>\n<h3>AIM</h3>\n<p>Oil, fragrance, anointing and seal make visible the invisible grace of consecration, strength and permanent belonging to Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Bring a small bottle of ordinary scented oil or hand cream if available. Let the candidate smell it. Ask: “Why might the Church use something that can be felt and smelled?” Make clear this is not sacred chrism.</p>\n<h3>DO SOMETHING</h3>\n<p>Symbol match: OIL =? FRAGRANCE =? SEAL =? CROSS =? Have the candidate match to strength/consecration, holy witness, permanent belonging, Christ.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 6. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>Anointing, Chrism and the Spiritual Seal</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What can oil communicate without words?</li><li>Why does fragrance make a good image for Christian witness?</li><li>What does a permanent seal say about belonging?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Ask for one example of a life that has a “good fragrance” - a way holiness becomes noticeable without showing off.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, seal me for Christ. Let my thoughts, words and actions carry the fragrance of his truth and charity. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At church, notice whether the holy oils are displayed. If you see them, identify which vessel is chrism if labelled.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Effects and Character of Confirmation</h2>\n<h3>AIM</h3>\n<p>Confirmation deepens baptismal grace, strengthens the bond with Christ and the Church, and gives special strength for witness.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Ask: “If Confirmation really changes something, what should it strengthen?” Let the candidate suggest answers before reading the catechism.</p>\n<h3>DO SOMETHING</h3>\n<p>Everyday witness cards: give scenarios - correcting a lie, refusing gossip, explaining why you go to Mass, choosing honesty in schoolwork, defending someone excluded. Ask what truthful and charitable witness looks like.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 7. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Effects and Character of Confirmation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>What does Confirmation deepen?</li><li>What kind of strength does it give?</li><li>Why is Christian witness not the same as being argumentative?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Have the candidate complete the sentence: “Confirmation is not about making me louder; it is about making me more…”</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, deepen every grace of my Baptism. Make me a courageous, gentle and faithful witness of Jesus Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Write one sentence you could say kindly if someone asked, “Why are you Catholic?”</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>The Seven Gifts of the Holy Spirit</h2>\n<h3>AIM</h3>\n<p>The seven gifts make us ready to follow the promptings of the Holy Spirit in real choices.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Write the seven gifts on separate scraps of paper. Put them face down. Pick one at random and ask: “Where might someone our age need this?”</p>\n<h3>DO SOMETHING</h3>\n<p>Scenario match: choosing friends wisely; revising a difficult belief; refusing peer pressure; praying with reverence; asking advice before a decision; seeing possessions in the light of God; choosing what leads closer to God. Match each to a gift.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 8. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>The Seven Gifts of the Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Which gift is easiest to understand?</li><li>Which is most often misunderstood?</li><li>Which gift do you most need now, and why?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Make a “gift for this week” card: name one gift, one situation and one concrete action.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Spirit of wisdom and understanding, counsel and fortitude, knowledge, piety and holy fear, make me docile to your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask especially for one gift each morning and notice one moment when you needed it.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Virtues, Fruits and Charisms</h2>\n<h3>AIM</h3>\n<p>Virtues shape who we become; fruits show grace ripening in a life; charisms are gifts for serving the Church.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Put three headings down: WHO I AM BECOMING / WHAT OTHERS BEGIN TO SEE / WHAT I CAN USE TO SERVE. Ask the candidate where virtues, fruits and charisms belong.</p>\n<h3>DO SOMETHING</h3>\n<p>Fruit audit: choose three fruits from Galatians 5 and rate 1-5 how visible each has been in your week. No sharing of anything too private is required; the aim is honest reflection.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 9. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>Virtues, Fruits and Charisms</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why can someone have an impressive ability without being holy?</li><li>Which fruit of the Spirit would make the biggest difference in your home or friendship group?</li><li>Why are charisms for service rather than attention?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Name one ordinary skill or interest - sport, music, organising, listening, technology, patience with children - and ask how it could serve others rather than self-promotion.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, increase faith, hope and charity in me. Let your fruits be seen in my conduct and use every gift for the good of others. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one fruit and practise one concrete action that expresses it this week.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Renewing the Promises of Baptism</h2>\n<h3>AIM</h3>\n<p>At Confirmation the candidate personally professes the Catholic faith already received in Baptism and rejects sin and Satan.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Ask: “What is the difference between inheriting something and personally choosing to live by it?” Use examples such as a family name, club, tradition or responsibility.</p>\n<h3>DO SOMETHING</h3>\n<p>Creed map: take the Apostles’ Creed and mark FATHER / SON / HOLY SPIRIT / CHURCH. Ask the candidate to choose one line they understand well and one they want explained more.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 10. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>Renewing the Promises of Baptism</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Are you inventing your own faith at Confirmation?</li><li>What are you saying no to?</li><li>What are you saying yes to?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Practice the logic, not a performance: mentor says “Do you reject sin?” Candidate answers in ordinary language what that means before looking at the liturgical wording.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>O God, strengthen the faith given to me in Baptism. Help me reject sin, profess the Creed sincerely and live as your faithful child. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Read the Creed once slowly this week and choose one line to pray rather than merely recite.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Witness, Spiritual Combat and Mission</h2>\n<h3>AIM</h3>\n<p>The enemy is sin and evil, not other people; the confirmed fight spiritually with truth, grace, prayer, sacraments and charity.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Draw two columns: PEOPLE / REAL ENEMIES. Put “annoying classmate”, “temptation”, “person who disagrees”, “sin”, “the devil”, “someone who mocks faith”, “fear”, “pride”. Sort carefully.</p>\n<h3>DO SOMETHING</h3>\n<p>Choose-your-response: someone posts something hostile about Catholic belief. Compare four responses: insult back; hide faith; answer calmly with truth; pray and say nothing because engagement would only inflame. Discuss prudence and charity.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 11. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>Witness, Spiritual Combat and Mission</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why must another person never become the enemy we hate?</li><li>What are Christian “weapons”?</li><li>Where does mission usually begin?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Mission map: family / school-college / parish / online / friends / poor and vulnerable. Candidate names one realistic form of witness or service in two areas.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Saint Michael the Archangel, defend us in battle. Holy Spirit, make me steadfast against sin and generous in the service of souls. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Do one quiet work of mercy or service without announcing it.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h2>Preparing, Receiving and Persevering</h2>\n<h3>AIM</h3>\n<p>Preparation leads to a sacrament to be lived: prayer, Confession, state of grace, sincere intention and perseverance afterwards.</p>\n<h3>QUICK PREP</h3>\n<p>Have the Confirmation Catechism open at this lesson. Gather only the simple item mentioned below if you want to use it; otherwise adapt the activity verbally.</p>\n<h3>BEGIN WITH THE YOUNG PERSON</h3>\n<p>Ask: “Imagine it is six months after Confirmation. What would show that the day changed more than your photo album?” Let the candidate make the list first.</p>\n<h3>DO SOMETHING</h3>\n<p>Make a realistic four-part rule: SUNDAY / DAILY / REGULARLY / SERVICE. Candidate chooses one sustainable practice under each, using Appendix D as a guide.</p>\n<h3>NOW OPEN THE CATECHISM</h3>\n<p>Read the REMEMBER line and the short teaching in Lesson 12. Pause wherever the candidate has a real question. Do not rush to the formal answers yet.</p>\n<h2>Preparing, Receiving and Persevering</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>Why receive Confession beforehand?</li><li>What does a sincere intention look like?</li><li>What habits make Confirmation a beginning rather than an ending?</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p>Rite walk-through: use Appendix A and ask the candidate to explain what happens next at each stage. Correct gently rather than testing.</p>\n<h3>USE THE CATECHISM QUESTIONS</h3>\n<p>Choose the two or three formal questions that best check understanding. Let the candidate answer in their own words first; only then use the concise catechism answer.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, complete the good work you have begun in me. Make me ready to receive your Spirit and faithful in every duty that follows. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Fix the practical plan for Confession, daily prayer, Sunday Mass and one regular form of service.</p>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Keep this conversational. If a genuine question takes the meeting in a useful direction, follow it. The aim is understanding, faith and a free Catholic response - not finishing a page.</p>\n<h3>CONFIRMATION · LESSON</h3>\n<h2>Connecting the activities to readiness</h2>\n<p>Use this quietly; it is not a score sheet for the candidate</p>\n<h3>CATHOLIC FAITH</h3>\n<p>Can the candidate explain simply who the Holy Spirit is and what Confirmation gives?</p>\n<h3>SACRAMENTAL UNDERSTANDING</h3>\n<p>Can the candidate connect Baptism, Confirmation and Eucharist, and recognise the bishop, chrism, sacramental words and spiritual seal?</p>\n<h3>FREEDOM &amp; INTENTION</h3>\n<p>Do they genuinely want to receive the sacrament and renew baptismal promises sincerely?</p>\n<h3>STATE OF GRACE</h3>\n<p>Do they understand the need for repentance and have a practical opportunity for Confession?</p>\n<h3>PRAYER &amp; MASS</h3>\n<p>Are Sunday Mass and personal prayer becoming real habits rather than preparation-only requirements?</p>\n<h3>WITNESS &amp; CONDUCT</h3>\n<p>Can they see that Catholic faith shapes truthfulness, chastity, justice, mercy, service and ordinary decisions?</p>\n<h3>SPONSOR &amp; RITE</h3>\n<p>Is there a suitable sponsor, and does the candidate know the basic shape and responses of the rite?</p>\n<p><strong>Final readiness remains a pastoral judgement, not a points total.</strong></p>\n<h3>CONFIRMATION · LESSON</h3>\n<h2>A final word to parents, mentors and priests</h2>\n<p>Keep the person in front of you more important than the programme</p>\n<h3>THE CATECHISM TEACHES. YOU ACCOMPANY.</h3>\n<p>The activity is successful when it helps the young person see, ask, understand, pray or act. It is not successful merely because every box was completed.</p>\n<ul><li>Start with what the candidate actually thinks or asks.</li><li>Do not embarrass someone who is quiet or unsure.</li><li>Use examples from ordinary teenage life without becoming gimmicky.</li><li>Keep doctrine exact, but explain only what is needed at that moment.</li><li>Allow challenge: young people can handle serious Catholic teaching when it is connected to real life.</li><li>Bring unresolved doctrinal, pastoral or safeguarding questions to the priest.</li><li>End with prayer and a concrete next step rather than a lecture summary.</li></ul>\n<h3>THE GOAL</h3>\n<p>A young Catholic who understands what they are asking for, freely desires the grace of Confirmation, is rooted in Sunday Mass and prayer, and is ready to live as a witness of Christ through the Holy Spirit.</p>"}, {"name": "Infant Baptism", "url": "https://3stepuk.github.io/Baptism-Preparation/", "desc": "For parents and godparents preparing an infant's baptism.", "html": "<p>For parents, godparents, mentors and priests</p>\n<h3>THIS IS NOT ANOTHER PREPARATION BOOK</h3>\n<p>Use this beside My Child&#x27;s Baptism. The preparation book supplies the Catholic teaching. This companion helps you bring it to life through simple activities, objects, discussion and prayer.</p>\n<h3>Three conversations. No lesson planning. No classroom atmosphere.</h3>\n<h3>CONVERSATION FIRST · SUNDAY MASS · TEACHING · PRAYER</h3>\n<h3>FAMILY LIFE</h3>\n<p>Most activities use things already at home or in church: a bowl of water, a candle, a white cloth, a Bible, a crucifix, the family calendar and the baptismal promises.</p>\n<h3>THE BASIC RULE</h3>\n<p>Do the activity, let people speak, open the preparation book for the teaching, then return to real family life. The activity serves the sacrament; it never replaces the teaching.</p>\n<h3>New life in Christ begins here</h3>\n<p>This is designed for an ordinary parish conversation at home, after Mass, or with a mentor. You do not need to perform every activity. Choose what helps the people in front of you.</p>\n<h3>1 Begin with them</h3>\n<p>Ask what they already think Baptism is, what brought them to ask for it, and what questions they have. Listen before teaching.</p>\n<h3>2 Do one simple activity</h3>\n<p>Use the activity to make one truth visible or concrete. Keep it brief. Avoid turning the conversation into a game for its own sake.</p>\n<h3>3 Open My Child&#x27;s Baptism</h3>\n<p>Read the relevant conversation together. Pause where something needs explaining. The preparation book remains the doctrinal foundation.</p>\n<h3>4 Talk honestly</h3>\n<p>Use the prompts in this companion. Parents and godparents do not need polished answers. Real questions are better than rehearsed ones.</p>\n<h3>5 Pray and choose one next step</h3>\n<p>End with the prayer from the preparation book and one practical action. Small faithful habits matter more than finishing quickly.</p>\n<h3>MENTOR, NOT LECTURER</h3>\n<p>A mentor walks alongside: listens, asks, clarifies, prays and knows when to say, “That is a good question - let us ask Father.” You will not need a bag of resources. These ordinary items cover almost everything in the three conversations.</p>\n<h3>1 A bowl or jug of clean water</h3>\n<p>For talking about washing, new birth and the visible sign of Baptism. Do not imitate the sacramental washing.</p>\n<h3>2 A white cloth or garment</h3>\n<p>For the new dignity of being clothed in Christ.</p>\n<h3>3 A candle</h3>\n<p>For Christ the Light and the responsibility to keep the flame of faith alive. Keep it unlit unless safe and appropriate.</p>\n<h3>4 A crucifix and Bible</h3>\n<p>For connecting Baptism with Christ, the Gospel and the life of the Church.</p>\n<h3>5 A weekly calendar</h3>\n<p>For making Sunday Mass and family prayer concrete rather than vague.</p>\n<h3>6 The Apostles&#x27; Creed / baptismal promises</h3>\n<p>For an honest conversation about what “I do” means.</p>\n<h3>AVOID PRETEND SACRAMENTS</h3>\n<p>Do not “practise” Baptism by pouring water over a person or inventing sacramental words. Rehearse responses and movements; explain the signs; leave the sacramental action to the actual rite.</p>\n<h3>CONVERSATION 1</h3>\n<p>Use with Conversation 1 of My Child&#x27;s Baptism</p>\n<h3>AIM</h3>\n<p>Help parents and godparents see Baptism as something Christ truly does, not simply a naming ceremony, family tradition or welcome party.</p>\n<h3>ACTIVITY 1 - A GIFT BEFORE CHOICE</h3>\n<p>Place a small wrapped gift, baby blanket or another obvious gift on the table.</p>\n<ul><li>Ask: “Did this child have to understand this gift before receiving it?”</li><li>Ask: “What important things has this child already received without first choosing them - life, family, language, care, love?”</li><li>Then ask: “Could God also give grace before a child is old enough to explain it?”</li></ul>\n<h3>DRAW OUT</h3>\n<p>Grace is gift. Infant Baptism is not pretending that the child has adult understanding. The Church asks God to give the child a real gift of new life, while adults undertake to nurture what has been given.</p>\n<h3>ACTIVITY 2 - WATER: WHAT CAN IT SHOW?</h3>\n<p>Place a bowl of clean water where everyone can see it. Do not perform a mock Baptism.</p>\n<ul><li>What can water do in ordinary life? Clean, refresh, give life, rescue from thirst.</li><li>Now open the preparation book and read the teaching on rebirth by water and the Holy Spirit.</li><li>Ask: “Which parts are visible in Baptism, and which gifts can only God give?”</li></ul>\n<h3>CONVERSATION 1</h3>\n<p>From symbol to sacramental reality</p>\n<h3>CONVERSATION PROMPTS</h3>\n<ul><li>What are you asking God to give this child that you cannot give by yourselves?</li><li>What is the difference between saying “Baptism shows that we love this child” and saying “Christ gives this child new life”?</li><li>Why might the Church baptise an infant rather than wait until the child can make every decision personally?</li><li>If Baptism really incorporates the child into the Church, what will belonging to the Church need to look like afterwards?</li></ul>\n<h3>OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1, especially the REMEMBER paragraph and THE ESSENTIALS. Let the parents or godparents explain the meaning back in ordinary words before reading the concise answers.</p>\n<h3>OPTIONAL 2-MINUTE CHECK</h3>\n<p>Finish each sentence aloud:</p>\n<ul><li>“Baptism is more than a family ceremony because...”</li><li>“In Baptism God gives...”</li><li>“We baptise infants because grace is...”</li></ul>\n<h3>FOR THE ADULT ALONGSIDE</h3>\n<p>Do not make original sin the whole lesson. The centre is Christ giving new life, grace, adoption, the Holy Spirit and membership in his Church. If a difficult question arises, note it and bring it to the priest.</p>\n<h3>PRAY AND ACT</h3>\n<p>Use the prayer and THIS WEEK action in Conversation 1: pray for the child at Sunday Mass and make the Sign of the Cross over the child at home.</p>\n<h3>CONVERSATION 2</h3>\n<p>Use with Conversation 2 of My Child&#x27;s Baptism</p>\n<h3>AIM</h3>\n<p>Help adults understand what will happen in church and, above all, what their spoken “I do” means.</p>\n<h3>ACTIVITY 1 - READ THE SIGNS</h3>\n<p>Place these four things in front of you if possible: water, a white cloth, a candle and a crucifix.</p>\n<ul><li>Water: ask first, “What might this sign be saying?” Then read the explanation in the book: new birth, cleansing, life - and the sacramental washing Christ uses in Baptism.</li><li>Chrism: ask first, “What might this sign be saying?” Then read the explanation in the book: consecration and sharing in Christ&#x27;s mission; explain rather than imitate the anointing.</li><li>White garment: ask first, “What might this sign be saying?” Then read the explanation in the book: new dignity and being clothed in Christ.</li><li>Candle: ask first, “What might this sign be saying?” Then read the explanation in the book: the light of the risen Christ entrusted to the family.</li></ul>\n<h3>DO NOT RUSH TO GIVE THE ANSWER</h3>\n<p>Let the parent or godparent notice the sign first. Then connect their answer with the Church&#x27;s meaning.</p>\n<h3>ACTIVITY 2 - WHAT DOES “I DO” COST?</h3>\n<p>Read the baptismal renunciations and profession of faith slowly, or use the Apostles&#x27; Creed.</p>\n<ul><li>After each section ask: “If I really mean this, what might it change in ordinary life?”</li><li>Do not debate every doctrine. The point is sincerity: the child is being baptised into the faith and life of the Church.</li></ul>\n<h3>CONVERSATION 2</h3>\n<p>Make the rite familiar without turning it into a performance</p>\n<h3>A SIMPLE WALK-THROUGH</h3>\n<h3>1 Reception</h3>\n<p>The child is welcomed by name; parents ask for Baptism and accept the responsibility of Christian upbringing.</p>\n<h3>2 Cross and Word</h3>\n<p>The child is marked with the Cross; Scripture is proclaimed and the Church prays.</p>\n<h3>3 Renunciation and faith</h3>\n<p>Parents and godparents reject sin and profess the Catholic faith.</p>\n<h3>4 Baptism with water</h3>\n<p>This is the central sacramental action. Explain it; do not imitate it.</p>\n<h3>5 Chrism, garment and candle</h3>\n<p>Receive the signs and connect each one with the Christian life that now begins.</p>\n<h3>6 Blessing and sending</h3>\n<p>The family leaves with a vocation, not simply with photographs.</p>\n<h3>REHEARSE, PRAY AND ACT</h3>\n<p>Practise the real responses - especially “I do” and “Amen” - but do not stage a pretend Baptism. Then use the prayer and THIS WEEK action in Conversation 2: read the Creed and agree one practical way parents and godparents will help one another live it.</p>\n<h3>CONVERSATION 3</h3>\n<p>Use with Conversation 3 of My Child&#x27;s Baptism</p>\n<h3>AIM</h3>\n<p>Move from “the Baptism day” to the ordinary Catholic life in which baptismal grace is meant to grow.</p>\n<h3>ACTIVITY 1 - IF THE CHILD COPIED US</h3>\n<p>Ask the central question from the preparation book and give it time:</p>\n<h3>IMAGINE FIVE YEARS FROM NOW</h3>\n<p>If this child learnt what Catholic life means only by watching the adults around them, what would they have learnt?</p>\n<ul><li>What would they see on Sundays?</li><li>Would prayer feel normal or unusual?</li><li>Would they hear adults ask forgiveness and begin again?</li><li>Would Jesus and the Church be spoken about as real and loved?</li><li>Would the godparent still be recognisably present in the child&#x27;s Christian life?</li></ul>\n<h3>ACTIVITY 2 - PUT FAITH ON THE CALENDAR</h3>\n<p>Take an ordinary weekly calendar. Mark what is already there - work, school, shopping, clubs, family commitments. Then add just two realistic Catholic habits.</p>\n<ul><li>Sunday Mass - identify the Mass the family can ordinarily attend.</li><li>One small home habit - bedtime blessing, grace before meals, short Gospel story or family prayer.</li></ul>\n<h3>KEEP IT REALISTIC</h3>\n<p>Two habits that actually happen are better than ten intentions that disappear after the Baptism.</p>\n<h3>CONVERSATION 3</h3>\n<p>Who will help the child keep walking?</p>\n<h3>THE THREE CIRCLES</h3>\n<p>On a sheet of paper draw three overlapping circles labelled HOME, GODPARENTS and PARISH. In each circle write one or two concrete things that belong there.</p>\n<ul><li>HOME: Sunday Mass, prayer, Christian example, forgiveness, teaching the faith.</li><li>GODPARENTS: prayer, visible Catholic example, encouragement, remembering baptismal anniversaries, support through later sacraments.</li><li>PARISH: worship, sacraments, catechesis, friendship, pastoral help and belonging.</li></ul>\n<h3>THE POINT</h3>\n<p>No one circle replaces the others. Parents remain the first educators in faith; godparents support rather than replace them; the parish receives the family into a real worshipping community.</p>\n<h3>CONVERSATION PROMPTS</h3>\n<ul><li>Which part of Catholic family life already feels natural?</li><li>Which part will need to begin again?</li><li>What could make Sunday Mass difficult, and what practical solution might help?</li><li>What should the godparent still be doing in five years?</li><li>When would you want to ask the parish for help?</li></ul>\n<h3>PRAY AND ACT</h3>\n<p>Use the prayer and THIS WEEK action in Conversation 3. Choose two habits now; do not wait until after the Baptism. Use this shortly before the Baptism so the adults know what they are doing and can pray rather than worry about logistics.</p>\n<h3>1 Find your places</h3>\n<p>Know where parents, child and godparents will stand or sit. Ask about any local arrangements.</p>\n<h3>2 Say the request clearly</h3>\n<p>Be ready to ask the Church for Baptism and accept the responsibility of Christian upbringing.</p>\n<h3>3 Practise the profession of faith</h3>\n<p>Read the renunciations and profession slowly. Answer “I do” as a real act of faith, not as stage directions.</p>\n<h3>4 Know the signs</h3>\n<p>Be ready for the Cross, water, chrism, garment and candle. The priest or deacon will guide you.</p>\n<h3>5 Prepare practical items</h3>\n<p>Bring only what the parish has asked you to bring. Arrive in good time.</p>\n<h3>6 Plan one quiet moment afterwards</h3>\n<p>After the celebration, before the reception takes over, thank God for the grace given to the child.</p>\n<h3>ONE SENTENCE TO REMEMBER</h3>\n<p>The minister will lead the rite. What matters most is understanding what you are asking for and making the profession of faith sincerely. A godparent is not an honorary title. Use these prompts with the chosen sponsor before the Baptism.</p>\n<ul><li>Why have you agreed to be this child&#x27;s godparent?</li><li>What part of your own Catholic life would you most want this child to learn from you?</li><li>How will you pray for the child regularly?</li><li>How will you remain present when the child reaches First Confession, First Holy Communion and Confirmation?</li><li>If the family&#x27;s practice becomes difficult or irregular, how can you encourage without becoming intrusive?</li><li>What will you do on the child&#x27;s baptismal anniversary?</li></ul>\n<h3>A GOOD CHOICE</h3>\n<p>Choose a godparent for the Christian life you hope the child will see, not simply for closeness, honour or family expectation.</p>\n<h3>CHECK THE REQUIREMENTS</h3>\n<p>Use Appendix B of My Child&#x27;s Baptism for the canonical requirements and ask the priest about any uncertain situation. Use the preparation book&#x27;s family rule as a menu, not a burden. Circle or choose only what you can genuinely begin.</p>\n<h3>Daily</h3>\n<p>Sign of the Cross; bless the child; one short prayer.</p>\n<h3>Meals</h3>\n<p>Say grace naturally.</p>\n<h3>Weekly</h3>\n<p>Sunday Mass; mention one thing heard, seen or prayed about.</p>\n<h3>At home</h3>\n<p>Keep a crucifix, Bible or holy image visible.</p>\n<h3>Regularly</h3>\n<p>Parents receive the sacraments faithfully, including Confession.</p>\n<h3>As the child</h3>\n<p>Teach prayers, tell Gospel stories, practise forgiveness</p>\n<h3>grows</h3>\n<p>and prepare for later sacraments.</p>\n<h3>With</h3>\n<p>Pray for the child, mark the baptismal anniversary and</p>\n<h3>godparents</h3>\n<p>remain a recognisable Catholic support.</p>\n<h3>When things</h3>\n<p>Begin again. Return to prayer, Mass and Confession</p>\n<h3>go wrong</h3>\n<p>rather than allowing a difficult season to become permanent distance.</p>\n<h3>CHOOSE TWO NOW</h3>\n<p>Write them into the actual family calendar before the Baptism. Baptism begins a life; it is not the finish line. This is not a test. Use it to notice what is clear and what still needs an honest conversation.</p>\n<p>☐ We can explain in ordinary words what Baptism gives.</p>\n<p>☐ We understand that Baptism is more than a family ceremony or naming day.</p>\n<p>☐ We are willing to make the renunciations and profession of faith sincerely.</p>\n<p>☐ We have a real intention to raise the child in the Catholic faith.</p>\n<p>☐ We have chosen at least one concrete Sunday Mass / prayer habit to begin or continue.</p>\n<p>☐ We understand the role of the godparent and have checked any uncertainty about eligibility.</p>\n<p>☐ We know the basic shape of the rite and what the main signs mean.</p>\n<p>☐ We have raised any family, canonical, access, language or practical difficulty rather than hiding it.</p>\n<p>☐ We know whom to ask for help after the Baptism.</p>\n<h3>FINISH WITH ONE QUESTION</h3>\n<p>“What are you most grateful for as you prepare to ask the Church for this child&#x27;s Baptism?” Then pray for the child by name.</p>\n<h3>KEEP USING THE PREPARATION BOOK</h3>\n<p>The rite guide, parent and godparent requirements, twelve essentials, readiness review, family rule, day-of-Baptism page and emergency guidance remain in My Child&#x27;s Baptism. This companion is only the pedagogical aid.</p>"}, {"name": "Marriage", "url": "https://3stepuk.github.io/Preparing-for-Our-Marriage/", "desc": "For couples preparing for the sacrament of Marriage.", "html": "<p>For engaged couples and their mentors</p>\n<h3>USE BESIDE THE PREPARATION BOOK</h3>\n<p>Use with Preparing for Our Marriage A Catholic Preparation Book for Engaged Couples. The book supplies the Catholic teaching. This companion helps the two of you make it concrete, speak honestly and take practical steps towards a lifelong covenant.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the two of you</li><li>Do something concrete</li><li>Open the preparation book</li><li>Listen to each other</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>PREPARING FOR A WHOLE LIFE</h3>\n<p>The wedding celebrates the covenant you will live each day. Preparation helps you understand marriage, choose it freely and begin habits of faithfulness, prayer and generous love. The priest establishes freedom to marry and directs the Church’s formal preparation.</p>\n<h2>How to use this guide</h2>\n<h3>FOUR CONVERSATIONS</h3>\n<p>Follow the four conversations in the preparation book. Each has a two-page activity and conversation here. The later pages offer practical helps when needed; they are not extra lessons to complete.</p>\n<h3>For each conversation</h3>\n<ol><li>Begin with the Sign of the Cross and the opening prayer printed near the end, as each person is able to participate sincerely.</li><li>Ask the opening question. Let each person finish speaking before responding.</li><li>Try the activity. All cards can be written as you meet, or the headings can simply be spoken.</li><li>Open the matching conversation in the preparation book. Read REMEMBER and the teaching slowly, pausing for questions.</li><li>Talk honestly. Check the central truth and use THE ESSENTIALS in the book to clarify understanding.</li><li>Pray the printed prayer, choose one realistic action and return to it next time. Repeat or divide a conversation when needed.</li></ol>\n<h3>Simple materials</h3>\n<p>The preparation book, this guide, paper and a pen are enough. No prepared talk, craft kit or internet search is required. A mentor can guide the conversation, or the couple can work together and bring questions to the priest.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen without taking sides or requiring private details. Help the couple understand the teaching and name a useful next step. You do not establish freedom to marry, decide validity or replace specialist support.</p>\n<h2>An opening conversation</h2>\n<p>Begin with the couple’s hopes and actual circumstances. A booked wedding must not prevent an honest question or a necessary pause.</p>\n<h3>Let each person speak</h3>\n<ol><li>“What do you value most about the person you hope to marry?”</li><li>“What do you understand yourselves to be promising for life?”</li><li>“What place does faith have in your life now?”</li><li>“What question or concern should we address before the wedding?”</li></ol>\n<h3>ESTABLISH FREEDOM TO MARRY</h3>\n<p>Use Appendix B with the priest early. Tell him about every previous marriage, Baptism and religious background, possible impediments, proposed venue and any concern about freedom or intention. Do not assume divorce or a civil marriage resolves the Church’s enquiry.</p>\n<h3>Respect privacy and freedom</h3>\n<p>Agree how to meet and what support is needed for language, reading, disability, work or caring responsibilities. The couple need not give a mentor an account of their intimate life, finances or private sins. Necessary personal matters belong in an appropriate private conversation with the priest.</p>\n<h3>ONE NEXT STEP</h3>\n<p>Choose one useful beginning: arranging the priest’s meeting, gathering the requested information, renewing Sunday Mass or making time for an honest couple conversation.</p>\n<p>If either person is afraid to disagree or say no, offer a safe private opportunity to seek help. Threats, coercion and abuse must not be treated as ordinary differences to settle together.</p>\n<h2>God’s Plan for Marriage</h2>\n<h3>AIM</h3>\n<p>Connect the lifelong covenant with fidelity, the good of the spouses and openness to life.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: UNITY, PERMANENCE, FRUITFULNESS.</p>\n<h3>BEGIN WITH THE COUPLE</h3>\n<p>Ask each person: “When I promise you my whole life, what do I mean?” Listen without trying immediately to make the answers match.</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A promise for an ordinary day</strong></p>\n<ol><li>Write UNITY: one husband and one wife in exclusive fidelity. Each name one daily choice that protects faithfulness in body, heart and conduct.</li><li>Write PERMANENCE: a bond intended for life. Use this case: tiredness and disappointment make affection difficult. What does seeking the other’s good require then?</li><li>Write FRUITFULNESS: love open to children and their upbringing. Name how children would be welcomed and how service and hospitality express generous love. Infertility does not make marriage less real.</li><li>Return to the opening sentences. Ask how this gift of persons differs from an arrangement kept only while convenient. Name one point needing clarification.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1. Keep the good of the spouses, unity, indissolubility and openness to life together.</p>\n<h2>God’s Plan for Marriage</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How will we help one another towards holiness as well as happiness?”</li><li>“What does our covenant ask when affection or circumstances become difficult?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is marriage? A covenant of one man and one woman for the whole of life, ordered to their good and to children. What are its essential properties? Unity and indissolubility. When is a valid marriage sacramental? When both spouses are baptised.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Let each person explain the central truths in ordinary words before checking the book. Clarify rather than turn this into an examination.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, teach us to love with truth, fidelity and generosity. Help us understand the covenant we are preparing to make and seek one another’s holiness. Amen.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Each complete the sentence “When I promise you my whole life, I mean…” Read the sentences to each other and discuss one difference honestly.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Explain permanence without implying that a person must remain exposed to danger or abuse. Openness to life is not a demand to prove fertility. Do not settle doubts about intentions or a previous bond yourself; bring them privately to the priest.</p>\n<h2>Consent and the Sacrament</h2>\n<h3>AIM</h3>\n<p>Clarify free consent, freedom to marry, the Church’s form and the grace of Matrimony.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: FREE, TRULY MARITAL, LAWFULLY EXPRESSED.</p>\n<h3>BEGIN WITH THE COUPLE</h3>\n<p>Ask each person: “What would help you make this promise freely and truthfully?” Allow space for a real answer rather than reassurance alone.</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What makes a marriage</strong></p>\n<ol><li>Under FREE, write MY OWN CHOICE. Use an invented case: a person fears family humiliation if the wedding is postponed. Discuss why pressure cannot supply consent.</li><li>Under TRULY MARITAL, write FIDELITY, PERMANENCE and OPENNESS TO LIFE. These must be sincerely intended, not positively excluded behind spoken words.</li><li>Under LAWFULLY EXPRESSED, name the ordinary Catholic form: an authorised priest or deacon and two witnesses, unless a lawful dispensation applies. The priest checks what is required.</li><li>For two baptised spouses, explain that the spouses confer the sacrament on each other by consent in the Latin Church. Name the grace needed to forgive, persevere and grow in holiness.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 2 and Appendix B. Freedom to marry, permissions, dispensations and particular cases belong with the priest.</p>\n<h2>Consent and the Sacrament</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Is there any part of fidelity, permanence or openness to life that we do not yet understand or sincerely intend?”</li><li>“What question needs a private conversation with the priest before we proceed?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What makes marriage? Free and lawful consent of persons able to marry. Can anyone supply another’s consent? No. Neither family nor the Church can replace it. What does Matrimony give the baptised spouses? Grace to perfect love, strengthen fidelity and grow together in holiness.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Let each person explain the central truths in ordinary words before checking the book. Clarify rather than turn this into an examination.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, give us freedom of heart and honesty of speech. Remove fear, pretence and hidden reservations. Help us prepare for consent that is truthful and faithful. Amen.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Talk without interruption about what “faithful for life” means. Bring any unresolved question of freedom, intention or a previous marriage privately to the priest.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Never use completion of an activity as evidence that consent is valid. Give each person a safe way to speak privately if needed. A positive exclusion of an essential element, coercion or a prior bond requires the priest’s attention before the wedding.</p>\n<h2>Living Catholic Marriage</h2>\n<h3>AIM</h3>\n<p>Choose concrete habits of worship, communication, fidelity, forgiveness and generous family life.</p>\n<h3>QUICK PREP</h3>\n<p>Four headings: PRAYER, DAILY LIFE, REPAIR, FAMILY.</p>\n<h3>BEGIN WITH THE COUPLE</h3>\n<p>Ask: “If someone watched an ordinary week of our life, what kind of marriage would they expect us to build?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The first month of married life</strong></p>\n<ol><li>Under PRAYER, choose a brief printed prayer and plan Sunday Mass for the Catholic spouse or spouses. Discuss honestly how differences of faith will be respected.</li><li>Under DAILY LIFE, name one expectation about money, phones, work or household duties. Let each person explain before agreeing what is fair and realistic.</li><li>Under REPAIR, use a minor invented disagreement. Practise listening, a truthful apology and one concrete repair. Serious intimidation or abuse needs safety and specialist help, not this exercise.</li><li>Under FAMILY, discuss openness to children and their Catholic upbringing. Read the book on marital intimacy and responsible parenthood; name any question for the priest. Choose two habits to begin.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 3 and use Appendices D and G as needed. Private couple discussions do not require disclosure of intimate details to a mentor.</p>\n<h2>Living Catholic Marriage</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What will help our home become a place where faith is lived?”</li><li>“How will we speak about intimacy, fertility and difficulties without pressure or avoidance?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the domestic church? The Christian household where faith, grace and prayer are lived. What does marital intimacy express? Faithful, total self-gift with its unitive and procreative meanings together. What should we do about serious difficulties? Seek truth, safety, pastoral help and appropriate professional support early.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Let each person explain the central truths in ordinary words before checking the book. Clarify rather than turn this into an examination.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, make our future home a place of prayer, truth, tenderness and mercy. Teach us to forgive, remain faithful and welcome your will generously. Amen.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Begin two agreed habits: one for prayer or Sunday worship and one for ordinary life, such as a time to talk without phones or a regular money conversation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Use the book’s teaching on chastity, openness to life and responsible parenthood. Respect privacy; refer personal or medical questions to appropriate help. Forgiveness never excuses violence, forced sex or control.</p>\n<h2>The Wedding Rite and the Vows</h2>\n<h3>AIM</h3>\n<p>Connect the celebration’s central actions with the covenant lived after the wedding.</p>\n<h3>QUICK PREP</h3>\n<p>Four headings: INTENTIONS, CONSENT, RINGS, BLESSING. No rings are needed.</p>\n<h3>BEGIN WITH THE COUPLE</h3>\n<p>Ask each person: “Which part of a lifelong promise will ask most of you in twenty years?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The day and the daily promise</strong></p>\n<ol><li>Under INTENTIONS, name freedom, lifelong fidelity and openness to children and their upbringing. These express the marriage being undertaken, not merely a ceremonial introduction.</li><li>Under CONSENT, name the free gift and acceptance of one another in marriage. Explain that this is the heart of the celebration; use only the parish’s approved wording for actual rehearsal.</li><li>Under RINGS, name a sign of the covenant. Under BLESSING, name the Church’s prayer for grace to live married life faithfully. Neither replaces consent.</li><li>For each heading, name one daily consequence: honest choices, protected fidelity, generous family life or asking for God’s help. Bring practical ceremony questions to the parish.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 4 and Appendix A. The activity uses these printed meanings; the parish supplies the approved texts for the celebration.</p>\n<h2>The Wedding Rite and the Vows</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What makes the spoken consent a truthful act of will rather than a performance?”</li><li>“How will we remember the covenant through ordinary actions after the wedding?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the heart of the celebration? The exchange of matrimonial consent. What do the rings signify? The faithful covenant already entered. What is the nuptial blessing? The Church’s prayer for blessing, strength and holiness in married life.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Let each person explain the central truths in ordinary words before checking the book. Clarify rather than turn this into an examination.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, may the words of our wedding day be true in our hearts and faithful in our life. Write our promises into daily choices and keep us close to you. Amen.</p>\n<h3>TOGETHER THIS WEEK</h3>\n<p>Choose one practical act that will express the covenant. When the parish gives the approved form of consent, read it slowly and bring any question before the rehearsal.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Use the approved liturgical book and parish direction for actual words, readings, music and movements. A rite within or outside Mass is decided with the priest. Do not substitute invented vows or let concern about performance obscure sincerity and freedom.</p>\n<h2>Faith and the home we hope to build</h2>\n<p>Use with Conversation 3 and Appendix D. Let each person describe actual practice and hopes. Neither should pretend to have a faith they do not hold.</p>\n<h3>A simple activity</h3>\n<ol><li>Draw or say three headings: NOW, OUR FUTURE HOME and QUESTIONS. Under NOW, each describe prayer, Mass and the place of faith in present life.</li><li>Under OUR FUTURE HOME, plan how Catholic worship will be supported, what prayer can be shared sincerely and how children would be formed in faith.</li><li>Under QUESTIONS, name a difference or practical obstacle: Sunday work, caring duties, another religious background or uncertainty about belief.</li><li>Choose one next step: attend Sunday Mass, pray a printed prayer together if both can do so sincerely, or speak with the priest about a difference.</li></ol>\n<h3>Talk together</h3>\n<p>“How will we protect the Catholic spouse’s practice without pressure or mockery?” “What will a child learn about faith from watching us?” “What support do we need from the parish?”</p>\n<h3>WHEN FAITH DIFFERS</h3>\n<p>The non-Catholic spouse is not required to pretend to be Catholic. The priest explains the permission or dispensation and the Catholic party’s promises about perseverance in faith and doing all in their power for the baptism and Catholic upbringing of children.</p>\n<h3>ONE HABIT</h3>\n<p>Choose a regular moment for gratitude, a simple prayer where possible and a practical plan for Sunday worship. Begin with what can be kept faithfully.</p>\n<h2>Listening disagreement and repair</h2>\n<p>Use with Appendix D. Practise only an ordinary, safe disagreement. Each person should be able to speak and decline the exercise freely.</p>\n<h3>Try a small invented case</h3>\n<p>One spouse wants a quiet evening; the other has invited friends without discussing it. Neither is threatened or afraid.</p>\n<ol><li>One person says what happened, how it affected them and what they need, without insults or guessing motives.</li><li>The other repeats what they heard before explaining their own view. The first person confirms or
