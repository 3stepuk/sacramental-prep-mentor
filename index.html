<script>const GUIDES=[{"name": "Becoming Catholic (RCIA)", "url": "https://3stepuk.github.io/Becoming-A-Catholic-/", "desc": "For adults becoming Catholic — the RCIA catechumenate.", "html": "<p>For unbaptised adults preparing for Baptism, Confirmation and the Eucharist</p>\n<h3>THIS IS NOT ANOTHER CATECHISM</h3>\n<p>Use alongside Becoming Catholic RCIA A Catechumenate Companion. Its twenty-four conversations supply the teaching. This guide helps an inquirer, catechumen, sponsor or mentor explore that teaching through practical activity and honest conversation.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the person</li><li>Do something concrete</li><li>Open the Companion</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>ONE SACRAMENTAL INITIATION</h3>\n<p>An unbaptised adult ordinarily receives Baptism, Confirmation and the Eucharist together. Baptism forgives every previous sin; sacramental Confession begins after Baptism.</p>\n<h2>How to use this guide</h2>\n<h3>THE PRINCIPLE</h3>\n<p>RCIA is a gradual apprenticeship in Christian life, lived with the parish through faith, conversion, worship, charity and the Church’s rites. Finishing activities does not establish readiness.</p>\n<h3>For each conversation</h3>\n<ol><li>Begin with the opening question. Listen to the person’s actual experience and allow uncertainty to be expressed.</li><li>Try the short activity together. Speak, draw or write as helpful; no craft work or prepared talk is required.</li><li>Open the numbered conversation in the Catechumenate Companion. Read the indicated teaching slowly.</li><li>Talk together, then clarify the main points. The concise answers support understanding; they are not a script to be recited.</li><li>Pray the printed prayer and choose one realistic action. Return to it next time without making it an attendance test.</li><li>Adapt, repeat or divide conversations. Follow the person’s growth and the periods of RCIA rather than treating this as a twenty-four-week course.</li></ol>\n<h3>ESTABLISH THE CORRECT PATHWAY</h3>\n<p>Tell the priest about any possible previous Baptism and any marriage history early. A validly baptised adult requires a different pathway. Use Appendix A of the Companion for the first pastoral check.</p>\n<p>Private sins, family difficulties and canonical questions are not for group disclosure. Arrange a confidential pastoral conversation when needed.</p>\n<h2>A small activity kit</h2>\n<p>The Companion, this guide, paper and a pen are enough for most conversations. Cards can be handwritten during the meeting.</p>\n<h3>Ordinary objects</h3>\n<p>A crucifix and a cup of water help explain signs. No object is needed if it would distract from the conversation.</p>\n<h3>A church visit</h3>\n<p>When convenient, look at the font, ambo, altar, tabernacle and images of saints. Arrange access and leave liturgical vessels and holy oils to the priest.</p>\n<h3>Real situations</h3>\n<p>The guide supplies short cases about choices, faith, work, family and parish life. Use them without requiring personal disclosures.</p>\n<h3>Prayer texts</h3>\n<p>The Apostles’ Creed and basic prayers are printed at the end. The guide includes a short prayer for every conversation.</p>\n<h3>Sunday worship</h3>\n<p>Bring one question from Mass. Where catechumens are dismissed after the Liturgy of the Word, reflect on the readings with the parish’s arrangements.</p>\n<h3>PRACTISE WITH REVERENCE</h3>\n<p>Rehearse responses and movements, not sacramental actions. Do not simulate Baptism, absolution, anointing or consecration. Catechumens participate in Sunday worship without receiving Holy Communion.</p>\n<h2>The Desire for God</h2>\n<h3>AIM</h3>\n<p>Help the inquirer identify the real questions and desires drawing them towards God.</p>\n<h3>QUICK PREP</h3>\n<p>Paper and a pen, optional. No prior religious knowledge is assumed.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What has brought you here now? What do you hope faith might help you understand?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Questions worth staying with</strong></p>\n<ol><li>Write four headings: MEANING, TRUTH, GOODNESS, HOPE. Invite the person to choose the one that matters most today.</li><li>Ask for a question under that heading. It might concern purpose, suffering, conscience or death. Do not rush to solve it.</li><li>Name a good thing they have pursued. Ask why even good things may leave us wanting more.</li><li>Read the Companion’s account of God taking the initiative. Choose one question to carry into the next conversation.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 1, especially the relationship between human longing, reason and God’s grace.</p>\n<h2>The Desire for God</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What would it mean to seek truth even if the answer changed your life?”</li><li>“Is there an experience that has made belief in God seem possible or difficult?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is faith opposed to reason? No. Both come from God and assist one another. Can created goods fully satisfy us? They are real gifts, but we are made for communion with God. What is a first step? Seek honestly, pray simply, hear the Gospel and meet the Church.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>God, receive my desire for truth. Lead me out of confusion and give me courage to follow the light you give. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray each day: “God, show me the truth and give me courage to follow it.”</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Allow an inquirer to begin with questions rather than a confident profession. Listen for sincere seeking. The aim is a real conversation about God, not an account polished to please the parish.</p>\n<h2>Jesus Christ and the Good News</h2>\n<h3>AIM</h3>\n<p>Place the person of Jesus and his saving work at the centre of enquiry.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix, optional; the Companion.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Who do you understand Jesus to be? What has formed that understanding?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What would change if this is true</strong></p>\n<ol><li>Write TEACHER, SON OF GOD, SAVIOUR, RISEN LORD. Ask which descriptions the person already accepts and which raise questions.</li><li>Use Conversation 2 to explain that the eternal Son truly became man and gave himself for our salvation.</li><li>Ask what would change if the Resurrection were a real event rather than the survival of Jesus’ ideas.</li><li>Choose one consequence for life: trust, prayer, repentance, hope or obedience. Ask why it follows from who Jesus is.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 2. Keep Jesus’ identity, Cross, bodily Resurrection and invitation to discipleship together.</p>\n<h2>Jesus Christ and the Good News</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What makes the Gospel good news rather than only a demand?”</li><li>“What would trusting Jesus ask of you?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is Jesus? The eternal Son of God made man. Did he truly rise? Yes. His Resurrection is real and bodily. What does he ask? Faith, conversion, love and lifelong discipleship.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus Christ, Son of the living God, reveal yourself to me. Give me faith to know you, love you and follow you. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Reread Conversation 2 and bring one honest question about Jesus to your next meeting.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Keep Christ at the centre even when questions concern Church customs or difficult teachings. Do not treat Jesus as merely an admirable moral example. Invite trust while leaving room for genuine enquiry.</p>\n<h2>Faith Conversion and Discipleship</h2>\n<h3>AIM</h3>\n<p>Connect belief in Christ with a free response and a developing change of life.</p>\n<h3>QUICK PREP</h3>\n<p>Paper marked BELIEVE, TRUST, FOLLOW.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Can a person agree that something is true without living by it?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>From agreement to discipleship</strong></p>\n<ol><li>Use this case: someone believes honesty matters but continues a dishonest practice because it is profitable. What is still missing?</li><li>Under BELIEVE, name receiving what God reveals. Under TRUST, name entrusting oneself to him. Under FOLLOW, name a change of action.</li><li>Read how grace comes first and enables the response. Conversion is not self-improvement achieved without God.</li><li>Privately identify one possible next step. The person may share the step without sharing sensitive details.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 3, especially grace, freedom and the real beginnings of conversion.</p>\n<h2>Faith Conversion and Discipleship</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is perfection not required before beginning the catechumenate?”</li><li>“What distinguishes a sincere beginning from merely saying the expected words?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is faith? A grace-enabled response of belief and trust in God. What is conversion? Turning from sin towards God in a changed life. Must faith be free? Yes. No one may be forced to embrace it.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, give me sincere conversion. Show me what I must leave behind and what I must begin, and keep me close to your Son. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one practical act of conversion and ask God’s help to carry it out.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Ask about willingness to grow without demanding a public account of private sins. Support concrete change. Refer complex moral, relational or pastoral matters to the priest in a confidential setting.</p>\n<h2>Why the Church Why Baptism</h2>\n<h3>AIM</h3>\n<p>Explain visible Church belonging, sacramental new birth and the meaning of Acceptance.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: ENQUIRY, ACCEPTANCE, BAPTISM.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Why might following Christ involve belonging to his Church rather than remaining on one’s own?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Belonging and beginning</strong></p>\n<ol><li>Place ENQUIRY first: questions, first faith, prayer and contact with the community.</li><li>Add ACCEPTANCE: the Church receives the intention to follow Christ and enrols the person among catechumens. This is not Baptism.</li><li>Add BAPTISM: new birth in Christ, forgiveness and incorporation into the Church. Read the Companion’s explanation.</li><li>Ask what support a person needs between Acceptance and Baptism. Include worship, teaching, conversion, charity and a sponsor.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 4 and Appendix B on Acceptance. The priest discerns when the first step is appropriate.</p>\n<h2>Why the Church Why Baptism</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What attracts you to visible Church belonging, and what feels difficult?”</li><li>“What do you need to understand before asking for Acceptance?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Did Christ intend a Church? Yes. He entrusted his people to apostolic teaching and care. Is Acceptance Baptism? No. It begins the formal catechumenate. Does Acceptance fix the Baptism date? No. Growth and readiness determine progress.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, you gather your people into one flock. Give me humility, perseverance and joy as I discern the next step. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>With the priest or mentor, name one hope and one hesitation about entering the catechumenate.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Check initial faith and conversion before arranging Acceptance. Never imply that joining the catechumenate automatically promises initiation at the next Easter Vigil. Recognise the real belonging of catechumens while explaining that Baptism is still to come.</p>\n<h2>Scripture Tradition and the Magisterium</h2>\n<h3>AIM</h3>\n<p>Show how the apostolic faith is received, handed on and faithfully interpreted.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: SCRIPTURE, TRADITION, MAGISTERIUM.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “When Christians disagree about a biblical passage, how might truth and unity be preserved?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Who receives and explains the message</strong></p>\n<ol><li>Use this case: two readers take the same passage to support opposite beliefs. Sincerity alone does not resolve the disagreement.</li><li>Place SCRIPTURE: the inspired written word of God. Add TRADITION: the living transmission of the apostolic faith.</li><li>Add MAGISTERIUM: the Pope and bishops in communion with him faithfully guard and interpret the deposit of faith.</li><li>Ask whether these are competing authorities. Read the Companion’s explanation that the teaching office serves God’s word.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 5. Distinguish Apostolic Tradition from ordinary customs and private opinions.</p>\n<h2>Scripture Tradition and the Magisterium</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does a received faith need faithful interpretation?”</li><li>“What question about Catholic authority would you most like explained?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is Scripture inspired? Yes. God works through its human authors. What is Apostolic Tradition? The living transmission of the apostolic faith. Is the Magisterium above God’s word? No. It serves, guards and interprets it.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, make me attentive to God’s word. Give me humility to receive the faith and courage to ask honest questions. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Bring one actual question about Scripture, Tradition or Church authority to the next conversation.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not reduce Tradition to customs or suggest the Church invents new revelation. Explain the reasons for Catholic authority patiently. The Companion supplies the doctrinal answer; the activity simply makes the question concrete.</p>\n<h2>One God Father Son and Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Give a clear, orthodox understanding of the Trinity and Trinitarian prayer.</p>\n<h3>QUICK PREP</h3>\n<p>Three name cards: FATHER, SON, HOLY SPIRIT.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Make the Sign of the Cross. Ask: “What does this brief prayer profess about God?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One divine nature and three Persons</strong></p>\n<ol><li>Place the three cards beside one another. Ask whether each Person is truly God.</li><li>Write ONE GOD above them. Read that each Person wholly possesses the one divine nature.</li><li>Ask whether the Persons are simply three roles or names for one Person. Clarify that they are really distinct.</li><li>Pray the Glory Be slowly. Notice that Christian prayer leads to the Father through the Son in the Holy Spirit.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 6. Use its precise language rather than an analogy that changes the doctrine.</p>\n<h2>One God Father Son and Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Which confusion is easier to fall into: three gods or one Person under three names?”</li><li>“How does the Sign of the Cross prepare you for the faith of Baptism?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How many Gods are there? One. How many divine Persons? Three: Father, Son and Holy Spirit. Is each Person fully God? Yes. Each is wholly and eternally God.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make the Sign of the Cross slowly each morning and evening.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>The cards identify the Persons; they do not model God’s being. Avoid illustrations implying three parts of God, three gods or successive disguises. Mystery calls for humility while allowing clear statements about what the Church believes.</p>\n<h2>Creation Human Dignity and the Fall</h2>\n<h3>AIM</h3>\n<p>Hold together the goodness of creation, human dignity and the need for redemption.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings on paper: GIFT, WOUND, HOPE.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Where do you see both human goodness and something deeply wrong in human life?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Goodness that needs healing</strong></p>\n<ol><li>Under GIFT, name reason, freedom, love and the dignity of every person made in God’s image.</li><li>Under WOUND, consider this case: someone knows an action is harmful but repeatedly chooses it. What does it reveal about fallen human life?</li><li>Read the distinction between original sin and personal sin. A newborn has not personally chosen an offence.</li><li>Under HOPE, name God’s promise of salvation fulfilled in Jesus, the new Adam. Ask why wounded nature is still worth respecting.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 7. Creation is good; human nature is wounded, not destroyed.</p>\n<h2>Creation Human Dignity and the Fall</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does dignity remain even when a person is weak, dependent or sinful?”</li><li>“Why do we need God’s salvation as well as human effort?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who created all things? God, freely and from nothing. Why has every person dignity? Every person is made in God’s image. Is original sin a baby’s personal act? No. It is an inherited fallen condition.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Creator and Father, teach me gratitude, respect for every person and honesty about my need for salvation in Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Show deliberate respect or practical kindness to someone who is easily overlooked.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Explain original sin without personal blame or the claim that human nature is wholly evil. Keep discussion of creation focused on the theological truths of dependence on God, goodness and dignity; take further scientific or philosophical questions seriously.</p>\n<h2>The Word Became Flesh</h2>\n<h3>AIM</h3>\n<p>Clarify the Incarnation and why Jesus is true God and true man.</p>\n<h3>QUICK PREP</h3>\n<p>Paper marked PERSON and NATURES.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would be missing if Jesus were only a wise teacher, or only appeared to be human?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Who Jesus is</strong></p>\n<ol><li>Write “One divine Person” under PERSON: the eternal Son.</li><li>Write “Divine and human” under NATURES. Jesus is fully God and fully human, with a real human body, mind and will.</li><li>Consider two mistaken statements: “Jesus is half God and half man”; “Jesus began as a man and later became God”. Use Conversation 8 to correct both.</li><li>Ask why Mary is called Mother of God. She bore the divine Son according to his humanity; she is not the source of his divinity.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 8. Connect precise teaching about Christ with his saving work.</p>\n<h2>The Word Became Flesh</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does salvation involve the Son truly sharing our humanity?”</li><li>“How does honouring Mary protect the truth about her Son?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How many Persons are in Christ? One divine Person, the Son. How many natures? Two, fully divine and fully human. Did the Son cease to be God? No. He truly assumed our humanity.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus Christ, true God and true man, draw me close to you. Help me receive the salvation you bring and honour your Mother. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Explain the Incarnation in one sentence, then reread Conversation 8 to check it.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Let theological terms clarify rather than dominate the conversation. The person should be able to say who Jesus is in ordinary words. Avoid explanations that divide him into two persons or deny his true humanity.</p>\n<h2>The Paschal Mystery</h2>\n<h3>AIM</h3>\n<p>Connect Christ’s Cross, bodily Resurrection and Ascension with Christian hope.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix, optional; three cards: CROSS, RESURRECTION, ASCENSION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which part of Jesus’ saving work is hardest for you to understand or receive?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One saving mystery</strong></p>\n<ol><li>Place CROSS first. Name his free self-offering for our sins, reconciling us to the Father.</li><li>Add RESURRECTION. Ask why hope would change if Jesus had remained dead. He truly rose in a glorified body.</li><li>Add ASCENSION. Explain that the risen Lord reigns, intercedes and sends the Holy Spirit; he has not abandoned us.</li><li>Ask how Baptism will join the person to Christ’s death and Resurrection. Let the Companion make the connection explicit.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 9 and the central teaching of Conversation 14 on dying and rising with Christ.</p>\n<h2>The Paschal Mystery</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is the Cross more than an example of courage?”</li><li>“What kind of hope does bodily resurrection give?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why did Christ die? He freely offered himself for our sins. Did he rise bodily? Yes. The crucified Jesus truly rose. What is the Ascension? His entry in his humanity into heavenly glory.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus crucified and risen, have mercy on me. Unite my life to your Cross, free me from sin and lead me to eternal life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Spend a few quiet minutes before a crucifix and ask Jesus to deepen your hope.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not reduce salvation to admiration of Jesus’ example or the Resurrection to a metaphor. Allow grief and suffering to be named without requiring a personal testimony. Christian hope takes both death and Christ’s victory seriously.</p>\n<h2>The Holy Spirit Grace and Justification</h2>\n<h3>AIM</h3>\n<p>Explain grace as God’s free gift of forgiveness and genuine interior renewal.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: GIFT, RESPONSE, FRUIT.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “When you hear grace, do you imagine pardon only, or God also changing a person?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>God acts and we respond</strong></p>\n<ol><li>Place GIFT first. Explain that the Holy Spirit awakens faith and that initial grace cannot be earned.</li><li>Add RESPONSE. Use this case: a person receives help to end dishonesty and freely accepts it. The help enables rather than removes responsibility.</li><li>Add FRUIT: truthfulness, patience, charity and good works made possible by grace.</li><li>Read the Companion’s account of justification as forgiveness and interior renewal. Ask why this is neither self-salvation nor doing nothing.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 10. Distinguish sanctifying grace from the actual help God gives in particular moments.</p>\n<h2>The Holy Spirit Grace and Justification</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What does it mean to cooperate with a gift?”</li><li>“How could you recognise grace at work without pretending to measure holiness?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is the Holy Spirit? The third divine Person, true God. What is sanctifying grace? A stable participation in God’s life. Can we earn the first grace of conversion? No. God acts first and enables our response.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, Lord and giver of life, prepare my heart for Baptism. Give me faith, hope and charity and help me cooperate with your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each evening thank God for one help received and ask his grace for one next step.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Keep the order clear: God’s gift precedes the response. Good works are fruits of grace, not a price paid to purchase initial justification. Do not speak as though grace merely covers sin while leaving the person unchanged.</p>\n<h2>The Church Christ Founded</h2>\n<h3>AIM</h3>\n<p>Explore the Church’s spiritual and visible life, apostolic authority and holiness.</p>\n<h3>QUICK PREP</h3>\n<p>Four cards: ONE, HOLY, CATHOLIC, APOSTOLIC.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which is harder to understand: the Church as Christ’s Body or the Church’s visible authority?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The four marks in real life</strong></p>\n<ol><li>Read the four marks in Conversation 11. Give a brief meaning for each: unity, Christ’s holiness, universality and apostolic foundation.</li><li>Use this case: a Catholic leader behaves badly. Ask whether acknowledging the sin means denying Christ’s gifts to the Church.</li><li>Name the roles of bishops as successors of the Apostles and the Pope as successor of Peter.</li><li>Ask how truth, repentance, justice and reform can belong together within love for the Church.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 11. The Church is spiritual and visible, and her members need continuing conversion.</p>\n<h2>The Church Christ Founded</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How can we avoid both excusing sin and forgetting Christ’s promises?”</li><li>“What question about papal or episcopal authority needs more explanation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What are the four marks? One, holy, catholic and apostolic. Who are bishops? Successors of the Apostles in communion with the Pope. Why is the Church holy? Because of Christ and his gifts, despite her members’ sins.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, heal what is sinful and strengthen what is weak in your Church. Teach me to love her truthfully and faithfully. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask for the names of the Pope, diocesan bishop and parish priest, and pray for them.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not minimise wrongdoing or suggest every papal opinion is infallible. If a person’s experience involves harm, listen carefully and follow the appropriate safeguarding process. Questions about authority deserve patient explanation.</p>\n<h2>Mary the Saints and the Last Things</h2>\n<h3>AIM</h3>\n<p>Clarify worship, intercession and Christian hope beyond death.</p>\n<h3>QUICK PREP</h3>\n<p>Paper for two headings: ADORATION, INTERCESSION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which teaching raises your strongest question: Mary, saints, purgatory, judgement or prayer for the dead?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Communion that death does not destroy</strong></p>\n<ol><li>Under ADORATION write “God alone”. Under INTERCESSION write “asking someone to pray”. Ask how this distinction helps explain Catholic devotion.</li><li>Read the Companion on Mary’s grace and her relationship to Christ. Honour given to her leads to her Son.</li><li>Consider asking a fellow Christian for prayer. The communion of saints includes those alive with Christ in heaven.</li><li>Read the definitions of heaven, hell and purgatory. Explain that purgatory purifies those already in God’s grace; it is not another chance to reject or accept God after death.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 12. If several questions arise, divide this into more than one meeting.</p>\n<h2>Mary the Saints and the Last Things</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How does asking a saint for prayer differ from worshipping that saint?”</li><li>“What does hope in resurrection add to an idea of merely surviving in memory?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Do Catholics worship saints? No. Adoration belongs to God alone. What is purgatory? The final purification of those who die in God’s grace. What is our final hope? Resurrection of the body and eternal life with God.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, give eternal rest to the faithful departed. Mary, Mother of God, pray for us that we may persevere in Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray for a person who has died, entrusting them to God’s mercy.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Bereavement may make this conversation sensitive. Do not pronounce on the eternal fate of a particular person. Distinguish intercession from adoration and describe the Church’s hope without denying judgement or the need for conversion.</p>\n<h2>Liturgy and the Seven Sacraments</h2>\n<h3>AIM</h3>\n<p>Help the catechumen recognise Christ acting through sacramental signs.</p>\n<h3>QUICK PREP</h3>\n<p>Seven handwritten cards using the names in the steps.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What changes when worship is understood as Christ acting in his Church?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Sacraments for a whole life</strong></p>\n<ol><li>Write Baptism, Confirmation, Eucharist, Penance, Anointing of the Sick, Holy Orders and Matrimony on cards.</li><li>Sort them using Conversation 13: initiation; healing; service of communion.</li><li>Choose Baptism as an example. Distinguish the outward sign from the grace Christ truly gives through it.</li><li>Ask why sacraments are more than reminders but do not work as magic. They are Christ’s effective signs, received with the proper disposition.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 13. Do not try to teach every sacrament fully here; Conversations 14–17 deepen the teaching.</p>\n<h2>Liturgy and the Seven Sacraments</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What is different about receiving a sacrament and simply expressing a feeling?”</li><li>“What helps us participate in liturgy with faith and attention?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is a sacrament? An effective sign of grace instituted by Christ. How many are there? Seven. Which initiate Christian life? Baptism, Confirmation and Eucharist.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, teach me to recognise your action in the liturgy. Prepare me to receive your Sacraments with faith and reverence. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday worship, notice one gesture or prayer and ask what it means.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>The activity sorts the names, not people into predetermined life paths. Every sacrament serves Christ’s saving work. Keep catechumens’ participation in worship clear: they do not yet receive Holy Communion or other sacraments before Baptism.</p>\n<h2>Baptism Dying and Rising with Christ</h2>\n<h3>AIM</h3>\n<p>Explain the full gift of Baptism and the repentance that prepares an unbaptised adult.</p>\n<h3>QUICK PREP</h3>\n<p>A cup of water and paper, optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you expect God to do in Baptism, beyond recording your own decision?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>God’s saving gift</strong></p>\n<ol><li>Look at water and name its ordinary meanings: cleansing, life and refreshment. Do not pour it over anyone.</li><li>Read the effects of Baptism: forgiveness of all sin and its punishment, new birth in grace, adoption, union with Christ and incorporation into the Church.</li><li>Write “Permanent character”. Explain why a valid Baptism can never be repeated.</li><li>Ask what preparation means: faith, sorrow for sin, conversion and free intention. State explicitly that sacramental Confession does not precede Baptism.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 14. Baptism joins us to Christ’s death and Resurrection and truly gives new life.</p>\n<h2>Baptism Dying and Rising with Christ</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Baptism more than a promise or membership ceremony?”</li><li>“What difference does the forgiveness of every previous sin make to your hope?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What sins does Baptism forgive? Original sin and every personal sin before Baptism. Can it be repeated? No. It gives a permanent sacramental character. Do catechumens confess sacramentally first? No. They repent and prepare for Baptism.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, prepare me to die and rise with Christ. Give me true repentance, strong faith and joy in the new life you promise. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Write or say one sentence about what God gives in Baptism, and pray for readiness to receive it.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Baptism forgives all previous sin; do not import the First Confession pathway for baptised children or candidates. Honest repentance and appropriate reparation still matter. Refer uncertainty about any prior Baptism to the priest.</p>\n<h2>Confirmation and the Gift of the Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Connect Confirmation with baptismal grace and the strength to witness to Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Paper listing the seven gifts printed in the steps; no oil is required.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Where would living faithfully as a Christian require courage from you?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Gifts for a real mission</strong></p>\n<ol><li>List wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. Read the central teaching of Conversation 15.</li><li>Use this case: a colleague invites someone to join in dishonest or cruel behaviour. Ask which gifts could help them respond well.</li><li>Explain hands laid and anointing with sacred chrism. Confirmation gives a permanent seal and a special outpouring of the Holy Spirit.</li><li>Connect new birth, strengthening and Eucharistic communion: an adult is ordinarily confirmed immediately after Baptism in the same celebration.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 15. Confirmation strengthens Baptism; it does not make Baptism real for the first time.</p>\n<h2>Confirmation and the Gift of the Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is this sacrament more than a personal declaration of maturity?”</li><li>“What form of witness is being asked of you now?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What does Confirmation strengthen? Baptismal grace. What is given? A special outpouring of the Holy Spirit for witness. Can Confirmation be repeated? No. It gives a permanent character.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit. Give me wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. Make me faithful to Christ. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one gift and ask the Holy Spirit for it in a particular situation.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not describe Confirmation as a reward for completed lessons or an optional later graduation. Explain its place in adult initiation. The priest directs the actual rite and any exceptional arrangement; do not rehearse anointing.</p>\n<h2>The Eucharist and the Holy Mass</h2>\n<h3>AIM</h3>\n<p>Hold together the Real Presence, Christ’s sacrifice and Eucharistic communion.</p>\n<h3>QUICK PREP</h3>\n<p>A crucifix and three headings: PRESENCE, SACRIFICE, COMMUNION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do Catholics believe is happening during the Eucharistic Prayer?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What Christ gives at Mass</strong></p>\n<ol><li>Under PRESENCE, read that bread and wine become Christ’s Body and Blood while their appearances remain: transubstantiation.</li><li>Under SACRIFICE, explain that Calvary’s one sacrifice is made sacramentally present; Christ does not suffer and die again.</li><li>Under COMMUNION, discuss union with Christ and his Church through receiving Jesus, Body, Blood, Soul and Divinity.</li><li>Ask why a catechumen participates in worship but waits until initiation before receiving Communion.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 16. Take more than one meeting if the Real Presence or sacrifice needs fuller explanation.</p>\n<h2>The Eucharist and the Holy Mass</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do Catholics adore the Blessed Sacrament?”</li><li>“How can you offer yourself with Christ while preparing to receive him?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is truly present? Jesus Christ, Body, Blood, Soul and Divinity. Does he die again at Mass? No. His one sacrifice is made present. May an unbaptised person receive Communion? No. Baptism comes first.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, Bread of Life, increase my faith. Help me worship you now and prepare to receive you sacramentally in your Church. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>After Sunday worship, spend a few quiet minutes before the tabernacle and express your desire for Christ.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Listen for understanding beyond “special bread” or a symbolic meal. Avoid makeshift consecrations and misleading physical analogies. Where catechumens are dismissed for Scripture reflection, support that liturgical practice and explain its meaning.</p>\n<h2>The Sacraments of Healing and Vocation</h2>\n<h3>AIM</h3>\n<p>Explore sacramental forgiveness, care for the sick and vocations of service.</p>\n<h3>QUICK PREP</h3>\n<p>The Companion and the four cases below; no objects needed.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “How might Christ’s care shape the difficult and decisive moments of a Catholic life?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Which sacrament and why</strong></p>\n<ol><li>Consider a baptised Catholic repentant after serious sin: Penance gives sacramental forgiveness and reconciliation.</li><li>Consider someone seriously ill or weakened by old age: Anointing brings Christ’s strength and care; it is not reserved to the last moments of life.</li><li>Consider a man called to ordained ministry: Holy Orders includes bishops, priests and deacons.</li><li>Consider a man and woman entering a lifelong covenant open to children: Matrimony serves their good and family life, and is sacramental between the baptised.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 17. Baptism opens the door to this continuing sacramental life.</p>\n<h2>The Sacraments of Healing and Vocation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Which of these Sacraments changes your picture of everyday Catholic life?”</li><li>“Why should marriage history be discussed with the priest early?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is Penance for? Sins committed after Baptism. Is Anointing only for the dying? No. It is for serious sickness or weakness through age. What is Matrimony? The lifelong covenant of one man and one woman, sacramental between the baptised.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Christ our physician and shepherd, heal what is wounded and guide my vocation. Teach me to receive your gifts in holiness and service. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask how to arrange Confession after Baptism and how to contact a priest for someone seriously ill.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Never direct a catechumen to sacramental Confession before Baptism. Discuss personal marriage circumstances confidentially with the priest; this activity cannot establish freedom to marry or resolve a prior bond. Keep the cases explanatory rather than diagnostic.</p>\n<h2>Freedom Conscience Virtue and Sin</h2>\n<h3>AIM</h3>\n<p>Form a truthful conscience and connect freedom with choosing the good.</p>\n<h3>QUICK PREP</h3>\n<p>Paper with three headings: TEMPTATION, CHOICE, HABIT.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Is being free simply doing whatever I feel like doing?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Learning to choose the good</strong></p>\n<ol><li>Use this case: someone is tempted to spread a harmful rumour but chooses to remain silent. Distinguish temptation from consent.</li><li>Change the case: the person knowingly invents a damaging lie. Ask what makes the choice morally different.</li><li>Read the three conditions for mortal sin: grave matter, full knowledge and deliberate consent, present together.</li><li>Under HABIT, name virtues that help stable good choices: prudence, justice, fortitude and temperance. Discuss conscience formed by truth rather than preference.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 18. Accidents, intrusive thoughts and insufficiently free acts must not be equated with deliberate sin.</p>\n<h2>Freedom Conscience Virtue and Sin</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How can conscience be both personally binding and in need of formation?”</li><li>“Which good habit would make a right choice easier?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is conscience? Reason’s judgement about a concrete act’s moral quality. What makes sin mortal? Grave matter, full knowledge and deliberate consent together. Is temptation itself sin? No.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, give me a truthful conscience and steady love of the good. Free me from sin and help me grow in virtue. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one virtue and one small action through which to practise it.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Use fictional situations, without judging whether a particular person has committed mortal sin. Avoid both trivialising grave matter and causing scrupulosity. Private examination and sensitive questions can be taken to the priest without group disclosure.</p>\n<h2>Love in Concrete Life</h2>\n<h3>AIM</h3>\n<p>Connect the Church’s moral teaching with dignity, truth and costly love.</p>\n<h3>QUICK PREP</h3>\n<p>Paper listing LIFE, RELATIONSHIPS, WORK, SPEECH, POSSESSIONS.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which area of Catholic moral teaching most needs patient explanation for you?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What love requires</strong></p>\n<ol><li>Choose a case: an employer exploits a vulnerable worker; a family dismisses an elderly relative as a burden; a friend treats sexual intimacy as having no lasting obligations.</li><li>Ask what dignity or good is at stake and why love requires more than strong feelings.</li><li>Read all of Conversation 19, including life, chastity, marriage, truth, justice and the common good. Do not omit a difficult teaching.</li><li>Let the person identify one teaching needing further discussion and one possible work of mercy. Personal details may remain private.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 19. Divide the discussion across several meetings when needed, while preserving the whole teaching.</p>\n<h2>Love in Concrete Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What reasons does the Church give for this teaching?”</li><li>“How can clarity about right and wrong be joined to practical mercy?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why defend every human life? Every person bears God’s image and has inviolable dignity. What is chastity? The integration of sexuality according to one’s state of life and God’s design. Does morality include social justice? Yes. Love requires justice, mercy and concern for the common good.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>God of truth and mercy, order my desires, relationships, speech and possessions towards love. Give me courage where conversion is costly. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one work of mercy that responds to a real person’s need.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not substitute a vague discussion of kindness for the source’s moral teaching. Invite sincere questions about the reasons. Complex relationships or moral struggles need patient, confidential pastoral care; never force sensitive disclosure in a group.</p>\n<h2>Prayer and the Ordinary Catholic Life</h2>\n<h3>AIM</h3>\n<p>Build a realistic pattern of prayer, Sunday worship, charity and parish belonging.</p>\n<h3>QUICK PREP</h3>\n<p>A weekly calendar or blank paper.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What pattern of prayer and worship could last after your first enthusiasm fades?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A rule that can be lived</strong></p>\n<ol><li>Write DAILY, SUNDAY, WEEKLY and PARISH. Add one manageable practice under each.</li><li>For DAILY, choose prayer from the printed texts at the end. For SUNDAY, plan Mass and necessary transport or work arrangements.</li><li>For WEEKLY, choose a work of mercy. Under PARISH, name a person or setting that will help continued belonging.</li><li>Read Conversation 20 about the Church’s worship and discipline. Mark Confession and worthy sacramental Communion as practices beginning after Baptism.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 20 and Appendix F. Devotions support the liturgy and do not replace Sunday Mass.</p>\n<h2>Prayer and the Ordinary Catholic Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What usually gets in the way of prayer, and what small change would help?”</li><li>“Who will help you remain part of parish life?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the weekly centre? Sunday Mass. What is the model of prayer? The Our Father taught by Jesus. Are lay Catholics called to mission? Yes, according to vocation and gifts.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, teach me to pray. Make worship, Scripture, charity and service ordinary parts of my life. Give me perseverance. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Keep the simple rule you have chosen for the next seven days.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Adapt to work, disability, caring duties and language needs. Teach the actual discipline rather than inventing personal burdens. Before Baptism the person attends worship without receiving Communion and learns repentance without sacramental Confession.</p>\n<h2>Election Scrutinies and the Battle for the Heart</h2>\n<h3>AIM</h3>\n<p>Explain Election and the Lenten rites as discernment, purification and healing.</p>\n<h3>QUICK PREP</h3>\n<p>Three cards: ELECTION, SCRUTINIES, INITIATION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you hope Christ will strengthen or heal as Baptism draws nearer?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>What the Lenten rites are doing</strong></p>\n<ol><li>Place ELECTION first. Explain the Church’s call of catechumens ready for the final preparation, following testimony and discernment.</li><li>Add SCRUTINIES. Read that these are prayers of intercession and exorcism for the elect, not tests or public Confession.</li><li>Use a fictional concern such as fear of changing an unjust habit. Ask what healing and strengthening would mean. No personal sin need be named.</li><li>Add INITIATION. Plan prayer, appropriate fasting and charity with the parish, keeping Lent’s spiritual purpose central.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 21 and Appendix B. Confirm current diocesan arrangements with the priest.</p>\n<h2>Election Scrutinies and the Battle for the Heart</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does readiness include Christian life as well as knowledge?”</li><li>“What is different about prayer for healing and public interrogation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is Election? The Church’s call to the final preparation for initiation. What are those called now named? The elect. Are Scrutinies public Confession? No. They are rites of purification and strengthening.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Jesus, light of the world, search my heart with mercy. Free me from what enslaves and strengthen what is good. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one faithful Lenten practice with your mentor and keep it quietly.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Use this conversation at the appropriate point in the journey, not merely after twenty meetings. The priest arranges the rites. Do not stage a mock Scrutiny or invite disclosure of private sins; sacramental Confession remains after Baptism.</p>\n<h2>Creed Lord’s Prayer and Final Preparation</h2>\n<h3>AIM</h3>\n<p>Help the elect profess the faith sincerely and receive the Church’s prayer.</p>\n<h3>QUICK PREP</h3>\n<p>The Apostles’ Creed and Our Father printed at the end of this guide.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “If asked why you want Baptism, what would you say in your own words?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Receiving faith and prayer</strong></p>\n<ol><li>Read the Creed slowly. Pause after the Father, the Son, the Holy Spirit and the Church. Ask the person to explain one truth from each part.</li><li>Read the Our Father. Choose one petition and discuss how it shapes a Christian life.</li><li>Practise making responses calmly while asking whether the words are sincerely meant. Questions can still be brought to the priest.</li><li>Explain that final repentance is a peaceful review before God, with appropriate reparation, not sacramental Confession before Baptism.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 22. The priest uses the approved rite for the actual presentations, baptismal profession and responses.</p>\n<h2>Creed Lord’s Prayer and Final Preparation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What does receiving the faith from the Church mean for you?”</li><li>“What still needs clarification before you profess that faith?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What does the Creed summarise? The apostolic faith into which we are baptised. Must every answer be perfectly memorised? No. Sincere faith and sufficient understanding matter. Do the elect confess sacramentally before Baptism? No. Baptism forgives all previous sin.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, increase my faith. Prepare me to profess your truth freely and pray as your child. Heal what needs healing and lead me into new life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the Creed and Our Father slowly each day, bringing any real difficulty to the priest.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>The printed Apostles’ Creed is for learning and prayer; the approved rite supplies the profession used at initiation. Avoid cramming or pressure. Any act of repair or reconciliation should be wise, safe and proportionate.</p>\n<h2>The Easter Vigil and the Sacraments of Initiation</h2>\n<h3>AIM</h3>\n<p>Prepare the elect to participate peacefully in Baptism, Confirmation and First Holy Communion.</p>\n<h3>QUICK PREP</h3>\n<p>Five cards: LIGHT, WORD, BAPTISM, CONFIRMATION, EUCHARIST.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which part of the Vigil are you most longing for, and which makes you nervous?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Walk through the celebration</strong></p>\n<ol><li>Arrange the cards using Conversation 23. Explain the movement through light and salvation history to sacramental initiation.</li><li>Review the renunciation of sin and profession of faith. Rehearse only the spoken responses and practical movements directed by the priest.</li><li>Explain water, white garment, candle and sacred chrism. Baptism, Confirmation and Eucharist ordinarily belong in the same celebration.</li><li>Practise “Amen” before Communion and plan a short thanksgiving. Review the one-hour Eucharistic fast, except water and medicine, with the priest.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 23 and Appendix B. The approved rite and the priest’s directions govern every actual liturgical action.</p>\n<h2>The Easter Vigil and the Sacraments of Initiation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What gift does each sacrament bring?”</li><li>“What practical concern can we settle so you can pray with greater peace?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Which sacraments are received? Baptism, Confirmation and the Eucharist. What does the white garment signify? The new dignity of being clothed in Christ. What does Amen before Communion express? Faith that this is the Body of Christ.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Risen Lord Jesus, complete what you have begun in me. Make me your own, feed me with your Body and Blood and keep me faithful. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Confirm practical arrangements with the parish and spend time in quiet prayer.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Rehearse without pretending to administer sacraments. Resolve mobility, language, health or other practical needs beforehand. Do not require sacramental Confession before Baptism. Receive the newly baptised into parish life beyond the celebration.</p>\n<h2>Mystagogy Living as a Newly Baptised Catholic</h2>\n<h3>AIM</h3>\n<p>Deepen the experience of the sacraments through continuing Catholic life.</p>\n<h3>QUICK PREP</h3>\n<p>The person’s simple rule of life and a calendar.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What has receiving the sacraments begun to change in your prayer and everyday life?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Living from what you have received</strong></p>\n<ol><li>Recall Baptism, Confirmation and Holy Communion. Ask what each gift means now, allowing a quiet or ordinary experience rather than demanding strong feelings.</li><li>Review the rule of life: Sunday Mass, daily prayer, charity and parish belonging. Adjust what has proved unrealistic.</li><li>Discuss how to prepare for Confession after Baptism: examination, contrition, honest confession, absolution and penance. Arrange personal guidance if needed.</li><li>Name one relationship, one act of service and one continuing opportunity to learn. Put the next meeting in the diary.</li></ol>\n<h3>NOW OPEN THE COMPANION</h3>\n<p>Read Conversation 24 and Appendix F. Mystagogy is lived experience and reflection, especially in the Easter season and continuing afterwards.</p>\n<h2>Mystagogy Living as a Newly Baptised Catholic</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How is Communion becoming the centre of your week?”</li><li>“Where do you need help to persevere or begin again?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is mystagogy? Deepening sacramental life through experience and reflection after initiation. Does formation end? No. It continues throughout life. What forgives serious sin after Baptism? The Sacrament of Penance.</strong></p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, thank you for the grace of Baptism. Nourish me in the Eucharist, keep me humble in repentance and make me generous in mission. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Keep your next meeting with the sponsor or mentor and choose one continuing parish commitment.</p>\n<h3>FOR THE MENTOR OR SPONSOR</h3>\n<p>Do not disappear after the Vigil. Help the neophyte learn peaceful, regular Confession after Baptism and worthy Communion. Anyone conscious of mortal sin should receive sacramental absolution before Communion. Growth is sustained by real parish relationships.</p>\n<h2>The RCIA journey at a glance</h2>\n<p>The conversations serve these periods; the rites mark genuine growth. Use the Companion’s journey map and Appendix B with the priest.</p>\n<h3>Enquirer</h3>\n<p>Evangelisation and precatechumenate. Hear the Gospel, ask questions and begin faith, prayer and conversion. Conversations 1–4.</p>\n<h3>Acceptance into the Order of Catechumens</h3>\n<p>The first major step follows discernment of the beginnings of faith and an intention to follow Christ.</p>\n<h3>Catechumen</h3>\n<p>A substantial period of formation, worship, conversion, charity and community. Conversations 5–20. It may take as long as real growth requires.</p>\n<h3>Election and the elect</h3>\n<p>The second major step, normally at the beginning of Lent, leads into purification and enlightenment. Conversations 21–22 support the Lenten rites and final preparation.</p>\n<h3>Sacraments of initiation</h3>\n<p>The third major step is ordinarily at the Easter Vigil: Baptism, Confirmation and Eucharist together. Conversation 23.</p>\n<h3>Neophyte and mystagogy</h3>\n<p>Especially in the Easter season, deepen the gifts received through sacramental life, reflection, charity and mission. Conversation 24.</p>\n<h3>THE RITES ARE NOT A TIMETABLE</h3>\n<p>No promise of initiation follows from completing these pages. Confirm the current diocesan arrangements for Election and adult initiation through the parish priest.</p>\n<h2>Readiness for Acceptance</h2>\n<p>Use these prompts alongside Appendix E of the Companion. Discernment is personal and pastoral; it is not a public examination.</p>\n<h3>FIRST FAITH</h3>\n<p>The person has heard the Gospel of Jesus Christ and shows initial faith or a sincere desire for faith.</p>\n<h3>FREE INTENTION</h3>\n<p>The person freely wishes to follow Christ and continue preparation, without pressure from family or circumstances.</p>\n<h3>BEGINNING CONVERSION</h3>\n<p>There is willingness to turn towards God and begin changing life in response to him.</p>\n<h3>PRAYER AND COMMUNITY</h3>\n<p>The person has begun prayer and contact with the parish’s worship and people.</p>\n<h3>UNDERSTANDING THE STEP</h3>\n<p>Acceptance begins the formal catechumenate. It is not Baptism and does not guarantee a fixed date for initiation.</p>\n<h3>An early pastoral conversation</h3>\n<p>Before plans are fixed, clarify any possible prior Baptism, marriage history and needs affecting participation. Use Appendix A. The priest determines the correct route and arrangements.</p>\n<h2>Readiness for Election</h2>\n<p>The catechumen, godparent, mentor and priest consider the person’s developing Christian life. The bishop’s current directions and approved rite govern Election.</p>\n<h3>INTENTION</h3>\n<p>A developed desire to receive Baptism, Confirmation and the Eucharist.</p>\n<h3>UNDERSTANDING</h3>\n<p>Sufficient knowledge of Christian teaching according to capacity, with sincere acceptance rather than memorised phrases.</p>\n<h3>FAITH AND CHARITY</h3>\n<p>Growth in prayer, Sunday worship, service and parish belonging.</p>\n<h3>CONVERSION</h3>\n<p>A real willingness to turn from grave sin and live the Gospel, supported by concrete steps.</p>\n<h3>PASTORAL MATTERS</h3>\n<p>Major canonical and pastoral questions have been addressed sufficiently for initiation to proceed.</p>\n<h3>HONEST TESTIMONY</h3>\n<p>Those accompanying the person can speak truthfully of readiness and any remaining concerns.</p>\n<p>If more time is needed, continue accompaniment. Do not rush because Lent is approaching or turn uncertainty into humiliation.</p>\n<h2>Readiness for initiation</h2>\n<h3>SINCERE PROFESSION</h3>\n<p>The elect freely profess the Catholic faith and understand its central truths according to capacity.</p>\n<h3>SACRAMENTAL UNDERSTANDING</h3>\n<p>Baptism gives new birth and forgiveness; Confirmation strengthens and seals; Eucharist gives Christ himself.</p>\n<h3>LENTEN PREPARATION</h3>\n<p>The person has entered prayer, repentance and the rites of purification and enlightenment as arranged by the Church.</p>\n<h3>REPENTANCE</h3>\n<p>There is sorrow for sin and intention to live a Christian life. Sacramental Confession does not precede Baptism.</p>\n<h3>PRACTICAL PARTICIPATION</h3>\n<p>The person understands the Vigil’s outline, responses and movements, with any needed adaptations.</p>\n<h3>CONTINUING LIFE</h3>\n<p>A sponsor, mentor and parish relationships will support the neophyte afterwards.</p>\n<p>Perfect memory, confidence in public speaking and strong religious feelings are not the standards. The priest discerns readiness within the Church’s law, rites and diocesan direction.</p>\n<h2>The Apostles’ Creed</h2>\n<p>Use this Creed for learning and prayer. At initiation the celebrant uses the profession and responses prescribed in the approved rite. I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.</p>\n<p>I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.</p>\n<h3>Pray with understanding</h3>\n<p>Pause over a truth that needs attention. Ask what it tells you about God and the life into which you are preparing to be baptised. “He descended into hell” refers here to Christ’s descent to the realm of the dead.</p>\n<h2>Prayers for ordinary life</h2>\n<h3>The Sign of the Cross</h3>\n<p>In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>\n<h3>The Our Father</h3>\n<p>Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>\n<h3>The Glory Be</h3>\n<p>Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen.</p>\n<h3>An Act of Contrition</h3>\n<p>O my God, because you are so good, I am very sorry that I have sinned against you, and by the help of your grace I will not sin again. Amen.</p>\n<h3>A morning offering</h3>\n<p>Father, I offer you this day through Jesus Christ. Guide my work, words and choices; help me love you and serve my neighbour. Amen.</p>\n<h3>A simple evening prayer</h3>\n<p>Thank you, Father, for your gifts today. Forgive my failures, show me how to begin again and keep me in your peace. Amen. Before Baptism, pray with repentance and trust. The Act of Contrition is a prayer you can use; it does not imply sacramental Confession before Baptism.</p>\n<h2>Final word for the mentor and sponsor</h2>\n<p>Let the person bring a real question. Use the activity to make the teaching concrete, then let the Companion supply the Catholic answer. Give time for understanding to become faith, prayer and a changed life.</p>\n<h3>ACCOMPANY THE PERSON</h3>\n<p>A sponsor or mentor introduces parish life, prays, listens, encourages and gives honest testimony when needed. The relationship continues after initiation.</p>\n<h3>KEEP THE WHOLE JOURNEY</h3>\n<p>Teaching belongs with Sunday worship, the Church’s rites, conversion, charity and community. Twenty-four conversations are a guide to formation, not a replacement for the catechumenate.</p>\n<h3>LIVE FROM CHRIST’S GIFTS</h3>\n<p>The goal is a disciple who freely believes, turns from sin and lives through Baptism, Confirmation and the Eucharist. Arrange continuing support, learning and service.</p>\n<h3>When the conversation needs help</h3>\n<p>Questions about possible Baptism, marriage history, doctrinal difficulties, health, disability or safeguarding belong with the appropriate parish support and the priest. Respect privacy and follow current parish procedures.</p>\n<h2>References for the priest and mentor</h2>\n<p>This guide follows the twenty-four conversations of Becoming Catholic RCIA A Catechumenate Companion. Use that book for the full teaching and the following appendices.</p>\n<h3>Appendices A and G</h3>\n<p>Correct pathway, prior Baptism, marriage and particular circumstances.</p>\n<h3>Appendices B and C</h3>\n<p>The major rites and the roles of sponsor and godparent.</p>\n<h3>Appendices D and E</h3>\n<p>Concise doctrinal answers and readiness before Acceptance, Election and initiation.</p>\n<h3>Appendices F and H</h3>\n<p>Ordinary Christian life, sources and parish authority.</p>\n<h3>Primary Church sources</h3>\n<p>Rite of Christian Initiation of Adults approved for England and Wales, especially the introductory guidance on the periods, major steps, formation and mystagogy.</p>\n<p>Catechism of the Catholic Church, especially 1213–1284 on Baptism, 1285–1321 on Confirmation, 1322–1419 on the Eucharist and 1422–1498 on Penance.</p>\n<p>Code of Canon Law, especially canons 206, 788–789 and 849–878, including canon 866 on Baptism, Confirmation and Eucharist in adult initiation.</p>\n<p>Liturgy Office of England and Wales, RCIA An Overview: liturgyoffice.org.uk/Resources/RCIA/overview.pdf.</p>\n<p>The approved liturgical books, universal law, current diocesan direction and the parish priest’s pastoral judgement govern the actual celebration. This activity guide does not supply a substitute rite.</p>"}, {"name": "Reception into Full Communion", "url": "https://3stepuk.github.io/Coming-Into-Full-Communion/", "desc": "For baptised adults entering full communion.", "html": "<p>For baptised Christians preparing for Reception</p>\n<h3>USE BESIDE THE PREPARATION BOOK</h3>\n<p>Use with Coming into Full Communion A Catholic Preparation Book for Baptised Christians. The book supplies the Catholic teaching. This companion helps a mentor or sponsor begin with the person, make the teaching concrete and accompany a free, sincere response.</p>\n<h3>THE METHOD</h3>\n<ul><li>Start with the person</li><li>Do something concrete</li><li>Open the preparation book</li><li>Talk honestly</li><li>Check the central truth</li><li>Pray and act</li></ul>\n<h3>A BAPTISM ALREADY RECEIVED</h3>\n<p>A candidate for Reception is already baptised. Valid Baptism is never repeated. Confession normally precedes Reception; Confirmation, when needed, and Holy Communion ordinarily follow within the celebration. The priest establishes the correct pathway.</p>\n<h2>How to use this guide</h2>\n<h3>ACCOMPANY AN EXISTING CHRISTIAN LIFE</h3>\n<p>Begin with gratitude for the faith, prayer and Christian witness already received. Full communion brings a real acceptance of Catholic faith, sacramental life and communion with the Church’s pastors.</p>\n<h3>For each conversation</h3>\n<ol><li>Make the Sign of the Cross. Ask the opening question and listen before explaining.</li><li>Try the activity together. All cards can be handwritten as you meet; every activity can also be spoken.</li><li>Open the matching conversation in the preparation book. Read REMEMBER and the teaching slowly, pausing for the candidate’s questions.</li><li>Talk together. Check the central truth, then use THE ESSENTIALS in the book to clarify understanding. Ask for ordinary words rather than a recitation.</li><li>Pray the printed prayer and choose one realistic action. Return to it when you next meet.</li><li>Repeat, combine or divide conversations as needed. Twelve conversations are not twelve compulsory meetings; progress follows readiness.</li></ol>\n<h3>Simple materials</h3>\n<p>The preparation book, this guide, paper and a pen are enough. A crucifix or church visit may help, but is optional. No prepared talk, craft kit, separate workbook or internet search is required.</p>\n<h3>FOR THE MENTOR</h3>\n<p>You listen, pray, explain simply, introduce parish life and help the candidate bring questions to the priest. You do not decide canonical matters or certify readiness. Use the preparation book for the teaching; seek help when a question needs more than you can give.</p>\n<h2>An opening conversation</h2>\n<p>Use this before beginning the twelve conversations. Let the candidate speak about their own Christian life and their present hopes.</p>\n<h3>Listen to the person</h3>\n<ol><li>“What has helped you know and follow Jesus so far?”</li><li>“What draws you towards full communion with the Catholic Church?”</li><li>“What do you most want to understand, and what gives you concern?”</li><li>“Is this a decision you freely wish to explore?”</li></ol>\n<h3>ESTABLISH THE CORRECT PATHWAY</h3>\n<p>Use Appendix A with the priest early. Clarify evidence of Baptism, any previous Catholic status, Confirmation or chrismation, Eastern Christian background and all marriage history. The priest investigates uncertainty and directs the proper route. A mentor does not decide validity.</p>\n<h3>Make accompaniment possible</h3>\n<p>Agree how to meet and communicate. Ask about language, reading, disability, work and caring responsibilities. Introduce the candidate to parish people and help them attend Sunday Mass, taking part in prayer without normally receiving Communion before Reception.</p>\n<h3>BEGIN WITH ONE REAL QUESTION</h3>\n<p>Write or say the candidate’s main question and one next step. Allow the question to develop. Do not promise a Reception date because a set of pages can be completed.</p>\n<p>Sensitive family matters and personal sins belong in a confidential conversation with the priest, not in a group or mentor’s record. Establish suitable sponsor support with parish guidance.</p>\n<h2>The Call to Full Communion</h2>\n<h3>AIM</h3>\n<p>Connect gratitude for Baptism with a free desire for full Catholic communion.</p>\n<h3>QUICK PREP</h3>\n<p>Paper with two headings: GIFTS RECEIVED and FULL COMMUNION.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What has God already given you in your Christian life, and what now draws you towards the Catholic Church?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Receiving a gift and taking a step</strong></p>\n<ol><li>Under GIFTS RECEIVED, name Baptism, faith in Jesus, Scripture, prayer or Christian witness. Give thanks without evaluating every earlier experience.</li><li>Under FULL COMMUNION, write FAITH, SACRAMENTS and PASTORS. Read how the book explains these three bonds.</li><li>Ask what becoming Catholic would change in belief, worship and parish belonging. Identify one genuine hope and one question.</li><li>Write “One Baptism”. Explain that Reception honours the Baptism already received; it is a new step into full communion, not another Baptism.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1. Use Appendix E if the candidate wonders whether Reception requires dismissing every grace received before.</p>\n<h2>The Call to Full Communion</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What are you moving towards in becoming Catholic?”</li><li>“What would help you make this decision freely and sincerely?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Will valid Baptism be repeated? No. It is received only once. What is full communion? Visible unity in Catholic faith, sacramental life and communion with the Church’s pastors. Must the decision be free? Yes. No one should be pressured into a profession of faith.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, thank you for the grace of my Baptism and for everyone who helped me follow you. Deepen my faith and lead me freely into the unity you desire. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Name three graces already received and one reason you feel drawn towards full Catholic communion.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen for the person’s own desire. Gratitude for earlier Christian life and acceptance of the fullness of Catholic faith belong together. Do not ask the candidate to disparage family or former fellow Christians.</p>\n<h2>Scripture Tradition and the Magisterium</h2>\n<h3>AIM</h3>\n<p>Show how the one apostolic faith is handed on and faithfully interpreted.</p>\n<h3>QUICK PREP</h3>\n<p>Three handwritten cards: SCRIPTURE, TRADITION, MAGISTERIUM.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “If sincere Christians interpret the same biblical passage differently, how can the Church remain one in truth?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A message received and handed on</strong></p>\n<ol><li>Place SCRIPTURE: the inspired written Word of God. Ask what the candidate already values about the Bible.</li><li>Add TRADITION: the living transmission of the apostolic faith. Distinguish this from ordinary customs that may change.</li><li>Add MAGISTERIUM: the Pope and bishops in communion with him guard and interpret what was received. They serve God’s Word.</li><li>Use this case: two readers claim that one passage proves opposite teachings. Read the book’s explanation and ask why private certainty alone does not resolve the disagreement.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 2, especially the common source of Scripture and Tradition. Use Appendix E on “Bible alone” if helpful.</p>\n<h2>Scripture Tradition and the Magisterium</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What is the difference between Apostolic Tradition and a parish custom?”</li><li>“What real question about Catholic teaching authority needs further explanation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Is Scripture inspired? Yes. It is God’s written Word. Are Scripture and Tradition rivals? No. They hand on the one apostolic faith together. Is the Magisterium above God’s Word? No. It serves, guards and authentically interprets it.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, give me love for Scripture and humility before God’s Word. Help me receive the apostolic faith faithfully and seek its meaning honestly. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Reread the REMEMBER paragraph in Conversation 2 and bring one actual question about Scripture, Tradition or authority.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not set Scripture against the Church or describe Tradition as permission to invent doctrine. Let the candidate name a difficulty precisely. Use the book’s explanation before introducing further material.</p>\n<h2>The Creed and the Mystery of Salvation</h2>\n<h3>AIM</h3>\n<p>Connect the Creed with the saving work of Father, Son and Holy Spirit.</p>\n<h3>QUICK PREP</h3>\n<p>The Apostles’ Creed printed at the end of this guide; a pen, optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which part of the Creed is familiar to you, and which would you like to understand more deeply?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The faith I can explain</strong></p>\n<ol><li>Read the printed Creed slowly. Pause at the Father, the Son and the Holy Spirit rather than treating it as a memory exercise.</li><li>Choose one familiar phrase and one difficult phrase. Let the candidate explain what each seems to mean before opening Conversation 3.</li><li>Follow the movement: creation, human sin, the Son’s Incarnation, Cross and Resurrection, the Spirit’s work and eternal life.</li><li>Ask what Christian hope would lose if the Resurrection meant only that Jesus’ ideas survived. Keep bodily Resurrection and our need for grace clear.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 3. Use the Creed here for learning and prayer; the approved rite supplies the actual profession used at Reception.</p>\n<h2>The Creed and the Mystery of Salvation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why do we need salvation rather than only moral improvement?”</li><li>“How does belief in the Resurrection change the way we face death?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is God? One God in three divine Persons: Father, Son and Holy Spirit. Who is Jesus? The eternal Son made man, true God and true man. What do Christians hope for? Christ’s return, the resurrection of the body and eternal life with God.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, Son and Holy Spirit, deepen the faith I received at Baptism. Help me understand your saving work and live by the truth I profess. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the printed Creed slowly on three occasions. Bring one phrase you cannot yet explain to the next conversation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>A candidate may already know the Creed well. Explore understanding without starting from nothing. Keep one God and three Persons, Christ’s divinity and humanity, and real bodily Resurrection precise; avoid misleading analogies.</p>\n<h2>The Church Christ Founded</h2>\n<h3>AIM</h3>\n<p>Make the Church’s spiritual life, visible unity and apostolic authority concrete.</p>\n<h3>QUICK PREP</h3>\n<p>Four cards: ONE, HOLY, CATHOLIC, APOSTOLIC.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you think Christ intended his Church to be, and how would that be visible?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Four marks of one Church</strong></p>\n<ol><li>Arrange the cards. Use Conversation 4 to give a brief meaning for each: unity, Christ’s holiness, fullness and universal mission, apostolic faith and succession.</li><li>Add PARISH, BISHOP and POPE below them. Trace how a local parish belongs to the wider Church in communion.</li><li>Use this case: a Catholic leader behaves badly. Ask why wrongdoing must be confronted without concluding that Christ’s gifts have disappeared.</li><li>Read the paragraph about the Pope. Distinguish the ministry of unity and defined conditions of infallibility from personal opinions or freedom from sin.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 4 and, where useful, Appendix E on the Pope and legitimate differences of opinion.</p>\n<h2>The Church Christ Founded</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does visible unity matter alongside personal faith?”</li><li>“What concern about the Church’s authority or history needs an honest conversation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What are the four marks? One, holy, catholic and apostolic. Who is the Church’s Head? Jesus Christ. Is every papal statement infallible? No. Infallibility has defined conditions.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, give me love for your Church, fidelity to the apostolic faith and humility towards those entrusted with her care. Help us become holy in your grace. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>At Sunday Mass, listen for prayer for the Pope and diocesan bishop. Ask how the parish shares in the wider Church.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Never excuse wrongdoing or imply that every opinion of a Church leader is doctrine. Help the candidate understand the Church’s actual claim. Listen seriously to painful experiences and involve appropriate parish support when needed.</p>\n<h2>Mary the Saints and the Communion of Saints</h2>\n<h3>AIM</h3>\n<p>Distinguish adoration from veneration and explain intercession and prayer for the dead.</p>\n<h3>QUICK PREP</h3>\n<p>Two headings: GOD ALONE and PRAY FOR US. No image is required.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Which Catholic belief about Mary, saints or prayer for the dead has been hardest for you, and why?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>One communion in Christ</strong></p>\n<ol><li>Under GOD ALONE, write ADORATION. Under PRAY FOR US, name asking another Christian to pray. Explain that every intercession depends on Christ.</li><li>Read Conversation 5 on asking saints in heaven to intercede. Ask how their being alive in Christ matters.</li><li>Read Mary’s privileges in the book: Mother of God, Immaculate Conception, ever Virgin and Assumption. Connect each with Christ and grace; Mary remains a creature.</li><li>Use this distinction: purgatory is purification of someone alre
