s, personal circumstances and readiness.</p>\n<h2>An opening conversation</h2>\n<p>Begin here before working through the twelve conversations. A period away from practice calls for patient accompaniment and an honest next step.</p>\n<h3>Listen to the person</h3>\n<ol><li>“What has your Catholic faith meant in your life so far?”</li><li>“Why do you wish to receive Confirmation now?”</li><li>“What do you most want to understand, and what concerns you?”</li><li>“What would help you return to or deepen Mass and prayer?”</li></ol>\n<h3>ESTABLISH THE CORRECT PATHWAY</h3>\n<p>Use Appendices A and I with the priest early. Check Baptism, Catholic status and whether Confirmation or Eastern Catholic chrismation has already been received. Mention any missing First Holy Communion. An unbaptised adult needs the catechumenate; a non-Catholic Christian seeking to become Catholic needs Reception into Full Communion.</p>\n<h3>Arrange practical support</h3>\n<p>Agree how to meet. Ask about language, reading, disability, work and caring responsibilities. Arrange a suitable sponsor with parish guidance. Bring marriage or other sacramental questions privately to the priest before choosing a date.</p>\n<h3>ONE NEXT STEP</h3>\n<p>Choose something possible now: Sunday Mass, daily prayer, obtaining a baptismal certificate or speaking to the priest. Family expectations or wedding plans should not replace the candidate’s sincere intention.</p>\n<p>Never ask for an account of private sins. A mentor accompanies preparation; sacramental Confession belongs with the priest.</p>\n<h2>Baptism and Christian Initiation</h2>\n<h3>AIM</h3>\n<p>Place Confirmation within the new life already received in Baptism and nourished by the Eucharist.</p>\n<h3>QUICK PREP</h3>\n<p>Three handwritten cards: BAPTISM, CONFIRMATION, EUCHARIST.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you think Confirmation will give you that you have not yet received?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>New life strengthened and nourished</strong></p>\n<ol><li>Place the three cards together. Under Baptism write NEW LIFE; under Confirmation, STRENGTH; under Eucharist, NOURISHMENT. All belong to one Christian initiation.</li><li>Ask what Baptism has already given. Supply what is needed: forgiveness, new life as God’s child, membership in Christ and his Church, a permanent mark.</li><li>Use this claim: “Confirmation finally makes my Baptism count.” Ask the candidate to correct it: Baptism is already valid; Confirmation completes and strengthens its grace.</li><li>Name one way this new life is already being lived and one way it needs strengthening. Give thanks for Baptism before discussing the date of Confirmation.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 1. Use Appendix A if Baptism, earlier Confirmation or First Holy Communion needs clarification.</p>\n<details class=\"conv\"><summary>Open Conversation 1 &mdash; Baptism and Christian Initiation</summary><div class=\"conv-body\"><p>REMEMBER Baptism, Confirmation and the Holy Eucharist form one Christian initiation: new life, strengthening and nourishment in Christ.</p>\n<p>Your Christian life did not begin with Confirmation. In Baptism you were freed from sin, born again as a child of God, incorporated into Christ and his Church, and marked permanently as belonging to Christ.</p>\n<p>Confirmation does not make Baptism valid and it is not your opportunity to decide whether your Baptism counted. It completes and strengthens baptismal grace. The Eucharist completes Christian initiation by nourishing us with Christ himself.</p>\n<p>As an adult, receiving Confirmation is a conscious act of discipleship, but the sacrament is first God acting. You freely receive a grace you did not create and accept the mission that flows from the Baptism you already possess.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What has Baptism already given you, and why would it be wrong to describe Confirmation as &quot;finally choosing whether your Baptism was real&quot;?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Which are the sacraments of Christian initiation?</li></ol>\n<p>Baptism, Confirmation and the Holy Eucharist.</p>\n<ol><li>What does Baptism begin?</li></ol>\n<p>The new life of grace in Christ and membership in his Church.</p>\n<ol><li>What does Confirmation do to baptismal grace?</li></ol>\n<p>It completes and strengthens baptismal grace.</p>\n<ol><li>Does Confirmation make Baptism valid?</li></ol>\n<p>No. Baptism is already valid; Confirmation strengthens and completes its grace.</p>\n<ol><li>Which sacrament completes Christian initiation?</li></ol>\n<p>The Holy Eucharist.</p>\n<h4>PRAYER</h4>\n<p>Father, thank you for making me your child in Baptism. Deepen that grace in me and lead me into the fullness of Christian initiation. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Find your baptismal date and parish. If you can, obtain your baptismal certificate and thank God specifically for the grace of your Baptism.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 4</p></div></details>\n<h2>Baptism and Christian Initiation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Confirmation first a gift of God rather than something we achieve?”</li><li>“How do Baptism, Confirmation and Eucharist belong together?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Which are the initiation sacraments? Baptism, Confirmation and the Holy Eucharist. Does Confirmation make Baptism valid? No. Baptism is already valid. What happens to baptismal grace? Confirmation completes and strengthens it.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Father, thank you for making me your child in Baptism. Strengthen the life you have given me and prepare me to receive the Holy Spirit more fruitfully. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Find your baptismal date and parish, asking for the record if needed. Thank God for one grace you have received through Baptism.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Listen for graduation, maturity or social expectations as the whole explanation. Honour the adult’s freedom while keeping God’s sacramental action central. Refer uncertain records and missing First Holy Communion to the priest.</p>\n<h2>The Holy Spirit Lord and Giver of Life</h2>\n<h3>AIM</h3>\n<p>Help the adult know the Holy Spirit as a divine Person and pray for his sanctifying help.</p>\n<h3>QUICK PREP</h3>\n<p>Two headings: WHO HE IS and WHAT HE DOES.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “When you hear ‘Holy Spirit’, do you think first of a Person, a feeling or a power?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A Person we can know and love</strong></p>\n<ol><li>Under WHO HE IS, write TRUE GOD and THIRD PERSON OF THE TRINITY. There is one God in three divine Persons, Father, Son and Holy Spirit.</li><li>Under WHAT HE DOES, write GIVES LIFE, SANCTIFIES, GUIDES and HELPS US PRAY. Ask which help seems most needed now.</li><li>Use this case: an adult says, “I feel no religious excitement, so the Holy Spirit cannot be helping me.” Ask why his action is not measured by a passing emotion.</li><li>Pray directly: “Holy Spirit, help me know and love God.” Name one daily choice where grace is needed alongside honest thought and effort.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 2. Keep the Spirit’s divinity, personal action and presence in the life of grace clear.</p>\n<details class=\"conv\"><summary>Open Conversation 2 &mdash; The Holy Spirit, Lord and Giver of Life</summary><div class=\"conv-body\"><p>REMEMBER The Holy Spirit is the third Person of the Blessed Trinity: true God with the Father and the Son.</p>\n<p>There is one God in three divine Persons: Father, Son and Holy Spirit. The Holy Spirit is not merely a force, mood, symbol or religious energy. He is a divine Person who knows, loves, speaks, guides and sanctifies.</p>\n<p>The Holy Spirit draws us to faith, gives divine life, dwells in souls in grace, makes the Church a living temple and forms Christ in us. Everything authentically Christian is lived by grace, not by willpower alone.</p>\n<p>Adult faith can become very practical and self-reliant. Confirmation reminds us that discipleship is supernatural. We need the Holy Spirit to pray, repent, discern, persevere, forgive, serve and bear witness.</p>\n<h4>TALK ABOUT IT</h4>\n<p>If the Holy Spirit is truly a divine Person rather than an impersonal force, how should that change the way you pray and make decisions?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who is the Holy Spirit?</li></ol>\n<p>The third Person of the Blessed Trinity, true God with the Father and the Son.</p>\n<ol><li>Are there three gods?</li></ol>\n<p>No. There is one God in three divine Persons.</p>\n<ol><li>Is the Holy Spirit only a power or feeling?</li></ol>\n<p>No. He is a divine Person who acts with knowledge and love.</p>\n<ol><li>What does the Holy Spirit do in the Church?</li></ol>\n<p>He gives life, sanctifies, guides and preserves the Church in the truth.</p>\n<ol><li>What does he do in a soul in grace?</li></ol>\n<p>He dwells within that soul and helps it know, love and serve God.</p>\n<h4>PRAYER</h4>\n<p>Come, Holy Spirit. Teach me to know you, love you and follow your inspirations with a willing heart. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Begin each day with a simple prayer: &quot;Holy Spirit, guide my mind, words and choices today.&quot;</p>\n<p>PREPARING FOR ADULT CONFIRMATION 5</p></div></details>\n<h2>The Holy Spirit Lord and Giver of Life</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How does knowing the Holy Spirit as a Person change prayer?”</li><li>“Where do you rely on willpower without asking for grace?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is the Holy Spirit? The third Person of the Blessed Trinity, true God. Are there three gods? No. There is one God in three divine Persons. Is the Spirit just an emotion? No. He is a divine Person who gives life and sanctifies.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Come, Holy Spirit. Help me know you as Lord and Giver of Life. Teach me to pray, repent and follow your grace in the ordinary choices of this day. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Each morning pray: “Holy Spirit, guide my mind, words and choices today.” At night thank him for one opportunity to do good.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Avoid analogies that divide God into parts or make the three Persons merely different appearances. Lack of strong feeling is not evidence that grace is absent. Encourage simple, faithful prayer and cooperation with the Spirit.</p>\n<h2>The Promise and Pentecost</h2>\n<h3>AIM</h3>\n<p>Connect Pentecost with the strength for mission given in Confirmation.</p>\n<h3>QUICK PREP</h3>\n<p>Two headings: BEFORE PENTECOST and SENT AS WITNESSES.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Where in family, work or friendships do you need courage to live your faith openly?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>From fear to faithful witness</strong></p>\n<ol><li>Retell the book’s account: the risen Jesus promised the Holy Spirit; at Pentecost the Spirit descended upon the Apostles, who proclaimed Christ boldly.</li><li>Under BEFORE PENTECOST, name fear and waiting. Under SENT AS WITNESSES, name courage, proclamation of Christ and the gathering of believers into the Church.</li><li>Use this case: a colleague asks why a Catholic goes to Mass. Think of one honest, courteous answer rather than hiding faith or starting an argument.</li><li>Explain that Confirmation gives a special outpouring of the Spirit for witness. Choose one ordinary situation where the candidate can ask for this courage.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 3. Its account supplies the activity; a separate Bible reading is optional, not needed for the meeting.</p>\n<details class=\"conv\"><summary>Open Conversation 3 &mdash; The Promise and Pentecost</summary><div class=\"conv-body\"><p>REMEMBER At Pentecost the risen Christ poured out the Holy Spirit upon the Apostles and sent them to bear witness.</p>\n<p>The prophets promised a new outpouring of God&#x27;s Spirit. Jesus, conceived by the Holy Spirit and anointed for his mission, promised the Advocate who would teach, strengthen and guide his disciples.</p>\n<p>After the Resurrection, Jesus told the Apostles they would receive power from on high and become his witnesses. At Pentecost, the Holy Spirit descended and the fearful Apostles proclaimed Christ boldly.</p>\n<p>Pentecost was not a private spiritual experience. The Spirit formed a missionary Church. Confirmation perpetuates this Pentecostal grace by strengthening the baptised for witness and mission.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Where in your present adult life - family, work, friendships, public responsibilities or parish - do you most need the courage of Pentecost?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who promised to send the Holy Spirit?</li></ol>\n<p>Jesus Christ promised to send the Holy Spirit from the Father.</p>\n<ol><li>What happened at Pentecost?</li></ol>\n<p>The Holy Spirit descended upon the Apostles and strengthened them to proclaim Christ.</p>\n<ol><li>What did the Apostles do afterwards?</li></ol>\n<p>They preached the Gospel boldly and gathered believers into the Church.</p>\n<ol><li>Was Pentecost only a private experience?</li></ol>\n<p>No. The Spirit formed and sent the Church for mission.</p>\n<ol><li>How is Confirmation related to Pentecost?</li></ol>\n<p>It gives a special outpouring of the Holy Spirit for Christian witness.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, as you strengthened the Apostles, give me courage to confess Christ and charity to serve those he loves. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Acts 1:6-9 and Acts 2:1-11. Notice what changes when the Apostles receive the Spirit.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 6</p></div></details>\n<h2>The Promise and Pentecost</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why was Pentecost more than a private spiritual experience?”</li><li>“How can courage and charity belong together in a real conversation?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who promised the Spirit? Jesus Christ. What did the Apostles do at Pentecost? They proclaimed Christ boldly in the strength of the Spirit. What does Confirmation share in? The grace of Pentecost for witness and mission.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, as you strengthened the Apostles, strengthen me to confess Christ. Give me truthful words, patient charity and courage in the places where I live and work. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one ordinary opportunity to acknowledge your faith truthfully and kindly. Pray for the courage of Pentecost before it arises.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Keep mission connected with Christ and the Church. Do not require an emotional testimony or a public performance. A brief honest answer, faithful Sunday worship or a quiet act of mercy may be a real beginning.</p>\n<h2>Confirmation in Scripture and Tradition</h2>\n<h3>AIM</h3>\n<p>Explain Confirmation’s apostolic roots through prayer, hands and the gift of the Spirit.</p>\n<h3>QUICK PREP</h3>\n<p>Four cards: BAPTISED, APOSTLES, PRAYER, LAYING ON OF HANDS.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “If someone said Confirmation was invented for teenagers, how would you begin to answer?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>An apostolic gift handed on</strong></p>\n<ol><li>Read the book’s account of Samaria: the people were baptised; Peter and John came, prayed and laid hands upon them; they received the Holy Spirit.</li><li>Arrange the four cards in that order. Explain that this shows a gift of the Spirit to people already baptised, not a second Baptism.</li><li>Read the book’s reference to Paul at Ephesus. Name the same pattern and connect it with the Church’s living sacramental Tradition.</li><li>Say the answer together in ordinary words: Confirmation comes from Christ and belongs to the apostolic life of the Church. It strengthens baptismal grace.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 4. The relevant passages are Acts 8:14–17 and Acts 19:5–6; the book gives the needed account.</p>\n<details class=\"conv\"><summary>Open Conversation 4 &mdash; Confirmation in Scripture and Tradition</summary><div class=\"conv-body\"><p>REMEMBER Christ instituted Confirmation, and the Apostles imparted the Holy Spirit to the baptised by prayer and the laying on of hands.</p>\n<p>In Samaria, people had received Baptism. Peter and John came, prayed for them and laid hands upon them, and they received the Holy Spirit. Saint Paul did likewise for baptised disciples at Ephesus.</p>\n<p>Sacred Scripture gives the apostolic pattern; Sacred Tradition recognises and hands on the sacrament. The Church has long used the laying on of hands and anointing with consecrated chrism as the sacramental sign.</p>\n<p>Confirmation is therefore not a modern ceremony invented to mark adolescence. It belongs to the apostolic sacramental life of the Church and is part of Christian initiation.</p>\n<h4>TALK ABOUT IT</h4>\n<p>If someone asked you where Confirmation comes from, what would you point to in the Acts of the Apostles and in the Church&#x27;s living Tradition?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who instituted Confirmation?</li></ol>\n<p>Jesus Christ instituted Confirmation.</p>\n<ol><li>How did the Apostles impart the Holy Spirit to the baptised?</li></ol>\n<p>They prayed and laid their hands upon them.</p>\n<ol><li>Where is this pattern described?</li></ol>\n<p>Especially in Acts 8:14-17 and Acts 19:5-6.</p>\n<ol><li>What does the name Confirmation suggest?</li></ol>\n<p>Strengthening, because the sacrament strengthens baptismal grace.</p>\n<ol><li>Why is it also called Chrismation?</li></ol>\n<p>Because the baptised are anointed with sacred chrism.</p>\n<h4>PRAYER</h4>\n<p>Lord Jesus, keep me in the faith of the Apostles and make me faithful to their mission. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read Acts 8:14-17 slowly. Identify Baptism, the Apostles, prayer, the laying on of hands and the gift of the Spirit.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 7</p></div></details>\n<h2>Confirmation in Scripture and Tradition</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“What does the apostolic pattern tell us about the relation to Baptism?”</li><li>“Why does the Church receive and hand on the sacraments rather than invent them?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who instituted Confirmation? Jesus Christ. How did the Apostles impart the Spirit? By prayer and the laying on of hands. Why the name Confirmation? It signifies the strengthening of baptismal grace.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord Jesus, keep me in the faith of the Apostles. Help me receive what your Church hands on and become faithful to the mission you entrust to her. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Retell the Samaria account in your own words, using the four headings. Bring one question about Scripture or Tradition to the next meeting.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Use the scriptural pattern without claiming it supplies every later ceremonial detail. Do not turn the activity into a simulated sacrament. The book explains how Scripture and living Tradition witness to the Church’s sacramental life.</p>\n<h2>The Minister Chrism and Sacramental Words</h2>\n<h3>AIM</h3>\n<p>Identify the minister, sacred chrism, essential sacramental action and candidate’s response.</p>\n<h3>QUICK PREP</h3>\n<p>Four headings: MINISTER, CHRISM, WORDS, RESPONSE. No oil is needed.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What do you already know about what will happen when you are confirmed?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Who acts and what is said</strong></p>\n<ol><li>Under MINISTER, write BISHOP. Explain that he is a successor of the Apostles. A priest may confirm when he has the required faculty.</li><li>Under CHRISM, write PERFUMED OIL CONSECRATED BY A BISHOP. The minister anoints the forehead by the laying on of his hand.</li><li>Under WORDS, read: “N., be sealed with the Gift of the Holy Spirit.” Explain that N. stands for the candidate’s name. Under RESPONSE, write AMEN.</li><li>Practise saying “Amen” clearly as an expression of faith. Ask the parish who will confirm and what local arrangements the candidate should follow.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 5 and Appendix B. The approved rite and confirming minister govern the actual celebration.</p>\n<details class=\"conv\"><summary>Open Conversation 5 &mdash; The Minister, Chrism and Sacramental Words</summary><div class=\"conv-body\"><p>REMEMBER In the Latin Church the bishop is the ordinary minister; Confirmation is conferred by anointing with sacred chrism, the laying on of the hand and the words prescribed by the Church.</p>\n<p>The bishop normally confirms because he is a successor of the Apostles. His ministry visibly links Confirmation with the apostolic Church and her mission.</p>\n<p>A priest can confirm when universal law itself gives the faculty or when the competent authority grants it. A priest who receives a baptised Christian into full Catholic communion has the faculty for that person; an already-Catholic adult is confirmed by the bishop or by a priest who has the required faculty. In danger of death, any priest can confirm.</p>\n<p>The essential rite in the Roman Rite is the anointing of the forehead with sacred chrism, done by the laying on of the minister&#x27;s hand, with the sacramental words: &quot;N., be sealed with the Gift of the Holy Spirit.&quot;</p>\n<h4>TALK ABOUT IT</h4>\n<p>Why is the normal connection with the bishop important, even when a priest has the faculty to confirm?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who is the ordinary minister of Confirmation?</li></ol>\n<p>The bishop.</p>\n<ol><li>May a priest confirm?</li></ol>\n<p>Yes, when the law or competent authority gives him the faculty.</p>\n<ol><li>What is sacred chrism?</li></ol>\n<p>Perfumed oil consecrated by a bishop.</p>\n<ol><li>Where is the candidate anointed?</li></ol>\n<p>On the forehead.</p>\n<ol><li>What words are used in the Roman Rite?</li></ol>\n<p>&quot;N., be sealed with the Gift of the Holy Spirit.&quot;</p>\n<h4>PRAYER</h4>\n<p>God of the Apostles, bless our bishop and priests. Through their ministry keep your Church faithful, holy and missionary. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Learn the name of your diocesan bishop and pray for him by name. Ask the parish who will administer your Confirmation.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 8</p></div></details>\n<h2>The Minister Chrism and Sacramental Words</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does the connection with the bishop matter?”</li><li>“What does your ‘Amen’ say about receiving the gift?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Who is the ordinary minister? The bishop. May a priest confirm? Yes, when the law or competent authority gives him the faculty. What does the candidate answer? Amen.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>God of the Apostles, bless our bishop and priests. Prepare me to receive the sacrament with faith and to answer Amen with a willing and grateful heart. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Ask the parish who will administer Confirmation and pray for that minister. Learn the sacramental words and your response.</p>\n<h3>FOR THE MENTOR</h3>\n<p>An already-Catholic adult’s Confirmation requires the bishop or a priest with the appropriate faculty. Reception of a non-Catholic Christian has a different legal basis. Leave faculties to the priest; practise responses without oil, touching or imitation of the sacramental act.</p>\n<h2>Anointing Seal and Belonging to Christ</h2>\n<h3>AIM</h3>\n<p>Connect anointing and the permanent sacramental character with a life belonging to Christ.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: STRENGTH, CONSECRATION, PERMANENT SEAL.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would it mean for your hidden choices as well as your public life to belong to Christ?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>The sign and the gift</strong></p>\n<ol><li>Under STRENGTH, name the courage needed for Christian life. Chrism’s oil signifies strengthening; the sacrament truly gives grace.</li><li>Under CONSECRATION, name belonging to Christ, the Anointed One. Its fragrance points towards the witness of a holy life.</li><li>Under PERMANENT SEAL, write CHARACTER. This is an indelible spiritual mark; it is not a visible mark on the body or a passing feeling.</li><li>Use this case: someone confirmed years ago has drifted from practice. Explain that the answer is repentance and renewed cooperation with grace, not repeating Confirmation.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 6. If the person is unsure whether they have been confirmed, use Appendix I with the priest.</p>\n<details class=\"conv\"><summary>Open Conversation 6 &mdash; Anointing, Seal and Belonging to Christ</summary><div class=\"conv-body\"><p>REMEMBER The visible signs of Confirmation reveal the invisible gift: the Holy Spirit consecrates, strengthens and seals us for Christ.</p>\n<p>Sacred chrism is fragrant oil consecrated by the bishop. Oil evokes strengthening and consecration; fragrance suggests the witness of a holy life; anointing identifies us with Christ, the Anointed One.</p>\n<p>The minister invokes the Holy Spirit over the candidates and anoints each one with the Sign of the Cross. The sacrament imprints an indelible spiritual character - a permanent seal of belonging and consecration.</p>\n<p>The character remains even if a person later neglects the grace of the sacrament. Confirmation cannot be repeated. The right response is not anxiety about whether the sacrament &quot;worked&quot;, but repentance, renewed prayer and cooperation with the grace already given.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What would it mean in practice to live as someone permanently marked as belonging to Christ?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What does anointing with chrism signify?</li></ol>\n<p>Strength, consecration and sharing in the life and mission of Christ.</p>\n<ol><li>What does the fragrance suggest?</li></ol>\n<p>The pleasing witness of a holy Christian life.</p>\n<ol><li>What is the spiritual seal?</li></ol>\n<p>The indelible character by which Christ marks the confirmed with his Spirit.</p>\n<ol><li>Can the character be erased?</li></ol>\n<p>No. The sacramental character remains permanently.</p>\n<ol><li>Can Confirmation be repeated?</li></ol>\n<p>No. It is received only once.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, seal me for Christ. Let my thoughts, words, relationships and work carry the fragrance of his truth and charity. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Look at the Sign of the Cross you make each day. Ask what it means for your work, relationships, use of time and hidden choices to belong to Christ.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 9</p></div></details>\n<h2>Anointing Seal and Belonging to Christ</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How might your conduct carry the ‘fragrance’ of Christ’s charity?”</li><li>“Why does a permanent character call for continuing conversion?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What does anointing signify? Strength, consecration and sharing in Christ’s mission. What is the sacramental character? The permanent spiritual seal given in Confirmation. Can Confirmation be repeated? No. It is received only once.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, prepare me to belong to Christ more faithfully. Let my words, work, relationships and hidden decisions bear witness to his truth and charity. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Make the Sign of the Cross slowly each day. Choose one ordinary duty to carry out more faithfully as someone who belongs to Christ.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Keep the permanent character distinct from the grace that can be neglected or lost through sin. Never decide doubtful sacramental history yourself. The parish checks records and the priest handles genuine uncertainty according to Church law.</p>\n<h2>The Effects of Confirmation</h2>\n<h3>AIM</h3>\n<p>Make the sacrament’s deepening of baptismal grace and strength for witness concrete.</p>\n<h3>QUICK PREP</h3>\n<p>Five headings: FATHER, CHRIST, GIFTS, CHURCH, WITNESS.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What sort of strength would help you be a more faithful Catholic in an ordinary week?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Grace for relationships and mission</strong></p>\n<ol><li>Write the headings. Under FATHER, place DEEPER SONSHIP; under CHRIST, CLOSER UNION; under GIFTS, INCREASED GIFTS OF THE SPIRIT.</li><li>Under CHURCH, place A MORE PERFECT BOND; under WITNESS, STRENGTH TO SPREAD AND DEFEND THE FAITH. Read the matching explanation in the book.</li><li>Choose a situation: keeping a difficult promise, refusing dishonesty or explaining Catholic faith courteously. Ask which effects of Confirmation help here.</li><li>Name one area where the candidate tends to hide faith. Choose a truthful, charitable action that asks for grace and respects the person being addressed.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 7. Keep God’s gift, communion with the Church and ordinary Christian witness together.</p>\n<details class=\"conv\"><summary>Open Conversation 7 &mdash; The Effects of Confirmation</summary><div class=\"conv-body\"><p>REMEMBER Confirmation pours out the Holy Spirit, deepens baptismal grace and gives special strength to witness to Christ.</p>\n<p>Confirmation roots us more deeply as children of the Father, unites us more firmly to Christ, increases the gifts of the Holy Spirit and makes our bond with the Church more perfect.</p>\n<p>It gives a special strength of the Holy Spirit to spread and defend the faith by word and action, to confess Christ boldly and never be ashamed of the Cross. Christian courage is governed by charity, not aggression.</p>\n<p>This grace is not limited to dramatic moments. It is meant for ordinary adult fidelity: keeping promises, speaking truth, resisting temptation, practising the faith openly, serving the vulnerable and carrying Christian hope into places where God has already put you.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What would &quot;strength to witness&quot; look like in your ordinary week rather than in an exceptional or dramatic situation?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What is the chief effect of Confirmation?</li></ol>\n<p>A special outpouring of the Holy Spirit, as at Pentecost.</p>\n<ol><li>How does it deepen our relationship with God?</li></ol>\n<p>It roots us more deeply as children of the Father and unites us more firmly to Christ.</p>\n<ol><li>How does it affect our bond with the Church?</li></ol>\n<p>It binds us more perfectly to the Church and her mission.</p>\n<ol><li>What strength does it give?</li></ol>\n<p>Strength to spread and defend the faith by word and deed.</p>\n<ol><li>What governs Christian witness?</li></ol>\n<p>Truth and courage governed by charity.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, deepen every grace of my Baptism. Make me a courageous, gentle and faithful witness of Jesus Christ. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Identify one place where you tend to hide or dilute your faith. Decide on one truthful and charitable way to live it more openly.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 10</p></div></details>\n<h2>The Effects of Confirmation</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is Christian courage different from aggression?”</li><li>“How can greater union with Christ become visible in ordinary duties?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is the chief effect? A special outpouring of the Holy Spirit, as at Pentecost. What happens to baptismal grace? It is deepened and strengthened. What special strength is given? Strength to spread and defend the faith by word and deed.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, deepen the grace of my Baptism. Unite me more firmly to Christ and his Church and make me a courageous, charitable witness in ordinary life. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one of the five headings. Ask for that grace each morning and practise one concrete act of faithful witness.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Ask for real examples, not impressive claims. Confirmation is more than a motivation exercise, but grace calls for cooperation. Encourage courage governed by charity; do not praise harshness, contempt or the desire to win arguments.</p>\n<h2>The Seven Gifts of the Holy Spirit</h2>\n<h3>AIM</h3>\n<p>Use the seven gifts to bring a real adult decision before God.</p>\n<h3>QUICK PREP</h3>\n<p>The gifts page at the end of this guide; paper and a pen, optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What decision or responsibility most needs the Holy Spirit’s help at present?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A decision in the light of the gifts</strong></p>\n<ol><li>Read the seven names and brief meanings on the gifts page: wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</li><li>Choose an ordinary case: pressure to approve a dishonest claim at work. Ask what is true and right, which counsel to seek and what courage is needed.</li><li>Choose one real responsibility without disclosing private sins. Select a gift particularly needed and explain how it could help the person respond to God.</li><li>Pray for that gift. Name one next step involving thought, sound advice and faithful action; the gifts do not replace competence or effort.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 8 and Appendix C. Use the short meanings here to begin; the book supplies the fuller teaching.</p>\n<details class=\"conv\"><summary>Open Conversation 8 &mdash; The Seven Gifts of the Holy Spirit</summary><div class=\"conv-body\"><p>REMEMBER The seven gifts are lasting dispositions that make us docile and ready to follow the promptings of the Holy Spirit.</p>\n<p>The seven gifts are wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord. They are found in their fullness in Jesus Christ.</p>\n<p>The gifts do not replace thought, study, prudence, professional competence or personal effort. They perfect the virtues and make us responsive when the Holy Spirit moves us.</p>\n<p>Adults often need the gifts in complex choices: family responsibilities, work, money, health, vocation, moral pressure and service. Fear of the Lord is not terror; it is reverent awe and a loving desire not to offend God.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Which gift of the Holy Spirit do you most need in a real decision or responsibility you are carrying now, and why?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What are the seven gifts?</li></ol>\n<p>Wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</p>\n<ol><li>What do the gifts make us ready to do?</li></ol>\n<p>To follow the promptings of the Holy Spirit.</p>\n<ol><li>Which gift helps us judge life in the light of God?</li></ol>\n<p>Wisdom.</p>\n<ol><li>Which gift gives courage in difficulty?</li></ol>\n<p>Fortitude.</p>\n<ol><li>What is fear of the Lord?</li></ol>\n<p>Reverent awe of God and a loving desire not to offend him.</p>\n<h4>PRAYER</h4>\n<p>Spirit of wisdom and understanding, counsel and fortitude, knowledge, piety and holy fear, make me docile to your grace. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one gift you particularly need. Ask for it each morning this week and make one decision in its light.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 11</p></div></details>\n<h2>The Seven Gifts of the Holy Spirit</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why is fear of the Lord a loving reverence rather than terror?”</li><li>“How can a gift of the Spirit perfect an adult’s practical judgement?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What do the gifts make us ready for? Following the promptings of the Holy Spirit. Which gift gives steadfast courage? Fortitude. What is fear of the Lord? Reverent awe and a loving desire not to offend God.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Spirit of wisdom and understanding, counsel and fortitude, knowledge, piety and holy fear, make me attentive to your grace and ready to do what is right. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one gift you particularly need. Ask for it each morning and take the practical step agreed in the conversation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Allow the candidate to think aloud. Do not treat every strong impulse as divine guidance. A proposed inspiration must be consistent with faith and moral truth. Refer serious moral or vocational discernment to the priest or suitable guidance.</p>\n<h2>Virtues Fruits and Charisms</h2>\n<h3>AIM</h3>\n<p>Distinguish growth in holy character from gifts given for service.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: VIRTUES, FRUITS, CHARISMS; the summary page here.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would someone close to you notice if you were cooperating more faithfully with the Holy Spirit?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Holiness that becomes visible</strong></p>\n<ol><li>Read the summary page. Under VIRTUES, name faith, hope and charity, and prudence, justice, fortitude and temperance: stable habits of good action.</li><li>Under FRUITS, read the twelve names. Choose patience, faithfulness or self-control and name conduct that would make it visible at home or work.</li><li>Under CHARISMS, write GIFTS FOR SERVICE. Discuss teaching, practical help or encouragement as possible ways to build up the Church, under her discernment.</li><li>Use this case: someone speaks impressively about spiritual experiences but treats others unkindly. Ask why experiences or striking gifts do not prove holiness.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 9 and Appendix C. Keep virtue, the Spirit’s fruits and gifts for service distinct but connected.</p>\n<details class=\"conv\"><summary>Open Conversation 9 &mdash; Virtues, Fruits and Charisms</summary><div class=\"conv-body\"><p>REMEMBER The Spirit perfects the virtues, forms holy fruits in us and gives charisms for the service and building up of the Church.</p>\n<p>The theological virtues are faith, hope and charity. The cardinal virtues are prudence, justice, fortitude and temperance. Grace does not bypass character; it heals, elevates and strengthens us to live the good consistently.</p>\n<p>The fruits of the Spirit are signs of a life being transformed: charity, joy, peace, patience, kindness, goodness, generosity, gentleness, faithfulness, modesty, self-control and chastity.</p>\n<p>Charisms are gifts for serving others and building up the Church. Some are striking and some ordinary. They are not badges of spiritual superiority. Holiness and charity matter more than display, and charisms are discerned within the Church.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Are you more interested in spiritual experiences or in becoming holy? How would someone close to you recognise the fruits of the Spirit in your life?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>What are the theological virtues?</li></ol>\n<p>Faith, hope and charity.</p>\n<ol><li>What are the cardinal virtues?</li></ol>\n<p>Prudence, justice, fortitude and temperance.</p>\n<ol><li>What are the fruits of the Spirit?</li></ol>\n<p>Perfections formed in us by the Spirit as we cooperate with grace.</p>\n<ol><li>What are charisms?</li></ol>\n<p>Gifts of grace given for the service and building up of the Church.</p>\n<ol><li>How should charisms be used?</li></ol>\n<p>Humbly, in charity and under the discernment of the Church.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, increase faith, hope and charity in me. Let your fruits be visible in my conduct and use every gift for the good of others. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Choose one fruit of the Spirit and practise one concrete act that expresses it at home, work or in the parish.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 12</p></div></details>\n<h2>Virtues Fruits and Charisms</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Which fruit of the Spirit needs to grow in your relationships?”</li><li>“How could an ability be used humbly for the good of others?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What are the theological virtues? Faith, hope and charity. What are the cardinal virtues? Prudence, justice, fortitude and temperance. What are charisms for? Service and the building up of the Church in charity.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, increase faith, hope and charity in me. Form your fruits in my conduct and help me use every gift humbly for the good of others. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Choose one fruit from the printed list. Practise one specific act that expresses it and thank God for the opportunity to serve.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Do not promise a particular charism or require speaking in tongues or another striking experience. Ordinary fidelity and charity matter. Encourage service within the Church’s discernment rather than declaring someone’s special spiritual status.</p>\n<h2>Renewing the Promises of Baptism</h2>\n<h3>AIM</h3>\n<p>Connect a sincere profession of Catholic faith with repentance and adult discipleship.</p>\n<h3>QUICK PREP</h3>\n<p>The Apostles’ Creed printed here; two headings: RENOUNCE and BELIEVE.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What will you mean when you personally answer ‘I do’ at the renewal of baptismal promises?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A profession that shapes life</strong></p>\n<ol><li>Under RENOUNCE, name Satan and sin. Explain that rejecting evil involves a genuine intention to turn away from it with God’s help.</li><li>Under BELIEVE, read the printed Creed slowly. Choose one familiar article and one that needs explanation, then open the preparation book.</li><li>Connect belief with life: God’s fatherhood with prayer, Christ’s saving work with repentance, the Church with worship and belonging, eternal life with hope.</li><li>Name one area of adult life that should become more consistent with faith: truthfulness, relationships, chastity, work, money, justice or forgiveness.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 10. The Creed here is for learning and prayer; the approved rite supplies the actual baptismal questions.</p>\n<details class=\"conv\"><summary>Open Conversation 10 &mdash; Renewing the Promises of Baptism</summary><div class=\"conv-body\"><p>REMEMBER Before Confirmation, candidates renounce Satan and profess the faith of the Church into which they were baptised.</p>\n<p>The renewal of baptismal promises shows that Confirmation follows Baptism. You reject sin and Satan and profess faith in the Father, the Son, the Holy Spirit and the holy Catholic Church.</p>\n<p>This is not inventing a private version of Christianity. It is a personal profession of the apostolic faith received from the Church and a renewed acceptance of the duties that flow from Baptism.</p>\n<p>An adult &quot;I do&quot; has consequences. The Creed shapes worship, conscience, sexuality, relationships, money, work, justice, forgiveness and public conduct. Where Church teaching is difficult, discipleship means seeking understanding and asking for the grace to obey rather than quietly rewriting the faith.</p>\n<h4>TALK ABOUT IT</h4>\n<p>When you answer &quot;I do&quot; to the Catholic faith, which part of your life most needs to become more consistent with that profession?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Why are baptismal promises renewed?</li></ol>\n<p>To show that Confirmation follows Baptism and strengthens its grace.</p>\n<ol><li>What do you renounce?</li></ol>\n<p>Satan, sin and everything opposed to God.</p>\n<ol><li>What faith do you profess?</li></ol>\n<p>The one apostolic faith of the Catholic Church.</p>\n<ol><li>Is faith only a set of words?</li></ol>\n<p>No. Faith entrusts the whole person to God and shapes life.</p>\n<ol><li>How do we live our baptismal promises?</li></ol>\n<p>By worship, obedience, repentance, prayer, virtue and charity.</p>\n<h4>PRAYER</h4>\n<p>O God, strengthen the faith given to me in Baptism. Help me reject sin, profess the Creed sincerely and live as your faithful child. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Read the Apostles&#x27; Creed slowly. Mark one article you understand well and one you want to study more deeply.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 13</p></div></details>\n<h2>Renewing the Promises of Baptism</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why does renewing the promises follow from Baptism already received?”</li><li>“What should you do when a Catholic teaching is difficult to understand?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>What is renounced? Satan, sin and everything opposed to God. What faith is professed? The apostolic faith of the Catholic Church. How should faith shape life? Through worship, repentance, obedience, prayer and charity.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>O God, strengthen the faith you gave me in Baptism. Help me reject sin, profess the Church’s faith sincerely and live as your faithful child. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Pray the printed Creed slowly. Bring one article or moral teaching you need help understanding, and practise one action consistent with your profession.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Welcome a question seeking understanding and address a known difficulty honestly. Do not encourage an insincere answer or a private rewriting of the faith. Personal circumstances and serious unresolved concerns should be discussed with the priest.</p>\n<h2>Witness Vocation and Spiritual Combat</h2>\n<h3>AIM</h3>\n<p>Place Christian mission and resistance to sin within the adult’s present vocation.</p>\n<h3>QUICK PREP</h3>\n<p>Three headings: MY DUTIES, TEMPTATIONS, HELPS. A crucifix is optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “Where has God already placed you to be a witness, and what duty there needs greater fidelity?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>A vocation lived faithfully</strong></p>\n<ol><li>Under MY DUTIES, name responsibilities in family, work, parish, citizenship or care. Choose one where fidelity itself bears witness to Christ.</li><li>Under TEMPTATIONS, use an invented example: gossip, dishonest advantage or resentment. The struggle is against sin and the devil’s temptations; other people are not enemies to hate.</li><li>Under HELPS, write prayer, Scripture, sacraments, truth, virtue, penance and works of mercy. Choose a help that addresses the example.</li><li>Plan one quiet work of mercy: help someone in need, visit someone lonely, forgive a wrong or pray for someone. Keep existing duties and charity together.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 11. Mission begins in faithful discipleship and shares in the Church’s apostolate.</p>\n<details class=\"conv\"><summary>Open Conversation 11 &mdash; Witness, Vocation and Spiritual Combat</summary><div class=\"conv-body\"><p>REMEMBER The confirmed are strengthened as witnesses of Christ, resisting sin with truth, grace and charity and serving the Church in their vocation.</p>\n<p>Traditional catechesis speaks of spiritual combat. Other people are not the enemy. The struggle is against sin, temptation, the fallen world insofar as it rejects God, and the devil who tempts and accuses.</p>\n<p>Our weapons are spiritual: faith, prayer, Scripture, the sacraments, truth, virtue, penance and works of mercy. We defend the faith without cruelty, pride or contempt for those who disagree.</p>\n<p>Mission is not an extra hobby. Confirmation strengthens you to live your vocation as a Christian in marriage or single life, family, work, citizenship, parish, service and, for some, ordained or consecrated life. Mission usually begins with fidelity to ordinary duties.</p>\n<h4>TALK ABOUT IT</h4>\n<p>Where has God already placed you to be a witness - and what ordinary duty there might be part of your mission?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Why speak of spiritual combat?</li></ol>\n<p>Because Christians must resist sin and temptation and remain steadfast in Christ.</p>\n<ol><li>Who is not the enemy?</li></ol>\n<p>Other people are never enemies to be hated.</p>\n<ol><li>How do Christians defend the faith?</li></ol>\n<p>By truthful words, holy conduct, patient reason and charity.</p>\n<ol><li>What is the apostolate?</li></ol>\n<p>The work by which Christians share in the Church&#x27;s mission.</p>\n<ol><li>Where does mission usually begin?</li></ol>\n<p>In prayer, vocation, family, parish, work, citizenship and service.</p>\n<h4>PRAYER</h4>\n<p>Holy Spirit, make me steadfast against sin, humble in truth and generous in the service of souls. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Perform one work of mercy quietly. Also ask: &quot;Where is my present vocation asking for greater fidelity?&quot;</p>\n<p>PREPARING FOR ADULT CONFIRMATION 14</p></div></details>\n<h2>Witness Vocation and Spiritual Combat</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“How can you defend the faith without contempt for someone who disagrees?”</li><li>“What ordinary duty is part of your present mission?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>Why speak of spiritual combat? We must resist sin and temptation and remain steadfast in Christ. Who is not the enemy? Other people are never enemies to be hated. What is the apostolate? Sharing in the Church’s mission.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Holy Spirit, make me steadfast against sin, humble in truth and generous in service. Help me fulfil my vocation and love the people you have entrusted to me. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Perform one work of mercy quietly. Ask where your present vocation calls for greater fidelity and take one practical step.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Keep spiritual combat sober and centred on Christ. Do not encourage suspicion about particular people or sensational explanations of ordinary difficulties. Discuss temptations through invented cases; private sins belong in Confession, not the mentor meeting.</p>\n<h2>Preparing Receiving and Persevering</h2>\n<h3>AIM</h3>\n<p>Bring instruction, sincere intention, proper disposition and practical arrangements together.</p>\n<h3>QUICK PREP</h3>\n<p>Appendices B, E, G and H; a diary or paper, optional.</p>\n<h3>BEGIN WITH THE PERSON</h3>\n<p>Ask: “What would help you receive Confirmation peacefully and live its grace six months afterwards?”</p>\n<h3>DO SOMETHING</h3>\n<p><strong>Before the day and after the day</strong></p>\n<ol><li>Under BEFORE, check preparation, free intention, Sunday Mass, prayer, sponsor support and an opportunity for Confession. Private sins are not discussed here.</li><li>Use Appendix B to walk through the rite in words. Practise responses and movements only, following parish direction; do not imitate sacramental actions.</li><li>Under AFTER, plan Sunday Mass, daily prayer, regular Confession and one suitable form of service. Choose a small pattern that can be kept.</li><li>Agree a further meeting after Confirmation. Name one remaining question for the priest and confirm the practical arrangements with the parish.</li></ol>\n<h3>NOW OPEN THE PREPARATION BOOK</h3>\n<p>Read Conversation 12 and Appendices B, E, G and H. Readiness is discerned with the priest, not certified by completing these pages.</p>\n<details class=\"conv\"><summary>Open Conversation 12 &mdash; Preparing, Receiving and Persevering</summary><div class=\"conv-body\"><p>REMEMBER A candidate prepares by instruction, prayer, sincere intention and the state of grace, then lives the sacrament through persevering discipleship.</p>\n<p>Every baptised person not yet confirmed is capable of receiving Confirmation. Outside danger of death, a person with the use of reason should be suitably instructed, properly disposed and able to renew the baptismal promises.</p>\n<p>Confirmation should be received in the state of grace. Prepare for sacramental Confession, participate faithfully at Sunday Mass, pray more deliberately, practise charity and attend any parish rehearsal or meeting.</p>\n<p>After Confirmation, give thanks and persevere. The sacrament is not the end of formation. Keep Sunday Mass, Confession, prayer, Scripture, parish communion, study and service as normal parts of adult Catholic life.</p>\n<h4>TALK ABOUT IT</h4>\n<p>What would make it clear six months after Confirmation that the sacrament had become a source of lifelong discipleship rather than a one-day event?</p>\n<h4>THE ESSENTIALS</h4>\n<ol><li>Who can receive Confirmation?</li></ol>\n<p>Every baptised person who has not already been confirmed.</p>\n<ol><li>How should an adult candidate prepare?</li></ol>\n<p>By suitable instruction, sincere intention, prayer, good works and proper disposition.</p>\n<ol><li>In what state should Confirmation be received?</li></ol>\n<p>In the state of grace.</p>\n<ol><li>What sacrament should be received beforehand when needed?</li></ol>\n<p>The Sacrament of Penance.</p>\n<ol><li>How do the confirmed persevere?</li></ol>\n<p>By Mass, Confession, prayer, Scripture, virtue, parish communion and service.</p>\n<h4>PRAYER</h4>\n<p>Lord, complete the good work you have begun in me. Make me ready to receive your Spirit and faithful in every duty that follows. Amen.</p>\n<h4>THIS WEEK</h4>\n<p>Arrange Confession, confirm practical details with the parish, and write a simple plan for Sunday Mass, daily prayer and one regular form of service after Confirmation.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 15</p>\n<h4>APPENDIX A</h4>\n<p>Before the parish books the Confirmation</p>\n<p>Adult Confirmation begins with a simple pastoral check. It prevents the wrong pathway being used and gives the parish time to resolve practical questions without pressure near the celebration.</p>\n<p>Check What the parish establishes</p>\n<p>You are a baptised Catholic and have not already been confirmed. The Baptism parish checks the baptismal record where possible.</p>\n<p>If you have never received First Holy Communion, tell the priest. Your First Eucharist preparation may need to include completion of Christian initiation rather than Confirmation alone.</p>\n<p>If you were baptised in another Christian community and have never Catholic status been received into the Catholic Church, use the Reception into Full Communion pathway instead.</p>\n<p>If you were baptised in an Eastern Catholic Church, do not assume Eastern Catholic you are unconfirmed; Chrismation is normally given with Baptism. The priest should check your record and Church of enrolment.</p>\n<p>If there is a marriage, cohabitation or other sacramental situation that Marriage / life may affect proper disposition, discuss it privately with the priest. The situation aim is truthful pastoral care, not public scrutiny.</p>\n<p>You personally wish to receive Confirmation. Family expectation, Intention wedding plans or convenience should not substitute for a sincere intention.</p>\n<p>The bishop is the ordinary minister. If a priest is to confirm an already- Minister and date Catholic adult, the parish ensures that he has the required faculty.</p>\n<h4>KEEP THIS DISTINCTION CLEAR</h4>\n<p>Adult Confirmation is for an already-Catholic adult who lacks Confirmation. It is not the catechumenate and it is not reception into the Catholic Church.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 16</p>\n<h4>APPENDIX B</h4>\n<p>The Rite of Confirmation: step by step</p>\n<p>Confirmation is normally celebrated in church and during Mass. The approved liturgical book and the directions of the bishop or other minister govern the celebration. This outline helps you participate confidently without trying to memorise the whole rite.</p>\n<p>Moment What happens How I take part</p>\n<p>Candidates are presented to the bishop Stand attentively and Presentation or other minister. respond if asked.</p>\n<p>Listen for Baptism, the The minister explains the mystery and Homily Holy Spirit, witness and duties of Confirmation. mission.</p>\n<p>Renewal of Candidates renounce Satan and profess Answer sincerely and baptismal the Catholic faith. clearly. promises</p>\n<p>Prayer and The minister invokes the Holy Spirit and Pray inwardly for the Holy laying on of his sevenfold gift. Spirit and his gifts. hands</p>\n<p>Approach calmly; follow Anointing with The minister anoints your forehead with local direction about your chrism sacred chrism. sponsor.</p>\n<p>Sacramental The minister says: &quot;N., be sealed with the Answer: &quot;Amen.&quot; words Gift of the Holy Spirit.&quot;</p>\n<p>Answer as directed by the Sign of peace The minister gives the sign of peace. rite.</p>\n<p>Receive Holy Communion Mass continues and the newly confirmed Eucharist if properly disposed and join the Church in thanksgiving. give thanks.</p>\n<h4>THE ESSENTIAL ACT</h4>\n<p>The anointing of the forehead with sacred chrism, done by the laying on of the minister&#x27;s hand, with the sacramental words prescribed by the Church.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 17</p>\n<h4>APPENDIX C</h4>\n<p>The gifts and fruits at a glance</p>\n<p>Gift What it forms Adult discernment question</p>\n<p>What choice leads me closer Wisdom Judges life in the light of God. to God?</p>\n<p>Penetrates more deeply into the truths What truth of faith should I Understanding of faith. study more carefully?</p>\n<p>Helps practical judgement under the What is the right action here, Counsel Spirit&#x27;s guidance. and whom should I ask?</p>\n<p>Gives steadfast courage to do and What good am I avoiding Fortitude endure what is right. because it is difficult?</p>\n<p>Sees created things truthfully and Am I using people and things Knowledge orders them to God. according to God&#x27;s purpose?</p>\n<p>Forms filial love for God and reverence How can I pray and serve Piety for his family. with a childlike heart?</p>\n<p>Do I honour God above Fear of the Fills us with awe and loving sorrow at approval, comfort or Lord offending God. success?</p>\n<p>The twelve traditional fruits</p>\n<p>Charity: loving God above all Faithfulness: reliability and Kindness: a ready desire to and neighbour for God&#x27;s constancy towards God and do good. sake. others.</p>\n<p>Goodness: moral Modesty: dignified restraint Joy: spiritual gladness in uprightness expressed in in appearance, speech and God and his goodness. generous action. conduct.</p>\n<p>Self-control: government of Peace: the tranquillity of Generosity: large-hearted desires according to reason rightly ordered love. readiness to give and serve. and grace.</p>\n<p>Gentleness: strength Chastity: integration of Patience: enduring difficulty governed by humility and sexuality within one&#x27;s state of without abandoning charity. charity. life and vocation.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 18</p>\n<h4>APPENDIX D</h4>\n<p>Choosing a sponsor and, where customary, a saint</p>\n<p>As far as possible, a candidate has a sponsor. The sponsor presents the candidate and afterwards helps the newly confirmed live as a true witness of Christ. It is desirable, though not required, to choose a baptismal godparent when that person is suitable.</p>\n<p>Requirement What it means</p>\n<p>Catholic initiation A Catholic who has been confirmed and has received the Holy Eucharist.</p>\n<p>Life of faith Leads a life in harmony with the Catholic faith and the responsibility undertaken.</p>\n<p>Age Ordinarily at least sixteen, unless lawful local provision or a just exception applies.</p>\n<p>Canonical freedom Not bound by a canonical penalty.</p>\n<p>Relationship Not your father or mother.</p>\n<p>Intention Genuinely intends to help you live faithfully after Confirmation.</p>\n<p>A Confirmation name</p>\n<p>The sacrament does not require a new name. Where local custom permits or encourages a saint&#x27;s name, choose a canonised or beatified saint because that person leads you towards Christ. Your baptismal identity remains primary.</p>\n<h4>GOOD DISCERNMENT</h4>\n<p>Choose a sponsor for Christian witness, not social importance. Choose a saint for imitation and intercession, not decoration. Follow parish directions about names and the rite.</p>\n<p>My sponsor and why I chose this person: __________________________________________________________</p>\n<p>My saint or baptismal patron: __________________________________________________________</p>\n<p>The virtue I hope to imitate: __________________________________________________________</p>\n<p>PREPARING FOR ADULT CONFIRMATION 19</p>\n<h4>APPENDIX E</h4>\n<p>Preparing for Confession before Confirmation</p>\n<p>Confirmation should be received in the state of grace. If you are conscious of grave sin, receive sacramental Confession before Confirmation. Even when there is no grave sin, Confession is an excellent preparation because it disposes the heart to receive the sacrament fruitfully.</p>\n<h4>KEEP THE FORUM PRIVATE</h4>\n<p>Your preparation conversations are not Confession. You do not need to disclose private sins to a catechist, sponsor or group. Bring sins to the priest in the Sacrament of Penance.</p>\n<p>A peaceful examination of conscience</p>\n<p>God and worship: Have I deliberately neglected Sunday Mass or serious duties of faith? Have I prayed, trusted God and treated holy things reverently?</p>\n<p>Truth and relationships: Have I lied seriously, betrayed confidence, damaged reputations, manipulated others, refused forgiveness or nourished hatred?</p>\n<p>Chastity and fidelity: Have I used sexuality, pornography, relationships or another person in ways contrary to chastity and my state of life?</p>\n<p>Justice and possessions: Have I stolen, cheated, exploited, failed in responsibilities, misused money or ignored serious obligations to family or others?</p>\n<p>Life and dignity: Have I treated my own life or another person&#x27;s life, body or dignity carelessly or unjustly?</p>\n<p>Temperance and freedom: Have alcohol, drugs, gambling, anger, digital habits or other appetites become sinful or controlling?</p>\n<p>Charity and mission: Have I ignored someone I could reasonably help, hidden my faith through cowardice, or failed to repair harm I caused?</p>\n<p>Do not hunt anxiously for imaginary sins. Mortal sin requires grave matter, sufficient knowledge and deliberate consent. If you are unsure, ask the priest simply and honestly.</p>\n<p>IF YOU HAVE BEEN AWAY FROM CONFESSION FOR YEARS</p>\n<p>Say so at the beginning. The priest will help you. You do not need to perform the sacrament perfectly from memory; you need honesty, contrition and a sincere purpose of amendment.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 20</p>\n<h4>APPENDIX F</h4>\n<p>The essentials: 30 concise answers</p>\n<ol><li>Who is the Holy Spirit?</li></ol>\n<p>The third Person of the Blessed Trinity, true God with the Father and the Son.</p>\n<ol><li>What happened at Pentecost?</li></ol>\n<p>The Holy Spirit descended upon the Apostles and strengthened them to proclaim Christ.</p>\n<ol><li>Which are the sacraments of Christian initiation?</li></ol>\n<p>Baptism, Confirmation and the Holy Eucharist.</p>\n<ol><li>What does Confirmation do to baptismal grace?</li></ol>\n<p>It completes and strengthens baptismal grace.</p>\n<ol><li>Who instituted Confirmation?</li></ol>\n<p>Jesus Christ.</p>\n<ol><li>Where is the apostolic pattern shown?</li></ol>\n<p>Especially Acts 8:14-17 and Acts 19:5-6.</p>\n<ol><li>Who is the ordinary minister?</li></ol>\n<p>The bishop.</p>\n<ol><li>May a priest confirm?</li></ol>\n<p>Yes, when the law or competent authority gives him the faculty.</p>\n<ol><li>What is sacred chrism?</li></ol>\n<p>Perfumed oil consecrated by a bishop.</p>\n<ol><li>What is the essential rite?</li></ol>\n<p>Anointing the forehead with chrism by the laying on of the minister&#x27;s hand and the sacramental words.</p>\n<ol><li>What words are used?</li></ol>\n<p>&quot;N., be sealed with the Gift of the Holy Spirit.&quot;</p>\n<ol><li>What does the candidate answer?</li></ol>\n<p>&quot;Amen.&quot;</p>\n<ol><li>What is the chief effect?</li></ol>\n<p>A special outpouring of the Holy Spirit, as at Pentecost.</p>\n<ol><li>How does Confirmation deepen baptismal grace?</li></ol>\n<p>It roots us more deeply in divine filiation, unites us more firmly to Christ and increases the gifts of the Holy Spirit.</p>\n<ol><li>How does it unite us to the Church?</li></ol>\n<p>It makes our bond with the Church more perfect and strengthens us for her mission.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 21</p>\n<h4>APPENDIX F - CONTINUED</h4>\n<p>The essentials: 30 concise answers</p>\n<ol><li>What special strength does Confirmation give?</li></ol>\n<p>Strength to spread and defend the faith by word and deed as a witness of Christ.</p>\n<ol><li>What is the spiritual character?</li></ol>\n<p>The permanent sacramental seal by which Christ marks the confirmed with his Spirit.</p>\n<ol><li>Can Confirmation be repeated?</li></ol>\n<p>No.</p>\n<ol><li>What are the seven gifts?</li></ol>\n<p>Wisdom, understanding, counsel, fortitude, knowledge, piety and fear of the Lord.</p>\n<ol><li>What do the gifts make us ready to do?</li></ol>\n<p>Follow the promptings of the Holy Spirit.</p>\n<ol><li>What are the theological virtues?</li></ol>\n<p>Faith, hope and charity.</p>\n<ol><li>What are the cardinal virtues?</li></ol>\n<p>Prudence, justice, fortitude and temperance.</p>\n<ol><li>What are the fruits of the Spirit?</li></ol>\n<p>Perfections formed in us by the Spirit as we cooperate with grace.</p>\n<ol><li>What are charisms?</li></ol>\n<p>Gifts of grace for service and the building up of the Church.</p>\n<ol><li>Why are baptismal promises renewed?</li></ol>\n<p>To show that Confirmation follows Baptism and strengthens its grace.</p>\n<ol><li>Who can receive Confirmation?</li></ol>\n<p>Every baptised person who has not already been confirmed.</p>\n<ol><li>How should an adult prepare?</li></ol>\n<p>By suitable instruction, sincere intention, prayer, good works and proper disposition.</p>\n<ol><li>In what state should Confirmation be received?</li></ol>\n<p>In the state of grace.</p>\n<ol><li>What is the sponsor&#x27;s duty?</li></ol>\n<p>To help the confirmed live as a true witness and fulfil the obligations of the sacrament.</p>\n<ol><li>How should the newly confirmed persevere?</li></ol>\n<p>By Mass, Confession, prayer, Scripture, virtue, parish communion and service.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 22</p>\n<h4>APPENDIX G</h4>\n<p>Readiness conversation</p>\n<p>This is not a pass/fail examination. The Church asks for suitable instruction, proper disposition, the ability to renew baptismal promises and a sincere intention. Readiness is shown by enough understanding to receive the sacrament faithfully and by a real willingness to live as a Catholic disciple and witness.</p>\n<p>Area Readiness looks like Do not require</p>\n<p>Can profess the Creed and explain simply who the Perfect theological Catholic faith Holy Spirit is and what Confirmation gives. vocabulary.</p>\n<p>Knows the relation of Baptism, Confirmation and Sacramental A theology Eucharist; knows the minister, chrism, sacramental understanding examination. words, effects and character.</p>\n<p>Pressure because Freely intends to receive Confirmation and can Intention family or a wedding renew baptismal promises sincerely. expects it.</p>\n<p>Has examined conscience and has a practical Public discussion State of grace opportunity for Confession before the sacrament. of private sins.</p>\n<p>Sunday Participates at Sunday Mass and is developing A dramatic spiritual worship and sustainable personal prayer. story. prayer</p>\n<p>Adult Catholic Understands that faith shapes relationships, A claim to be life chastity, work, justice, mercy, truth and service. perfect.</p>\n<p>Has a suitable sponsor where possible, or the A socially Sponsor parish has considered what is reasonably possible. impressive choice.</p>\n<p>Memorising every Practical Knows the basic rite and local arrangements. word of the preparation ceremony.</p>\n<h4>PASTORAL PRINCIPLE</h4>\n<p>Questions, disability, anxiety, family complexity or periods away from practice should be handled discreetly and pastorally. No adult should be shamed, manipulated or required to disclose private sins outside Confession.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 23</p>\n<h4>APPENDIX H</h4>\n<p>A simple rule of life after Confirmation</p>\n<p>The sacrament is a permanent source of strength, not a one-day event. Choose a rule of life simple enough to keep and serious enough to shape you.</p>\n<p>Rhythm Simple practice</p>\n<p>Morning offering; a short passage of Scripture; prayer to the Holy Daily Spirit; brief examination of conscience at night.</p>\n<p>Sunday Mass; deliberate time for prayer; one concrete act of charity or Weekly service.</p>\n<p>Sacramental Confession; Eucharistic adoration or a visit to the Blessed Regularly Sacrament; sound Catholic study.</p>\n<p>Ask what is true, good and loving; seek counsel; reject occasions of In decisions sin; choose the duties of your vocation.</p>\n<p>Practise forgiveness, truthfulness, chastity, patience and concrete In relationships service.</p>\n<p>Remain recognisably part of the worshipping community and find a In the parish suitable form of service.</p>\n<p>Be willing to explain your faith simply, invite others, defend truth In mission charitably and serve those in need.</p>\n<p>Repent quickly. Return to Confession, prayer and the duties of your When you fail state rather than drifting away.</p>\n<p>Prayers to keep</p>\n<h4>COME, HOLY SPIRIT</h4>\n<p>Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love. Send forth your Spirit and they shall be created, and you shall renew the face of the earth. Amen.</p>\n<h4>AFTER CONFIRMATION</h4>\n<p>Father, I thank you for the Gift of the Holy Spirit. Keep me united to Christ and his Church. Make my whole life a faithful witness in word, deed, prayer and service. Amen.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 24</p>\n<h4>APPENDIX I</h4>\n<p>Special situations and parish notes</p>\n<p>Unsure whether I was confirmed Do not repeat Confirmation on your own assumption. The parish checks records and, where necessary, handles doubt according to Church law.</p>\n<p>Baptised outside the Catholic Church If you have never been received into full communion, the correct route is the Reception into Full Communion pathway, not ordinary Adult Confirmation.</p>\n<p>Unbaptised The correct route is the RCIA / catechumenate, leading ordinarily to Baptism, Confirmation and Eucharist together.</p>\n<p>Eastern Catholic Baptism Eastern Catholic infants are normally chrismated with Baptism. The priest checks your sacramental record and Church of enrolment before assuming Confirmation is missing.</p>\n<p>Never received First Holy Communion Tell the priest at the beginning so Christian initiation can be completed coherently.</p>\n<p>Marriage or other sacramental difficulty Speak privately with the priest early. Proper disposition matters, but questions should be handled pastorally and without public embarrassment.</p>\n<p>Danger of death Any priest can confirm a baptised unconfirmed person in danger of death.</p>\n<p>Disability or additional needs Adaptation is normal pastoral care. Disability, learning difference or anxiety does not by itself prevent reception.</p>\n<p>Sources and doctrinal standard</p>\n<p>Sacred Scripture: Isaiah 11:1-3; Acts 1-2; Acts 8:14-17; Acts 19:5-6; John 14-16; Romans 8; 1 Corinthians 12; Galatians 5.</p>\n<p>Catechism of the Catholic Church: nos. 683-747 on the Holy Spirit; 1285-1321 on Confirmation; 1691-1698 on life in Christ; 1803-1845 on virtues, gifts and fruits.</p>\n<p>Code of Canon Law: canons 879-896 on Confirmation and canons 872-874 as referenced for sponsor requirements.</p>\n<p>Order of Confirmation: the approved Roman Rite currently in force for England and Wales.</p>\n<p>Parish Confirmation policy and the existing Confirmation Catechism, adapted here for adult Catholic candidates.</p>\n<p>Current diocesan policy and the directions of the parish priest and confirming minister govern local dates, faculties, records and particular pastoral cases.</p>\n<h4>DOCTRINAL STANDARD</h4>\n<p>This booklet is a concise adult preparation companion. It does not replace Sunday Mass, sacramental Confession, personal prayer, parish communion or the pastoral judgement of those responsible for the sacrament.</p>\n<p>PREPARING FOR ADULT CONFIRMATION 25</p></div></details>\n<h2>Preparing Receiving and Persevering</h2>\n<h3>TALK TOGETHER</h3>\n<ul><li>“Why should Confirmation be received in the state of grace?”</li><li>“What will help you persevere when enthusiasm or strong feelings fade?”</li></ul>\n<h3>CHECK THE CENTRAL TRUTH</h3>\n<p><strong>How should an adult prepare? By instruction, sincere intention, prayer and proper disposition. In what state should it be received? The state of grace. Does formation end here? No. Catholic discipleship continues throughout life.</strong></p>\n<h3>USE THE BOOK’S QUESTIONS</h3>\n<p>Use THE ESSENTIALS in the matching conversation. Choose the questions that best reveal understanding; let the candidate answer in their own words before checking the book.</p>\n<h3>PRAY TOGETHER</h3>\n<p>Lord, complete the good work you have begun in me. Prepare me to receive the Gift of the Holy Spirit and keep me faithful in prayer, sacramental life and service. Amen.</p>\n<h3>THIS WEEK</h3>\n<p>Arrange Confession, confirm details with the parish and begin the simple rule of life chosen together. Agree the first meeting after Confirmation.</p>\n<h3>FOR THE MENTOR</h3>\n<p>Questions, disability, anxiety or years away from practice need discreet pastoral care. A date or wedding deadline must not replace readiness. The priest arranges the appropriate minister and faculties and judges readiness under Church and diocesan direction.</p>\n<h2>The journey at a glance</h2>\n<p>Use this to explain the pathway. The preparation book and the priest guide each adult’s actual circumstances; this is not a fixed timetable.</p>\n<h3>Check the pathway</h3>\n<p>Use Appendices A and I. Establish Baptism, Catholic status, previous Confirmation or chrismation and whether First Holy Communion has been received.</p>\n<h3>Listen and begin</h3>\n<p>Hear why the person wishes to receive Confirmation. Make Sunday Mass, daily prayer and parish belonging central from the start.</p>\n<h3>Learn and live</h3>\n<p>Use the twelve conversations at a suitable pace. Welcome questions, explain the central truths and choose a practical response each time.</p>\n<h3>Discern readiness</h3>\n<p>Use Appendix G with the priest. Look for sufficient understanding, sincere intention and proper disposition, with a real willingness to live Catholic faith.</p>\n<h3>Prepare and receive</h3>\n<p>Arrange private Confession, sponsor support and practical preparation. The bishop or a priest with the required faculty confirms using the approved rite.</p>\n<h3>Persevere in grace</h3>\n<p>Continue Mass, prayer, Confession, virtue, formation and service. Keep a further mentor meeting and a realistic rule of life.</p>\n<h3>A GIFT FOR THE WHOLE OF LIFE</h3>\n<p>Confirmation strengthens baptismal grace and gives a permanent sacramental character. It calls for continuing cooperation with the Holy Spirit in the Church’s life and mission.</p>\n<h2>The seven gifts for daily decisions</h2>\n<p>Use with Conversation 8 and Appendix C. The gifts make us ready to follow the Holy Spirit and perfect the virtues. They do not replace thought, study or sound advice.</p>\n<h3>Wisdom</h3>\n<p>Judges life in the light of God. Ask: “What choice leads me closer to God?”</p>\n<h3>Understanding</h3>\n<p>Penetrates the truths of faith more deeply. Ask: “What truth of faith should I understand better?”</p>\n<h3>Counsel</h3>\n<p>Helps practical judgement under the Spirit’s guidance. Ask: “What is right here, and whom should I ask?”</p>\n<h3>Fortitude</h3>\n<p>Gives steadfast courage to do and endure what is right. Ask: “What good am I avoiding because it is difficult?”</p>\n<h3>Knowledge</h3>\n<p>Sees created things truthfully and orders them to God. Ask: “Am I using people and things according to God’s purpose?”</p>\n<h3>Piety</h3>\n<p>Forms filial love for God and reverence for his family. Ask: “How can I pray and serve with a childlike heart?”</p>\n<h3>Fear of the Lord</h3>\n<p>Forms reverent awe and a loving desire not to offend God. Ask: “Do I honour God above approval, comfort or success?”</p>\n<h3>PRAY AND ACT</h3>\n<p>Come, Holy Spirit. Help me see what is true and good, seek wise counsel and carry out the right action with love. Amen.</p>\n<h2>Virtues fruits and gifts for service</h2>\n<p>Use with Conversation 9 and Appendix C. These are related ways of describing a life responding to grace; they are not competing badges of achievement.</p>\n<h3>The theological and cardinal virtues</h3>\n<p>Faith, hope and charity unite us to God. Prudence, justice, fortitude and temperance guide good judgement, right treatment of others, courage and self-mastery. Virtues are stable dispositions to do good.</p>\n<h3>The twelve traditional fruits</h3>\n<p>Charity and joy: Love of God and neighbour; spiritual gladness in God’s goodness.</p>\n<p>Peace and patience: Rightly ordered love;
